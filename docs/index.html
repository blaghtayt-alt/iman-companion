<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Iman Companion — an open-source Quran, Hadith, memorization, learning, and daily Islamic companion app.">
  <title>Iman Companion</title>
  <style>
    :root { color-scheme: light dark; --bg:#f7f8f5; --card:#ffffff; --text:#17211a; --muted:#5d6a61; --accent:#1f6f4a; --border:#dfe6e1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101411; --card:#171d19; --text:#f3f7f4; --muted:#aab7ae; --accent:#77d5a4; --border:#2b352f; } }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:820px; margin:0 auto; padding:64px 22px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:34px; box-shadow:0 12px 36px rgba(0,0,0,.05); }
    h1 { font-size:clamp(2.2rem,7vw,4rem); line-height:1.05; margin:0 0 14px; letter-spacing:-.04em; }
    p { color:var(--muted); }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:26px; }
    a.button { display:inline-block; padding:11px 16px; border-radius:12px; text-decoration:none; font-weight:650; border:1px solid var(--border); color:var(--text); }
    a.primary { background:var(--accent); color:#fff; border-color:transparent; }
    @media (prefers-color-scheme: dark) { a.primary { color:#08120c; } }
    footer { margin-top:24px; font-size:.9rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Iman Companion</h1>
      <p>An open-source Islamic companion app for Quran memorization and learning, Hadith, adhkar, reflection, and family-friendly learning tools.</p>
      <div class="actions">
        <a class="button primary" href="./privacy/">Privacy Policy</a>
        <a class="button" href="https://github.com/blaghtayt-alt/iman-companion">Source code on GitHub</a>
      </div>
    </section>
    <footer>Iman Companion · Open source</footer>
  </main>
</body>
</html>
