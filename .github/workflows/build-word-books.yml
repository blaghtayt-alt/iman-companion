name: Publish current multilingual books
on:
  workflow_dispatch:
    inputs:
      finalized_release:
        description: 'Optional draft release tag containing the finalized candidate ZIP'
        required: false
        type: string
      finalized_asset:
        description: 'Exact ZIP asset filename; supply all three finalized inputs together'
        required: false
        type: string
      finalized_sha256:
        description: 'SHA256 of the exact candidate ZIP from the owned Word review'
        required: false
        type: string
  repository_dispatch:
    types: [published-material]
  pull_request:
    paths: ['books/**', 'tools/**', 'tests/**', 'test-fixtures/**', 'materials/**', 'docs/listen/**', 'docs/books/**', '.github/workflows/build-word-books.yml']
  push:
    branches: [main]
    paths: ['books/**', 'tools/**', 'tests/**', 'materials/**', 'docs/listen/**', 'docs/books/**', '.github/workflows/build-word-books.yml']
permissions:
  contents: read
concurrency:
  group: current-books-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r books/requirements.txt
      - name: Validate source fidelity, references, QR matching and publication
        run: |
          python tests/test_download_tables.py
          python tests/test_download_display.py
          python tests/test_finalize_word_batch.py
          python books/test_bundle_tables.py
          python tests/test_book_render_validation.py
          python tests/test_book_fonts.py
          python tests/test_script_fallbacks.py
          python tests/test_numeric_reference_runs.py
          python tests/test_merge_public_books_styles.py
          python tests/test_merge_public_books_fonts.py
          python tests/test_merge_public_books_numbering.py
          python tests/test_renderer_pin.py
          python tests/test_toc_hyperlink_import.py
          python tests/test_word_page_breaks.py
          python tests/test_source_credits.py
          python tests/test_source_reference_preservation.py
          python books/test_script_fonts.py
          python books/test_word_layout_check.py
          python books/test_native_word_footer.py
          python books/test_script_font_slots.py
          python books/test_book_edition_scope.py
          python books/test_ar_ikhlas_adapter.py
          python books/test_preparation_lifecycle.py
          python books/test_source_publication_transaction.py
          node books/test_source_publication_connector.cjs
          python tests/test_article_adapter.py
          python tests/test_articles_export.py
          python tests/test_article_reference_fidelity.py
          python tests/test_seerah_adapter.py
          python tests/test_hadith_adapter.py
          python tests/test_translated_hadith_adapter.py
          python tests/test_current_hadith_first.py
          python tests/test_current_hadith_five.py
          python tests/test_current_reviewed_quran.py
          python tests/test_current_source_literal_render.py
          python books/test_book_content_coverage.py
          python tests/test_mixed_material_adapters.py
          python tests/test_finalize_prepared.py
          python tests/test_release_candidate_intake.py
          python tests/test_connector_candidate_transfer.py
          python tests/test_published_library.py
          python tests/test_material_audio.py
          python tests/test_automatic_publication.py
          python tests/test_edition_migration.py
          python tests/test_a4_audio_layout.py
          node tests/test_player.mjs
          python -m unittest discover -s books -p test_download_page.py
          python books/test_multicollection_publication.py
          python -m unittest discover -s books -p test_source_publisher.py
          python books/test_approved_reader_audio.py
          node books/test_download_page.mjs
  renderer-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the exact fixed renderer and its matching UNO bridge
        run: |
          python books/renderer_pin.py --install
          python -m pip install -r books/requirements.txt
      - name: Install pinned fonts and prove exact source citation wrapping
        run: |
          python books/install_assets.py --root .
          mkdir -p "$HOME/.local/share/fonts/iman-books"
          cp books/assets/fonts/*.ttf "$HOME/.local/share/fonts/iman-books/"
          cp books/assets/ornaments/*.ttf "$HOME/.local/share/fonts/iman-books/"
          fc-cache -f
          IMAN_BOOK_FONT_PROOF=1 python tests/test_numeric_reference_runs.py
          python tests/check_renderer_citations.py --root . --out "$RUNNER_TEMP/renderer-citations"
      - name: Prove complete LTR, RTL, Thai and Urdu preparation with live contents links
        run: python tests/check_renderer_contents.py --root . --out "$RUNNER_TEMP/renderer-contents"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-source-citation-renderer-regression-not-publication
          path: ${{ runner.temp }}/renderer-citations/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-book-contents-renderer-regression-not-publication
          path: ${{ runner.temp }}/renderer-contents/
          retention-days: 7
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BOOK_TAG: books-${{ github.run_id }}-${{ github.run_attempt }}
      FINALIZED_RELEASE: ${{ inputs.finalized_release || '' }}
      FINALIZED_ASSET: ${{ inputs.finalized_asset || '' }}
      FINALIZED_SHA256: ${{ inputs.finalized_sha256 || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate optional finalized candidate identity
        run: |
          python - <<'PY'
          import os,re
          release,asset,digest=[os.environ[k] for k in ('FINALIZED_RELEASE','FINALIZED_ASSET','FINALIZED_SHA256')]
          if any((release,asset,digest)):
              if not (re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,119}',release)
                      and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,159}\.zip',asset)
                      and re.fullmatch(r'[a-f0-9]{64}',digest)):
                  raise SystemExit('Provide a safe release tag, exact ZIP basename and lowercase SHA256 together.')
          PY
      - name: Install renderer and verified fonts and covers
        run: |
          python books/renderer_pin.py --install
          python -m pip install -r books/requirements.txt
          python books/install_assets.py --root .
          IMAN_BOOK_FONT_PROOF=1 python tests/test_numeric_reference_runs.py
          mkdir -p "$HOME/.local/share/fonts/iman-books"
          cp books/assets/fonts/*.ttf "$HOME/.local/share/fonts/iman-books/"
          cp books/assets/ornaments/*.ttf "$HOME/.local/share/fonts/iman-books/"
          fc-cache -f
          python tests/check_renderer_citations.py --root . --out "$RUNNER_TEMP/renderer-citations"
          command -v google-chrome || command -v chromium
      - name: Register exact reviewed source transactions and first collection scopes
        run: python books/material_publication_intake.py --root .
      - name: Publish exact audio assets and retire changed or withdrawn voices
        run: |
          python books/publish_material_audio.py --root .
          python books/sync_material_audio.py --root . --verify-remote
      - name: Generate current material books and insert every applicable QR
        run: |
          python books/multilingual_readiness.py --root . --out "$RUNNER_TEMP/current-books/language-readiness.json"
          python books/automatic_publication.py build --root . --out "$RUNNER_TEMP/current-books" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --tag "$BOOK_TAG"
      - name: Retrieve and verify exact owned-desktop candidate bundle
        id: finalized_transfer
        if: inputs.finalized_release != '' && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/finalized-input"
          gh release download "$FINALIZED_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$FINALIZED_ASSET" --dir "$RUNNER_TEMP/finalized-input"
          python books/release_candidate_intake.py extract --archive "$RUNNER_TEMP/finalized-input/$FINALIZED_ASSET" --sha256 "$FINALIZED_SHA256" --out "$RUNNER_TEMP/finalized-candidates"
      - name: Verify Word, visual acceptance and unchanged sources before release intake
        id: finalized_intake
        if: steps.finalized_transfer.outcome == 'success'
        continue-on-error: true
        run: |
          python books/automatic_publication.py finalize --root . --out "$RUNNER_TEMP/current-books" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --tag "$BOOK_TAG" --finalized-dir "$RUNNER_TEMP/finalized-candidates"
      - name: Intake finalized candidates transferred through the GitHub connector
        id: connector_intake
        continue-on-error: true
        run: |
          python books/connector_candidate_transfer.py process --root . --out "$RUNNER_TEMP/current-books" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --tag "$BOOK_TAG"
      - name: Record rejected candidate transfer while retaining independent books
        if: steps.finalized_transfer.outcome == 'failure' || steps.finalized_intake.outcome == 'failure' || steps.connector_intake.outcome == 'failure'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'current-books/build-report.json'
          report=json.loads(path.read_bytes())
          report.setdefault('finalizedIntakeErrors',[]).append({'error':'The finalized candidate transfer or envelope was rejected. See the transfer/intake step logs; existing verified pairs and independent preparations continue.'})
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          PY
      - name: Release verified pairs and regenerate the persistent download tables
        run: |
          python books/automatic_publication.py publish --root . --out "$RUNNER_TEMP/current-books" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --tag "$BOOK_TAG"
          python tools/update_download_display.py --root . --publish
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Preserve build and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-book-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-books/
          if-no-files-found: warn
          retention-days: 90
      - name: Report any individual scope that still needs repair
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'current-books/publication-report.json'
          result=json.loads(path.read_text(encoding='utf8'))
          print(json.dumps(result,ensure_ascii=False))
          lines=['## Current book publication','',f"Verified public pairs: {result['verifiedBookPairs']}. New pairs: {result['newPairs']}.",'']
          readiness=result.get('languageReadiness',{})
          if readiness:
              lines.extend([f"Automatic source intake covers {readiness['languageCount']} languages and {readiness['scopeCount']} language/category combinations. {readiness['automaticPreparationScopes']} currently have eligible source material.",''])
              waiting=[row for row in readiness.get('scopes',[]) if row['state']!='automatic-preparation-ready']
              if waiting:
                  lines.extend(['### Source material still required','', '| Language / collection | State | Reason |','| --- | --- | --- |'])
                  for row in waiting:
                      reason=str(row.get('reason','')).replace('|','\\|').replace('\n',' ')
                      lines.append(f"| {row['language']}/{row['collection']} | {row['state']} | {reason} |")
                  lines.append('')
          if result.get('preparedAwaitingReleaseQC'):lines.extend(['### Prepared editions awaiting release checks',''])
          for row in result.get('preparedAwaitingReleaseQC',[]):
              scope=row['language']+'/'+row['collection']
              checks=', '.join(check['check'] for check in row.get('pendingChecks',[]))
              lines.append(f"- **{scope}**: {row['includedUnits']} units; {row['state']}. Pending: {checks}.")
              artifact=row.get('artifact',{})
              if artifact.get('runURL'):lines.append(f"  [Preparation artifact run]({artifact['runURL']})")
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n',encoding='utf8')
          if result['failedScopes'] or result.get('downloadPage',{}).get('failedBundles') or result.get('approvedAudioIntakeErrors') or result.get('sourceTransactionErrors') or result.get('finalizedIntakeErrors'):raise SystemExit('Working book pairs were published; one or more other scopes or candidate transfers need repair. See publication-report.json.')
          PY
