name: Publish current multilingual books
on:
  workflow_dispatch:
  repository_dispatch:
    types: [published-material]
  pull_request:
    paths: ['books/**', 'tests/**', 'test-fixtures/**', 'materials/**', 'docs/listen/**', 'docs/books/**', '.github/workflows/build-word-books.yml']
  push:
    branches: [main]
    paths: ['books/**', 'tests/**', 'materials/**', 'docs/listen/**', 'docs/books/**', '.github/workflows/build-word-books.yml']
permissions:
  contents: read
concurrency:
  group: current-books-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r books/requirements.txt
      - name: Validate source fidelity, references, QR matching and publication
        run: |
          python tests/test_download_tables.py
          python books/test_bundle_tables.py
          python tests/test_book_render_validation.py
          python tests/test_book_fonts.py
          python books/test_script_fonts.py
          python books/test_word_layout_check.py
          python books/test_native_word_footer.py
          python books/test_script_font_slots.py
          python books/test_book_edition_scope.py
          python books/test_ar_ikhlas_adapter.py
          python tests/test_article_adapter.py
          python tests/test_articles_export.py
          python tests/test_seerah_adapter.py
          python tests/test_published_library.py
          python tests/test_material_audio.py
          python tests/test_automatic_publication.py
          node tests/test_player.mjs
          python -m unittest discover -s books -p test_download_page.py
          python -m unittest discover -s books -p test_source_publisher.py
          python books/test_approved_reader_audio.py
          node books/test_download_page.mjs
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      BOOK_TAG: books-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer and verified fonts and covers
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer python3-uno fontconfig
          python -m pip install -r books/requirements.txt
          python books/install_assets.py --root .
          mkdir -p "$HOME/.local/share/fonts/iman-books"
          cp books/assets/fonts/*.ttf "$HOME/.local/share/fonts/iman-books/"
          cp books/assets/ornaments/*.ttf "$HOME/.local/share/fonts/iman-books/"
          fc-cache -f
          command -v google-chrome || command -v chromium
      - name: Publish exact audio assets and retire changed or withdrawn voices
        run: |
          python books/publish_material_audio.py --root .
          python books/sync_material_audio.py --root . --verify-remote
      - name: Generate current material books and insert every applicable QR
        run: |
          python books/automatic_publication.py build --root . --out "$RUNNER_TEMP/current-books" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --tag "$BOOK_TAG"
      - name: Release verified pairs and regenerate the persistent download tables
        run: |
          python books/automatic_publication.py publish --root . --out "$RUNNER_TEMP/current-books" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --tag "$BOOK_TAG"
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Preserve build and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-book-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-books/
          if-no-files-found: warn
          retention-days: 7
      - name: Report any individual scope that still needs repair
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'current-books/publication-report.json'
          result=json.loads(path.read_text(encoding='utf8'))
          print(json.dumps(result,ensure_ascii=False))
          if result['failedScopes'] or result.get('downloadPage',{}).get('failedBundles') or result.get('approvedAudioIntakeErrors'):raise SystemExit('Working book pairs were published; one or more other scopes need repair. See publication-report.json.')
          PY
