name: Build reviewed book candidates
on:
  workflow_dispatch:
  pull_request:
    paths: ["books/**", "tests/**", "test-fixtures/**", "materials/**", "docs/listen/**", ".github/workflows/build-word-books.yml"]
  push:
    branches: [main]
    paths: ["books/**", "materials/**", "docs/listen/**", ".github/workflows/build-word-books.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r books/requirements.txt
      - run: python tests/test_download_tables.py
      - run: python tests/test_book_render_validation.py
      - run: python tests/test_book_fonts.py
      - run: python tests/test_article_adapter.py
      - run: python tests/test_articles_export.py
      - run: python tests/test_published_library.py
      - run: python tests/test_material_audio.py
      - run: node tests/test_player.mjs
      - name: Select only declared reviewed books
        id: scopes
        run: |
          python - <<'PY'
          import json,os
          data=json.load(open('books/reviewed-books.json',encoding='utf8'))
          assert data['schema']=='iman-reviewed-books-v1'
          rows=[{'language':x['language'],'collection':x['collection']} for x in data['books'] if x.get('state')=='reviewed-current' and x.get('automaticBuild') is True]
          assert rows and len({(x['language'],x['collection']) for x in rows})==len(rows)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out:out.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY
    outputs:
      matrix: ${{ steps.scopes.outputs.matrix }}
  build-reviewed:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer python3-uno fontconfig
          python -m pip install -r books/requirements.txt
      - name: Install verified fonts and covers
        run: |
          python books/install_assets.py --root .
          mkdir -p "$HOME/.local/share/fonts/iman-books"
          cp books/assets/fonts/*.ttf "$HOME/.local/share/fonts/iman-books/"
          fc-cache -f
      - name: Verify audio and generate reviewed source units
        env:
          BOOK_LANGUAGE: ${{ matrix.language }}
          BOOK_COLLECTION: ${{ matrix.collection }}
        run: |
          python books/sync_material_audio.py --root . --verify-remote
          python books/index_units.py --root . --commit "$GITHUB_SHA" --language "$BOOK_LANGUAGE" --collection "$BOOK_COLLECTION"
          python books/build_books.py --root . --out "$RUNNER_TEMP/reviewed-book" --commit "$GITHUB_SHA"
      - name: Render and check the candidate
        run: |
          /usr/bin/python3 books/render_uno.py --folder "$RUNNER_TEMP/reviewed-book"
          python books/native_pagination.py --root . --folder "$RUNNER_TEMP/reviewed-book"
          /usr/bin/python3 books/render_uno.py --folder "$RUNNER_TEMP/reviewed-book" --keep-contents
          python books/restore_book_fonts.py --root . --folder "$RUNNER_TEMP/reviewed-book"
          python books/check_outputs.py --folder "$RUNNER_TEMP/reviewed-book" --root . --tag book-candidate --repo "$GITHUB_REPOSITORY"
          python books/published_library.py --root . capture --folder "$RUNNER_TEMP/reviewed-book"
      - name: Preserve the candidate and diagnostics for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-book-candidate-${{ matrix.language }}-${{ matrix.collection }}
          path: ${{ runner.temp }}/reviewed-book/
          if-no-files-found: warn
          retention-days: 7
# These artifacts are explicitly review-only. Public releases and download links
# remain disabled until each rendered book and any direct-player dependencies pass review.
