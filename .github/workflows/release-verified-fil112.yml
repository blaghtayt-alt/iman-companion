name: Publish verified Filipino Quran reflection
on:
  pull_request:
    paths: ['.github/workflows/release-verified-fil112.yml', '.github/scripts/publish_verified_fil112.py']
  push:
    branches: [main]
    paths: ['.github/workflows/release-verified-fil112.yml']
permissions:
  contents: read
concurrency:
  group: current-books-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: verified-fil112-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f786651bbe036006293695580cc37280efcc8e9e
          path: candidate-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checked assets and dependencies
        run: |
          python -m pip install -r books/requirements.txt
          python books/install_assets.py --root .
      - name: Check the exact source, files and pagination evidence
        run: |
          python .github/scripts/publish_verified_fil112.py --candidate candidate-source/book-review-candidate/fil112 --out "$RUNNER_TEMP/verified-fil112"
      - name: Publish verified files and update all download tables together
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python .github/scripts/publish_verified_fil112.py --candidate candidate-source/book-review-candidate/fil112 --out "$RUNNER_TEMP/verified-fil112" --publish --commit "$GITHUB_SHA" --tag "$RELEASE_TAG"
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Preserve verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-fil112-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-fil112/
          if-no-files-found: ignore
          retention-days: 7
