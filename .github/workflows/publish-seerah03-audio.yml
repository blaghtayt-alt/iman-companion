name: Publish verified Seerah 03 audio
on:
  push:
    branches:
      - delivery/seerah03-audio-0d6552c1-20261106
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the approved package
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/blaghtayt-alt/iman-companion/${COMMIT_SHA}/delivery/seerah03/iman-ar-seerah-03-0d6552c1fd8758c65e14.zip" --output "iman-ar-seerah-03-0d6552c1fd8758c65e14.zip"
          echo 'dabc8e5da0f7765aefe980b0f49391675f6d184b800c3c3275c04e6581f28185  iman-ar-seerah-03-0d6552c1fd8758c65e14.zip' | sha256sum --check
      - name: Add the package to the existing language-pack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload language-packs-2026-10-24-alp-pages-10-19 "iman-ar-seerah-03-0d6552c1fd8758c65e14.zip" --repo blaghtayt-alt/iman-companion
