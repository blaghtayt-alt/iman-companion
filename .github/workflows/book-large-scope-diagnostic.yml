name: Diagnostic only - large current book scopes
on:
  pull_request:
    paths:
      - '.github/diagnostics/book_scope_probe.py'
      - '.github/workflows/book-large-scope-diagnostic.yml'
permissions:
  contents: read
jobs:
  scope-probe:
    name: Diagnostic ${{ matrix.language }} ${{ matrix.collection }} - not publication
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - language: bn
            collection: tadabbur-extended
          - language: uz
            collection: hadith
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - name: Verify isolated diagnostic ancestry and paths
        run: |
          git merge-base --is-ancestor e4bc14bf16c071fd977069de1ca367af92f07285 HEAD
          python - <<'PY'
          import subprocess
          allowed=set(['.github/diagnostics/book_scope_probe.py', '.github/workflows/book-large-scope-diagnostic.yml', 'books/AUTOMATIC-PREPARATION.md', 'books/build_books.py', 'books/restore_book_fonts.py', 'books/restore_source_hyperlinks.py', 'tests/test_current_source_literal_render.py', 'tests/test_footnote_marker_layout.py'])
          changed=set(subprocess.check_output(['git','diff','--name-only','e4bc14bf16c071fd977069de1ca367af92f07285','HEAD'],text=True).splitlines())
          assert changed == allowed, changed
          assert subprocess.check_output(["git","hash-object","books/render_uno.py"],text=True).strip() == "deb16876fb1e7c27edd54c4256f5b7421a1485ba"
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged pinned renderer and verified fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python books/renderer_pin.py --install
          python -m pip install -r books/requirements.txt
          python books/install_assets.py --root .
          mkdir -p "$HOME/.local/share/fonts/iman-books"
          cp books/assets/fonts/*.ttf "$HOME/.local/share/fonts/iman-books/"
          cp books/assets/ornaments/*.ttf "$HOME/.local/share/fonts/iman-books/"
          fc-cache -f
      - name: Trace candidate production preparation with bounded children
        env:
          PROBE_LANGUAGE: ${{ matrix.language }}
          PROBE_COLLECTION: ${{ matrix.collection }}
        run: |
          python -u .github/diagnostics/book_scope_probe.py --root . --language "$PROBE_LANGUAGE" --collection "$PROBE_COLLECTION" --out "$RUNNER_TEMP/book-scope-diagnostic-$PROBE_LANGUAGE-$PROBE_COLLECTION"
      - name: Preserve diagnostic partial files and stage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOT-PUBLICATION-large-scope-${{ matrix.language }}-${{ matrix.collection }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/book-scope-diagnostic-${{ matrix.language }}-${{ matrix.collection }}/
          if-no-files-found: warn
          retention-days: 7
