name: Retained public pair diagnostic (not publication)

on:
  pull_request:
    paths:
      - '.github/diagnostics/retained_pair_probe.py'
      - '.github/workflows/book-large-scope-diagnostic.yml'
      - 'books/download_page.py'
      - 'books/install_assets.py'

permissions:
  contents: read

concurrency:
  group: retained-pair-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retained-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact reviewed production tree
        env:
          CANDIDATE_TREE: 4e1b664c8e641d744dca82dcb25dc1ad4ae0ba0f
        run: |
          git diff --exit-code "$CANDIDATE_TREE" HEAD -- . ':!.github/diagnostics/retained_pair_probe.py' ':!.github/workflows/book-large-scope-diagnostic.yml'
      - name: Install existing requirements
        run: python -m pip install -r books/requirements.txt
      - name: Prove exact retained PDF and DOCX transport, cache and rejection checks
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/retained-pair-diagnostic"
          python .github/diagnostics/retained_pair_probe.py --root . --out "$RUNNER_TEMP/retained-pair-diagnostic" 2>&1 | tee "$RUNNER_TEMP/retained-pair-diagnostic/probe.log"
      - name: Prove diagnostic did not change tracked production files
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOT-PUBLICATION-retained-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/retained-pair-diagnostic/transport-report.json
            ${{ runner.temp }}/retained-pair-diagnostic/probe.log
          if-no-files-found: warn
          retention-days: 7
