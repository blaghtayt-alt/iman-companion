name: Inspect Arabic book layout preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer python3-uno fontconfig
          python -m pip install -r books/requirements.txt
      - name: Load the pinned, approved design assets
        run: |
          python books/install_assets.py --root .
          mkdir -p "$HOME/.local/share/fonts/iman-books"
          cp books/assets/fonts/*.ttf "$HOME/.local/share/fonts/iman-books/"
          cp books/assets/ornaments/*.ttf "$HOME/.local/share/fonts/iman-books/"
          fc-cache -f
      - name: Prepare an isolated two-lesson preview
        run: |
          mkdir -p "$RUNNER_TEMP/iman-book-preview"
          cp -a books "$RUNNER_TEMP/iman-book-preview/"
          cp -a test-fixtures/extended/books/units/current/ar "$RUNNER_TEMP/iman-book-preview/books/units/current/"
          cp -a test-fixtures/extended/materials "$RUNNER_TEMP/iman-book-preview/"
          python books/index_units.py --root "$RUNNER_TEMP/iman-book-preview" --commit "$GITHUB_SHA"
          python books/build_books.py --root "$RUNNER_TEMP/iman-book-preview" --out "$RUNNER_TEMP/iman-book-preview/dist" --commit "$GITHUB_SHA"
      - name: Render and refresh on Linux
        run: |
          /usr/bin/python3 books/render_uno.py --folder "$RUNNER_TEMP/iman-book-preview/dist"
          python books/native_pagination.py --root "$RUNNER_TEMP/iman-book-preview" --folder "$RUNNER_TEMP/iman-book-preview/dist"
          /usr/bin/python3 books/render_uno.py --folder "$RUNNER_TEMP/iman-book-preview/dist" --keep-contents
          python books/restore_book_fonts.py --root "$RUNNER_TEMP/iman-book-preview" --folder "$RUNNER_TEMP/iman-book-preview/dist"
          python books/normalize_word_page_breaks.py --folder "$RUNNER_TEMP/iman-book-preview/dist"
          python books/check_outputs.py --folder "$RUNNER_TEMP/iman-book-preview/dist" --tag internal-preview --repo "$GITHUB_REPOSITORY"
          python -c 'import json,os; d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"iman-book-preview/dist/index.json"))); assert d["previewOnly"] is True'
      - uses: actions/upload-artifact@v4
        with:
          name: internal-two-lesson-preview-not-a-complete-book
          path: ${{ runner.temp }}/iman-book-preview/dist/
          retention-days: 7
