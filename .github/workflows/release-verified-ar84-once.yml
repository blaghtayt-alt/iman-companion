name: Publish the verified Arabic 84-section book once
on:
  push:
    branches: [main]
    paths: ['.github/release-once/ar84-20261107.go']
permissions:
  contents: write
  pages: write
concurrency:
  group: one-time-ar84-book-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'blaghtayt-alt/iman-companion'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      AR84_CANDIDATE: ${{ github.workspace }}/ar84-candidate/book-review-candidate/ar84
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 10bd891fed53b01ca12ab77c3dc703e6e2d7f7e8
          path: ar84-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned book dependencies and assets
        run: |
          python -m pip install -r books/requirements.txt
          python books/install_assets.py --root .
      - name: Publish the exact checked pair and preserve existing books
        run: python .github/scripts/publish_verified_ar84_once.py
      - name: Refresh the existing download site
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
