ng nguyên bản là áo giáp rộng, che kín thân người, để không phải phía này được bảo vệ còn phía khác bị hở, như khi chỉ cầm một tấm chắn trước mặt. Điểm khác biệt ấy giúp hiểu ý nghĩa về sự bao phủ đầy đủ: sự bảo vệ phải đến đúng nơi cần bảo vệ.\n\nTiếp đó là mệnh lệnh: «ráp các khoen sắt lại cho thật cân bằng» (34:11). Từ chỉ việc nối các khoen trong tiếng Ả Rập mang ý kết nối từng phần theo một trật tự liên tục; người ta cũng dùng từ ấy cho lời kể có các phần nối tiếp, ăn khớp. Ở đây là nối các khoen áo giáp thật chắc và tính đúng kích thước phần liên kết, để mối nối không sai lệch hay bung hở khi cử động. Cũng như vải được nối bằng đường may, nối sắt đòi hỏi sự khéo léo để sản phẩm tiếp tục làm được nhiệm vụ của nó.\n\nViệc lời mặc khải nêu chi tiết ấy cho thấy làm việc đến nơi đến chốn là một yêu cầu của lòng biết ơn. Không thể bào chữa cho sản phẩm kém chất lượng bằng lý do đó là việc từ thiện hoặc làm vì Allah. Thờ phượng, kêu gọi, phục vụ mọi người và chuẩn bị thứ bảo vệ họ đều xứng đáng được người bề tôi thực hiện thật tốt. Về sự chuẩn bị, ta đọc toàn câu trong ngữ cảnh: «Các ngươi (những người có đức tin) hãy chuẩn bị chống lại chúng bằng bất cứ thứ gì có thể, từ sức mạnh và các con chiến mã, để cho kẻ thù của Allah và kẻ thù của các ngươi cũng như những kẻ khác ngoài chúng mà các ngươi không biết nhưng Allah thì biết rõ về chúng kinh hồn khiếp vía. Và bất cứ thứ gì các ngươi đã chi dùng cho con đường chính nghĩa của Allah đều sẽ được Ngài bù đắp lại cho các ngươi, và tất nhiên các ngươi sẽ không bị đối xử bất công.» (8:60).\n\nĐằng sau đó là trách nhiệm gắn với mỗi ân huệ. Người được khả năng dạy học, tài ăn nói, tiền bạc để chi dùng hay khả năng ghi nhớ và làm việc không nhận một món quà tách rời điều mình sẽ bị hỏi đến. Đừng tưởng mình tự ý ban ơn mà Đấng Ban Tặng không có quyền gì trong đó. Dawood được ban khả năng và được giao làm việc. Tương tự, Allah phán với Musa: «Và TA đã chọn Ngươi. Vì vậy, Ngươi hãy lắng nghe điều mặc khải.» (20:13); và: «quả thật, TA đã chọn Ngươi (và ban hồng phúc cho Ngươi) hơn ai khác trong nhân loại qua Bức Thông Điệp và Lời Phán của TA. Cho nên, Ngươi hãy nhận lấy điều mà TA đã ban cho Ngươi và Ngươi hãy là người biết tri ân.» (7:144). Được chọn đi cùng trách nhiệm; được ban tặng mời gọi hành động và lòng biết ơn.\n\nTrong nguyên bản tiếng Ả Rập của câu 34:11, lời nói chuyển từ mệnh lệnh số ít về việc chế tạo và tính cho chuẩn sang mệnh lệnh số nhiều về việc làm điều thiện. Bản dịch đã dẫn nhắc đến Dawood cùng con cháu của Người. Một điều có thể suy ngẫm là nghề có ích không nên bị giữ trong một người. Người ấy cần dạy cho người gánh vác sau mình, để kỹ năng có người tiếp nối khi người đầu tiên vắng mặt. Điều này đúng với tri thức tôn giáo, nghề nghiệp và công việc chung. Bác sĩ, kỹ sư, giáo viên hay người quản lý làm tốt không chỉ tự hoàn thành phần mình, mà còn đào tạo người học hỏi và tiếp tục trách nhiệm. Một người có thể bệnh, vắng mặt hoặc qua đời; không thể để toàn bộ điều tốt phụ thuộc vào việc họ còn hiện diện.\n\nLời nhắc sau cũng đi vào ý nghĩa ấy: «Muhammad chỉ là một sứ giả. Các sứ giả đã qua đi trước ông. \r\nNếu ông chết, hoặc bị giết, các ngươi sẽ quay lưng lại gót chân của \r\nmình sao?» (3:144). Trách nhiệm không chấm dứt cùng sự ra đi của người dẫn dắt; đừng vì thế quay lưng với đức tin. Mệnh lệnh trong câu 34:11 không chỉ dừng ở làm việc, mà còn đòi hỏi việc thiện. Giữ được một nghề chưa đủ nếu thế hệ sau dùng nó để phá hoại hay lấn át người khác. Cùng một công cụ có thể bảo vệ hoặc gây bất công, nên phải theo dõi nó được dùng vào đâu. Tài ăn nói có thể dạy dỗ, khuyên nhủ, cũng có thể dẫn lạc và làm hỏng người khác.\n\nVì thế, công việc gắn với ý thức rằng Allah nhìn thấy: «Quả thật, TA luôn thấy rõ những điều các ngươi làm.» (34:11). Điều này sửa lại ảo tưởng rằng mọi thứ được ban đều chứng minh Allah hài lòng với mọi tình trạng của người nhận. Ân huệ là một cuộc thử thách. Musa nói với dân mình: «Có lẽ, Thượng Đế của các người sẽ tiêu diệt kẻ thù của các người và cho các người nối nghiệp họ trên vùng đất này, và Ngài muốn xem các người sẽ hành động như thế nào (tri ân hay vong ơn Ngài).» (7:129). Chuyển từ thế yếu sang có điều kiện vững vàng không phải kết thúc thử thách, mà chuyển sang một nơi thử thách khác. Sau khi được cứu và vượt biển, một số người con cháu Israel còn đòi: «Này Musa, xin Người hãy tạo cho chúng tôi một thần linh (để chúng tôi có thần linh) giống như họ.» (7:138). Vượt qua một thử thách hoặc sở hữu công cụ hữu ích không thay thế được việc duy trì đức tin và luôn nhớ Allah quan sát cách mình sử dụng ân huệ.\n\nCâu 12\n\n«Và Sulayman (con trai của Dawood), (TA đã ban cho Y khả năng chế ngự) luồng gió; luồng gió lướt đi trong một buổi sáng (nhanh bằng thời gian di chuyển) của một tháng và trong một buổi chiều (nhanh bằng thời gian di chuyển) của một tháng. TA đã ban cho Y một dòng suối đồng thau; và trong loài Jinn có những tên phục dịch cho Y theo phép của Thượng Đế của Y; và nếu tên Jinn nào cãi lệnh TA thì TA sẽ bắt nó nếm lấy hình phạt của Lửa ngọn cháy bùng.» (34:12)\n\nNhững điều được điều khiển phục vụ Sulayman có nhiều mặt: gió, nguồn đồng và những Jinn làm việc trước mặt Người. Buổi sớm, gió vượt quãng đường thường đi mất một tháng; buổi chiều cũng vượt quãng đường một tháng. Trong một ngày di chuyển, Sulayman đi được quãng đường người khác cần hai tháng. Nguồn được làm cho tuôn chảy là đồng Allah cho chảy ra cho Người. Rồi có những Jinn bị buộc làm việc theo phép của Thượng Đế.\n\nQuyền năng ấy không do Sulayman độc lập với Đấng Chủ Tể, cũng không phải Jinn muốn ban vương quyền cho ai thì ban. Câu Kinh xác định: «theo phép của Thượng Đế của Y» (34:12), và cho biết kẻ trái lệnh sẽ chịu hình phạt.\n\nMột cách liên hệ ân huệ này với một đoạn khác trong câu chuyện Sulayman dựa trên cách giải thích về những con ngựa khiến Người bận đến quên tưởng nhớ Allah. Trong ngữ cảnh: «“Hãy dắt chúng (đàn ngựa) trở lại cho ta”, rồi (Sulayman) lấy kiếm đánh vào chân và cổ của chúng.» (38:33). Có cách giải thích hành động ấy là giết ngựa; và có ý kiến rằng Allah bù lại cho Người bằng gió, thứ nhanh hơn ngựa. (Tafsir Ibn Kathir, giải câu 38:33.) Ibn Kathir cũng ghi cách giải thích khác về việc vuốt chân và cổ ngựa; ở đây, lời giảng đang bàn theo cách hiểu thứ nhất.\n\nCách liên hệ ấy nhắc rằng phương tiện không được làm người sử dụng quên Đấng ban phương tiện. Công việc giúp lẽ phải không thể đứng vững nếu nó cắt người làm khỏi việc tưởng nhớ Allah. Câu chuyện ‘Ali cho một hình ảnh thực tế. Trong bản thuật do ‘Ali truyền lại, lời dạy của Thiên Sứ ﷺ trước hết hướng đến Fatimah: trước khi ngủ tôn vinh Allah ba mươi ba lần, ca ngợi Ngài ba mươi ba lần và tuyên xưng sự vĩ đại của Ngài ba mươi bốn lần. Ông duy trì việc tưởng nhớ ấy, đến mức nói rằng mình không bỏ nó ngay cả đêm Siffin. (Al-Bukhari 5362.) Hoàn cảnh căng thẳng, việc bận rộn trong trận chiến và thử thách của nó không xóa đi điều ông đã nhận từ sự hướng dẫn của Thiên Sứ ﷺ.\n\nSự nới nhẹ ở cuối chương Al-Muzzammil nhắc đến bệnh tật, đi xa và chiến đấu: «Ngài biết trong các ngươi có một số bệnh tật, một số khác đi tìm kiếm thiên lộc của Allah xa xôi trên trái đất; và một số khác đi chinh chiến cho Chính Nghĩa của Allah. Vì vậy, các ngươi hãy đọc phần nào mà các ngươi thấy dễ dàng đối với các ngươi.» (73:20). Có cách giải thích việc đọc ở đây là đọc trong lễ nguyện đêm. Người có lý do khó khăn vẫn giữ mối liên hệ bằng phần mình làm được, không biến khó nhọc thành cánh cửa bỏ hết việc thờ phượng. Khi một việc làm Thiên Sứ ﷺ lo buồn, Người hành lễ. (Abu Dawud 1319; Al-Albani xếp bản này là tốt.) Lễ nguyện là nơi cầu sự trợ giúp khi công việc nặng nề và hoàn cảnh khó khăn.\n\nMột điều có thể suy ngẫm trong thứ tự các ân huệ là sắt, dùng làm áo giáp, được nhắc trước đồng, vật liệu có ích cho xây dựng. Bảo vệ cộng đồng giữ cho cộng đồng khả năng xây dựng, đi lại và sống ổn định. Mở rộng sinh kế không đem lại ích lợi nếu người ta bỏ mặc điều đẩy lùi sự xâm hại. Hadith nhắc việc mải mê mua bán, trồng trọt mà bỏ nhiệm vụ chiến đấu vì Allah, rồi sự thấp hèn kéo theo cho đến khi con người trở về với tôn giáo, giúp thấy ý nghĩa ấy. (Abu Dawud 3462; Al-Albani xếp bản này là xác thực.) Tìm sinh kế và xây dựng đời sống không được biến thành cớ bỏ những bổn phận khác, cũng như công việc chung không là cớ bỏ việc thờ phượng.\n\nPhần cuối câu Kinh đưa mọi sự điều khiển trở về mệnh lệnh Allah. Jinn nào lệch khỏi lệnh Ngài sẽ nếm hình phạt lửa cháy. Có cách hiểu đây là lời đe dọa hình phạt ở Đời Sau; cũng có cách hiểu là hình phạt được giáng ngay ở đời này vì trái lệnh. Sức mạnh được điều khiển không được tự do khỏi trách nhiệm, và tài năng không gỡ cho người sở hữu trách nhiệm về cách sử dụng.\n\nCâu 13\n\n«Chúng (các tên Jinn hầu dịch cho Sulayman) làm ra cho Y những vật mà Y muốn, từ các cung điện, các hình tượng, những chiếc chén khổng lồ như những bể nước và những chiếc chảo nấu cố định một chỗ. Hỡi dòng dõi của Dawood, các ngươi hãy làm việc với lòng tri ân (TA). Tuy nhiên, chỉ một số ít bầy tôi của TA tỏ lòng biết ơn (TA).» (34:13)\n\nTheo cách giải thích của lời giảng, khả năng được điều khiển phục vụ Sulayman đã được dùng vào những nơi thờ phượng, các hình tượng, những tô lớn như bể nước và những nồi đặt cố định. Ân huệ không chỉ dừng ở quyền lực ngày càng rộng.\n\nTrong câu 34:13, bản dịch được chọn dùng cụm «các cung điện» (34:13). Lời giảng giải thích từ tiếng Ả Rập tương ứng là những nơi thờ phượng; đó là một cách giải thích được nêu riêng với cách dịch vừa dẫn. Khi nói đến từ này, lời giảng cũng nhắc mihrab, tức hốc tại chỗ người dẫn lễ thường thấy ngày nay, nhưng không giới hạn ý nghĩa của từ vào hình thức ấy. Một người cũng có thể có chỗ thờ phượng trong nhà mình. Có cách giải thích rằng tên gọi ấy liên hệ với việc người thờ phượng chống lại Shaytan ở đó. Đặt nơi thờ phượng trước tiên gợi điều cần được ưu tiên khi xây dựng cộng đồng. Thiên Sứ ﷺ đã ra lệnh xây thánh đường Hồi giáo sau khi đến Madinah, để mọi người có nơi cùng tưởng nhớ Thượng Đế và tiếp nhận sự hướng dẫn của Ngài. (Al-Bukhari 428.)\n\nCác hình tượng được nhắc đến thuộc những gì được cho phép trong giáo luật thời Sulayman. Không chuyển phán quyết của giáo luật ấy sang giáo luật của Thiên Sứ Muhammad ﷺ, trong đó chúng bị cấm. (Tafsir Al-Qurtubi, giải câu 34:13.) Những tô lớn được ví với các bể chứa nước lớn. Cảnh tượng cho thấy kích thước và số lượng dồi dào; cùng với đó là những nồi lớn, nặng, đặt cố định, không di chuyển khỏi chỗ. Điều này làm nổi bật việc dùng sự dư dả để cho người khác ăn và giúp ích cho họ, thay vì chỉ khoe những gì mình có.\n\nMột cách áp dụng là người có điều kiện mở rộng những cánh cửa phục vụ chung, từ thức ăn, nước uống đến giáo dục, và quan tâm đến mức nhu cầu. Giúp một gia đình có khoản chi lớn bằng một phần rất nhỏ có thể chưa giải quyết được khó khăn của họ. Điều cần là cố đưa lợi ích đến mức đáp ứng nhu cầu trong khả năng mình. Không phải món ít ỏi của người không có khả năng bị gạt bỏ; ở đây đang nói đến cách sử dụng thật tốt sự rộng rãi mình được ban.\n\nÝ định chân thành là nền tảng. Người ta cho ăn để tìm sự hài lòng của Allah, dù đối tượng là người không phải Muslim hay một con vật. Giúp ích tạo vật không tách khỏi việc tìm sự hài lòng của Đấng Tạo Hóa. Những điều phi thường trong vương quyền Sulayman cũng đặt câu hỏi cho người có tri thức và nghề nghiệp: nếu phương tiện sử dụng sắt, đồng trở nên dễ dàng và khả năng xây dựng tăng lên, họ dùng chúng vào đâu? Ân huệ là thử thách về cách dùng, không phải giấy chứng nhận tốt lành chỉ vì mình sở hữu nó.\n\nRồi đến trách nhiệm bao quát: «Hỡi dòng dõi của Dawood, các ngươi hãy làm việc với lòng tri ân (TA).» (34:13). Biết ơn là hành động thể hiện việc nhận biết ân đức của Đấng Ban Ơn. Người trong gia đình cùng chịu trách nhiệm, như họ cùng nhận các mặt của sự ban tặng. Lời «chỉ một số ít bầy tôi của TA tỏ lòng biết ơn (TA)» (34:13) đánh thức người có ân huệ khỏi tự mãn vì nhiều tài sản hoặc vì nhiều người đi cùng đường. Đối diện tấm gương ấy sẽ là một dân tộc được bảo: «Hãy ăn bổng lộc của Thượng Đế của các ngươi và biết ơn Ngài» (34:15), nhưng lại đáp bằng sự quay lưng.\n\nCòn lời «Chúng (các tên Jinn hầu dịch cho Sulayman) làm ra cho Y những vật mà Y muốn» (34:13) chuẩn bị cho việc hiểu kết thúc câu chuyện. Những Jinn ấy làm việc vì bị điều khiển. Khi cái chết của Sulayman lộ ra, ta thấy họ đã chờ để thoát khỏi công việc. Từ đó, sự khác nhau giữa sức mạnh mệnh lệnh làm thân thể chuyển động và sức mạnh đức tin khiến người ta tự gánh vác công việc sẽ được làm rõ.\n\nCâu 14\n\n«Nhưng khi TA quyết định cho y (Sulayman) chết, chẳng có gì làm cho chúng (Jinn) thấy cái chết của y ngoại trừ một loại sâu đất đã gặm mòn chiếc gậy của y. Bởi thế, khi y ngã xuống, loài Jinn mới vỡ lẽ rằng nếu biết được điều vô hình thì chúng đâu có phải ở lại lâu trong sự trừng phạt nhục nhã đó.» (34:14)\n\nNhững cảnh tạo vật được điều khiển kết thúc bằng một cảnh cho thấy giới hạn của khả năng được ban. Allah định cái chết cho Sulayman. Người vẫn tựa vào gậy, còn Jinn tiếp tục làm việc mà không biết Người đã chết. Đến khi sinh vật trong đất ăn cây gậy, Người mới ngã xuống. Sulayman được Allah cho gió và Jinn phục vụ mình, nhưng Người vẫn không nằm ngoài định mệnh cái chết. Những Jinn khiến con người thấy sức mạnh của chúng lại không biết điều vô hình ngay bên cạnh mình.\n\nMột tạo vật nhỏ, qua việc ăn cây gậy, phơi bày điều sức mạnh của chúng không nhận ra. Nếu biết Người đã chết, chúng đã không tiếp tục công việc mà chúng coi là hình phạt nhục nhã. Để thấy ngữ cảnh lời giảng, ta đọc toàn câu: «Nhưng khi TA quyết định cho y (Sulayman) chết, chẳng có gì làm cho chúng (Jinn) thấy cái chết của y ngoại trừ một loại sâu đất đã gặm mòn chiếc gậy của y. Bởi thế, khi y ngã xuống, loài Jinn mới vỡ lẽ rằng nếu biết được điều vô hình thì chúng đâu có phải ở lại lâu trong sự trừng phạt nhục nhã đó.» (34:14). Có cách hiểu rằng sự thật về Jinn được phơi bày: chúng không biết điều vô hình. Cũng có cách hiểu rằng điều đó trở nên rõ với những kẻ đi theo Jinn, để họ biết các thủ lĩnh từng làm họ tưởng là biết điều vô hình thực ra không biết. (Ibn ‘Atiyyah, Al-Muharrar al-Wajiz, giải câu 34:14.) Đừng vì thấy nhiều hoạt động hay việc lạ mà gán cho chúng tri thức Allah chưa ban.\n\nKết thúc câu chuyện nối với phần đầu chương. Toàn bộ quyền sở hữu thuộc về Allah: Ngài điều khiển núi, chim, sắt, đồng, gió và Jinn theo ý Ngài. Toàn bộ tri thức cũng thuộc về Ngài. Những đối tượng được điều khiển không nắm được điều khuất khỏi mình, trừ điều Ngài cho chúng biết.\n\nMột điều người làm việc vì tôn giáo của Allah cần suy ngẫm là bản chất của những người cùng làm với mình. Trong thời yếu thế, họ có thể tưởng rằng mình chỉ cần tiền và người theo, sẵn sàng làm mọi điều mình muốn, không cần ý kiến hay hiểu biết, hễ ra lệnh là chuyển động. Nhưng công việc của Jinn bị điều khiển cho thấy giới hạn của sự phục tùng ấy. Nếu người làm chỉ bị ép buộc, họ chờ người mình sợ không còn để thoát khỏi việc. Còn sứ mạng tiếp tục sau cái chết của người mang nó cần những con người tin và biết vì sao mình cống hiến.\n\nCuối cuộc đời Thiên Sứ ﷺ cho thấy một hình ảnh khác. Sáng thứ Hai, Người vén rèm nhà mình; các Sahabah đang xếp hàng hành lễ Fajr, Abu Bakr dẫn lễ. Họ gần như bị xao động vì quá vui khi nhìn thấy Người, nhưng Người ra dấu hãy hoàn thành lễ nguyện. (Al-Bukhari 1205.) Hàng ngũ vẫn được giữ, việc thờ phượng vẫn tiếp tục; sự tập hợp của họ không phụ thuộc vào việc Người trực tiếp điều khiển từng cử động. Trong sự hướng dẫn của Người có lời: «Ai dâng lễ nguyện Salah Subh thì y sẽ được sự giao ước bảo vệ của Allah» (Muslim 657). Cảnh ấy kết hợp sự ngay ngắn trong lễ nguyện với mối liên hệ của họ với Thượng Đế.\n\nSau khi Người qua đời, họ tiếp tục gánh trách nhiệm. Trong cuộc trao đổi với Umar về những người giữ lại Zakah, Abu Bakr nói: «Tôi xin thề trước Allah, nếu họ không nộp cho tôi dù chỉ một sợi dây buộc lạc đà mà trước kia họ vẫn nộp cho Thiên Sứ của Allah ﷺ, tôi nhất định sẽ chiến đấu với họ vì họ giữ lại sợi dây ấy.» (Abu Hurayrah thuật; Muslim 20). Vâng phục không phải gánh nặng họ chờ được cởi bỏ, mà là điều được ủy thác họ thấy mình có trách nhiệm giữ gìn.\n\nNói về Dajjal, Thiên Sứ ﷺ nêu hai trường hợp: «Nếu hắn xuất hiện khi Ta còn ở giữa các ngươi, chính Ta sẽ thay các ngươi đối chất với hắn. Nếu hắn xuất hiện khi Ta không còn ở giữa các ngươi, mỗi người sẽ phải tự đối chất với hắn. Allah sẽ thay Ta chăm lo cho từng người Muslim.» (An-Nawwas ibn Sam‘an; Muslim 2937.01). Trái tim được đưa trở về Allah; mối liên hệ với sự bảo hộ của Ngài không bị cắt đứt khi vị Nabi qua đời.\n\nĐiều ấy càng rõ ở Abu Bakr. Ông thuộc những người gần gũi, đồng hành và yêu mến Thiên Sứ ﷺ sâu sắc nhất, nhưng lại thể hiện sự vững vàng khi người khác xao động sau cái chết của Người. (Al-Bukhari 3667–3668.) Tình yêu không biến mất; nó dựa trên đức tin vào Allah vững chắc đến mức sứ mạng không mất đi khi người mình yêu vắng mặt.\n\nKhi Abu Bakr và ‘Umar đến thăm Umm Ayman sau khi Thiên Sứ ﷺ mất, bà khóc. Hai ông nhắc bà rằng điều nơi Allah tốt hơn cho Sứ Giả của Ngài. Bà cho biết: «nhưng tôi khóc vì Lời Mặc khải (được truyền xuống) đến từ Allah đã không còn nữa.» (Muslim 2454). Bà đau buồn vì việc ban mặc khải mới từ trời đã chấm dứt, và hai ông khóc cùng bà. Cảnh ấy mang ý nghĩa sâu hơn nỗi buồn chia lìa người đồng hành: họ nhận ra giá trị của điều từng đến với mình từ trời, nên đau lòng khi việc ấy chấm dứt.\n\nĐó là sự giáo dưỡng gắn con người với mặc khải: «Các người hãy là những bề tôi tôn thờ Thượng Đế (Allah) bởi điều các người răn dạy cho (người khác) từ Kinh Sách cũng như những gì các người đã học được.» (3:79). Người thầy tốt làm sâu sắc mối liên hệ của học trò với Kinh Sách Allah, không biến chính mình thành đích cuối của hiểu biết và hành động của họ. Một tác động của thử thách khi tin Thiên Sứ ﷺ bị giết lan ra trong trận Uhud là trái tim được chuẩn bị để hiểu lời: «Muhammad chỉ là một sứ giả. Các sứ giả đã qua đi trước ông. \r\nNếu ông chết, hoặc bị giết, các ngươi sẽ quay lưng lại gót chân của \r\nmình sao?» (3:144). Trung thành với sự hướng dẫn của Sứ Giả thể hiện ở việc giữ vững nó sau khi mất Người.\n\nTuy vậy, giáo dưỡng không có nghĩa mỗi cá nhân đều không cần chỉ dẫn hay phân chia công việc. Có người cần được nói rõ điều nên làm theo khả năng của mình. Sai lệch là để toàn bộ công việc chỉ dựa trên mệnh lệnh, không có hiểu biết, đức tin hay lòng yêu điều đang làm. Điều ấy cũng không có nghĩa người dẫn dắt ra đi không để lại đau buồn hoặc thiếu hụt. Thiên Sứ ﷺ cho biết Người là sự bảo đảm an ổn cho các Sahabah, còn các Sahabah là sự bảo đảm an ổn cho cộng đồng của Người. (Muslim 2531.) Sau khi Người qua đời, ảnh hưởng và mất mát có thật, nhưng không phải sứ mạng sụp đổ hoặc mọi người đều rời bỏ nó.\n\nTừ chỉ cây gậy trong câu chuyện làm ý nghĩa này rõ thêm. Đó là cây gậy người chăn dùng để thúc hoặc giữ lùi những con vật mình lùa; gốc từ cũng mang ý trì hoãn. Cây gậy mất đi nhắc rằng sự chuyển động chỉ dựa vào gậy sẽ dừng khi nỗi sợ nó không còn. Còn niềm tin và sự thuyết phục trong lòng khiến người ta cống hiến ngay khi người ra lệnh vắng mặt.\n\nTrong các Sahabah có người muốn cống hiến thêm, đến mức ở một giai đoạn họ được bảo, như toàn câu cho biết: «Phải chăng Ngươi (hỡi Thiên Sứ Muhammad) không nhìn thấy những người khi có lời bảo: “Các người hãy ngưng chiến, hãy chu đáo thiết lập lễ nguyện Salah và hãy xuất Zakah”.[1] Nhưng rồi sau đó, khi có lệnh bắt buộc họ phải chiến đấu thì một thành phần trong số họ sợ thiên hạ giống như sợ Allah, thậm chí còn sợ hơn. họ than: “Lạy Thượng Đế của bầy tôi, tại sao Ngài lại ban lệnh chiến đấu ngay lúc này vậy, phải chi Ngài trì hoãn cho bầy tôi thêm một thời gian nữa (để bầy tôi được hưởng thụ cuộc sống).” Ngươi (hỡi Thiên Sứ Muhammad) hãy nói với họ: “Vật chất của cuộc sống trần gian này chỉ là ít ỏi trong khi cõi Đời Sau tốt đẹp hơn dành cho người ngoan đạo; và các ngươi sẽ không bị đối xử bất công một chút nào.”» (4:77). Động lực đã có trong lòng họ, rồi được mệnh lệnh Allah điều chỉnh. Câu chuyện khởi đầu Adhan cũng cho thấy họ mang mối quan tâm của sứ mạng. Khi người Muslim đông lên, cần cách tập hợp họ để hành lễ, mọi người bàn bạc phương tiện. ‘Abdullah ibn Zayd ra về mà lòng bận tâm về điều khiến Thiên Sứ ﷺ lo: tập hợp mọi người cho lễ nguyện. (Abu Dawud 498.) Ông không xem đó là chuyện xa mình và chỉ chờ một lệnh gửi đến, mà mang nó trong lòng rồi thấy giấc mộng Adhan.\n\nKhi ông kể lại, Thiên Sứ ﷺ xác nhận giấc mộng và bảo ông truyền lời gọi ấy cho Bilal, vì giọng Bilal vang và đẹp hơn. ‘Umar cũng nói mình đã thấy một giấc mộng như vậy. (Abu Dawud 499.) Giấc mộng được Sứ Giả xác nhận gắn với một trái tim lo cho cộng đồng; sau đó, công việc được thực hiện tốt bằng cách giao lời gọi cho người có giọng phù hợp hơn.\n\nQur’an còn cho một ví dụ khác về sự chủ động: «Sau đó, từ phần xa nhất của thành phố, một người đàn ông \r\nchạy đến. Hắn nói, ‘Dân của tôi, hãy theo các sứ giả.» (36:20). Trong thị trấn đã có các sứ giả: «Khi TA phái hai Sứ Giả đến gặp họ, họ đã phủ nhận hai vị đó, rồi TA lại tăng cường thêm một vị thứ ba» (36:14). Nhưng người ấy không nói sự hiện diện của họ khiến mình không cần góp phần. Ông đến từ phần xa nhất của thành phố để kêu gọi dân mình theo họ. Không phải công việc nào cũng phải chờ được giao; mỗi người có nhu cầu mình nhận ra và ý tưởng, khả năng mình có thể đóng góp.\n\nNhờ vậy, ta hiểu sự khác nhau giữa người gánh sứ mạng bằng đức tin và người coi công việc là gánh nhục nhã, chỉ chờ thoát ra. Nhiều tiền và máy móc không bù được sự thiếu vắng đức tin ấy. Một thế hệ được giáo dưỡng bằng Qur’an và biết trách nhiệm của mình có thể mang điều được ủy thác, dạy người sau, để lời kêu gọi tiếp tục sau khi người kêu gọi qua đời.\n\nCâu 15\n\n«Chắc chắn có một dấu hiệu cho người dân Saba' (Sê-ba) ngay tại chỗ của họ ở: hai ngôi vườn nằm bên phải và bên trái. Hãy ăn bổng lộc của Thượng Đế của các ngươi và biết ơn Ngài; một thành phố tốt đẹp (với) một Thượng Đế Hằng Tha Thứ.» (34:15)\n\nCâu chuyện Saba’ đặt bên cạnh hình ảnh biết ơn nơi gia đình Dawood. Cả hai đều được ban rộng rãi; khác biệt nằm ở cách con người đối xử với điều được ban. Saba’ là tên một người, tổ tiên của dân có các bộ tộc phân tán: sáu bộ tộc tại Yemen và bốn tại vùng Sham. (At-Tirmidhi 3222.) Mục đích câu chuyện không phải dừng ở gia phả, mà nhìn ân huệ gần với đời sống: chỗ ở tốt, bổng lộc rộng, rồi sự an toàn trên đường đi mà các câu sau nhắc đến.\n\nĐó cũng là hai ân huệ Allah nhắc đã ban cho Quraish: «Đấng đã cho họ ăn khi họ đói và ban cho họ sự bình yên khỏi điều sợ hãi.» (106:4). Về thánh địa, Ngài phán: «Lẽ nào TA (Allah) đã không thiết lập cho họ một thánh địa an toàn với đủ loại hoa quả được mang đến cho nó như là thiên lộc từ nơi TA?» (28:57). Câu chuyện Saba’ không xa với tình trạng người đang được nói đến. Đấng ban cho những người trước bổng lộc và an toàn rồi thu lại sau khi họ quay lưng cũng có thể làm như vậy với người tự mãn về ân huệ.\n\nViệc bắt đầu bằng chỗ ở chạm đến nền tảng cảm giác ổn định của con người. Hadith nêu: «Bất cứ ai trong số các ngươi thức dậy với cơ thể khỏe mạnh, gia đình an toàn và có đủ thức ăn cho ngày của mình, thì người đó như thể đã sở hữu cả thế gian.» (At-Tirmidhi và Ibn Majah). An toàn, khỏe mạnh và đủ dùng hợp lại là những nền tảng khiến đời sống được an lòng.\n\nDấu hiệu ở chỗ dân Saba’ sinh sống là «hai ngôi vườn nằm bên phải và bên trái.» (34:15). Có cách hiểu là những vườn tược bao quanh thị trấn từ hai phía; cũng có cách hiểu rằng mỗi nhà có hai vườn ở bên phải và bên trái. Cả hai cách đều cho thấy sự điều hành rộng rãi và ân huệ ở gần người cư trú. Nhiều vườn, cây cối đan dày và bóng mát hội tụ gợi cảnh sống sung túc: bổng lộc gần và việc tìm kiếm ít tốn công.\n\nCâu chuyện bắt đầu bằng một dấu hiệu rồi kết bằng lời: «Quả thật, trong sự việc đó là những dấu hiệu (bài học) cho từng người kiên nhẫn, biết ơn.» (34:19). Chính ân huệ đã là nơi có điều để nhận ra; kết cục của việc quay lưng lại mở thêm nhiều mặt để suy xét. Rồi việc cho phép hưởng dùng không tách khỏi quyền của Đấng Ban Ơn: «Hãy ăn bổng lộc của Thượng Đế của các ngươi và biết ơn Ngài» (34:15). Vâng phục không phải từ chối bổng lộc tốt đẹp, mà hưởng dùng trong nhận thức rằng nó đến từ Allah và thực hiện lòng biết ơn.\n\nĐiều này đúng với cả ân huệ vật chất và tinh thần. Các thiên thần nói với Maryam: «Và (hãy nhớ) khi các Thiên Thần bảo (Maryam): “Hỡi Maryam! Quả thật, Allah đã chọn Nàng và tẩy sạch Nàng và chọn Nàng (để phụng sự Ngài) hơn những phụ nữ khác trong thiên hạ.”» (3:42); rồi đến trách nhiệm: «Hỡi Maryam! Ngươi hãy hết lòng thờ phượng Thượng Đế của ngươi, ngươi hãy quỳ lạy và cúi mình cùng với những người cúi mình (thần phục Allah).» (3:43). Tương tự, sau khi chọn Musa để mang thông điệp và nhận lời phán, Allah bảo: «Ngươi hãy nhận lấy điều mà TA đã ban cho Ngươi và Ngươi hãy là người biết tri ân.» (7:144). Sự cao quý của món quà không xóa đi hành động mà mời gọi hành động.\n\nHọ được cả vùng đất tốt đẹp lẫn sự tha thứ của Thượng Đế. Một cách hiểu về lời «một Thượng Đế Hằng Tha Thứ.» (34:15) là Ngài không lập tức trừng phạt họ dù họ đã sai phạm, mà trì hoãn, nhắc nhở và trình bày rõ. Đừng xem việc sung túc tiếp tục là bằng chứng Allah hài lòng với sự phủ ơn, và đừng quên cánh cửa trở về đã được mở. Vùng đất tốt là một ân huệ, sự tha thứ là một ân huệ khác; cả hai cùng mời gọi trái tim biết ơn Thượng Đế.\n\nCâu 16\n\n«Nhưng họ đã ngoảnh đi. Vậy nên TA đã gởi một trận lũ (đến trừng phạt họ) từ một con đập, và TA đã thay thế hai ngôi vườn của họ bằng hai ngôi vườn chỉ toàn loại trái đắng, các cây bụi (giông giống loại thánh liễu) và một ít cây táo gai.» (34:16)\n\nĐáp lại ân huệ và mệnh lệnh biết ơn là sự quay lưng. Nơi từng hội tụ bổng lộc trở thành chứng tích về việc nó mất đi. Con người có thể sống sung túc lâu đến mức quên Đấng ban cho mình, rồi xem sự vững chắc của các phương tiện là bảo đảm cho nó còn mãi. Người chủ hai vườn đã như vậy: «Y vào ngôi vườn của mình và tự làm bản thân mình sai quấy khi nói: “Tôi nghĩ rằng ngôi vườn này sẽ không thể nào tiêu tan được.”» (18:35). Thấy cây, nước và sự sắp đặt tốt, ông cho rằng vườn không thể mất. Một dân tộc cũng có thể yên tâm về đập và hệ thống dẫn nước đến mức tưởng nguy hiểm không còn.\n\nQur’an phơi bày gốc rễ của sự tự mãn. Nó nhắc con người về sự yếu ớt trong khởi đầu tạo dựng: «Đấng đã tạo ra con người từ một cục máu.» (96:2), và rằng tri thức là món quà: «Đấng đã dạy con người điều y không biết.» (96:5); rồi nói: «Không! Quả thật, con người thường vượt quá giới hạn.» (96:6); «Vì y tự thấy mình giàu có và đầy đủ.» (96:7). Con người thực ra không độc lập, mà chỉ thấy mình đã tự đủ. Ban đầu, họ có thể thiếu thốn và lo sợ; đến khi việc làm ổn định, cơ thể khỏe, tiền nhiều, các vấn đề về phương tiện đi lại và sinh kế được giải quyết, họ tưởng không còn cần ai, rồi dám phạm tội. Sự tự mãn có thể tăng thêm khi đã bất tuân mà ân huệ vẫn còn một thời gian: họ lấy việc được trì hoãn làm bằng chứng nó sẽ mãi tiếp tục.\n\nToàn câu đưa sự việc trở về Đấng sở hữu các phương tiện: «Nhưng họ đã ngoảnh đi. Vậy nên TA đã gởi một trận lũ (đến trừng phạt họ) từ một con đập, và TA đã thay thế hai ngôi vườn của họ bằng hai ngôi vườn chỉ toàn loại trái đắng, các cây bụi (giông giống loại thánh liễu) và một ít cây táo gai.» (34:16). Điều con người làm thật vững không khiến Allah bất lực. Thứ từng là nguyên nhân cho cuộc sống phát triển, Ngài có thể khiến thành nguyên nhân sự sung túc tan đi. Bản dịch vừa dẫn dùng cụm «một con đập» (34:16) cho từ al-‘arim. Lời giảng cũng nêu cách giải thích khác là trận lũ dữ dội; với cách hiểu về con đập, đó là công trình giữ nước giữa các núi. Kiểm soát dòng lũ và xả nước theo mức cần giúp nông nghiệp ổn định, vườn tược mở rộng. Khi nền tảng ấy sụp, đời sống xây trên nó cũng bị ảnh hưởng.\n\nSức mạnh một đất nước có thể gắn với một nguồn lực duy nhất, như dầu mỏ. Dân ở đó tưởng rằng miễn còn nó thì giàu có được bảo đảm, trong khi chính các nguồn lực cũng nằm dưới quyền Allah. Ngài nhắc họ: «Hãy bảo chúng: “Các người có xét thấy chăng? Nếu vào một buổi sáng nào đó mạch nước của các người rút mất tiêu (xuống lòng đất) thì ai sẽ mang nước mạch trong vắt đến tiếp liệu cho các người?”» (67:30). Những cảnh ban tặng lớn lao trong chương được đặt gần những nguyên nhân nhỏ phơi bày sự yếu đuối của người tự mãn. Allah đã điều khiển bao điều cho Dawood và Sulayman, nhưng rồi một sinh vật ăn gậy làm lộ sự thật Jinn không biết. Sự sung túc khiến dân Saba’ choáng ngợp cũng mất đi. Ngay trong cơ thể người cũng có bài học: khỏe mạnh, đầy sức lực, nhưng một chứng bệnh nhỏ không từng nghĩ đến lại có thể làm mình bất lực.\n\nMột dẫn chứng rõ là câu chuyện Ya’juj và Ma’juj. Sức mạnh của chúng lớn đến mức Allah mặc khải cho ‘Isa đưa người có đức tin lên núi Tur, vì không ai đủ sức giao chiến với chúng. Rồi Ngài gửi loài sâu nhỏ vào cổ chúng, khiến chúng chết. (Muslim 2937.) Một bản thuật khác, do Abu Sa‘id truyền lại, kể chúng uống nước trên mặt đất. Giữa cảnh tự mãn ấy, một người trong chúng ném một ngọn lao về phía trời. Khi ngọn lao trở về nhuốm máu, chúng tưởng đã thắng những cư dân trên trời; rồi chúng bị tiêu diệt bởi tạo vật nhỏ ấy. (Ibn Majah 4079.) Độ lớn của một nguyên nhân trong mắt con người không phải thước đo quyền năng Allah.\n\nSự đền đáp dành cho Saba’ không chỉ là mất trái cây. Hai vườn vẫn còn để nhắc cảnh cũ, nhưng vị ngon đã đổi thành quả đắng và thứ kém giá trị. Có cách giải thích từ chỉ quả đắng là trái đắng nói chung; cũng có cách hiểu là cây arak có trái đắng. Cùng với đó là loại cây được nhắc tiếp trong câu, không còn đem lại trái ngon họ từng quen. Còn loại cây hữu ích nhất còn lại trong ngữ cảnh này chỉ có: «một ít cây táo gai.» (34:16). Cách nói tiếng Ả Rập vừa nêu một lượng nhỏ, vừa nhấn thêm sự ít ỏi, cho thấy điều có ích hiếm hoi thế nào sau cảnh dư dả; nỗi tiếc nuối của người từng biết ân huệ rồi mất nó càng tăng.\n\nĐối với Makkah, nơi hội tụ bổng lộc, vị thế và điều kiện buôn bán, đây là lời cảnh báo gần gũi. Sức mạnh kinh tế không thay thế lòng biết ơn. Vị trí của một đất nước hay tài sản người dân không che họ khỏi quyền cai quản của Allah.\n\nCâu 17\n\n«Vì tội vong ơn nên TA đã bắt phạt họ như thế. Và TA chỉ trừng phạt những kẻ vong ân.» (34:17)\n\nViệc ân huệ đổi thay không tách rời thái độ của dân ấy đối với nó. Sự đền đáp được gắn với việc họ phủ ơn. Được ban tặng không miễn trách nhiệm; ân huệ còn tồn tại cũng không cho phép vô ơn. Lời này vừa cảnh báo người đa thần, vừa làm người có đức tin an lòng. Người có tiền của và trang bị đừng tự mãn vì những gì trong tay; người yếu thế cũng đừng tưởng sức mạnh đối thủ đã ra khỏi quyền sở hữu Allah.\n\nĐiều này gần với lời người có đức tin đáp người chủ hai vườn: «“Thì biết đâu (sau này) Thượng Đế của tôi sẽ ban cho tôi thứ tốt đẹp hơn ngôi vườn của anh; biết đâu Ngài sẽ gửi từ trên trời xuống những lưỡi tầm sét tàn phá ngôi vườn của anh, biến nó thành mảnh đất trơ trụi,”» (18:40); «“Hoặc nguồn nước của ngôi vườn sẽ cạn mất khiến anh không thể nào tìm được nguồn nước trở lại.”» (18:41). Đấng ban cho có thể thu lại và có thể ban cho người từng bị người kia khinh vì nghèo. Sự an lòng ấy trở về phần mở đầu chương: Allah sở hữu mọi vật trong trời đất. Ngay những điều được dành riêng cho các vị Nabi, như sắt, gió và đồng được điều khiển phục vụ, cũng chỉ là sự ban tặng của Ngài.\n\nVì thế, người có đức tin cần phân biệt trái tim an lòng nơi Allah với trái tim an lòng vì còn tiền. Toàn câu nêu rõ một kiểu thờ phượng mong manh: «Trong nhân loại có kẻ thờ phượng Allah trong sự hoài nghi. Nếu gặp điều lành thì y sẽ an lòng (tiếp tục thờ phượng Ngài), còn nếu gặp điều dữ thì y sẽ quay mặt đi (không thờ phượng Ngài nữa); thế là y thất bại cả đời này lẫn Đời Sau. Đó thật sự là một thất bại hiển nhiên.» (22:11). Lời «y sẽ an lòng (tiếp tục thờ phượng Ngài)» (22:11) mô tả sự an lòng bám vào điều tốt đang có, như người chỉ yên tâm khi biết tiền vẫn nằm trong tay mình; đến lúc mất tiền, đức tin cũng chao đảo.\n\nMột ví dụ về việc từ chỉ điều tốt mang nghĩa tài sản nằm trong câu sau; toàn câu được dẫn để thấy ngữ cảnh của từ ngữ: «Các ngươi được sắc lệnh: khi ai đó trong các ngươi sắp từ trần, nếu y để lại tài sản thì y phải lập di chúc cho cha mẹ và họ hàng thân thuộc một cách hợp lý.[1] Đó là bổn phận của những người ngoan đạo.» (2:180). Ví dụ khác là: «Quả thật, y quá đỗi yêu thích tiền tài và của cải.» (100:8). Còn nền tảng an lòng của đức tin là: «Quả thật, với sự tụng niệm (tưởng nhớ) Allah, các con tim sẽ tìm thấy sự an bình và thanh thản!» (13:28). Mối liên hệ giữa bề tôi và Thượng Đế được giữ vững cả lúc dư dả lẫn khi bị thử thách.\n\nCó cách giải thích lời «TA chỉ trừng phạt những kẻ vong ân» (34:17) là nói đến kiểu đền đáp như trường hợp này: ân huệ của người phủ ơn bị nhổ tận gốc như một hình phạt. Còn điều xảy đến với người có đức tin có thể là sự sửa dạy đưa họ trở về với Thượng Đế. Ở đây, điều cần xét là thái độ khác nhau đối với Allah và tác động của thử thách. Đừng đánh đồng việc được tiếp tục ban cho mà càng vô ơn với một tai họa đánh thức con người để sám hối.\n\nCâu 18\n\n«Giữa họ (dân của Sheba) và những thị trấn (của Sham) mà TA đã ban phúc, TA đã đặt những thị trấn khác dễ nhìn từ đằng xa và TA sắp đặt nơi đó những chặng đường (ngắn, gần) để họ đi lại dễ dàng; (và TA phán bảo họ): “Các ngươi hãy đi lại (tùy thích) một cách an toàn cả ban đêm lẫn ban ngày qua những địa điểm đó.”» (34:18)\n\nSau ân huệ bổng lộc trong hai vườn là chi tiết về an toàn và đi lại thuận tiện. Những làng được Allah ban phúc được giải thích là các làng vùng Sham. Giữa Saba’ ở Yemen và vùng ấy là con đường nối tiếp những làng hiện rõ, nơi khách đi đường tìm được thức ăn, nghỉ ngơi và chỗ qua đêm.\n\nHọ không buộc phải mang lương thực cho một hành trình dài lo bị cắt đứt. Đi một chặng, họ nghỉ tại một làng; lên đường tiếp, đến lúc cần dừng lại lại có một làng khác. Lời «TA sắp đặt nơi đó những chặng đường (ngắn, gần) để họ đi lại dễ dàng» (34:18) gợi sự cân đối, gần gũi giữa các chặng: không có đoạn quá xa làm khách kiệt sức rồi đoạn khác lại gần nhau vô ích, mà hành trình được sắp đặt theo mức đem lại sự thoải mái.\n\nCó ý kiến rằng Allah gợi cho họ cách tổ chức ấy. Một khả năng được nêu để giải thích sự an toàn là các mối quan hệ và thỏa thuận với bộ tộc dọc đường tạo điều kiện cho nó; cảnh sung túc khiến các bộ tộc muốn phục vụ họ. Trong cả hai trường hợp, sự thuận lợi đều là ân huệ Allah, dù diễn ra qua phương tiện con người đảm trách.\n\nLời «Các ngươi hãy đi lại (tùy thích)» (34:18) nằm trong khung cảnh đi qua những ngôi làng nối tiếp đã nêu ở đầu câu 34:18. Khung cảnh ấy làm những ngôi làng hiện lên như một nơi liền mạch. Khách đi như đang bước trong chính quê mình, không ra một con đường đứt quãng, đáng sợ và phải mang nặng lương thực. Nhắc đêm trước ngày làm ý nghĩa an toàn càng rõ, vì đêm thường là lúc khách lo sợ. Sự cho phép bao gồm cả thời điểm cần yên tâm hơn. Việc dùng số nhiều cho đêm và ngày cho thấy sự thoải mái, an toàn kéo dài cùng hành trình, không chỉ có tại một chặng thoáng qua.\n\nQuraish từng biết ân huệ tương tự trong sự an toàn và bổng lộc của mình. Câu chuyện Saba’ nhắc chính điều họ đang có. Một cách áp dụng là chăm lo những gì giúp đời sống tốt hơn: sinh kế thuận lợi, giữ an ninh, chuẩn bị đường đi và chỗ nghỉ cho khách. Chi dùng để bớt nhọc nhằn và giúp người đi đường an toàn là biết ơn điều Allah đã làm thuận tiện; nó góp phần xây dựng đất nước và đời sống dân cư.\n\nCâu 19\n\n«(Tuy nhiên, họ không hài lòng với những chặng đường gần và ngắn) nên họ nói: “Lạy Thượng Đế của bầy tôi! Xin Ngài làm cho những chặng đường đi lại của bầy tôi dài xa thêm.” Họ đã bất công với chính bản thân họ (qua mong muốn đó). Vậy nên, TA đã lấy họ làm thành những câu chuyện và đã phân tán toàn bộ họ tản mác khắp nơi. Quả thật, trong sự việc đó là những dấu hiệu (bài học) cho từng người kiên nhẫn, biết ơn.» (34:19)\n\nĐáp lại đường đi dễ dàng, họ đưa ra một yêu cầu đáng ngạc nhiên. Toàn câu ghi lời cầu xin và kết cục của nó: «(Tuy nhiên, họ không hài lòng với những chặng đường gần và ngắn) nên họ nói: “Lạy Thượng Đế của bầy tôi! Xin Ngài làm cho những chặng đường đi lại của bầy tôi dài xa thêm.” Họ đã bất công với chính bản thân họ (qua mong muốn đó). Vậy nên, TA đã lấy họ làm thành những câu chuyện và đã phân tán toàn bộ họ tản mác khắp nơi. Quả thật, trong sự việc đó là những dấu hiệu (bài học) cho từng người kiên nhẫn, biết ơn.» (34:19). Có một cách đọc khác trong tiếng Ả Rập nhấn mạnh thêm mức độ làm các chặng đường xa nhau. (Ibn al-Jazari, An-Nashr, phần các cách đọc chương Saba’.)\n\nCó cách giải thích rằng họ chán sự dễ dàng của việc đi lại, chán những nơi dừng chân gần nhau và muốn các chặng xa ra, đến mức phải cần lạc đà, mang lương thực. Điều đáng biết ơn lại thành điều gây khó chịu. Đây có thể là sự kiêu căng trước ân huệ: con người quen an lành đến mức không còn nhận ra giá trị của nó, nên tìm thay đổi dù chuyển sang khó nhọc.\n\nSự sai lạc trong yêu cầu ấy gần với lời những kẻ phủ nhận trong toàn câu sau: «Và hãy nhớ khi chúng thưa: “Ôi Allah! Nếu (Qur'an) này là Chân Lý do Ngài ban xuống thì xin Ngài hãy làm cho mưa đá đổ từ trên trời xuống đè lên chúng tôi hoặc mang một hình phạt đau đớn nào đến trừng phạt chúng tôi!”» (8:32). Họ không cầu xin được hướng dẫn nếu đó là chân lý, mà đón nhận bằng lời xin điều sẽ hủy diệt mình.\n\nCũng có cách giải thích rằng dân Saba’ nói vậy để phủ ơn khi được nhắc sự an toàn trên đường và những làng gần nhau là ân huệ Allah. Họ làm như không cần món quà ấy, như thể sức mình đủ lo nếu đường xa hơn. Theo cách này, phía sau yêu cầu là sự liều lĩnh của người tưởng mình tự đủ, không chỉ muốn đổi một con đường.\n\nLại có ý kiến rằng chính giới quyền thế, giàu có đòi hỏi điều ấy. Đường dễ khiến họ và người nghèo ngang nhau. Họ muốn giá trị số lạc đà và trang bị mình có được hiện rõ, để chỉ người đủ khả năng mới đi được. Tương tự người có xe nhưng khó chịu khi người khác không cần một phương tiện như mình, rồi mong các nhu cầu ở xa nhau để ưu thế mình lộ rõ. Cũng có ý kiến rằng họ muốn đường vắng ánh mắt dân làng để có thể phạm tội xa sự quan sát. Những cách giải thích động cơ khác nhau ấy gặp nhau ở chỗ ân huệ từ điều mời gọi biết ơn lại bị biến thành chỗ để vô ơn, kiêu ngạo hoặc phạm tội.\n\nMột cách đọc khác hiểu lời này theo hình thức kể lại việc các chặng đường đã bị làm cho xa nhau, thay vì cầu xin làm xa. (Ibn al-Jazari, An-Nashr, phần chương Saba’.) Nó gợi lời than phiền về điều đã xảy ra. Có cách hiểu người yếu thế nói sau khi các chặng xa ra; cũng có cách hiểu chính những người đã đòi hỏi nói khi nếm kết quả. Họ từng khó chịu vì gần, rồi lại khó chịu vì xa. Vấn đề không bắt đầu từ việc mất hết ân huệ, mà từ một trái tim không biết giá trị điều được ban.\n\nNhu cầu thay đổi của con người còn thể hiện trong chuyện cầu mưa. Một người đàn ông than vào thứ Sáu về mưa ít và tài sản, vật nuôi bị hủy hoại; Thiên Sứ ﷺ cầu xin. Đến thứ Sáu sau, lại có lời xin Allah cất đi tác hại của mưa quá nhiều, nên Người cầu mưa ở xung quanh, không đổ lên họ. (Al-Bukhari 1014; Anas không xác định người xin lần sau có phải người lần trước hay không.) Lời xin cất thiệt hại chính đáng khác với sự phủ ơn của Saba’, nhưng câu chuyện giúp thấy hoàn cảnh đổi nhanh và con người cần Thượng Đế trong cả hai tình trạng.\n\nSự lãng quên ấy cũng có thể xảy ra với những ân huệ quen thuộc như gia đình, con cái, phương tiện đi lại hay sinh kế. Người ta than phiền nhiều, rồi chỉ nhận ra giá trị khi mất đi. Một điều có thể suy ngẫm là mối liên hệ với việc con cháu Israel xin thay manna và chim cút bằng thứ khác: «Người hãy cầu xin Thượng Đế của Người ban cho chúng tôi thực phẩm mọc ra từ đất như rau xanh, dưa leo, tỏi, đậu và hành.» (2:61). Muốn thứ mình trực tiếp làm bằng tay đôi khi đi cùng ảo tưởng mình đã nắm quyền tự lo, không phải chờ món quà Thượng Đế ban. Trong khi khả năng làm việc và thành quả cũng là ân huệ Ngài.\n\nTương tự, có người tưởng nếu tự làm mưa được, biết bí mật linh hồn hoặc tìm được nơi sống ngoài trái đất thì đã ra khỏi quyền Allah. Mọi phương tiện mở rộng đến đâu vẫn nằm trong quyền sở hữu Ngài: «các ngươi sẽ không thể vượt qua được ngoại trừ có thẩm quyền (từ nơi Allah)» (55:33).\n\nCâu Kinh sau đó mô tả kết thúc. Những người từng nổi tiếng vì cùng chung sống sung túc trở thành chuyện được kể về một thời đã qua. Họ tan tác đến mức thành tục ngữ: tan tác như dân Saba’. Vườn tược, an toàn và sự quây quần không còn là thực tại quanh họ, mà là một tin khiến người nghe kinh ngạc vì sự đổi thay.\n\nĐiều đó quy tụ trái tim về Đấng sở hữu việc ban cho và thu lại. Sau cười có thể là khóc, sau an toàn là lo sợ, sau dư dả là túng thiếu. Người bề tôi không tự mình nắm các trạng thái ấy ngoài Thượng Đế. Vì vậy, họ hướng về Ngài, như toàn câu: «“Ta toàn tâm hướng mặt mình về Đấng đã tạo hóa các tầng trời và trái đất và Ta không là kẻ thờ đa thần.”» (6:79).\n\nCâu chuyện kết bằng kiên nhẫn và biết ơn. Biết ơn giữ trái tim gắn với Đấng Ban Ơn khi thuận lợi; kiên nhẫn đưa người gặp khó trở về với Ngài. Câu trả lời cho tai họa vì thế không chỉ là chạy sang một nơi khác nhưng vẫn quay lưng với Allah. Hadith cho biết: «Thật đáng ngạc nhiên cho vụ việc của người có đức tin, vì mọi việc của y đều tốt, và điều đó không thuộc về ai ngoại trừ người có đức tin. Nếu điều tốt xảy đến với y, y biết ơn, y sẽ được điều tốt; và nếu điều xấu xảy đến với y, y kiên nhẫn, y sẽ được điều tốt.» (Muslim 2999). Người nhận ra ân huệ khi còn nó và trở về với Allah khi mất nó sẽ hưởng lợi từ các dấu hiệu. Đó là điều người kiêu căng trước ân huệ đã bỏ qua, rồi tan tác trong tiếc nuối vì nó.\n\nCâu 20\n\n«Quả thật, Iblis đã khẳng định sự thật về họ cho điều mà hắn đã phỏng đoán (rằng hắn có thể dắt họ lạc khỏi điều chân lý). Cho nên, họ đã nghe theo hắn ngoại trừ một nhóm trong số những người có đức tin.» (34:20)\n\nCó cách đọc đôi phụ âm và cách không đọc đôi phụ âm ở động từ nói về việc phỏng đoán của Iblis được chứng tỏ. (Al-Qurtubi, Al-Jami‘ li-Ahkam al-Qur’an, giải câu 34:20.) Việc những người ấy theo hắn đã làm sự phỏng đoán của hắn thành đúng. Hắn dự đoán họ sẽ đáp lại cám dỗ, và họ đã làm điều hắn mong.\n\nĐó không phải biết điều vô hình, mà là một phỏng đoán trùng với lựa chọn của họ. Trước đó, hắn từng tuyên bố sẽ dẫn con người đi lạc và loại trừ các bề tôi của Allah, như câu: «“Ngoại trừ những bề tôi nào của Ngài có tấm lòng chân tâm (thờ phượng Ngài) trong bọn chúng.”» (15:40). Trong nguyên bản, lời ấy nhắc đến những bề tôi được thanh lọc, được dành riêng cho Ngài; bản dịch được trích diễn đạt bằng sự chân thành của họ.\n\nMột lối vào của sự cám dỗ là thấy người bề tôi sống dư dả mà không biết ơn, quên việc tưởng nhớ Allah hoặc luôn khó chịu với phần mình nhận. Những tình trạng ấy chuẩn bị cho họ đáp lại điều được tô đẹp. Điều này không chỉ ở người giàu. Người ít tiền cũng có thể rất bất mãn; Shaytan chờ thử thách đầu tiên đẩy họ khỏi đường. Nó gần với người thờ phượng Allah trên một bờ mong manh: hài lòng khi được dư dả, rồi quay lưng khi bị thử bằng điều không thích.\n\nCũng như người kêu gọi điều sai tìm đối tượng mình nghĩ sẽ nghe theo, sự cám dỗ tìm được đường trong trái tim chấp nhận lãng quên và phản kháng trong lòng. Nhưng không phải mọi người đều theo: «ngoại trừ một nhóm trong số những người có đức tin» (34:20). Sự tồn tại của nhóm này bác bỏ việc chỉ lấy môi trường hư hỏng và thử thách khốc liệt làm cớ. Thử thách đã xảy ra, nhưng có người giữ đức tin, không chịu đi cùng số đông trong sự phủ ơn.\n\nCâu 21\n\n«Và thật ra, Iblis không có một chút quyền hành nào đối với họ mà đó chỉ là để cho TA biết rõ ai là người tin tưởng nơi cõi đời sau so với ai trong họ là người hãy còn nghi ngờ về cõi đó; và Thượng Đế (Allah) của Ngươi là Đấng Giám Sát tất cả mọi điều.» (34:21)\n\nQuyền của Shaytan không phải sức mạnh cưỡng bức con người phủ nhận và phạm tội. Hắn mời gọi, tô đẹp, dụ dỗ rồi gặp người chấp nhận. Điều ấy không lấy đi trách nhiệm của họ về lựa chọn. Có thể hình dung qua người hướng sự chú ý của người khác đến điều bị cấm: hắn không trói buộc để bắt nhìn, mà bày ra thứ người kia ham muốn; người đã sẵn lòng sẽ đáp lại.\n\nVì thế, khi mọi việc kết thúc, Shaytan nói: «Thật ra, ta chẳng có quyền lực gì đối với các ngươi ngoại trừ việc ta có thể mời gọi các ngươi và các ngươi đã đáp lại sự mời gọi của ta. Vì vậy, các ngươi đừng trách ta mà hãy tự trách chính mình.» (14:22). Họ nghe lời mời bất tuân rồi chấp nhận, trong khi cũng nghe lời gọi vâng phục nhưng quay lưng. Lời mời họ tự nguyện nhận không thành cái cớ xóa khác biệt giữa hai con đường.\n\nKhông có cưỡng bức không có nghĩa không có lời thì thầm và sức tô đẹp mạnh mẽ. Thiên Sứ ﷺ cho biết Shaytan lưu chuyển trong con người như máu lưu chuyển. (Al-Bukhari 3281.) Nhưng chính thử thách ấy làm lộ lòng xác tín về Đời Sau hoặc sự hoài nghi trong trái tim. Càng nhớ việc gặp Allah và kết quả của hành động, người bề tôi càng có sức chống điều bị tô đẹp. Nhớ ngôi mộ và chứng kiến nơi cuối cùng con người đến sẽ làm yếu sức ham muốn, khi trái tim giữ ảnh hưởng của lời nhắc còn sống động.\n\nĐiều này giống người lái xe liều lĩnh rồi gặp tai nạn khiến mình mệt mỏi và phải điều trị lâu. Họ trở lại với sự cẩn trọng cao, nhưng khi quên điều đã chịu thì quay về thói cũ. Vấn đề không phải lời nhắc chưa từng đến, mà là ảnh hưởng của nó mất dần khi sự quên lãng lấn át.\n\nAllah mô tả người đứng trước Ngài; toàn câu cho ngữ cảnh: «Phải chăng một người thức đêm dốc lòng cung kính (Allah), lúc thì phủ phục, lúc thì đứng thẳng, luôn luôn chú ý đến đời sau và hy vọng nơi Đức Khoan Dung của Thượng Đế của y (giống với một kẻ không có đức tin hay sao) Hãy bảo y: “Phải chăng một người (hiểu) biết và một người thiếu hiểu biết ngang bằng nhau?” Chắc chắn, chỉ những người thông hiểu mới ghi nhớ (lời khuyến cáo).» (39:9). Trong lời giảng, điểm được nhấn là nỗi dè sợ Đời Sau và niềm hy vọng vào lòng thương xót của Thượng Đế. Nỗi dè sợ ấy đi cùng người bề tôi trong lời nói, hành động. Trước khi làm, họ hỏi đến kết quả, vì không thấy đời này là cuối đường. Sự xác tín càng vững, họ càng xa việc theo Shaytan; khác với trái tim bị nghi vấn và ham muốn để trống nỗi sợ chịu xét xử.\n\nCâu 22\n\n«Ngươi (hỡi Thiên Sứ) hãy nói với họ: “Các ngươi hãy cầu nguyện những kẻ mà các ngươi cho rằng (chúng là thần linh của các ngươi) ngoài Allah. Quả thật, chúng không hề nắm giữ và chi phối bất cứ vật gì trong các tầng trời và trái đất, cho dù đó chỉ là sức nặng của hạt nguyên tử; và chúng không hề có bất cứ phần chia nào trong trời đất này; và trong bọn chúng không hề có bất cứ tên nào là vị ủng hộ của Ngài cả.”» (34:22)\n\nSau khi hai câu chuyện cho thấy Allah định đoạt trong quyền sở hữu của Ngài, ban cho, điều khiển rồi thu lại từ người phủ ơn, lời thách thức được đưa đến người cầu những thần linh ngoài Ngài. Hãy xin chúng làm một việc trong những điều họ bám vào chúng để mong có. Có phải nhờ chúng mà sắt mềm cho Dawood, gió và Jinn phục vụ Sulayman, hoặc Saba’ nhận vườn rồi bị lấy mất?\n\nCâu Kinh lần lượt loại bỏ từng cơ sở bám víu vào các đối tượng ấy. Trước hết là sở hữu độc lập: chúng bị phủ nhận điều này dù chỉ một hạt nhỏ. Không một ngôi sao trên trời hay vật gì dưới đất chúng có thể tự mình định đoạt. Lập luận của Ibrahim là một dẫn chứng; toàn câu cho biết ngữ cảnh: «Ngươi (hỡi Thiên Sứ Muhammad) có thấy kẻ đã tranh luận với Ibrahim về Thượng Đế của Y, kẻ mà hắn đã được Allah ban cho vương quyền (vua Nimrud)? Khi Ibrahim nói: “Thượng Đế của tôi là Đấng làm cho sống và làm cho chết.” (Nimrud) bảo: “Ta cũng có thể làm cho sống và làm cho chết.”[1] Ibrahim nói: “Quả thật, Allah là Đấng làm cho mặt trời mọc lên ở hướng đông, vậy bệ hạ hãy làm cho nó mọc lên ở hướng tây xem nào.” Thế là kẻ vô đức tin đã bối rối (vì đuối lý). Quả thật, Allah không hướng dẫn đám người sai quấy.» (2:258).\n\nRồi câu phủ nhận việc chúng có phần cùng Allah trong quyền sở hữu trời đất. Một người có thể không sở hữu riêng nhưng lại có phần chung với người khác; khả năng ấy cũng được đóng lại. Tiếp theo là sự trợ giúp: «trong bọn chúng không hề có bất cứ tên nào là vị ủng hộ của Ngài cả» (34:22). Nghĩa là trong chúng không có ai Allah cần dựa vào để duy trì và điều hành quyền cai quản của Ngài. Từ chỉ người trợ giúp trong tiếng Ả Rập gợi người nâng đỡ, làm vững lưng cho người khác. Allah lo việc tạo vật mà không thiếu thốn, không cần một ai trong số chúng.\n\nNhư vậy, đối tượng được thờ không tự sở hữu, không cùng Allah sở hữu, cũng không giúp Ngài theo cách Ngài phải cần. Điều ấy bao gồm mọi đối tượng con người bám vào ngoài Allah, dù là bề tôi được Ngài tôn vinh như thiên thần hay ‘Isa. Địa vị cao quý của bề tôi không biến họ thành đối tác của Thượng Đế. Ba điều ấy bị phủ nhận đối với toàn thể tạo vật. Còn việc cầu thay sẽ được giải thích sau, nên đừng nhầm điều bị phủ nhận tuyệt đối với điều chỉ xảy ra khi được cho phép.\n\nKhi ý nghĩa ấy vững trong lòng, trái tim quy tụ về Allah, không bị xé ra bởi đòi hỏi của những kẻ nó tưởng đang nắm việc mình. Lời tưởng nhớ buổi sáng được lời giảng nhắc đến là: «Chúng ta đã bước sang buổi sáng, và vương quyền vẫn thuộc về Allah. Mọi lời ca ngợi đều thuộc về Allah.» (Ibn Mas‘ud; Muslim 2723; diễn nghĩa). Lời ca ngợi đi cùng việc xác nhận quyền sở hữu phù hợp với sự an lòng rằng mọi việc đều thuộc về một Thượng Đế.\n\nQur’an đưa ý nghĩa này đến gần qua hình ảnh: «Allah đưa ra hình ảnh thí dụ, một người phục vụ cho nhiều ông chủ gồm những kẻ hợp tác nhưng hay tranh chấp nhau, còn một người chỉ phục vụ cho một ông chủ duy nhất, hai người này có ngang bằng nhau không?» (39:29). Người bị nhiều chủ bất đồng tranh giành không giống người chỉ hướng về một chủ. Cũng vậy, khi biết quyền sở hữu chỉ thuộc Allah, trái tim không xem tiền bạc và trang bị dồi dào của những người chống đối là quyền lực cao hơn quyền lực Ngài.\n\nCâu 23\n\n«Ở nơi Ngài (Allah), việc can thiệp sẽ vô ích trừ phi đối với ai mà Ngài đã cho phép. (Sự vĩ đại và tối cao của Ngài là khi Ngài phán thì tất cả các Thiên Thần đều khúm núm sợ hãi) mãi đến khi lòng của họ hết sợ thì họ mới dám lên tiếng hỏi (đại Thiên Thần Jibril): “Thượng Đế của quý vị phán điều gì vậy?” (Jibril) đáp: “Ngài phán điều Chân Lý bởi vì Ngài là Đấng Tối Cao, Vĩ Đại.”» (34:23)\n\nSau khi quyền sở hữu, phần chung và sự trợ giúp bị phủ nhận, người đa thần có thể còn bám vào hy vọng có trung gian. Câu Kinh làm rõ rằng ngay việc cầu thay cũng không hoạt động độc lập với Allah: «Ở nơi Ngài (Allah), việc can thiệp sẽ vô ích trừ phi đối với ai mà Ngài đã cho phép.» (34:23). Việc cầu thay không bị phủ nhận tuyệt đối như ba điều trước, mà hiệu quả được ràng buộc với sự cho phép của Ngài. Không người cầu thay nào áp đặt được điều gì lên Ngài.\n\nCó cách hiểu sự cho phép là dành cho người cầu thay để họ cầu thay; cũng có cách hiểu dành cho người được cầu thay để việc ấy diễn ra cho họ. Trong cả hai trường hợp, lời khẳng định rằng chỉ cần bám vào một đối tượng thờ phụng là chắc chắn có trung gian với Allah đều mất cơ sở. Thiên thần, các vị Nabi và người có đức tin được phép cầu thay vẫn là những bề tôi quy phục, không có quyền lực cùng Ngài.\n\nMột cách giải thích phần tiếp là những người chờ được cho phép ở trong sợ hãi, kính sợ. Khi sự cho phép được ban, nỗi kinh sợ trong lòng được cất đi và họ hỏi Thượng Đế đã phán gì. Điều này được hiểu về những người cầu thay, cũng được hiểu về những người hy vọng được cho phép cầu thay cho mình. Ngay địa vị cao quý ấy cũng được mở đầu bằng việc chờ sự cho phép và kính sợ Allah.\n\nLời «lòng của họ hết sợ» (34:23) có nghĩa nỗi kinh sợ được loại bỏ. Trong tiếng Ả Rập, có trường hợp dạng động từ đọc đôi phụ âm mang nghĩa loại bỏ điều nào đó, như từ chỉ việc chăm sóc, điều trị người bệnh để bệnh hết đi.\n\nCũng có cách hiểu cảnh này liên quan đến những người đa thần theo Iblis. Họ tiếp tục theo hắn cho đến khi chết, rồi điều từng bị lãng quên lộ ra. Khi ấy họ hỏi Allah đã phán gì để vâng theo, nhưng thời gian hành động đã hết. Theo cách hiểu này, mốc cuối được nối với việc theo Iblis đã nêu trước trong chương.\n\nMột trong những cách hiểu nổi bật là cảnh thiên thần khi Allah quyết định một việc trên trời. Hadith kể họ đập cánh quy phục lời Ngài; một âm thanh được nghe như tiếng kéo dây xích trên đá nhẵn. Khi nỗi kinh sợ được cất khỏi lòng, họ hỏi Thượng Đế đã phán gì và được đáp rằng đó là chân lý. (Al-Bukhari 4800.) Sự vĩ đại khiến bầu trời đầy kính sợ không thuộc một thần linh ngoài Allah, mà thuộc Đấng phán mặc khải và định đoạt. Lời đáp «điều Chân Lý» (34:23) mô tả lời Ngài là chân lý, không có điều sai, như khi nói một phán quyết theo lẽ thật.\n\nÝ nghĩa thiên thần quy phục càng rõ trong bản thuật rằng trong đêm thăng thiên, Jibril được thấy như một tấm vải cũ mòn vì kính sợ Allah. (At-Tabarani, Al-Mu‘jam al-Awsat 4679; Al-Suyuti đánh giá chuỗi truyền được dẫn ở đây là xác thực.) Đó chính là Jibril mà sự to lớn được mô tả qua sáu trăm cánh. (Al-Bukhari 3232.) Địa vị cao và hình hài lớn không loại bỏ sự trọn vẹn trong vai trò bề tôi.\n\nCảnh ấy nối rõ với điều trước. Allah duy nhất sở hữu, ban cho, thu lại; mặc khải khiến thiên thần quy phục cũng thuộc về Ngài. Những thần linh được gán ghép đã đem mặc khải nào đến mà được dành một phần thờ phượng? Ngay Musaylimah khi giả xưng làm Nabi cũng gán lời tuyên bố dối trá của mình cho Allah, không lấy nó làm bằng chứng về một Thượng Đế khác ban mặc khải.\n\nTừ đó, lời nhắc hướng xuống mặt đất. Nếu thiên thần quy phục lời Allah, người nghe mặc khải càng nên hỏi ý Ngài để tuân theo, thay vì chống lại bằng ý riêng hoặc lời bất cứ ai. Ibn ‘Abbas đã phản đối việc đem lời Abu Bakr và ‘Umar đối lại bản thuật từ Thiên Sứ ﷺ, lo cho hậu quả của việc đặt lời người khác trước Sunnah của Người. (Al-Khatib, Al-Faqih wa al-Mutafaqqih 1/377–378.) Điều ấy không hạ thấp hai ông, mà đề cao nguồn hai ông vốn đi theo.\n\nUmm Ayman nhận biết giá trị của mặc khải. Bà đau buồn vì việc ban mặc khải mới từ trời đã chấm dứt. Khi giải thích vì sao mình khóc, bà nói: «nhưng tôi khóc vì Lời Mặc khải (được truyền xuống) đến từ Allah đã không còn nữa.» (Muslim 2454). Abu Bakr và ‘Umar khóc cùng bà. Những trái tim hiểu địa vị ấy không đón nhận lời Allah như một lời thoáng qua.\n\nCâu 24\n\n«Hãy bảo họ “Ai cung cấp bổng lộc cho các người từ các tầng trời xuống dưới đất?” Hãy bảo họ: “Allah!” \"(Giữa chúng ta), chúng tôi hay quí vị sẽ là người công khai đi đúng đường hay lạc đường.”» (34:24)\n\nSau các câu chuyện và dẫn chứng, mệnh lệnh “Hãy nói” tiếp nối, đưa lời đến việc truyền đạt và lập luận trực tiếp. Câu hỏi hướng vào nhu cầu người nghe không thể thiếu: ai mang bổng lộc đến? Mưa trên trời và cây dưới đất không thuộc quyền những thần linh họ cầu. Đấng ban ân huệ cho Dawood và Sulayman, ban sự sung túc cho dân Saba’ rồi thu lại sự sung túc ấy từ dân Saba’, cũng chính là Đấng đang nuôi dưỡng người nghe lúc này.\n\nLời đáp được xác nhận: «Allah!» (34:24). Nhu cầu được đưa về đúng Đấng đáp ứng, cũng như câu hỏi: «Hãy bảo chúng: “Các người có xét thấy chăng? Nếu vào một buổi sáng nào đó mạch nước của các người rút mất tiêu (xuống lòng đất) thì ai sẽ mang nước mạch trong vắt đến tiếp liệu cho các người?”» (67:30). Sự thật ấy có thể hiện rõ khi người bị cảnh dư dả che khuất gặp bệnh, sợ hãi hoặc cận kề cái chết. Biển động chẳng hạn làm rơi khỏi trái tim nhiều ảo tưởng họ vẫn dựa vào trên đất liền.\n\nTrong câu chuyện ‘Ikrimah ibn Abi Jahl, ông bỏ chạy bằng đường biển rồi gặp bão. Người trên thuyền nói các thần linh không giúp gì được; họ phải chân thành hướng lời cầu xin về Allah. ‘Ikrimah hiểu rằng được cứu trên đất liền cũng như trên biển đều chỉ nhờ chân thành cầu xin Ngài. Ông quyết nếu được Allah cứu sẽ trở về với Thiên Sứ ﷺ; rồi ông trở lại và vào Islam. (An-Nasa’i 4067.) Không có một Thượng Đế của biển khác với Thượng Đế của đất liền; chính sự lãng quên được lúc khốn khó làm lộ ra.\n\nSau những lập luận ấy là cách đối thoại nhẹ nhàng: «(Giữa chúng ta), chúng tôi hay quí vị sẽ là người công khai đi đúng đường hay lạc đường.”» (34:24). Đây không phải Thiên Sứ nghi ngờ chân lý mình mang đến, mà là hạ cách diễn đạt xuống để mời đối phương nhìn hai con đường, không khởi đầu bằng chọc giận họ. Khẳng định một Thượng Đế và khẳng định nhiều thần linh không thể cùng đúng. Việc gán cho những đối tượng ấy khả năng ban bổng lộc và cầu thay không cần phép trái với bằng chứng đã nêu về sự bất lực của chúng. Cũng vậy, cáo buộc Thiên Sứ chia rẽ cha con không xóa đi việc họ đang thờ ngoài Allah. Một trong hai đường phải là hướng dẫn, đường kia là lầm lạc.\n\nTrong cách diễn đạt nguyên bản về «đi đúng đường» (34:24) còn có hình ảnh đứng vững trên sự hướng dẫn. Ở đây có một nguyên tắc hữu ích khi kêu gọi: ưu tiên giúp người khác được hướng dẫn hơn làm họ tổn thương. Một người có thể chế nhạo đối phương nhưng qua đó đánh mất cơ hội mở trái tim họ để suy xét. Nhẹ nhàng không có nghĩa bỏ việc làm rõ; cách nói này đến sau nhiều lập luận, câu chuyện và chi tiết.\n\nKhi đặc tính đúng và sai được làm rõ bằng Qur’an, mọi người nhận ra hai đường, dù không phải lúc nào cũng cần nêu tên từng cá nhân: «TA trình bày rõ các Lời Mặc Khải (của TA) như thế đó và để con đường của những kẻ tội lỗi trở nên rõ ràng.» (6:55). Trong thời yếu thế, có cơ hội trình bày và đối thoại là một mục đích lớn. Câu chuyện những người trong hang cho thấy nỗi sợ có thể ngăn người có đức tin bày tỏ niềm tin. Còn chuyện hai vườn cho thấy vẫn có không gian tranh luận: «Người bạn của y tranh luận với y, nói: “Phải chăng anh đã không có đức tin nơi Đấng đã tạo hóa ra anh từ đất bụi rồi từ tinh dịch rồi sau đó Ngài đã làm cho anh thành một người đàn ông hoàn chỉnh?!”» (18:37). Có người chịu nghe lập luận và cho trình bày là mở một cánh cửa hành động, dù người kêu gọi chưa thể thay đổi toàn bộ thực tế. Vì vậy, họ vừa giữ chân lý sáng rõ vừa lựa lời nói tốt đẹp.\n\nCâu 25\n\n«Ngươi hãy nói với họ: “Các người sẽ không bị tra hỏi về tội của chúng tôi và chúng tôi cũng sẽ không bị tra hỏi về những gì các người đã làm.”» (34:25)\n\nLời nói càng nhẹ nhàng đến mức dùng cách diễn đạt khác với điều người nghe có thể chờ: «tội của chúng tôi» (34:25) ở phía Thiên Sứ và người có đức tin, còn «những gì các người đã làm» (34:25) ở phía đối thủ.\n\nĐiều ấy không thừa nhận đức tin là tội ác, mà thuận theo cáo buộc của họ để lập luận: giả sử theo điều các người đang gán cho chúng tôi, các người không gánh hậu quả việc chúng tôi làm, và chúng tôi cũng không gánh hậu quả việc các người làm. Vậy tại sao cản chúng tôi trình bày điều mình tin?\n\nCâu không dùng từ chỉ việc họ phạm tội để mô tả hành động của họ, dù sự thờ đa thần đã rõ. Mục đích là giữ cánh cửa suy xét và hướng dẫn, không chỉ kiếm một câu thắng đối phương rồi rời đi. Người tha thiết muốn người khác được hướng dẫn có thể nói với kẻ cáo buộc mình: hãy xem điều được nói, dù phán đoán về tôi vẫn chưa đổi; anh có trách nhiệm của anh, tôi có trách nhiệm của tôi, và phán quyết phân xử giữa chúng ta sẽ đến.\n\nCâu này nối với câu trước: hai con đường đã được xác định không thể cùng đúng. Sau đó, việc tách trách nhiệm trở thành lập luận trước hành động ngăn cản lời kêu gọi và bịt miệng người truyền đạt; làm vậy không khiến trách nhiệm trước Allah biến mất. Đây là cách nói người có đức tin cần khi đường truyền đạt bị thu hẹp: giữ vững thông điệp và vẫn tha thiết để đối thoại còn có thể tiếp tục.\n\nCâu 26\n\n«Ngươi hãy nói với họ: “Thượng Đế của chúng ta sẽ triệu tập tất cả chúng ta rồi Ngài sẽ phán xét giữa chúng ta đúng theo chân lý bởi Ngài là Đấng Thẩm Phán Toàn Tri.”» (34:26)\n\nSau khi tách trách nhiệm hai phía, câu nhắc họ về nơi trở về không ai ngăn được: Allah sẽ tập hợp tất cả rồi phân xử theo chân lý. Lời «Ngài sẽ phán xét giữa chúng ta» (34:26) mang nghĩa phán quyết. Từ ngữ nguyên bản còn gợi việc mở điều bị đóng.\n\nCuộc tranh luận có thể đi đến những người không muốn nghe, lại nắm tiền của, trang bị và khả năng chèn ép. Đừng để con đường có vẻ khép kín khiến người có đức tin tưởng chân lý không có phán quyết bênh vực. Quyền phân xử ở nơi Allah; toàn câu khẳng định: «Ngươi hãy nói với họ: “Thượng Đế của chúng ta sẽ triệu tập tất cả chúng ta rồi Ngài sẽ phán xét giữa chúng ta đúng theo chân lý bởi Ngài là Đấng Thẩm Phán Toàn Tri.”» (34:26). Ngài biết hoàn cảnh, ý định và điều mỗi bên xứng đáng nhận. Phán quyết của Ngài không có thiếu hiểu biết hoặc bất công. Thẩm phán con người có thể xét xử trong cơn giận ảnh hưởng đến cái nhìn; còn sự phân xử của Allah đi cùng tri thức bao trùm. Không quyền lợi nào người khác không thấy lại bị mất ở nơi Ngài.\n\nSuy ngẫm điều ấy làm người ta hy vọng hơn vào sự mở lối của Allah khi các lối kêu gọi bị đóng, phương tiện sức mạnh và phát ngôn bị độc chiếm, còn người có lẽ phải không đến được điều mình mong. Những ý nghĩa ấy nuôi dưỡng người lo việc hướng dẫn mọi người: nối nỗ lực yếu ớt của họ với Thượng Đế biết cả sự cống hiến lẫn điều cản trở.\n\nMột dẫn chứng về sự quan tâm chân thật đến trách nhiệm tôn giáo là lời Thiên Sứ ﷺ: «Ai chết đi mà chưa từng chinh chiến cũng như chưa từng nói với bản thân về việc chinh chiến thì người đó đã chết trên một phần của Nifaq (giả tạo đức tin).» (Muslim 1910). Trong bản Muslim còn có ý kiến riêng của Ibn al-Mubarak cho rằng lời ấy liên quan đến thời Thiên Sứ ﷺ; đó là ý kiến của ông, không phải một phần lời Thiên Sứ. Hadith nói về việc tham gia chiến đấu. Điều lời giảng rút ra trong bối cảnh này là ý muốn giúp tôn giáo không chỉ là cảm xúc thoáng qua tách khỏi sự sẵn lòng cống hiến. Khi mối quan tâm ấy chân thật, tên gọi «Đấng Thẩm Phán» (34:26) trong bản dịch câu 34:26 nuôi dưỡng niềm hy vọng và kiên nhẫn của người bề tôi. Sự mở lối được lời giảng liên hệ với ý nghĩa từ ngữ tiếng Ả Rập; đó là phần suy ngẫm được nêu bên cạnh tên gọi trong bản dịch.\n\nCâu 27\n\n«Ngươi hãy nói với họ: “Các người hãy chỉ cho Ta đâu là những kẻ mà các người đã cho là những vị đối tác ngang vai của (Allah). Chắc chắn sẽ không có ai (là đối tác của Ngài cả) mà chỉ có Ngài là Allah (Đấng Duy Nhất), Ngài là Đấng Toàn Năng, Sáng Suốt.”» (34:27)\n\nLập luận kết bằng yêu cầu phơi bày gốc rễ của lời gán đối tác cho Allah: hãy cho thấy những đối tượng họ làm thành đối tác, và chứng minh chúng có địa vị ấy. Những việc Allah làm, quyền sở hữu và sự điều hành của Ngài đã hiện rõ qua các câu Kinh. Vậy các đối tượng họ ghép vào có hành động nào tương xứng?\n\nMột câu tương tự nêu vấn đề trong toàn bộ ngữ cảnh của nó: «Vậy Đấng (cung dưỡng cho vạn vật và) giám sát từng linh hồn về những gì nó làm (lại không đáng được thờ phượng hơn những thần linh bục tượng) ư? Tuy nhiên, (những kẻ vô đức tin) đã dựng lên những đối tác ngang vai với Allah. Ngươi (Thiên Sứ Muhammad) hãy nói với chúng: “Các ngươi hãy kể ra xem tên các thần linh mà các ngươi dựng lên cùng với Allah! Hay có phải các ngươi muốn cho Ngài biết về điều gì đó mà Ngài không biết trên trái đất này? Hoặc phải chăng các ngươi chỉ tùy tiện thốt ra những lời sáo rỗng?” Không, kế hoạch của những kẻ vô đức tin có vẻ đã thu hút chúng và chúng đã bị ngăn cản đến với con đường (chính đạo). Quả thật, ai mà Allah làm cho trệch hướng thì chắc chắn sẽ không có người hướng dẫn.» (13:33). Chính Ngài ban cho mỗi sinh linh điều nuôi sống nó, biết việc nó làm và điều nó che giấu, định thời hạn sống của nó. Thế mà con người gán cho Ngài đối tác không tự làm được việc nào trong số ấy ngoài Ngài.\n\nMục đích không chỉ đưa ra tên hoặc hình của những đối tượng được thờ, mà cho thấy việc ghép chúng cùng Allah trong quyền xứng đáng được thờ là vô căn cứ. Sự bác bỏ nằm trong toàn câu: «Ngươi hãy nói với họ: “Các người hãy chỉ cho Ta đâu là những kẻ mà các người đã cho là những vị đối tác ngang vai của (Allah). Chắc chắn sẽ không có ai (là đối tác của Ngài cả) mà chỉ có Ngài là Allah (Đấng Duy Nhất), Ngài là Đấng Toàn Năng, Sáng Suốt.”» (34:27); rồi là lời xác nhận rõ: «mà chỉ có Ngài là Allah (Đấng Duy Nhất), Ngài là Đấng Toàn Năng, Sáng Suốt» (34:27). Con người gán thêm bao nhiêu đối tác cũng không thay đổi sự thật; lời khẳng định của họ không ban cho chúng một thuộc tính nào của Thượng Đế Chân Thật.\n\nCâu 28\n\n«Và TA (Allah) cử phái Ngươi (hỡi Thiên Sứ) đến chỉ để làm một Người mang tin mừng và một Người cảnh báo cho toàn bộ nhân loại nhưng đa số nhân loại không biết.» (34:28)\n\nSứ mạng Thiên Sứ ﷺ không phụ thuộc vào sự đáp lại của nhóm Quraish Người tranh luận. Nó dành cho toàn thể con người; khi một dân tộc quay lưng, Allah chuẩn bị người khác gánh vác. Điều này gần với lời: «Nếu các ngươi quay lưng thì Ngài sẽ đưa một đám người khác đến thay thế các ngươi và họ sẽ không giống như các ngươi.» (47:38). Allah đã chuẩn bị tại Madinah những người tin và giúp sứ mạng sau sự ngoan cố của những kẻ phủ nhận ở Makkah. Con người cần lời kêu gọi hướng dẫn mình; quay lưng không khiến ai hết cần sự hướng dẫn ấy.\n\nLời «một Người mang tin mừng và một Người cảnh báo» (34:28) xác định nhiệm vụ được giao cho Sứ Giả: đem tin mừng đến người đáp lại và cảnh báo người quay lưng. Người không được giao làm cho lời kêu gọi chạy theo mọi đề xuất của kẻ cố tình làm khó. Họ đòi dấu lạ như Musa, đòi Kinh Sách từ trời xuống, và dân Makkah đòi biến đồi Safa thành vàng. (Ahmad 2333; Al-Hakim 3379 có một đường truyền cùng nội dung mà ông đánh giá chuỗi truyền là xác thực.) Đánh giá ấy thuộc về đường truyền của Al-Hakim, không tự động chuyển sang mọi bản của Ahmad.\n\nNếu người kêu gọi chạy theo từng đề xuất, từ một đường hầm trong đất đến một chiếc thang lên trời, yêu cầu của người không muốn đáp lại sẽ không dứt. Điều đang được nói không phủ nhận các dấu lạ Allah đã dùng để trợ giúp Thiên Sứ, mà làm rõ sự chân thật của Người không phụ thuộc vào việc làm vừa những đòi hỏi liên tục đổi khi đã được trả lời. Kẻ cố chấp có thể đáp mỗi câu trả lời bằng một yêu cầu khác, đến mức người kêu gọi tiêu cả đời đuổi theo phản đối và quên nền tảng truyền đạt.\n\nHọ từng nói: «Tại sao Y không được ban cho điều giống như điều đã được ban cho Musa?» (28:48); rồi lập trường của họ bị lời sau phơi bày: «Chúng tôi sẽ không bao giờ tin nơi Qur'an này và cũng không tin nơi điều (Kinh Sách) nào trước nó.» (34:31). Không phải hình thức dấu lạ khác nhau đã ngăn họ tin. Hiểu việc báo tin mừng và cảnh báo giúp người kêu gọi biết bổn phận là trình bày mặc khải rõ ràng. Qur’an, bằng chứng đã được mang đến, không là thứ sửa đổi để chiều ý đối thủ. Nhiệm vụ ấy giữ hướng đi cho lời kêu gọi cùng với phạm vi sứ mạng dành cho toàn thể con người.\n\nCâu 29\n\n«(Những kẻ thờ đa thần hối thúc sự trừng phạt) bảo: “Lời hứa (về sự trừng phạt) này bao giờ sẽ xảy đến nếu các ngươi nói thật?”» (34:29)\n\nSau khi nói về Đấng Ban Bổng Lộc chân thật, sự vô căn cứ của việc thờ đa thần và phạm vi sứ mạng, lời phản đối trở lại thời điểm xét xử. Câu hỏi về lời hứa phơi bày điều nằm phía sau nhiều cuộc tranh luận ấy. Họ không chỉ muốn hiểu rõ hơn, mà ghét việc hành động của mình sẽ dẫn đến xét xử buộc họ phải thay đổi.\n\nChương Al-Qiyamah nêu sự phản đối việc phục sinh rồi vạch động cơ: «Có phải con người cho rằng TA sẽ không bao giờ tập hợp được xương cốt của y lại?» (75:3); «Không (như chúng nghĩ). TA toàn năng sắp xếp lại một cách hoàn hảo từng đầu ngón tay của y.» (75:4); «Không! Con người (phủ nhận sự Phục Sinh) vì muốn tiếp tục phạm tội ở phía trước.» (75:5); «Y hỏi: “Khi nào Ngày Phục Sinh sẽ đến?”» (75:6). Lời bắt đầu bằng việc cho là không thể tập hợp xương, rồi làm rõ ý muốn tiếp tục phạm tội phía sau câu hỏi về Ngày Phục Sinh. Người từ chối có thể lấy một nghi vấn về Kinh Sách hoặc khả năng sống lại làm màn che cho ý muốn giữ điều mình ham. Khi lập luận trả lời được, họ chuyển sang phản đối khác, vì điều họ muốn tránh chính là thừa nhận sự xét xử.\n\nMột cách áp dụng là người viện cớ giáo luật cũ hoặc không phù hợp để né việc thuận theo từ gốc. Vấn đề không chỉ là một câu có thể giải thích, mà là ý chí chấp nhận hay từ chối trách nhiệm. Đặt trong mạch của chương, câu hỏi ấy cho thấy họ vẫn quay lưng và phủ nhận dù sự việc đã được giải thích rõ. Họ không chịu sống theo sự hướng dẫn của mặc khải, nên mới hỏi khi nào lời hứa sẽ thành hiện thực. Đến ngày ấy, họ sẽ phải chịu trách nhiệm về những việc mình làm.\n\nChính ngữ cảnh cho thấy động cơ của họ. Cần phân biệt thái độ ấy với câu hỏi của người thật lòng muốn hiểu. Ta không thể gán cho người ấy ý muốn phủ nhận.\n\nCâu 30\n\n«Ngươi (hỡi Thiên Sứ) hãy nói với họ: “Cuộc hẹn cho các người đã được định sẵn vào Ngày mà nó sẽ không đến muộn cũng không đến sớm hơn một thời khắc nào.”» (34:30)\n\nLời đáp xác định họ có một thời hẹn không thể đẩy sớm hay kéo muộn. Lời hứa thành hiện thực không chạy theo việc họ giục; khi đến thời hẹn, họ cũng không xin thêm được thời gian.\n\nSau những điều đã được làm rõ, lời không chỉ lặp lại tranh luận về sự tồn tại của Ngày Phục Sinh, mà chuyển đến điều sẽ xảy ra với họ trong ngày ấy. Ngày đến đúng hẹn, rồi mỗi người đứng trước hậu quả lựa chọn. Có thể hình dung người cứ khăng khăng không có kỳ thi nào chờ mình, rồi được trả lời về điều sẽ gặp trong ngày thi và kết cục của việc không chuẩn bị. Người trả lời không thuận theo sự phủ nhận, mà đưa lời nói trừu tượng sang hậu quả thực tế.\n\nBởi thế, sau khi xác định thời hẹn, chương đưa ra cảnh những kẻ bất công bị giữ trước Thượng Đế và đổ lỗi cho nhau. Điều họ coi nhẹ khi đang yên ổn ở đời này sẽ thành tình cảnh không thể vượt qua. Điều họ đòi đến nhanh cũng không đẩy lùi được khi nó tới. Khi điều ấy vững trong lòng, câu hỏi có ích trở thành chuẩn bị thế nào cho điều đang đến, sau khi đã rõ toàn bộ thời hẹn thuộc về Allah.\n\nCâu 31\n\n«Và những kẻ không có đức tin bảo: “Chúng tôi sẽ không bao giờ tin nơi Qur'an này và cũng không tin nơi điều (Kinh Sách) nào trước nó.” Giá Ngươi (Muhammad) có thể nhìn thấy được tình cảnh của những kẻ làm điều sai quấy bị bắt đứng trước mặt Thượng Đế của chúng, chúng lời qua tiếng lại trách móc lẫn nhau. Những kẻ tự cho mình yếu thế sẽ bảo những tên cường bạo: “Nếu không vì nể nang quí ngài thì chúng tôi đã trở thành người tin tưởng rồi!”» (34:31)\n\nNhững kẻ phủ nhận làm rõ lập trường từ gốc khi tuyên bố không tin Qur’an hay các Kinh Sách trước Nó. Trước đó, họ đòi: «Ngươi (hỡi Muhammad) hãy mang đến cho bọn ta một quyển Qur’an khác quyển này hoặc hãy thay đổi nó đi!» (10:15). Họ muốn một lời không buộc mình chấp nhận sự duy nhất của Allah và việc chịu xét xử. Lời đáp là: «Ta không thể thay đổi Nó theo ý mình. Ta chỉ làm theo những gì đã được mặc khải cho Ta.» (10:15). Sứ Giả là bề tôi được giao truyền đạt, không có quyền tự lập một tôn giáo chiều ham muốn mọi người. Khi không được thay đổi, việc đòi một Kinh Sách như Musa nhận bộc lộ không phải sự sẵn sàng đón mặc khải. Cuối cùng, họ từ chối cả Qur’an lẫn các Kinh Sách trước Nó.\n\nCó cách hiểu những người nói ở đây là giới quyền thế kiêu ngạo. Điều ấy nối với nỗ lực công kích các dấu hiệu của Allah đã nêu và lời tự hào nhiều tiền, đông con sẽ đến sau. Đối thủ có thể sở hữu tiền của, trang bị nhưng vẫn sợ một người không có những thứ tương đương, vì biết ảnh hưởng của Qur’an người ấy mang. Bởi vậy, họ dồn công cắt mối liên hệ giữa con người và nguồn hướng dẫn.\n\nMột hình thức là làm yếu mối liên hệ với tiếng Ả Rập, để người ta nghe Qur’an mà không hiểu. Khoảng cách rộng dần đến mức lời văn và lời giải thích đều khó tiếp cận. Một hình thức khác là đẩy việc hiểu Qur’an ra bên lề giáo dục: một người có thể đạt trình độ cao trong các lĩnh vực học vấn thế tục nhưng không đọc tốt Al-Fatihah. Vấn đề ở trường hợp đang nói không phải không thể học, vì họ đã chứng tỏ khả năng học điều mình quan tâm, mà là quay lưng với tri thức cần cho tôn giáo.\n\nCó mối liên hệ đúng với Qur’an đem lại thước đo cho những nghi vấn được đưa đến. Con người biết một lời có trái mặc khải hay không, không dễ tin chỉ vì người nói nổi tiếng hoặc có diễn đàn mạnh. Trong những câu làm thước đo có: «Những ai không phân xử theo những gì được Allah ban xuống thì họ là những kẻ vô đức tin.» (5:44); «người nào không phân xử theo những gì mà Allah ban xuống thì những người đó là những kẻ sai quấy.» (5:45). Câu tiếp theo, trong toàn bộ ngữ cảnh của nó, cũng nêu việc phân xử theo điều Allah ban: «Và hãy để người dân của Kinh Injil xét xử theo điều (mặc khải) mà Allah đã ban xuống. Và ai không xét xử theo điều mà Allah đã ban xuống thì là những kẻ dấy loạn.» (5:47). Và có lời: «Những người Do Thái và những người Thiên Chúa sẽ không bao giờ bằng lòng với Ngươi (Muhammad) ngoại trừ Ngươi chịu theo tôn giáo của họ.» (2:120). Trở về điều Allah ban giữ các nền tảng rõ ràng, không lấy sự hài lòng của mọi người thay cho lẽ phải. Người muốn kéo cộng đồng khỏi sự hướng dẫn tìm cách đưa họ xa Kinh Sách không bị đổi thay.\n\nNgữ cảnh chuyển từ giọng kẻ kiêu ngạo tuyên bố «Chúng tôi sẽ không bao giờ tin» (34:31) sang tình trạng hắn khi đứng trước Thượng Đế: «Giá Ngươi (Muhammad) có thể nhìn thấy được tình cảnh của những kẻ làm điều sai quấy bị bắt đứng trước mặt Thượng Đế của chúng» (34:31). Trong nguyên bản tiếng Ả Rập, câu điều kiện để phần kết không nói ra, cho trái tim hình dung sự kinh khủng: nếu thấy, sẽ thấy một việc ghê gớm. Kẻ từng chặn người khác, chèn ép và ngăn người có đức tin thờ phượng giờ trở thành người bị giữ lại để chịu hỏi: «Nhưng các ngươi hãy bắt chúng dừng lại bởi chúng còn phải bị tra hỏi.» (37:24).\n\nĐây là sự an lòng cho người bị hại. Việc họ không đủ sức đẩy lùi không mất đi, và kẻ bạo ngược không còn nắm quyền khi Allah tập hợp tạo vật. Những kẻ bất công trong cảnh này gồm cả người kiêu ngạo và người tự chọn theo họ. Người trước bất công với người khác; người theo bất công với chính mình khi chấp nhận vâng theo điều sai.\n\nĐối thoại giữa thủ lĩnh và người theo được lặp lại trong Qur’an, vì có người có khả năng dẫn dắt và có người chọn đi theo. Người dẫn dắt có thể dùng khả năng để hướng dẫn hoặc dẫn lạc. Về Pha-ra-ông và những kẻ đi cùng, Allah phán: «TA đã làm cho bọn họ thành những tên cầm đầu trong việc kêu gọi người ta đi vào Hỏa Ngục» (28:41). Một nhóm nhỏ có thể điều khiển đám đông bằng tiền và diễn đàn, hướng họ theo ý muốn; theo họ không bỏ được bổn phận suy xét của mỗi người.\n\nTrong chương Al-Baqarah, đặc tính đi theo được làm nổi bật: «(Bởi vì) khi đối diện với hình phạt, những kẻ được tuân theo sẽ (tuyên bố) vô can đối với những kẻ phục tùng chúng và mọi quan hệ giữa đôi bên sẽ bị cắt đứt hết.» (2:166). Cái nhìn được hướng đến nguy cơ bắt chước thay cho bằng chứng. Còn ở đây, các đặc tính kiêu ngạo và yếu thế được lặp lại, cho thấy mối liên hệ giữa quyền lực, tiền của của người được theo với sự khuất phục trước họ.\n\nLời «chúng lời qua tiếng lại trách móc lẫn nhau.» (34:31) vẽ cảnh trao nhau lời buộc tội. Mối liên hệ lợi ích từng tập hợp họ đã thành thù địch. Tương tự lời Ibrahim: «Các người đã thờ cúng những bục tượng thay vì Allah chẳng qua là vì các người yêu thương lẫn nhau ở đời này; rồi vào Ngày Phán Xét, các người sẽ phủ nhận và nguyền rủa lẫn nhau» (29:25). Trước kia, họ hợp sức vì lợi ích; người theo gây tổn hại lẽ phải và người giữ nó, hoặc truyền bá nghi vấn để lấy tiền. Rồi sau thời gian dài im lặng, giờ được nói đã đến, nhưng thời gian hành động không còn.\n\nKiêu ngạo là muốn cao hơn mọi người; nó được nuôi bằng sự khuất phục của người chấp nhận bị dẫn đi. Những người yếu thế trong cảnh này đã chấp nhận để người khác xem mình như kẻ không biết nói không với điều sai, không phải bị tước hết khả năng lựa chọn. Cái nhìn của cả hai phía đều lệch: người kiêu ngạo thấy mình trên mọi người, còn người theo thấy mình quá thấp để xem xét hoặc phản đối.\n\nSự xấu xí của thái độ kiêu ngạo được đưa đến gần qua lời cấm: «Con chớ vênh mặt trước mọi người» (31:18). Việc ngoảnh mặt kiêu ngạo được ví với tình trạng làm cổ lạc đà nghiêng lệch. Hình ảnh kẻ kiêu ngạo tưởng đang tô đẹp mình lại biểu hiện một khiếm khuyết. Ở phía kia là quen im lặng trước bất công đến mức không còn phản đối trong lòng. Thấy người yếu bị hại hoặc thấy trộm cắp, họ đi qua như không liên quan; kẻ bất công càng liều khi gặp sự chấp nhận và im lặng.\n\nLời những người theo phơi bày mức độ uy thế của thủ lĩnh đã ăn sâu trong họ; toàn câu cho ngữ cảnh: «Và những kẻ không có đức tin bảo: “Chúng tôi sẽ không bao giờ tin nơi Qur'an này và cũng không tin nơi điều (Kinh Sách) nào trước nó.” Giá Ngươi (Muhammad) có thể nhìn thấy được tình cảnh của những kẻ làm điều sai quấy bị bắt đứng trước mặt Thượng Đế của chúng, chúng lời qua tiếng lại trách móc lẫn nhau. Những kẻ tự cho mình yếu thế sẽ bảo những tên cường bạo: “Nếu không vì nể nang quí ngài thì chúng tôi đã trở thành người tin tưởng rồi!”» (34:31). Trong cách nói nguyên bản, cấu trúc điều kiện gắn việc họ không tin với sự hiện diện của những người ấy, như thể chỉ riêng việc có họ đã thành vật cản, trước khi người theo nói rõ mưu kế trong đoạn đối thoại sau. Bản dịch được dẫn giải thích thêm bằng sự nể nang; lời giảng ở đây chú ý cả sức nặng của cấu trúc điều kiện ngắn trong tiếng Ả Rập.\n\nMột cách áp dụng là tự xem những điều mình đặt sau lời nếu không có để trì hoãn điều tốt: công việc, con cái, thử thách hay hoàn cảnh. Người ta có thể biến chúng thành màn che trước lễ nguyện đêm, chi dùng và cống hiến; mãi tưởng tượng mình sẽ làm gì nếu chúng biến mất, thay vì tìm điều có thể làm cùng chúng.\n\nAl-Sarakhsi đã đọc cho học trò chép một phần Al-Mabsut khi bị giam. Tiểu sử còn thuật rằng ông ở dưới một cái giếng, học trò ở trên chép điều ông đọc; mất tự do không cắt đứt việc giúp người khác học. (Tiểu sử Al-Sarakhsi, Dar al-Ifta Ai Cập; Al-Jawahir al-Mudiyyah.) Ibn al-Qayyim viết một phần Zad al-Ma‘ad trong chuyến đi xa sách vở mình; chính lời mở đầu tác phẩm nhắc hoàn cảnh ấy. Ibn Taymiyyah viết về những ý nghĩa Qur’an trong tù. (Ibn ‘Abd al-Hadi, Al-‘Uqud ad-Durriyyah, phần các tác phẩm.) Trở ngại có thể đổi phương thức cống hiến mà không cắt ý muốn làm.\n\nNhững đường truyền đạt đã thay đổi khi bị ngăn cản. Trong cuộc đời Thiên Sứ ﷺ có việc kêu gọi tại Makkah, ra Ta’if, rồi di cư Madinah; các Sahabah từng di cư sang Abyssinia. Một lối đóng không phải cuối việc truyền đạt; nỗ lực không dừng ở những phương tiện đã thử. Trong cuộc thương lượng tại Hudaybiyyah, Thiên Sứ ﷺ nhờ Budayl chuyển đến Quraysh lời đề nghị đình chiến. Về trường hợp họ từ chối đề nghị ấy, Người nói: «Nếu họ từ chối, Ta xin thề trước Đấng nắm giữ sinh mạng Ta trong tay, Ta nhất định sẽ chiến đấu với họ vì sứ mạng này cho đến khi Ta hy sinh cả mạng sống.» (Al-Bukhari 2731–2732; diễn nghĩa).\n\nĐằng sau mỗi sự vững vàng là hành trình rèn mình người chỉ ngưỡng mộ kết quả có thể không thấy. Có người ước địa vị tử đạo, tin mừng dành cho người ấy và việc mọi người nhắc một kết thúc tốt, nhưng không muốn cống hiến trên con đường đến điều mình ước. Allah phán: «Quả thật, các ngươi đã từng mong muốn được chết (trên chiến trường như một tử đạo cho chính nghĩa của Allah) trước khi các ngươi gặp nó (cái chết). Giờ đây, các ngươi thực sự đã nhìn thấy nó trong lúc các ngươi đang đứng nhìn (trận chiến).» (3:143). Câu Kinh đưa trái tim từ việc treo trách nhiệm vào sự tồn tại của người khác trở về lựa chọn chân thật và cống hiến, trước khi ngày tiếc nuối về những kẻ mình theo đến.\n\nCâu 32\n\n«Những tên cường bạo đáp lời những kẻ yếu thế, nói: “Há bọn ta đã ngăn cản các ngươi theo chỉ đạo sau khi nó đã đến với các ngươi chăng? Không, chính các ngươi mới là những kẻ tội lỗi.”» (34:32)\n\nNhững kẻ kiêu ngạo không chịu gánh một mình trách nhiệm của người theo. Họ chất vấn việc bị quy là đã ngăn người theo khỏi sự hướng dẫn sau khi nó đến. Theo lời biện hộ của họ, người theo đã tự chọn điều họ kêu gọi và thấy việc đi theo ấy hợp với ham muốn, lợi ích của mình. Vì vậy, họ nói: «Không, chính các ngươi mới là những kẻ tội lỗi.» (34:32).\n\nThuật lại lời đáp ấy không xóa tội mưu kế của họ; câu tiếp theo sẽ phơi bày nó. Nhưng điều ấy cho thấy sự hiện diện của người tô đẹp điều sai không xóa lựa chọn của người nhận. Bên cạnh họ từng có những người cũng nghe lời gọi chân lý nhưng đáp lại, chịu tổn thương mà vẫn kiên định. Một số hoàn cảnh chung mà phản ứng khác nhau cho thấy không thể lấy riêng sự có mặt của thủ lĩnh làm cớ tuyệt đối rằng mình không thể tin.\n\nLời «sau khi nó đã đến với các ngươi» (34:32) càng tác động mạnh. Sự hướng dẫn không còn là tin bị che khuất: nó đã đến rồi họ mới chọn điều trái. Khi đức tin hòa vào trái tim, sức mạnh của nó không đo bằng tiền đối thủ nắm.\n\nTrong cuộc đối thoại với Abu Sufyan, Heraclius hỏi người theo Thiên Sứ là giới danh giá hay người yếu thế. Ông được trả lời rằng người yếu thế theo Người, họ ngày càng đông, và không ai vào đạo rồi bỏ vì bất bình với tôn giáo. Ông nói đó là tình trạng của đức tin khi sự ngọt lành của nó hòa vào trái tim. (Al-Bukhari 7.)\n\nTừ đây, có
