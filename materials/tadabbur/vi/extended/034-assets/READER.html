<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suy ngẫm về chương Saba’</title><style>body{margin:0;background:#f7f5ee;color:#242d28;font:19px/1.8 'Segoe UI',Arial,sans-serif}header,main,section{max-width:780px;margin:auto;padding:36px 34px}header{border-bottom:1px solid #d6d9cf;font-family:'Segoe UI',Arial,sans-serif}h1{font-size:28px;line-height:1.3;margin:0 0 18px}button{font:600 16px 'Segoe UI',Arial,sans-serif;background:#245b49;color:white;border:0;padding:12px 22px;border-radius:8px;cursor:pointer}nav{font-size:15px}a{color:#245b49}#reader,#notes-entries,#source-list,#sources pre{white-space:pre-wrap;overflow-wrap:anywhere}.source-link{color:inherit;text-decoration:none;border-bottom:1px dotted #8d9f92}.source-link:hover{background:#e5eddf}section{border-top:1px solid #d6d9cf}.note-heading{font:bold 18px 'Segoe UI',Arial,sans-serif;color:#245b49}#sources pre{font:14px/1.7 'Segoe UI',Arial,sans-serif}small{font-size:14px;margin-left:14px}h2{font:600 24px 'Segoe UI',Arial,sans-serif}:target{scroll-margin-top:30px;background:#eef3e7}@media(max-width:650px){header,main,section{padding:24px 20px}body{font-size:18px}}</style><header><h1>Suy ngẫm về chương Saba’</h1><button id="copy-reader">Sao chép bài học</button><small id="copy-status"></small><nav><a href="#notes">Ghi chú</a> · <a href="#sources">Nguồn và ấn bản</a></nav></header><main id="reader"></main><section id="notes"><h2>Ghi chú</h2><button id="copy-notes">Sao chép ghi chú</button><small id="notes-copy-status"></small><div id="notes-entries"></div></section><section id="sources"><h2>Nguồn và ấn bản</h2><pre id="publication-text"></pre><div id="riyadh-source">Tóm Lược Riyadh Al-Saaliheen — bản HTML, Islamcontent.</div><div id="source-list"></div></section><script>const data={"locale": "vi", "paragraphs": [{"id": "P001", "text": "Suy ngẫm về chương Saba’"}, {"id": "P002", "text": "Chương được mặc khải tại Makkah • 54 câu"}, {"id": "P003", "text": "Nội dung dựa trên các bài giảng giải chương Saba’ của Tiến sĩ Ahmad ‘Abd al-Mun‘im, theo sáu bản chép lời giảng được cung cấp."}, {"id": "P004", "text": "Bản này gồm toàn bộ các câu của chương và phần giảng giải trong tư liệu gốc. Những lời giải thích nằm rải rác được tập hợp về đúng chỗ; các cách hiểu, dẫn chứng và ví dụ được giữ lại trong lời văn giảng giải đã biên tập."}, {"id": "P005", "text": "Văn bản Qur’an tiếng Ả Rập trong tư liệu gốc: dự án Tanzil, phiên bản 1.1. Các bản dịch ý nghĩa được ghi nguồn riêng."}, {"id": "P006", "text": "© 2007–2026 Tanzil Project · CC BY 3.0 · https://tanzil.net"}, {"id": "P007", "text": "«Nhân danh Allah, Đấng Độ Lượng, Đấng Khoan Dung» (1:1)"}, {"id": "P008", "text": "Câu 1"}, {"id": "P009", "text": "«Alhamdulillah, Đấng mà mọi vật trong các tầng trời và mọi vật trong trái đất đều là của Ngài, Đấng mà mọi lời ca ngợi và tán dương ở Đời Sau đều thuộc về một mình Ngài. Ngài là Đấng Sáng Suốt, Thông Toàn.» (34:1)"}, {"id": "P010", "text": "Lời ca ngợi Allah mở đầu cách suy ngẫm về chương này. Trước khi nói đến sức mạnh, tiền của và mưu kế của những kẻ sống xa hoa, chương đưa trái tim trở về sự thật về quyền sở hữu: «mọi vật trong các tầng trời và mọi vật trong trái đất đều là của Ngài» (34:1). Những gì tạo vật đang nắm giữ chưa từng thoát khỏi quyền cai quản của Thượng Đế. Chính Ngài tạo ra chúng, sở hữu chúng và có toàn quyền định đoạt.\n\nTừ đó, người có đức tin nhìn cảnh mình bị chèn ép một cách sáng suốt. Ưu thế về tiền của và trang bị của những kẻ theo điều sai có thể khiến một số người tuyệt vọng, rút lui, thỏa hiệp hoặc đổi hướng dù trước đó họ đang đi đúng đường. Người yếu thế cũng có thể bị thử thách đến mức tưởng rằng lẽ phải thuộc về kẻ mạnh. Chương này củng cố người đang làm việc vì đức tin, đánh thức người bị sức mạnh làm cho choáng ngợp và nhắc kẻ kiêu ngạo rằng điều họ tự đắc chỉ là một ân huệ có thể bị thu lại.\n\nĐó là một tác động của Qur’an trong đời sống. Qur’an được mặc khải đến những trái tim đang đối mặt với vấn đề của bản thân, gia đình, xã hội và cuộc đấu tranh với điều sai. Nhu cầu của họ không chỉ là hiểu những từ ngữ khó. Về việc mặc khải từng phần, Allah phán: «như thế là để TA củng cố tấm lòng của Ngươi (Muhammad)» (25:32). Nếu trái tim Thiên Sứ Muhammad ﷺ còn được củng cố bằng mặc khải, những người sau Người càng cần ánh sáng ấy. Allah cũng mô tả tác động của một chương đối với người có đức tin: «đối với những người có đức tin, điều đó đã làm cho họ gia tăng thêm đức tin và họ rất đỗi vui mừng» (9:124). Hiểu lời giảng giải mở ra ý nghĩa; sau đó, sức sống, ánh sáng và sự hướng dẫn ấy phải thể hiện trong niềm xác tín, hành động và cách đánh giá mọi việc.\n\nCó năm chương mở đầu bằng lời ca ngợi: Al-Fatihah, Al-An‘am, Al-Kahf, Saba’ và Fatir. Đặc tính được nhắc ngay sau lời ca ngợi soi sáng một phần mục đích của mỗi chương. Al-Fatihah mở đầu: «Alhamdulillah (xin tạ ơn, ca ngợi và tán dương Allah), Thượng Đế của vũ trụ và vạn vật.» (1:2), rồi đến lời cầu xin được dẫn theo con đường ngay chính. Nhờ ân huệ và sự hướng dẫn của Thượng Đế, con người được cứu khỏi cơn giận và sự lầm lạc. Al-An‘am mở đầu: «Alhamdulillah, Đấng đã tạo hóa các tầng trời và trái đất và làm ra bóng tối (ban đêm) và ánh sáng (ban ngày).» (6:1). Người bề tôi nhớ đến ân huệ được chỉ rõ và phân biệt đúng sai, trong khi chương cũng phơi bày sự ngu muội của việc thờ phụng đa thần, đến mức giết cả con mình. Al-Kahf mở đầu: «Alhamdulillah, Đấng đã ban xuống Kinh Sách cho người bề tôi của Ngài và không làm cho Nó quanh co.» (18:1). Giữa những thử thách về quyền lực, tiền của và tri thức, người có đức tin ca ngợi Thượng Đế vì Kinh Sách hướng dẫn mình. Còn ở đây, trước bao phương tiện khiến những kẻ theo điều sai tự mãn, ta ca ngợi Allah vì toàn bộ quyền sở hữu đều thuộc về Ngài.\n\nCa ngợi là tán dương Allah vì Ngài xứng đáng với mọi lời tán dương nhờ các thuộc tính hoàn hảo của Ngài. Điều đó không tùy thuộc vào việc người bề tôi có hiểu ân huệ trong từng việc xảy đến hay không. Còn biết ơn gắn với sự ban ơn và đối đãi tốt đẹp. Ta ca ngợi Ngài khi có thức ăn cũng như khi thiếu ăn, trong cơn túng quẫn và sau khi vượt qua nó, trước khi có điều kiện vững vàng và sau khi có được điều ấy. Tầm nhìn hạn hẹp hoặc lòng ham muốn những điều trước mắt có thể che khuất lẽ khôn ngoan, nhưng không làm Allah mất đi sự xứng đáng được ca ngợi.\n\nTheo bản thuật của ‘Aishah: «Khi thấy điều mình yêu thích, Thiên Sứ của Allah ﷺ nói: “Mọi lời ca ngợi đều thuộc về Allah. Nhờ ân huệ của Ngài mà những việc thiện được trọn vẹn.” Khi thấy điều mình không thích, Người nói: “Mọi lời ca ngợi đều thuộc về Allah trong mọi hoàn cảnh.”» (‘Aishah; Ibn Majah 3803; Darussalam: yếu).\n\nViệc nhắc các tầng trời trước đưa tầm nhìn ra khỏi sức mạnh chật hẹp trên mặt đất, hướng đến sự bao la trong vương quyền của Allah. Dù máy móc và phương tiện lớn đến đâu, tài sản của con người vẫn nhỏ bé trước những thiên thể và chân trời họ không thể bao quát. Ngoài thế giới nhìn thấy, còn có thế giới vô hình, các thiên thần và Đời Sau. Vì thế, đừng giới hạn cách đánh giá sự thật vào phần mắt mình nhìn được.\n\nRồi đến lời: «mọi lời ca ngợi và tán dương ở Đời Sau đều thuộc về một mình Ngài» (34:1). Ở đó, những sự thật về lẽ khôn ngoan và sự thưởng phạt từng bị che khuất ở đời này được phơi bày; việc Allah xứng đáng được ca ngợi trở nên rõ ràng. Tương tự là lời: «Đấng Toàn Quyền của Ngày Thưởng Phạt» (1:4). Allah sở hữu tất cả mọi ngày, nhưng trong Ngày Thưởng Phạt, quyền sở hữu ấy hiện rõ đến mức không ai còn nhận mình có quyền lực bên cạnh Ngài.\n\nỞ đời này, người bề tôi có thể bối rối trước việc một người có đức tin bị thử thách hoặc một kẻ bất công được trì hoãn. Khi kết quả cuối cùng lộ rõ, họ hiểu rằng điều từng tưởng là bị hạ nhục lại là được nâng cao; có sự trì hoãn mở lối cho sám hối, cũng có sự trì hoãn khiến tội lỗi tăng thêm. Allah phán: «Chẳng qua TA trì hoãn (việc trừng phạt) là để cho họ gia tăng thêm tội lỗi» (3:178). Một hình ảnh giúp hiểu sự sáng tỏ sau điều từng khó hiểu là: «Đó là ý nghĩa về những điều mà Ngươi đã không thể nhẫn nại được.» (18:82). Trong các cách hiểu về lời «(Đó là) Ngày mà Ngài gọi các người (từ cõi mộ) rồi các người sẽ liền (đứng dậy) đáp lại lời gọi bằng lời tạ ơn Ngài» (17:52), có cách hiểu rằng khi được phục sinh, tạo vật thừa nhận sự vĩ đại của Thượng Đế, sau khi những gì che khuất điều ấy đã tan đi.\n\nÂn huệ rộng lớn và sự thưởng phạt công bằng của Ngài còn thể hiện ở việc một điều thiện được nhân từ mười đến bảy trăm lần, một điều xấu chỉ bị ghi là một, và việc từ bỏ điều xấu còn có thể được ghi thành điều thiện. Ở phần tiếp theo của bản thuật về cách ghi nhận việc thiện và việc xấu, có lời: «Trước Allah, chỉ ai tự đẩy mình đến chỗ diệt vong mới phải diệt vong.» (Ibn ‘Abbas; Muslim 131.02, tiếp theo 131.01; diễn nghĩa). Trong việc cầu thay, Thiên Sứ ﷺ phủ phục trước Thượng Đế; Allah mở cho Người những lời ca ngợi để Người tán dương Ngài. (Al-Bukhari 4712.) Lời ca ngợi hiện diện khi sự thật được phơi bày và khi bắt đầu phân xử giữa tạo vật.\n\nPhần mở đầu kết bằng: «Ngài là Đấng Sáng Suốt, Thông Toàn.» (34:1). Con người có thể sở hữu nhiều của cải nhưng sử dụng sai chỗ vì thiếu hiểu biết hoặc dại dột. Còn quyền sở hữu của Allah luôn đi cùng sự khôn ngoan hoàn hảo và tri thức bao trùm. Khôn ngoan là đặt sự vật đúng chỗ; sự am tường là biết thực chất và kết quả của chúng. Với con người, một bác sĩ học kiến thức rồi còn cần kinh nghiệm thực hành. Trong câu chuyện về chuyến đi đêm và thăng thiên, Musa đã khuyên Thiên Sứ ﷺ trở lại thưa với Thượng Đế về số lễ nguyện, dựa trên kinh nghiệm của mình khi hướng dẫn con cháu Israel. (Al-Bukhari 3207.) Còn Allah không tiếp thu tri thức qua trải nghiệm, cũng không chờ một việc xảy ra rồi mới biết kết quả. Ngài biết điều đã xảy ra, điều sẽ xảy ra và cả điều không xảy ra: nếu nó xảy ra thì sẽ như thế nào.\n\nĐấng điều hành những thử thách và sự đổi thay của các điều kiện mà người có đức tin chứng kiến chính là Đấng sở hữu mọi vật, Đấng Khôn Ngoan, Am Tường. Sự an lòng của họ dựa trên hiểu biết ấy, dù họ chưa thể nắm hết từng lẽ khôn ngoan."}, {"id": "P011", "text": "Câu 2"}, {"id": "P012", "text": "«Những gì chui vào lòng đất, những gì nhô lên khỏi mặt đất, những gì rơi xuống từ trên trời và những gì bay lên trời, Ngài đều biết rõ về chúng. Và Ngài là Đấng Hằng Khoan Dung, Hằng Tha Thứ.» (34:2)"}, {"id": "P013", "text": "Sau quyền sở hữu bao trùm là tri thức bao trùm. Câu Kinh mở ra trước trái tim hình ảnh một vũ trụ không ngừng vận động: những gì đi vào đất, đi ra từ đất, từ trời xuống và lên trời. Điều này không chỉ giới hạn ở cảnh mưa rơi, cây mọc quen thuộc với mắt người. Không một hạt bụi, giọt nước hay chuyển động kín đáo nào nằm ngoài sự hiểu biết của Allah. Mọi bổng lộc, ân huệ hay hình phạt được ban xuống; mọi lời cầu xin, tôn vinh, ca ngợi hay việc làm được đưa lên, đều nằm trong tri thức của Ngài.\n\nNgài biết cả điều thiện và điều xấu được ghi trong hành động của bề tôi, đến cả một ánh nhìn và sự nghi ngờ xấu ẩn trong lòng người nhìn. Tuy nhiên, việc tội lỗi được ghi chép không có nghĩa chúng được đưa lên để được chấp nhận. Allah phán: «Mọi lời nói tốt đẹp sẽ bốc lên tận Ngài và mọi việc làm phúc thiện sẽ tâng bốc nó» (35:10). Trong lời giảng, việc đi lên ở đây gắn với sự nâng lên và được Allah chấp nhận. Nếu con người phải đếm hết những gì đi vào, đi ra, xuống và lên chỉ trong một khoảnh khắc, họ cũng bất lực. Còn tri thức của Allah không bị việc này làm xao lãng việc khác.\n\nTrái tim cần tầm nhìn rộng ấy khi bị hoàn cảnh bó hẹp. Có người phóng đại quyền lực của một kẻ bất công đến mức tưởng rằng cả vũ trụ phụ thuộc vào việc kẻ đó còn sống hay đã chết, trong khi hắn chỉ là tạo vật yếu đuối, có thể bị một nguyên nhân rất nhỏ làm cho bất lực. Việc củng cố tinh thần không phải là điều nằm ngoài trách nhiệm mang thông điệp. Khi được cử đến Pha-ra-ông, Musa cầu xin được mở rộng lòng, được thuận lợi trong công việc và được tháo gỡ trở ngại trong lời nói. Musa và Harun thưa: «Cả hai (Musa và Harun) thưa: “Lạy Thượng Đế của bầy tôi! Quả thật, bầy tôi sợ rằng hắn (Pha-ra-ông) sẽ có hành động quá quắt hoặc tàn bạo với bầy tôi.”» (20:45). Hai vị được đáp: «(Allah) phán: “Hai ngươi đừng sợ! Quả thật TA luôn ở cùng với hai ngươi. TA nghe và thấy (hết mọi việc).”» (20:46). Hai vị vốn biết Allah nghe và thấy, nhưng ngay trong hoàn cảnh sợ hãi ấy, họ cần sự củng cố đặc biệt này. Vì vậy, ta đọc mặc khải nhiều lần để niềm xác tín về điều đã biết được làm mới trong lòng và bước chân được vững vàng.\n\nTrong những gì lên và xuống còn có hành động của bề tôi và bổng lộc của họ. Nếu ở đời này mọi việc đều được thưởng phạt ngay lập tức và đầy đủ, mỗi tội đều nhận hình phạt tương ứng, thì sẽ không còn cảnh con người vẫn được an lành dù còn thiếu sót như ta đang thấy. Allah phán: «Nếu Allah bắt phạt nhân loại cho tội lỗi mà họ đã phạm thì Ngài đã không chừa trên mặt đất bất kỳ một loại sinh vật nào sống sót» (35:45). Nhưng đây là cõi được trì hoãn và chịu thử thách; sự thưởng phạt trọn vẹn thuộc về một ngày khác.\n\nHadith cho biết không ai kiên nhẫn hơn Allah trước lời xúc phạm Ngài nghe thấy: con người gán con cái cho Ngài, còn Ngài vẫn ban cho họ bổng lộc và sức khỏe. (Al-Bukhari 6099.) Điều đó giúp thấy sự phù hợp của lời: «Và Ngài là Đấng Hằng Khoan Dung, Hằng Tha Thứ.» (34:2). Dù biết hết mọi việc họ làm, Ngài không cắt bổng lộc sau mỗi tội lỗi, mà thương xót, trì hoãn và tha thứ. Theo một khía cạnh khác, sự điều hành và ban tặng ấy đòi hỏi lòng biết ơn lớn lao, nhưng con người lại thiếu sót; Ngài vẫn đối đãi với họ bằng lòng thương xót và sự tha thứ. Sự khác biệt giữa những người hành động để biết ơn và những người quay lưng với ân huệ sẽ thể hiện qua gia đình Dawood và dân Saba’. Đừng để việc tiếp tục được an lành làm mình quên bổn phận đối với Đấng Ban Ơn."}, {"id": "P014", "text": "Câu 3"}, {"id": "P015", "text": "«Những kẻ vô đức tin nói: “Giờ Tận Thế sẽ không xảy đến cho chúng tôi.” Ngươi (hỡi Thiên Sứ) hãy nói với họ: “Không, thề bởi Thượng Đế của Ta, Đấng biết điều vô hình, chắc chắn Giờ Tận Thế sẽ xảy đến cho các người. Không một vật gì trong các tầng trời cũng như không một vật gì trong trái đất nằm ngoài tầm kiểm soát của Ngài, cho dù đó chỉ là sức nặng của một hạt nguyên tử; và không một vật gì dù nhỏ hay lớn hơn (hạt nguyên tử) mà lại không được ghi sẵn trong một Quyển Sổ rõ ràng.”» (34:3)"}, {"id": "P016", "text": "Sau khi làm rõ quyền sở hữu, tri thức và sự khôn ngoan, chương nêu lời những kẻ phủ nhận: «Giờ Tận Thế sẽ không xảy đến cho chúng tôi» (34:3). Ở đây, sự phản đối không nhắm vào từng chi tiết của trời đất mà bám vào Đời Sau. Việc phải chịu xét xử cản lại ham muốn được làm bất cứ điều gì mình muốn, rồi cho rằng mọi hậu quả sẽ chấm dứt khi cuộc đời kết thúc. Qur’an vạch rõ động cơ ấy: «Không! Con người (phủ nhận sự Phục Sinh) vì muốn tiếp tục phạm tội ở phía trước.» (75:5).\n\nLời đáp vì thế trực tiếp và dứt khoát. Toàn câu cho thấy lời thề trong ngữ cảnh của nó: «Những kẻ vô đức tin nói: “Giờ Tận Thế sẽ không xảy đến cho chúng tôi.” Ngươi (hỡi Thiên Sứ) hãy nói với họ: “Không, thề bởi Thượng Đế của Ta, Đấng biết điều vô hình, chắc chắn Giờ Tận Thế sẽ xảy đến cho các người. Không một vật gì trong các tầng trời cũng như không một vật gì trong trái đất nằm ngoài tầm kiểm soát của Ngài, cho dù đó chỉ là sức nặng của một hạt nguyên tử; và không một vật gì dù nhỏ hay lớn hơn (hạt nguyên tử) mà lại không được ghi sẵn trong một Quyển Sổ rõ ràng.”» (34:3). Lời thề nhân danh Thượng Đế gợi nhớ quyền nuôi dưỡng và sự khôn ngoan của Ngài. Đấng đã nuôi dưỡng bề tôi bằng ân huệ và ban sự hướng dẫn không để mọi việc kết thúc vô nghĩa. Bị áp bức không phải là kết cục cuối cùng của người chịu oan. Những người bị ném xuống hào lửa không kết thúc ở ngọn lửa ấy: người có đức tin kiên định sẽ được phần thưởng trong Thiên Đàng.\n\nSự khẳng định mạnh mẽ trong lời đáp tương ứng với mức độ phủ nhận. Họ nói Giờ Tận Thế không đến với mình; lời đáp hướng thẳng đến chính họ, khẳng định Giờ Tận Thế chắc chắn sẽ đến với những người phủ nhận, bằng cả lời thề và cách nhấn mạnh trong tiếng Ả Rập. Việc xét xử không còn là chuyện nói về những người xa lạ: chính các người là đối tượng được nhắc đến. Đó là sự chính xác khi đối diện một nghi vấn: trả lời đúng chỗ vướng mắc, không để một phần nội dung của nó bị bỏ qua. Trong chương, mệnh lệnh “Hãy nói” được lặp lại trước những lời lẽ ngày càng nhiều, để mưu kế ngày đêm không độc chiếm việc hình thành nhận thức của mọi người.\n\nSau đó, Thượng Đế được mô tả là «Đấng biết điều vô hình» (34:3). Điều họ chưa thấy không vì vậy mà không tồn tại; Ngài biết nó. Lời tiếng Ả Rập diễn tả rằng không gì khuất khỏi tri thức Ngài. Không một hạt nhỏ nào trong trời đất, không điều gì nhỏ hơn hay lớn hơn thế, lại không được ghi trong một Quyển Sổ rõ ràng. Bản dịch phía trên diễn đạt bằng hình ảnh mọi vật đều trong tầm kiểm soát của Ngài; ở đây, lời giảng nhấn mạnh sự biết rõ, không hề bỏ sót.\n\nChi tiết ấy có hai mặt liên quan đến lời đáp cho việc phủ nhận phục sinh. Tri thức bao trùm mọi phần của tạo vật, dù chúng đã phân tán hoặc ẩn khuất, cho thấy việc tập hợp chúng không làm Ngài bất lực. Việc ghi đếm mọi hành động, dù rất nhỏ, cũng cắt đứt hy vọng thoát khỏi sự xét xử. Lời Luqman dạy con giúp ta hiểu cả hai mặt: «“Này con yêu dấu! Dẫu cho có một vật gì nhẹ bằng sức nặng của một hạt cải và dẫu cho nó có nằm trong đá hoặc trong các tầng trời hoặc dưới đất đi nữa thì Allah thừa khả năng mang nó ra ngoài (cho thiên hạ thấy). Bởi vì quả thật, Allah Rất Mực Tinh tế, Rất Mực Am Tường.» (31:16). Nếu hiểu vật nhỏ bằng hạt cải là một hành động kín đáo, thì Allah sẽ đưa nó ra để xét xử. Nếu nhìn vào vật ẩn trong đá hoặc giữa các chân trời, ta thấy quyền năng đưa nó ra và tri thức về vị trí của nó. Không hành động nào bị thất lạc; việc gom lại những gì phân tán không làm Ngài bất lực. Giờ Tận Thế mà họ phủ nhận sẽ đến bằng tri thức, quyền năng và sự khôn ngoan của Ngài."}, {"id": "P017", "text": "Câu 4"}, {"id": "P018", "text": "«(Mọi thứ được ghi trong quyển sổ) để Ngài ban thưởng cho những người có đức tin và hành thiện. Họ là những người sẽ được sự tha thứ và được ban cho bổng lộc thật vinh dự (Thiên Đàng).» (34:4)"}, {"id": "P019", "text": "Câu Kinh nêu một mục đích của việc Giờ Tận Thế đến: đức tin và việc thiện được đền đáp. Sự khôn ngoan của Allah không để người kiên nhẫn, cống hiến ngang bằng với người quay lưng; người đứng hành lễ và nhịn chay ngang bằng với người bất tuân. Ngay trong đời sống, ta cũng nhận ra sự khác biệt giữa người chăm chỉ trong công việc, học tập và người bỏ bê. Vậy sao lại nghĩ rằng cuộc đời mang trách nhiệm trước Allah cuối cùng sẽ xóa nhòa mọi khác biệt giữa người hành động và người không làm?\n\nDẫu vậy, người có đức tin không đến gặp Thượng Đế với sự tự mãn về việc mình làm. Sự đền đáp được mở đầu bằng tha thứ trước khi nói đến bổng lộc cao quý. Dù vâng phục đến đâu, họ vẫn chưa thể biết ơn cho xứng với mọi ân huệ của Allah và vẫn cần Ngài tha thứ cho thiếu sót.\n\nRồi đến bổng lộc cao quý. Có cách giải thích rằng điều cao quý ở đây là nó đến mà không cần vất vả, khó nhọc. Cư dân Thiên Đàng tìm thấy điều mình mong muốn, không phải chịu những việc đi lại, tìm kiếm, chờ đợi hay lo tiền bạc thường gắn với nhu cầu ở đời này. Cũng có cách giải thích rằng đó là bổng lộc không ngừng: niềm vui không bị sự cạn kiệt nối tiếp. Họ vừa được tha thứ thiếu sót, vừa được ban tặng để tôn vinh."}, {"id": "P020", "text": "Câu 5"}, {"id": "P021", "text": "«Những ai cố gắng chống phá các lời mặc khải của TA thì chắc chắn sẽ phải chịu một sự trừng phạt đau đớn.» (34:5)"}, {"id": "P022", "text": "Đối diện những người có đức tin là một nhóm không chỉ quay lưng mà còn dốc sức chống lại các dấu hiệu của Allah. Dốc sức là bỏ công và dùng hết khả năng. Vì thế, đừng hình dung việc ngăn cản con đường của Allah chỉ là trò đùa thoáng qua hay một câu nói không có kế hoạch phía sau. Người làm việc ấy có thể bỏ tiền, thời gian, thức đêm và nghiên cứu để phá hỏng nguồn hướng dẫn của mọi người.\n\nMột hình thức là sắp đặt chuyện giải trí đúng vào giờ thờ phượng, giữ khán giả lại sau bữa ăn đến mức họ ngại đứng dậy hành lễ, hoặc kéo sự chú ý đi vào lúc họ lẽ ra có thể đến với Qur’an. Tác động của một chương trình không tách rời thời điểm của nó và phần đời nó chiếm lấy ở người xem. Allah phán: «Nếu các ngươi đau đớn (bởi thương vong) thì bọn họ cũng bị đau đớn (bởi thương vong) tương tự như các ngươi» (4:104). Nỗ lực dành cho điều sai là một thực tế mà người trình bày lẽ phải cần hiểu.\n\nỞ đây, những gì bị nhắm đến là các dấu hiệu của Allah. Có cách hiểu rằng đó là các lời mặc khải, phù hợp với câu tiếp theo nhắc đến «những điều được ban xuống cho Ngươi (hỡi Thiên Sứ) từ Thượng Đế của Ngươi» (34:6); cũng có cách hiểu bao gồm những bằng chứng Allah đặt trong vũ trụ. Giới từ trong cách diễn đạt tiếng Ả Rập gợi sự đào sâu để công kích, chứ không chỉ lướt qua hời hợt. Cắt con người khỏi nguồn đức tin còn nghiêm trọng hơn tranh giành một món tài sản có thể đổi chủ hoặc một thế lực có thể tiêu tan. Tương tự là lời của Jinn: «Quả thật, kẻ ngu ngốc (Iblis) trong chúng ta đã nói về Allah những điều quá đáng cho Allah.» (72:4). Làm sai lệch lời nói về Allah là làm hỏng gốc rễ mối liên hệ với Ngài.\n\nBản dịch câu 34:5 mô tả nhóm người ấy bằng cụm «cố gắng chống phá các lời mặc khải của TA» (34:5). Theo một cách giải thích của lời giảng về cách đọc معاجزين, họ muốn làm ra vẻ các dấu hiệu ấy bất lực, không đưa đến điều chúng hướng dẫn. Còn có cách đọc معجّزين, được lời giảng giải thích là làm người khác chùn bước và ngăn họ đón nhận mặc khải. Cụm tiếng Việt vừa dẫn là cách diễn đạt của bản dịch được chọn; hai cách giải thích về cách đọc được nêu riêng. (Ibn al-Jazari, An-Nashr fi al-Qira’at al-‘Ashr, phần các cách đọc trong chương Al-Hajj.) Hai hướng ngăn cản gặp nhau: gieo nghi vấn để bóp méo mặc khải và dùng ham muốn để khiến người ta không đến được với nó. Vai trò ấy có thể chia ra giữa người công kích Qur’an, người công kích Sunnah cùng những người truyền lại Sunnah và người làm cạn thời gian của người khác trong chuyện giải trí.\n\nHai câu sau cung cấp ngữ cảnh cho những cách giải thích về việc chia phần: «Giống như việc TA đã từng cảnh báo với những kẻ đã chia rẽ tôn giáo của chúng.» (15:90); «Đó là những kẻ đã phân chia Qur’an thành nhiều phần (chúng nói: đây là ma thuật, hoặc bói toán hoặc thơ ca).» (15:91). Có cách hiểu rằng họ chia nhau các lời công kích: người gọi Thiên Sứ là nhà thơ, người gọi là kẻ mất trí, người gọi là thầy bói. Cũng có cách hiểu liên hệ từ ngữ ấy với việc thề thốt. Theo cách hiểu về sự phân chia lời lẽ, nhiều lời công kích khác nhau cùng hướng đến việc chặn Qur’an, dù cách diễn đạt của mỗi người không giống nhau. Bản dịch được trích nêu cách hiểu riêng của nó; những cách giải thích trên là các cách hiểu được lời giảng nhắc đến.\n\nViệc ngăn người ta nghe và cố tình gây nhiễu cùng xuất hiện trong lời: «Những kẻ vô đức tin khuyên bảo nhau rằng “Mọi người đừng thèm nghe Qur’an này, hãy nói chuyện ồn ào và gây náo động (khi Nó được xướng lên), như thế có lẽ các ngươi sẽ nắm ưu thế (trong việc ngăn Muhammad xướng Nó và kêu gọi đến với Nó).”» (41:26). Họ không chỉ muốn người ta quay lưng, mà còn muốn lấp chỗ ấy bằng tiếng ồn để Qur’an không chạm được đến trái tim. Câu «Các ngươi vui đùa và không quan tâm.» (53:61) cũng được giải thích, theo một cách hiểu, là họ hát khi nghe Qur’an, đổi việc lắng nghe điều nhắc nhở mình lấy sự chìm đắm trong vui chơi.\n\nViệc những kẻ ngăn cản yêu thế gian không có nghĩa họ không chịu chi nó ra để cản người khác đến với lẽ phải. Họ có thể thấy sự lan rộng của tôn giáo đe dọa những gì mình muốn giữ, nên bỏ ra một phần điều mình yêu thích để giữ phần còn lại. Allah phán: «Quả thật, những kẻ vô đức tin thường chi dùng tài sản của chúng vào việc ngăn chặn con đường chính đạo của Allah. Vì vậy, chúng sẽ tiếp tục chi dùng tài sản của chúng (vào việc đó), rồi đây chúng sẽ phải hối tiếc» (8:36). Bởi thế, họ bị cảnh báo về hình phạt đau đớn nghiêm khắc. Một cách giải thích từ ngữ về hình phạt ở đây là mức độ dữ dội của nó. Họ muốn che khuất sự hướng dẫn đối với cả cộng đồng, giữ cộng đồng làm tù nhân của ham muốn và sự đánh tráo. Mức độ phá hoại ấy vượt xa một tội lỗi chỉ liên quan đến riêng bản thân, và giúp hiểu lời cảnh báo nghiêm khắc theo sau sự mô tả về nỗ lực của họ."}, {"id": "P023", "text": "Câu 6"}, {"id": "P024", "text": "«Những ai được ban cho kiến thức thì thấy những điều được ban xuống cho Ngươi (hỡi Thiên Sứ) từ Thượng Đế của Ngươi là Chân Lý và hướng dẫn (nhân loại) đến con đường của Đấng Toàn Năng, Đáng Ca Tụng.» (34:6)"}, {"id": "P025", "text": "Dù bao công sức được bỏ ra để bóp méo mặc khải, lẽ phải vẫn sáng rõ với người được ban tri thức về nó. Qur’an không mô tả người có đức tin như thể chính họ phải tạo ra sự sáng rõ của các câu Kinh. Họ tin và làm việc thiện; tác động của Qur’an thể hiện trong đức tin, hành động và việc họ truyền đạt Nó. Còn người muốn phủ nhận sự hướng dẫn của Qur’an lại phải không ngừng tìm cách che khuất sự sáng rõ ấy.\n\nCách nói “nhìn thấy” diễn tả sự nhận biết chắc chắn, vững vàng trước sự đánh tráo. Những dấu hiệu mà đối thủ muốn làm ra vẻ bất lực hoặc mâu thuẫn lại được người có tri thức nhìn rõ là chân thật. Không phải ai giỏi tranh luận cũng sáng suốt giữa thử thách. Tri thức hữu ích ở đây gắn với mặc khải và dẫn đến nhận biết Allah. Chức danh hay nhiều thông tin không thể thay thế gốc rễ ấy. Người đã thấy rõ phải trình bày điều mình biết. Khi những người yếu thế thú nhận ảnh hưởng của việc «đã bày mưu cả đêm lẫn ngày» (34:33), ta thấy cần biết bao một nỗ lực liên tục để gỡ bỏ sự mập mờ, không để đầu óc mọi người thành miếng mồi cho tuyên truyền.\n\nToàn câu cho thấy mối liên hệ giữa tri thức, chân lý và sự hướng dẫn: «Những ai được ban cho kiến thức thì thấy những điều được ban xuống cho Ngươi (hỡi Thiên Sứ) từ Thượng Đế của Ngươi là Chân Lý và hướng dẫn (nhân loại) đến con đường của Đấng Toàn Năng, Đáng Ca Tụng.» (34:6). Trong nguyên bản tiếng Ả Rập, cách đặt đại từ phân cách không chỉ nói rằng điều được ban xuống là chân lý mà còn nhấn mạnh tính xác thực và riêng biệt của nó. Điều này phù hợp với một bối cảnh đầy những lời khẳng định cạnh tranh, đến mức người ta muốn khiến công chúng tuyệt vọng về khả năng biết sự thật, rồi nói rằng mình không tin ai, không biết nên theo ai. Người có tri thức không hòa tan sự hướng dẫn của Allah vào những lựa chọn trái ngược với nó.\n\nNhững kẻ phủ nhận đã bộc lộ mức độ khó chịu trước việc mặc khải này là chân lý khi nói: «Và hãy nhớ khi chúng thưa: “Ôi Allah! Nếu (Qur'an) này là Chân Lý do Ngài ban xuống thì xin Ngài hãy làm cho mưa đá đổ từ trên trời xuống đè lên chúng tôi hoặc mang một hình phạt đau đớn nào đến trừng phạt chúng tôi!”» (8:32). Họ không xin được hướng dẫn nếu đó là chân lý, mà chọn hình phạt thay vì thuận theo. Họ còn đòi: «Ngươi (hỡi Muhammad) hãy mang đến cho bọn ta một quyển Qur’an khác quyển này hoặc hãy thay đổi nó đi!» (10:15).\n\nLời «hướng dẫn (nhân loại)» (34:6) bổ sung một ý nghĩa thực hành. Người có tri thức thấy sự chân thật của Qur’an và thấy Nó hướng dẫn đời sống. Điều ấy đối diện với những người cố thuyết phục công chúng rằng giáo luật bất lực trong việc sửa chữa đời sống, hoặc các quy định về giao dịch, tiền bạc và xã hội không thể áp dụng. Qur’an hướng dẫn và tạo tác động thực tế khi con người tin và thực hành. Chân lý ấy không bị tách khỏi thành quả của việc đi theo.\n\nCon đường của Nó là «con đường của Đấng Toàn Năng, Đáng Ca Tụng» (34:6): ngay thẳng, dẫn đến Thượng Đế không ai thắng được, Đấng xứng đáng với mọi lời ca ngợi. Quyền năng đối diện với lời gán cho mặc khải sự bất lực; việc đáng ca ngợi đối diện với những thiếu sót người ta vu cho Nó. Trong những ý nghĩa của tên gọi “Đáng Ca Tụng” trong câu 34:6 có việc Ngài đáng được ca ngợi trong chính Ngài và trong hành động của Ngài, cũng như Ngài khen ngợi những việc các tôi tớ trung thành làm để vâng phục Ngài. Đi theo sự hướng dẫn của Ngài là con đường đến với sức mạnh và việc làm đáng ca ngợi. Ngay từ đầu chương, người có đức tin đã bắt đầu hành trình bằng lời ca ngợi Thượng Đế vì quyền sở hữu và sự khôn ngoan của Ngài."}, {"id": "P026", "text": "Câu 7"}, {"id": "P027", "text": "«Những kẻ vô đức tin (bảo nhau về Thiên Sứ một cách chế giễu và nhạo báng) nói: “Các người có muốn chúng tôi chỉ cho các người một người đàn ông, Y sẽ nói cho các người biết rằng khi các người (chết đi, thân xác các người) đã hoàn toàn mục rã thì các người chắc chắn sẽ được tạo hóa mới trở lại?!”» (34:7)"}, {"id": "P028", "text": "Lập trường của những kẻ phủ nhận chuyển từ việc tự mình chối bỏ Giờ Tận Thế sang lan truyền sự chối bỏ ấy. Ban đầu, họ nói: «Giờ Tận Thế sẽ không xảy đến cho chúng tôi» (34:3). Sau đó, họ quay sang lôi kéo người khác; toàn câu ghi cách giới thiệu đầy chế giễu của họ: «Những kẻ vô đức tin (bảo nhau về Thiên Sứ một cách chế giễu và nhạo báng) nói: “Các người có muốn chúng tôi chỉ cho các người một người đàn ông, Y sẽ nói cho các người biết rằng khi các người (chết đi, thân xác các người) đã hoàn toàn mục rã thì các người chắc chắn sẽ được tạo hóa mới trở lại?!”» (34:7).\n\nHọ không trình bày một vấn đề để tìm bằng chứng, mà dùng sự tò mò và nhạo báng để dẫn dắt người nghe: có một người mang tin lạ, rồi họ kể lời người ấy theo cách khiến người nghe tưởng rằng chỉ cần nghe đã đủ để bật cười. Việc nói đến “một người đàn ông” không xác định trong tiếng Ả Rập còn hàm ý hạ thấp vị thế, dù họ biết rõ đang nhắm đến ai. Cách dùng từ chỉ việc báo tin càng làm đậm vẻ kỳ lạ của câu chuyện.\n\nHọ không chỉ nói khi các người chết, mà mô tả: «khi các người (chết đi, thân xác các người) đã hoàn toàn mục rã» (34:7). Họ gợi ra cảnh các bộ phận phân tán đến cùng cực, rồi đặt nó đối diện với một sự tạo hóa mới để khiến đám đông cho là không thể. Người chế giễu tôn giáo cũng có thể làm tương tự: cắt một câu khỏi một quy định hoặc tin về Đời Sau rồi biến thành chuyện đùa, hay đặt hình ảnh một thân xác tan rã cạnh hình ảnh người ấy lúc còn sống. Cảm xúc đi trước việc xét bằng chứng. Qur’an vạch rõ gốc rễ của sự cho là khó tin ấy: «Y đưa ra hình ảnh thí dụ cho TA nhưng lại quên mất sự tạo hóa của mình (khi y đã được TA tạo ra từ cái không là gì). Y bảo: “Ai có thể làm sống lại những khúc xương khi chúng đã rã mục?”» (36:78). Người ấy chỉ chăm chăm vào xương mục, quên mất sự tạo dựng ban đầu mà câu hỏi cần trở về.\n\nKẻ dẫn người khác đi lạc không phải lúc nào cũng đưa ngay kết luận từ đầu. Họ có thể dựng cả một cảnh khiến người nghe tưởng mình tự phán đoán, trong khi thực ra đã bị dẫn tới đó. Trong câu chuyện Musa, những người kêu gọi tập hợp nói, trong ngữ cảnh của câu: «Và mọi người bảo nhau: “Các người không đi dự đại hội (để xem ai thắng trong cuộc so tài giữa Musa và các phù thủy) sao?”» (26:39); rồi họ nêu hướng đi mong muốn: «Có lẽ chúng ta sẽ theo các nhà phù thủy nếu họ thắng cuộc.» (26:40). Lựa chọn họ quảng bá là đi theo các nhà phù thủy nếu các nhà phù thủy thắng. Họ không mở cho mọi người khả năng theo Musa nếu chân lý được chứng tỏ ở phía Người.\n\nCũng bằng cách thu hẹp như vậy, ở đây họ chuẩn bị để dồn tin Thiên Sứ mang đến vào hai khả năng: nói dối hoặc mất trí, như câu tiếp theo nêu ra. Sự gợi tò mò và chế giễu trở thành bước dọn đường cho một quyết định mà họ muốn đám đông cảm thấy mình cùng góp phần tạo nên."}, {"id": "P029", "text": "Câu 8"}, {"id": "P030", "text": "«Phải chăng y đã nói dối rồi đổ thừa cho Allah hay là y bị quỷ ám? Không, những ai không tin tưởng nơi đời sau thì sẽ bị trừng phạt và lầm lạc rất xa.» (34:8)"}, {"id": "P031", "text": "Sau khi dùng sự khó tin và chế giễu để chuẩn bị tâm lý người nghe, họ giới hạn vấn đề vào hai khả năng: bịa lời về Allah hoặc bị mất trí đến mức nói điều người tỉnh táo không nói. Họ đã loại bỏ khả năng nói thật ngay từ cách đặt câu hỏi. Sự so sánh không thể công bằng khi kết quả họ không thích đã bị gạt đi trước lúc xem xét.\n\nKhi hỏi «Phải chăng y đã nói dối rồi đổ thừa cho Allah» (34:8), họ làm ra vẻ đang bảo vệ danh dự của Allah, để lời công kích trông như một hành động bảo vệ tôn giáo. Tương tự là lời Pha-ra-ông nói về Musa: «Ta thực sự sợ nó sẽ làm thay đổi tôn giáo của các ngươi hoặc nó sẽ gây nhiễu loạn trong xứ.» (40:26). Kiểu lời lẽ ấy có thể lan rộng và được nhiều người hưởng ứng vì tính kích động của nó. Nhưng đông người theo dõi không trở thành bằng chứng cho sự chân thật.\n\nQur’an đưa cái nhìn trở về đúng căn bệnh: «Không, những ai không tin tưởng nơi đời sau thì sẽ bị trừng phạt và lầm lạc rất xa.» (34:8). Sự rối loạn của họ không chỉ do gặp một tin lạ, mà bắt nguồn từ việc khước từ cõi họ phải chịu xét xử. Có cách giải thích rằng hình phạt là điều họ sẽ gặp ở Đời Sau, còn lầm lạc là tình trạng họ sống ở đời này. Cũng có cách giải thích rằng hình phạt bao gồm cả điều xảy đến với họ ở đời này.\n\nKhi không có đức tin vào sự thưởng phạt, con người có thể thấy một sự bất công rồi tưởng rằng lẽ phải đã hết đường: một người bị xâm hại, hoặc gia đình bị tổn thương, nhưng đằng sau sức mạnh của kẻ gây hại lại không có xét xử hay công lý. Cách hình dung ấy đè nặng lên người bị hại và mở cho kẻ gây hại ảo tưởng thoát tội. Đức tin vào Đời Sau giữ vững ý nghĩa của công lý khi nó chưa hiện ra và nối đời sống với sự khôn ngoan của Allah. Những gì một người làm hoặc phải chịu trong đời không phải là kết thúc không bao giờ được xét lại."}, {"id": "P032", "text": "Câu 9"}, {"id": "P033", "text": "«Lẽ nào họ không nhìn thấy những gì trước mắt và sau lưng họ từ trời đất?! Nếu muốn, TA đã cho đất nuốt chửng bọn họ hoặc cho một mảnh trời rơi xuống đè bọn họ. Quả thật, nơi sự việc đó là một dấu hiệu cho mỗi người bề tôi biết quay đầu ăn năn sám hối (với Allah).» (34:9)"}, {"id": "P034", "text": "Câu hỏi này đưa những người phủ nhận trở về với trời đất nằm trọn trong quyền sở hữu của Allah. Họ sống trong đó nhưng không thể ngăn Ngài định đoạt. Đấng sở hữu mặt đất có thể làm đất sụp nuốt họ; Đấng sở hữu bầu trời có thể khiến những mảnh từ trời rơi xuống họ. Không một nơi nào họ có thể chiếm riêng để trú khỏi quyền cai quản của Thượng Đế. Việc quen thuộc với cảnh vật xung quanh cũng không chứng minh rằng tình trạng ấy không thể thay đổi.\n\nLời cảnh báo nối với phần mở đầu chương. Những câu chuyện tiếp theo khiến ý nghĩa về quyền năng và quyền sở hữu trở nên nhìn thấy được qua từng ví dụ: Allah làm sắt mềm cho Dawood; điều khiển gió và Jinn phục vụ Sulayman; cho nguồn đồng chảy ra cho Người; ban cho một dân tộc vườn tược và đường đi an toàn, rồi lấy đi điều họ tự mãn khi họ quay lưng. Người đọc thấy cả việc ban cho lẫn thu lại. Quyền sở hữu không còn chỉ là một khái niệm trừu tượng.\n\nMột tác động đối với người có đức tin đang bị chèn ép là khi nhìn những ngọn núi Allah ra lệnh và chúng vâng phục, họ biết sự tổn thương mình phải chịu không do Thượng Đế bất lực. Allah phán: «Và nếu muốn, Allah có thể đích thân trừng phạt chúng, tuy nhiên, Ngài muốn dùng người này để thử thách người kia.» (47:4). Tất cả điều ấy chuẩn bị cho lời thách thức sau: «Các ngươi hãy cầu nguyện những kẻ mà các ngươi cho rằng (chúng là thần linh của các ngươi) ngoài Allah.» (34:22). Những thần linh được gán ghép đã thực hiện được việc nào trong số ấy? Ai sở hữu quyền ban những ân huệ này, hoặc đem chúng trở lại khi chúng bị thu hồi? Như vậy, lời cảnh báo gắn với các bằng chứng về quyền năng trong câu chuyện, rồi gắn với việc phơi bày sự bất lực của những đối tượng được cầu khấn ngoài Allah."}, {"id": "P035", "text": "Câu 10"}, {"id": "P036", "text": "«Quả thật, TA đã ban cho Dawood hồng phúc từ nơi TA, (và TA đã phán với núi non): “Hỡi núi non! Các ngươi hãy cùng với Y tán dương Allah” và chim chóc (TA cũng phán bảo chúng như thế), và TA đã hóa sắt thành mềm cho Y.» (34:10)"}, {"id": "P037", "text": "Ân huệ Allah ban cho Dawood được nhắc đến đúng lúc người có đức tin cần nhớ sự rộng lớn trong sự ban tặng của Thượng Đế. Tiền của và trang bị tập trung trong tay những kẻ theo điều sai không có nghĩa họ đã nắm hết mọi nguồn sức mạnh, hay kho ân huệ đã đóng cửa trước người có đức tin. Đấng làm sắt mềm cho Dawood và khiến gió phục vụ Sulayman có thể ban cho ai Ngài muốn. Sự khác nhau trong điều được ban không đến từ sự thiếu hụt quyền năng của Allah; người không nhận cùng một ân huệ cũng không nhất thiết có địa vị thấp hơn.\n\nVấn đề không hoàn toàn nằm ở việc thiếu tiền. Nếu chỉ tiền bạc đủ để dựng xây sứ mạng, thì có tiền đã đủ, dù thiếu những con người gánh vác bằng đức tin. Một câu chuyện được truyền lại từ ‘Umar giúp thấy ý này: trong một buổi họp, những người khác ước có vàng ngọc để chi dùng vì Allah, còn ông ước có những con người đứng lên lo việc của Ngài. (Ahmad, Fada’il as-Sahabah 1280; lời thuật về ‘Umar.) Tiền của và trang bị có thể đổi tay; gốc rễ sức mạnh mà đối thủ nhắm công kích là mặc khải và những gì Nó nuôi dưỡng trong con người.\n\nÂn huệ dành cho Dawood đi cùng lòng chuyên tâm thờ phượng của Người. Hadith kể rằng Adam nhìn thấy Dawood trong dòng dõi mình, yêu thích ánh sáng của Người và tặng Người bốn mươi năm tuổi thọ. (At-Tirmidhi 3076.) Về việc thờ phượng của Dawood, có lời: «Lễ\r\nSalah và sự nhịn chay được Allah yêu thích nhất là lễ Salah và sự nhịn chay của\r\nNabi Dawood.» (Riyadh Al-Saaliheen, mục 458; Al-Bukhari). Người cũng ăn từ công sức lao động đôi tay mình. (Al-Bukhari 2072.) Việc đọc sách Zabur được làm nhẹ nhàng đến mức Người có thể đọc xong trước khi người ta thắng yên các con vật để lên đường. (Al-Bukhari 3417.) Địa vị vua không làm Người xao lãng thờ phượng Thượng Đế hay lao động bằng đôi tay mình.\n\nMột thành quả của việc nỗ lực rèn mình là Allah khiến sự vâng phục từng khó khăn lúc đầu trở nên dễ dàng. Người gắn bó với Qur’an tìm được niềm thân thuộc và sự thuận lợi khi đọc, ghi nhớ mà người ít tiếp cận không có được. Sau một thời gian phải cố gắng, người ta cũng có thể quen việc đứng hành lễ đêm và thức dậy cho lễ Fajr.\n\nRồi mở ra cảnh Dawood tôn vinh Allah. Trong toàn câu: «Quả thật, TA đã ban cho Dawood hồng phúc từ nơi TA, (và TA đã phán với núi non): “Hỡi núi non! Các ngươi hãy cùng với Y tán dương Allah” và chim chóc (TA cũng phán bảo chúng như thế), và TA đã hóa sắt thành mềm cho Y.» (34:10). Núi và chim cùng hòa lời tôn vinh với Người, để người đang tôn vinh và tạo vật xung quanh cùng tưởng nhớ Allah. Sự tôn vinh Dawood qua ân huệ này đánh thức trái tim trước quyền năng của Đấng ra lệnh cho núi và núi vâng theo. Người có đức tin chịu tổn thương tại Makkah nhìn những ngọn núi quanh mình và biết Thượng Đế sở hữu chúng; sức mạnh con người không đưa chúng ra ngoài mệnh lệnh của Ngài.\n\nCảnh ấy đi cùng lời: «TA đã hóa sắt thành mềm cho Y» (34:10). Thứ vốn nổi tiếng cứng rắn trở nên dễ sử dụng trong tay Dawood. Người tạo hình nó nhẹ nhàng, có thể hình dung gần như bột nhào trong tay người làm bánh. Sự điều khiển tạo vật ấy không tách khỏi điều các câu Kinh nuôi dưỡng trong người đang làm việc vì tôn giáo của Allah. Đừng nói rằng bận kêu gọi, thăm nom người nghèo hay công việc chung nên không còn thời gian tưởng nhớ Allah và hành lễ đêm. Dawood là một vị Nabi và một vị vua, nhưng vẫn dành phần ấy cho việc thờ phượng Thượng Đế.\n\nGánh nặng càng lớn, trái tim càng cần điều trợ sức để mang nó. Vì vậy, Thiên Sứ ﷺ được bảo: «Ngươi hãy đứng (dâng lễ nguyện Salah) trong đêm trừ một ít thời gian.» (73:2); «Một nửa của đêm hoặc ít hơn một chút.» (73:3); «Hoặc thêm nữa; và Ngươi hãy đọc Qur’an với âm điệu nhịp nhàng, chậm rãi.» (73:4). Sau đó, mối liên hệ giữa việc hành lễ đêm lâu dài với trách nhiệm mang thông điệp được làm rõ: «Quả thật, TA sẽ truyền xuống cho Ngươi (Qur’an, và Nó là) lời nặng nề (vì trong đó chứa đựng các nghĩa vụ, các giới hạn, các qui định, các nghi thức và những điều khác).» (73:5). Sự vâng phục là hành trang cho công việc. Sai lầm là lấy chính công việc làm lý do cắt đứt nguồn hành trang ấy.\n\nViệc làm sắt mềm cũng không phải ân huệ không có mục đích. Allah phán về sắt: «Chúng Ta gửi \r\nxuống sắt với sức mạnh cố hữu lớn và nhiều lợi ích của nó cho loài \r\nngười, để Thượng Đế có thể biết ai sẽ đứng lên vì Thượng Đế, dù vô \r\nhình, và các sứ giả của Ngài. Thượng Đế quyền năng, và toàn năng.» (57:25). Lời giảng ở đây nhấn mạnh việc đứng lên giúp cho chính nghĩa của Allah và các sứ giả của Ngài, bằng đức tin nơi điều vô hình. Cả Allah lẫn các sứ giả đều được nhắc trong ý nghĩa của sự giúp đỡ ấy. Sắt có thể dùng để đẩy lùi sự xâm hại và phục vụ lợi ích của mọi người; người được ban nó chịu thử thách về cách sử dụng. Câu kết nhắc quyền năng và sức mạnh đưa ân huệ trở về Allah. Ngài không cần máy móc hay sức mạnh của tạo vật; chính họ cần thực hiện đúng bổn phận đối với điều Ngài đã ban. Bởi vậy, sau việc làm sắt mềm là nhiệm vụ dành cho Dawood: làm ra sản phẩm có ích."}, {"id": "P038", "text": "Câu 11"}, {"id": "P039", "text": "«(TA) bảo (Dawood): “Ngươi hãy chế áo giáp và ráp các khoen sắt lại cho thật cân bằng và Ngươi (và con cháu của Ngươi) hãy hành thiện. Quả thật, TA luôn thấy rõ những điều các ngươi làm.”» (34:11)"}, {"id": "P040", "text": "Làm sắt mềm chưa phải điểm cuối của ân huệ. Như câu 34:11 vừa nêu, ân huệ ấy được hướng đến một công việc mọi người cần: chế tạo áo giáp. Giảng viên giải thích từ chỉ loại áo giáp trong nguyên bản là áo giáp rộng, che kín thân người, để không phải phía này được bảo vệ còn phía khác bị hở, như khi chỉ cầm một tấm chắn trước mặt. Điểm khác biệt ấy giúp hiểu ý nghĩa về sự bao phủ đầy đủ: sự bảo vệ phải đến đúng nơi cần bảo vệ.\n\nTiếp đó là mệnh lệnh: «ráp các khoen sắt lại cho thật cân bằng» (34:11). Từ chỉ việc nối các khoen trong tiếng Ả Rập mang ý kết nối từng phần theo một trật tự liên tục; người ta cũng dùng từ ấy cho lời kể có các phần nối tiếp, ăn khớp. Ở đây là nối các khoen áo giáp thật chắc và tính đúng kích thước phần liên kết, để mối nối không sai lệch hay bung hở khi cử động. Cũng như vải được nối bằng đường may, nối sắt đòi hỏi sự khéo léo để sản phẩm tiếp tục làm được nhiệm vụ của nó.\n\nViệc lời mặc khải nêu chi tiết ấy cho thấy làm việc đến nơi đến chốn là một yêu cầu của lòng biết ơn. Không thể bào chữa cho sản phẩm kém chất lượng bằng lý do đó là việc từ thiện hoặc làm vì Allah. Thờ phượng, kêu gọi, phục vụ mọi người và chuẩn bị thứ bảo vệ họ đều xứng đáng được người bề tôi thực hiện thật tốt. Về sự chuẩn bị, ta đọc toàn câu trong ngữ cảnh: «Các ngươi (những người có đức tin) hãy chuẩn bị chống lại chúng bằng bất cứ thứ gì có thể, từ sức mạnh và các con chiến mã, để cho kẻ thù của Allah và kẻ thù của các ngươi cũng như những kẻ khác ngoài chúng mà các ngươi không biết nhưng Allah thì biết rõ về chúng kinh hồn khiếp vía. Và bất cứ thứ gì các ngươi đã chi dùng cho con đường chính nghĩa của Allah đều sẽ được Ngài bù đắp lại cho các ngươi, và tất nhiên các ngươi sẽ không bị đối xử bất công.» (8:60).\n\nĐằng sau đó là trách nhiệm gắn với mỗi ân huệ. Người được khả năng dạy học, tài ăn nói, tiền bạc để chi dùng hay khả năng ghi nhớ và làm việc không nhận một món quà tách rời điều mình sẽ bị hỏi đến. Đừng tưởng mình tự ý ban ơn mà Đấng Ban Tặng không có quyền gì trong đó. Dawood được ban khả năng và được giao làm việc. Tương tự, Allah phán với Musa: «Và TA đã chọn Ngươi. Vì vậy, Ngươi hãy lắng nghe điều mặc khải.» (20:13); và: «quả thật, TA đã chọn Ngươi (và ban hồng phúc cho Ngươi) hơn ai khác trong nhân loại qua Bức Thông Điệp và Lời Phán của TA. Cho nên, Ngươi hãy nhận lấy điều mà TA đã ban cho Ngươi và Ngươi hãy là người biết tri ân.» (7:144). Được chọn đi cùng trách nhiệm; được ban tặng mời gọi hành động và lòng biết ơn.\n\nTrong nguyên bản tiếng Ả Rập của câu 34:11, lời nói chuyển từ mệnh lệnh số ít về việc chế tạo và tính cho chuẩn sang mệnh lệnh số nhiều về việc làm điều thiện. Bản dịch đã dẫn nhắc đến Dawood cùng con cháu của Người. Một điều có thể suy ngẫm là nghề có ích không nên bị giữ trong một người. Người ấy cần dạy cho người gánh vác sau mình, để kỹ năng có người tiếp nối khi người đầu tiên vắng mặt. Điều này đúng với tri thức tôn giáo, nghề nghiệp và công việc chung. Bác sĩ, kỹ sư, giáo viên hay người quản lý làm tốt không chỉ tự hoàn thành phần mình, mà còn đào tạo người học hỏi và tiếp tục trách nhiệm. Một người có thể bệnh, vắng mặt hoặc qua đời; không thể để toàn bộ điều tốt phụ thuộc vào việc họ còn hiện diện.\n\nLời nhắc sau cũng đi vào ý nghĩa ấy: «Muhammad chỉ là một sứ giả. Các sứ giả đã qua đi trước ông. \r\nNếu ông chết, hoặc bị giết, các ngươi sẽ quay lưng lại gót chân của \r\nmình sao?» (3:144). Trách nhiệm không chấm dứt cùng sự ra đi của người dẫn dắt; đừng vì thế quay lưng với đức tin. Mệnh lệnh trong câu 34:11 không chỉ dừng ở làm việc, mà còn đòi hỏi việc thiện. Giữ được một nghề chưa đủ nếu thế hệ sau dùng nó để phá hoại hay lấn át người khác. Cùng một công cụ có thể bảo vệ hoặc gây bất công, nên phải theo dõi nó được dùng vào đâu. Tài ăn nói có thể dạy dỗ, khuyên nhủ, cũng có thể dẫn lạc và làm hỏng người khác.\n\nVì thế, công việc gắn với ý thức rằng Allah nhìn thấy: «Quả thật, TA luôn thấy rõ những điều các ngươi làm.» (34:11). Điều này sửa lại ảo tưởng rằng mọi thứ được ban đều chứng minh Allah hài lòng với mọi tình trạng của người nhận. Ân huệ là một cuộc thử thách. Musa nói với dân mình: «Có lẽ, Thượng Đế của các người sẽ tiêu diệt kẻ thù của các người và cho các người nối nghiệp họ trên vùng đất này, và Ngài muốn xem các người sẽ hành động như thế nào (tri ân hay vong ơn Ngài).» (7:129). Chuyển từ thế yếu sang có điều kiện vững vàng không phải kết thúc thử thách, mà chuyển sang một nơi thử thách khác. Sau khi được cứu và vượt biển, một số người con cháu Israel còn đòi: «Này Musa, xin Người hãy tạo cho chúng tôi một thần linh (để chúng tôi có thần linh) giống như họ.» (7:138). Vượt qua một thử thách hoặc sở hữu công cụ hữu ích không thay thế được việc duy trì đức tin và luôn nhớ Allah quan sát cách mình sử dụng ân huệ."}, {"id": "P041", "text": "Câu 12"}, {"id": "P042", "text": "«Và Sulayman (con trai của Dawood), (TA đã ban cho Y khả năng chế ngự) luồng gió; luồng gió lướt đi trong một buổi sáng (nhanh bằng thời gian di chuyển) của một tháng và trong một buổi chiều (nhanh bằng thời gian di chuyển) của một tháng. TA đã ban cho Y một dòng suối đồng thau; và trong loài Jinn có những tên phục dịch cho Y theo phép của Thượng Đế của Y; và nếu tên Jinn nào cãi lệnh TA thì TA sẽ bắt nó nếm lấy hình phạt của Lửa ngọn cháy bùng.» (34:12)"}, {"id": "P043", "text": "Những điều được điều khiển phục vụ Sulayman có nhiều mặt: gió, nguồn đồng và những Jinn làm việc trước mặt Người. Buổi sớm, gió vượt quãng đường thường đi mất một tháng; buổi chiều cũng vượt quãng đường một tháng. Trong một ngày di chuyển, Sulayman đi được quãng đường người khác cần hai tháng. Nguồn được làm cho tuôn chảy là đồng Allah cho chảy ra cho Người. Rồi có những Jinn bị buộc làm việc theo phép của Thượng Đế.\n\nQuyền năng ấy không do Sulayman độc lập với Đấng Chủ Tể, cũng không phải Jinn muốn ban vương quyền cho ai thì ban. Câu Kinh xác định: «theo phép của Thượng Đế của Y» (34:12), và cho biết kẻ trái lệnh sẽ chịu hình phạt.\n\nMột cách liên hệ ân huệ này với một đoạn khác trong câu chuyện Sulayman dựa trên cách giải thích về những con ngựa khiến Người bận đến quên tưởng nhớ Allah. Trong ngữ cảnh: «“Hãy dắt chúng (đàn ngựa) trở lại cho ta”, rồi (Sulayman) lấy kiếm đánh vào chân và cổ của chúng.» (38:33). Có cách giải thích hành động ấy là giết ngựa; và có ý kiến rằng Allah bù lại cho Người bằng gió, thứ nhanh hơn ngựa. (Tafsir Ibn Kathir, giải câu 38:33.) Ibn Kathir cũng ghi cách giải thích khác về việc vuốt chân và cổ ngựa; ở đây, lời giảng đang bàn theo cách hiểu thứ nhất.\n\nCách liên hệ ấy nhắc rằng phương tiện không được làm người sử dụng quên Đấng ban phương tiện. Công việc giúp lẽ phải không thể đứng vững nếu nó cắt người làm khỏi việc tưởng nhớ Allah. Câu chuyện ‘Ali cho một hình ảnh thực tế. Trong bản thuật do ‘Ali truyền lại, lời dạy của Thiên Sứ ﷺ trước hết hướng đến Fatimah: trước khi ngủ tôn vinh Allah ba mươi ba lần, ca ngợi Ngài ba mươi ba lần và tuyên xưng sự vĩ đại của Ngài ba mươi bốn lần. Ông duy trì việc tưởng nhớ ấy, đến mức nói rằng mình không bỏ nó ngay cả đêm Siffin. (Al-Bukhari 5362.) Hoàn cảnh căng thẳng, việc bận rộn trong trận chiến và thử thách của nó không xóa đi điều ông đã nhận từ sự hướng dẫn của Thiên Sứ ﷺ.\n\nSự nới nhẹ ở cuối chương Al-Muzzammil nhắc đến bệnh tật, đi xa và chiến đấu: «Ngài biết trong các ngươi có một số bệnh tật, một số khác đi tìm kiếm thiên lộc của Allah xa xôi trên trái đất; và một số khác đi chinh chiến cho Chính Nghĩa của Allah. Vì vậy, các ngươi hãy đọc phần nào mà các ngươi thấy dễ dàng đối với các ngươi.» (73:20). Có cách giải thích việc đọc ở đây là đọc trong lễ nguyện đêm. Người có lý do khó khăn vẫn giữ mối liên hệ bằng phần mình làm được, không biến khó nhọc thành cánh cửa bỏ hết việc thờ phượng. Khi một việc làm Thiên Sứ ﷺ lo buồn, Người hành lễ. (Abu Dawud 1319; Al-Albani xếp bản này là tốt.) Lễ nguyện là nơi cầu sự trợ giúp khi công việc nặng nề và hoàn cảnh khó khăn.\n\nMột điều có thể suy ngẫm trong thứ tự các ân huệ là sắt, dùng làm áo giáp, được nhắc trước đồng, vật liệu có ích cho xây dựng. Bảo vệ cộng đồng giữ cho cộng đồng khả năng xây dựng, đi lại và sống ổn định. Mở rộng sinh kế không đem lại ích lợi nếu người ta bỏ mặc điều đẩy lùi sự xâm hại. Hadith nhắc việc mải mê mua bán, trồng trọt mà bỏ nhiệm vụ chiến đấu vì Allah, rồi sự thấp hèn kéo theo cho đến khi con người trở về với tôn giáo, giúp thấy ý nghĩa ấy. (Abu Dawud 3462; Al-Albani xếp bản này là xác thực.) Tìm sinh kế và xây dựng đời sống không được biến thành cớ bỏ những bổn phận khác, cũng như công việc chung không là cớ bỏ việc thờ phượng.\n\nPhần cuối câu Kinh đưa mọi sự điều khiển trở về mệnh lệnh Allah. Jinn nào lệch khỏi lệnh Ngài sẽ nếm hình phạt lửa cháy. Có cách hiểu đây là lời đe dọa hình phạt ở Đời Sau; cũng có cách hiểu là hình phạt được giáng ngay ở đời này vì trái lệnh. Sức mạnh được điều khiển không được tự do khỏi trách nhiệm, và tài năng không gỡ cho người sở hữu trách nhiệm về cách sử dụng."}, {"id": "P044", "text": "Câu 13"}, {"id": "P045", "text": "«Chúng (các tên Jinn hầu dịch cho Sulayman) làm ra cho Y những vật mà Y muốn, từ các cung điện, các hình tượng, những chiếc chén khổng lồ như những bể nước và những chiếc chảo nấu cố định một chỗ. Hỡi dòng dõi của Dawood, các ngươi hãy làm việc với lòng tri ân (TA). Tuy nhiên, chỉ một số ít bầy tôi của TA tỏ lòng biết ơn (TA).» (34:13)"}, {"id": "P046", "text": "Theo cách giải thích của lời giảng, khả năng được điều khiển phục vụ Sulayman đã được dùng vào những nơi thờ phượng, các hình tượng, những tô lớn như bể nước và những nồi đặt cố định. Ân huệ không chỉ dừng ở quyền lực ngày càng rộng.\n\nTrong câu 34:13, bản dịch được chọn dùng cụm «các cung điện» (34:13). Lời giảng giải thích từ tiếng Ả Rập tương ứng là những nơi thờ phượng; đó là một cách giải thích được nêu riêng với cách dịch vừa dẫn. Khi nói đến từ này, lời giảng cũng nhắc mihrab, tức hốc tại chỗ người dẫn lễ thường thấy ngày nay, nhưng không giới hạn ý nghĩa của từ vào hình thức ấy. Một người cũng có thể có chỗ thờ phượng trong nhà mình. Có cách giải thích rằng tên gọi ấy liên hệ với việc người thờ phượng chống lại Shaytan ở đó. Đặt nơi thờ phượng trước tiên gợi điều cần được ưu tiên khi xây dựng cộng đồng. Thiên Sứ ﷺ đã ra lệnh xây thánh đường Hồi giáo sau khi đến Madinah, để mọi người có nơi cùng tưởng nhớ Thượng Đế và tiếp nhận sự hướng dẫn của Ngài. (Al-Bukhari 428.)\n\nCác hình tượng được nhắc đến thuộc những gì được cho phép trong giáo luật thời Sulayman. Không chuyển phán quyết của giáo luật ấy sang giáo luật của Thiên Sứ Muhammad ﷺ, trong đó chúng bị cấm. (Tafsir Al-Qurtubi, giải câu 34:13.) Những tô lớn được ví với các bể chứa nước lớn. Cảnh tượng cho thấy kích thước và số lượng dồi dào; cùng với đó là những nồi lớn, nặng, đặt cố định, không di chuyển khỏi chỗ. Điều này làm nổi bật việc dùng sự dư dả để cho người khác ăn và giúp ích cho họ, thay vì chỉ khoe những gì mình có.\n\nMột cách áp dụng là người có điều kiện mở rộng những cánh cửa phục vụ chung, từ thức ăn, nước uống đến giáo dục, và quan tâm đến mức nhu cầu. Giúp một gia đình có khoản chi lớn bằng một phần rất nhỏ có thể chưa giải quyết được khó khăn của họ. Điều cần là cố đưa lợi ích đến mức đáp ứng nhu cầu trong khả năng mình. Không phải món ít ỏi của người không có khả năng bị gạt bỏ; ở đây đang nói đến cách sử dụng thật tốt sự rộng rãi mình được ban.\n\nÝ định chân thành là nền tảng. Người ta cho ăn để tìm sự hài lòng của Allah, dù đối tượng là người không phải Muslim hay một con vật. Giúp ích tạo vật không tách khỏi việc tìm sự hài lòng của Đấng Tạo Hóa. Những điều phi thường trong vương quyền Sulayman cũng đặt câu hỏi cho người có tri thức và nghề nghiệp: nếu phương tiện sử dụng sắt, đồng trở nên dễ dàng và khả năng xây dựng tăng lên, họ dùng chúng vào đâu? Ân huệ là thử thách về cách dùng, không phải giấy chứng nhận tốt lành chỉ vì mình sở hữu nó.\n\nRồi đến trách nhiệm bao quát: «Hỡi dòng dõi của Dawood, các ngươi hãy làm việc với lòng tri ân (TA).» (34:13). Biết ơn là hành động thể hiện việc nhận biết ân đức của Đấng Ban Ơn. Người trong gia đình cùng chịu trách nhiệm, như họ cùng nhận các mặt của sự ban tặng. Lời «chỉ một số ít bầy tôi của TA tỏ lòng biết ơn (TA)» (34:13) đánh thức người có ân huệ khỏi tự mãn vì nhiều tài sản hoặc vì nhiều người đi cùng đường. Đối diện tấm gương ấy sẽ là một dân tộc được bảo: «Hãy ăn bổng lộc của Thượng Đế của các ngươi và biết ơn Ngài» (34:15), nhưng lại đáp bằng sự quay lưng.\n\nCòn lời «Chúng (các tên Jinn hầu dịch cho Sulayman) làm ra cho Y những vật mà Y muốn» (34:13) chuẩn bị cho việc hiểu kết thúc câu chuyện. Những Jinn ấy làm việc vì bị điều khiển. Khi cái chết của Sulayman lộ ra, ta thấy họ đã chờ để thoát khỏi công việc. Từ đó, sự khác nhau giữa sức mạnh mệnh lệnh làm thân thể chuyển động và sức mạnh đức tin khiến người ta tự gánh vác công việc sẽ được làm rõ."}, {"id": "P047", "text": "Câu 14"}, {"id": "P048", "text": "«Nhưng khi TA quyết định cho y (Sulayman) chết, chẳng có gì làm cho chúng (Jinn) thấy cái chết của y ngoại trừ một loại sâu đất đã gặm mòn chiếc gậy của y. Bởi thế, khi y ngã xuống, loài Jinn mới vỡ lẽ rằng nếu biết được điều vô hình thì chúng đâu có phải ở lại lâu trong sự trừng phạt nhục nhã đó.» (34:14)"}, {"id": "P049", "text": "Những cảnh tạo vật được điều khiển kết thúc bằng một cảnh cho thấy giới hạn của khả năng được ban. Allah định cái chết cho Sulayman. Người vẫn tựa vào gậy, còn Jinn tiếp tục làm việc mà không biết Người đã chết. Đến khi sinh vật trong đất ăn cây gậy, Người mới ngã xuống. Sulayman được Allah cho gió và Jinn phục vụ mình, nhưng Người vẫn không nằm ngoài định mệnh cái chết. Những Jinn khiến con người thấy sức mạnh của chúng lại không biết điều vô hình ngay bên cạnh mình.\n\nMột tạo vật nhỏ, qua việc ăn cây gậy, phơi bày điều sức mạnh của chúng không nhận ra. Nếu biết Người đã chết, chúng đã không tiếp tục công việc mà chúng coi là hình phạt nhục nhã. Để thấy ngữ cảnh lời giảng, ta đọc toàn câu: «Nhưng khi TA quyết định cho y (Sulayman) chết, chẳng có gì làm cho chúng (Jinn) thấy cái chết của y ngoại trừ một loại sâu đất đã gặm mòn chiếc gậy của y. Bởi thế, khi y ngã xuống, loài Jinn mới vỡ lẽ rằng nếu biết được điều vô hình thì chúng đâu có phải ở lại lâu trong sự trừng phạt nhục nhã đó.» (34:14). Có cách hiểu rằng sự thật về Jinn được phơi bày: chúng không biết điều vô hình. Cũng có cách hiểu rằng điều đó trở nên rõ với những kẻ đi theo Jinn, để họ biết các thủ lĩnh từng làm họ tưởng là biết điều vô hình thực ra không biết. (Ibn ‘Atiyyah, Al-Muharrar al-Wajiz, giải câu 34:14.) Đừng vì thấy nhiều hoạt động hay việc lạ mà gán cho chúng tri thức Allah chưa ban.\n\nKết thúc câu chuyện nối với phần đầu chương. Toàn bộ quyền sở hữu thuộc về Allah: Ngài điều khiển núi, chim, sắt, đồng, gió và Jinn theo ý Ngài. Toàn bộ tri thức cũng thuộc về Ngài. Những đối tượng được điều khiển không nắm được điều khuất khỏi mình, trừ điều Ngài cho chúng biết.\n\nMột điều người làm việc vì tôn giáo của Allah cần suy ngẫm là bản chất của những người cùng làm với mình. Trong thời yếu thế, họ có thể tưởng rằng mình chỉ cần tiền và người theo, sẵn sàng làm mọi điều mình muốn, không cần ý kiến hay hiểu biết, hễ ra lệnh là chuyển động. Nhưng công việc của Jinn bị điều khiển cho thấy giới hạn của sự phục tùng ấy. Nếu người làm chỉ bị ép buộc, họ chờ người mình sợ không còn để thoát khỏi việc. Còn sứ mạng tiếp tục sau cái chết của người mang nó cần những con người tin và biết vì sao mình cống hiến.\n\nCuối cuộc đời Thiên Sứ ﷺ cho thấy một hình ảnh khác. Sáng thứ Hai, Người vén rèm nhà mình; các Sahabah đang xếp hàng hành lễ Fajr, Abu Bakr dẫn lễ. Họ gần như bị xao động vì quá vui khi nhìn thấy Người, nhưng Người ra dấu hãy hoàn thành lễ nguyện. (Al-Bukhari 1205.) Hàng ngũ vẫn được giữ, việc thờ phượng vẫn tiếp tục; sự tập hợp của họ không phụ thuộc vào việc Người trực tiếp điều khiển từng cử động. Trong sự hướng dẫn của Người có lời: «Ai dâng lễ nguyện Salah Subh thì y sẽ được sự giao ước bảo vệ của Allah» (Muslim 657). Cảnh ấy kết hợp sự ngay ngắn trong lễ nguyện với mối liên hệ của họ với Thượng Đế.\n\nSau khi Người qua đời, họ tiếp tục gánh trách nhiệm. Trong cuộc trao đổi với Umar về những người giữ lại Zakah, Abu Bakr nói: «Tôi xin thề trước Allah, nếu họ không nộp cho tôi dù chỉ một sợi dây buộc lạc đà mà trước kia họ vẫn nộp cho Thiên Sứ của Allah ﷺ, tôi nhất định sẽ chiến đấu với họ vì họ giữ lại sợi dây ấy.» (Abu Hurayrah thuật; Muslim 20). Vâng phục không phải gánh nặng họ chờ được cởi bỏ, mà là điều được ủy thác họ thấy mình có trách nhiệm giữ gìn.\n\nNói về Dajjal, Thiên Sứ ﷺ nêu hai trường hợp: «Nếu hắn xuất hiện khi Ta còn ở giữa các ngươi, chính Ta sẽ thay các ngươi đối chất với hắn. Nếu hắn xuất hiện khi Ta không còn ở giữa các ngươi, mỗi người sẽ phải tự đối chất với hắn. Allah sẽ thay Ta chăm lo cho từng người Muslim.» (An-Nawwas ibn Sam‘an; Muslim 2937.01). Trái tim được đưa trở về Allah; mối liên hệ với sự bảo hộ của Ngài không bị cắt đứt khi vị Nabi qua đời.\n\nĐiều ấy càng rõ ở Abu Bakr. Ông thuộc những người gần gũi, đồng hành và yêu mến Thiên Sứ ﷺ sâu sắc nhất, nhưng lại thể hiện sự vững vàng khi người khác xao động sau cái chết của Người. (Al-Bukhari 3667–3668.) Tình yêu không biến mất; nó dựa trên đức tin vào Allah vững chắc đến mức sứ mạng không mất đi khi người mình yêu vắng mặt.\n\nKhi Abu Bakr và ‘Umar đến thăm Umm Ayman sau khi Thiên Sứ ﷺ mất, bà khóc. Hai ông nhắc bà rằng điều nơi Allah tốt hơn cho Sứ Giả của Ngài. Bà cho biết: «nhưng tôi khóc vì Lời Mặc khải (được truyền xuống) đến từ Allah đã không còn nữa.» (Muslim 2454). Bà đau buồn vì việc ban mặc khải mới từ trời đã chấm dứt, và hai ông khóc cùng bà. Cảnh ấy mang ý nghĩa sâu hơn nỗi buồn chia lìa người đồng hành: họ nhận ra giá trị của điều từng đến với mình từ trời, nên đau lòng khi việc ấy chấm dứt.\n\nĐó là sự giáo dưỡng gắn con người với mặc khải: «Các người hãy là những bề tôi tôn thờ Thượng Đế (Allah) bởi điều các người răn dạy cho (người khác) từ Kinh Sách cũng như những gì các người đã học được.» (3:79). Người thầy tốt làm sâu sắc mối liên hệ của học trò với Kinh Sách Allah, không biến chính mình thành đích cuối của hiểu biết và hành động của họ. Một tác động của thử thách khi tin Thiên Sứ ﷺ bị giết lan ra trong trận Uhud là trái tim được chuẩn bị để hiểu lời: «Muhammad chỉ là một sứ giả. Các sứ giả đã qua đi trước ông. \r\nNếu ông chết, hoặc bị giết, các ngươi sẽ quay lưng lại gót chân của \r\nmình sao?» (3:144). Trung thành với sự hướng dẫn của Sứ Giả thể hiện ở việc giữ vững nó sau khi mất Người.\n\nTuy vậy, giáo dưỡng không có nghĩa mỗi cá nhân đều không cần chỉ dẫn hay phân chia công việc. Có người cần được nói rõ điều nên làm theo khả năng của mình. Sai lệch là để toàn bộ công việc chỉ dựa trên mệnh lệnh, không có hiểu biết, đức tin hay lòng yêu điều đang làm. Điều ấy cũng không có nghĩa người dẫn dắt ra đi không để lại đau buồn hoặc thiếu hụt. Thiên Sứ ﷺ cho biết Người là sự bảo đảm an ổn cho các Sahabah, còn các Sahabah là sự bảo đảm an ổn cho cộng đồng của Người. (Muslim 2531.) Sau khi Người qua đời, ảnh hưởng và mất mát có thật, nhưng không phải sứ mạng sụp đổ hoặc mọi người đều rời bỏ nó.\n\nTừ chỉ cây gậy trong câu chuyện làm ý nghĩa này rõ thêm. Đó là cây gậy người chăn dùng để thúc hoặc giữ lùi những con vật mình lùa; gốc từ cũng mang ý trì hoãn. Cây gậy mất đi nhắc rằng sự chuyển động chỉ dựa vào gậy sẽ dừng khi nỗi sợ nó không còn. Còn niềm tin và sự thuyết phục trong lòng khiến người ta cống hiến ngay khi người ra lệnh vắng mặt.\n\nTrong các Sahabah có người muốn cống hiến thêm, đến mức ở một giai đoạn họ được bảo, như toàn câu cho biết: «Phải chăng Ngươi (hỡi Thiên Sứ Muhammad) không nhìn thấy những người khi có lời bảo: “Các người hãy ngưng chiến, hãy chu đáo thiết lập lễ nguyện Salah và hãy xuất Zakah”.[1] Nhưng rồi sau đó, khi có lệnh bắt buộc họ phải chiến đấu thì một thành phần trong số họ sợ thiên hạ giống như sợ Allah, thậm chí còn sợ hơn. họ than: “Lạy Thượng Đế của bầy tôi, tại sao Ngài lại ban lệnh chiến đấu ngay lúc này vậy, phải chi Ngài trì hoãn cho bầy tôi thêm một thời gian nữa (để bầy tôi được hưởng thụ cuộc sống).” Ngươi (hỡi Thiên Sứ Muhammad) hãy nói với họ: “Vật chất của cuộc sống trần gian này chỉ là ít ỏi trong khi cõi Đời Sau tốt đẹp hơn dành cho người ngoan đạo; và các ngươi sẽ không bị đối xử bất công một chút nào.”» (4:77). Động lực đã có trong lòng họ, rồi được mệnh lệnh Allah điều chỉnh. Câu chuyện khởi đầu Adhan cũng cho thấy họ mang mối quan tâm của sứ mạng. Khi người Muslim đông lên, cần cách tập hợp họ để hành lễ, mọi người bàn bạc phương tiện. ‘Abdullah ibn Zayd ra về mà lòng bận tâm về điều khiến Thiên Sứ ﷺ lo: tập hợp mọi người cho lễ nguyện. (Abu Dawud 498.) Ông không xem đó là chuyện xa mình và chỉ chờ một lệnh gửi đến, mà mang nó trong lòng rồi thấy giấc mộng Adhan.\n\nKhi ông kể lại, Thiên Sứ ﷺ xác nhận giấc mộng và bảo ông truyền lời gọi ấy cho Bilal, vì giọng Bilal vang và đẹp hơn. ‘Umar cũng nói mình đã thấy một giấc mộng như vậy. (Abu Dawud 499.) Giấc mộng được Sứ Giả xác nhận gắn với một trái tim lo cho cộng đồng; sau đó, công việc được thực hiện tốt bằng cách giao lời gọi cho người có giọng phù hợp hơn.\n\nQur’an còn cho một ví dụ khác về sự chủ động: «Sau đó, từ phần xa nhất của thành phố, một người đàn ông \r\nchạy đến. Hắn nói, ‘Dân của tôi, hãy theo các sứ giả.» (36:20). Trong thị trấn đã có các sứ giả: «Khi TA phái hai Sứ Giả đến gặp họ, họ đã phủ nhận hai vị đó, rồi TA lại tăng cường thêm một vị thứ ba» (36:14). Nhưng người ấy không nói sự hiện diện của họ khiến mình không cần góp phần. Ông đến từ phần xa nhất của thành phố để kêu gọi dân mình theo họ. Không phải công việc nào cũng phải chờ được giao; mỗi người có nhu cầu mình nhận ra và ý tưởng, khả năng mình có thể đóng góp.\n\nNhờ vậy, ta hiểu sự khác nhau giữa người gánh sứ mạng bằng đức tin và người coi công việc là gánh nhục nhã, chỉ chờ thoát ra. Nhiều tiền và máy móc không bù được sự thiếu vắng đức tin ấy. Một thế hệ được giáo dưỡng bằng Qur’an và biết trách nhiệm của mình có thể mang điều được ủy thác, dạy người sau, để lời kêu gọi tiếp tục sau khi người kêu gọi qua đời."}, {"id": "P050", "text": "Câu 15"}, {"id": "P051", "text": "«Chắc chắn có một dấu hiệu cho người dân Saba' (Sê-ba) ngay tại chỗ của họ ở: hai ngôi vườn nằm bên phải và bên trái. Hãy ăn bổng lộc của Thượng Đế của các ngươi và biết ơn Ngài; một thành phố tốt đẹp (với) một Thượng Đế Hằng Tha Thứ.» (34:15)"}, {"id": "P052", "text": "Câu chuyện Saba’ đặt bên cạnh hình ảnh biết ơn nơi gia đình Dawood. Cả hai đều được ban rộng rãi; khác biệt nằm ở cách con người đối xử với điều được ban. Saba’ là tên một người, tổ tiên của dân có các bộ tộc phân tán: sáu bộ tộc tại Yemen và bốn tại vùng Sham. (At-Tirmidhi 3222.) Mục đích câu chuyện không phải dừng ở gia phả, mà nhìn ân huệ gần với đời sống: chỗ ở tốt, bổng lộc rộng, rồi sự an toàn trên đường đi mà các câu sau nhắc đến.\n\nĐó cũng là hai ân huệ Allah nhắc đã ban cho Quraish: «Đấng đã cho họ ăn khi họ đói và ban cho họ sự bình yên khỏi điều sợ hãi.» (106:4). Về thánh địa, Ngài phán: «Lẽ nào TA (Allah) đã không thiết lập cho họ một thánh địa an toàn với đủ loại hoa quả được mang đến cho nó như là thiên lộc từ nơi TA?» (28:57). Câu chuyện Saba’ không xa với tình trạng người đang được nói đến. Đấng ban cho những người trước bổng lộc và an toàn rồi thu lại sau khi họ quay lưng cũng có thể làm như vậy với người tự mãn về ân huệ.\n\nViệc bắt đầu bằng chỗ ở chạm đến nền tảng cảm giác ổn định của con người. Hadith nêu: «Bất cứ ai trong số các ngươi thức dậy với cơ thể khỏe mạnh, gia đình an toàn và có đủ thức ăn cho ngày của mình, thì người đó như thể đã sở hữu cả thế gian.» (At-Tirmidhi và Ibn Majah). An toàn, khỏe mạnh và đủ dùng hợp lại là những nền tảng khiến đời sống được an lòng.\n\nDấu hiệu ở chỗ dân Saba’ sinh sống là «hai ngôi vườn nằm bên phải và bên trái.» (34:15). Có cách hiểu là những vườn tược bao quanh thị trấn từ hai phía; cũng có cách hiểu rằng mỗi nhà có hai vườn ở bên phải và bên trái. Cả hai cách đều cho thấy sự điều hành rộng rãi và ân huệ ở gần người cư trú. Nhiều vườn, cây cối đan dày và bóng mát hội tụ gợi cảnh sống sung túc: bổng lộc gần và việc tìm kiếm ít tốn công.\n\nCâu chuyện bắt đầu bằng một dấu hiệu rồi kết bằng lời: «Quả thật, trong sự việc đó là những dấu hiệu (bài học) cho từng người kiên nhẫn, biết ơn.» (34:19). Chính ân huệ đã là nơi có điều để nhận ra; kết cục của việc quay lưng lại mở thêm nhiều mặt để suy xét. Rồi việc cho phép hưởng dùng không tách khỏi quyền của Đấng Ban Ơn: «Hãy ăn bổng lộc của Thượng Đế của các ngươi và biết ơn Ngài» (34:15). Vâng phục không phải từ chối bổng lộc tốt đẹp, mà hưởng dùng trong nhận thức rằng nó đến từ Allah và thực hiện lòng biết ơn.\n\nĐiều này đúng với cả ân huệ vật chất và tinh thần. Các thiên thần nói với Maryam: «Và (hãy nhớ) khi các Thiên Thần bảo (Maryam): “Hỡi Maryam! Quả thật, Allah đã chọn Nàng và tẩy sạch Nàng và chọn Nàng (để phụng sự Ngài) hơn những phụ nữ khác trong thiên hạ.”» (3:42); rồi đến trách nhiệm: «Hỡi Maryam! Ngươi hãy hết lòng thờ phượng Thượng Đế của ngươi, ngươi hãy quỳ lạy và cúi mình cùng với những người cúi mình (thần phục Allah).» (3:43). Tương tự, sau khi chọn Musa để mang thông điệp và nhận lời phán, Allah bảo: «Ngươi hãy nhận lấy điều mà TA đã ban cho Ngươi và Ngươi hãy là người biết tri ân.» (7:144). Sự cao quý của món quà không xóa đi hành động mà mời gọi hành động.\n\nHọ được cả vùng đất tốt đẹp lẫn sự tha thứ của Thượng Đế. Một cách hiểu về lời «một Thượng Đế Hằng Tha Thứ.» (34:15) là Ngài không lập tức trừng phạt họ dù họ đã sai phạm, mà trì hoãn, nhắc nhở và trình bày rõ. Đừng xem việc sung túc tiếp tục là bằng chứng Allah hài lòng với sự phủ ơn, và đừng quên cánh cửa trở về đã được mở. Vùng đất tốt là một ân huệ, sự tha thứ là một ân huệ khác; cả hai cùng mời gọi trái tim biết ơn Thượng Đế."}, {"id": "P053", "text": "Câu 16"}, {"id": "P054", "text": "«Nhưng họ đã ngoảnh đi. Vậy nên TA đã gởi một trận lũ (đến trừng phạt họ) từ một con đập, và TA đã thay thế hai ngôi vườn của họ bằng hai ngôi vườn chỉ toàn loại trái đắng, các cây bụi (giông giống loại thánh liễu) và một ít cây táo gai.» (34:16)"}, {"id": "P055", "text": "Đáp lại ân huệ và mệnh lệnh biết ơn là sự quay lưng. Nơi từng hội tụ bổng lộc trở thành chứng tích về việc nó mất đi. Con người có thể sống sung túc lâu đến mức quên Đấng ban cho mình, rồi xem sự vững chắc của các phương tiện là bảo đảm cho nó còn mãi. Người chủ hai vườn đã như vậy: «Y vào ngôi vườn của mình và tự làm bản thân mình sai quấy khi nói: “Tôi nghĩ rằng ngôi vườn này sẽ không thể nào tiêu tan được.”» (18:35). Thấy cây, nước và sự sắp đặt tốt, ông cho rằng vườn không thể mất. Một dân tộc cũng có thể yên tâm về đập và hệ thống dẫn nước đến mức tưởng nguy hiểm không còn.\n\nQur’an phơi bày gốc rễ của sự tự mãn. Nó nhắc con người về sự yếu ớt trong khởi đầu tạo dựng: «Đấng đã tạo ra con người từ một cục máu.» (96:2), và rằng tri thức là món quà: «Đấng đã dạy con người điều y không biết.» (96:5); rồi nói: «Không! Quả thật, con người thường vượt quá giới hạn.» (96:6); «Vì y tự thấy mình giàu có và đầy đủ.» (96:7). Con người thực ra không độc lập, mà chỉ thấy mình đã tự đủ. Ban đầu, họ có thể thiếu thốn và lo sợ; đến khi việc làm ổn định, cơ thể khỏe, tiền nhiều, các vấn đề về phương tiện đi lại và sinh kế được giải quyết, họ tưởng không còn cần ai, rồi dám phạm tội. Sự tự mãn có thể tăng thêm khi đã bất tuân mà ân huệ vẫn còn một thời gian: họ lấy việc được trì hoãn làm bằng chứng nó sẽ mãi tiếp tục.\n\nToàn câu đưa sự việc trở về Đấng sở hữu các phương tiện: «Nhưng họ đã ngoảnh đi. Vậy nên TA đã gởi một trận lũ (đến trừng phạt họ) từ một con đập, và TA đã thay thế hai ngôi vườn của họ bằng hai ngôi vườn chỉ toàn loại trái đắng, các cây bụi (giông giống loại thánh liễu) và một ít cây táo gai.» (34:16). Điều con người làm thật vững không khiến Allah bất lực. Thứ từng là nguyên nhân cho cuộc sống phát triển, Ngài có thể khiến thành nguyên nhân sự sung túc tan đi. Bản dịch vừa dẫn dùng cụm «một con đập» (34:16) cho từ al-‘arim. Lời giảng cũng nêu cách giải thích khác là trận lũ dữ dội; với cách hiểu về con đập, đó là công trình giữ nước giữa các núi. Kiểm soát dòng lũ và xả nước theo mức cần giúp nông nghiệp ổn định, vườn tược mở rộng. Khi nền tảng ấy sụp, đời sống xây trên nó cũng bị ảnh hưởng.\n\nSức mạnh một đất nước có thể gắn với một nguồn lực duy nhất, như dầu mỏ. Dân ở đó tưởng rằng miễn còn nó thì giàu có được bảo đảm, trong khi chính các nguồn lực cũng nằm dưới quyền Allah. Ngài nhắc họ: «Hãy bảo chúng: “Các người có xét thấy chăng? Nếu vào một buổi sáng nào đó mạch nước của các người rút mất tiêu (xuống lòng đất) thì ai sẽ mang nước mạch trong vắt đến tiếp liệu cho các người?”» (67:30). Những cảnh ban tặng lớn lao trong chương được đặt gần những nguyên nhân nhỏ phơi bày sự yếu đuối của người tự mãn. Allah đã điều khiển bao điều cho Dawood và Sulayman, nhưng rồi một sinh vật ăn gậy làm lộ sự thật Jinn không biết. Sự sung túc khiến dân Saba’ choáng ngợp cũng mất đi. Ngay trong cơ thể người cũng có bài học: khỏe mạnh, đầy sức lực, nhưng một chứng bệnh nhỏ không từng nghĩ đến lại có thể làm mình bất lực.\n\nMột dẫn chứng rõ là câu chuyện Ya’juj và Ma’juj. Sức mạnh của chúng lớn đến mức Allah mặc khải cho ‘Isa đưa người có đức tin lên núi Tur, vì không ai đủ sức giao chiến với chúng. Rồi Ngài gửi loài sâu nhỏ vào cổ chúng, khiến chúng chết. (Muslim 2937.) Một bản thuật khác, do Abu Sa‘id truyền lại, kể chúng uống nước trên mặt đất. Giữa cảnh tự mãn ấy, một người trong chúng ném một ngọn lao về phía trời. Khi ngọn lao trở về nhuốm máu, chúng tưởng đã thắng những cư dân trên trời; rồi chúng bị tiêu diệt bởi tạo vật nhỏ ấy. (Ibn Majah 4079.) Độ lớn của một nguyên nhân trong mắt con người không phải thước đo quyền năng Allah.\n\nSự đền đáp dành cho Saba’ không chỉ là mất trái cây. Hai vườn vẫn còn để nhắc cảnh cũ, nhưng vị ngon đã đổi thành quả đắng và thứ kém giá trị. Có cách giải thích từ chỉ quả đắng là trái đắng nói chung; cũng có cách hiểu là cây arak có trái đắng. Cùng với đó là loại cây được nhắc tiếp trong câu, không còn đem lại trái ngon họ từng quen. Còn loại cây hữu ích nhất còn lại trong ngữ cảnh này chỉ có: «một ít cây táo gai.» (34:16). Cách nói tiếng Ả Rập vừa nêu một lượng nhỏ, vừa nhấn thêm sự ít ỏi, cho thấy điều có ích hiếm hoi thế nào sau cảnh dư dả; nỗi tiếc nuối của người từng biết ân huệ rồi mất nó càng tăng.\n\nĐối với Makkah, nơi hội tụ bổng lộc, vị thế và điều kiện buôn bán, đây là lời cảnh báo gần gũi. Sức mạnh kinh tế không thay thế lòng biết ơn. Vị trí của một đất nước hay tài sản người dân không che họ khỏi quyền cai quản của Allah."}, {"id": "P056", "text": "Câu 17"}, {"id": "P057", "text": "«Vì tội vong ơn nên TA đã bắt phạt họ như thế. Và TA chỉ trừng phạt những kẻ vong ân.» (34:17)"}, {"id": "P058", "text": "Việc ân huệ đổi thay không tách rời thái độ của dân ấy đối với nó. Sự đền đáp được gắn với việc họ phủ ơn. Được ban tặng không miễn trách nhiệm; ân huệ còn tồn tại cũng không cho phép vô ơn. Lời này vừa cảnh báo người đa thần, vừa làm người có đức tin an lòng. Người có tiền của và trang bị đừng tự mãn vì những gì trong tay; người yếu thế cũng đừng tưởng sức mạnh đối thủ đã ra khỏi quyền sở hữu Allah.\n\nĐiều này gần với lời người có đức tin đáp người chủ hai vườn: «“Thì biết đâu (sau này) Thượng Đế của tôi sẽ ban cho tôi thứ tốt đẹp hơn ngôi vườn của anh; biết đâu Ngài sẽ gửi từ trên trời xuống những lưỡi tầm sét tàn phá ngôi vườn của anh, biến nó thành mảnh đất trơ trụi,”» (18:40); «“Hoặc nguồn nước của ngôi vườn sẽ cạn mất khiến anh không thể nào tìm được nguồn nước trở lại.”» (18:41). Đấng ban cho có thể thu lại và có thể ban cho người từng bị người kia khinh vì nghèo. Sự an lòng ấy trở về phần mở đầu chương: Allah sở hữu mọi vật trong trời đất. Ngay những điều được dành riêng cho các vị Nabi, như sắt, gió và đồng được điều khiển phục vụ, cũng chỉ là sự ban tặng của Ngài.\n\nVì thế, người có đức tin cần phân biệt trái tim an lòng nơi Allah với trái tim an lòng vì còn tiền. Toàn câu nêu rõ một kiểu thờ phượng mong manh: «Trong nhân loại có kẻ thờ phượng Allah trong sự hoài nghi. Nếu gặp điều lành thì y sẽ an lòng (tiếp tục thờ phượng Ngài), còn nếu gặp điều dữ thì y sẽ quay mặt đi (không thờ phượng Ngài nữa); thế là y thất bại cả đời này lẫn Đời Sau. Đó thật sự là một thất bại hiển nhiên.» (22:11). Lời «y sẽ an lòng (tiếp tục thờ phượng Ngài)» (22:11) mô tả sự an lòng bám vào điều tốt đang có, như người chỉ yên tâm khi biết tiền vẫn nằm trong tay mình; đến lúc mất tiền, đức tin cũng chao đảo.\n\nMột ví dụ về việc từ chỉ điều tốt mang nghĩa tài sản nằm trong câu sau; toàn câu được dẫn để thấy ngữ cảnh của từ ngữ: «Các ngươi được sắc lệnh: khi ai đó trong các ngươi sắp từ trần, nếu y để lại tài sản thì y phải lập di chúc cho cha mẹ và họ hàng thân thuộc một cách hợp lý.[1] Đó là bổn phận của những người ngoan đạo.» (2:180). Ví dụ khác là: «Quả thật, y quá đỗi yêu thích tiền tài và của cải.» (100:8). Còn nền tảng an lòng của đức tin là: «Quả thật, với sự tụng niệm (tưởng nhớ) Allah, các con tim sẽ tìm thấy sự an bình và thanh thản!» (13:28). Mối liên hệ giữa bề tôi và Thượng Đế được giữ vững cả lúc dư dả lẫn khi bị thử thách.\n\nCó cách giải thích lời «TA chỉ trừng phạt những kẻ vong ân» (34:17) là nói đến kiểu đền đáp như trường hợp này: ân huệ của người phủ ơn bị nhổ tận gốc như một hình phạt. Còn điều xảy đến với người có đức tin có thể là sự sửa dạy đưa họ trở về với Thượng Đế. Ở đây, điều cần xét là thái độ khác nhau đối với Allah và tác động của thử thách. Đừng đánh đồng việc được tiếp tục ban cho mà càng vô ơn với một tai họa đánh thức con người để sám hối."}, {"id": "P059", "text": "Câu 18"}, {"id": "P060", "text": "«Giữa họ (dân của Sheba) và những thị trấn (của Sham) mà TA đã ban phúc, TA đã đặt những thị trấn khác dễ nhìn từ đằng xa và TA sắp đặt nơi đó những chặng đường (ngắn, gần) để họ đi lại dễ dàng; (và TA phán bảo họ): “Các ngươi hãy đi lại (tùy thích) một cách an toàn cả ban đêm lẫn ban ngày qua những địa điểm đó.”» (34:18)"}, {"id": "P061", "text": "Sau ân huệ bổng lộc trong hai vườn là chi tiết về an toàn và đi lại thuận tiện. Những làng được Allah ban phúc được giải thích là các làng vùng Sham. Giữa Saba’ ở Yemen và vùng ấy là con đường nối tiếp những làng hiện rõ, nơi khách đi đường tìm được thức ăn, nghỉ ngơi và chỗ qua đêm.\n\nHọ không buộc phải mang lương thực cho một hành trình dài lo bị cắt đứt. Đi một chặng, họ nghỉ tại một làng; lên đường tiếp, đến lúc cần dừng lại lại có một làng khác. Lời «TA sắp đặt nơi đó những chặng đường (ngắn, gần) để họ đi lại dễ dàng» (34:18) gợi sự cân đối, gần gũi giữa các chặng: không có đoạn quá xa làm khách kiệt sức rồi đoạn khác lại gần nhau vô ích, mà hành trình được sắp đặt theo mức đem lại sự thoải mái.\n\nCó ý kiến rằng Allah gợi cho họ cách tổ chức ấy. Một khả năng được nêu để giải thích sự an toàn là các mối quan hệ và thỏa thuận với bộ tộc dọc đường tạo điều kiện cho nó; cảnh sung túc khiến các bộ tộc muốn phục vụ họ. Trong cả hai trường hợp, sự thuận lợi đều là ân huệ Allah, dù diễn ra qua phương tiện con người đảm trách.\n\nLời «Các ngươi hãy đi lại (tùy thích)» (34:18) nằm trong khung cảnh đi qua những ngôi làng nối tiếp đã nêu ở đầu câu 34:18. Khung cảnh ấy làm những ngôi làng hiện lên như một nơi liền mạch. Khách đi như đang bước trong chính quê mình, không ra một con đường đứt quãng, đáng sợ và phải mang nặng lương thực. Nhắc đêm trước ngày làm ý nghĩa an toàn càng rõ, vì đêm thường là lúc khách lo sợ. Sự cho phép bao gồm cả thời điểm cần yên tâm hơn. Việc dùng số nhiều cho đêm và ngày cho thấy sự thoải mái, an toàn kéo dài cùng hành trình, không chỉ có tại một chặng thoáng qua.\n\nQuraish từng biết ân huệ tương tự trong sự an toàn và bổng lộc của mình. Câu chuyện Saba’ nhắc chính điều họ đang có. Một cách áp dụng là chăm lo những gì giúp đời sống tốt hơn: sinh kế thuận lợi, giữ an ninh, chuẩn bị đường đi và chỗ nghỉ cho khách. Chi dùng để bớt nhọc nhằn và giúp người đi đường an toàn là biết ơn điều Allah đã làm thuận tiện; nó góp phần xây dựng đất nước và đời sống dân cư."}, {"id": "P062", "text": "Câu 19"}, {"id": "P063", "text": "«(Tuy nhiên, họ không hài lòng với những chặng đường gần và ngắn) nên họ nói: “Lạy Thượng Đế của bầy tôi! Xin Ngài làm cho những chặng đường đi lại của bầy tôi dài xa thêm.” Họ đã bất công với chính bản thân họ (qua mong muốn đó). Vậy nên, TA đã lấy họ làm thành những câu chuyện và đã phân tán toàn bộ họ tản mác khắp nơi. Quả thật, trong sự việc đó là những dấu hiệu (bài học) cho từng người kiên nhẫn, biết ơn.» (34:19)"}, {"id": "P064", "text": "Đáp lại đường đi dễ dàng, họ đưa ra một yêu cầu đáng ngạc nhiên. Toàn câu ghi lời cầu xin và kết cục của nó: «(Tuy nhiên, họ không hài lòng với những chặng đường gần và ngắn) nên họ nói: “Lạy Thượng Đế của bầy tôi! Xin Ngài làm cho những chặng đường đi lại của bầy tôi dài xa thêm.” Họ đã bất công với chính bản thân họ (qua mong muốn đó). Vậy nên, TA đã lấy họ làm thành những câu chuyện và đã phân tán toàn bộ họ tản mác khắp nơi. Quả thật, trong sự việc đó là những dấu hiệu (bài học) cho từng người kiên nhẫn, biết ơn.» (34:19). Có một cách đọc khác trong tiếng Ả Rập nhấn mạnh thêm mức độ làm các chặng đường xa nhau. (Ibn al-Jazari, An-Nashr, phần các cách đọc chương Saba’.)\n\nCó cách giải thích rằng họ chán sự dễ dàng của việc đi lại, chán những nơi dừng chân gần nhau và muốn các chặng xa ra, đến mức phải cần lạc đà, mang lương thực. Điều đáng biết ơn lại thành điều gây khó chịu. Đây có thể là sự kiêu căng trước ân huệ: con người quen an lành đến mức không còn nhận ra giá trị của nó, nên tìm thay đổi dù chuyển sang khó nhọc.\n\nSự sai lạc trong yêu cầu ấy gần với lời những kẻ phủ nhận trong toàn câu sau: «Và hãy nhớ khi chúng thưa: “Ôi Allah! Nếu (Qur'an) này là Chân Lý do Ngài ban xuống thì xin Ngài hãy làm cho mưa đá đổ từ trên trời xuống đè lên chúng tôi hoặc mang một hình phạt đau đớn nào đến trừng phạt chúng tôi!”» (8:32). Họ không cầu xin được hướng dẫn nếu đó là chân lý, mà đón nhận bằng lời xin điều sẽ hủy diệt mình.\n\nCũng có cách giải thích rằng dân Saba’ nói vậy để phủ ơn khi được nhắc sự an toàn trên đường và những làng gần nhau là ân huệ Allah. Họ làm như không cần món quà ấy, như thể sức mình đủ lo nếu đường xa hơn. Theo cách này, phía sau yêu cầu là sự liều lĩnh của người tưởng mình tự đủ, không chỉ muốn đổi một con đường.\n\nLại có ý kiến rằng chính giới quyền thế, giàu có đòi hỏi điều ấy. Đường dễ khiến họ và người nghèo ngang nhau. Họ muốn giá trị số lạc đà và trang bị mình có được hiện rõ, để chỉ người đủ khả năng mới đi được. Tương tự người có xe nhưng khó chịu khi người khác không cần một phương tiện như mình, rồi mong các nhu cầu ở xa nhau để ưu thế mình lộ rõ. Cũng có ý kiến rằng họ muốn đường vắng ánh mắt dân làng để có thể phạm tội xa sự quan sát. Những cách giải thích động cơ khác nhau ấy gặp nhau ở chỗ ân huệ từ điều mời gọi biết ơn lại bị biến thành chỗ để vô ơn, kiêu ngạo hoặc phạm tội.\n\nMột cách đọc khác hiểu lời này theo hình thức kể lại việc các chặng đường đã bị làm cho xa nhau, thay vì cầu xin làm xa. (Ibn al-Jazari, An-Nashr, phần chương Saba’.) Nó gợi lời than phiền về điều đã xảy ra. Có cách hiểu người yếu thế nói sau khi các chặng xa ra; cũng có cách hiểu chính những người đã đòi hỏi nói khi nếm kết quả. Họ từng khó chịu vì gần, rồi lại khó chịu vì xa. Vấn đề không bắt đầu từ việc mất hết ân huệ, mà từ một trái
