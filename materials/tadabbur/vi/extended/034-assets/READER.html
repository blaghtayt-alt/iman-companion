Lời kết nói Ngài là Đấng ban bổng lộc tốt nhất, mời gọi ta yên lòng trước sự khôn ngoan của Đấng đã hứa bù đắp. Đứa con tin người cha giữ lời khi hứa một món quà tốt thì đã an tâm trước khi biết món quà cụ thể; còn mọi sự hoàn hảo cao nhất thuộc về Allah. Vậy lời hứa của Thượng Đế, Đấng biết nhu cầu và ban cho tốt đẹp, càng đáng để tin cậy biết bao! Giá trị của việc đóng góp càng lớn khi ít người trợ giúp và nhu cầu cấp bách: «Chắc chắn sẽ không ngang bằng nhau giữa các ngươi, những người đã chi dùng tài sản và chiến đấu trước cuộc chinh phục Makkah (và những người chi dùng tài sản và chiến đấu sau đó). Những người (đã chi dùng tài sản và chiến đấu trước cuộc chinh phục Makkah) sẽ có cấp bậc cao hơn những người chi dùng và chiến đấu sau đó.» (57:10). Cũng từ ý nghĩa ấy, Waraqa ibn Nawfal từng ước mình còn trẻ khỏe khi dân của Thiên Sứ đuổi Người đi, để có thể đứng lên giúp Người (Al-Bukhari 3). Mặc khải chuyển tiền của từ vật để khoe khoang thành phương tiện phụng sự Allah, rồi đưa người đọc trở lại cảnh tập hợp, để thấy kết cục của những thứ con người bám víu và những việc làm còn lại cho họ."}, {"id": "P125", "text": "Câu 40"}, {"id": "P126", "text": "«Vào Ngày mà Ngài (Allah) triệu tập tất cả bọn họ rồi phán bảo các Thiên Thần: “Có phải những kẻ này đã từng tôn thờ các ngươi?”» (34:40)"}, {"id": "P127", "text": "Mạch văn chuyển từ sự tự phụ của con người vì những gì họ có sang Ngày tất cả được tập hợp: kẻ kiêu ngạo dẫn dắt lẫn kẻ yếu thế đi theo đều không thể vắng mặt. Cảnh trước cho thấy các thủ lĩnh phủi bỏ người theo mình. Ở đây, những đối tượng mà người đa thần bám víu để mong trung gian và cầu thay tuyên bố họ không liên can đến sự thờ phượng ấy. Người thờ phượng không thể thoát trách nhiệm bằng cách đổ sang một ông chủ mình đã vâng theo, hay một thụ tạo mình đã tôn thờ ngoài Allah. Trước mặt những người ấy, Allah hỏi các thiên thần liệu những người kia có từng thờ các thiên thần hay không. Allah không hỏi để biết một điều Ngài chưa biết, mà để phơi bày sự thật và xác lập bằng chứng, cho những người đa thần nghe chính những đối tượng mà họ cho là gần gũi với Allah bác bỏ việc họ đã làm. Điều tương tự xuất hiện trong lời Ngài hỏi Isa: «Có phải Ngươi đã nói với nhân loại: “Hãy nhận Ta và Mẹ của Ta làm hai Thượng Đế bên cạnh Allah? (Ysa) sẽ thưa: “Ngài thật quang vinh và trong sạch! Bề tôi không bao giờ có thể nói được điều mà bề tôi không có quyền nói.» (5:116). Qua bước chuyển này, cuộc luận chứng trong chương vẫn gắn với Đời Sau. Vấn đề không phải thắng một cuộc tranh luận rồi ai về nhà nấy, mà là lựa chọn mà mỗi người sẽ gặp hậu quả khi Allah tập hợp họ cùng những kẻ mình đã theo và đã thờ."}, {"id": "P128", "text": "Câu 41"}, {"id": "P129", "text": "«Các Thiên Thần sẽ thưa: “Quang vinh thay Ngài! Ngài là Chủ Nhân của bầy tôi chứ đâu phải chúng. Không, chúng tôn thờ Jinn. Đa số bọn chúng tin tưởng nơi chúng (Jinn).”» (34:41)"}, {"id": "P130", "text": "Các thiên thần bắt đầu bằng việc tôn vinh Allah, khẳng định chỉ Ngài là Đấng bảo hộ của mình: «Ngài là Chủ Nhân của bầy tôi chứ đâu phải chúng.» (34:41). Họ không chấp nhận việc những người đa thần thờ mình, cũng không nhận họ làm những người bảo trợ, mà công bố mình cần đến Thượng Đế và là bầy tôi của Ngài. Một nét tinh tế trong câu trả lời là họ không gắn sự thờ phượng với bản thân, ngay cả để phủ định: họ không nói rằng những kẻ ấy đã không thờ mình. Thay vào đó, họ tôn vinh Allah, khẳng định Ngài là Đấng bảo hộ, rồi mới nêu sự thật về sự lệch lạc của dân ấy.\nVề lời «Không, chúng tôn thờ Jinn.» (34:41) có hai cách giải thích. Có ý kiến cho rằng họ thực sự thờ jinn; rồi khi thấy sự tôn quý của các thiên thần và kết cục của những jinn mà chính họ từng vâng theo, họ mới tuyên bố rằng mình đã thờ các thiên thần. Các thiên thần vạch rõ lời nhận ấy là dối trá. Theo ý kiến khác, jinn tô đẹp và xúi giục họ thờ thiên thần cùng các ngẫu tượng. Do đó, việc nghe theo và vâng lời jinn trong sự đa thần thực chất là thờ jinn, dù họ gọi đối tượng thờ phượng bằng những tên khác. Trong niềm tin của một số người đa thần có việc đặt tên nữ cho các ngẫu tượng và tưởng rằng các thiên thần ngự trong đó, để biến việc thờ chúng thành con đường tìm sự trung gian nơi Allah. Phía sau còn là mong cầu lợi ích trần gian, như có con hay được thắng trận, hoặc ảo tưởng rằng đối tượng mình thờ sẽ cầu thay, giúp họ khỏi phải tuân phục và sám hối.\nMột điều có thể suy ngẫm là cảm giác yếu đuối khiến người ta dễ chấp nhận lệ thuộc. Họ tìm một sức mạnh để dựa vào khi sợ hãi: kẻ yếu bám vào kẻ quyền thế, kẻ quyền thế bám vào tiền của và người trợ giúp; người khác lại tìm đến jinn, như kẻ xuống một thung lũng rồi xin vị chúa jinn ở đó che chở. Tất cả phơi bày sự thiếu thốn của thụ tạo, dù nó tỏ ra mạnh mẽ. Điều ấy cũng thấy ở người bắt chước những kẻ đang chiếm ưu thế chỉ vì choáng ngợp và thấy mình thua kém, đến mức tiếp nhận điều mà nếu tự nhìn nhận, họ chẳng thấy tốt đẹp. Còn các thiên thần, với năng lực Allah đã ban, lại thưa: «Ngài là Chủ Nhân của bầy tôi» (34:41). Họ chỉ ra đúng nơi cần tìm sự nương tựa. Chương này đưa trái tim đang phân tán giữa những sức mạnh ấy trở về mối gắn bó vững chắc với Thượng Đế và mặc khải của Ngài, để cầu Ngài bảo hộ, hướng dẫn, và không biến nhu cầu có sức mạnh thành cửa ngõ thờ phượng một ai khác."}, {"id": "P131", "text": "Câu 42"}, {"id": "P132", "text": "«Vào Ngày mà không ai được quyền giúp đỡ ai cũng như không ai có thể gây hại được cho ai, TA sẽ phán bảo những kẻ làm điều sai quấy: “Các ngươi hãy nếm lấy hình phạt của Hỏa Ngục, cái các ngươi đã từng phủ nhận Nó.”» (34:42)"}, {"id": "P133", "text": "Ngày ấy, những mối quan hệ từng khiến họ tự phụ đều sụp đổ: không ông chủ nào cứu được kẻ theo mình; không đối tượng thờ phượng nào đẩy được hình phạt khỏi người đã thờ nó; cũng không ai tự mình làm hại người khác như họ từng tưởng. Sau khi hỏi các thiên thần và nghe họ tuyên bố không liên can, lời phán hướng đến những kẻ bất công, báo cho họ kết cục phải chịu hình phạt Lửa mà họ đã phủ nhận. Kết thúc này phơi bày điều ẩn sau những mưu tính ấy. Với những người này, thờ các đối tượng trung gian là cách trốn tránh việc thừa nhận một cuộc thanh toán buộc họ phải tuân phục. Họ muốn thỏa mãn ham muốn rồi xin một đối tượng thờ phượng hay vị bảo trợ mình nhận ngoài Allah miễn cho trách nhiệm về hành vi, thay vì sám hối với Thượng Đế và làm theo lệnh Ngài. Khi hy vọng ấy tan biến, sự thật họ né tránh vẫn còn: Lửa không thể bị đẩy lui bằng lời phủ nhận hay sự trung gian tưởng tượng. Vấn đề không chỉ là những kẻ cầu thay đã không giúp được họ. Chính con đường họ chọn vốn là bất công và phủ nhận; họ chỉ thấy rõ điều ấy khi không còn cơ hội sửa lại."}, {"id": "P134", "text": "Câu 43"}, {"id": "P135", "text": "«Và khi các lời mặc khải rõ ràng của TA được đọc ra cho họ thì họ nói: “Người đàn ông này chỉ muốn cản trở các người tôn thờ những thần linh mà cha mẹ của các người đã tôn thờ mà thôi.” Họ nói: “Đây thật ra chỉ là điều giả dối khéo bịa đặt.” Và những kẻ vô đức tin nói về chân lý khi nó đến với họ: “Đây rõ ràng chỉ là bùa mê hoặc.”» (34:43)"}, {"id": "P136", "text": "Sau khi trình bày quyền thống trị và tri thức của Allah, việc Ngài khiến các tạo vật phục vụ Dawood và Sulayman, lấy đi ân huệ của Saba’, cũng như cuộc đối đáp giữa kẻ theo và người được theo, vạch rõ sự tự phụ vì tiền của là vô nghĩa, chương đưa đến những dấu hiệu “rõ ràng”. Chân lý đã hiện rõ, nhưng những kẻ ngoan cố đáp lại bằng ba hướng công kích: nhắm vào vị sứ giả, họ bảo đó chỉ là một người muốn ngăn họ theo đạo cha ông; nhắm vào điều Người mang đến, họ gọi đó là chuyện dối trá bịa đặt; nhắm vào sức tác động đã thấy, họ gọi đó là ma thuật rõ ràng. Việc lặp lại lời “họ nói” tách riêng từng cáo buộc và nhấn mạnh chúng. Đây không phải một lời phản đối thoáng qua: họ tấn công người truyền đạo, rồi đường lối, rồi những gì lời kêu gọi ấy tạo ra trong lòng người.\nChữ “muốn” buộc tội ý định: họ cho rằng Người tìm địa vị lãnh đạo bằng cách lật đổ uy thế của cha ông. Ai bị lợi ích chi phối có thể khó hiểu một việc chỉ nhằm sự hài lòng của Allah, nên đằng sau mọi lời kêu gọi đều tìm tiền bạc hay quyền lực. Tiếp đó, họ khơi lòng tự ái với truyền thống bằng cách nhắc điều cha ông đã thờ, khiến người nghe rời khỏi việc xét bằng chứng để lo mình phản bội cộng đồng và tổ tiên. Sự hãnh diện ấy từng mạnh đến mức có lệnh: «các ngươi hãy tụng niệm Allah giống như việc các ngươi thường hay nhắc về cha mẹ (vì hãnh diện) hoặc nhiều hơn nữa.» (2:200). Cùng một lối ấy là gán người nói sự thật thành kẻ chống quê hương hay chống phong tục, để thiên hạ ghét bỏ trước khi nghe lời giải thích.\nCáo buộc càng gay gắt có thể cho thấy nỗi sợ của những người có thế lực: người yếu thế sẽ chịu ảnh hưởng của mặc khải rồi thoát khỏi quyền họ. Khi người theo bắt đầu bỏ đi, họ càng công kích để giành lại lòng tin; thậm chí dành cho mỗi mặt của lời kêu gọi một luận điệu riêng hay cả một bài công kích. Nhiều lời vu cáo không phải sự lặp lại vô mục đích. Họ gọi Qur’an là sự dối trá bịa đặt, vừa kết tội nói dối vừa cho là tự dựng lên; lúc bảo Người tự làm ra, lúc lại bảo có người dạy giúp: «Đây chỉ là điều dối trá mà Y (Muhammad) đã bịa đặt và một nhóm người nào đó đã giúp Y (làm ra Qur’an)» (25:4). Họ không tìm một mô tả được bằng chứng xác nhận, mà tìm điều khiến người nghe quay đi, dù cáo buộc thay đổi và mâu thuẫn. Cả ba câu đều dùng cách nói giới hạn: “chỉ là…”, để khoác cho điều sai trái vẻ chắc chắn không chấp nhận khả năng khác.\nNhưng sức tác động vẫn là câu hỏi họ phải đối diện. Nếu Qur’an đúng như họ nói, vì sao có người bỏ của cải, gia đình, địa vị và chịu tổn hại vì nó? Vì sao những trái tim cùng hướng đến lắng nghe? Chuyện Abu Bakr cho thấy rõ điều ấy. Ông cầu nguyện và đọc Qur’an trong sân nhà, vốn là người hay khóc. Phụ nữ và con cái của những người đa thần tụ tập quanh ông, ngạc nhiên trước lời đọc ấy. Các thủ lĩnh Quraysh sợ hãi, yêu cầu ông đừng đọc công khai ở nơi ảnh hưởng đến người khác (Al-Bukhari 3905). Không cần một bài diễn thuyết nhắm vào họ: chính tiếng đọc Qur’an đã khiến họ bất an. Vì vậy, họ gọi tác động của chân lý là ma thuật, dựng một cách giải thích nhằm chặn người ta hưởng ứng.\nViệc nêu rõ “những kẻ vô đức tin” ở đây có thể được hiểu theo hai hướng: nhấn mạnh họ che lấp chân lý sau khi nó đã đến và hiện rõ; hoặc nói đến các thủ lĩnh bảo người yếu thế rằng đây là ma thuật rõ ràng, hòng kéo họ khỏi tác động của lời kêu gọi. Chữ “rõ ràng” càng làm luận điệu của họ có vẻ tự tin, như thể điều họ quy là sai quá hiển nhiên không cần bàn, trong khi chính những dấu hiệu của Allah mới rõ ràng. Cách chống các sứ giả ấy cứ lặp lại: «Chẳng lẽ đây là lời di chúc mà chúng truyền cho nhau? Không, (tất cả) bọn chúng đều là một đám vượt quá giới hạn.» (51:53). Cùng một sự ngông cuồng tạo ra những lời giống nhau; các phương tiện ngăn cản cũng giống nhau, dù cách trình bày thay đổi."}, {"id": "P137", "text": "Câu 44"}, {"id": "P138", "text": "«TA (Allah) đã không ban cho họ bất cứ Kinh Sách nào để họ có thể học hỏi; và TA cũng không cử bất cứ người cảnh báo nào đến với họ trước Ngươi cả.» (34:44)"}, {"id": "P139", "text": "Họ dựa vào đâu để quả quyết mặc khải này là bịa đặt? Họ chưa được ban những kinh sách để học, rồi phát hiện nó trái với mặc khải mình biết; cũng chưa có người cảnh báo đến trước Thiên Sứ để họ viện lời người ấy bác bỏ sứ mạng của Người. Đây là một cách hiểu của câu, tước bỏ vẻ hiểu biết khỏi luận điệu của họ: họ bác Kinh Sách bằng ham muốn và bắt chước, chứ không bằng so sánh có bằng chứng. Những kinh sách từ Allah kêu gọi chỉ thờ Ngài và xóa bỏ bất công. Vì thế, những người công bằng trong dân đã được ban Kinh Sách nhận ra nguồn ánh sáng ấy khi nghe Qur’an. An-Najashi nhận ra điều đó và nói rằng những gì ông vừa nghe từ Qur’an và những gì Musa mang đến đều phát ra từ cùng một ngọn đèn: sự đồng nhất của ánh sáng cho thấy cùng một nguồn mặc khải. Abdullah ibn Salam đón nhận Islam. Heraclius cũng nhận ra những đặc điểm của sứ mạng cho thấy Thiên Sứ chân thật, dù ông không đi theo Người (Ahmad 22498; Al-Bukhari 3329 và 7). Hiểu biết từ việc xem xét mặc khải không ngang với những lời cả nhóm nhắc lại mà không có tri thức.\nTheo một hướng khác, câu này nhắc đến vinh dự đáng lẽ phải khiến họ vui mừng: nay có Kinh Sách để học và Sứ Giả cảnh báo, sau thời gian chưa có những điều ấy. Họ đáng lẽ phải đón nhận tri thức thay vì vứt bỏ. Địa vị chưa có kinh sách đối lại với dân đã được ban Kinh Sách, cùng nhu cầu của một số người Ả Rập về tin tức vô hình, từng khiến họ hỏi người khác về sự tạo dựng, cái chết và những gì ngoài giác quan. Qua con đường ấy, nhiều câu chuyện được truyền đến họ. Vậy khi mặc khải làm rõ sự thật đã đến, bỏ điều Allah dùng để tôn vinh mình rồi vẫn bị giam trong sự bắt chước cha ông là một mất mát biết bao! Hai hướng giải thích cùng bác bỏ cáo buộc bịa đặt: họ không có căn cứ, và lời cáo buộc ấy khiến họ bỏ lỡ cơ hội được hướng dẫn và hiểu biết."}, {"id": "P140", "text": "Câu 45"}, {"id": "P141", "text": "«Những kẻ trước họ đã phủ nhận (chân lý). Quả thật, những gì mà (những kẻ đa thần Quraish) có được (từ tiền của, con cái, sức mạnh) không bằng một phần mười các ân huệ mà TA đã ban cho các thế hệ trước nhưng tất cả các thế hệ trước đều phủ nhận các vị Sứ Giả của TA. Bởi thế, (Ngươi – Thiên Sứ hãy xem) sự trừng phạt của TA dành cho họ đã khủng khiếp thế nào.» (34:45)"}, {"id": "P142", "text": "Quraysh không phải dân đầu tiên phủ nhận; sức mạnh của họ cũng không ngăn được điều từng giáng xuống những dân trước. Vì thế, mạch văn đưa họ trở về lịch sử những người phủ nhận. Có hai cách hiểu lời nói về việc chưa đạt một phần mười, tùy đối tượng mà các đại từ chỉ đến. Theo một ý kiến, Quraysh chưa bằng một phần mười sức mạnh và thế lực những dân trước được ban. Bao dân từng có thân hình lớn hơn, quyền lực mạnh hơn, xây dựng trên đất và đục núi làm nơi ở; nhưng khi phủ nhận các sứ giả, sức mạnh không cứu được họ. Đấng đã tiêu diệt họ không bất lực trước Quraysh vốn yếu hơn.\nTheo ý kiến khác, những dân trước chưa nhận được đến một phần mười sự rõ ràng của các dấu hiệu dành cho những người hiện tại. Qur’an đã đến như bằng chứng rõ ràng còn mãi. Mặc khải nói bằng ngôn ngữ của người Ả Rập và xác lập lý lẽ đối với họ là một ân ban lớn biết bao! Về địa vị của dấu hiệu ấy, Thiên Sứ ﷺ nêu: «Mỗi vị ngôn sứ đều được ban những dấu lạ khiến người ta tin.» (Abu Hurayrah; Al-Bukhari 4981; diễn nghĩa). Phần tiếp theo của bản thuật nói: «Điều Ta được ban cho là một sự mặc khải mà Allah đã mặc khải cho Ta, vì vậy Ta hy vọng sẽ là người có số lượng tín đồ đông đảo nhất vào Ngày Phục Sinh.» (Abu Hurayrah; Al-Bukhari 4981). Theo hướng hiểu này, lời cảnh báo càng nghiêm: nếu Allah đã trừng trị những kẻ phủ nhận các sứ giả sau bằng chứng họ nhận, thì người quay lưng sau những bằng chứng lớn lao này sẽ ra sao? Bằng chứng càng rõ, trách nhiệm của kẻ cố ý bác bỏ càng tăng.\nCó bản thuật gán cho Abdullah ibn Amr lời xếp ba nhóm chịu hình phạt nghiêm khắc nhất: những kẻ đạo đức giả, những người vô đức tin trong nhóm được ban bàn thức ăn, và dân của Pha-ra-ông (At-Tabari, Jami al-Bayan 9/132). Cả hai đường truyền được dẫn đều đi qua Abu Mughira al-Qawwas; Sulayman al-Taymi đánh giá ông yếu, còn Ibn Ma‘in đánh giá ông đáng tin. Vì vậy, lời xếp hạng ấy được giữ như một bản thuật có đánh giá khác nhau về người truyền, không được khẳng định chắc chắn. Bài học hiện rõ nơi Pha-ra-ông: «Và quả thật TA đã phơi bày cho hắn (Pha-ra-ông) thấy tất cả phép lạ và bằng chứng của TA nhưng hắn đã phủ nhận và chối bỏ.» (20:56). Và xin đối chiếu trọn lời phán về bàn thức ăn: «Allah phán: “TA sẽ ban nó (bàn thức ăn) xuống cho các ngươi. Tuy nhiên, nếu ai trong các ngươi vô đức tin sau đó thì chắc chắn TA sẽ trừng phạt kẻ đó bằng một sự trừng phạt mà TA chưa từng trừng phạt ai trên đời này.”» (5:115). Trong suy ngẫm của giảng giả, lời đe dọa ấy cho thấy trách nhiệm đặc biệt sau dấu hiệu rõ ràng và tính khác thường của hình phạt. Phần so sánh trong bản dịch vừa dẫn nói đến hình phạt chưa từng có trước đó; nó vẫn nằm trong một lời cảnh báo có điều kiện về hình phạt sẽ đến. Cũng vậy, người đã nghe mặc khải, biết đường lối của Sứ Giả rồi giấu vô đức tin mà tỏ ra trái lại không thể lấy việc mình gần những nơi bằng chứng được trình bày làm lý do bào chữa.\nCâu kết hỏi sự trừng trị của Allah đã như thế nào. Trong cấu trúc tiếng Ả Rập, một chữ chỉ ngôi thứ nhất được lược đi, còn nguyên âm trước đó biểu thị nó: nghĩa là sự phản đối và trừng trị của chính Ngài đối với họ. Sự phản đối của Allah không giống người chỉ có thể lên tiếng bất bình; nó hiện ra bằng hình phạt làm tan sức mạnh của những kẻ quay lưng, khiến điều họ tự phụ không giúp được gì. Lịch sử ở đây không phải tin cũ tách khỏi hiện tại, mà là cảnh báo cho ai lặp lại con đường phủ nhận."}, {"id": "P143", "text": "Câu 46"}, {"id": "P144", "text": "«Ngươi (hỡi Thiên Sứ) hãy nói với (những kẻ thờ đa thần Quraish): “Ta chỉ khuyên các người một điều: các người hãy vì Allah mà đứng lên từng cặp hay từng người rồi suy ngẫm, (chắc chắn các người sẽ thấy) người bạn của các người (Muhammad) không phải là một gã điên mà đích thực là một vị cảnh báo các người về một sự trừng phạt khủng khiếp sắp đến.”» (34:46)"}, {"id": "P145", "text": "Sau cuộc luận chứng dài với nhiều cách làm rõ, một lời khuyên duy nhất tập hợp con đường đón nhận chân lý: người nghe cần đứng lên vì Allah rồi suy nghĩ, khi ở riêng hoặc trao đổi từng hai người. Cụm «Ta chỉ khuyên các người một điều» (34:46) vẫn mang sự chân thành và thương cảm. Sau bao lần bị bác bỏ, Sứ Giả vẫn muốn họ được cứu, trao cho họ một điều rõ ràng để tự mang về suy ngẫm. Đó cũng là tinh thần công bằng trong lời trước: «Hãy bảo họ “Ai cung cấp bổng lộc cho các người từ các tầng trời xuống dưới đất?” Hãy bảo họ: “Allah!” \"(Giữa chúng ta), chúng tôi hay quí vị sẽ là người công khai đi đúng đường hay lạc đường.”» (34:24). Vẻ ngoài của quyền lực và vô số lời bôi nhọ có thể lấn át một người. Họ cần lời nói mở cửa suy xét, kéo mình khỏi tiếng ồn đã che mất bằng chứng.\nTrước hết là “đứng lên”: nghiêm túc bắt tay tìm hiểu, thay vì buông xuôi trong hoang mang hay lặp lại lời đám đông. Nghe nhiều ý kiến trái ngược về cùng một chuyện, người ta có thể mệt mỏi, bảo rằng không còn tin ai. Nhưng sự mệt mỏi ấy không miễn cho họ việc tìm sự hướng dẫn, bởi điều liên quan là kết cục của chính mình nơi Allah. Tìm kiếm không phải chọn lời hợp ý, bảo đảm lợi lộc và thoải mái rồi gọi đó là tìm chân lý. Vì thế, việc đứng lên được gắn với “vì Allah”: nhằm sự hài lòng của Ngài, chứ không để thuận theo xã hội, có địa vị hay làm vừa lòng người mình sợ trách móc.\nHành trình Salman là một ví dụ. Để biết tôn giáo chân thật, ông rời những gì quen thuộc, đi tìm người dẫn đến chân lý qua vùng Sham, Mosul, Nisibin và Ammuriyya, theo những hiểu biết tìm được; cuối cùng đến đất Ả Rập rồi gặp Thiên Sứ tại Madinah (Ahmad 23737). Khát vọng chân thành không nằm yên như một ước muốn: nó khiến người ta lên đường và chịu cái giá của việc tìm kiếm.\nTiếp đến, cụm «từng cặp hay từng người» (34:46) gợi môi trường phù hợp để suy nghĩ. Một người la hét có thể phá hỏng cả đám đông ồn ào, biến trao đổi lý lẽ thành tranh cãi dồn dập không ai nghe ai. Sợ trở thành người đầu tiên khác ý số đông, có người công khai bác điều mà nếu tự xem xét, họ sẽ chấp nhận. Chẳng hạn, nghe một ý tưởng chưa quen như dạy trẻ ở nhà, cả nhóm vội chế giễu trước khi xét tính khả thi và sự phù hợp với từng hoàn cảnh. Điều đáng suy ngẫm là phán xét đã bị đám đông dẫn dắt trước khi ý tưởng được cân nhắc. Nỗi sợ lời chê có thể còn nghiêm trọng hơn: có người thời trước Islam vì một nỗi nhục tưởng tượng mà chôn sống con gái, để cái nhìn xã hội lấn át lòng thương và tình yêu trong mình.\nCũng thấy ảnh hưởng ấy ở người trẻ được khuyên cầu nguyện giữa nhóm bạn. Họ gạt đi, chống chế vì mải lo bạn bè sẽ nói gì và sợ mất sự đồng hành. Nhưng khi một người thương mình nói riêng, họ lại lắng nghe, mềm lòng và chấp nhận. Ở riêng, hoặc trò chuyện giữa hai người chân thành, biết suy xét và muốn được hướng dẫn, sẽ giảm những tác động ngăn nghe lời. Người có học tôn giáo cũng không miễn nhiễm. Họ có thể theo một ngành khiến nhóm mình kính nể, bỏ điều bản thân hay cộng đồng cần hơn, chỉ vì ngại kém địa vị. Đứng lên vì Allah đòi hỏi xét lại mục đích trong cả hai trường hợp, trở về điều làm Ngài hài lòng.\nSau khi thành thật trong tìm kiếm và làm dịu các tác động bên ngoài, lời khuyên hướng người nghe đến việc suy xét về «người bạn của các người» (34:46). Đây là người họ biết đã lâu, biết sự chân thật, đáng tin và sáng suốt của Người, chứ không phải người lạ chưa từng được kiểm nghiệm. Đồ người khác gửi giữ vẫn còn nơi Người đến lúc di cư (Al-Bayhaqi 12823); khi tranh chấp việc đặt Hắc Thạch, họ từng chấp nhận phán quyết của Người (At-Tayalisi 115). Làm sao những điều đã biết ấy phù hợp với lời buộc tội điên dại? Vì sao Người chịu tổn hại và nguy hiểm, bỏ sự yên ổn, kêu gọi họ mà không đòi tiền? Người còn mang Qur’an thách họ đưa ra điều tương tự, nhưng họ không có gì bác bỏ bằng chứng ấy.\nMột chuyện được truyền lại về Al-Walid ibn Al-Mughira minh họa việc Qur’an tác động rồi bị khước từ dưới áp lực người đời. Thiên Sứ đọc cho ông nghe, khiến lòng ông dịu lại. Khi hay chuyện, Abu Jahl ép ông nói điều khiến dân mình hài lòng. Dù đã thừa nhận lời nghe được khác thường, có sự ngọt ngào và vẻ đẹp, cuối cùng Al-Walid vẫn gọi đó là ma thuật (Al-Hakim, Al-Mustadrak 2/550). Al-Hakim đánh giá chuỗi truyền là xác thực theo điều kiện của Al-Bukhari; Muqbil al-Wadi‘i nhận xét đường truyền nối liền qua Ma‘mar là bất thường. Al-Bayhaqi cũng ghi những đường truyền không nối liền đến vị Sahabah. Đánh giá về đường truyền nối liền này vì vậy có khác biệt giữa các học giả. Vấn đề không phải lòng ông không chịu tác động, mà là ông quay lại tính toán phản ứng của dân mình.\nLời khuyên kết bằng nhiệm vụ thật sự của Sứ Giả: Người chỉ cảnh báo họ trước một hình phạt nghiêm khắc. Người không điên dại, cũng không tìm lợi ích từ họ, mà cảnh báo hậu quả gần kề cần đánh thức sự suy xét. Đừng để việc tan buổi gặp cũng chấm dứt suy nghĩ về điều đã nghe."}, {"id": "P146", "text": "Câu 47"}, {"id": "P147", "text": "«Hãy bảo: “Phần thưởng mà ta có thể hỏi từ các người là của các người; còn phần thưởng của ta thì do Allah (ban cấp) bởi vì Ngài chứng giám tất cả mọi việc.\"» (34:47)"}, {"id": "P148", "text": "Việc phủ nhận đòi thù lao càng làm rõ điều cần suy xét. Người cảnh báo họ không biến lời kêu gọi thành nguồn lấy tiền của họ, cũng không tìm cho mình lợi lộc từ những gì họ bỏ ra. Một cách hiểu phần đầu là Người vốn không hề đòi thù lao; và giả sử từng đòi điều gì, Người cũng trả lại cho họ. Cách đặt giả thiết ấy dẹp bỏ nghi ngờ về lợi ích riêng. Có ý kiến cho rằng lợi ích của zakat, bố thí và chi dùng mà Người kêu gọi đều trở về với chính họ, không phải thù lao cho Người hưởng. Theo ý kiến khác, ý nghĩa rộng hơn: lời kêu gọi và Qur’an đem lợi ích cho họ, bởi họ là người được hướng dẫn và cứu thoát khi đi theo; còn phần thưởng truyền đạt sứ mạng, Người chỉ mong nơi Allah. Các cách hiểu cùng gặp nhau ở sự thuần khiết của sứ mạng: việc họ chấp nhận không đem thêm cho Người một lợi ích riêng đang theo đuổi.\nLời kết khẳng định Allah chứng kiến mọi sự. Ngài biết lời và ý định của Sứ Giả, không điều chân thật hay dối trá nào khuất khỏi Ngài. Nếu Người bịa chuyện nhân danh Ngài, Ngài đủ sức phơi bày điều trái với lời Người nhận. Sự trợ giúp, việc nâng cao danh tiếng và gìn giữ Người cho đến khi truyền đạt sứ mạng là những biểu hiện Allah làm chứng cho Sứ Giả. Khi đã xem xét con người họ biết, việc Người không đòi khoản thù lao mà họ gán cho, và sự trợ giúp của Allah, họ phải đối diện với chính bằng chứng, thay vì trốn bằng một cáo buộc về ý định không hề có chứng cứ."}, {"id": "P149", "text": "Câu 48"}, {"id": "P150", "text": "«Ngươi (hỡi Thiên Sứ) hãy nói: “Quả thật, Thượng Đế của Ta ban Chân Lý xuống (để loại bỏ điều ngụy tạo) và Ngài là Đấng Thông Toàn mọi điều vô hình.”» (34:48)"}, {"id": "P151", "text": "Chân lý mà Thượng Đế đưa đến là mặc khải Sứ Giả mang theo, nền tảng để đối diện với điều sai trái và xác lập bằng chứng chống lại nó. Sức mạnh của chân lý ấy không được đo bằng sự yếu thế của người mang nó hay sự thiếu khả năng diễn đạt của người đối thoại. Người nói có thể yếu mà bằng chứng Qur’an vẫn vững; tình thế chiến đấu và thực hiện có thể đổi thay mà một tín ngưỡng sai không vì vậy thành đúng. Cần phân biệt sự sáng tỏ của bằng chứng với thắng bại xảy đến cho người theo nó. Sức mạnh vật chất không thay được lập luận; thiếu sức mạnh cũng không bác bỏ được bằng chứng.\nHình ảnh ném chân lý cho thấy sức mặc khải đánh trúng gốc rễ điều sai và loại bỏ nó: «Không! TA lấy Chân Lý chọi sự ngụy tạo, Chân Lý đập mạnh vào sự ngụy tạo làm cho sự ngụy tạo vỡ tan.» (21:18). Hình ảnh đánh vào đầu nói lên việc điều sai không còn đứng vững bằng lý lẽ. Qur’an không chỉ là những nét tinh tế về ngôn từ để người nghe trầm trồ, những đạo đức chung tách khỏi việc chỉ thờ Allah, hay những thói quen thực hiện mà không nhìn chân lý nó xác lập và sự đa thần nó phá bỏ. Nó đi thẳng vào cuộc đối đầu giữa hướng dẫn và lầm lạc. Mối thù ấy đã có từ lâu; một mặt của nó hiện ra trong chuyện Iblis đi quanh Adam sau khi ông được tạo dựng (Muslim 2611). Mặc khải giúp con người nhận biết kẻ thù và con đường thoát khỏi sự dẫn dụ của nó.\nBằng chứng có thể hiện rõ mà vẫn bị người theo đuổi điều khác ngoài chân lý chối bỏ, như Al-Walid nhận ra tác động của Qur’an rồi chuyển sang lời làm vừa lòng dân mình. Việc được nghe bằng chứng ấy quan trọng đến mức Allah ra lệnh bảo đảm an toàn cho người đa thần xin nương náu để người ấy được nghe, rồi đưa đến nơi an toàn: «Nếu có người đa thần nào đến xin Ngươi (hỡi Thiên Sứ) chỗ tị nạn thì Ngươi hãy che chở y để y có thể nghe lời phán của Allah, sau đó đưa y đến nơi an toàn.» (9:6). Mục đích là để họ có cơ hội biết chân lý, không để sợ hãi cản trở việc nghe mặc khải, và lựa chọn trên cơ sở sáng tỏ. Xin đối chiếu cả câu nói về Badr: «Các ngươi (những người có đức tin) hãy nhớ lại lúc các ngươi ở phía bên này gần (thung lũng Badr) và họ (những kẻ đa thần Quraish) ở phía bên kia cách xa (thung lũng) hơn, còn đoàn khách thương thì ở vị trí thấp hơn các ngươi (đang di chuyển về hướng biển đỏ). Nếu như các ngươi đã hẹn giao chiến (với chúng từ trước) thì chắc chắn các ngươi đã gặp phải sự thất bại. Tuy nhiên, (cuộc giao chiến đã diễn ra) là bởi vì Allah muốn hoàn thành một vấn đề đã được định sẵn, (đó là) để ai tới số chết thì phải chết theo bằng chứng rõ ràng và ai vẫn còn sống thì sẽ sống theo bằng chứng rõ ràng. Quả thật, Allah hằng nghe, hằng biết.» (8:42). Trong suy ngẫm ở đây, giảng giả nhấn mạnh trách nhiệm đáp lại sau khi bằng chứng đã rõ; cách diễn đạt bản dịch vừa dẫn đặt sự sống và cái chết trong bối cảnh trận chiến.\nCách gọi “Thượng Đế của Ta” gợi sự chăm sóc dành cho Sứ Giả mang bằng chứng ấy. Sự vững vàng của Người không phải sức cá nhân tách khỏi sự quan tâm của Thượng Đế. Kết câu càng làm rõ: Đấng đưa chân lý xuống là Đấng biết mọi điều vô hình, trái với những kẻ phủ nhận mà chương sẽ nói: «họ đã thường phỏng đoán về điều vô hình từ một nơi xa.» (34:53). Hai hình ảnh đối nhau ở người ném, điều được ném và mức độ hiểu biết: một bên là Thượng Đế đưa chân lý xuống với tri thức trọn vẹn; bên kia là con người tung phỏng đoán không bằng chứng, không có kinh sách đang học để làm căn cứ. Họ như người bắn từ xa đã nhắm mắt rồi cứ bắn. Khoảng cách cùng sự không nhìn thấy cho thấy luận điệu hỏng đến đâu, dù giọng nói tự tin thế nào.\nKhác biệt ấy tác động đến những quan niệm định hướng cuộc sống, trong đó có chính trị, tiền của và quan hệ giữa người với người, như chủ nghĩa xã hội, chủ nghĩa tư bản, chủ nghĩa tự do và chủ nghĩa thế tục khi chúng trình bày một quan niệm bao trùm về đời sống. Một quan niệm do con người xây dựng có thể đúng ở điểm cụ thể hay phù hợp với một phán đoán đúng, nhưng không vì vậy mà toàn bộ nền tảng của nó là sự hướng dẫn. Cũng không đúng khi phủ nhận mọi điều cụ thể được những người có quan điểm trái với mặc khải thừa nhận. Cần xét các nền tảng xác định mục đích con người, đối tượng họ thờ và thước đo phán xét, rồi quy các vấn đề cụ thể về điều chân thật đã được xác lập.\nSự hướng dẫn giải phóng trái tim khỏi nô lệ cho thụ tạo, giúp nó biết Thượng Đế và kết cục của mình, đem đến phương hướng không chỉ giới hạn ở lợi ích tức thời. Đấng biết mọi điều vô hình biết hậu quả của việc theo hay bỏ mặc khải, và điều con người cần trong tương lai. Sự hướng dẫn của Ngài không ngang với một thử nghiệm của con người mà một phần thiếu sót chỉ lộ ra sau khi người ta đã hứng hậu quả. Nhìn hiện tại, có người thấy khó tin rằng mặc khải này có thể giúp nhân loại đến Ngày Phán Xét, hay những người yếu thế giữa lòng Makkah có thể mang tôn giáo ấy ra thế giới. Nhưng điều xa lạ với hiểu biết hạn hẹp của họ không khuất khỏi Đấng đã ban mặc khải và biết những kết cục của nó. Khi tin vào kiến thức ít ỏi quen thuộc rồi ngạc nhiên rằng sự hướng dẫn vẫn thích hợp với điều mình chưa chứng kiến, ta cần nhớ tri thức bao la của Đấng ban nó. Điều kín và điều hiện đều ngang nhau trong tri thức Allah: «Ai trong các ngươi giấu giếm lời nói (của mình) hoặc ai nói toạc ra ngoài cũng như ai ẩn mình trong đêm tối với ai bước đi ngang nhiên giữa bán ngày, (đối với Ngài) tất cả đều như nhau cả.» (13:10). Không được lấy tri thức thụ tạo đo tri thức của Ngài: «Không có cái gì giống Ngài. Và Ngài là Đấng Hằng Nghe, Đấng Hằng Thấy.» (42:11). Lòng tin mặc khải bắt nguồn từ việc biết Đấng đã ban nó và sự hiểu biết bao quát của Ngài, chứ không từ ý nghĩ rằng con người đã hiểu hết mọi mặt khôn ngoan trong đó."}, {"id": "P152", "text": "Câu 49"}, {"id": "P153", "text": "«Ngươi (hỡi Thiên Sứ) hãy nói: “Chân lý đã đến thì sự ngụy tạo không thể bắt đầu (bất cứ điều gì) cũng như không thể phục hồi được.”» (34:49)"}, {"id": "P154", "text": "Sau lời Thượng Đế đưa chân lý đến, nay là tuyên bố chân lý đã đến. Chính sự xuất hiện của nó phơi bày sự bất lực của điều sai: «Ngươi hãy nói (với người đa thần): “Chân lý đã đến thì điều ngụy tạo phải tan biến. Quả thật, mọi điều ngụy tạo đều tiêu tan (vì không đứng vững trước chân lý).» (17:81). Người theo chân lý không đợi điều sai tự nguyện nhường chỗ rồi mới truyền đạt và hành động. Một ví dụ về sự chờ đợi sai lầm ấy là lời con cháu Israel; xin đọc cả câu làm bối cảnh: «Họ đáp: “Hỡi Musa! Quả thật, nơi đó có một dân tộc sức mạnh phi thường; và thực sự chúng tôi sẽ không bao giờ tiến vào (thánh địa) được trừ phi chúng rời khỏi nơi đó. Bởi thế, nếu chúng ra đi thì chúng tôi sẽ vào.”» (5:22). Họ đặt việc dân trong vùng phải rời đi làm điều kiện để mình bước vào, như muốn đạt đích sau khi điều mình được giao đối diện đã tự biến mất. Việc sửa đổi cũng không thành chỉ bằng chờ điều sai lùi bước, mà cần trình bày chân lý và thực hiện nó.\nLời kết của câu có những cách hiểu riêng biệt. Theo một ý kiến, điều sai không còn khả năng tiến hay lùi trước bằng chứng đã đến: sự bất lực đã lộ, không còn sức đối lại. Theo ý kiến khác, nó không tạo ra ban đầu và cũng không phục sinh sau cái chết. Vậy sao lại thờ điều không làm được cả hai và đặt nó ngang Đấng Tạo Hóa? Một điều có thể suy ngẫm là chân lý gây dựng cộng đồng, hướng dẫn họ đến điều làm mình sống, và phục hồi những điều kiện đứng dậy khi họ sa sút rồi quay về với nó. Điều sai không ban sự hướng dẫn bền vững để chỉnh đốn đời này và Đời Sau, cũng không chữa được sự hư hỏng do rời chân lý.\nĐiều này không phủ nhận sự tồn tại của những quốc gia mạnh về vật chất mà không theo Islam. Một nhà nước đứng được bằng sức mạnh và tiền của là một chuyện; một cộng đồng được hướng đến đời sống có mục đích, đạo đức và sự phát triển đúng đắn là chuyện rộng hơn. Hai góc nhìn về sức mạnh của người ngoài Islam giúp tránh bị vẻ ngoài đánh lừa. Thứ nhất, những điều công bằng, xóa áp bức và khuyên nhau chân thành nơi một số họ cũng là các giá trị những sứ mạng ngôn sứ mang đến. Không phải mọi điều họ thực hiện và nhờ đó mạnh lên đều sai, dù họ không quy nó về mặc khải. Thứ hai, hơn người khác ở một mức tương đối không chứng tỏ mọi mặt đều tốt. Sự tụt hậu của người Muslim có thể trầm trọng đến mức người ở trên họ trông như đã đạt hoàn hảo, dù vẫn có thiếu sót đạo đức và xã hội.\nVí như hai người ở hai bậc khác nhau dưới mặt đất: người thấp hơn thấy người kia cao hơn mình, nhưng cao hơn tương đối không có nghĩa người kia đã lên mặt đất. So sánh có thể cho thấy người thứ nhất xuống thấp đến đâu, chứ không chứng minh người thứ hai đã tới đích. Vì thế, bắt chước dáng vẻ sức mạnh không thay được việc xét theo thước đo chân lý; tự hào về mặc khải cũng không miễn việc thực hành và nắm lấy những phương tiện tạo sức mạnh mà mặc khải đã ra lệnh."}, {"id": "P155", "text": "Câu 50"}, {"id": "P156", "text": "«Ngươi (hỡi Thiên Sứ) hãy nói với (những kẻ thờ đa thần Quraish): “Nếu Ta lầm lạc thì thật ra chỉ bản thân Ta lầm lạc mà thôi nhưng nếu Ta được hướng dẫn thì đó là do những gì mà Thượng Đế của Ta đã mặc khải cho Ta. Quả thật Ngài hằng nghe và Ngài ở gần kề.”» (34:50)"}, {"id": "P157", "text": "Phần luận chứng này khép lại bằng tinh thần công bằng đã mở đầu. Sứ Giả đặt trước họ giả thiết về sự lầm lạc mà họ gán cho Người, nêu rằng nếu điều ấy xảy ra thì hậu quả trở về chính Người, và nguồn lầm lạc ở bản thân khi rời sự hướng dẫn. Mệnh đề điều kiện không thừa nhận Người từng lầm lạc, cũng không biểu thị nghi ngờ mặc khải đã đến. Đây là cách hạ mình trong đối thoại, đưa họ trở lại xét bằng chứng và chặn lời vin vào cáo buộc ý đồ. Rồi Người quy mọi sự hướng dẫn về Thượng Đế qua mặc khải Ngài ban. Nếu ngay Sứ Giả, người chân thật và sáng suốt nhất, còn xác định mình được hướng dẫn bằng mặc khải này, thì ai kém hơn có thể lấy trí óc, kinh nghiệm hay đông người trợ giúp để khỏi cần nó? Điều Người mang đến không phải thủ đoạn tìm quyền lực, mà là sự hướng dẫn từ Thượng Đế nghe lời các bầy tôi và biết nhu cầu của họ. Hai thuộc tính Hằng Nghe và Gần Gũi trấn an người truyền đạt: Allah nghe điều họ nói và lời nói với họ, biết nhu cầu của họ cùng những người họ kêu gọi đến sự hướng dẫn. Cuộc đối diện ấy không nằm ngoài tri thức và sự chăm sóc của Ngài."}, {"id": "P158", "text": "Câu 51"}, {"id": "P159", "text": "«Nếu Ngươi (hỡi Thiên Sứ) có thể nhìn thấy được tình cảnh bọn họ sợ hãi (khi nhìn thấy sự trừng phạt), bọn họ vô phương trốn thoát và sẽ bị túm bắt từ một nơi rất gần,» (34:51)"}, {"id": "P160", "text": "Sau năm lệnh “hãy nói” liên tiếp mở cho những người quay lưng nhiều cánh cửa công bằng và suy xét, cảnh hoảng sợ xuất hiện để lời cảnh báo hậu quả luôn hiện diện: giá như thấy họ lúc kinh hoàng rồi không tìm được lối thoát! Có nhiều cách hiểu về thời điểm này. Theo một ý kiến, đó là nỗi sợ tại Badr khi những kẻ phủ nhận thấy quân Muslim cùng các thiên thần đang chiến đấu bên phía quân Muslim. Theo ý kiến khác, đó là lúc chết, khi họ thấy các thiên thần và điều các vị ấy đem đến: «Giá như Ngươi (hỡi Thiên Sứ) thấy được cảnh tượng khi các Thiên Thần bắt hồn những kẻ vô đức tin bằng cách đánh vào mặt và lưng của chúng; và (các Thiên Thần bảo chúng): “Các ngươi hãy nếm lấy hình phạt của Lửa thiêu đốt!”» (8:50). Còn một ý kiến cho rằng đó là nỗi kinh hoàng Ngày Phán Xét, khi điều họ phủ nhận hiện ra và Lửa được đưa đến. Bản thuật của Abdullah bin Mas‘ud mô tả cảnh Hỏa Ngục được đưa đến: «Ngày hôm đó, Hỏa Ngục sẽ được mang đến với bảy mươi ngàn chiếc khoen cầm, mỗi chiếc khoen có đến bảy mươi ngàn Thiên Thần nắm kéo.» (Abdullah bin Mas‘ud; Muslim 2842).\nMỗi hướng giải thích đều nêu một khoảnh khắc sự ngang ngược phủ nhận biến thành sợ hãi. Con người muốn chạy khỏi điều đã thấy, nhưng câu trả lời là không thể thoát. Họ không vượt khỏi quyền năng Allah, cũng không khiến Ngài bất lực bằng bỏ chạy. Việc bị bắt từ một nơi gần phá tan ý nghĩ có nơi nào che chở khỏi Ngài. Dù ở đâu họ vẫn bị bắt, dù hiểu cảnh này là hình phạt đời này, cái chết hay Ngày Phán Xét. Sự gần gũi ở đây cho thấy quyền năng bao trùm và việc bắt họ thật dễ dàng, sau khi họ tưởng sức mạnh mình có giữ mình xa hình phạt."}, {"id": "P161", "text": "Câu 52"}, {"id": "P162", "text": "«Thì bọn họ nói: “Chúng tôi giờ đây đã có đức tin”, tuy nhiên, làm sao bọn họ có thể nhận được đức tin từ một nơi quá xa xôi!» (34:52)"}, {"id": "P163", "text": "Lúc ấy họ nói mình đã tin, sau khi các dấu hiệu từng được trình bày, quyền thống trị và tri thức của Allah đã được làm rõ, họ từng được mời xét sự chân thật của Sứ Giả mà vẫn quay lưng. Nay sự thừa nhận đi cùng hoảng sợ, sau thời gian đức tin được mở ra khi họ còn có thể lựa chọn và hành động. Từ ngữ trong nguyên văn gợi việc với lấy: như người đưa tay lấy một vật ở gần, cùng ý nghĩa tiếp cận từ gần trong một từ cùng gốc. Nhưng nay họ muốn với lấy điều đã xa: đức tin vốn đem lại ích lợi trong thời gian còn được chấp nhận, nhưng nay thời hạn ấy đã qua. Câu hỏi làm rõ rằng lúc ấy họ không thể đạt được. Khi đức tin ở ngay trước mắt, họ từ chối; đến lúc hết cơ hội sửa lại mới mong trở về. Khoảng cách không đơn thuần là quãng đường đôi chân đi được, mà là sự cách biệt giữa hai tình trạng: tin do tự lựa chọn khi mặc khải kêu gọi, và buộc phải thừa nhận khi tận mắt thấy điều không thể đẩy lui. Hình ảnh bàn tay vươn ra mà không chạm tới làm hiện rõ nỗi tiếc nuối: họ bỏ phí điều từng rất gần, rồi cố lấy lại khi đã quá muộn."}, {"id": "P164", "text": "Câu 53"}, {"id": "P165", "text": "«Quả thật, họ đã phủ nhận chân lý từ trước và họ đã thường phỏng đoán về điều vô hình từ một nơi xa.» (34:53)"}, {"id": "P166", "text": "Lời cầu xin muộn màng ấy không đến sau một sự không hay biết vì chưa được giải thích. Họ từng phủ nhận khi đức tin đã được trình bày; hơn cả quay lưng, họ còn ném vào chân lý và người mang nó những lời không có hiểu biết. Họ gọi mặc khải là dối trá, ma thuật, công kích người đồng hương mình, nói như đã biết điều phía sau trong khi cách xa bằng chứng. Lời về việc phỏng đoán điều vô hình từ nơi xa làm hiện lại sự đối lập với: «Quả thật, Thượng Đế của Ta ban Chân Lý xuống (để loại bỏ điều ngụy tạo) và Ngài là Đấng Thông Toàn mọi điều vô hình.» (34:48). Đấng ban chân lý biết điều vô hình; còn họ tung phỏng đoán về điều không biết. Không thể với lấy đức tin lúc ấy không phải sự bất công đối với họ. Chính họ tự làm mình xa khi con đường tin còn gần, chọn ngăn người khác, cho đến khi điều từng quả quyết bác bỏ trở thành điều tận mắt thấy, mà không thể trở về thời gian còn được lựa chọn."}, {"id": "P167", "text": "Câu 54"}, {"id": "P168", "text": "«Giữa họ và những điều mà họ mong ước có một bức màn ngăn cách, tương tự trường hợp đã xảy ra cho những kẻ như họ trong quá khứ. Quả thật, họ là đám người đã luôn ở trong tình trạng hoài nghi.» (34:54)"}, {"id": "P169", "text": "Chương kết bằng sự ngăn cách phơi bày kết cục của những điều họ từng bám víu. Một cách hiểu là họ bị ngăn khỏi tiền của, con cái và hưởng thụ đời này mà mình yêu thích. Kết thúc trở về lời khoe khoang: «Bọn ta có nhiều tiền của và đông con cái, và bọn ta chắc chắn sẽ không bị trừng phạt.» (34:35). Những gì đang có từng làm họ tự phụ, nhưng khi chết, họ không thể mang theo hay ở lại bên chúng. Hình ảnh người bám lấy tiền của muốn đưa tay tới mà bị ngăn, hoặc mong tiếp tục vui hưởng với con cái nhưng thời gian ở cùng đã hết, cho thấy sự bất lực của thứ họ lấy làm nguồn sức mạnh và an toàn.\nTheo một ý kiến khác, họ bị ngăn khỏi sám hối và đức tin mà nay mong muốn khi thời hạn đã qua. Họ hối hận từng lời công kích tôn giáo, từng lần chống chân lý, nhưng ước muốn muộn không đưa lại thời gian hành động. Hình phạt còn đến mức họ không được phép bào chữa: «Chúng cũng sẽ không được phép biện minh.» (77:36). Họ được bảo: «Các ngươi hãy cút vào trong đó (Hỏa Ngục) và chớ thưa bẩm gì với TA nữa!» (23:108). Nỗi tiếc không chỉ vì mất hưởng thụ, mà vì sự cứu thoát từng ở gần đã bị bỏ đi. Điều ấy từng xảy ra với những kẻ giống họ trong các dân phủ nhận trước kia. Những người cùng phe ở đây là những kẻ theo cùng con đường vô đức tin và quay lưng; nguyên nhân lặp lại nên hậu quả cũng lặp lại.\nLời kết nêu tình trạng đã ăn sâu: họ luôn ở trong sự hoài nghi gây bất an. Nỗi phân vân không khiến họ chân thành đứng lên vì Allah và tìm bằng chứng. Mỗi khi mặc khải gần đánh thức trái tim, họ lại quay về sợ mất địa vị và do dự, cho đến hết đời vẫn đẩy xa điều mời gọi mình được cứu. Kết thúc vì thế nối với lời khuyên đứng lên vì Allah, từng đôi và từng người. Suy nghĩ chân thành giúp thoát quyền chi phối của đám đông; còn mãi tính toán làm vừa lòng nó sau khi chân lý hiện rõ có thể giam con người đến phút cuối.\nChuyện Abu Talib lúc chết là một minh họa. Bản thuật Al-Bukhari 1360 kể việc Thiên Sứ ﷺ đến thăm và mời ông xác nhận chỉ Allah xứng đáng được thờ phượng. Phần giải thích của bản dịch nêu mục đích: «một lời mà cháu sẽ dùng nó để chứng nhận cho bác nơi Allah.» (phần giải thích bản dịch; Al-Bukhari và Muslim). Abu Jahal và 'Abdullah bin Abi Umayyah cứ hỏi: «Chẳng lẽ ngươi muốn từ bỏ tôn giáo của 'Abdul Muttalib ư?» (Al-Musayyab qua Sa‘id; Al-Bukhari và Muslim). Lời đáp cuối của Abu Talib được ghi là: «Theo tôn giáo của 'Abdul Muttalib» (Al-Musayyab qua Sa‘id; Al-Bukhari và Muslim). Chính hai người ấy đặt câu hỏi, còn Sứ Giả kêu gọi ông đến đức tin. Lòng tự ái với truyền thống vẫn đè nặng khi ông không còn thời gian trì hoãn quyết định.\nChuyện Al-Walid cũng đã cho thấy ông chịu tác động khi nghe Qur’an, rồi quay lại tính phản ứng dân mình và điều cần nói để họ hài lòng. Về ông có lời: «Y quả thật đã suy tính và mưu đồ.» (74:18). Suy tính bị chê ở đây là toan tính để gạt chân lý đã hiện rõ, khác với tìm hiểu chân thành được lệnh trong câu 46. Không có mâu thuẫn giữa kêu gọi suy ngẫm và cảnh báo sự do dự không tuân phục. Người bầy tôi cần đấu tranh với điều cản mình theo sự hướng dẫn, tranh thủ khi nhận ra nó, trước khi điều hôm nay còn chọn được trở thành điều ngày mai chỉ biết khao khát mà đã bị ngăn cách."}], "credits": "NGUỒN BẢN DỊCH\n\nQur’an: Nhóm biên dịch Rowwad; Hasan Abdulkarim; Kinh Quran — Maulana Wahiduddin Khan và Prof. Farida Khanam, Goodword Books (2026).\n\nHadith: Tóm Lược Riyadh Al-Saaliheen và các đoạn diễn nghĩa riêng cho bài học. Bộ sưu tập và người truyền được ghi bên từng bản thuật.\n\nCác ghi chú của bản dịch và thông tin về từng ấn bản nằm trong mục Ghi chú và Nguồn.", "text": "Suy ngẫm về chương Saba’\n\nChương được mặc khải tại Makkah • 54 câu\n\nNội dung dựa trên các bài giảng giải chương Saba’ của Tiến sĩ Ahmad ‘Abd al-Mun‘im, theo sáu bản chép lời giảng được cung cấp.\n\nBản này gồm toàn bộ các câu của chương và phần giảng giải trong tư liệu gốc. Những lời giải thích nằm rải rác được tập hợp về đúng chỗ; các cách hiểu, dẫn chứng và ví dụ được giữ lại trong lời văn giảng giải đã biên tập.\n\nVăn bản Qur’an tiếng Ả Rập trong tư liệu gốc: dự án Tanzil, phiên bản 1.1. Các bản dịch ý nghĩa được ghi nguồn riêng.\n\n© 2007–2026 Tanzil Project · CC BY 3.0 · https://tanzil.net\n\n«Nhân danh Allah, Đấng Độ Lượng, Đấng Khoan Dung» (1:1)\n\nCâu 1\n\n«Alhamdulillah, Đấng mà mọi vật trong các tầng trời và mọi vật trong trái đất đều là của Ngài, Đấng mà mọi lời ca ngợi và tán dương ở Đời Sau đều thuộc về một mình Ngài. Ngài là Đấng Sáng Suốt, Thông Toàn.» (34:1)\n\nLời ca ngợi Allah mở đầu cách suy ngẫm về chương này. Trước khi nói đến sức mạnh, tiền của và mưu kế của những kẻ sống xa hoa, chương đưa trái tim trở về sự thật về quyền sở hữu: «mọi vật trong các tầng trời và mọi vật trong trái đất đều là của Ngài» (34:1). Những gì tạo vật đang nắm giữ chưa từng thoát khỏi quyền cai quản của Thượng Đế. Chính Ngài tạo ra chúng, sở hữu chúng và có toàn quyền định đoạt.\n\nTừ đó, người có đức tin nhìn cảnh mình bị chèn ép một cách sáng suốt. Ưu thế về tiền của và trang bị của những kẻ theo điều sai có thể khiến một số người tuyệt vọng, rút lui, thỏa hiệp hoặc đổi hướng dù trước đó họ đang đi đúng đường. Người yếu thế cũng có thể bị thử thách đến mức tưởng rằng lẽ phải thuộc về kẻ mạnh. Chương này củng cố người đang làm việc vì đức tin, đánh thức người bị sức mạnh làm cho choáng ngợp và nhắc kẻ kiêu ngạo rằng điều họ tự đắc chỉ là một ân huệ có thể bị thu lại.\n\nĐó là một tác động của Qur’an trong đời sống. Qur’an được mặc khải đến những trái tim đang đối mặt với vấn đề của bản thân, gia đình, xã hội và cuộc đấu tranh với điều sai. Nhu cầu của họ không chỉ là hiểu những từ ngữ khó. Về việc mặc khải từng phần, Allah phán: «như thế là để TA củng cố tấm lòng của Ngươi (Muhammad)» (25:32). Nếu trái tim Thiên Sứ Muhammad ﷺ còn được củng cố bằng mặc khải, những người sau Người càng cần ánh sáng ấy. Allah cũng mô tả tác động của một chương đối với người có đức tin: «đối với những người có đức tin, điều đó đã làm cho họ gia tăng thêm đức tin và họ rất đỗi vui mừng» (9:124). Hiểu lời giảng giải mở ra ý nghĩa; sau đó, sức sống, ánh sáng và sự hướng dẫn ấy phải thể hiện trong niềm xác tín, hành động và cách đánh giá mọi việc.\n\nCó năm chương mở đầu bằng lời ca ngợi: Al-Fatihah, Al-An‘am, Al-Kahf, Saba’ và Fatir. Đặc tính được nhắc ngay sau lời ca ngợi soi sáng một phần mục đích của mỗi chương. Al-Fatihah mở đầu: «Alhamdulillah (xin tạ ơn, ca ngợi và tán dương Allah), Thượng Đế của vũ trụ và vạn vật.» (1:2), rồi đến lời cầu xin được dẫn theo con đường ngay chính. Nhờ ân huệ và sự hướng dẫn của Thượng Đế, con người được cứu khỏi cơn giận và sự lầm lạc. Al-An‘am mở đầu: «Alhamdulillah, Đấng đã tạo hóa các tầng trời và trái đất và làm ra bóng tối (ban đêm) và ánh sáng (ban ngày).» (6:1). Người bề tôi nhớ đến ân huệ được chỉ rõ và phân biệt đúng sai, trong khi chương cũng phơi bày sự ngu muội của việc thờ phụng đa thần, đến mức giết cả con mình. Al-Kahf mở đầu: «Alhamdulillah, Đấng đã ban xuống Kinh Sách cho người bề tôi của Ngài và không làm cho Nó quanh co.» (18:1). Giữa những thử thách về quyền lực, tiền của và tri thức, người có đức tin ca ngợi Thượng Đế vì Kinh Sách hướng dẫn mình. Còn ở đây, trước bao phương tiện khiến những kẻ theo điều sai tự mãn, ta ca ngợi Allah vì toàn bộ quyền sở hữu đều thuộc về Ngài.\n\nCa ngợi là tán dương Allah vì Ngài xứng đáng với mọi lời tán dương nhờ các thuộc tính hoàn hảo của Ngài. Điều đó không tùy thuộc vào việc người bề tôi có hiểu ân huệ trong từng việc xảy đến hay không. Còn biết ơn gắn với sự ban ơn và đối đãi tốt đẹp. Ta ca ngợi Ngài khi có thức ăn cũng như khi thiếu ăn, trong cơn túng quẫn và sau khi vượt qua nó, trước khi có điều kiện vững vàng và sau khi có được điều ấy. Tầm nhìn hạn hẹp hoặc lòng ham muốn những điều trước mắt có thể che khuất lẽ khôn ngoan, nhưng không làm Allah mất đi sự xứng đáng được ca ngợi.\n\nTheo bản thuật của ‘Aishah: «Khi thấy điều mình yêu thích, Thiên Sứ của Allah ﷺ nói: “Mọi lời ca ngợi đều thuộc về Allah. Nhờ ân huệ của Ngài mà những việc thiện được trọn vẹn.” Khi thấy điều mình không thích, Người nói: “Mọi lời ca ngợi đều thuộc về Allah trong mọi hoàn cảnh.”» (‘Aishah; Ibn Majah 3803; Darussalam: yếu).\n\nViệc nhắc các tầng trời trước đưa tầm nhìn ra khỏi sức mạnh chật hẹp trên mặt đất, hướng đến sự bao la trong vương quyền của Allah. Dù máy móc và phương tiện lớn đến đâu, tài sản của con người vẫn nhỏ bé trước những thiên thể và chân trời họ không thể bao quát. Ngoài thế giới nhìn thấy, còn có thế giới vô hình, các thiên thần và Đời Sau. Vì thế, đừng giới hạn cách đánh giá sự thật vào phần mắt mình nhìn được.\n\nRồi đến lời: «mọi lời ca ngợi và tán dương ở Đời Sau đều thuộc về một mình Ngài» (34:1). Ở đó, những sự thật về lẽ khôn ngoan và sự thưởng phạt từng bị che khuất ở đời này được phơi bày; việc Allah xứng đáng được ca ngợi trở nên rõ ràng. Tương tự là lời: «Đấng Toàn Quyền của Ngày Thưởng Phạt» (1:4). Allah sở hữu tất cả mọi ngày, nhưng trong Ngày Thưởng Phạt, quyền sở hữu ấy hiện rõ đến mức không ai còn nhận mình có quyền lực bên cạnh Ngài.\n\nỞ đời này, người bề tôi có thể bối rối trước việc một người có đức tin bị thử thách hoặc một kẻ bất công được trì hoãn. Khi kết quả cuối cùng lộ rõ, họ hiểu rằng điều từng tưởng là bị hạ nhục lại là được nâng cao; có sự trì hoãn mở lối cho sám hối, cũng có sự trì hoãn khiến tội lỗi tăng thêm. Allah phán: «Chẳng qua TA trì hoãn (việc trừng phạt) là để cho họ gia tăng thêm tội lỗi» (3:178). Một hình ảnh giúp hiểu sự sáng tỏ sau điều từng khó hiểu là: «Đó là ý nghĩa về những điều mà Ngươi đã không thể nhẫn nại được.» (18:82). Trong các cách hiểu về lời «(Đó là) Ngày mà Ngài gọi các người (từ cõi mộ) rồi các người sẽ liền (đứng dậy) đáp lại lời gọi bằng lời tạ ơn Ngài» (17:52), có cách hiểu rằng khi được phục sinh, tạo vật thừa nhận sự vĩ đại của Thượng Đế, sau khi những gì che khuất điều ấy đã tan đi.\n\nÂn huệ rộng lớn và sự thưởng phạt công bằng của Ngài còn thể hiện ở việc một điều thiện được nhân từ mười đến bảy trăm lần, một điều xấu chỉ bị ghi là một, và việc từ bỏ điều xấu còn có thể được ghi thành điều thiện. Ở phần tiếp theo của bản thuật về cách ghi nhận việc thiện và việc xấu, có lời: «Trước Allah, chỉ ai tự đẩy mình đến chỗ diệt vong mới phải diệt vong.» (Ibn ‘Abbas; Muslim 131.02, tiếp theo 131.01; diễn nghĩa). Trong việc cầu thay, Thiên Sứ ﷺ phủ phục trước Thượng Đế; Allah mở cho Người những lời ca ngợi để Người tán dương Ngài. (Al-Bukhari 4712.) Lời ca ngợi hiện diện khi sự thật được phơi bày và khi bắt đầu phân xử giữa tạo vật.\n\nPhần mở đầu kết bằng: «Ngài là Đấng Sáng Suốt, Thông Toàn.» (34:1). Con người có thể sở hữu nhiều của cải nhưng sử dụng sai chỗ vì thiếu hiểu biết hoặc dại dột. Còn quyền sở hữu của Allah luôn đi cùng sự khôn ngoan hoàn hảo và tri thức bao trùm. Khôn ngoan là đặt sự vật đúng chỗ; sự am tường là biết thực chất và kết quả của chúng. Với con người, một bác sĩ học kiến thức rồi còn cần kinh nghiệm thực hành. Trong câu chuyện về chuyến đi đêm và thăng thiên, Musa đã khuyên Thiên Sứ ﷺ trở lại thưa với Thượng Đế về số lễ nguyện, dựa trên kinh nghiệm của mình khi hướng dẫn con cháu Israel. (Al-Bukhari 3207.) Còn Allah không tiếp thu tri thức qua trải nghiệm, cũng không chờ một việc xảy ra rồi mới biết kết quả. Ngài biết điều đã xảy ra, điều sẽ xảy ra và cả điều không xảy ra: nếu nó xảy ra thì sẽ như thế nào.\n\nĐấng điều hành những thử thách và sự đổi thay của các điều kiện mà người có đức tin chứng kiến chính là Đấng sở hữu mọi vật, Đấng Khôn Ngoan, Am Tường. Sự an lòng của họ dựa trên hiểu biết ấy, dù họ chưa thể nắm hết từng lẽ khôn ngoan.\n\nCâu 2\n\n«Những gì chui vào lòng đất, những gì nhô lên khỏi mặt đất, những gì rơi xuống từ trên trời và những gì bay lên trời, Ngài đều biết rõ về chúng. Và Ngài là Đấng Hằng Khoan Dung, Hằng Tha Thứ.» (34:2)\n\nSau quyền sở hữu bao trùm là tri thức bao trùm. Câu Kinh mở ra trước trái tim hình ảnh một vũ trụ không ngừng vận động: những gì đi vào đất, đi ra từ đất, từ trời xuống và lên trời. Điều này không chỉ giới hạn ở cảnh mưa rơi, cây mọc quen thuộc với mắt người. Không một hạt bụi, giọt nước hay chuyển động kín đáo nào nằm ngoài sự hiểu biết của Allah. Mọi bổng lộc, ân huệ hay hình phạt được ban xuống; mọi lời cầu xin, tôn vinh, ca ngợi hay việc làm được đưa lên, đều nằm trong tri thức của Ngài.\n\nNgài biết cả điều thiện và điều xấu được ghi trong hành động của bề tôi, đến cả một ánh nhìn và sự nghi ngờ xấu ẩn trong lòng người nhìn. Tuy nhiên, việc tội lỗi được ghi chép không có nghĩa chúng được đưa lên để được chấp nhận. Allah phán: «Mọi lời nói tốt đẹp sẽ bốc lên tận Ngài và mọi việc làm phúc thiện sẽ tâng bốc nó» (35:10). Trong lời giảng, việc đi lên ở đây gắn với sự nâng lên và được Allah chấp nhận. Nếu con người phải đếm hết những gì đi vào, đi ra, xuống và lên chỉ trong một khoảnh khắc, họ cũng bất lực. Còn tri thức của Allah không bị việc này làm xao lãng việc khác.\n\nTrái tim cần tầm nhìn rộng ấy khi bị hoàn cảnh bó hẹp. Có người phóng đại quyền lực của một kẻ bất công đến mức tưởng rằng cả vũ trụ phụ thuộc vào việc kẻ đó còn sống hay đã chết, trong khi hắn chỉ là tạo vật yếu đuối, có thể bị một nguyên nhân rất nhỏ làm cho bất lực. Việc củng cố tinh thần không phải là điều nằm ngoài trách nhiệm mang thông điệp. Khi được cử đến Pha-ra-ông, Musa cầu xin được mở rộng lòng, được thuận lợi trong công việc và được tháo gỡ trở ngại trong lời nói. Musa và Harun thưa: «Cả hai (Musa và Harun) thưa: “Lạy Thượng Đế của bầy tôi! Quả thật, bầy tôi sợ rằng hắn (Pha-ra-ông) sẽ có hành động quá quắt hoặc tàn bạo với bầy tôi.”» (20:45). Hai vị được đáp: «(Allah) phán: “Hai ngươi đừng sợ! Quả thật TA luôn ở cùng với hai ngươi. TA nghe và thấy (hết mọi việc).”» (20:46). Hai vị vốn biết Allah nghe và thấy, nhưng ngay trong hoàn cảnh sợ hãi ấy, họ cần sự củng cố đặc biệt này. Vì vậy, ta đọc mặc khải nhiều lần để niềm xác tín về điều đã biết được làm mới trong lòng và bước chân được vững vàng.\n\nTrong những gì lên và xuống còn có hành động của bề tôi và bổng lộc của họ. Nếu ở đời này mọi việc đều được thưởng phạt ngay lập tức và đầy đủ, mỗi tội đều nhận hình phạt tương ứng, thì sẽ không còn cảnh con người vẫn được an lành dù còn thiếu sót như ta đang thấy. Allah phán: «Nếu Allah bắt phạt nhân loại cho tội lỗi mà họ đã phạm thì Ngài đã không chừa trên mặt đất bất kỳ một loại sinh vật nào sống sót» (35:45). Nhưng đây là cõi được trì hoãn và chịu thử thách; sự thưởng phạt trọn vẹn thuộc về một ngày khác.\n\nHadith cho biết không ai kiên nhẫn hơn Allah trước lời xúc phạm Ngài nghe thấy: con người gán con cái cho Ngài, còn Ngài vẫn ban cho họ bổng lộc và sức khỏe. (Al-Bukhari 6099.) Điều đó giúp thấy sự phù hợp của lời: «Và Ngài là Đấng Hằng Khoan Dung, Hằng Tha Thứ.» (34:2). Dù biết hết mọi việc họ làm, Ngài không cắt bổng lộc sau mỗi tội lỗi, mà thương xót, trì hoãn và tha thứ. Theo một khía cạnh khác, sự điều hành và ban tặng ấy đòi hỏi lòng biết ơn lớn lao, nhưng con người lại thiếu sót; Ngài vẫn đối đãi với họ bằng lòng thương xót và sự tha thứ. Sự khác biệt giữa những người hành động để biết ơn và những người quay lưng với ân huệ sẽ thể hiện qua gia đình Dawood và dân Saba’. Đừng để việc tiếp tục được an lành làm mình quên bổn phận đối với Đấng Ban Ơn.\n\nCâu 3\n\n«Những kẻ vô đức tin nói: “Giờ Tận Thế sẽ không xảy đến cho chúng tôi.” Ngươi (hỡi Thiên Sứ) hãy nói với họ: “Không, thề bởi Thượng Đế của Ta, Đấng biết điều vô hình, chắc chắn Giờ Tận Thế sẽ xảy đến cho các người. Không một vật gì trong các tầng trời cũng như không một vật gì trong trái đất nằm ngoài tầm kiểm soát của Ngài, cho dù đó chỉ là sức nặng của một hạt nguyên tử; và không một vật gì dù nhỏ hay lớn hơn (hạt nguyên tử) mà lại không được ghi sẵn trong một Quyển Sổ rõ ràng.”» (34:3)\n\nSau khi làm rõ quyền sở hữu, tri thức và sự khôn ngoan, chương nêu lời những kẻ phủ nhận: «Giờ Tận Thế sẽ không xảy đến cho chúng tôi» (34:3). Ở đây, sự phản đối không nhắm vào từng chi tiết của trời đất mà bám vào Đời Sau. Việc phải chịu xét xử cản lại ham muốn được làm bất cứ điều gì mình muốn, rồi cho rằng mọi hậu quả sẽ chấm dứt khi cuộc đời kết thúc. Qur’an vạch rõ động cơ ấy: «Không! Con người (phủ nhận sự Phục Sinh) vì muốn tiếp tục phạm tội ở phía trước.» (75:5).\n\nLời đáp vì thế trực tiếp và dứt khoát. Toàn câu cho thấy lời thề trong ngữ cảnh của nó: «Những kẻ vô đức tin nói: “Giờ Tận Thế sẽ không xảy đến cho chúng tôi.” Ngươi (hỡi Thiên Sứ) hãy nói với họ: “Không, thề bởi Thượng Đế của Ta, Đấng biết điều vô hình, chắc chắn Giờ Tận Thế sẽ xảy đến cho các người. Không một vật gì trong các tầng trời cũng như không một vật gì trong trái đất nằm ngoài tầm kiểm soát của Ngài, cho dù đó chỉ là sức nặng của một hạt nguyên tử; và không một vật gì dù nhỏ hay lớn hơn (hạt nguyên tử) mà lại không được ghi sẵn trong một Quyển Sổ rõ ràng.”» (34:3). Lời thề nhân danh Thượng Đế gợi nhớ quyền nuôi dưỡng và sự khôn ngoan của Ngài. Đấng đã nuôi dưỡng bề tôi bằng ân huệ và ban sự hướng dẫn không để mọi việc kết thúc vô nghĩa. Bị áp bức không phải là kết cục cuối cùng của người chịu oan. Những người bị ném xuống hào lửa không kết thúc ở ngọn lửa ấy: người có đức tin kiên định sẽ được phần thưởng trong Thiên Đàng.\n\nSự khẳng định mạnh mẽ trong lời đáp tương ứng với mức độ phủ nhận. Họ nói Giờ Tận Thế không đến với mình; lời đáp hướng thẳng đến chính họ, khẳng định Giờ Tận Thế chắc chắn sẽ đến với những người phủ nhận, bằng cả lời thề và cách nhấn mạnh trong tiếng Ả Rập. Việc xét xử không còn là chuyện nói về những người xa lạ: chính các người là đối tượng được nhắc đến. Đó là sự chính xác khi đối diện một nghi vấn: trả lời đúng chỗ vướng mắc, không để một phần nội dung của nó bị bỏ qua. Trong chương, mệnh lệnh “Hãy nói” được lặp lại trước những lời lẽ ngày càng nhiều, để mưu kế ngày đêm không độc chiếm việc hình thành nhận thức của mọi người.\n\nSau đó, Thượng Đế được mô tả là «Đấng biết điều vô hình» (34:3). Điều họ chưa thấy không vì vậy mà không tồn tại; Ngài biết nó. Lời tiếng Ả Rập diễn tả rằng không gì khuất khỏi tri thức Ngài. Không một hạt nhỏ nào trong trời đất, không điều gì nhỏ hơn hay lớn hơn thế, lại không được ghi trong một Quyển Sổ rõ ràng. Bản dịch phía trên diễn đạt bằng hình ảnh mọi vật đều trong tầm kiểm soát của Ngài; ở đây, lời giảng nhấn mạnh sự biết rõ, không hề bỏ sót.\n\nChi tiết ấy có hai mặt liên quan đến lời đáp cho việc phủ nhận phục sinh. Tri thức bao trùm mọi phần của tạo vật, dù chúng đã phân tán hoặc ẩn khuất, cho thấy việc tập hợp chúng không làm Ngài bất lực. Việc ghi đếm mọi hành động, dù rất nhỏ, cũng cắt đứt hy vọng thoát khỏi sự xét xử. Lời Luqman dạy con giúp ta hiểu cả hai mặt: «“Này con yêu dấu! Dẫu cho có một vật gì nhẹ bằng sức nặng của một hạt cải và dẫu cho nó có nằm trong đá hoặc trong các tầng trời hoặc dưới đất đi nữa thì Allah thừa khả năng mang nó ra ngoài (cho thiên hạ thấy). Bởi vì quả thật, Allah Rất Mực Tinh tế, Rất Mực Am Tường.» (31:16). Nếu hiểu vật nhỏ bằng hạt cải là một hành động kín đáo, thì Allah sẽ đưa nó ra để xét xử. Nếu nhìn vào vật ẩn trong đá hoặc giữa các chân trời, ta thấy quyền năng đưa nó ra và tri thức về vị trí của nó. Không hành động nào bị thất lạc; việc gom lại những gì phân tán không làm Ngài bất lực. Giờ Tận Thế mà họ phủ nhận sẽ đến bằng tri thức, quyền năng và sự khôn ngoan của Ngài.\n\nCâu 4\n\n«(Mọi thứ được ghi trong quyển sổ) để Ngài ban thưởng cho những người có đức tin và hành thiện. Họ là những người sẽ được sự tha thứ và được ban cho bổng lộc thật vinh dự (Thiên Đàng).» (34:4)\n\nCâu Kinh nêu một mục đích của việc Giờ Tận Thế đến: đức tin và việc thiện được đền đáp. Sự khôn ngoan của Allah không để người kiên nhẫn, cống hiến ngang bằng với người quay lưng; người đứng hành lễ và nhịn chay ngang bằng với người bất tuân. Ngay trong đời sống, ta cũng nhận ra sự khác biệt giữa người chăm chỉ trong công việc, học tập và người bỏ bê. Vậy sao lại nghĩ rằng cuộc đời mang trách nhiệm trước Allah cuối cùng sẽ xóa nhòa mọi khác biệt giữa người hành động và người không làm?\n\nDẫu vậy, người có đức tin không đến gặp Thượng Đế với sự tự mãn về việc mình làm. Sự đền đáp được mở đầu bằng tha thứ trước khi nói đến bổng lộc cao quý. Dù vâng phục đến đâu, họ vẫn chưa thể biết ơn cho xứng với mọi ân huệ của Allah và vẫn cần Ngài tha thứ cho thiếu sót.\n\nRồi đến bổng lộc cao quý. Có cách giải thích rằng điều cao quý ở đây là nó đến mà không cần vất vả, khó nhọc. Cư dân Thiên Đàng tìm thấy điều mình mong muốn, không phải chịu những việc đi lại, tìm kiếm, chờ đợi hay lo tiền bạc thường gắn với nhu cầu ở đời này. Cũng có cách giải thích rằng đó là bổng lộc không ngừng: niềm vui không bị sự cạn kiệt nối tiếp. Họ vừa được tha thứ thiếu sót, vừa được ban tặng để tôn vinh.\n\nCâu 5\n\n«Những ai cố gắng chống phá các lời mặc khải của TA thì chắc chắn sẽ phải chịu một sự trừng phạt đau đớn.» (34:5)\n\nĐối diện những người có đức tin là một nhóm không chỉ quay lưng mà còn dốc sức chống lại các dấu hiệu của Allah. Dốc sức là bỏ công và dùng hết khả năng. Vì thế, đừng hình dung việc ngăn cản con đường của Allah chỉ là trò đùa thoáng qua hay một câu nói không có kế hoạch phía sau. Người làm việc ấy có thể bỏ tiền, thời gian, thức đêm và nghiên cứu để phá hỏng nguồn hướng dẫn của mọi người.\n\nMột hình thức là sắp đặt chuyện giải trí đúng vào giờ thờ phượng, giữ khán giả lại sau bữa ăn đến mức họ ngại đứng dậy hành lễ, hoặc kéo sự chú ý đi vào lúc họ lẽ ra có thể đến với Qur’an. Tác động của một chương trình không tách rời thời điểm của nó và phần đời nó chiếm lấy ở người xem. Allah phán: «Nếu các ngươi đau đớn (bởi thương vong) thì bọn họ cũng bị đau đớn (bởi thương vong) tương tự như các ngươi» (4:104). Nỗ lực dành cho điều sai là một thực tế mà người trình bày lẽ phải cần hiểu.\n\nỞ đây, những gì bị nhắm đến là các dấu hiệu của Allah. Có cách hiểu rằng đó là các lời mặc khải, phù hợp với câu tiếp theo nhắc đến «những điều được ban xuống cho Ngươi (hỡi Thiên Sứ) từ Thượng Đế của Ngươi» (34:6); cũng có cách hiểu bao gồm những bằng chứng Allah đặt trong vũ trụ. Giới từ trong cách diễn đạt tiếng Ả Rập gợi sự đào sâu để công kích, chứ không chỉ lướt qua hời hợt. Cắt con người khỏi nguồn đức tin còn nghiêm trọng hơn tranh giành một món tài sản có thể đổi chủ hoặc một thế lực có thể tiêu tan. Tương tự là lời của Jinn: «Quả thật, kẻ ngu ngốc (Iblis) trong chúng ta đã nói về Allah những điều quá đáng cho Allah.» (72:4). Làm sai lệch lời nói về Allah là làm hỏng gốc rễ mối liên hệ với Ngài.\n\nBản dịch câu 34:5 mô tả nhóm người ấy bằng cụm «cố gắng chống phá các lời mặc khải của TA» (34:5). Theo một cách giải thích của lời giảng về cách đọc معاجزين, họ muốn làm ra vẻ các dấu hiệu ấy bất lực, không đưa đến điều chúng hướng dẫn. Còn có cách đọc معجّزين, được lời giảng giải thích là làm người khác chùn bước và ngăn họ đón nhận mặc khải. Cụm tiếng Việt vừa dẫn là cách diễn đạt của bản dịch được chọn; hai cách giải thích về cách đọc được nêu riêng. (Ibn al-Jazari, An-Nashr fi al-Qira’at al-‘Ashr, phần các cách đọc trong chương Al-Hajj.) Hai hướng ngăn cản gặp nhau: gieo nghi vấn để bóp méo mặc khải và dùng ham muốn để khiến người ta không đến được với nó. Vai trò ấy có thể chia ra giữa người công kích Qur’an, người công kích Sunnah cùng những người truyền lại Sunnah và người làm cạn thời gian của người khác trong chuyện giải trí.\n\nHai câu sau cung cấp ngữ cảnh cho những cách giải thích về việc chia phần: «Giống như việc TA đã từng cảnh báo với những kẻ đã chia rẽ tôn giáo của chúng.» (15:90); «Đó là những kẻ đã phân chia Qur’an thành nhiều phần (chúng nói: đây là ma thuật, hoặc bói toán hoặc thơ ca).» (15:91). Có cách hiểu rằng họ chia nhau các lời công kích: người gọi Thiên Sứ là nhà thơ, người gọi là kẻ mất trí, người gọi là thầy bói. Cũng có cách hiểu liên hệ từ ngữ ấy với việc thề thốt. Theo cách hiểu về sự phân chia lời lẽ, nhiều lời công kích khác nhau cùng hướng đến việc chặn Qur’an, dù cách diễn đạt của mỗi người không giống nhau. Bản dịch được trích nêu cách hiểu riêng của nó; những cách giải thích trên là các cách hiểu được lời giảng nhắc đến.\n\nViệc ngăn người ta nghe và cố tình gây nhiễu cùng xuất hiện trong lời: «Những kẻ vô đức tin khuyên bảo nhau rằng “Mọi người đừng thèm nghe Qur’an này, hãy nói chuyện ồn ào và gây náo động (khi Nó được xướng lên), như thế có lẽ các ngươi sẽ nắm ưu thế (trong việc ngăn Muhammad xướng Nó và kêu gọi đến với Nó).”» (41:26). Họ không chỉ muốn người ta quay lưng, mà còn muốn lấp chỗ ấy bằng tiếng ồn để Qur’an không chạm được đến trái tim. Câu «Các ngươi vui đùa và không quan tâm.» (53:61) cũng được giải thích, theo một cách hiểu, là họ hát khi nghe Qur’an, đổi việc lắng nghe điều nhắc nhở mình lấy sự chìm đắm trong vui chơi.\n\nViệc những kẻ ngăn cản yêu thế gian không có nghĩa họ không chịu chi nó ra để cản người khác đến với lẽ phải. Họ có thể thấy sự lan rộng của tôn giáo đe dọa những gì mình muốn giữ, nên bỏ ra một phần điều mình yêu thích để giữ phần còn lại. Allah phán: «Quả thật, những kẻ vô đức tin thường chi dùng tài sản của chúng vào việc ngăn chặn con đường chính đạo của Allah. Vì vậy, chúng sẽ tiếp tục chi dùng tài sản của chúng (vào việc đó), rồi đây chúng sẽ phải hối tiếc» (8:36). Bởi thế, họ bị cảnh báo về hình phạt đau đớn nghiêm khắc. Một cách giải thích từ ngữ về hình phạt ở đây là mức độ dữ dội của nó. Họ muốn che khuất sự hướng dẫn đối với cả cộng đồng, giữ cộng đồng làm tù nhân của ham muốn và sự đánh tráo. Mức độ phá hoại ấy vượt xa một tội lỗi chỉ liên quan đến riêng bản thân, và giúp hiểu lời cảnh báo nghiêm khắc theo sau sự mô tả về nỗ lực của họ.\n\nCâu 6\n\n«Những ai được ban cho kiến thức thì thấy những điều được ban xuống cho Ngươi (hỡi Thiên Sứ) từ Thượng Đế của Ngươi là Chân Lý và hướng dẫn (nhân loại) đến con đường của Đấng Toàn Năng, Đáng Ca Tụng.» (34:6)\n\nDù bao công sức được bỏ ra để bóp méo mặc khải, lẽ phải vẫn sáng rõ với người được ban tri thức về nó. Qur’an không mô tả người có đức tin như thể chính họ phải tạo ra sự sáng rõ của các câu Kinh. Họ tin và làm việc thiện; tác động của Qur’an thể hiện trong đức tin, hành động và việc họ truyền đạt Nó. Còn người muốn phủ nhận sự hướng dẫn của Qur’an lại phải không ngừng tìm cách che khuất sự sáng rõ ấy.\n\nCách nói “nhìn thấy” diễn tả sự nhận biết chắc chắn, vững vàng trước sự đánh tráo. Những dấu hiệu mà đối thủ muốn làm ra vẻ bất lực hoặc mâu thuẫn lại được người có tri thức nhìn rõ là chân thật. Không phải ai giỏi tranh luận cũng sáng suốt giữa thử thách. Tri thức hữu ích ở đây gắn với mặc khải và dẫn đến nhận biết Allah. Chức danh hay nhiều thông tin không thể thay thế gốc rễ ấy. Người đã thấy rõ phải trình bày điều mình biết. Khi những người yếu thế thú nhận ảnh hưởng của việc «đã bày mưu cả đêm lẫn ngày» (34:33), ta thấy cần biết bao một nỗ lực liên tục để gỡ bỏ sự mập mờ, không để đầu óc mọi người thành miếng mồi cho tuyên truyền.\n\nToàn câu cho thấy mối liên hệ giữa tri thức, chân lý và sự hướng dẫn: «Những ai được ban cho kiến thức thì thấy những điều được ban xuống cho Ngươi (hỡi Thiên Sứ) từ Thượng Đế của Ngươi là Chân Lý và hướng dẫn (nhân loại) đến con đường của Đấng Toàn Năng, Đáng Ca Tụng.» (34:6). Trong nguyên bản tiếng Ả Rập, cách đặt đại từ phân cách không chỉ nói rằng điều được ban xuống là chân lý mà còn nhấn mạnh tính xác thực và riêng biệt của nó. Điều này phù hợp với một bối cảnh đầy những lời khẳng định cạnh tranh, đến mức người ta muốn khiến công chúng tuyệt vọng về khả năng biết sự thật, rồi nói rằng mình không tin ai, không biết nên theo ai. Người có tri thức không hòa tan sự hướng dẫn của Allah vào những lựa chọn trái ngược với nó.\n\nNhững kẻ phủ nhận đã bộc lộ mức độ khó chịu trước việc mặc khải này là chân lý khi nói: «Và hãy nhớ khi chúng thưa: “Ôi Allah! Nếu (Qur'an) này là Chân Lý do Ngài ban xuống thì xin Ngài hãy làm cho mưa đá đổ từ trên trời xuống đè lên chúng tôi hoặc mang một hình phạt đau đớn nào đến trừng phạt chúng tôi!”» (8:32). Họ không xin được hướng dẫn nếu đó là chân lý, mà chọn hình phạt thay vì thuận theo. Họ còn đòi: «Ngươi (hỡi Muhammad) hãy mang đến cho bọn ta một quyển Qur’an khác quyển này hoặc hãy thay đổi nó đi!» (10:15).\n\nLời «hướng dẫn (nhân loại)» (34:6) bổ sung một ý nghĩa thực hành. Người có tri thức thấy sự chân thật của Qur’an và thấy Nó hướng dẫn đời sống. Điều ấy đối diện với những người cố thuyết phục công chúng rằng giáo luật bất lực trong việc sửa chữa đời sống, hoặc các quy định về giao dịch, tiền bạc và xã hội không thể áp dụng. Qur’an hướng dẫn và tạo tác động thực tế khi con người tin và thực hành. Chân lý ấy không bị tách khỏi thành quả của việc đi theo.\n\nCon đường của Nó là «con đường của Đấng Toàn Năng, Đáng Ca Tụng» (34:6): ngay thẳng, dẫn đến Thượng Đế không ai thắng được, Đấng xứng đáng với mọi lời ca ngợi. Quyền năng đối diện với lời gán cho mặc khải sự bất lực; việc đáng ca ngợi đối diện với những thiếu sót người ta vu cho Nó. Trong những ý nghĩa của tên gọi “Đáng Ca Tụng” trong câu 34:6 có việc Ngài đáng được ca ngợi trong chính Ngài và trong hành động của Ngài, cũng như Ngài khen ngợi những việc các tôi tớ trung thành làm để vâng phục Ngài. Đi theo sự hướng dẫn của Ngài là con đường đến với sức mạnh và việc làm đáng ca ngợi. Ngay từ đầu chương, người có đức tin đã bắt đầu hành trình bằng lời ca ngợi Thượng Đế vì quyền sở hữu và sự khôn ngoan của Ngài.\n\nCâu 7\n\n«Những kẻ vô đức tin (bảo nhau về Thiên Sứ một cách chế giễu và nhạo báng) nói: “Các người có muốn chúng tôi chỉ cho các người một người đàn ông, Y sẽ nói cho các người biết rằng khi các người (chết đi, thân xác các người) đã hoàn toàn mục rã thì các người chắc chắn sẽ được tạo hóa mới trở lại?!”» (34:7)\n\nLập trường của những kẻ phủ nhận chuyển từ việc tự mình chối bỏ Giờ Tận Thế sang lan truyền sự chối bỏ ấy. Ban đầu, họ nói: «Giờ Tận Thế sẽ không xảy đến cho chúng tôi» (34:3). Sau đó, họ quay sang lôi kéo người khác; toàn câu ghi cách giới thiệu đầy chế giễu của họ: «Những kẻ vô đức tin (bảo nhau về Thiên Sứ một cách chế giễu và nhạo báng) nói: “Các người có muốn chúng tôi chỉ cho các người một người đàn ông, Y sẽ nói cho các người biết rằng khi các người (chết đi, thân xác các người) đã hoàn toàn mục rã thì các người chắc chắn sẽ được tạo hóa mới trở lại?!”» (34:7).\n\nHọ không trình bày một vấn đề để tìm bằng chứng, mà dùng sự tò mò và nhạo báng để dẫn dắt người nghe: có một người mang tin lạ, rồi họ kể lời người ấy theo cách khiến người nghe tưởng rằng chỉ cần nghe đã đủ để bật cười. Việc nói đến “một người đàn ông” không xác định trong tiếng Ả Rập còn hàm ý hạ thấp vị thế, dù họ biết rõ đang nhắm đến ai. Cách dùng từ chỉ việc báo tin càng làm đậm vẻ kỳ lạ của câu chuyện.\n\nHọ không chỉ nói khi các người chết, mà mô tả: «khi các người (chết đi, thân xác các người) đã hoàn toàn mục rã» (34:7). Họ gợi ra cảnh các bộ phận phân tán đến cùng cực, rồi đặt nó đối diện với một sự tạo hóa mới để khiến đám đông cho là không thể. Người chế giễu tôn giáo cũng có thể làm tương tự: cắt một câu khỏi một quy định hoặc tin về Đời Sau rồi biến thành chuyện đùa, hay đặt hình ảnh một thân xác tan rã cạnh hình ảnh người ấy lúc còn sống. Cảm xúc đi trước việc xét bằng chứng. Qur’an vạch rõ gốc rễ của sự cho là khó tin ấy: «Y đưa ra hình ảnh thí dụ cho TA nhưng lại quên mất sự tạo hóa của mình (khi y đã được TA tạo ra từ cái không là gì). Y bảo: “Ai có thể làm sống lại những khúc xương khi chúng đã rã mục?”» (36:78). Người ấy chỉ chăm chăm vào xương mục, quên mất sự tạo dựng ban đầu mà câu hỏi cần trở về.\n\nKẻ dẫn người khác đi lạc không phải lúc nào cũng đưa ngay kết luận từ đầu. Họ có thể dựng cả một cảnh khiến người nghe tưởng mình tự phán đoán, trong khi thực ra đã bị dẫn tới đó. Trong câu chuyện Musa, những người kêu gọi tập hợp nói, trong ngữ cảnh của câu: «Và mọi người bảo nhau: “Các người không đi dự đại hội (để xem ai thắng trong cuộc so tài giữa Musa và các phù thủy) sao?”» (26:39); rồi họ nêu hướng đi mong muốn: «Có lẽ chúng ta sẽ theo các nhà phù thủy nếu họ thắng cuộc.» (26:40). Lựa chọn họ quảng bá là đi theo các nhà phù thủy nếu các nhà phù thủy thắng. Họ không mở cho mọi người khả năng theo Musa nếu chân lý được chứng tỏ ở phía Người.\n\nCũng bằng cách thu hẹp như vậy, ở đây họ chuẩn bị để dồn tin Thiên Sứ mang đến vào hai khả năng: nói dối hoặc mất trí, như câu tiếp theo nêu ra. Sự gợi tò mò và chế giễu trở thành bước dọn đường cho một quyết định mà họ muốn đám đông cảm thấy mình cùng góp phần tạo nên.\n\nCâu 8\n\n«Phải chăng y đã nói dối rồi đổ thừa cho Allah hay là y bị quỷ ám? Không, những ai không tin tưởng nơi đời sau thì sẽ bị trừng phạt và lầm lạc rất xa.» (34:8)\n\nSau khi dùng sự khó tin và chế giễu để chuẩn bị tâm lý người nghe, họ giới hạn vấn đề vào hai khả năng: bịa lời về Allah hoặc bị mất trí đến mức nói điều người tỉnh táo không nói. Họ đã loại bỏ khả năng nói thật ngay từ cách đặt câu hỏi. Sự so sánh không thể công bằng khi kết quả họ không thích đã bị gạt đi trước lúc xem xét.\n\nKhi hỏi «Phải chăng y đã nói dối rồi đổ thừa cho Allah» (34:8), họ làm ra vẻ đang bảo vệ danh dự của Allah, để lời công kích trông như một hành động bảo vệ tôn giáo. Tương tự là lời Pha-ra-ông nói về Musa: «Ta thực sự sợ nó sẽ làm thay đổi tôn giáo của các ngươi hoặc nó sẽ gây nhiễu loạn trong xứ.» (40:26). Kiểu lời lẽ ấy có thể lan rộng và được nhiều người hưởng ứng vì tính kích động của nó. Nhưng đông người theo dõi không trở thành bằng chứng cho sự chân thật.\n\nQur’an đưa cái nhìn trở về đúng căn bệnh: «Không, những ai không tin tưởng nơi đời sau thì sẽ bị trừng phạt và lầm lạc rất xa.» (34:8). Sự rối loạn của họ không chỉ do gặp một tin lạ, mà bắt nguồn từ việc khước từ cõi họ phải chịu xét xử. Có cách giải thích rằng hình phạt là điều họ sẽ gặp ở Đời Sau, còn lầm lạc là tình trạng họ sống ở đời này. Cũng có cách giải thích rằng hình phạt bao gồm cả điều xảy đến với họ ở đời này.\n\nKhi không có đức tin vào sự thưởng phạt, con người có thể thấy một sự bất công rồi tưởng rằng lẽ phải đã hết đường: một người bị xâm hại, hoặc gia đình bị tổn thương, nhưng đằng sau sức mạnh của kẻ gây hại lại không có xét xử hay công lý. Cách hình dung ấy đè nặng lên người bị hại và mở cho kẻ gây hại ảo tưởng thoát tội. Đức tin vào Đời Sau giữ vững ý nghĩa của công lý khi nó chưa hiện ra và nối đời sống với sự khôn ngoan của Allah. Những gì một người làm hoặc phải chịu trong đời không phải là kết thúc không bao giờ được xét lại.\n\nCâu 9\n\n«Lẽ nào họ không nhìn thấy những gì trước mắt và sau lưng họ từ trời đất?! Nếu muốn, TA đã cho đất nuốt chửng bọn họ hoặc cho một mảnh trời rơi xuống đè bọn họ. Quả thật, nơi sự việc đó là một dấu hiệu cho mỗi người bề tôi biết quay đầu ăn năn sám hối (với Allah).» (34:9)\n\nCâu hỏi này đưa những người phủ nhận trở về với trời đất nằm trọn trong quyền sở hữu của Allah. Họ sống trong đó nhưng không thể ngăn Ngài định đoạt. Đấng sở hữu mặt đất có thể làm đất sụp nuốt họ; Đấng sở hữu bầu trời có thể khiến những mảnh từ trời rơi xuống họ. Không một nơi nào họ có thể chiếm riêng để trú khỏi quyền cai quản của Thượng Đế. Việc quen thuộc với cảnh vật xung quanh cũng không chứng minh rằng tình trạng ấy không thể thay đổi.\n\nLời cảnh báo nối với phần mở đầu chương. Những câu chuyện tiếp theo khiến ý nghĩa về quyền năng và quyền sở hữu trở nên nhìn thấy được qua từng ví dụ: Allah làm sắt mềm cho Dawood; điều khiển gió và Jinn phục vụ Sulayman; cho nguồn đồng chảy ra cho Người; ban cho một dân tộc vườn tược và đường đi an toàn, rồi lấy đi điều họ tự mãn khi họ quay lưng. Người đọc thấy cả việc ban cho lẫn thu lại. Quyền sở hữu không còn chỉ là một khái niệm trừu tượng.\n\nMột tác động đối với người có đức tin đang bị chèn ép là khi nhìn những ngọn núi Allah ra lệnh và chúng vâng phục, họ biết sự tổn thương mình phải chịu không do Thượng Đế bất lực. Allah phán: «Và nếu muốn, Allah có thể đích thân trừng phạt chúng, tuy nhiên, Ngài muốn dùng người này để thử thách người kia.» (47:4). Tất cả điều ấy chuẩn bị cho lời thách thức sau: «Các ngươi hãy cầu nguyện những kẻ mà các ngươi cho rằng (chúng là thần linh của các ngươi) ngoài Allah.» (34:22). Những thần linh được gán ghép đã thực hiện được việc nào trong số ấy? Ai sở hữu quyền ban những ân huệ này, hoặc đem chúng trở lại khi chúng bị thu hồi? Như vậy, lời cảnh báo gắn với các bằng chứng về quyền năng trong câu chuyện, rồi gắn với việc phơi bày sự bất lực của những đối tượng được cầu khấn ngoài Allah.\n\nCâu 10\n\n«Quả thật, TA đã ban cho Dawood hồng phúc từ nơi TA, (và TA đã phán với núi non): “Hỡi núi non! Các ngươi hãy cùng với Y tán dương Allah” và chim chóc (TA cũng phán bảo chúng như thế), và TA đã hóa sắt thành mềm cho Y.» (34:10)\n\nÂn huệ Allah ban cho Dawood được nhắc đến đúng lúc người có đức tin cần nhớ sự rộng lớn trong sự ban tặng của Thượng Đế. Tiền của và trang bị tập trung trong tay những kẻ theo điều sai không có nghĩa họ đã nắm hết mọi nguồn sức mạnh, hay kho ân huệ đã đóng cửa trước người có đức tin. Đấng làm sắt mềm cho Dawood và khiến gió phục vụ Sulayman có thể ban cho ai Ngài muốn. Sự khác nhau trong điều được ban không đến từ sự thiếu hụt quyền năng của Allah; người không nhận cùng một ân huệ cũng không nhất thiết có địa vị thấp hơn.\n\nVấn đề không hoàn toàn nằm ở việc thiếu tiền. Nếu chỉ tiền bạc đủ để dựng xây sứ mạng, thì có tiền đã đủ, dù thiếu những con người gánh vác bằng đức tin. Một câu chuyện được truyền lại từ ‘Umar giúp thấy ý này: trong một buổi họp, những người khác ước có vàng ngọc để chi dùng vì Allah, còn ông ước có những con người đứng lên lo việc của Ngài. (Ahmad, Fada’il as-Sahabah 1280; lời thuật về ‘Umar.) Tiền của và trang bị có thể đổi tay; gốc rễ sức mạnh mà đối thủ nhắm công kích là mặc khải và những gì Nó nuôi dưỡng trong con người.\n\nÂn huệ dành cho Dawood đi cùng lòng chuyên tâm thờ phượng của Người. Hadith kể rằng Adam nhìn thấy Dawood trong dòng dõi mình, yêu thích ánh sáng của Người và tặng Người bốn mươi năm tuổi thọ. (At-Tirmidhi 3076.) Về việc thờ phượng của Dawood, có lời: «Lễ\r\nSalah và sự nhịn chay được Allah yêu thích nhất là lễ Salah và sự nhịn chay của\r\nNabi Dawood.» (Riyadh Al-Saaliheen, mục 458; Al-Bukhari). Người cũng ăn từ công sức lao động đôi tay mình. (Al-Bukhari 2072.) Việc đọc sách Zabur được làm nhẹ nhàng đến mức Người có thể đọc xong trước khi người ta thắng yên các con vật để lên đường. (Al-Bukhari 3417.) Địa vị vua không làm Người xao lãng thờ phượng Thượng Đế hay lao động bằng đôi tay mình.\n\nMột thành quả của việc nỗ lực rèn mình là Allah khiến sự vâng phục từng khó khăn lúc đầu trở nên dễ dàng. Người gắn bó với Qur’an tìm được niềm thân thuộc và sự thuận lợi khi đọc, ghi nhớ mà người ít tiếp cận không có được. Sau một thời gian phải cố gắng, người ta cũng có thể quen việc đứng hành lễ đêm và thức dậy cho lễ Fajr.\n\nRồi mở ra cảnh Dawood tôn vinh Allah. Trong toàn câu: «Quả thật, TA đã ban cho Dawood hồng phúc từ nơi TA, (và TA đã phán với núi non): “Hỡi núi non! Các ngươi hãy cùng với Y tán dương Allah” và chim chóc (TA cũng phán bảo chúng như thế), và TA đã hóa sắt thành mềm cho Y.» (34:10). Núi và chim cùng hòa lời tôn vinh với Người, để người đang tôn vinh và tạo vật xung quanh cùng tưởng nhớ Allah. Sự tôn vinh Dawood qua ân huệ này đánh thức trái tim trước quyền năng của Đấng ra lệnh cho núi và núi vâng theo. Người có đức tin chịu tổn thương tại Makkah nhìn những ngọn núi quanh mình và biết Thượng Đế sở hữu chúng; sức mạnh con người không đưa chúng ra ngoài mệnh lệnh của Ngài.\n\nCảnh ấy đi cùng lời: «TA đã hóa sắt thành mềm cho Y» (34:10). Thứ vốn nổi tiếng cứng rắn trở nên dễ sử dụng trong tay Dawood. Người tạo hình nó nhẹ nhàng, có thể hình dung gần như bột nhào trong tay người làm bánh. Sự điều khiển tạo vật ấy không tách khỏi điều các câu Kinh nuôi dưỡng trong người đang làm việc vì tôn giáo của Allah. Đừng nói rằng bận kêu gọi, thăm nom người nghèo hay công việc chung nên không còn thời gian tưởng nhớ Allah và hành lễ đêm. Dawood là một vị Nabi và một vị vua, nhưng vẫn dành phần ấy cho việc thờ phượng Thượng Đế.\n\nGánh nặng càng lớn, trái tim càng cần điều trợ sức để mang nó. Vì vậy, Thiên Sứ ﷺ được bảo: «Ngươi hãy đứng (dâng lễ nguyện Salah) trong đêm trừ một ít thời gian.» (73:2); «Một nửa của đêm hoặc ít hơn một chút.» (73:3); «Hoặc thêm nữa; và Ngươi hãy đọc Qur’an với âm điệu nhịp nhàng, chậm rãi.» (73:4). Sau đó, mối liên hệ giữa việc hành lễ đêm lâu dài với trách nhiệm mang thông điệp được làm rõ: «Quả thật, TA sẽ truyền xuống cho Ngươi (Qur’an, và Nó là) lời nặng nề (vì trong đó chứa đựng các nghĩa vụ, các giới hạn, các qui định, các nghi thức và những điều khác).» (73:5). Sự vâng phục là hành trang cho công việc. Sai lầm là lấy chính công việc làm lý do cắt đứt nguồn hành trang ấy.\n\nViệc làm sắt mềm cũng không phải ân huệ không có mục đích. Allah phán về sắt: «Chúng Ta gửi \r\nxuống sắt với sức mạnh cố hữu lớn và nhiều lợi ích của nó cho loài \r\nngười, để Thượng Đế có thể biết ai sẽ đứng lên vì Thượng Đế, dù vô \r\nhình, và các sứ giả của Ngài. Thượng Đế quyền năng, và toàn năng.» (57:25). Lời giảng ở đây nhấn mạnh việc đứng lên giúp cho chính nghĩa của Allah và các sứ giả của Ngài, bằng đức tin nơi điều vô hình. Cả Allah lẫn các sứ giả đều được nhắc trong ý nghĩa của sự giúp đỡ ấy. Sắt có thể dùng để đẩy lùi sự xâm hại và phục vụ lợi ích của mọi người; người được ban nó chịu thử thách về cách sử dụng. Câu kết nhắc quyền năng và sức mạnh đưa ân huệ trở về Allah. Ngài không cần máy móc hay sức mạnh của tạo vật; chính họ cần thực hiện đúng bổn phận đối với điều Ngài đã ban. Bởi vậy, sau việc làm sắt mềm là nhiệm vụ dành cho Dawood: làm ra sản phẩm có ích.\n\nCâu 11\n\n«(TA) bảo (Dawood): “Ngươi hãy chế áo giáp và ráp các khoen sắt lại cho thật cân bằng và Ngươi (và con cháu của Ngươi) hãy hành thiện. Quả thật, TA luôn thấy rõ những điều các ngươi làm.”» (34:11)\n\nLàm sắt mềm chưa phải điểm cuối của ân huệ. Như câu 34:11 vừa nêu, ân huệ ấy được hướng đến một công việc mọi người cần: chế tạo áo giáp. Giảng viên giải thích từ chỉ loại áo giáp tro
