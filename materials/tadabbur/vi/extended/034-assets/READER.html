hai đường ngăn cản: không để sự hướng dẫn đến với người ta và không để người ta đến với sự hướng dẫn. Đường trước nhắm người mang nó: «khi những kẻ vô đức tin mưu định giam cầm Ngươi hoặc sát hại Ngươi hoặc trục xuất Ngươi ra khỏi xứ.» (8:30). Câu nêu giam giữ, giết và trục xuất. Đường sau làm công chúng bận với ham muốn, tiếng ồn, nghi vấn che tai và lòng, như lời họ: «Mọi người đừng thèm nghe Qur’an này, hãy nói chuyện ồn ào và gây náo động (khi Nó được xướng lên), như thế có lẽ các ngươi sẽ nắm ưu thế (trong việc ngăn Muhammad xướng Nó và kêu gọi đến với Nó).» (41:26). Họ muốn người ta không nghe với sự suy xét và sẵn lòng nhận, vì họ không sở hữu trái tim đã hướng về Allah.\n\nToàn câu sau cung cấp ngữ cảnh cho một cách hiểu được lời giảng nêu: «Những ai đứng ngoài quan sát các ngươi, khi các ngươi được Allah ban cho sự thắng lợi thì bọn họ (liền đến để được chia phần) bảo: “Chẳng phải bọn tôi là người cùng phe với các vị hay sao?” Và khi những người vô đức tin chiếm phần thắng thì bọn họ cũng lại đến (với những kẻ vô đức tin đó), bảo: “Không phải bọn tôi đã giúp đỡ các người và ngăn cản các người khỏi tay của những người có đức tin đó sao?” Rồi đây vào Ngày Phán Xét Cuối Cùng, Allah sẽ phân xử giữa các ngươi (những người có đức tin và những kẻ giả tạo đức tin), và tất nhiên Allah không bao giờ mở đường cho những kẻ vô đức tin thắng được những người có đức tin.» (4:141). Ở đây, giảng viên liên hệ ý nghĩa con đường hay quyền chi phối trong tiếng Ả Rập với quyền chi phối trái tim. Bản dịch được dẫn dùng lời về việc thắng người có đức tin; cách giải thích của giảng viên về trái tim được trình bày riêng. Trái tim bề tôi ở trong quyền Allah. Thiên Sứ ﷺ cho biết: «Trái tim của những đứa con của Adam đều nằm giữa hai ngón tay của Đấng Ar-Rahman, giống như một trái tim duy nhất, Ngài hướng nó đến bất cứ nơi nào Ngài muốn.» (Muslim 2655). Người kiêu ngạo không có khả năng độc lập lấy sự hướng dẫn khỏi trái tim người giữ vững nó.\n\nĐiều ấy trở về phần nói về Iblis: Allah phủ nhận ở hắn quyền cưỡng bức, và hắn sẽ nói mình đã mời rồi người ta đáp. Cũng vậy, người theo không được biến sự dụ dỗ của Shaytan hoặc lời gọi của kẻ kiêu ngạo thành cớ xóa trách nhiệm. Lời «Chúng tôi đã dẫn các người đi lạc và chúng tôi cũng là những kẻ lầm lạc.» (37:32) cho thấy người dẫn lạc cùng người chấp nhận bị dẫn lạc; mỗi bên gánh điều mình làm, dù vị trí mạnh yếu khác nhau.\n\nCâu 33\n\n«Những kẻ yếu thế đáp lời những tên cường bạo: “Đúng vậy, các người đã bày mưu cả đêm lẫn ngày khi bảo chúng tôi vô đức tin nơi Allah và dựng những đối tác ngang vai cùng với Ngài.” (Tất cả) bọn họ sẽ hối hận khi nhìn thấy hình phạt. TA sẽ xiềng những chiếc gông vào cổ của những kẻ vô đức tin. Quả thật bọn họ bị trừng phạt chỉ bởi những điều mà bọn họ đã làm.» (34:33)\n\nNgười theo đáp lại bằng cách phơi bày điều kẻ kiêu ngạo tìm che: lời gọi của các người không chỉ là một câu thoáng qua, mà có việc «đã bày mưu cả đêm lẫn ngày» (34:33), kế hoạch không nghỉ và tiền chi để kéo người ta khỏi sự hướng dẫn. Có người theo thấy rõ từ bên trong, biết điều được sắp đặt và khoản được bỏ ra, nhưng im vì sợ hoặc hưởng tiền được đưa. Lời đáp thủ lĩnh không khiến họ vô tội trong việc dẫn lạc; lời than người theo cũng không làm người nhận lời mất trách nhiệm lựa chọn. Hai tội được phơi bày trong sự đổ lỗi ấy.\n\nMưu kế mở rộng theo diễn đàn và phương tiện dùng để gieo nghi vấn hoặc kích ham muốn. Đêm ngày thành thời gian làm việc liên tục. Điều này đánh thức người có đức tin về nỗ lực thực sự cần có. Có người muốn thăng tiến để được nghỉ nhiều hơn, trong khi thủ lĩnh điều sai càng có quyền càng bỏ công sắp đặt. Iblis đã xin trì hoãn trong toàn câu: «(Iblis) tâu: “Xin Ngài tạm tha cho bề tôi (được sống) cho đến ngày chúng (con cháu của Adam) được dựng sống lại.”» (7:14). Hắn không xin thêm thời gian để nghỉ, mà để kéo dài việc dẫn lạc.\n\nMối bám theo con người bắt đầu từ khi sinh. Hadith kể việc Shaytan chạm trẻ sơ sinh, trừ Maryam và con bà. Abu Hurayrah sau đó dẫn lời cầu của mẹ Maryam: «bề tôi khẩn xin Ngài phù hộ cho nó và con cháu của nó tránh khỏi lũ Shaytan đã bị nguyền rủa.» (3:36). (Al-Bukhari 3431.) Đây là sự thù địch kéo dài, tìm lối vào cho từng hoàn cảnh.\n\nCâu Kinh nêu mục tiêu thống nhất của công việc ấy: «khi bảo chúng tôi vô đức tin nơi Allah và dựng những đối tác ngang vai cùng với Ngài» (34:33). Đối tác ngang hàng là những đối tượng con người đặt ngang Allah trong điều chỉ thuộc quyền Ngài. Mưu kế đi đến làm hỏng tín ngưỡng và sự thờ phụng duy nhất, không dừng ở một tội rời khỏi việc nhận biết Thượng Đế. Tương tự lời Jinn khi nhận ra chân lý: «Quả thật, kẻ ngu ngốc (Iblis) trong chúng ta đã nói về Allah những điều quá đáng cho Allah.» (72:4). Họ nhận ra điều sai trong những gì từng được truyền cho mình về Allah.\n\nMột lối cám dỗ Hadith làm rõ là phản kháng sự tiền định sau khi việc đã xảy ra. Hadith cảnh báo rằng «chữ \"nếu, phải chi, dẫu mà\" mở ra công việc cho Shaytan.» (Muslim 2664). Con người có thể chuyển từ rút kinh nghiệm sang bất mãn phá hỏng lòng thuận theo.\n\nMột lối khác là cám dỗ Shaytan tìm khi phụ nữ ra ngoài. Abdullah ibn Mas‘ud dẫn lời Thiên Sứ ﷺ: «Người phụ nữ là ‘awrah. Khi cô ấy ra ngoài, Shaytan dõi mắt theo cô ấy.» (Ibn Mas‘ud; At-Tirmidhi 1173). Ở đây, ‘awrah nói đến phần thân thể cần được che kín. At-Tirmidhi xếp bản thuật là “hasan gharib”, còn đánh giá Darussalam xếp là yếu. Hắn rình những nơi có thể tìm lối vào để tô đẹp điều sai.\n\nChợ cũng được nhắc đến. Salman khuyên về việc đi chợ: «Nếu có thể, anh đừng là người đầu tiên vào chợ hay người cuối cùng rời chợ, vì chợ là chiến trường của Shaytan và là nơi hắn dựng cờ của mình.» (Salman, lời của vị đồng hành; Muslim 2451). Nhiều lối vào cho thấy hắn không dùng một hoàn cảnh cho mọi người, cũng không bỏ một giai đoạn tuổi nào không cám dỗ.\n\nMột hình thức làm hỏng nhận thức về sự duy nhất của Allah ở trẻ nhỏ là nhiều nhân vật trong chuyện được gán quyền điều khiển gió, bổng lộc hoặc việc của vũ trụ, rồi được trình bày như nhiều thần linh. Trẻ lớn lên giữa những chủ thể tranh giành thay vì hướng trọn lòng về Allah. Còn nhỏ không có nghĩa điều tiếp nhận không để dấu vết; hình ảnh ý nghĩa lặp lại góp phần hình thành cách nhìn. Cũng có việc dùng tên và thuộc tính của Allah làm danh hiệu cho nhân vật được hư cấu với hành động tương tự Ngài. Người giáo dưỡng cần quan tâm điều đến với trái tim trẻ, không coi đó chỉ là giải trí không mang ý nghĩa. Với người lớn, thiếu niên, nam và nữ có những hình thức khác hợp mối quan tâm, nhưng cùng tìm cách kéo khỏi mặc khải.\n\nĐó là nét riêng của việc «đã bày mưu cả đêm lẫn ngày» (34:33). Lời «Chúng tôi sẽ không bao giờ tin nơi Qur'an này» (34:31) không chỉ là tuyên bố rồi nghỉ; họ làm việc để kéo cả người khác đi. Người thật lòng nói Qur’an là sự hướng dẫn cũng không chỉ khen Nó rồi bỏ việc dạy và truyền đạt. Qur’an chỉ rõ người theo điều sai cũng biết vất vả: «Nếu các ngươi đau đớn (bởi thương vong) thì bọn họ cũng bị đau đớn (bởi thương vong) tương tự như các ngươi, có điều các ngươi có niềm hy vọng nơi Allah còn bọn họ chẳng có niềm hy vọng nào.» (4:104). Khó nhọc không dành riêng người có đức tin, nhưng họ mang niềm hy vọng đối thủ không có. Mục đích và phần thưởng giúp họ kiên nhẫn, cống hiến.\n\nRồi tranh cãi đi đến điều vượt khỏi lời nói. Toàn câu được dẫn làm ngữ cảnh: «Những kẻ yếu thế đáp lời những tên cường bạo: “Đúng vậy, các người đã bày mưu cả đêm lẫn ngày khi bảo chúng tôi vô đức tin nơi Allah và dựng những đối tác ngang vai cùng với Ngài.” (Tất cả) bọn họ sẽ hối hận khi nhìn thấy hình phạt. TA sẽ xiềng những chiếc gông vào cổ của những kẻ vô đức tin. Quả thật bọn họ bị trừng phạt chỉ bởi những điều mà bọn họ đã làm.» (34:33). Trong đoạn nói về hối tiếc, lời giảng hiểu động từ nguyên bản là giấu kín sự ân hận. Người theo tiếc người mình vâng, tiếc lời người khuyên đã bỏ; người được theo tiếc điều lòng kiêu ngạo xui mình làm. Có cách hiểu giới kiêu ngạo giấu hối tiếc để giữ vẻ vững vàng trước người theo; cũng có cách hiểu sự kinh khủng của hình phạt khiến họ sững đến mức không thể bộc lộ điều ở trong lòng. Việc giấu ở cảnh này không ngăn hối tiếc hiện ra trong cảnh khác. Những tình trạng tiếp nối, mỗi tình trạng phơi bày một mặt kinh hoàng.\n\nKhi thấy hình phạt, đổ lỗi, nguyền rủa hay tìm cách chối bỏ không còn giúp được. Tiếp đó là: «TA sẽ xiềng những chiếc gông vào cổ của những kẻ vô đức tin.» (34:33). Gông là những trói buộc ở cổ để người mang bị lùa đi. Một cách suy ngẫm về hình ảnh ấy là sự tương xứng với người ở đời chấp nhận để đầu óc bị lùa: theo mà không xem xét hay hỏi, dù điều trái lẽ phải đã hiện ra. Theo Musaylimah trong lời giả xưng là một ví dụ về bỏ khả năng phân biệt, trong khi người Ả Rập vốn biết ngôn ngữ và có thể nhận ra. Không phải lúc nào thiếu công cụ cũng là vật cản; có khi là chấp nhận đi theo.\n\nSự liên hệ ấy không giới hạn hình phạt vào người theo. Thủ lĩnh và người đáp lại đều nằm trong mô tả phủ nhận đức tin. Câu kết đưa sự việc về công bằng: «bọn họ bị trừng phạt chỉ bởi những điều mà bọn họ đã làm» (34:33). Điều họ thấy là kết quả việc mình làm, không phải bất công giáng xuống, cũng không là tranh chấp ai có thể thoát bằng cách đẩy hết gánh lên người khác.\n\nCâu 34\n\n«(Quả thật) không một vị cảnh báo nào được TA cử phái đến bất kỳ một thị trấn nào mà lại không bị những kẻ giàu có của thị trấn đó bảo: “Bọn ta không tin nơi thông điệp mà các ngươi mang đến.”» (34:34)\n\nSau khi sự thù địch giữa người kiêu ngạo và người yếu thế ở Đời Sau được phơi bày, ngữ cảnh trở về gốc mối liên hệ của họ ở đời này. Những kẻ xa hoa dẫn đầu việc từ chối các sứ giả; nhiều người yếu thế theo họ trong sự từ chối như vẫn theo trong đời sống. Lời đáp được đặt trên miệng giới xa hoa để thấy ai dẫn cuộc chống đối và ai chạy theo.\n\nTrong chương nổi bật hai đặc tính kiêu ngạo và yếu thế; còn cảnh trong Al-Baqarah nêu việc theo nhau, trong toàn câu: «(Bởi vì) khi đối diện với hình phạt, những kẻ được tuân theo sẽ (tuyên bố) vô can đối với những kẻ phục tùng chúng và mọi quan hệ giữa đôi bên sẽ bị cắt đứt hết.» (2:166). Lựa chọn cách mô tả ở đây cho thấy kiêu ngạo tạo ra sự lệ thuộc thế nào. Toàn câu đang suy ngẫm ghi: «(Quả thật) không một vị cảnh báo nào được TA cử phái đến bất kỳ một thị trấn nào mà lại không bị những kẻ giàu có của thị trấn đó bảo: “Bọn ta không tin nơi thông điệp mà các ngươi mang đến.”» (34:34). Nó cho thấy một quy luật lặp lại trong lời kêu gọi của các vị Nabi. Những người bị đời sống xa hoa làm tự cao, có lợi ích dựng trên việc đứng trên người khác, sợ thông điệp đổi vị thế đã ổn định. Nó buộc họ công bằng, bình đẳng về quyền, trả Zakah và thực hiện những điều Allah quy định trong tài sản. Họ xem việc mọi người được hướng dẫn là đe dọa vị trí.\n\nKhông phải mọi người giàu đều thuộc nhóm xa hoa ấy. Ở đây là người bị ân huệ đẩy đến ngạo mạn với người khác. Cấu tạo từ tiếng Ả Rập gợi người đã được cho sống dư dả: ân huệ được ban, Allah mở rộng nó, nên điều phải làm là biết ơn. Nhưng họ lại lấy nó làm cớ nổi loạn trước Đấng Ban Ơn.\n\nTừ này cũng được giải thích bằng hình ảnh phồng lên vì ân huệ, tự cao nhờ nó, gặp đặc tính kiêu ngạo trong cảnh trước. Có ý kiến liên hệ nguồn từ với một chỗ nhô ở môi trên; theo cách ấy, hình ảnh phồng lên gợi cảm giác mình cao hơn người khác vì tiền. Tuy nhiên, một số nhà ngôn ngữ phản đối cách truy nguồn từ này.\n\nCó tiền và phương tiện đến với công chúng, họ có thể chi để bóp méo lời kêu gọi và gieo nghi vấn: «Quả thật, những kẻ vô đức tin thường chi dùng tài sản của chúng vào việc ngăn chặn con đường chính đạo của Allah. Vì vậy, chúng sẽ tiếp tục chi dùng tài sản của chúng (vào việc đó), rồi đây chúng sẽ phải hối tiếc và cuối cùng chúng sẽ thất bại.» (8:36). Chi nhiều để chống lẽ phải không chứng minh lập luận mạnh. Họ có thể bỏ tiền rồi chỉ nhận tiếc nuối. Công kích Thiên Sứ không làm mất sự tôn vinh Allah dành cho Người; toàn câu nhắc: «(Chẳng phải) TA đã nâng cao danh tiếng của Ngươi?» (94:4).\n\nTừ chỉ giới xa hoa của mỗi cộng đồng gợi mỗi nơi có người nắm ảnh hưởng. Đơn vị cư dân trong câu không chỉ là làng theo phân chia hành chính. Câu tương tự là: «Cũng như thế, TA (Allah) đã đặt trong mỗi thị trấn những tên tội phạm lớn nhất của nó để chúng hoạch định âm mưu trong đó.» (6:123). Những người ấy nhắm các đầu mối sức mạnh: nơi quyết định, thị trường dân cần và lợi ích công việc tùy thuộc. Có thể thấy hình thức ấy qua kiểm soát thị trường vàng, sắt, khai thác người không biết giá hoặc dùng ảnh hưởng chi phối việc giải quyết thủ tục của dân.\n\nỞ chiều kia, cách nói trong một cộng đồng gợi thông điệp đi vào đời sống. Người kêu gọi mang mặc khải đến nơi mọi người sống và giao dịch, không chỉ ở xa nhu cầu của họ. Cách nói về điều các vị được cử đến cùng cũng giúp thấy điều ấy: thông điệp theo các sứ giả, đối diện sự lệch lạc ở chợ, nơi tụ họp và mọi mặt đời sống. Mưu kế ngày đêm lan đến các nhóm thế nào, lời kêu gọi cũng cần tới được các nhóm ấy.\n\nNhắc người cảnh báo phù hợp với dân bị ân huệ làm sao lãng và quay lưng mạnh. Họ cần được đánh thức bằng kết quả điều mình đang làm. Sau chuỗi mệnh lệnh hãy nói trong đối thoại, lời đáp chung của họ là từ chối toàn bộ điều được mang đến, không đưa bằng chứng bác ý nghĩa. Sự tự cao tương tự xuất hiện ở dân Salih: «Những tên kiêu ngạo kia bảo: “Bọn ta phủ nhận điều mà các người đã tin.”» (7:76). Như thể chỉ riêng việc người yếu thế đã nhận chân lý cũng thành lý do để người kiêu ngạo càng chống.\n\nCâu 35\n\n«(Những kẻ giàu có đó) nói: “Bọn ta có nhiều tiền của và đông con cái, và bọn ta chắc chắn sẽ không bị trừng phạt.”» (34:35)\n\nGiới xa hoa không chỉ tuyên bố phủ nhận; họ còn nêu một nghi vấn giữ người yếu thế dưới quyền: nhiều tiền của và con cái nên sẽ không bị phạt. Cảnh thủ lĩnh chối bỏ ở Đời Sau có thể làm người theo mất tin, nên kẻ kiêu ngạo cần điều nối lại sự bám víu. Sức mạnh họ dựa vào người trợ giúp. Pha-ra-ông bạo ngược nhờ quân; nếu quân rời bỏ, sự yếu đuối của tạo vật lộ ra. Còn quyền Allah không đứng nhờ ai; chỉ Ngài có lời đáp khi được hỏi: «Quyền hành (Phán Xử) vào Ngày đó sẽ thuộc về ai? Thuộc về Allah, Đấng Duy Nhất, Đấng Tối Thượng.» (40:16).\n\nNghi vấn bắt đầu bằng điều mọi người thấy thật: họ có nhiều. Rồi nó dựng một kết luận điều ấy không chứng minh: được nhiều nghĩa là đúng hơn, gần Allah hơn, an toàn khỏi hình phạt. Sai lệch nằm ở đó: tiền đề có thể đúng mà kết luận sai. Vượt trội về sức mạnh, sản xuất hay tiền không khiến tín ngưỡng chắc đúng hơn người ít có; tiến bộ đời sống không trả lời câu hỏi về sự duy nhất của Allah và Đời Sau.\n\nThiên Sứ ﷺ nói về tác động mạnh của tiền: «Mỗi cộng đồng đều bị thử thách, thử thách của cộng đồng Ta là tiền bạc.» (At-Tirmidhi 2336). Qur’an bác thước đo sai: «Quả thật, con người khi được Thượng Đế của y thử thách y với danh dự và ân huệ thì y nói: Thượng Đế của tôi đã ban cho tôi niềm vinh dự.» (89:15); rồi: «Nhưng khi y bị thử thách với việc thu hẹp bổng lộc thì y lại bảo: Thượng Đế của tôi đã hạ nhục tôi.» (89:16); và sau cả hai cách hình dung là lời «Không.» (89:17). Được cho là thử thách; bị thu hẹp cũng là thử thách. Con người giữ ý được tôn vinh mà bỏ ý bị thử, tưởng ân huệ chứng nhận mình xứng đáng, mất nó là bị hạ nhục. Nhớ đang bị thử bằng ân huệ sẽ biết ơn; nhớ đang bị thử bằng khó khăn sẽ kiên nhẫn, không lấy bề ngoài phán vị trí người khác ở nơi Allah.\n\nĐáng chú ý là ‘Ad đáp lời cảnh báo của các sứ giả bằng câu: «Ai mạnh hơn bọn ta?» (41:15). Sức mạnh cơ thể liên quan gì đến việc lời đáp về mặc khải đúng hay sai? Người đa thần cũng nói khi được đọc các câu Kinh; toàn câu cho ngữ cảnh: «Và khi những Lời Mặc Khải rõ rệt của TA được đọc ra để nhắc chúng, những kẻ vô đức tin nói với những người tin tưởng như sau: “Giữa hai chúng ta, nhóm nào là nhóm có địa vị tốt và đáng kính trọng hơn cả trong Hội đồng (của thành phố Makkah)?”» (19:73). Lời đáp là: «Trước họ đã có không biết bao thế hệ giàu có và hào nhoáng hơn đã bị TA hủy diệt.» (19:74). Có những thế hệ đồ dùng, vẻ ngoài tốt hơn nhưng trang sức không cứu được khỏi hủy diệt. Qarun tự mãn về tiền cuối cùng chịu: «TA đã làm cho đất sụp xuống nuốt chửng y và cả nhà cửa của y.» (28:81).\n\nThước đo ấy có thể lẻn vào lòng, đến mức thấy người bị thử thì cho rằng chắc họ đã phạm tội rất lớn. Bản thuật về Ayyub kể Người bị thử mười tám năm. Người gần xa đều xa lánh, chỉ hai người bạn thân vẫn sớm tối đến thăm. Một người nói Ayyub đã phạm tội chưa ai phạm, lấy cớ thử thách lâu mà chưa được cất đi. Khi nghe lời ấy, Ayyub không chấp nhận suy đoán. Người nhắc sự kính trọng Allah của mình: nghe hai người cãi nhau rồi nhắc Allah, Người trở về làm việc đền chuộc thay họ, vì không muốn danh Ngài được nhắc ngoài điều đúng. (Ibn Hibban 2898.) Thử thách kéo dài không chứng minh điều người kia tưởng. Lòng kính trọng danh Thượng Đế lớn lao vẫn ở trong tim Ayyub.\n\nSự bám vào thước đo tiền có thể bắt đầu nhỏ. Trẻ thấy tiền đáp điều mình muốn, thiếu tiền cản một số mong muốn; rồi mối liên hệ lớn lên thành ảo tưởng toàn bộ hạnh phúc nằm trong tiền. Nếu không được uốn nắn, nó lan sang cách đánh giá hành động và ý tưởng: thứ tạo tiền được xem tốt, thứ mất lợi nhuận bị bác, dù là phán quyết Allah. Người ta bảo vệ lãi vay hoặc công việc bị cấm vì nó cho thu nhập.\n\nBản thuật của Anas nói về lòng ham muốn có thêm: «Nếu một người con của Adam có cả một thung lũng vàng, người ấy sẽ muốn có hai thung lũng như thế.» (Anas; Al-Bukhari 6439). Khi tiền thành tiêu chuẩn cho tôn giáo, điều toàn câu sau mô tả xuất hiện: «Trong nhân loại có kẻ thờ phượng Allah trong sự hoài nghi. Nếu gặp điều lành thì y sẽ an lòng (tiếp tục thờ phượng Ngài), còn nếu gặp điều dữ thì y sẽ quay mặt đi (không thờ phượng Ngài nữa); thế là y thất bại cả đời này lẫn Đời Sau. Đó thật sự là một thất bại hiển nhiên.» (22:11). Ibn ‘Abbas giải thích qua người đến Madinah: nếu vợ sinh con trai, ngựa sinh sản thì nói đạo này tốt; nếu không được như thế lại nói đạo này xấu. (Al-Bukhari 4742.) Người ấy không lấy chấp nhận chân lý làm gốc điều hành đời, mà buộc tôn giáo đi theo lợi ích đang chờ.\n\nRồi có thể yêu người giàu vì giàu, khinh người nghèo vì nghèo, đến mức thành nô lệ của đồng dinar. (Al-Bukhari 2887.) Một bản thuật cùng nội dung được bản dịch Riyadh dẫn như sau: «Thật\r\nkhổ thân cho những kẻ nô lệ của vàng, của bạc, của quần áo nhung gấm và sự sặc\r\nsỡ.» (Al-Bukhari 6435; Riyadh Al-Saaliheen, mục 266). Con người còn có thể chiến đấu vì tiền dù nguy hiểm rõ. Bản thuật của Abu Hurayrah nêu sự việc: «Nước sông Euphrates sẽ rút, để lộ một ngọn núi bằng vàng.» (Abu Hurayrah; Muslim 2894.01; diễn nghĩa). Bản dịch đã đăng mô tả cuộc tranh giành vàng và số người bị giết: «Giờ Tận Thế không được dựng lên cho tới khi con sông Furrat (Euphrates) được phát hiện thấy một núi vàng và mọi người sẽ giết nhau vì tranh giành nó, mỗi một trăm người sẽ bị giết chín mưới chín người» (Abu Hurayrah; Muslim 2894.01). Mỗi người trong số họ tự nhủ: «Biết đâu chính mình sẽ sống sót.» (lời mỗi người trong cuộc tranh giành; Muslim 2894.01; diễn nghĩa). Họ chịu nguy cơ ấy vì tham tiền, rồi có thể viện khó nhọc nhỏ để từ chối thờ phượng hoặc cống hiến vì Allah. Điều chiếm trái tim qua đó lộ ra.\n\nVì vậy, không lạ khi người xa hoa chống lời kêu gọi đụng vị thế đứng đầu của mình. Vấn đề sâu hơn bám vào một tượng thần: đó là làm nô lệ cho địa vị đã dựng. Một cách giải thích câu «Các ngươi hãy cầu xin sự phù hộ bằng tấm lòng kiên nhẫn và lễ nguyện Salah. Quả thật lễ nguyện Salah chắn hẳn là điều nặng nề và khó khăn nhưng đối với những người thực sự kính sợ (Allah thì nó không khó khăn và nặng nề chút nào).» (2:45) là lời gọi thủ lĩnh những người có Kinh Sách tìm trợ giúp bằng kiên nhẫn và lễ nguyện để bỏ điều ngăn họ theo Sứ Giả. Có cách hiểu kiên nhẫn ở đây là nhịn chay: luyện bản thân bỏ điều mình muốn; quen bỏ điều được phép sẽ giúp rời điều bị cấm. Cũng có cách hiểu sự nặng nề được nhắc là điều thuận theo đòi hỏi: bỏ quyền đứng đầu và vị thế cao.\n\nBởi vậy, thường những người đầu theo các sứ giả là người yếu thế, như đối thủ của Nuh nói trong toàn câu: «Nhưng các vị cầm đầu trong đám người dân của Y đáp: “Bọn ta thấy Ngươi chỉ là một người phàm như bọn ta và bọn ta cũng nhận thấy chỉ những kẻ tồi tệ nhất trong bọn ta mới mù quáng theo Ngươi và bọn ngươi chẳng có gì trội hơn bọn ta cả. Không, bọn ta nghĩ, bọn ngươi là những kẻ nói dối.”» (11:27), và như xuất hiện trong câu hỏi Heraclius dành cho Abu Sufyan. (Al-Bukhari 7.) Điều này không ngăn người giàu tin, cũng không đòi họ phá hủy tài sản. Điều cần tránh là để giàu có và quyền lãnh đạo quyết định việc mình có chấp nhận chân lý hay không.\n\nNhững người sống xa hoa ấy khẳng định hai điều: họ đã được ban cho nhiều ân huệ và họ sẽ không bị trừng phạt ở Đời Sau. Lập luận ấy có thể khiến người ta lầm lạc và tiếp tục chịu sự chi phối của những kẻ bênh vực điều sai, nên cần chỉ rõ nó sai ở đâu. Còn nếu người ta tranh cãi chỉ để bắt bẻ, không đáp lại có thể là cách thích hợp. Vì thế, lời đáp ở đây trước hết giải thích bổng lộc đến từ đâu, rồi cho biết dựa vào đâu mà một người được gần Allah và được đền đáp. Cuối cùng, lời đáp cho thấy việc dùng của cải để vâng phục Allah hay để ngăn người khác đón nhận mặc khải sẽ dẫn đến những kết quả khác nhau.\n\nCâu 36\n\n«Ngươi (hỡi Thiên Sứ) hãy nói (với những kẻ mà Allah đã ban cho họ nhiều ân huệ về của cải cũng như con cái): “Quả thật, Thượng Đế của Ta nới rộng hay thu hẹp bổng lộc đối với ai là tùy ý Ngài muốn, tuy nhiên, đa số nhân loại không biết (tất cả mọi sự việc đều được sắp đặt theo sự sáng suốt và anh minh của Ngài).”» (34:36)\n\nĐiều đầu tiên cần sửa trong nghi vấn của giới xa hoa là tiền họ có chỉ là bổng lộc Allah mở rộng, không phải sức mạnh độc lập với ý muốn Ngài. Lời giảng giải thích rằng Thượng Đế mà Sứ Giả thờ phượng và quy phục chính là Đấng đã ban cho họ, cũng có thể thu lại điều họ đang tự hào. Được nhiều không có nghĩa xứng đáng được cứu. Allah có thể mở rộng để thử rồi thu lại trong khoảnh khắc.\n\nMột điều gần gũi phơi bày sự phụ thuộc là: «Hãy bảo chúng: “Các người có xét thấy chăng? Nếu vào một buổi sáng nào đó mạch nước của các người rút mất tiêu (xuống lòng đất) thì ai sẽ mang nước mạch trong vắt đến tiếp liệu cho các người?”» (67:30). Nếu nước duy trì đời sống rút sâu mất, tiền không thay được quyền Allah đưa nó xuất hiện. Người có đức tin nói với chủ hai vườn; toàn câu cho ngữ cảnh: «“Thì biết đâu (sau này) Thượng Đế của tôi sẽ ban cho tôi thứ tốt đẹp hơn ngôi vườn của anh; biết đâu Ngài sẽ gửi từ trên trời xuống những lưỡi tầm sét tàn phá ngôi vườn của anh, biến nó thành mảnh đất trơ trụi,”» (18:40); rồi: «Hoặc nguồn nước của ngôi vườn sẽ cạn mất khiến anh không thể nào tìm được nguồn nước trở lại.» (18:41).\n\nKhông phải phủ nhận công sức người có tiền đã bỏ. Họ có làm và dùng phương tiện, nhưng Đấng tạo phương tiện và làm kết quả thuận lợi là Allah. Không thể lấy điều được ban làm lý do trái lệnh Ngài. Sự dễ dàng có thể là việc dẫn dần người đã chọn quay lưng đến kết cục xấu: «Còn đối với ai keo kiệt và cho mình giàu có.» (92:8); «Và phủ nhận điều tốt.» (92:9); «TA sẽ khiến y luôn được thuận lợi để đến với sự gian khổ.» (92:10).\n\nCâu cũng nhắc người có đức tin: các quy luật đời sống không dừng chỉ vì tín ngưỡng khác nhau. Đặt hạt giống tốt vào đất phù hợp và chăm nước là dùng phương tiện mọc cây, dù người làm là Muslim hay không. Người có đức tin đừng ngồi yên chờ thành quả rồi ngạc nhiên người khác có nó trong khi họ cố gắng.\n\nNhưng phương tiện không là bảo đảm độc lập với ý muốn Allah. Hai người làm gần như nhau không nhất thiết nhận bổng lộc bằng nhau. Toàn câu sau làm rõ sự tùy thuộc ấy: «Ai muốn kiếp phù sinh (của đời này) TA sẽ giục điều mà TA sẵn sàng ban cấp đến cho kẻ nào TA muốn. Rồi TA làm sẵn hỏa ngục cho y; trong đó, y sẽ bị nướng, bị hạ nhục và bị bỏ xó.» (17:18). Vấn đề gồm cả Allah muốn ban điều gì và muốn ban cho ai. Quy luật dùng phương tiện đi cùng ý muốn và sự khôn ngoan của Ngài; không hiểu một bên tách khỏi bên kia.\n\nBởi vậy, người có đức tin được dạy cống hiến và chuẩn bị; toàn câu nhắc: «Các ngươi (những người có đức tin) hãy chuẩn bị chống lại chúng bằng bất cứ thứ gì có thể, từ sức mạnh và các con chiến mã, để cho kẻ thù của Allah và kẻ thù của các ngươi cũng như những kẻ khác ngoài chúng mà các ngươi không biết nhưng Allah thì biết rõ về chúng kinh hồn khiếp vía. Và bất cứ thứ gì các ngươi đã chi dùng cho con đường chính nghĩa của Allah đều sẽ được Ngài bù đắp lại cho các ngươi, và tất nhiên các ngươi sẽ không bị đối xử bất công.» (8:60). Họ cũng được nhắc đối thủ chịu nhọc nhằn như mình: «Nếu các ngươi đau đớn (bởi thương vong) thì bọn họ cũng bị đau đớn (bởi thương vong) tương tự như các ngươi, có điều các ngươi có niềm hy vọng nơi Allah còn bọn họ chẳng có niềm hy vọng nào.» (4:104). Nỗ lực được yêu cầu, bổng lộc đến từ Allah, và sự khác biệt không chứng nhận tín ngưỡng ai đúng. Nhưng nhiều người dừng ở việc thấy tiền nhiều hay ít, không hiểu thật sự về thử thách. Người được cho tự mãn vì điều nhận; người thiếu buồn như thể phần ít chứng minh mình bị khinh.\n\nCâu 37\n\n«(Các ngươi hãy biết rằng) của cải, con cái của các ngươi không phải là những thứ đưa các ngươi đến gần TA (Allah) hơn, mà chỉ những ai có đức tin và hành thiện thì mới là những người sẽ được ban thưởng gấp đôi cho những điều (tốt) mà họ đã từng làm, và họ sẽ an toàn ở trong những ngôi nhà cao tầng.» (34:37)\n\nSau khi làm rõ nhiều tiền là do Allah mở rộng, ngữ cảnh bác điều họ dựng lên từ đó về sự gần gũi và an toàn. Tài sản, con cái không tự đưa người có đến gần Allah chỉ vì có hoặc có nhiều. Cách nói về gần ở nơi Ngài hướng mắt đến mục tiêu nên tìm bằng mọi thứ mình nắm: gần Thượng Đế, không chỉ hơn người khác về hưởng thụ đời này.\n\nThiên thần, các vị Nabi và người ngay chính đều tìm địa vị gần Ngài hơn. Những đối tượng người đa thần thờ ngoài Allah tự mình cũng tìm sự hài lòng, gần gũi ấy, như toàn câu: «Những thần linh mà họ khấn vái cũng tìm mọi cách (thi đua) xem ai trong số họ được gần Ngài hơn, họ cũng hy vọng nơi lòng thương xót của Ngài đồng thời cũng sợ sự trừng phạt của Ngài. Quả thật, hình phạt của Thượng Đế của Ngươi (hỡi Thiên Sứ Muhammad) là thứ đáng phải khiếp sợ.» (17:57). Có cách giải thích đây là thiên thần; cũng có cách hiểu là những Jinn đã vào Islam nhưng dân họ vẫn thờ. Trong cả hai trường hợp, không thể tìm đường đến Allah bằng cách thờ một bề tôi cũng thiếu thốn như mình. Tiền cũng không thành đường gần Ngài ngoài cách Ngài yêu thích.\n\nNếu ưu thế vật chất chứng minh tôn giáo đúng, người đa thần thắng Uhud đã có bằng chứng cho mình. Nhưng người theo lẽ phải có thể thua vì sự khôn ngoan và thử thách, còn người theo điều sai được dư dả như một sự dẫn dần đến kết cục. Rồi phần ngoại lệ mở cánh cửa hành động: «chỉ những ai có đức tin và hành thiện» (34:37). Người giàu không bị chặn khỏi gần Allah. Điều đưa họ gần là đức tin thật và việc làm với những gì được ban.\n\nHành động phù hợp bối cảnh là chi tiền vào điều tốt, dạy con và nuôi con trong vâng phục, phục vụ tôn giáo; ân huệ không chỉ thành thứ tự hào. Thiên Sứ ﷺ cho biết người nhiều tiền sẽ là người ít phần vào Ngày Phục Sinh, trừ người dùng tiền cống hiến về các hướng, trước mặt, phải, trái và sau lưng. (Al-Bukhari 6443.) Nhiều hướng giúp hình dung nhiều mặt chi dùng: đáp nhu cầu người nghèo, giúp việc học và giúp tôn giáo. Không phải gom tiền rồi tưởng chỉ sở hữu đã là bằng chứng được tôn vinh.\n\nVì vậy, câu gắn phần thưởng với việc làm: «những người sẽ được ban thưởng gấp đôi cho những điều (tốt) mà họ đã từng làm» (34:37). Tiền dùng vào điều tốt mở cho người có nhiều cửa thiện. Các Sahabah nghèo than người có tiền vượt mình bằng những việc mình không làm nổi. Thiên Sứ ﷺ dạy họ tôn vinh, ca ngợi và tuyên xưng sự vĩ đại của Allah. Phần tiếp theo do Abu Salih thuật lại kể rằng những người nghèo trở lại vì người giàu cũng đã làm như thế; trong phần này, lời đáp của Thiên Sứ được dẫn là: «Đó là\r\nđặc ân của Allah muốn ban cho ai tùy Ngài.» (Muslim 595; Riyadh Al-Saaliheen, mục 494). Khác biệt khả năng cống hiến không phải chỗ phản đối Allah, mà là ân huệ để dùng vào vâng phục.\n\nAn toàn trong những chỗ ở trên cao là sự đền đáp phù hợp với lòng gắn bó Thượng Đế. Người chỉ yên tâm nhờ tiền sợ chi ra sẽ mất nguyên nhân an toàn. Người tin lời Allah hứa càng cống hiến càng hy vọng, an lòng, vì biết điều đã gửi trước không mất. Như vậy, lời bác nghi vấn người đa thần cũng củng cố người có đức tin bị lời khoe ảnh hưởng: có ít không làm mất niềm tin nơi Allah, có nhiều không ngăn chi dùng.\n\nCâu 38\n\n«Những kẻ cố gắng tìm cách phá hỏng các lời mặc khải của TA thì sẽ bị dẫn tới chỗ trừng phạt.» (34:38)\n\nKhông thể cho rằng tiền đưa mình gần Allah trong khi dùng nó ngăn các dấu hiệu Ngài. Vì thế, câu này đặt người dùng tiền chống các dấu hiệu của Allah tương phản với người có đức tin và làm điều thiện, qua đó làm rõ thước đo về tiền: chủ dùng vào đâu? Người có đức tin dùng tiền để vâng phục nên nhận phần thưởng tăng thêm và an toàn; người chống sự hướng dẫn dùng tiền để cản trở nên bị đưa đến hình phạt. Tiền không tuyệt đối tốt hay xấu; tác động hiện ra qua cách dùng.\n\nMột chìa khóa tương tự nằm trong Hadith: «Thật đáng ngạc nhiên cho vụ việc của người có đức tin, vì mọi việc của y đều tốt, và điều đó không thuộc về ai ngoại trừ người có đức tin. Nếu điều tốt xảy đến với y, y biết ơn, y sẽ được điều tốt; và nếu điều xấu xảy đến với y, y kiên nhẫn, y sẽ được điều tốt.» (Muslim 2999). Có ân huệ chưa đủ kết luận người nhận được tốt, mà phải xem biết ơn hay phủ ơn. Khó khăn không nhất thiết xấu cho người nhận bằng kiên nhẫn.\n\nNgay được cứu cũng có thể là thử thách. Có cách giải thích lời «Trong sự việc đó là sự thử thách to lớn từ Thượng Đế của các ngươi dành cho các ngươi.» (7:141) bao gồm thử thách trong việc cứu con cháu Israel khỏi Pha-ra-ông, để thấy họ làm gì sau ân huệ. Vượt biển rồi thấy người thờ tượng, họ nói: «Này Musa, xin Người hãy tạo cho chúng tôi một thần linh (để chúng tôi có thần linh) giống như họ.» (7:138). Được cứu không ngăn họ đáp sai với Đấng Ban Ơn. Trước đó, họ đã được bảo: «Có lẽ, Thượng Đế của các người sẽ tiêu diệt kẻ thù của các người và cho các người nối nghiệp họ trên vùng đất này, và Ngài muốn xem các người sẽ hành động như thế nào (tri ân hay vong ơn Ngài).» (7:129). Điều cốt yếu là con người làm gì sau khi nhận ân huệ và điều kiện vững vàng.\n\nĐộng từ hiện tại trong câu đang suy ngẫm vẽ nỗ lực lặp lại: hễ có tiền hoặc ảnh hưởng lại dùng ngăn cản. Đây là sự nối dài mưu kế ngày đêm, đối diện lời ở đầu chương; toàn câu là: «Những ai cố gắng chống phá các lời mặc khải của TA thì chắc chắn sẽ phải chịu một sự trừng phạt đau đớn.» (34:5). Cách nói nhắm vào các dấu hiệu của TA gợi việc công kích từng chi tiết mặc khải và các phán quyết. Sự chống đối không chỉ dừng ở tên tôn giáo mà đi từ nền tảng thờ duy nhất đến việc thờ phượng, các Sunnah.\n\nTừ mô tả nỗ lực ấy trong nguyên bản diễn tả ý họ tưởng qua mặt Allah hoặc cản việc thi hành lệnh Ngài. Có cách đọc khác với phụ âm jim được đọc đôi và không có alif. (Ibn al-Jazari, An-Nashr fi al-Qira’at al-‘Ashr, phần các cách đọc chương Al-Hajj.) Trong những ý nghĩa được nêu có việc làm người có đức tin chùn bước hoặc làm lời kêu gọi trông bất lực. Nhưng ảo tưởng thoát được đối diện kết cục bị bắt, đưa đến hình phạt. Mưu kế và nhiều người trợ giúp không còn ích.\n\nJinn đã thừa nhận: «Quả thật, chúng tôi tin chắc rằng chúng tôi sẽ không bao giờ có thể làm cho Allah thất bại trên trái đất và chúng tôi sẽ không bao giờ có thể trốn thoát khỏi Ngài.» (72:12). Allah cũng phán: «Hoặc phải chăng những kẻ làm điều tội lỗi tưởng rằng họ có thể qua mặt được TA ư? Thật tệ hại cho điều mà họ xét đoán.» (29:4). Dùng điều Allah ban để chống các dấu hiệu Ngài không biến ân huệ thành bằng chứng được cứu, mà lấy cách dùng sai ấy làm nguyên nhân bất hạnh.\n\nCâu 39\n\n«Ngươi (hỡi Thiên Sứ) hãy nói: “Thượng Đế của Ta nới rộng hay thu hẹp bổng lộc đối với ai trong số bầy tôi của Ngài là tùy ý Ngài muốn. Bất cứ thứ gì các người đã chi dùng (cho con đường chính nghĩa của Ngài) thì đều sẽ được Ngài hoàn lại, và Ngài là Đấng ban bổng lộc tốt nhất.”» (34:39)\n\nMột lần nữa, Thiên Sứ được lệnh công bố rằng bổng lộc nằm trong tay Allah. Sau phần nói rõ về thưởng phạt, sự lặp lại này mở thêm ý nghĩa, chứ không chỉ nhắc lại câu chữ. Một cách hiểu là câu trước đối diện với sự tự phụ của những người đa thần vì được ban nhiều của cải, còn câu này hướng đến người có đức tin, củng cố họ và chuẩn bị tâm thế để họ cho đi. Cụm “trong số bầy tôi của Ngài” tôn vinh địa vị làm bầy tôi. Trong nguyên văn, sau lời nói về thu hẹp bổng lộc còn có một từ mang nghĩa “cho người ấy”. Người tin không nhìn cảnh sung túc hay túng thiếu như kẻ đã cắt đứt liên hệ với Thượng Đế, mà nhớ đến sự chăm sóc của Ngài trong cả hai hoàn cảnh. Sung túc có thể giúp họ vâng lời; khó khăn cũng có thể là lòng thương, giữ họ khỏi một thử thách hoặc nâng bậc họ nhờ kiên nhẫn. Một điều có thể suy ngẫm từ cách diễn đạt “cho người ấy” là sự thiếu thốn đôi khi xảy đến vì lợi ích của chính họ, dù ban đầu họ không thích.\nViệc đục hỏng con thuyền ban đầu có vẻ gây hại, nhưng rồi lại bảo vệ nó. Chuyện đứa trẻ cũng cho thấy lòng thương đối với cha mẹ. Al-Khidr giải thích về con thuyền: «Sở dĩ Ta muốn làm cho nó hư đi là bởi vì phía sau những người nghèo đó có một ông vua thường hay dùng cường quyền để chiếm đoạt tất cả các con thuyền (lành lặn và tốt).» (18:79). Về đứa trẻ, xin đối chiếu cả câu: «“Còn đối với đứa trẻ, bởi vì cha mẹ của nó là những người có đức tin, ta sợ rằng sự thái quá và vô đức tin của nó (đối với Allah) sẽ khiến cha mẹ của nó phạm tội.”» (18:80). Vì thế, không phải mọi điều khiến người tin đau buồn lúc đầu đều vắng bóng lòng thương dành cho họ. Hadith qudsi do Abu Hurayrah thuật nêu việc người bầy tôi đến gần Allah: «người bề tôi của TA tiếp tục đến gần TA bằng những hành động thờ phượng tự nguyện cho đến khi TA yêu thương y.» (Abu Hurayrah; Al-Bukhari 6502). Hadith cũng nhắc đến lời cầu xin và tìm sự che chở: «nếu y cầu xin TA chắc chắn Ta sẽ ban cho y, nếu y cầu xin TA phù hộ chắc chắn TA sẽ phù hộ y» (Abu Hurayrah; Al-Bukhari 6502). Dẫu vậy, cái chết mà người có đức tin không mong muốn vẫn đến. Đoạn cuối nêu: «Người ấy ghét cái chết, còn Ta không muốn làm người ấy đau buồn.» (Abu Hurayrah; Al-Bukhari 6502; diễn nghĩa). Sự chăm sóc không có nghĩa là mọi điều người ấy không thích đều bị ngăn lại. Điều cần có là tin cậy Thượng Đế khi Ngài ban cũng như khi Ngài giữ lại.\nTheo một cách hiểu khác, câu trước nói về sự khác nhau trong bổng lộc giữa người này với người khác, còn câu này nói về sự đổi thay trong hoàn cảnh của cùng một người: hôm nay được rộng rãi, mai có thể chật vật, và ngược lại. Như vậy, lời nhắc lại cảnh tỉnh người đa thần đừng tự phụ vì một tình trạng mà họ không có quyền giữ mãi; đồng thời khuyến khích người tin tranh thủ chi dùng khi còn khả năng, trước ngày muốn cho đi mà không còn gì. Cả hai cách hiểu đều hướng đến giải phóng trái tim khỏi cảnh nô lệ cho tiền của. Kẻ hưởng thụ chỉ muốn khoe: «Tôi được nhiều của và mạnh hơn anh vì đông người hơn.» (18:34) hoặc mải mê đua nhau tích lũy; người tin lại hỏi làm sao biến những gì mình có thành phương tiện đến gần Allah.\nĐiều ấy bao gồm cả khoản chi tiêu thường ngày cho gia đình khi có ý mong phần thưởng. Thiên Sứ dạy: «Nếu một người đàn ông chi tiêu cho gia đình của anh ta với niềm hy vọng phần thưởng (ở nơi Allah) thì đó được ghi là một hành động Sadaqah (từ thiện).» (Al-Bukhari 5351; Abu Masud thuật lại). Trong bản thuật của Sa‘d, Thiên Sứ ﷺ nói về việc chi tiêu tìm sự hài lòng của Allah: «Bất cứ khoản nào anh chi để mong Allah hài lòng, anh đều được ban thưởng, kể cả miếng ăn anh đưa vào miệng vợ mình.» (Sa‘d ibn Abi Waqqas; Al-Bukhari 56). Đừng thu hẹp việc cho đi vào một khoản tiền lớn hay một hình thức thiện duy nhất. Cách nói bao quát về bất cứ thứ gì đã chi dùng bao gồm cả chút ít mà người ta đủ sức cho. Có người nghèo chỉ còn sức lao động: họ làm việc, kiếm tiền để bố thí, mà vẫn bị những kẻ đạo đức giả chế giễu. Câu nói về họ, với phần đầu làm bối cảnh, là: «Những kẻ gièm pha các tín đồ rộng rãi và mạnh tay (đóng góp tài sản) cho việc từ thiện, (chê cười) những ai đóng góp tùy khả năng của họ bằng những lời chế giễu thì Allah chế giễu chúng lại và (rồi đây) chúng sẽ phải chịu một sự trừng phạt đau đớn.» (9:79). Một chút ít trong mắt người đời có thể rất lớn nhờ sự chân thành và cố gắng phía sau.\nLời hứa hoàn lại được gắn trực tiếp với Allah, để trấn an người còn sợ tài sản hao hụt. Sự bù đắp không nhất thiết cùng loại với thứ đã cho, cũng không nhất thiết hiện ra thành một số tiền lớn hơn. Nó có thể là phúc lành, sức khỏe, tai họa được đẩy lui hoặc địa vị cao hơn nơi Allah. Hãy tin lời hứa của Ngài, thay vì buộc sự bù đắp phải có hình thức mình chọn. Nhìn vào phép tính trước mắt, người ta có thể tưởng bố thí làm tài sản giảm còn cho vay lấy lãi làm nó tăng. Nhưng Allah phán: «Allah xóa bỏ (định chế) 'Riba' (cho vay lấy lãi) và làm phát đạt việc bố thí (Sadaqah)» (2:276). Sự tăng trưởng của bố thí và sự tiêu hủy của lãi cho vay không thể chỉ nhận ra qua con số tức thời. Đó là giới hạn của những người: «Họ chỉ biết những gì được nhìn thấy từ đời sống trần tục này còn đối với cuộc sống Đời Sau thì họ lại lơ là, không quan tâm.» (30:7). Họ thấy bề ngoài của tăng giảm mà quên hậu quả của việc làm nơi Allah.\nLời kết nói Ngài là Đấng ban bổng lộc tốt nhất, mời gọi ta yên lòng trước sự khôn ngoan của Đấng đã hứa bù đắp. Đứa con tin người cha giữ lời khi hứa một món quà tốt thì đã an tâm trước khi biết món quà cụ thể; còn mọi sự hoàn hảo cao nhất thuộc về Allah. Vậy lời hứa của Thượng Đế, Đấng biết nhu cầu và ban cho tốt đẹp, càng đáng để tin cậy biết bao! Giá trị của việc đóng góp càng lớn khi ít người trợ giúp và nhu cầu cấp bách: «Chắc chắn sẽ không ngang bằng nhau giữa các ngươi, những người đã chi dùng tài sản và chiến đấu trước cuộc chinh phục Makkah (và những người chi dùng tài sản và chiến đấu sau đó). Những người (đã chi dùng tài sản và chiến đấu trước cuộc chinh phục Makkah) sẽ có cấp bậc cao hơn những người chi dùng và chiến đấu sau đó.» (57:10). Cũng từ ý nghĩa ấy, Waraqa ibn Nawfal từng ước mình còn trẻ khỏe khi dân của Thiên Sứ đuổi Người đi, để có thể đứng lên giúp Người (Al-Bukhari 3). Mặc khải chuyển tiền của từ vật để khoe khoang thành phương tiện phụng sự Allah, rồi đưa người đọc trở lại cảnh tập hợp, để thấy kết cục của những thứ con người bám víu và những việc làm còn lại cho họ.\n\nCâu 40\n\n«Vào Ngày mà Ngài (Allah) triệu tập tất cả bọn họ rồi phán bảo các Thiên Thần: “Có phải những kẻ này đã từng tôn thờ các ngươi?”» (34:40)\n\nMạch văn chuyển từ sự tự phụ của con người vì những gì họ có sang Ngày tất cả được tập hợp: kẻ kiêu ngạo dẫn dắt lẫn kẻ yếu thế đi theo đều không thể vắng mặt. Cảnh trước cho thấy các thủ lĩnh phủi bỏ người theo mình. Ở đây, những đối tượng mà người đa thần bám víu để mong trung gian và cầu thay tuyên bố họ không liên can đến sự thờ phượng ấy. Người thờ phượng không thể thoát trách nhiệm bằng cách đổ sang một ông chủ mình đã vâng theo, hay một thụ tạo mình đã tôn thờ ngoài Allah. Trước mặt những người ấy, Allah hỏi các thiên thần liệu những người kia có từng thờ các thiên thần hay không. Allah không hỏi để biết một điều Ngài chưa biết, mà để phơi bày sự thật và xác lập bằng chứng, cho những người đa thần nghe chính những đối tượng mà họ cho là gần gũi với Allah bác bỏ việc họ đã làm. Điều tương tự xuất hiện trong lời Ngài hỏi Isa: «Có phải Ngươi đã nói với nhân loại: “Hãy nhận Ta và Mẹ của Ta làm hai Thượng Đế bên cạnh Allah? (Ysa) sẽ thưa: “Ngài thật quang vinh và trong sạch! Bề tôi không bao giờ có thể nói được điều mà bề tôi không có quyền nói.» (5:116). Qua bước chuyển này, cuộc luận chứng trong chương vẫn gắn với Đời Sau. Vấn đề không phải thắng một cuộc tranh luận rồi ai về nhà nấy, mà là lựa chọn mà mỗi người sẽ gặp hậu quả khi Allah tập hợp họ cùng những kẻ mình đã theo và đã thờ.\n\nCâu 41\n\n«Các Thiên Thần sẽ thưa: “Quang vinh thay Ngài! Ngài là Chủ Nhân của bầy tôi chứ đâu phải chúng. Không, chúng tôn thờ Jinn. Đa số bọn chúng tin tưởng nơi chúng (Jinn).”» (34:41)\n\nCác thiên thần bắt đầu bằng việc tôn vinh Allah, khẳng định chỉ Ngài là Đấng bảo hộ của mình: «Ngài là Chủ Nhân của bầy tôi chứ đâu phải chúng.» (34:41). Họ không chấp nhận việc những người đa thần thờ mình, cũng không nhận họ làm những người bảo trợ, mà công bố mình cần đến Thượng Đế và là bầy tôi của Ngài. Một nét tinh tế trong câu trả lời là họ không gắn sự thờ phượng với bản thân, ngay cả để phủ định: họ không nói rằng những kẻ ấy đã không thờ mình. Thay vào đó, họ tôn vinh Allah, khẳng định Ngài là Đấng bảo hộ, rồi mới nêu sự thật về sự lệch lạc của dân ấy.\nVề lời «Không, chúng tôn thờ Jinn.» (34:41) có hai cách giải thích. Có ý kiến cho rằng họ thực sự thờ jinn; rồi khi thấy sự tôn quý của các thiên thần và kết cục của những jinn mà chính họ từng vâng theo, họ mới tuyên bố rằng mình đã thờ các thiên thần. Các thiên thần vạch rõ lời nhận ấy là dối trá. Theo ý kiến khác, jinn tô đẹp và xúi giục họ thờ thiên thần cùng các ngẫu tượng. Do đó, việc nghe theo và vâng lời jinn trong sự đa thần thực chất là thờ jinn, dù họ gọi đối tượng thờ phượng bằng những tên khác. Trong niềm tin của một số người đa thần có việc đặt tên nữ cho các ngẫu tượng và tưởng rằng các thiên thần ngự trong đó, để biến việc thờ chúng thành con đường tìm sự trung gian nơi Allah. Phía sau còn là mong cầu lợi ích trần gian, như có con hay được thắng trận, hoặc ảo tưởng rằng đối tượng mình thờ sẽ cầu thay, giúp họ khỏi phải tuân phục và sám hối.\nMột điều có thể suy ngẫm là cảm giác yếu đuối khiến người ta dễ chấp nhận lệ thuộc. Họ tìm một sức mạnh để dựa vào khi sợ hãi: kẻ yếu bám vào kẻ quyền thế, kẻ quyền thế bám vào tiền của và người trợ giúp; người khác lại tìm đến jinn, như kẻ xuống một thung lũng rồi xin vị chúa jinn ở đó che chở. Tất cả phơi bày sự thiếu thốn của thụ tạo, dù nó tỏ ra mạnh mẽ. Điều ấy cũng thấy ở người bắt chước những kẻ đang chiếm ưu thế chỉ vì choáng ngợp và thấy mình thua kém, đến mức tiếp nhận điều mà nếu tự nhìn nhận, họ chẳng thấy tốt đẹp. Còn các thiên thần, với năng lực Allah đã ban, lại thưa: «Ngài là Chủ Nhân của bầy tôi» (34:41). Họ chỉ ra đúng nơi cần tìm sự nương tựa. Chương này đưa trái tim đang phân tán giữa những sức mạnh ấy trở về mối gắn bó vững chắc với Thượng Đế và mặc khải của Ngài, để cầu Ngài bảo hộ, hướng dẫn, và không biến nhu cầu có sức mạnh thành cửa ngõ thờ phượng một ai khác.\n\nCâu 42\n\n«Vào Ngày mà không ai được quyền giúp đỡ ai cũng như không ai có thể gây hại được cho ai, TA sẽ phán bảo những kẻ làm điều sai quấy: “Các ngươi hãy nếm lấy hình phạt của Hỏa Ngục, cái các ngươi đã từng phủ nhận Nó.”» (34:42)\n\nNgày ấy, những mối quan hệ từng khiến họ tự phụ đều sụp đổ: không ông chủ nào cứu được kẻ theo mình; không đối tượng thờ phượng nào đẩy được hình phạt khỏi người đã thờ nó; cũng không ai tự mình làm hại người khác như họ từng tưởng. Sau khi hỏi các thiên thần và nghe họ tuyên bố không liên can, lời phán hướng đến những kẻ bất công, báo cho họ kết cục phải chịu hình phạt Lửa mà họ đã phủ nhận. Kết thúc này phơi bày điều ẩn sau những mưu tính ấy. Với những người này, thờ các đối tượng trung gian là cách trốn tránh việc thừa nhận một cuộc thanh toán buộc họ phải tuân phục. Họ muốn thỏa mãn ham muốn rồi xin một đối tượng thờ phượng hay vị bảo trợ mình nhận ngoài Allah miễn cho trách nhiệm về hành vi, thay vì sám hối với Thượng Đế và làm theo lệnh Ngài. Khi hy vọng ấy tan biến, sự thật họ né tránh vẫn còn: Lửa không thể bị đẩy lui bằng lời phủ nhận hay sự trung gian tưởng tượng. Vấn đề không chỉ là những kẻ cầu thay đã không giúp được họ. Chính con đường họ chọn vốn là bất công và phủ nhận; họ chỉ thấy rõ điều ấy khi không còn cơ hội sửa lại.\n\nCâu 43\n\n«Và khi các lời mặc khải rõ ràng của TA được đọc ra cho họ thì họ nói: “Người đàn ông này chỉ muốn cản trở các người tôn thờ những thần linh mà cha mẹ của các người đã tôn thờ mà thôi.” Họ nói: “Đây thật ra chỉ là điều giả dối khéo bịa đặt.” Và những kẻ vô đức tin nói về chân lý khi nó đến với họ: “Đây rõ ràng chỉ là bùa mê hoặc.”» (34:43)\n\nSau khi trình bày quyền thống trị và tri thức của Allah, việc Ngài khiến các tạo vật phục vụ Dawood và Sulayman, lấy đi ân huệ của Saba’, cũng như cuộc đối đáp giữa kẻ theo và người được theo, vạch rõ sự tự phụ vì tiền của là vô nghĩa, chương đưa đến những dấu hiệu “rõ ràng”. Chân lý đã hiện rõ, nhưng những kẻ ngoan cố đáp lại bằng ba hướng công kích: nhắm vào vị sứ giả, họ bảo đó chỉ là một người muốn ngăn họ theo đạo cha ông; nhắm vào điều Người mang đến, họ gọi đó là chuyện dối trá bịa đặt; nhắm vào sức tác động đã thấy, họ gọi đó là ma thuật rõ ràng. Việc lặp lại lời “họ nói” tách riêng từng cáo buộc và nhấn mạnh chúng. Đây không phải một lời phản đối thoáng qua: họ tấn công người truyền đạo, rồi đường lối, rồi những gì lời kêu gọi ấy tạo ra trong lòng người.\nChữ “muốn” buộc tội ý định: họ cho rằng Người tìm địa vị lãnh đạo bằng cách lật đổ uy thế của cha ông. Ai bị lợi ích chi phối có thể khó hiểu một việc chỉ nhằm sự hài lòng của Allah, nên đằng sau mọi lời kêu gọi đều tìm tiền bạc hay quyền lực. Tiếp đó, họ khơi lòng tự ái với truyền thống bằng cách nhắc điều cha ông đã thờ, khiến người nghe rời khỏi việc xét bằng chứng để lo mình phản bội cộng đồng và tổ tiên. Sự hãnh diện ấy từng mạnh đến mức có lệnh: «các ngươi hãy tụng niệm Allah giống như việc các ngươi thường hay nhắc về cha mẹ (vì hãnh diện) hoặc nhiều hơn nữa.» (2:200). Cùng một lối ấy là gán người nói sự thật thành kẻ chống quê hương hay chống phong tục, để thiên hạ ghét bỏ trước khi nghe lời giải thích.\nCáo buộc càng gay gắt có thể cho thấy nỗi sợ của những người có thế lực: người yếu thế sẽ chịu ảnh hưởng của mặc khải rồi thoát khỏi quyền họ. Khi người theo bắt đầu bỏ đi, họ càng công kích để giành lại lòng tin; thậm chí dành cho mỗi mặt của lời kêu gọi một luận điệu riêng hay cả một bài công kích. Nhiều lời vu cáo không phải sự lặp lại vô mục đích. Họ gọi Qur’an là sự dối trá bịa đặt, vừa kết tội nói dối vừa cho là tự dựng lên; lúc bảo Người tự làm ra, lúc lại bảo có người dạy giúp: «Đây chỉ là điều dối trá mà Y (Muhammad) đã bịa đặt và một nhóm người nào đó đã giúp Y (làm ra Qur’an)» (25:4). Họ không tìm một mô tả được bằng chứng xác nhận, mà tìm điều khiến người nghe quay đi, dù cáo buộc thay đổi và mâu thuẫn. Cả ba câu đều dùng cách nói giới hạn: “chỉ là…”, để khoác cho điều sai trái vẻ chắc chắn không chấp nhận khả năng khác.\nNhưng sức tác động vẫn là câu hỏi họ phải đối diện. Nếu Qur’an đúng như họ nói, vì sao có người bỏ của cải, gia đình, địa vị và chịu tổn hại vì nó? Vì sao những trái tim cùng hướng đến lắng nghe? Chuyện Abu Bakr cho thấy rõ điều ấy. Ông cầu nguyện và đọc Qur’an trong sân nhà, vốn là người hay khóc. Phụ nữ và con cái của những người đa thần tụ tập quanh ông, ngạc nhiên trước lời đọc ấy. Các thủ lĩnh Quraysh sợ hãi, yêu cầu ông đừng đọc công khai ở nơi ảnh hưởng đến người khác (Al-Bukhari 3905). Không cần một bài diễn thuyết nhắm vào họ: chính tiếng đọc Qur’an đã khiến họ bất an. Vì vậy, họ gọi tác động của chân lý là ma thuật, dựng một cách giải thích nhằm chặn người ta hưởng ứng.\nViệc nêu rõ “những kẻ vô đức tin” ở đây có thể được hiểu theo hai hướng: nhấn mạnh họ che lấp chân lý sau khi nó đã đến và hiện rõ; hoặc nói đến các thủ lĩnh bảo người yếu thế rằng đây là ma thuật rõ ràng, hòng kéo họ khỏi tác động của lời kêu gọi. Chữ “rõ ràng” càng làm luận điệu của họ có vẻ tự tin, như thể điều họ quy là sai quá hiển nhiên không cần bàn, trong khi chính những dấu hiệu của Allah mới rõ ràng. Cách chống các sứ giả ấy cứ lặp lại: «Chẳng lẽ đây là lời di chúc mà chúng truyền cho nhau? Không, (tất cả) bọn chúng đều là một đám vượt quá giới hạn.» (51:53). Cùng một sự ngông cuồng tạo ra những lời giống nhau; các phương tiện ngăn cản cũng giống nhau, dù cách trình bày thay đổi.\n\nCâu 44\n\n«TA (Allah) đã không ban cho họ bất cứ Kinh Sách nào để họ có thể học hỏi; và TA cũng không cử bất cứ người cảnh báo nào đến với họ trước Ngươi cả.» (34:44)\n\nHọ dựa vào đâu để quả quyết mặc khải này là bịa đặt? Họ chưa được ban những kinh sách để học, rồi phát hiện nó trái với mặc khải mình biết; cũng chưa có người cảnh báo đến trước Thiên Sứ để họ viện lời người ấy bác bỏ sứ mạng của Người. Đây là một cách hiểu của câu, tước bỏ vẻ hiểu biết khỏi luận điệu của họ: họ bác Kinh Sách bằng ham muốn và bắt chước, chứ không bằng so sánh có bằng chứng. Những kinh sách từ Allah kêu gọi chỉ thờ Ngài và xóa bỏ bất công. Vì thế, những người công bằng trong dân đã được ban Kinh Sách nhận ra nguồn ánh sáng ấy khi nghe Qur’an. An-Najashi nhận ra điều đó và nói rằng những gì ông vừa nghe từ Qur’an và những gì Musa mang đến đều phát ra từ cùng một ngọn đèn: sự đồng nhất của ánh sáng cho thấy cùng một nguồn mặc khải. Abdullah ibn Salam đón nhận Islam. Heraclius cũng nhận ra những đặc điểm của sứ mạng cho thấy Thiên Sứ chân thật, dù ông không đi theo Người (Ahmad 22498; Al-Bukhari 3329 và 7). Hiểu biết từ việc xem xét mặc khải không ngang với những lời cả nhóm nhắc lại mà không có tri thức.\nTheo một hướng khác, câu này nhắc đến vinh dự đáng lẽ phải khiến họ vui mừng: nay có Kinh Sách để học và Sứ Giả cảnh báo, sau thời gian chưa có những điều ấy. Họ đáng lẽ phải đón nhận tri thức thay vì vứt bỏ. Địa vị chưa có kinh sách đối lại với dân đã được ban Kinh Sách, cùng nhu cầu của một số người Ả Rập về tin tức vô hình, từng khiến họ hỏi người khác về sự tạo dựng, cái chết và những gì ngoài giác quan. Qua con đường ấy, nhiều câu chuyện được truyền đến họ. Vậy khi mặc khải làm rõ sự thật đã đến, bỏ điều Allah dùng để tôn vinh mình rồi vẫn bị giam trong sự bắt chước cha ông là một mất mát biết bao! Hai hướng giải thích cùng bác bỏ cáo buộc bịa đặt: họ không có căn cứ, và lời cáo buộc ấy khiến họ bỏ lỡ cơ hội được hướng dẫn và hiểu biết.\n\nCâu 45\n\n«Những kẻ trước họ đã phủ nhận (chân lý). Quả thật, những gì mà (những kẻ đa thần Quraish) có được (từ tiền của, con cái, sức mạnh) không bằng một phần mười các ân huệ mà TA đã ban cho các thế hệ trước nhưng tất cả các thế hệ trước đều phủ nhận các vị Sứ Giả của TA. Bởi thế, (Ngươi – Thiên Sứ hãy xem) sự trừng phạt của TA dành cho họ đã khủng khiếp thế nào.» (34:45)\n\nQuraysh không phải dân đầu tiên phủ nhận; sức mạnh của họ cũng không ngăn được điều từng giáng xuống những dân trước. Vì thế, mạch văn đưa họ trở về lịch sử những người phủ nhận. Có hai cách hiểu lời nói về việc chưa đạt một phần mười, tùy đối tượng mà các đại từ chỉ đến. Theo một ý kiến, Quraysh chưa bằng một phần mười sức mạnh và thế lực những dân trước được ban. Bao dân từng có thân hình lớn hơn, quyền lực mạnh hơn, xây dựng trên đất và đục núi làm nơi ở; nhưng khi phủ nhận các sứ giả, sức mạnh không cứu được họ. Đấng đã tiêu diệt họ không bất lực trước Quraysh vốn yếu hơn.\nTheo ý kiến khác, những dân trước chưa nhận được đến một phần mười sự rõ ràng của các dấu hiệu dành cho những người hiện tại. Qur’an đã đến như bằng chứng rõ ràng còn mãi. Mặc khải nói bằng ngôn ngữ của người Ả Rập và xác lập lý lẽ đối với họ là một ân ban lớn biết bao! Về địa vị của dấu hiệu ấy, Thiên Sứ ﷺ nêu: «Mỗi vị ngôn sứ đều được ban những dấu lạ khiến người ta tin.» (Abu Hurayrah; Al-Bukhari 4981; diễn nghĩa). Phần tiếp theo của bản thuật nói: «Điều Ta được ban cho là một sự mặc khải mà Allah đã mặc khải cho Ta, vì vậy Ta hy vọng sẽ là người có số lượng tín đồ đông đảo nhất vào Ngày Phục Sinh.» (Abu Hurayrah; Al-Bukhari 4981). Theo hướng hiểu này, lời cảnh báo càng nghiêm: nếu Allah đã trừng trị những kẻ phủ nhận các sứ giả sau bằng chứng họ nhận, thì người quay lưng sau những bằng chứng lớn lao này sẽ ra sao? Bằng chứng càng rõ, trách nhiệm của kẻ cố ý bác bỏ càng tăng.\nCó bản thuật gán cho Abdullah ibn Amr lời xếp ba nhóm chịu hình phạt nghiêm khắc nhất: những kẻ đạo đức giả, những người vô đức tin trong nhóm được ban bàn thức ăn, và dân của Pha-ra-ông (At-Tabari, Jami al-Bayan 9/132). Cả hai đường truyền được dẫn đều đi qua Abu Mughira al-Qawwas; Sulayman al-Taymi đánh giá ông yếu, còn Ibn Ma‘in đánh giá ông đáng tin. Vì vậy, lời xếp hạng ấy được giữ như một bản thuật có đánh giá khác nhau về người truyền, không được khẳng định chắc chắn. Bài học hiện rõ nơi Pha-ra-ông: «Và quả thật TA đã phơi bày cho hắn (Pha-ra-ông) thấy tất cả phép lạ và bằng chứng của TA nhưng hắn đã phủ nhận và chối bỏ.» (20:56). Và xin đối chiếu trọn lời phán về bàn thức ăn: «Allah phán: “TA sẽ ban nó (bàn thức ăn) xuống cho các ngươi. Tuy nhiên, nếu ai trong các ngươi vô đức tin sau đó thì chắc chắn TA sẽ trừng phạt kẻ đó bằng một sự trừng phạt mà TA chưa từng trừng phạt ai trên đời này.”» (5:115). Trong suy ngẫm của giảng giả, lời đe dọa ấy cho thấy trách nhiệm đặc biệt sau dấu hiệu rõ ràng và tính khác thường của hình phạt. Phần so sánh trong bản dịch vừa dẫn nói đến hình phạt chưa từng có trước đó; nó vẫn nằm trong một lời cảnh báo có điều kiện về hình phạt sẽ đến. Cũng vậy, người đã nghe mặc khải, biết đường lối của Sứ Giả rồi giấu vô đức tin mà tỏ ra trái lại không thể lấy việc mình gần những nơi bằng chứng được trình bày làm lý do bào chữa.\nCâu kết hỏi sự trừng trị của Allah đã như thế nào. Trong cấu trúc tiếng Ả Rập, một chữ chỉ ngôi thứ nhất được lược đi, còn nguyên âm trước đó biểu thị nó: nghĩa là sự phản đối và trừng trị của chính Ngài đối với họ. Sự phản đối của Allah không giống người chỉ có thể lên tiếng bất bình; nó hiện ra bằng hình phạt làm tan sức mạnh của những kẻ quay lưng, khiến điều họ tự phụ không giúp được gì. Lịch sử ở đây không phải tin cũ tách khỏi hiện tại, mà là cảnh báo cho ai lặp lại con đường phủ nhận.\n\nCâu 46\n\n«Ngươi (hỡi Thiên Sứ) hãy nói với (những kẻ thờ đa thần Quraish): “Ta chỉ khuyên các người một điều: các người hãy vì Allah mà đứng lên từng cặp hay từng người rồi suy ngẫm, (chắc chắn các người sẽ thấy) người bạn của các người (Muhammad) không phải là một gã điên mà đích thực là một vị cảnh báo các người về một sự trừng phạt khủng khiếp sắp đến.”» (34:46)\n\nSau cuộc luận chứng dài với nhiều cách làm rõ, một lời khuyên duy nhất tập hợp con đường đón nhận chân lý: người nghe cần đứng lên vì Allah rồi suy nghĩ, khi ở riêng hoặc trao đổi từng hai người. Cụm «Ta chỉ khuyên các người một điều» (34:46) vẫn mang sự chân thành và thương cảm. Sau bao lần bị bác bỏ, Sứ Giả vẫn muốn họ được cứu, trao cho họ một điều rõ ràng để tự mang về suy ngẫm. Đó cũng là tinh thần công bằng trong lời trước: «Hãy bảo họ “Ai cung cấp bổng lộc cho các người từ các tầng trời xuống dưới đất?” Hãy bảo họ: “Allah!” \"(Giữa chúng ta), chúng tôi hay quí vị sẽ là người công khai đi đúng đường hay lạc đường.”» (34:24). Vẻ ngoài của quyền lực và vô số lời bôi nhọ có thể lấn át một người. Họ cần lời nói mở cửa suy xét, kéo mình khỏi tiếng ồn đã che mất bằng chứng.\nTrước hết là “đứng lên”: nghiêm túc bắt tay tìm hiểu, thay vì buông xuôi trong hoang mang hay lặp lại lời đám đông. Nghe nhiều ý kiến trái ngược về cùng một chuyện, người ta có thể mệt mỏi, bảo rằng không còn tin ai. Nhưng sự mệt mỏi ấy không miễn cho họ việc tìm sự hướng dẫn, bởi điều liên quan là kết cục của chính mình nơi Allah. Tìm kiếm không phải chọn lời hợp ý, bảo đảm lợi lộc và thoải mái rồi gọi đó là tìm chân lý. Vì thế, việc đứng lên được gắn với “vì Allah”: nhằm sự hài lòng của Ngài, chứ không để thuận theo xã hội, có địa vị hay làm vừa lòng người mình sợ trách móc.\nHành trình Salman là một ví dụ. Để biết tôn giáo chân thật, ông rời những gì quen thuộc, đi tìm người dẫn đến chân lý qua vùng Sham, Mosul, Nisibin và Ammuriyya, theo những hiểu biết tìm được; cuối cùng đến đất Ả Rập rồi gặp Thiên Sứ tại Madinah (Ahmad 23737). Khát vọng chân thành không nằm yên như một ước muốn: nó khiến người ta lên đường và chịu cái giá của việc tìm kiếm.\nTiếp đến, cụm «từng cặp hay từng người» (34:46) gợi môi trường phù hợp để suy nghĩ. Một người la hét có thể phá hỏng cả đám đông ồn ào, biến trao đổi lý lẽ thành tranh cãi dồn dập không ai nghe ai. Sợ trở thành người đầu tiên khác ý số đông, có người công khai bác điều mà nếu tự xem xét, họ sẽ chấp nhận. Chẳng hạn, nghe một ý tưởng chưa quen như dạy trẻ ở nhà, cả nhóm vội chế giễu trước khi xét tính khả thi và sự phù hợp với từng hoàn cảnh. Điều đáng suy ngẫm là phán xét đã bị đám đông dẫn dắt trước khi ý tưởng được cân nhắc. Nỗi sợ lời chê có thể còn nghiêm trọng hơn: có người thời trước Islam vì một nỗi nhục tưởng tượng mà chôn sống con gái, để cái nhìn xã hội lấn át lòng thương và tình yêu trong mình.\nCũng thấy ảnh hưởng ấy ở người trẻ được khuyên cầu nguyện giữa nhóm bạn. Họ gạt đi, chống chế vì mải lo bạn bè sẽ nói gì và sợ mất sự đồng hành. Nhưng khi một người thương mình nói riêng, họ lại lắng nghe, mềm lòng và chấp nhận. Ở riêng, hoặc trò chuyện giữa hai người chân thành, biết suy xét và muốn được hướng dẫn, sẽ giảm những tác động ngăn nghe lời. Người có học tôn giáo cũng không miễn nhiễm. Họ có thể theo một ngành khiến nhóm mình kính nể, bỏ điều bản thân hay cộng đồng cần hơn, chỉ vì ngại kém địa vị. Đứng lên vì Allah đòi hỏi xét lại mục đích trong cả hai trường hợp, trở về điều làm Ngài hài lòng.\nSau khi thành thật trong tìm kiếm và làm dịu các tác động bên ngoài, lời khuyên hướng người nghe đến việc suy xét về «người bạn của các người» (34:46). Đây là người họ biết đã lâu, biết sự chân thật, đáng tin và sáng suốt của Người, chứ không phải người lạ chưa từng được kiểm nghiệm. Đồ người khác gửi giữ vẫn còn nơi Người đến lúc di cư (Al-Bayhaqi 12823); khi tranh chấp việc đặt Hắc Thạch, họ từng chấp nhận phán quyết của Người (At-Tayalisi 115). Làm sao những điều đã biết ấy phù hợp với lời buộc tội điên dại? Vì sao Người chịu tổn hại và nguy hiểm, bỏ sự yên ổn, kêu gọi họ mà không đòi tiền? Người còn mang Qur’an thách họ đưa ra điều tương tự, nhưng họ không có gì bác bỏ bằng chứng ấy.\nMột chuyện được truyền lại về Al-Walid ibn Al-Mughira minh họa việc Qur’an tác động rồi bị khước từ dưới áp lực người đời. Thiên Sứ đọc cho ông nghe, khiến lòng ông dịu lại. Khi hay chuyện, Abu Jahl ép ông nói điều khiến dân mình hài lòng. Dù đã thừa nhận lời nghe được khác thường, có sự ngọt ngào và vẻ đẹp, cuối cùng Al-Walid vẫn gọi đó là ma thuật (Al-Hakim, Al-Mustadrak 2/550). Al-Hakim đánh giá chuỗi truyền là xác thực theo điều kiện của Al-Bukhari; Muqbil al-Wadi‘i nhận xét đường truyền nối liền qua Ma‘mar là bất thường. Al-Bayhaqi cũng ghi những đường truyền không nối liền đến vị Sahabah. Đánh giá về đường truyền nối liền này vì vậy có khác biệt giữa các học giả. Vấn đề không phải lòng ông không chịu tác động, mà là ông quay lại tính toán phản ứng của dân mình.\nLời khuyên kết bằng nhiệm vụ thật sự của Sứ Giả: Người chỉ cảnh báo họ trước một hình phạt nghiêm khắc. Người không điên dại, cũng không tìm lợi ích từ họ, mà cảnh báo hậu quả gần kề cần đánh thức sự suy xét. Đừng để việc tan buổi gặp cũng chấm dứt suy nghĩ về điều đã nghe.\n\nCâu 47\n\n«Hãy bảo: “Phần thưởng mà ta có thể hỏi từ các người là của các người; còn phần thưởng của ta thì do Allah (ban cấp) bởi vì Ngài chứng giám tất cả mọi việc.\"» (34:47)\n\nViệc phủ nhận đòi thù lao càng làm rõ điều cần suy xét. Người cảnh báo họ không biến lời kêu gọi thành nguồn lấy tiền của họ, cũng không tìm cho mình lợi lộc từ những gì họ bỏ ra. Một cách hiểu phần đầu là Người vốn không hề đòi thù lao; và giả sử từng đòi điều gì, Người cũng trả lại cho họ. Cách đặt giả thiết ấy dẹp bỏ nghi ngờ về lợi ích riêng. Có ý kiến cho rằng lợi ích của zakat, bố thí và chi dùng mà Người kêu gọi đều trở về với chính họ, không phải thù lao cho Người hưởng. Theo ý kiến khác, ý nghĩa rộng hơn: lời kêu gọi và Qur’an đem lợi ích cho họ, bởi họ là người được hướng dẫn và cứu thoát khi đi theo; còn phần thưởng truyền đạt sứ mạng, Người chỉ mong nơi Allah. Các cách hiểu cùng gặp nhau ở sự thuần khiết của sứ mạng: việc họ chấp nhận không đem thêm cho Người một lợi ích riêng đang theo đuổi.\nLời kết khẳng định Allah chứng kiến mọi sự. Ngài biết lời và ý định của Sứ Giả, không điều chân thật hay dối trá nào khuất khỏi Ngài. Nếu Người bịa chuyện nhân danh Ngài, Ngài đủ sức phơi bày điều trái với lời Người nhận. Sự trợ giúp, việc nâng cao danh tiếng và gìn giữ Người cho đến khi truyền đạt sứ mạng là những biểu hiện Allah làm chứng cho Sứ Giả. Khi đã xem xét con người họ biết, việc Người không đòi khoản thù lao mà họ gán cho, và sự trợ giúp của Allah, họ phải đối diện với chính bằng chứng, thay vì trốn bằng một cáo buộc về ý định không hề có chứng cứ.\n\nCâu 48\n\n«Ngươi (hỡi Thiên Sứ) hãy nói: “Quả thật, Thượng Đế của Ta ban Chân Lý xuống (để loại bỏ điều ngụy tạo) và Ngài là Đấng Thông Toàn mọi điều vô hình.”» (34:48)\n\nChân lý mà Thượng Đế đưa đến là mặc khải Sứ Giả mang theo, nền tảng để đối diện với điều sai trái và xác lập bằng chứng chống lại nó. Sức mạnh của chân lý ấy không được đo bằng sự yếu thế của người mang nó hay sự thiếu khả năng diễn đạt của người đối thoại. Người nói có thể yếu mà bằng chứng Qur’an vẫn vững; tình thế chiến đấu và thực hiện có thể đổi thay mà một tín ngưỡng sai không vì vậy thành đúng. Cần phân biệt sự sáng tỏ của bằng chứng với thắng bại xảy đến cho người theo nó. Sức mạnh vật chất không thay được lập luận; thiếu sức mạnh cũng không bác bỏ được bằng chứng.\nHình ảnh ném chân lý cho thấy sức mặc khải đánh trúng gốc rễ điều sai và loại bỏ nó: «Không! TA lấy Chân Lý chọi sự ngụy tạo, Chân Lý đập mạnh vào sự ngụy tạo làm cho sự ngụy tạo vỡ tan.» (21:18). Hình ảnh đánh vào đầu nói lên việc điều sai không còn đứng vững bằng lý lẽ. Qur’an không chỉ là những nét tinh tế về ngôn từ để người nghe trầm trồ, những đạo đức chung tách khỏi việc chỉ thờ Allah, hay những thói quen thực hiện mà không nhìn chân lý nó xác lập và sự đa thần nó phá bỏ. Nó đi thẳng vào cuộc đối đầu giữa hướng dẫn và lầm lạc. Mối thù ấy đã có từ lâu; một mặt của nó hiện ra trong chuyện Iblis đi quanh Adam sau khi ông được tạo dựng (Muslim 2611). Mặc khải giúp con người nhận biết kẻ thù và con đường thoát khỏi sự dẫn dụ của nó.\nBằng chứng có thể hiện rõ mà vẫn bị người theo đuổi điều khác ngoài chân lý chối bỏ, như Al-Walid nhận ra tác động của Qur’an rồi chuyển sang lời làm vừa lòng dân mình. Việc được nghe bằng chứng ấy quan trọng đến mức Allah ra lệnh bảo đảm an toàn cho người đa thần xin nương náu để người ấy được nghe, rồi đưa đến nơi an toàn: «Nếu có người đa thần nào đến xin Ngươi (hỡi Thiên Sứ) chỗ tị nạn thì Ngươi hãy che chở y để y có thể nghe lời phán của Allah, sau đó đưa y đến nơi an toàn.» (9:6). Mục đích là để họ có cơ hội biết chân lý, không để sợ hãi cản trở việc nghe mặc khải, và lựa chọn trên cơ sở sáng tỏ. Xin đối chiếu cả câu nói về Badr: «Các ngươi (những người có đức tin) hãy nhớ lại lúc các ngươi ở phía bên này gần (thung lũng Badr) và họ (những kẻ đa thần Quraish) ở phía bên kia cách xa (thung lũng) hơn, còn đoàn khách thương thì ở vị trí thấp hơn các ngươi (đang di chuyển về hướng biển đỏ). Nếu như các ngươi đã hẹn giao chiến (với chúng từ trước) thì chắc chắn các ngươi đã gặp phải sự thất bại. Tuy nhiên, (cuộc giao chiến đã diễn ra) là bởi vì Allah muốn hoàn thành một vấn đề đã được định sẵn, (đó là) để ai tới số chết thì phải chết theo bằng chứng rõ ràng và ai vẫn còn sống thì sẽ sống theo bằng chứng rõ ràng. Quả thật, Allah hằng nghe, hằng biết.» (8:42). Trong suy ngẫm ở đây, giảng giả nhấn mạnh trách nhiệm đáp lại sau khi bằng chứng đã rõ; cách diễn đạt bản dịch vừa dẫn đặt sự sống và cái chết trong bối cảnh trận chiến.\nCách gọi “Thượng Đế của Ta” gợi sự chăm sóc dành cho Sứ Giả mang bằng chứng ấy. Sự vững vàng của Người không phải sức cá nhân tách khỏi sự quan tâm của Thượng Đế. Kết câu càng làm rõ: Đấng đưa chân lý xuống là Đấng biết mọi điều vô hình, trái với những kẻ phủ nhận mà chương sẽ nói: «họ đã thường phỏng đoán về điều vô hình từ một nơi xa.» (34:53). Hai hình ảnh đối nhau ở người ném, điều được ném và mức độ hiểu biết: một bên là Thượng Đế đưa chân lý xuống với tri thức trọn vẹn; bên kia là con người tung phỏng đoán không bằng chứng, không có kinh sách đang học để làm căn cứ. Họ như người bắn từ xa đã nhắm mắt rồi cứ bắn. Khoảng cách cùng sự không nhìn thấy cho thấy luận điệu hỏng đến đâu, dù giọng nói tự tin thế nào.\nKhác biệt ấy tác động đến những quan niệm định hướng cuộc sống, trong đó có chính trị, tiền của và quan hệ giữa người với người, như chủ nghĩa xã hội, chủ nghĩa tư bản, chủ nghĩa tự do và chủ nghĩa thế tục khi chúng trình bày một quan niệm bao trùm về đời sống. Một quan niệm do con người xây dựng có thể đúng ở điểm cụ thể hay phù hợp với một phán đoán đúng, nhưng không vì vậy mà toàn bộ nền tảng của nó là sự hướng dẫn. Cũng không đúng khi phủ nhận mọi điều cụ thể được những người có quan điểm trái với mặc khải thừa nhận. Cần xét các nền tảng xác định mục đích con người, đối tượng họ thờ và thước đo phán xét, rồi quy các vấn đề cụ thể về điều chân thật đã được xác lập.\nSự hướng dẫn giải phóng trái tim khỏi nô lệ cho thụ tạo, giúp nó biết Thượng Đế và kết cục của mình, đem đến phương hướng không chỉ giới hạn ở lợi ích tức thời. Đấng biết mọi điều vô hình biết hậu quả của việc theo hay bỏ mặc khải, và điều con người cần trong tương lai. Sự hướng dẫn của Ngài không ngang với một thử nghiệm của con người mà một phần thiếu sót chỉ lộ ra sau khi người ta đã hứng hậu quả. Nhìn hiện tại, có người thấy khó tin rằng mặc khải này có thể giúp nhân loại đến Ngày Phán Xét, hay những người yếu thế giữa lòng Makkah có thể mang tôn giáo ấy ra thế giới. Nhưng điều xa lạ với hiểu biết hạn hẹp của họ không khuất khỏi Đấng đã ban mặc khải và biết những kết cục của nó. Khi tin vào kiến thức ít ỏi quen thuộc rồi ngạc nhiên rằng sự hướng dẫn vẫn thích hợp với điều mình chưa chứng kiến, ta cần nhớ tri thức bao la của Đấng ban nó. Điều kín và điều hiện đều ngang nhau trong tri thức Allah: «Ai trong các ngươi giấu giếm lời nói (của mình) hoặc ai nói toạc ra ngoài cũng như ai ẩn mình trong đêm tối với ai bước đi ngang nhiên giữa bán ngày, (đối với Ngài) tất cả đều như nhau cả.» (13:10). Không được lấy tri thức thụ tạo đo tri thức của Ngài: «Không có cái gì giống Ngài. Và Ngài là Đấng Hằng Nghe, Đấng Hằng Thấy.» (42:11). Lòng tin mặc khải bắt nguồn từ việc biết Đấng đã ban nó và sự hiểu biết bao quát của Ngài, chứ không từ ý nghĩ rằng con người đã hiểu hết mọi mặt khôn ngoan trong đó.\n\nCâu 49\n\n«Ngươi (hỡi Thiên Sứ) hãy nói: “Chân lý đã đến thì sự ngụy tạo không thể bắt đầu (bất cứ điều gì) cũng như không thể phục hồi được.”» (34:49)\n\nSau lời Thượng Đế đưa chân lý đến, nay là tuyên bố chân lý đã đến. Chính sự xuất hiện của nó phơi bày sự bất lực của điều sai: «Ngươi hãy nói (với người đa thần): “Chân lý đã đến thì điều ngụy tạo phải tan biến. Quả thật, mọi điều ngụy tạo đều tiêu tan (vì không đứng vững trước chân lý).» (17:81). Người theo chân lý không đợi điều sai tự nguyện nhường chỗ rồi mới truyền đạt và hành động. Một ví dụ về sự chờ đợi sai lầm ấy là lời con cháu Israel; xin đọc cả câu làm bối cảnh: «Họ đáp: “Hỡi Musa! Quả thật, nơi đó có một dân tộc sức mạnh phi thường; và thực sự chúng tôi sẽ không bao giờ tiến vào (thánh địa) được trừ phi chúng rời khỏi nơi đó. Bởi thế, nếu chúng ra đi thì chúng tôi sẽ vào.”» (5:22). Họ đặt việc dân trong vùng phải rời đi làm điều kiện để mình bước vào, như muốn đạt đích sau khi điều mình được giao đối diện đã tự biến mất. Việc sửa đổi cũng không thành chỉ bằng chờ điều sai lùi bước, mà cần trình bày chân lý và thực hiện nó.\nLời kết của câu có những cách hiểu riêng biệt. Theo một ý kiến, điều sai không còn khả năng tiến hay lùi trước bằng chứng đã đến: sự bất lực đã lộ, không còn sức đối lại. Theo ý kiến khác, nó không tạo ra ban đầu và cũng không phục sinh sau cái chết. Vậy sao lại thờ điều không làm được cả hai và đặt nó ngang Đấng Tạo Hóa? Một điều có thể suy ngẫm là chân lý gây dựng cộng đồng, hướng dẫn họ đến điều làm mình sống, và phục hồi những điều kiện đứng dậy khi họ sa sút rồi quay về với nó. Điều sai không ban sự hướng dẫn bền vững để chỉnh đốn đời này và Đời Sau, cũng không chữa được sự hư hỏng do rời chân lý.\nĐiều này không phủ nhận sự tồn tại của những quốc gia mạnh về vật chất mà không theo Islam. Một nhà nước đứng được bằng sức mạnh và tiền của là một chuyện; một cộng đồng được hướng đến đời sống có mục đích, đạo đức và sự phát triển đúng đắn là chuyện rộng hơn. Hai góc nhìn về sức mạnh của người ngoài Islam giúp tránh bị vẻ ngoài đánh lừa. Thứ nhất, những điều công bằng, xóa áp bức và khuyên nhau chân thành nơi một số họ cũng là các giá trị những sứ mạng ngôn sứ mang đến. Không phải mọi điều họ thực hiện và nhờ đó mạnh lên đều sai, dù họ không quy nó về mặc khải. Thứ hai, hơn người khác ở một mức tương đối không chứng tỏ mọi mặt đều tốt. Sự tụt hậu của người Muslim có thể trầm trọng đến mức người ở trên họ trông như đã đạt hoàn hảo, dù vẫn có thiếu sót đạo đức và xã hội.\nVí như hai người ở hai bậc khác nhau dưới mặt đất: người thấp hơn thấy người kia cao hơn mình, nhưng cao hơn tương đối không có nghĩa người kia đã lên mặt đất. So sánh có thể cho thấy người thứ nhất xuống thấp đến đâu, chứ không chứng minh người thứ hai đã tới đích. Vì thế, bắt chước dáng vẻ sức mạnh không thay được việc xét theo thước đo chân lý; tự hào về mặc khải cũng không miễn việc thực hành và nắm lấy những phương tiện tạo sức mạnh mà mặc khải đã ra lệnh.\n\nCâu 50\n\n«Ngươi (hỡi Thiên Sứ) hãy nói với (những kẻ thờ đa thần Quraish): “Nếu Ta lầm lạc thì thật ra chỉ bản thân Ta lầm lạc mà thôi nhưng nếu Ta được hướng dẫn thì đó là do những gì mà Thượng Đế của Ta đã mặc khải cho Ta. Quả thật Ngài hằng nghe và Ngài ở gần kề.”» (34:50)\n\nPhần luận chứng này khép lại bằng tinh thần công bằng đã mở đầu. Sứ Giả đặt trước họ giả thiết về sự lầm lạc mà họ gán cho Người, nêu rằng nếu điều ấy xảy ra thì hậu quả trở về chính Người, và nguồn lầm lạc ở bản thân khi rời sự hướng dẫn. Mệnh đề điều kiện không thừa nhận Người từng lầm lạc, cũng không biểu thị nghi ngờ mặc khải đã đến. Đây là cách hạ mình trong đối thoại, đưa họ trở lại xét bằng chứng và chặn lời vin vào cáo buộc ý đồ. Rồi Người quy mọi sự hướng dẫn về Thượng Đế qua mặc khải Ngài ban. Nếu ngay Sứ Giả, người chân thật và sáng suốt nhất, còn xác định mình được hướng dẫn bằng mặc khải này, thì ai kém hơn có thể lấy trí óc, kinh nghiệm hay đông người trợ giúp để khỏi cần nó? Điều Người mang đến không phải thủ đoạn tìm quyền lực, mà là sự hướng dẫn từ Thượng Đế nghe lời các bầy tôi và biết nhu cầu của họ. Hai thuộc tính Hằng Nghe và Gần Gũi trấn an người truyền đạt: Allah nghe điều họ nói và lời nói với họ, biết nhu cầu của họ cùng những người họ kêu gọi đến sự hướng dẫn. Cuộc đối diện ấy không nằm ngoài tri thức và sự chăm sóc của Ngài.\n\nCâu 51\n\n«Nếu Ngươi (hỡi Thiên Sứ) có thể nhìn thấy được tình cảnh bọn họ sợ hãi (khi nhìn thấy sự trừng phạt), bọn họ vô phương trốn thoát và sẽ bị túm bắt từ một nơi rất gần,» (34:51)\n\nSau năm lệnh “hãy nói” liên tiếp mở cho những người quay lưng nhiều cánh cửa công bằng và suy xét, cảnh hoảng sợ xuất hiện để lời cảnh báo hậu quả luôn hiện diện: giá như thấy họ lúc kinh hoàng rồi không tìm được lối thoát! Có nhiều cách hiểu về thời điểm này. Theo một ý kiến, đó là nỗi sợ tại Badr khi những kẻ phủ nhận thấy quân Muslim cùng các thiên thần đang chiến đấu bên phía quân Muslim. Theo ý kiến khác, đó là lúc chết, khi họ thấy các thiên thần và điều các vị ấy đem đến: «Giá như Ngươi (hỡi Thiên Sứ) thấy được cảnh tượng khi các Thiên Thần bắt hồn những kẻ vô đức tin bằng cách đánh vào mặt và lưng của chúng; và (các Thiên Thần bảo chúng): “Các ngươi hãy nếm lấy hình phạt của Lửa thiêu đốt!”» (8:50). Còn một ý kiến cho rằng đó là nỗi kinh hoàng Ngày Phán Xét, khi điều họ phủ nhận hiện ra và Lửa được đưa đến. Bản thuật của Abdullah bin Mas‘ud mô tả cảnh Hỏa Ngục được đưa đến: «Ngày hôm đó, Hỏa Ngục sẽ được mang đến với bảy mươi ngàn chiếc khoen cầm, mỗi chiếc khoen có đến bảy mươi ngàn Thiên Thần nắm kéo.» (Abdullah bin Mas‘ud; Muslim 2842).\nMỗi hướng giải thích đều nêu một khoảnh khắc sự ngang ngược phủ nhận biến thành sợ hãi. Con người muốn chạy khỏi điều đã thấy, nhưng câu trả lời là không thể thoát. Họ không vượt khỏi quyền năng Allah, cũng không khiến Ngài bất lực bằng bỏ chạy. Việc bị bắt từ một nơi gần phá tan ý nghĩ có nơi nào che chở khỏi Ngài. Dù ở đâu họ vẫn bị bắt, dù hiểu cảnh này là hình phạt đời này, cái chết hay Ngày Phán Xét. Sự gần gũi ở đây cho thấy quyền năng bao trùm và việc bắt họ thật dễ dàng, sau khi họ tưởng sức mạnh mình có giữ mình xa hình phạt.\n\nCâu 52\n\n«Thì bọn họ nói: “Chúng tôi giờ đây đã có đức tin”, tuy nhiên, làm sao bọn họ có thể nhận được đức tin từ một nơi quá xa xôi!» (34:52)\n\nLúc ấy họ nói mình đã tin, sau khi các dấu hiệu từng được trình bày, quyền thống trị và tri thức của Allah đã được làm rõ, họ từng được mời xét sự chân thật của Sứ Giả mà vẫn quay lưng. Nay sự thừa nhận đi cùng hoảng sợ, sau thời gian đức tin được mở ra khi họ còn có thể lựa chọn và hành động. Từ ngữ trong nguyên văn gợi việc với lấy: như người đưa tay lấy một vật ở gần, cùng ý nghĩa tiếp cận từ gần trong một từ cùng gốc. Nhưng nay họ muốn với lấy điều đã xa: đức tin vốn đem lại ích lợi trong thời gian còn được chấp nhận, nhưng nay thời hạn ấy đã qua. Câu hỏi làm rõ rằng lúc ấy họ không thể đạt được. Khi đức tin ở ngay trước mắt, họ từ chối; đến lúc hết cơ hội sửa lại mới mong trở về. Khoảng cách không đơn thuần là quãng đường đôi chân đi được, mà là sự cách biệt giữa hai tình trạng: tin do tự lựa chọn khi mặc khải kêu gọi, và buộc phải thừa nhận khi tận mắt thấy điều không thể đẩy lui. Hình ảnh bàn tay vươn ra mà không chạm tới làm hiện rõ nỗi tiếc nuối: họ bỏ phí điều từng rất gần, rồi cố lấy lại khi đã quá muộn.\n\nCâu 53\n\n«Quả thật, họ đã phủ nhận chân lý từ trước và họ đã thường phỏng đoán về điều vô hình từ một nơi xa.» (34:53)\n\nLời cầu xin muộn màng ấy không đến sau một sự không hay biết vì chưa được giải thích. Họ từng phủ nhận khi đức tin đã được trình bày; hơn cả quay lưng, họ còn ném vào chân lý và người mang nó những lời không có hiểu biết. Họ gọi mặc khải là dối trá, ma thuật, công kích người đồng hương mình, nói như đã biết điều phía sau trong khi cách xa bằng chứng. Lời về việc phỏng đoán điều vô hình từ nơi xa làm hiện lại sự đối lập với: «Quả thật, Thượng Đế của Ta ban Chân Lý xuống (để loại bỏ điều ngụy tạo) và Ngài là Đấng Thông Toàn mọi điều vô hình.» (34:48). Đấng ban chân lý biết điều vô hình; còn họ tung phỏng đoán về điều không biết. Không thể với lấy đức tin lúc ấy không phải sự bất công đối với họ. Chính họ tự làm mình xa khi con đường tin còn gần, chọn ngăn người khác, cho đến khi điều từng quả quyết bác bỏ trở thành điều tận mắt thấy, mà không thể trở về thời gian còn được lựa chọn.\n\nCâu 54\n\n«Giữa họ và những điều mà họ mong ước có một bức màn ngăn cách, tương tự trường hợp đã xảy ra cho những kẻ như họ trong quá khứ. Quả thật, họ là đám người đã luôn ở trong tình trạng hoài nghi.» (34:54)\n\nChương kết bằng sự ngăn cách phơi bày kết cục của những điều họ từng bám víu. Một cách hiểu là họ bị ngăn khỏi tiền của, con cái và hưởng thụ đời này mà mình yêu thích. Kết thúc trở về lời khoe khoang: «Bọn ta có nhiều tiền của và đông con cái, và bọn ta chắc chắn sẽ không bị trừng phạt.» (34:35). Những gì đang có từng làm họ tự phụ, nhưng khi chết, họ không thể mang theo hay ở lại bên chúng. Hình ảnh người bám lấy tiền của muốn đưa tay tới mà bị ngăn, hoặc mong tiếp tục vui hưởng với con cái nhưng thời gian ở cùng đã hết, cho thấy sự bất lực của thứ họ lấy làm nguồn sức mạnh và an toàn.\nTheo một ý kiến khác, họ bị ngăn khỏi sám hối và đức tin mà nay mong muốn khi thời hạn đã qua. Họ hối hận từng lời công kích tôn giáo, từng lần chống chân lý, nhưng ước muốn muộn không đưa lại thời gian hành động. Hình phạt còn đến mức họ không được phép bào chữa: «Chúng cũng sẽ không được phép biện minh.» (77:36). Họ được bảo: «Các ngươi hãy cút vào trong đó (Hỏa Ngục) và chớ thưa bẩm gì với TA nữa!» (23:108). Nỗi tiếc không chỉ vì mất hưởng thụ, mà vì sự cứu thoát từng ở gần đã bị bỏ đi. Điều ấy từng xảy ra với những kẻ giống họ trong các dân phủ nhận trước kia. Những người cùng phe ở đây là những kẻ theo cùng con đường vô đức tin và quay lưng; nguyên nhân lặp lại nên hậu quả cũng lặp lại.\nLời kết nêu tình trạng đã ăn sâu: họ luôn ở trong sự hoài nghi gây bất an. Nỗi phân vân không khiến họ chân thành đứng lên vì Allah và tìm bằng chứng. Mỗi khi mặc khải gần đánh thức trái tim, họ lại quay về sợ mất địa vị và do dự, cho đến hết đời vẫn đẩy xa điều mời gọi mình được cứu. Kết thúc vì thế nối với lời khuyên đứng lên vì Allah, từng đôi và từng người. Suy nghĩ chân thành giúp thoát quyền chi phối của đám đông; còn mãi tính toán làm vừa lòng nó sau khi chân lý hiện rõ có thể giam con người đến phút cuối.\nChuyện Abu Talib lúc chết là một minh họa. Bản thuật Al-Bukhari 1360 kể việc Thiên Sứ ﷺ đến thăm và mời ông xác nhận chỉ Allah xứng đáng được thờ phượng. Phần giải thích của bản dịch nêu mục đích: «một lời mà cháu sẽ dùng nó để chứng nhận cho bác nơi Allah.» (phần giải thích bản dịch; Al-Bukhari và Muslim). Abu Jahal và 'Abdullah bin Abi Umayyah cứ hỏi: «Chẳng lẽ ngươi muốn từ bỏ tôn giáo của 'Abdul Muttalib ư?» (Al-Musayyab qua Sa‘id; Al-Bukhari và Muslim). Lời đáp cuối của Abu Talib được ghi là: «Theo tôn giáo của 'Abdul Muttalib» (Al-Musayyab qua Sa‘id; Al-Bukhari và Muslim). Chính hai người ấy đặt câu hỏi, còn Sứ Giả kêu gọi ông đến đức tin. Lòng tự ái với truyền thống vẫn đè nặng khi ông không còn thời gian trì hoãn quyết định.\nChuyện Al-Walid cũng đã cho thấy ông chịu tác động khi nghe Qur’an, rồi quay lại tính phản ứng dân mình và điều cần nói để họ hài lòng. Về ông có lời: «Y quả thật đã suy tính và mưu đồ.» (74:18). Suy tính bị chê ở đây là toan tính để gạt chân lý đã hiện rõ, khác với tìm hiểu chân thành được lệnh trong câu 46. Không có mâu thuẫn giữa kêu gọi suy ngẫm và cảnh báo sự do dự không tuân phục. Người bầy tôi cần đấu tranh với điều cản mình theo sự hướng dẫn, tranh thủ khi nhận ra nó, trước khi điều hôm nay còn chọn được trở thành điều ngày mai chỉ biết khao khát mà đã bị ngăn cách.\n\nNGUỒN BẢN DỊCH\n\nQur’an: Nhóm biên dịch Rowwad; Hasan Abdulkarim; Kinh Quran — Maulana Wahiduddin Khan và Prof. Farida Khanam, Goodword Books (2026).\n\nHadith: Tóm Lược Riyadh Al-Saaliheen và các đoạn diễn nghĩa riêng cho bài học. Bộ sưu tập và người truyền được ghi bên từng bản thuật.\n\nCác ghi chú của bản dịch và thông tin về từng ấn bản nằm trong mục Ghi chú và Nguồn.\n", "links": [{"start": 599, "end": 650, "target": "verse-1-1"}, {"start": 667, "end": 871, "target": "verse-34-1"}, {"start": 1061, "end": 1130, "tar
