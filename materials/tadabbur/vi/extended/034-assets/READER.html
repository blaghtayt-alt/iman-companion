 tim không biết giá trị điều được ban.\n\nNhu cầu thay đổi của con người còn thể hiện trong chuyện cầu mưa. Một người đàn ông than vào thứ Sáu về mưa ít và tài sản, vật nuôi bị hủy hoại; Thiên Sứ ﷺ cầu xin. Đến thứ Sáu sau, lại có lời xin Allah cất đi tác hại của mưa quá nhiều, nên Người cầu mưa ở xung quanh, không đổ lên họ. (Al-Bukhari 1014; Anas không xác định người xin lần sau có phải người lần trước hay không.) Lời xin cất thiệt hại chính đáng khác với sự phủ ơn của Saba’, nhưng câu chuyện giúp thấy hoàn cảnh đổi nhanh và con người cần Thượng Đế trong cả hai tình trạng.\n\nSự lãng quên ấy cũng có thể xảy ra với những ân huệ quen thuộc như gia đình, con cái, phương tiện đi lại hay sinh kế. Người ta than phiền nhiều, rồi chỉ nhận ra giá trị khi mất đi. Một điều có thể suy ngẫm là mối liên hệ với việc con cháu Israel xin thay manna và chim cút bằng thứ khác: «Người hãy cầu xin Thượng Đế của Người ban cho chúng tôi thực phẩm mọc ra từ đất như rau xanh, dưa leo, tỏi, đậu và hành.» (2:61). Muốn thứ mình trực tiếp làm bằng tay đôi khi đi cùng ảo tưởng mình đã nắm quyền tự lo, không phải chờ món quà Thượng Đế ban. Trong khi khả năng làm việc và thành quả cũng là ân huệ Ngài.\n\nTương tự, có người tưởng nếu tự làm mưa được, biết bí mật linh hồn hoặc tìm được nơi sống ngoài trái đất thì đã ra khỏi quyền Allah. Mọi phương tiện mở rộng đến đâu vẫn nằm trong quyền sở hữu Ngài: «các ngươi sẽ không thể vượt qua được ngoại trừ có thẩm quyền (từ nơi Allah)» (55:33).\n\nCâu Kinh sau đó mô tả kết thúc. Những người từng nổi tiếng vì cùng chung sống sung túc trở thành chuyện được kể về một thời đã qua. Họ tan tác đến mức thành tục ngữ: tan tác như dân Saba’. Vườn tược, an toàn và sự quây quần không còn là thực tại quanh họ, mà là một tin khiến người nghe kinh ngạc vì sự đổi thay.\n\nĐiều đó quy tụ trái tim về Đấng sở hữu việc ban cho và thu lại. Sau cười có thể là khóc, sau an toàn là lo sợ, sau dư dả là túng thiếu. Người bề tôi không tự mình nắm các trạng thái ấy ngoài Thượng Đế. Vì vậy, họ hướng về Ngài, như toàn câu: «“Ta toàn tâm hướng mặt mình về Đấng đã tạo hóa các tầng trời và trái đất và Ta không là kẻ thờ đa thần.”» (6:79).\n\nCâu chuyện kết bằng kiên nhẫn và biết ơn. Biết ơn giữ trái tim gắn với Đấng Ban Ơn khi thuận lợi; kiên nhẫn đưa người gặp khó trở về với Ngài. Câu trả lời cho tai họa vì thế không chỉ là chạy sang một nơi khác nhưng vẫn quay lưng với Allah. Hadith cho biết: «Thật đáng ngạc nhiên cho vụ việc của người có đức tin, vì mọi việc của y đều tốt, và điều đó không thuộc về ai ngoại trừ người có đức tin. Nếu điều tốt xảy đến với y, y biết ơn, y sẽ được điều tốt; và nếu điều xấu xảy đến với y, y kiên nhẫn, y sẽ được điều tốt.» (Muslim 2999). Người nhận ra ân huệ khi còn nó và trở về với Allah khi mất nó sẽ hưởng lợi từ các dấu hiệu. Đó là điều người kiêu căng trước ân huệ đã bỏ qua, rồi tan tác trong tiếc nuối vì nó."}, {"id": "P065", "text": "Câu 20"}, {"id": "P066", "text": "«Quả thật, Iblis đã khẳng định sự thật về họ cho điều mà hắn đã phỏng đoán (rằng hắn có thể dắt họ lạc khỏi điều chân lý). Cho nên, họ đã nghe theo hắn ngoại trừ một nhóm trong số những người có đức tin.» (34:20)"}, {"id": "P067", "text": "Có cách đọc đôi phụ âm và cách không đọc đôi phụ âm ở động từ nói về việc phỏng đoán của Iblis được chứng tỏ. (Al-Qurtubi, Al-Jami‘ li-Ahkam al-Qur’an, giải câu 34:20.) Việc những người ấy theo hắn đã làm sự phỏng đoán của hắn thành đúng. Hắn dự đoán họ sẽ đáp lại cám dỗ, và họ đã làm điều hắn mong.\n\nĐó không phải biết điều vô hình, mà là một phỏng đoán trùng với lựa chọn của họ. Trước đó, hắn từng tuyên bố sẽ dẫn con người đi lạc và loại trừ các bề tôi của Allah, như câu: «“Ngoại trừ những bề tôi nào của Ngài có tấm lòng chân tâm (thờ phượng Ngài) trong bọn chúng.”» (15:40). Trong nguyên bản, lời ấy nhắc đến những bề tôi được thanh lọc, được dành riêng cho Ngài; bản dịch được trích diễn đạt bằng sự chân thành của họ.\n\nMột lối vào của sự cám dỗ là thấy người bề tôi sống dư dả mà không biết ơn, quên việc tưởng nhớ Allah hoặc luôn khó chịu với phần mình nhận. Những tình trạng ấy chuẩn bị cho họ đáp lại điều được tô đẹp. Điều này không chỉ ở người giàu. Người ít tiền cũng có thể rất bất mãn; Shaytan chờ thử thách đầu tiên đẩy họ khỏi đường. Nó gần với người thờ phượng Allah trên một bờ mong manh: hài lòng khi được dư dả, rồi quay lưng khi bị thử bằng điều không thích.\n\nCũng như người kêu gọi điều sai tìm đối tượng mình nghĩ sẽ nghe theo, sự cám dỗ tìm được đường trong trái tim chấp nhận lãng quên và phản kháng trong lòng. Nhưng không phải mọi người đều theo: «ngoại trừ một nhóm trong số những người có đức tin» (34:20). Sự tồn tại của nhóm này bác bỏ việc chỉ lấy môi trường hư hỏng và thử thách khốc liệt làm cớ. Thử thách đã xảy ra, nhưng có người giữ đức tin, không chịu đi cùng số đông trong sự phủ ơn."}, {"id": "P068", "text": "Câu 21"}, {"id": "P069", "text": "«Và thật ra, Iblis không có một chút quyền hành nào đối với họ mà đó chỉ là để cho TA biết rõ ai là người tin tưởng nơi cõi đời sau so với ai trong họ là người hãy còn nghi ngờ về cõi đó; và Thượng Đế (Allah) của Ngươi là Đấng Giám Sát tất cả mọi điều.» (34:21)"}, {"id": "P070", "text": "Quyền của Shaytan không phải sức mạnh cưỡng bức con người phủ nhận và phạm tội. Hắn mời gọi, tô đẹp, dụ dỗ rồi gặp người chấp nhận. Điều ấy không lấy đi trách nhiệm của họ về lựa chọn. Có thể hình dung qua người hướng sự chú ý của người khác đến điều bị cấm: hắn không trói buộc để bắt nhìn, mà bày ra thứ người kia ham muốn; người đã sẵn lòng sẽ đáp lại.\n\nVì thế, khi mọi việc kết thúc, Shaytan nói: «Thật ra, ta chẳng có quyền lực gì đối với các ngươi ngoại trừ việc ta có thể mời gọi các ngươi và các ngươi đã đáp lại sự mời gọi của ta. Vì vậy, các ngươi đừng trách ta mà hãy tự trách chính mình.» (14:22). Họ nghe lời mời bất tuân rồi chấp nhận, trong khi cũng nghe lời gọi vâng phục nhưng quay lưng. Lời mời họ tự nguyện nhận không thành cái cớ xóa khác biệt giữa hai con đường.\n\nKhông có cưỡng bức không có nghĩa không có lời thì thầm và sức tô đẹp mạnh mẽ. Thiên Sứ ﷺ cho biết Shaytan lưu chuyển trong con người như máu lưu chuyển. (Al-Bukhari 3281.) Nhưng chính thử thách ấy làm lộ lòng xác tín về Đời Sau hoặc sự hoài nghi trong trái tim. Càng nhớ việc gặp Allah và kết quả của hành động, người bề tôi càng có sức chống điều bị tô đẹp. Nhớ ngôi mộ và chứng kiến nơi cuối cùng con người đến sẽ làm yếu sức ham muốn, khi trái tim giữ ảnh hưởng của lời nhắc còn sống động.\n\nĐiều này giống người lái xe liều lĩnh rồi gặp tai nạn khiến mình mệt mỏi và phải điều trị lâu. Họ trở lại với sự cẩn trọng cao, nhưng khi quên điều đã chịu thì quay về thói cũ. Vấn đề không phải lời nhắc chưa từng đến, mà là ảnh hưởng của nó mất dần khi sự quên lãng lấn át.\n\nAllah mô tả người đứng trước Ngài; toàn câu cho ngữ cảnh: «Phải chăng một người thức đêm dốc lòng cung kính (Allah), lúc thì phủ phục, lúc thì đứng thẳng, luôn luôn chú ý đến đời sau và hy vọng nơi Đức Khoan Dung của Thượng Đế của y (giống với một kẻ không có đức tin hay sao) Hãy bảo y: “Phải chăng một người (hiểu) biết và một người thiếu hiểu biết ngang bằng nhau?” Chắc chắn, chỉ những người thông hiểu mới ghi nhớ (lời khuyến cáo).» (39:9). Trong lời giảng, điểm được nhấn là nỗi dè sợ Đời Sau và niềm hy vọng vào lòng thương xót của Thượng Đế. Nỗi dè sợ ấy đi cùng người bề tôi trong lời nói, hành động. Trước khi làm, họ hỏi đến kết quả, vì không thấy đời này là cuối đường. Sự xác tín càng vững, họ càng xa việc theo Shaytan; khác với trái tim bị nghi vấn và ham muốn để trống nỗi sợ chịu xét xử."}, {"id": "P071", "text": "Câu 22"}, {"id": "P072", "text": "«Ngươi (hỡi Thiên Sứ) hãy nói với họ: “Các ngươi hãy cầu nguyện những kẻ mà các ngươi cho rằng (chúng là thần linh của các ngươi) ngoài Allah. Quả thật, chúng không hề nắm giữ và chi phối bất cứ vật gì trong các tầng trời và trái đất, cho dù đó chỉ là sức nặng của hạt nguyên tử; và chúng không hề có bất cứ phần chia nào trong trời đất này; và trong bọn chúng không hề có bất cứ tên nào là vị ủng hộ của Ngài cả.”» (34:22)"}, {"id": "P073", "text": "Sau khi hai câu chuyện cho thấy Allah định đoạt trong quyền sở hữu của Ngài, ban cho, điều khiển rồi thu lại từ người phủ ơn, lời thách thức được đưa đến người cầu những thần linh ngoài Ngài. Hãy xin chúng làm một việc trong những điều họ bám vào chúng để mong có. Có phải nhờ chúng mà sắt mềm cho Dawood, gió và Jinn phục vụ Sulayman, hoặc Saba’ nhận vườn rồi bị lấy mất?\n\nCâu Kinh lần lượt loại bỏ từng cơ sở bám víu vào các đối tượng ấy. Trước hết là sở hữu độc lập: chúng bị phủ nhận điều này dù chỉ một hạt nhỏ. Không một ngôi sao trên trời hay vật gì dưới đất chúng có thể tự mình định đoạt. Lập luận của Ibrahim là một dẫn chứng; toàn câu cho biết ngữ cảnh: «Ngươi (hỡi Thiên Sứ Muhammad) có thấy kẻ đã tranh luận với Ibrahim về Thượng Đế của Y, kẻ mà hắn đã được Allah ban cho vương quyền (vua Nimrud)? Khi Ibrahim nói: “Thượng Đế của tôi là Đấng làm cho sống và làm cho chết.” (Nimrud) bảo: “Ta cũng có thể làm cho sống và làm cho chết.”[1] Ibrahim nói: “Quả thật, Allah là Đấng làm cho mặt trời mọc lên ở hướng đông, vậy bệ hạ hãy làm cho nó mọc lên ở hướng tây xem nào.” Thế là kẻ vô đức tin đã bối rối (vì đuối lý). Quả thật, Allah không hướng dẫn đám người sai quấy.» (2:258).\n\nRồi câu phủ nhận việc chúng có phần cùng Allah trong quyền sở hữu trời đất. Một người có thể không sở hữu riêng nhưng lại có phần chung với người khác; khả năng ấy cũng được đóng lại. Tiếp theo là sự trợ giúp: «trong bọn chúng không hề có bất cứ tên nào là vị ủng hộ của Ngài cả» (34:22). Nghĩa là trong chúng không có ai Allah cần dựa vào để duy trì và điều hành quyền cai quản của Ngài. Từ chỉ người trợ giúp trong tiếng Ả Rập gợi người nâng đỡ, làm vững lưng cho người khác. Allah lo việc tạo vật mà không thiếu thốn, không cần một ai trong số chúng.\n\nNhư vậy, đối tượng được thờ không tự sở hữu, không cùng Allah sở hữu, cũng không giúp Ngài theo cách Ngài phải cần. Điều ấy bao gồm mọi đối tượng con người bám vào ngoài Allah, dù là bề tôi được Ngài tôn vinh như thiên thần hay ‘Isa. Địa vị cao quý của bề tôi không biến họ thành đối tác của Thượng Đế. Ba điều ấy bị phủ nhận đối với toàn thể tạo vật. Còn việc cầu thay sẽ được giải thích sau, nên đừng nhầm điều bị phủ nhận tuyệt đối với điều chỉ xảy ra khi được cho phép.\n\nKhi ý nghĩa ấy vững trong lòng, trái tim quy tụ về Allah, không bị xé ra bởi đòi hỏi của những kẻ nó tưởng đang nắm việc mình. Lời tưởng nhớ buổi sáng được lời giảng nhắc đến là: «Chúng ta đã bước sang buổi sáng, và vương quyền vẫn thuộc về Allah. Mọi lời ca ngợi đều thuộc về Allah.» (Ibn Mas‘ud; Muslim 2723; diễn nghĩa). Lời ca ngợi đi cùng việc xác nhận quyền sở hữu phù hợp với sự an lòng rằng mọi việc đều thuộc về một Thượng Đế.\n\nQur’an đưa ý nghĩa này đến gần qua hình ảnh: «Allah đưa ra hình ảnh thí dụ, một người phục vụ cho nhiều ông chủ gồm những kẻ hợp tác nhưng hay tranh chấp nhau, còn một người chỉ phục vụ cho một ông chủ duy nhất, hai người này có ngang bằng nhau không?» (39:29). Người bị nhiều chủ bất đồng tranh giành không giống người chỉ hướng về một chủ. Cũng vậy, khi biết quyền sở hữu chỉ thuộc Allah, trái tim không xem tiền bạc và trang bị dồi dào của những người chống đối là quyền lực cao hơn quyền lực Ngài."}, {"id": "P074", "text": "Câu 23"}, {"id": "P075", "text": "«Ở nơi Ngài (Allah), việc can thiệp sẽ vô ích trừ phi đối với ai mà Ngài đã cho phép. (Sự vĩ đại và tối cao của Ngài là khi Ngài phán thì tất cả các Thiên Thần đều khúm núm sợ hãi) mãi đến khi lòng của họ hết sợ thì họ mới dám lên tiếng hỏi (đại Thiên Thần Jibril): “Thượng Đế của quý vị phán điều gì vậy?” (Jibril) đáp: “Ngài phán điều Chân Lý bởi vì Ngài là Đấng Tối Cao, Vĩ Đại.”» (34:23)"}, {"id": "P076", "text": "Sau khi quyền sở hữu, phần chung và sự trợ giúp bị phủ nhận, người đa thần có thể còn bám vào hy vọng có trung gian. Câu Kinh làm rõ rằng ngay việc cầu thay cũng không hoạt động độc lập với Allah: «Ở nơi Ngài (Allah), việc can thiệp sẽ vô ích trừ phi đối với ai mà Ngài đã cho phép.» (34:23). Việc cầu thay không bị phủ nhận tuyệt đối như ba điều trước, mà hiệu quả được ràng buộc với sự cho phép của Ngài. Không người cầu thay nào áp đặt được điều gì lên Ngài.\n\nCó cách hiểu sự cho phép là dành cho người cầu thay để họ cầu thay; cũng có cách hiểu dành cho người được cầu thay để việc ấy diễn ra cho họ. Trong cả hai trường hợp, lời khẳng định rằng chỉ cần bám vào một đối tượng thờ phụng là chắc chắn có trung gian với Allah đều mất cơ sở. Thiên thần, các vị Nabi và người có đức tin được phép cầu thay vẫn là những bề tôi quy phục, không có quyền lực cùng Ngài.\n\nMột cách giải thích phần tiếp là những người chờ được cho phép ở trong sợ hãi, kính sợ. Khi sự cho phép được ban, nỗi kinh sợ trong lòng được cất đi và họ hỏi Thượng Đế đã phán gì. Điều này được hiểu về những người cầu thay, cũng được hiểu về những người hy vọng được cho phép cầu thay cho mình. Ngay địa vị cao quý ấy cũng được mở đầu bằng việc chờ sự cho phép và kính sợ Allah.\n\nLời «lòng của họ hết sợ» (34:23) có nghĩa nỗi kinh sợ được loại bỏ. Trong tiếng Ả Rập, có trường hợp dạng động từ đọc đôi phụ âm mang nghĩa loại bỏ điều nào đó, như từ chỉ việc chăm sóc, điều trị người bệnh để bệnh hết đi.\n\nCũng có cách hiểu cảnh này liên quan đến những người đa thần theo Iblis. Họ tiếp tục theo hắn cho đến khi chết, rồi điều từng bị lãng quên lộ ra. Khi ấy họ hỏi Allah đã phán gì để vâng theo, nhưng thời gian hành động đã hết. Theo cách hiểu này, mốc cuối được nối với việc theo Iblis đã nêu trước trong chương.\n\nMột trong những cách hiểu nổi bật là cảnh thiên thần khi Allah quyết định một việc trên trời. Hadith kể họ đập cánh quy phục lời Ngài; một âm thanh được nghe như tiếng kéo dây xích trên đá nhẵn. Khi nỗi kinh sợ được cất khỏi lòng, họ hỏi Thượng Đế đã phán gì và được đáp rằng đó là chân lý. (Al-Bukhari 4800.) Sự vĩ đại khiến bầu trời đầy kính sợ không thuộc một thần linh ngoài Allah, mà thuộc Đấng phán mặc khải và định đoạt. Lời đáp «điều Chân Lý» (34:23) mô tả lời Ngài là chân lý, không có điều sai, như khi nói một phán quyết theo lẽ thật.\n\nÝ nghĩa thiên thần quy phục càng rõ trong bản thuật rằng trong đêm thăng thiên, Jibril được thấy như một tấm vải cũ mòn vì kính sợ Allah. (At-Tabarani, Al-Mu‘jam al-Awsat 4679; Al-Suyuti đánh giá chuỗi truyền được dẫn ở đây là xác thực.) Đó chính là Jibril mà sự to lớn được mô tả qua sáu trăm cánh. (Al-Bukhari 3232.) Địa vị cao và hình hài lớn không loại bỏ sự trọn vẹn trong vai trò bề tôi.\n\nCảnh ấy nối rõ với điều trước. Allah duy nhất sở hữu, ban cho, thu lại; mặc khải khiến thiên thần quy phục cũng thuộc về Ngài. Những thần linh được gán ghép đã đem mặc khải nào đến mà được dành một phần thờ phượng? Ngay Musaylimah khi giả xưng làm Nabi cũng gán lời tuyên bố dối trá của mình cho Allah, không lấy nó làm bằng chứng về một Thượng Đế khác ban mặc khải.\n\nTừ đó, lời nhắc hướng xuống mặt đất. Nếu thiên thần quy phục lời Allah, người nghe mặc khải càng nên hỏi ý Ngài để tuân theo, thay vì chống lại bằng ý riêng hoặc lời bất cứ ai. Ibn ‘Abbas đã phản đối việc đem lời Abu Bakr và ‘Umar đối lại bản thuật từ Thiên Sứ ﷺ, lo cho hậu quả của việc đặt lời người khác trước Sunnah của Người. (Al-Khatib, Al-Faqih wa al-Mutafaqqih 1/377–378.) Điều ấy không hạ thấp hai ông, mà đề cao nguồn hai ông vốn đi theo.\n\nUmm Ayman nhận biết giá trị của mặc khải. Bà đau buồn vì việc ban mặc khải mới từ trời đã chấm dứt. Khi giải thích vì sao mình khóc, bà nói: «nhưng tôi khóc vì Lời Mặc khải (được truyền xuống) đến từ Allah đã không còn nữa.» (Muslim 2454). Abu Bakr và ‘Umar khóc cùng bà. Những trái tim hiểu địa vị ấy không đón nhận lời Allah như một lời thoáng qua."}, {"id": "P077", "text": "Câu 24"}, {"id": "P078", "text": "«Hãy bảo họ “Ai cung cấp bổng lộc cho các người từ các tầng trời xuống dưới đất?” Hãy bảo họ: “Allah!” \"(Giữa chúng ta), chúng tôi hay quí vị sẽ là người công khai đi đúng đường hay lạc đường.”» (34:24)"}, {"id": "P079", "text": "Sau các câu chuyện và dẫn chứng, mệnh lệnh “Hãy nói” tiếp nối, đưa lời đến việc truyền đạt và lập luận trực tiếp. Câu hỏi hướng vào nhu cầu người nghe không thể thiếu: ai mang bổng lộc đến? Mưa trên trời và cây dưới đất không thuộc quyền những thần linh họ cầu. Đấng ban ân huệ cho Dawood và Sulayman, ban sự sung túc cho dân Saba’ rồi thu lại sự sung túc ấy từ dân Saba’, cũng chính là Đấng đang nuôi dưỡng người nghe lúc này.\n\nLời đáp được xác nhận: «Allah!» (34:24). Nhu cầu được đưa về đúng Đấng đáp ứng, cũng như câu hỏi: «Hãy bảo chúng: “Các người có xét thấy chăng? Nếu vào một buổi sáng nào đó mạch nước của các người rút mất tiêu (xuống lòng đất) thì ai sẽ mang nước mạch trong vắt đến tiếp liệu cho các người?”» (67:30). Sự thật ấy có thể hiện rõ khi người bị cảnh dư dả che khuất gặp bệnh, sợ hãi hoặc cận kề cái chết. Biển động chẳng hạn làm rơi khỏi trái tim nhiều ảo tưởng họ vẫn dựa vào trên đất liền.\n\nTrong câu chuyện ‘Ikrimah ibn Abi Jahl, ông bỏ chạy bằng đường biển rồi gặp bão. Người trên thuyền nói các thần linh không giúp gì được; họ phải chân thành hướng lời cầu xin về Allah. ‘Ikrimah hiểu rằng được cứu trên đất liền cũng như trên biển đều chỉ nhờ chân thành cầu xin Ngài. Ông quyết nếu được Allah cứu sẽ trở về với Thiên Sứ ﷺ; rồi ông trở lại và vào Islam. (An-Nasa’i 4067.) Không có một Thượng Đế của biển khác với Thượng Đế của đất liền; chính sự lãng quên được lúc khốn khó làm lộ ra.\n\nSau những lập luận ấy là cách đối thoại nhẹ nhàng: «(Giữa chúng ta), chúng tôi hay quí vị sẽ là người công khai đi đúng đường hay lạc đường.”» (34:24). Đây không phải Thiên Sứ nghi ngờ chân lý mình mang đến, mà là hạ cách diễn đạt xuống để mời đối phương nhìn hai con đường, không khởi đầu bằng chọc giận họ. Khẳng định một Thượng Đế và khẳng định nhiều thần linh không thể cùng đúng. Việc gán cho những đối tượng ấy khả năng ban bổng lộc và cầu thay không cần phép trái với bằng chứng đã nêu về sự bất lực của chúng. Cũng vậy, cáo buộc Thiên Sứ chia rẽ cha con không xóa đi việc họ đang thờ ngoài Allah. Một trong hai đường phải là hướng dẫn, đường kia là lầm lạc.\n\nTrong cách diễn đạt nguyên bản về «đi đúng đường» (34:24) còn có hình ảnh đứng vững trên sự hướng dẫn. Ở đây có một nguyên tắc hữu ích khi kêu gọi: ưu tiên giúp người khác được hướng dẫn hơn làm họ tổn thương. Một người có thể chế nhạo đối phương nhưng qua đó đánh mất cơ hội mở trái tim họ để suy xét. Nhẹ nhàng không có nghĩa bỏ việc làm rõ; cách nói này đến sau nhiều lập luận, câu chuyện và chi tiết.\n\nKhi đặc tính đúng và sai được làm rõ bằng Qur’an, mọi người nhận ra hai đường, dù không phải lúc nào cũng cần nêu tên từng cá nhân: «TA trình bày rõ các Lời Mặc Khải (của TA) như thế đó và để con đường của những kẻ tội lỗi trở nên rõ ràng.» (6:55). Trong thời yếu thế, có cơ hội trình bày và đối thoại là một mục đích lớn. Câu chuyện những người trong hang cho thấy nỗi sợ có thể ngăn người có đức tin bày tỏ niềm tin. Còn chuyện hai vườn cho thấy vẫn có không gian tranh luận: «Người bạn của y tranh luận với y, nói: “Phải chăng anh đã không có đức tin nơi Đấng đã tạo hóa ra anh từ đất bụi rồi từ tinh dịch rồi sau đó Ngài đã làm cho anh thành một người đàn ông hoàn chỉnh?!”» (18:37). Có người chịu nghe lập luận và cho trình bày là mở một cánh cửa hành động, dù người kêu gọi chưa thể thay đổi toàn bộ thực tế. Vì vậy, họ vừa giữ chân lý sáng rõ vừa lựa lời nói tốt đẹp."}, {"id": "P080", "text": "Câu 25"}, {"id": "P081", "text": "«Ngươi hãy nói với họ: “Các người sẽ không bị tra hỏi về tội của chúng tôi và chúng tôi cũng sẽ không bị tra hỏi về những gì các người đã làm.”» (34:25)"}, {"id": "P082", "text": "Lời nói càng nhẹ nhàng đến mức dùng cách diễn đạt khác với điều người nghe có thể chờ: «tội của chúng tôi» (34:25) ở phía Thiên Sứ và người có đức tin, còn «những gì các người đã làm» (34:25) ở phía đối thủ.\n\nĐiều ấy không thừa nhận đức tin là tội ác, mà thuận theo cáo buộc của họ để lập luận: giả sử theo điều các người đang gán cho chúng tôi, các người không gánh hậu quả việc chúng tôi làm, và chúng tôi cũng không gánh hậu quả việc các người làm. Vậy tại sao cản chúng tôi trình bày điều mình tin?\n\nCâu không dùng từ chỉ việc họ phạm tội để mô tả hành động của họ, dù sự thờ đa thần đã rõ. Mục đích là giữ cánh cửa suy xét và hướng dẫn, không chỉ kiếm một câu thắng đối phương rồi rời đi. Người tha thiết muốn người khác được hướng dẫn có thể nói với kẻ cáo buộc mình: hãy xem điều được nói, dù phán đoán về tôi vẫn chưa đổi; anh có trách nhiệm của anh, tôi có trách nhiệm của tôi, và phán quyết phân xử giữa chúng ta sẽ đến.\n\nCâu này nối với câu trước: hai con đường đã được xác định không thể cùng đúng. Sau đó, việc tách trách nhiệm trở thành lập luận trước hành động ngăn cản lời kêu gọi và bịt miệng người truyền đạt; làm vậy không khiến trách nhiệm trước Allah biến mất. Đây là cách nói người có đức tin cần khi đường truyền đạt bị thu hẹp: giữ vững thông điệp và vẫn tha thiết để đối thoại còn có thể tiếp tục."}, {"id": "P083", "text": "Câu 26"}, {"id": "P084", "text": "«Ngươi hãy nói với họ: “Thượng Đế của chúng ta sẽ triệu tập tất cả chúng ta rồi Ngài sẽ phán xét giữa chúng ta đúng theo chân lý bởi Ngài là Đấng Thẩm Phán Toàn Tri.”» (34:26)"}, {"id": "P085", "text": "Sau khi tách trách nhiệm hai phía, câu nhắc họ về nơi trở về không ai ngăn được: Allah sẽ tập hợp tất cả rồi phân xử theo chân lý. Lời «Ngài sẽ phán xét giữa chúng ta» (34:26) mang nghĩa phán quyết. Từ ngữ nguyên bản còn gợi việc mở điều bị đóng.\n\nCuộc tranh luận có thể đi đến những người không muốn nghe, lại nắm tiền của, trang bị và khả năng chèn ép. Đừng để con đường có vẻ khép kín khiến người có đức tin tưởng chân lý không có phán quyết bênh vực. Quyền phân xử ở nơi Allah; toàn câu khẳng định: «Ngươi hãy nói với họ: “Thượng Đế của chúng ta sẽ triệu tập tất cả chúng ta rồi Ngài sẽ phán xét giữa chúng ta đúng theo chân lý bởi Ngài là Đấng Thẩm Phán Toàn Tri.”» (34:26). Ngài biết hoàn cảnh, ý định và điều mỗi bên xứng đáng nhận. Phán quyết của Ngài không có thiếu hiểu biết hoặc bất công. Thẩm phán con người có thể xét xử trong cơn giận ảnh hưởng đến cái nhìn; còn sự phân xử của Allah đi cùng tri thức bao trùm. Không quyền lợi nào người khác không thấy lại bị mất ở nơi Ngài.\n\nSuy ngẫm điều ấy làm người ta hy vọng hơn vào sự mở lối của Allah khi các lối kêu gọi bị đóng, phương tiện sức mạnh và phát ngôn bị độc chiếm, còn người có lẽ phải không đến được điều mình mong. Những ý nghĩa ấy nuôi dưỡng người lo việc hướng dẫn mọi người: nối nỗ lực yếu ớt của họ với Thượng Đế biết cả sự cống hiến lẫn điều cản trở.\n\nMột dẫn chứng về sự quan tâm chân thật đến trách nhiệm tôn giáo là lời Thiên Sứ ﷺ: «Ai chết đi mà chưa từng chinh chiến cũng như chưa từng nói với bản thân về việc chinh chiến thì người đó đã chết trên một phần của Nifaq (giả tạo đức tin).» (Muslim 1910). Trong bản Muslim còn có ý kiến riêng của Ibn al-Mubarak cho rằng lời ấy liên quan đến thời Thiên Sứ ﷺ; đó là ý kiến của ông, không phải một phần lời Thiên Sứ. Hadith nói về việc tham gia chiến đấu. Điều lời giảng rút ra trong bối cảnh này là ý muốn giúp tôn giáo không chỉ là cảm xúc thoáng qua tách khỏi sự sẵn lòng cống hiến. Khi mối quan tâm ấy chân thật, tên gọi «Đấng Thẩm Phán» (34:26) trong bản dịch câu 34:26 nuôi dưỡng niềm hy vọng và kiên nhẫn của người bề tôi. Sự mở lối được lời giảng liên hệ với ý nghĩa từ ngữ tiếng Ả Rập; đó là phần suy ngẫm được nêu bên cạnh tên gọi trong bản dịch."}, {"id": "P086", "text": "Câu 27"}, {"id": "P087", "text": "«Ngươi hãy nói với họ: “Các người hãy chỉ cho Ta đâu là những kẻ mà các người đã cho là những vị đối tác ngang vai của (Allah). Chắc chắn sẽ không có ai (là đối tác của Ngài cả) mà chỉ có Ngài là Allah (Đấng Duy Nhất), Ngài là Đấng Toàn Năng, Sáng Suốt.”» (34:27)"}, {"id": "P088", "text": "Lập luận kết bằng yêu cầu phơi bày gốc rễ của lời gán đối tác cho Allah: hãy cho thấy những đối tượng họ làm thành đối tác, và chứng minh chúng có địa vị ấy. Những việc Allah làm, quyền sở hữu và sự điều hành của Ngài đã hiện rõ qua các câu Kinh. Vậy các đối tượng họ ghép vào có hành động nào tương xứng?\n\nMột câu tương tự nêu vấn đề trong toàn bộ ngữ cảnh của nó: «Vậy Đấng (cung dưỡng cho vạn vật và) giám sát từng linh hồn về những gì nó làm (lại không đáng được thờ phượng hơn những thần linh bục tượng) ư? Tuy nhiên, (những kẻ vô đức tin) đã dựng lên những đối tác ngang vai với Allah. Ngươi (Thiên Sứ Muhammad) hãy nói với chúng: “Các ngươi hãy kể ra xem tên các thần linh mà các ngươi dựng lên cùng với Allah! Hay có phải các ngươi muốn cho Ngài biết về điều gì đó mà Ngài không biết trên trái đất này? Hoặc phải chăng các ngươi chỉ tùy tiện thốt ra những lời sáo rỗng?” Không, kế hoạch của những kẻ vô đức tin có vẻ đã thu hút chúng và chúng đã bị ngăn cản đến với con đường (chính đạo). Quả thật, ai mà Allah làm cho trệch hướng thì chắc chắn sẽ không có người hướng dẫn.» (13:33). Chính Ngài ban cho mỗi sinh linh điều nuôi sống nó, biết việc nó làm và điều nó che giấu, định thời hạn sống của nó. Thế mà con người gán cho Ngài đối tác không tự làm được việc nào trong số ấy ngoài Ngài.\n\nMục đích không chỉ đưa ra tên hoặc hình của những đối tượng được thờ, mà cho thấy việc ghép chúng cùng Allah trong quyền xứng đáng được thờ là vô căn cứ. Sự bác bỏ nằm trong toàn câu: «Ngươi hãy nói với họ: “Các người hãy chỉ cho Ta đâu là những kẻ mà các người đã cho là những vị đối tác ngang vai của (Allah). Chắc chắn sẽ không có ai (là đối tác của Ngài cả) mà chỉ có Ngài là Allah (Đấng Duy Nhất), Ngài là Đấng Toàn Năng, Sáng Suốt.”» (34:27); rồi là lời xác nhận rõ: «mà chỉ có Ngài là Allah (Đấng Duy Nhất), Ngài là Đấng Toàn Năng, Sáng Suốt» (34:27). Con người gán thêm bao nhiêu đối tác cũng không thay đổi sự thật; lời khẳng định của họ không ban cho chúng một thuộc tính nào của Thượng Đế Chân Thật."}, {"id": "P089", "text": "Câu 28"}, {"id": "P090", "text": "«Và TA (Allah) cử phái Ngươi (hỡi Thiên Sứ) đến chỉ để làm một Người mang tin mừng và một Người cảnh báo cho toàn bộ nhân loại nhưng đa số nhân loại không biết.» (34:28)"}, {"id": "P091", "text": "Sứ mạng Thiên Sứ ﷺ không phụ thuộc vào sự đáp lại của nhóm Quraish Người tranh luận. Nó dành cho toàn thể con người; khi một dân tộc quay lưng, Allah chuẩn bị người khác gánh vác. Điều này gần với lời: «Nếu các ngươi quay lưng thì Ngài sẽ đưa một đám người khác đến thay thế các ngươi và họ sẽ không giống như các ngươi.» (47:38). Allah đã chuẩn bị tại Madinah những người tin và giúp sứ mạng sau sự ngoan cố của những kẻ phủ nhận ở Makkah. Con người cần lời kêu gọi hướng dẫn mình; quay lưng không khiến ai hết cần sự hướng dẫn ấy.\n\nLời «một Người mang tin mừng và một Người cảnh báo» (34:28) xác định nhiệm vụ được giao cho Sứ Giả: đem tin mừng đến người đáp lại và cảnh báo người quay lưng. Người không được giao làm cho lời kêu gọi chạy theo mọi đề xuất của kẻ cố tình làm khó. Họ đòi dấu lạ như Musa, đòi Kinh Sách từ trời xuống, và dân Makkah đòi biến đồi Safa thành vàng. (Ahmad 2333; Al-Hakim 3379 có một đường truyền cùng nội dung mà ông đánh giá chuỗi truyền là xác thực.) Đánh giá ấy thuộc về đường truyền của Al-Hakim, không tự động chuyển sang mọi bản của Ahmad.\n\nNếu người kêu gọi chạy theo từng đề xuất, từ một đường hầm trong đất đến một chiếc thang lên trời, yêu cầu của người không muốn đáp lại sẽ không dứt. Điều đang được nói không phủ nhận các dấu lạ Allah đã dùng để trợ giúp Thiên Sứ, mà làm rõ sự chân thật của Người không phụ thuộc vào việc làm vừa những đòi hỏi liên tục đổi khi đã được trả lời. Kẻ cố chấp có thể đáp mỗi câu trả lời bằng một yêu cầu khác, đến mức người kêu gọi tiêu cả đời đuổi theo phản đối và quên nền tảng truyền đạt.\n\nHọ từng nói: «Tại sao Y không được ban cho điều giống như điều đã được ban cho Musa?» (28:48); rồi lập trường của họ bị lời sau phơi bày: «Chúng tôi sẽ không bao giờ tin nơi Qur'an này và cũng không tin nơi điều (Kinh Sách) nào trước nó.» (34:31). Không phải hình thức dấu lạ khác nhau đã ngăn họ tin. Hiểu việc báo tin mừng và cảnh báo giúp người kêu gọi biết bổn phận là trình bày mặc khải rõ ràng. Qur’an, bằng chứng đã được mang đến, không là thứ sửa đổi để chiều ý đối thủ. Nhiệm vụ ấy giữ hướng đi cho lời kêu gọi cùng với phạm vi sứ mạng dành cho toàn thể con người."}, {"id": "P092", "text": "Câu 29"}, {"id": "P093", "text": "«(Những kẻ thờ đa thần hối thúc sự trừng phạt) bảo: “Lời hứa (về sự trừng phạt) này bao giờ sẽ xảy đến nếu các ngươi nói thật?”» (34:29)"}, {"id": "P094", "text": "Sau khi nói về Đấng Ban Bổng Lộc chân thật, sự vô căn cứ của việc thờ đa thần và phạm vi sứ mạng, lời phản đối trở lại thời điểm xét xử. Câu hỏi về lời hứa phơi bày điều nằm phía sau nhiều cuộc tranh luận ấy. Họ không chỉ muốn hiểu rõ hơn, mà ghét việc hành động của mình sẽ dẫn đến xét xử buộc họ phải thay đổi.\n\nChương Al-Qiyamah nêu sự phản đối việc phục sinh rồi vạch động cơ: «Có phải con người cho rằng TA sẽ không bao giờ tập hợp được xương cốt của y lại?» (75:3); «Không (như chúng nghĩ). TA toàn năng sắp xếp lại một cách hoàn hảo từng đầu ngón tay của y.» (75:4); «Không! Con người (phủ nhận sự Phục Sinh) vì muốn tiếp tục phạm tội ở phía trước.» (75:5); «Y hỏi: “Khi nào Ngày Phục Sinh sẽ đến?”» (75:6). Lời bắt đầu bằng việc cho là không thể tập hợp xương, rồi làm rõ ý muốn tiếp tục phạm tội phía sau câu hỏi về Ngày Phục Sinh. Người từ chối có thể lấy một nghi vấn về Kinh Sách hoặc khả năng sống lại làm màn che cho ý muốn giữ điều mình ham. Khi lập luận trả lời được, họ chuyển sang phản đối khác, vì điều họ muốn tránh chính là thừa nhận sự xét xử.\n\nMột cách áp dụng là người viện cớ giáo luật cũ hoặc không phù hợp để né việc thuận theo từ gốc. Vấn đề không chỉ là một câu có thể giải thích, mà là ý chí chấp nhận hay từ chối trách nhiệm. Đặt trong mạch của chương, câu hỏi ấy cho thấy họ vẫn quay lưng và phủ nhận dù sự việc đã được giải thích rõ. Họ không chịu sống theo sự hướng dẫn của mặc khải, nên mới hỏi khi nào lời hứa sẽ thành hiện thực. Đến ngày ấy, họ sẽ phải chịu trách nhiệm về những việc mình làm.\n\nChính ngữ cảnh cho thấy động cơ của họ. Cần phân biệt thái độ ấy với câu hỏi của người thật lòng muốn hiểu. Ta không thể gán cho người ấy ý muốn phủ nhận."}, {"id": "P095", "text": "Câu 30"}, {"id": "P096", "text": "«Ngươi (hỡi Thiên Sứ) hãy nói với họ: “Cuộc hẹn cho các người đã được định sẵn vào Ngày mà nó sẽ không đến muộn cũng không đến sớm hơn một thời khắc nào.”» (34:30)"}, {"id": "P097", "text": "Lời đáp xác định họ có một thời hẹn không thể đẩy sớm hay kéo muộn. Lời hứa thành hiện thực không chạy theo việc họ giục; khi đến thời hẹn, họ cũng không xin thêm được thời gian.\n\nSau những điều đã được làm rõ, lời không chỉ lặp lại tranh luận về sự tồn tại của Ngày Phục Sinh, mà chuyển đến điều sẽ xảy ra với họ trong ngày ấy. Ngày đến đúng hẹn, rồi mỗi người đứng trước hậu quả lựa chọn. Có thể hình dung người cứ khăng khăng không có kỳ thi nào chờ mình, rồi được trả lời về điều sẽ gặp trong ngày thi và kết cục của việc không chuẩn bị. Người trả lời không thuận theo sự phủ nhận, mà đưa lời nói trừu tượng sang hậu quả thực tế.\n\nBởi thế, sau khi xác định thời hẹn, chương đưa ra cảnh những kẻ bất công bị giữ trước Thượng Đế và đổ lỗi cho nhau. Điều họ coi nhẹ khi đang yên ổn ở đời này sẽ thành tình cảnh không thể vượt qua. Điều họ đòi đến nhanh cũng không đẩy lùi được khi nó tới. Khi điều ấy vững trong lòng, câu hỏi có ích trở thành chuẩn bị thế nào cho điều đang đến, sau khi đã rõ toàn bộ thời hẹn thuộc về Allah."}, {"id": "P098", "text": "Câu 31"}, {"id": "P099", "text": "«Và những kẻ không có đức tin bảo: “Chúng tôi sẽ không bao giờ tin nơi Qur'an này và cũng không tin nơi điều (Kinh Sách) nào trước nó.” Giá Ngươi (Muhammad) có thể nhìn thấy được tình cảnh của những kẻ làm điều sai quấy bị bắt đứng trước mặt Thượng Đế của chúng, chúng lời qua tiếng lại trách móc lẫn nhau. Những kẻ tự cho mình yếu thế sẽ bảo những tên cường bạo: “Nếu không vì nể nang quí ngài thì chúng tôi đã trở thành người tin tưởng rồi!”» (34:31)"}, {"id": "P100", "text": "Những kẻ phủ nhận làm rõ lập trường từ gốc khi tuyên bố không tin Qur’an hay các Kinh Sách trước Nó. Trước đó, họ đòi: «Ngươi (hỡi Muhammad) hãy mang đến cho bọn ta một quyển Qur’an khác quyển này hoặc hãy thay đổi nó đi!» (10:15). Họ muốn một lời không buộc mình chấp nhận sự duy nhất của Allah và việc chịu xét xử. Lời đáp là: «Ta không thể thay đổi Nó theo ý mình. Ta chỉ làm theo những gì đã được mặc khải cho Ta.» (10:15). Sứ Giả là bề tôi được giao truyền đạt, không có quyền tự lập một tôn giáo chiều ham muốn mọi người. Khi không được thay đổi, việc đòi một Kinh Sách như Musa nhận bộc lộ không phải sự sẵn sàng đón mặc khải. Cuối cùng, họ từ chối cả Qur’an lẫn các Kinh Sách trước Nó.\n\nCó cách hiểu những người nói ở đây là giới quyền thế kiêu ngạo. Điều ấy nối với nỗ lực công kích các dấu hiệu của Allah đã nêu và lời tự hào nhiều tiền, đông con sẽ đến sau. Đối thủ có thể sở hữu tiền của, trang bị nhưng vẫn sợ một người không có những thứ tương đương, vì biết ảnh hưởng của Qur’an người ấy mang. Bởi vậy, họ dồn công cắt mối liên hệ giữa con người và nguồn hướng dẫn.\n\nMột hình thức là làm yếu mối liên hệ với tiếng Ả Rập, để người ta nghe Qur’an mà không hiểu. Khoảng cách rộng dần đến mức lời văn và lời giải thích đều khó tiếp cận. Một hình thức khác là đẩy việc hiểu Qur’an ra bên lề giáo dục: một người có thể đạt trình độ cao trong các lĩnh vực học vấn thế tục nhưng không đọc tốt Al-Fatihah. Vấn đề ở trường hợp đang nói không phải không thể học, vì họ đã chứng tỏ khả năng học điều mình quan tâm, mà là quay lưng với tri thức cần cho tôn giáo.\n\nCó mối liên hệ đúng với Qur’an đem lại thước đo cho những nghi vấn được đưa đến. Con người biết một lời có trái mặc khải hay không, không dễ tin chỉ vì người nói nổi tiếng hoặc có diễn đàn mạnh. Trong những câu làm thước đo có: «Những ai không phân xử theo những gì được Allah ban xuống thì họ là những kẻ vô đức tin.» (5:44); «người nào không phân xử theo những gì mà Allah ban xuống thì những người đó là những kẻ sai quấy.» (5:45). Câu tiếp theo, trong toàn bộ ngữ cảnh của nó, cũng nêu việc phân xử theo điều Allah ban: «Và hãy để người dân của Kinh Injil xét xử theo điều (mặc khải) mà Allah đã ban xuống. Và ai không xét xử theo điều mà Allah đã ban xuống thì là những kẻ dấy loạn.» (5:47). Và có lời: «Những người Do Thái và những người Thiên Chúa sẽ không bao giờ bằng lòng với Ngươi (Muhammad) ngoại trừ Ngươi chịu theo tôn giáo của họ.» (2:120). Trở về điều Allah ban giữ các nền tảng rõ ràng, không lấy sự hài lòng của mọi người thay cho lẽ phải. Người muốn kéo cộng đồng khỏi sự hướng dẫn tìm cách đưa họ xa Kinh Sách không bị đổi thay.\n\nNgữ cảnh chuyển từ giọng kẻ kiêu ngạo tuyên bố «Chúng tôi sẽ không bao giờ tin» (34:31) sang tình trạng hắn khi đứng trước Thượng Đế: «Giá Ngươi (Muhammad) có thể nhìn thấy được tình cảnh của những kẻ làm điều sai quấy bị bắt đứng trước mặt Thượng Đế của chúng» (34:31). Trong nguyên bản tiếng Ả Rập, câu điều kiện để phần kết không nói ra, cho trái tim hình dung sự kinh khủng: nếu thấy, sẽ thấy một việc ghê gớm. Kẻ từng chặn người khác, chèn ép và ngăn người có đức tin thờ phượng giờ trở thành người bị giữ lại để chịu hỏi: «Nhưng các ngươi hãy bắt chúng dừng lại bởi chúng còn phải bị tra hỏi.» (37:24).\n\nĐây là sự an lòng cho người bị hại. Việc họ không đủ sức đẩy lùi không mất đi, và kẻ bạo ngược không còn nắm quyền khi Allah tập hợp tạo vật. Những kẻ bất công trong cảnh này gồm cả người kiêu ngạo và người tự chọn theo họ. Người trước bất công với người khác; người theo bất công với chính mình khi chấp nhận vâng theo điều sai.\n\nĐối thoại giữa thủ lĩnh và người theo được lặp lại trong Qur’an, vì có người có khả năng dẫn dắt và có người chọn đi theo. Người dẫn dắt có thể dùng khả năng để hướng dẫn hoặc dẫn lạc. Về Pha-ra-ông và những kẻ đi cùng, Allah phán: «TA đã làm cho bọn họ thành những tên cầm đầu trong việc kêu gọi người ta đi vào Hỏa Ngục» (28:41). Một nhóm nhỏ có thể điều khiển đám đông bằng tiền và diễn đàn, hướng họ theo ý muốn; theo họ không bỏ được bổn phận suy xét của mỗi người.\n\nTrong chương Al-Baqarah, đặc tính đi theo được làm nổi bật: «(Bởi vì) khi đối diện với hình phạt, những kẻ được tuân theo sẽ (tuyên bố) vô can đối với những kẻ phục tùng chúng và mọi quan hệ giữa đôi bên sẽ bị cắt đứt hết.» (2:166). Cái nhìn được hướng đến nguy cơ bắt chước thay cho bằng chứng. Còn ở đây, các đặc tính kiêu ngạo và yếu thế được lặp lại, cho thấy mối liên hệ giữa quyền lực, tiền của của người được theo với sự khuất phục trước họ.\n\nLời «chúng lời qua tiếng lại trách móc lẫn nhau.» (34:31) vẽ cảnh trao nhau lời buộc tội. Mối liên hệ lợi ích từng tập hợp họ đã thành thù địch. Tương tự lời Ibrahim: «Các người đã thờ cúng những bục tượng thay vì Allah chẳng qua là vì các người yêu thương lẫn nhau ở đời này; rồi vào Ngày Phán Xét, các người sẽ phủ nhận và nguyền rủa lẫn nhau» (29:25). Trước kia, họ hợp sức vì lợi ích; người theo gây tổn hại lẽ phải và người giữ nó, hoặc truyền bá nghi vấn để lấy tiền. Rồi sau thời gian dài im lặng, giờ được nói đã đến, nhưng thời gian hành động không còn.\n\nKiêu ngạo là muốn cao hơn mọi người; nó được nuôi bằng sự khuất phục của người chấp nhận bị dẫn đi. Những người yếu thế trong cảnh này đã chấp nhận để người khác xem mình như kẻ không biết nói không với điều sai, không phải bị tước hết khả năng lựa chọn. Cái nhìn của cả hai phía đều lệch: người kiêu ngạo thấy mình trên mọi người, còn người theo thấy mình quá thấp để xem xét hoặc phản đối.\n\nSự xấu xí của thái độ kiêu ngạo được đưa đến gần qua lời cấm: «Con chớ vênh mặt trước mọi người» (31:18). Việc ngoảnh mặt kiêu ngạo được ví với tình trạng làm cổ lạc đà nghiêng lệch. Hình ảnh kẻ kiêu ngạo tưởng đang tô đẹp mình lại biểu hiện một khiếm khuyết. Ở phía kia là quen im lặng trước bất công đến mức không còn phản đối trong lòng. Thấy người yếu bị hại hoặc thấy trộm cắp, họ đi qua như không liên quan; kẻ bất công càng liều khi gặp sự chấp nhận và im lặng.\n\nLời những người theo phơi bày mức độ uy thế của thủ lĩnh đã ăn sâu trong họ; toàn câu cho ngữ cảnh: «Và những kẻ không có đức tin bảo: “Chúng tôi sẽ không bao giờ tin nơi Qur'an này và cũng không tin nơi điều (Kinh Sách) nào trước nó.” Giá Ngươi (Muhammad) có thể nhìn thấy được tình cảnh của những kẻ làm điều sai quấy bị bắt đứng trước mặt Thượng Đế của chúng, chúng lời qua tiếng lại trách móc lẫn nhau. Những kẻ tự cho mình yếu thế sẽ bảo những tên cường bạo: “Nếu không vì nể nang quí ngài thì chúng tôi đã trở thành người tin tưởng rồi!”» (34:31). Trong cách nói nguyên bản, cấu trúc điều kiện gắn việc họ không tin với sự hiện diện của những người ấy, như thể chỉ riêng việc có họ đã thành vật cản, trước khi người theo nói rõ mưu kế trong đoạn đối thoại sau. Bản dịch được dẫn giải thích thêm bằng sự nể nang; lời giảng ở đây chú ý cả sức nặng của cấu trúc điều kiện ngắn trong tiếng Ả Rập.\n\nMột cách áp dụng là tự xem những điều mình đặt sau lời nếu không có để trì hoãn điều tốt: công việc, con cái, thử thách hay hoàn cảnh. Người ta có thể biến chúng thành màn che trước lễ nguyện đêm, chi dùng và cống hiến; mãi tưởng tượng mình sẽ làm gì nếu chúng biến mất, thay vì tìm điều có thể làm cùng chúng.\n\nAl-Sarakhsi đã đọc cho học trò chép một phần Al-Mabsut khi bị giam. Tiểu sử còn thuật rằng ông ở dưới một cái giếng, học trò ở trên chép điều ông đọc; mất tự do không cắt đứt việc giúp người khác học. (Tiểu sử Al-Sarakhsi, Dar al-Ifta Ai Cập; Al-Jawahir al-Mudiyyah.) Ibn al-Qayyim viết một phần Zad al-Ma‘ad trong chuyến đi xa sách vở mình; chính lời mở đầu tác phẩm nhắc hoàn cảnh ấy. Ibn Taymiyyah viết về những ý nghĩa Qur’an trong tù. (Ibn ‘Abd al-Hadi, Al-‘Uqud ad-Durriyyah, phần các tác phẩm.) Trở ngại có thể đổi phương thức cống hiến mà không cắt ý muốn làm.\n\nNhững đường truyền đạt đã thay đổi khi bị ngăn cản. Trong cuộc đời Thiên Sứ ﷺ có việc kêu gọi tại Makkah, ra Ta’if, rồi di cư Madinah; các Sahabah từng di cư sang Abyssinia. Một lối đóng không phải cuối việc truyền đạt; nỗ lực không dừng ở những phương tiện đã thử. Trong cuộc thương lượng tại Hudaybiyyah, Thiên Sứ ﷺ nhờ Budayl chuyển đến Quraysh lời đề nghị đình chiến. Về trường hợp họ từ chối đề nghị ấy, Người nói: «Nếu họ từ chối, Ta xin thề trước Đấng nắm giữ sinh mạng Ta trong tay, Ta nhất định sẽ chiến đấu với họ vì sứ mạng này cho đến khi Ta hy sinh cả mạng sống.» (Al-Bukhari 2731–2732; diễn nghĩa).\n\nĐằng sau mỗi sự vững vàng là hành trình rèn mình người chỉ ngưỡng mộ kết quả có thể không thấy. Có người ước địa vị tử đạo, tin mừng dành cho người ấy và việc mọi người nhắc một kết thúc tốt, nhưng không muốn cống hiến trên con đường đến điều mình ước. Allah phán: «Quả thật, các ngươi đã từng mong muốn được chết (trên chiến trường như một tử đạo cho chính nghĩa của Allah) trước khi các ngươi gặp nó (cái chết). Giờ đây, các ngươi thực sự đã nhìn thấy nó trong lúc các ngươi đang đứng nhìn (trận chiến).» (3:143). Câu Kinh đưa trái tim từ việc treo trách nhiệm vào sự tồn tại của người khác trở về lựa chọn chân thật và cống hiến, trước khi ngày tiếc nuối về những kẻ mình theo đến."}, {"id": "P101", "text": "Câu 32"}, {"id": "P102", "text": "«Những tên cường bạo đáp lời những kẻ yếu thế, nói: “Há bọn ta đã ngăn cản các ngươi theo chỉ đạo sau khi nó đã đến với các ngươi chăng? Không, chính các ngươi mới là những kẻ tội lỗi.”» (34:32)"}, {"id": "P103", "text": "Những kẻ kiêu ngạo không chịu gánh một mình trách nhiệm của người theo. Họ chất vấn việc bị quy là đã ngăn người theo khỏi sự hướng dẫn sau khi nó đến. Theo lời biện hộ của họ, người theo đã tự chọn điều họ kêu gọi và thấy việc đi theo ấy hợp với ham muốn, lợi ích của mình. Vì vậy, họ nói: «Không, chính các ngươi mới là những kẻ tội lỗi.» (34:32).\n\nThuật lại lời đáp ấy không xóa tội mưu kế của họ; câu tiếp theo sẽ phơi bày nó. Nhưng điều ấy cho thấy sự hiện diện của người tô đẹp điều sai không xóa lựa chọn của người nhận. Bên cạnh họ từng có những người cũng nghe lời gọi chân lý nhưng đáp lại, chịu tổn thương mà vẫn kiên định. Một số hoàn cảnh chung mà phản ứng khác nhau cho thấy không thể lấy riêng sự có mặt của thủ lĩnh làm cớ tuyệt đối rằng mình không thể tin.\n\nLời «sau khi nó đã đến với các ngươi» (34:32) càng tác động mạnh. Sự hướng dẫn không còn là tin bị che khuất: nó đã đến rồi họ mới chọn điều trái. Khi đức tin hòa vào trái tim, sức mạnh của nó không đo bằng tiền đối thủ nắm.\n\nTrong cuộc đối thoại với Abu Sufyan, Heraclius hỏi người theo Thiên Sứ là giới danh giá hay người yếu thế. Ông được trả lời rằng người yếu thế theo Người, họ ngày càng đông, và không ai vào đạo rồi bỏ vì bất bình với tôn giáo. Ông nói đó là tình trạng của đức tin khi sự ngọt lành của nó hòa vào trái tim. (Al-Bukhari 7.)\n\nTừ đây, có hai đường ngăn cản: không để sự hướng dẫn đến với người ta và không để người ta đến với sự hướng dẫn. Đường trước nhắm người mang nó: «khi những kẻ vô đức tin mưu định giam cầm Ngươi hoặc sát hại Ngươi hoặc trục xuất Ngươi ra khỏi xứ.» (8:30). Câu nêu giam giữ, giết và trục xuất. Đường sau làm công chúng bận với ham muốn, tiếng ồn, nghi vấn che tai và lòng, như lời họ: «Mọi người đừng thèm nghe Qur’an này, hãy nói chuyện ồn ào và gây náo động (khi Nó được xướng lên), như thế có lẽ các ngươi sẽ nắm ưu thế (trong việc ngăn Muhammad xướng Nó và kêu gọi đến với Nó).» (41:26). Họ muốn người ta không nghe với sự suy xét và sẵn lòng nhận, vì họ không sở hữu trái tim đã hướng về Allah.\n\nToàn câu sau cung cấp ngữ cảnh cho một cách hiểu được lời giảng nêu: «Những ai đứng ngoài quan sát các ngươi, khi các ngươi được Allah ban cho sự thắng lợi thì bọn họ (liền đến để được chia phần) bảo: “Chẳng phải bọn tôi là người cùng phe với các vị hay sao?” Và khi những người vô đức tin chiếm phần thắng thì bọn họ cũng lại đến (với những kẻ vô đức tin đó), bảo: “Không phải bọn tôi đã giúp đỡ các người và ngăn cản các người khỏi tay của những người có đức tin đó sao?” Rồi đây vào Ngày Phán Xét Cuối Cùng, Allah sẽ phân xử giữa các ngươi (những người có đức tin và những kẻ giả tạo đức tin), và tất nhiên Allah không bao giờ mở đường cho những kẻ vô đức tin thắng được những người có đức tin.» (4:141). Ở đây, giảng viên liên hệ ý nghĩa con đường hay quyền chi phối trong tiếng Ả Rập với quyền chi phối trái tim. Bản dịch được dẫn dùng lời về việc thắng người có đức tin; cách giải thích của giảng viên về trái tim được trình bày riêng. Trái tim bề tôi ở trong quyền Allah. Thiên Sứ ﷺ cho biết: «Trái tim của những đứa con của Adam đều nằm giữa hai ngón tay của Đấng Ar-Rahman, giống như một trái tim duy nhất, Ngài hướng nó đến bất cứ nơi nào Ngài muốn.» (Muslim 2655). Người kiêu ngạo không có khả năng độc lập lấy sự hướng dẫn khỏi trái tim người giữ vững nó.\n\nĐiều ấy trở về phần nói về Iblis: Allah phủ nhận ở hắn quyền cưỡng bức, và hắn sẽ nói mình đã mời rồi người ta đáp. Cũng vậy, người theo không được biến sự dụ dỗ của Shaytan hoặc lời gọi của kẻ kiêu ngạo thành cớ xóa trách nhiệm. Lời «Chúng tôi đã dẫn các người đi lạc và chúng tôi cũng là những kẻ lầm lạc.» (37:32) cho thấy người dẫn lạc cùng người chấp nhận bị dẫn lạc; mỗi bên gánh điều mình làm, dù vị trí mạnh yếu khác nhau."}, {"id": "P104", "text": "Câu 33"}, {"id": "P105", "text": "«Những kẻ yếu thế đáp lời những tên cường bạo: “Đúng vậy, các người đã bày mưu cả đêm lẫn ngày khi bảo chúng tôi vô đức tin nơi Allah và dựng những đối tác ngang vai cùng với Ngài.” (Tất cả) bọn họ sẽ hối hận khi nhìn thấy hình phạt. TA sẽ xiềng những chiếc gông vào cổ của những kẻ vô đức tin. Quả thật bọn họ bị trừng phạt chỉ bởi những điều mà bọn họ đã làm.» (34:33)"}, {"id": "P106", "text": "Người theo đáp lại bằng cách phơi bày điều kẻ kiêu ngạo tìm che: lời gọi của các người không chỉ là một câu thoáng qua, mà có việc «đã bày mưu cả đêm lẫn ngày» (34:33), kế hoạch không nghỉ và tiền chi để kéo người ta khỏi sự hướng dẫn. Có người theo thấy rõ từ bên trong, biết điều được sắp đặt và khoản được bỏ ra, nhưng im vì sợ hoặc hưởng tiền được đưa. Lời đáp thủ lĩnh không khiến họ vô tội trong việc dẫn lạc; lời than người theo cũng không làm người nhận lời mất trách nhiệm lựa chọn. Hai tội được phơi bày trong sự đổ lỗi ấy.\n\nMưu kế mở rộng theo diễn đàn và phương tiện dùng để gieo nghi vấn hoặc kích ham muốn. Đêm ngày thành thời gian làm việc liên tục. Điều này đánh thức người có đức tin về nỗ lực thực sự cần có. Có người muốn thăng tiến để được nghỉ nhiều hơn, trong khi thủ lĩnh điều sai càng có quyền càng bỏ công sắp đặt. Iblis đã xin trì hoãn trong toàn câu: «(Iblis) tâu: “Xin Ngài tạm tha cho bề tôi (được sống) cho đến ngày chúng (con cháu của Adam) được dựng sống lại.”» (7:14). Hắn không xin thêm thời gian để nghỉ, mà để kéo dài việc dẫn lạc.\n\nMối bám theo con người bắt đầu từ khi sinh. Hadith kể việc Shaytan chạm trẻ sơ sinh, trừ Maryam và con bà. Abu Hurayrah sau đó dẫn lời cầu của mẹ Maryam: «bề tôi khẩn xin Ngài phù hộ cho nó và con cháu của nó tránh khỏi lũ Shaytan đã bị nguyền rủa.» (3:36). (Al-Bukhari 3431.) Đây là sự thù địch kéo dài, tìm lối vào cho từng hoàn cảnh.\n\nCâu Kinh nêu mục tiêu thống nhất của công việc ấy: «khi bảo chúng tôi vô đức tin nơi Allah và dựng những đối tác ngang vai cùng với Ngài» (34:33). Đối tác ngang hàng là những đối tượng con người đặt ngang Allah trong điều chỉ thuộc quyền Ngài. Mưu kế đi đến làm hỏng tín ngưỡng và sự thờ phụng duy nhất, không dừng ở một tội rời khỏi việc nhận biết Thượng Đế. Tương tự lời Jinn khi nhận ra chân lý: «Quả thật, kẻ ngu ngốc (Iblis) trong chúng ta đã nói về Allah những điều quá đáng cho Allah.» (72:4). Họ nhận ra điều sai trong những gì từng được truyền cho mình về Allah.\n\nMột lối cám dỗ Hadith làm rõ là phản kháng sự tiền định sau khi việc đã xảy ra. Hadith cảnh báo rằng «chữ \"nếu, phải chi, dẫu mà\" mở ra công việc cho Shaytan.» (Muslim 2664). Con người có thể chuyển từ rút kinh nghiệm sang bất mãn phá hỏng lòng thuận theo.\n\nMột lối khác là cám dỗ Shaytan tìm khi phụ nữ ra ngoài. Abdullah ibn Mas‘ud dẫn lời Thiên Sứ ﷺ: «Người phụ nữ là ‘awrah. Khi cô ấy ra ngoài, Shaytan dõi mắt theo cô ấy.» (Ibn Mas‘ud; At-Tirmidhi 1173). Ở đây, ‘awrah nói đến phần thân thể cần được che kín. At-Tirmidhi xếp bản thuật là “hasan gharib”, còn đánh giá Darussalam xếp là yếu. Hắn rình những nơi có thể tìm lối vào để tô đẹp điều sai.\n\nChợ cũng được nhắc đến. Salman khuyên về việc đi chợ: «Nếu có thể, anh đừng là người đầu tiên vào chợ hay người cuối cùng rời chợ, vì chợ là chiến trường của Shaytan và là nơi hắn dựng cờ của mình.» (Salman, lời của vị đồng hành; Muslim 2451). Nhiều lối vào cho thấy hắn không dùng một hoàn cảnh cho mọi người, cũng không bỏ một giai đoạn tuổi nào không cám dỗ.\n\nMột hình thức làm hỏng nhận thức về sự duy nhất của Allah ở trẻ nhỏ là nhiều nhân vật trong chuyện được gán quyền điều khiển gió, bổng lộc hoặc việc của vũ trụ, rồi được trình bày như nhiều thần linh. Trẻ lớn lên giữa những chủ thể tranh giành thay vì hướng trọn lòng về Allah. Còn nhỏ không có nghĩa điều tiếp nhận không để dấu vết; hình ảnh ý nghĩa lặp lại góp phần hình thành cách nhìn. Cũng có việc dùng tên và thuộc tính của Allah làm danh hiệu cho nhân vật được hư cấu với hành động tương tự Ngài. Người giáo dưỡng cần quan tâm điều đến với trái tim trẻ, không coi đó chỉ là giải trí không mang ý nghĩa. Với người lớn, thiếu niên, nam và nữ có những hình thức khác hợp mối quan tâm, nhưng cùng tìm cách kéo khỏi mặc khải.\n\nĐó là nét riêng của việc «đã bày mưu cả đêm lẫn ngày» (34:33). Lời «Chúng tôi sẽ không bao giờ tin nơi Qur'an này» (34:31) không chỉ là tuyên bố rồi nghỉ; họ làm việc để kéo cả người khác đi. Người thật lòng nói Qur’an là sự hướng dẫn cũng không chỉ khen Nó rồi bỏ việc dạy và truyền đạt. Qur’an chỉ rõ người theo điều sai cũng biết vất vả: «Nếu các ngươi đau đớn (bởi thương vong) thì bọn họ cũng bị đau đớn (bởi thương vong) tương tự như các ngươi, có điều các ngươi có niềm hy vọng nơi Allah còn bọn họ chẳng có niềm hy vọng nào.» (4:104). Khó nhọc không dành riêng người có đức tin, nhưng họ mang niềm hy vọng đối thủ không có. Mục đích và phần thưởng giúp họ kiên nhẫn, cống hiến.\n\nRồi tranh cãi đi đến điều vượt khỏi lời nói. Toàn câu được dẫn làm ngữ cảnh: «Những kẻ yếu thế đáp lời những tên cường bạo: “Đúng vậy, các người đã bày mưu cả đêm lẫn ngày khi bảo chúng tôi vô đức tin nơi Allah và dựng những đối tác ngang vai cùng với Ngài.” (Tất cả) bọn họ sẽ hối hận khi nhìn thấy hình phạt. TA sẽ xiềng những chiếc gông vào cổ của những kẻ vô đức tin. Quả thật bọn họ bị trừng phạt chỉ bởi những điều mà bọn họ đã làm.» (34:33). Trong đoạn nói về hối tiếc, lời giảng hiểu động từ nguyên bản là giấu kín sự ân hận. Người theo tiếc người mình vâng, tiếc lời người khuyên đã bỏ; người được theo tiếc điều lòng kiêu ngạo xui mình làm. Có cách hiểu giới kiêu ngạo giấu hối tiếc để giữ vẻ vững vàng trước người theo; cũng có cách hiểu sự kinh khủng của hình phạt khiến họ sững đến mức không thể bộc lộ điều ở trong lòng. Việc giấu ở cảnh này không ngăn hối tiếc hiện ra trong cảnh khác. Những tình trạng tiếp nối, mỗi tình trạng phơi bày một mặt kinh hoàng.\n\nKhi thấy hình phạt, đổ lỗi, nguyền rủa hay tìm cách chối bỏ không còn giúp được. Tiếp đó là: «TA sẽ xiềng những chiếc gông vào cổ của những kẻ vô đức tin.» (34:33). Gông là những trói buộc ở cổ để người mang bị lùa đi. Một cách suy ngẫm về hình ảnh ấy là sự tương xứng với người ở đời chấp nhận để đầu óc bị lùa: theo mà không xem xét hay hỏi, dù điều trái lẽ phải đã hiện ra. Theo Musaylimah trong lời giả xưng là một ví dụ về bỏ khả năng phân biệt, trong khi người Ả Rập vốn biết ngôn ngữ và có thể nhận ra. Không phải lúc nào thiếu công cụ cũng là vật cản; có khi là chấp nhận đi theo.\n\nSự liên hệ ấy không giới hạn hình phạt vào người theo. Thủ lĩnh và người đáp lại đều nằm trong mô tả phủ nhận đức tin. Câu kết đưa sự việc về công bằng: «bọn họ bị trừng phạt chỉ bởi những điều mà bọn họ đã làm» (34:33). Điều họ thấy là kết quả việc mình làm, không phải bất công giáng xuống, cũng không là tranh chấp ai có thể thoát bằng cách đẩy hết gánh lên người khác."}, {"id": "P107", "text": "Câu 34"}, {"id": "P108", "text": "«(Quả thật) không một vị cảnh báo nào được TA cử phái đến bất kỳ một thị trấn nào mà lại không bị những kẻ giàu có của thị trấn đó bảo: “Bọn ta không tin nơi thông điệp mà các ngươi mang đến.”» (34:34)"}, {"id": "P109", "text": "Sau khi sự thù địch giữa người kiêu ngạo và người yếu thế ở Đời Sau được phơi bày, ngữ cảnh trở về gốc mối liên hệ của họ ở đời này. Những kẻ xa hoa dẫn đầu việc từ chối các sứ giả; nhiều người yếu thế theo họ trong sự từ chối như vẫn theo trong đời sống. Lời đáp được đặt trên miệng giới xa hoa để thấy ai dẫn cuộc chống đối và ai chạy theo.\n\nTrong chương nổi bật hai đặc tính kiêu ngạo và yếu thế; còn cảnh trong Al-Baqarah nêu việc theo nhau, trong toàn câu: «(Bởi vì) khi đối diện với hình phạt, những kẻ được tuân theo sẽ (tuyên bố) vô can đối với những kẻ phục tùng chúng và mọi quan hệ giữa đôi bên sẽ bị cắt đứt hết.» (2:166). Lựa chọn cách mô tả ở đây cho thấy kiêu ngạo tạo ra sự lệ thuộc thế nào. Toàn câu đang suy ngẫm ghi: «(Quả thật) không một vị cảnh báo nào được TA cử phái đến bất kỳ một thị trấn nào mà lại không bị những kẻ giàu có của thị trấn đó bảo: “Bọn ta không tin nơi thông điệp mà các ngươi mang đến.”» (34:34). Nó cho thấy một quy luật lặp lại trong lời kêu gọi của các vị Nabi. Những người bị đời sống xa hoa làm tự cao, có lợi ích dựng trên việc đứng trên người khác, sợ thông điệp đổi vị thế đã ổn định. Nó buộc họ công bằng, bình đẳng về quyền, trả Zakah và thực hiện những điều Allah quy định trong tài sản. Họ xem việc mọi người được hướng dẫn là đe dọa vị trí.\n\nKhông phải mọi người giàu đều thuộc nhóm xa hoa ấy. Ở đây là người bị ân huệ đẩy đến ngạo mạn với người khác. Cấu tạo từ tiếng Ả Rập gợi người đã được cho sống dư dả: ân huệ được ban, Allah mở rộng nó, nên điều phải làm là biết ơn. Nhưng họ lại lấy nó làm cớ nổi loạn trước Đấng Ban Ơn.\n\nTừ này cũng được giải thích bằng hình ảnh phồng lên vì ân huệ, tự cao nhờ nó, gặp đặc tính kiêu ngạo trong cảnh trước. Có ý kiến liên hệ nguồn từ với một chỗ nhô ở môi trên; theo cách ấy, hình ảnh phồng lên gợi cảm giác mình cao hơn người khác vì tiền. Tuy nhiên, một số nhà ngôn ngữ phản đối cách truy nguồn từ này.\n\nCó tiền và phương tiện đến với công chúng, họ có thể chi để bóp méo lời kêu gọi và gieo nghi vấn: «Quả thật, những kẻ vô đức tin thường chi dùng tài sản của chúng vào việc ngăn chặn con đường chính đạo của Allah. Vì vậy, chúng sẽ tiếp tục chi dùng tài sản của chúng (vào việc đó), rồi đây chúng sẽ phải hối tiếc và cuối cùng chúng sẽ thất bại.» (8:36). Chi nhiều để chống lẽ phải không chứng minh lập luận mạnh. Họ có thể bỏ tiền rồi chỉ nhận tiếc nuối. Công kích Thiên Sứ không làm mất sự tôn vinh Allah dành cho Người; toàn câu nhắc: «(Chẳng phải) TA đã nâng cao danh tiếng của Ngươi?» (94:4).\n\nTừ chỉ giới xa hoa của mỗi cộng đồng gợi mỗi nơi có người nắm ảnh hưởng. Đơn vị cư dân trong câu không chỉ là làng theo phân chia hành chính. Câu tương tự là: «Cũng như thế, TA (Allah) đã đặt trong mỗi thị trấn những tên tội phạm lớn nhất của nó để chúng hoạch định âm mưu trong đó.» (6:123). Những người ấy nhắm các đầu mối sức mạnh: nơi quyết định, thị trường dân cần và lợi ích công việc tùy thuộc. Có thể thấy hình thức ấy qua kiểm soát thị trường vàng, sắt, khai thác người không biết giá hoặc dùng ảnh hưởng chi phối việc giải quyết thủ tục của dân.\n\nỞ chiều kia, cách nói trong một cộng đồng gợi thông điệp đi vào đời sống. Người kêu gọi mang mặc khải đến nơi mọi người sống và giao dịch, không chỉ ở xa nhu cầu của họ. Cách nói về điều các vị được cử đến cùng cũng giúp thấy điều ấy: thông điệp theo các sứ giả, đối diện sự lệch lạc ở chợ, nơi tụ họp và mọi mặt đời sống. Mưu kế ngày đêm lan đến các nhóm thế nào, lời kêu gọi cũng cần tới được các nhóm ấy.\n\nNhắc người cảnh báo phù hợp với dân bị ân huệ làm sao lãng và quay lưng mạnh. Họ cần được đánh thức bằng kết quả điều mình đang làm. Sau chuỗi mệnh lệnh hãy nói trong đối thoại, lời đáp chung của họ là từ chối toàn bộ điều được mang đến, không đưa bằng chứng bác ý nghĩa. Sự tự cao tương tự xuất hiện ở dân Salih: «Những tên kiêu ngạo kia bảo: “Bọn ta phủ nhận điều mà các người đã tin.”» (7:76). Như thể chỉ riêng việc người yếu thế đã nhận chân lý cũng thành lý do để người kiêu ngạo càng chống."}, {"id": "P110", "text": "Câu 35"}, {"id": "P111", "text": "«(Những kẻ giàu có đó) nói: “Bọn ta có nhiều tiền của và đông con cái, và bọn ta chắc chắn sẽ không bị trừng phạt.”» (34:35)"}, {"id": "P112", "text": "Giới xa hoa không chỉ tuyên bố phủ nhận; họ còn nêu một nghi vấn giữ người yếu thế dưới quyền: nhiều tiền của và con cái nên sẽ không bị phạt. Cảnh thủ lĩnh chối bỏ ở Đời Sau có thể làm người theo mất tin, nên kẻ kiêu ngạo cần điều nối lại sự bám víu. Sức mạnh họ dựa vào người trợ giúp. Pha-ra-ông bạo ngược nhờ quân; nếu quân rời bỏ, sự yếu đuối của tạo vật lộ ra. Còn quyền Allah không đứng nhờ ai; chỉ Ngài có lời đáp khi được hỏi: «Quyền hành (Phán Xử) vào Ngày đó sẽ thuộc về ai? Thuộc về Allah, Đấng Duy Nhất, Đấng Tối Thượng.» (40:16).\n\nNghi vấn bắt đầu bằng điều mọi người thấy thật: họ có nhiều. Rồi nó dựng một kết luận điều ấy không chứng minh: được nhiều nghĩa là đúng hơn, gần Allah hơn, an toàn khỏi hình phạt. Sai lệch nằm ở đó: tiền đề có thể đúng mà kết luận sai. Vượt trội về sức mạnh, sản xuất hay tiền không khiến tín ngưỡng chắc đúng hơn người ít có; tiến bộ đời sống không trả lời câu hỏi về sự duy nhất của Allah và Đời Sau.\n\nThiên Sứ ﷺ nói về tác động mạnh của tiền: «Mỗi cộng đồng đều bị thử thách, thử thách của cộng đồng Ta là tiền bạc.» (At-Tirmidhi 2336). Qur’an bác thước đo sai: «Quả thật, con người khi được Thượng Đế của y thử thách y với danh dự và ân huệ thì y nói: Thượng Đế của tôi đã ban cho tôi niềm vinh dự.» (89:15); rồi: «Nhưng khi y bị thử thách với việc thu hẹp bổng lộc thì y lại bảo: Thượng Đế của tôi đã hạ nhục tôi.» (89:16); và sau cả hai cách hình dung là lời «Không.» (89:17). Được cho là thử thách; bị thu hẹp cũng là thử thách. Con người giữ ý được tôn vinh mà bỏ ý bị thử, tưởng ân huệ chứng nhận mình xứng đáng, mất nó là bị hạ nhục. Nhớ đang bị thử bằng ân huệ sẽ biết ơn; nhớ đang bị thử bằng khó khăn sẽ kiên nhẫn, không lấy bề ngoài phán vị trí người khác ở nơi Allah.\n\nĐáng chú ý là ‘Ad đáp lời cảnh báo của các sứ giả bằng câu: «Ai mạnh hơn bọn ta?» (41:15). Sức mạnh cơ thể liên quan gì đến việc lời đáp về mặc khải đúng hay sai? Người đa thần cũng nói khi được đọc các câu Kinh; toàn câu cho ngữ cảnh: «Và khi những Lời Mặc Khải rõ rệt của TA được đọc ra để nhắc chúng, những kẻ vô đức tin nói với những người tin tưởng như sau: “Giữa hai chúng ta, nhóm nào là nhóm có địa vị tốt và đáng kính trọng hơn cả trong Hội đồng (của thành phố Makkah)?”» (19:73). Lời đáp là: «Trước họ đã có không biết bao thế hệ giàu có và hào nhoáng hơn đã bị TA hủy diệt.» (19:74). Có những thế hệ đồ dùng, vẻ ngoài tốt hơn nhưng trang sức không cứu được khỏi hủy diệt. Qarun tự mãn về tiền cuối cùng chịu: «TA đã làm cho đất sụp xuống nuốt chửng y và cả nhà cửa của y.» (28:81).\n\nThước đo ấy có thể lẻn vào lòng, đến mức thấy người bị thử thì cho rằng chắc họ đã phạm tội rất lớn. Bản thuật về Ayyub kể Người bị thử mười tám năm. Người gần xa đều xa lánh, chỉ hai người bạn thân vẫn sớm tối đến thăm. Một người nói Ayyub đã phạm tội chưa ai phạm, lấy cớ thử thách lâu mà chưa được cất đi. Khi nghe lời ấy, Ayyub không chấp nhận suy đoán. Người nhắc sự kính trọng Allah của mình: nghe hai người cãi nhau rồi nhắc Allah, Người trở về làm việc đền chuộc thay họ, vì không muốn danh Ngài được nhắc ngoài điều đúng. (Ibn Hibban 2898.) Thử thách kéo dài không chứng minh điều người kia tưởng. Lòng kính trọng danh Thượng Đế lớn lao vẫn ở trong tim Ayyub.\n\nSự bám vào thước đo tiền có thể bắt đầu nhỏ. Trẻ thấy tiền đáp điều mình muốn, thiếu tiền cản một số mong muốn; rồi mối liên hệ lớn lên thành ảo tưởng toàn bộ hạnh phúc nằm trong tiền. Nếu không được uốn nắn, nó lan sang cách đánh giá hành động và ý tưởng: thứ tạo tiền được xem tốt, thứ mất lợi nhuận bị bác, dù là phán quyết Allah. Người ta bảo vệ lãi vay hoặc công việc bị cấm vì nó cho thu nhập.\n\nBản thuật của Anas nói về lòng ham muốn có thêm: «Nếu một người con của Adam có cả một thung lũng vàng, người ấy sẽ muốn có hai thung lũng như thế.» (Anas; Al-Bukhari 6439). Khi tiền thành tiêu chuẩn cho tôn giáo, điều toàn câu sau mô tả xuất hiện: «Trong nhân loại có kẻ thờ phượng Allah trong sự hoài nghi. Nếu gặp điều lành thì y sẽ an lòng (tiếp tục thờ phượng Ngài), còn nếu gặp điều dữ thì y sẽ quay mặt đi (không thờ phượng Ngài nữa); thế là y thất bại cả đời này lẫn Đời Sau. Đó thật sự là một thất bại hiển nhiên.» (22:11). Ibn ‘Abbas giải thích qua người đến Madinah: nếu vợ sinh con trai, ngựa sinh sản thì nói đạo này tốt; nếu không được như thế lại nói đạo này xấu. (Al-Bukhari 4742.) Người ấy không lấy chấp nhận chân lý làm gốc điều hành đời, mà buộc tôn giáo đi theo lợi ích đang chờ.\n\nRồi có thể yêu người giàu vì giàu, khinh người nghèo vì nghèo, đến mức thành nô lệ của đồng dinar. (Al-Bukhari 2887.) Một bản thuật cùng nội dung được bản dịch Riyadh dẫn như sau: «Thật\r\nkhổ thân cho những kẻ nô lệ của vàng, của bạc, của quần áo nhung gấm và sự sặc\r\nsỡ.» (Al-Bukhari 6435; Riyadh Al-Saaliheen, mục 266). Con người còn có thể chiến đấu vì tiền dù nguy hiểm rõ. Bản thuật của Abu Hurayrah nêu sự việc: «Nước sông Euphrates sẽ rút, để lộ một ngọn núi bằng vàng.» (Abu Hurayrah; Muslim 2894.01; diễn nghĩa). Bản dịch đã đăng mô tả cuộc tranh giành vàng và số người bị giết: «Giờ Tận Thế không được dựng lên cho tới khi con sông Furrat (Euphrates) được phát hiện thấy một núi vàng và mọi người sẽ giết nhau vì tranh giành nó, mỗi một trăm người sẽ bị giết chín mưới chín người» (Abu Hurayrah; Muslim 2894.01). Mỗi người trong số họ tự nhủ: «Biết đâu chính mình sẽ sống sót.» (lời mỗi người trong cuộc tranh giành; Muslim 2894.01; diễn nghĩa). Họ chịu nguy cơ ấy vì tham tiền, rồi có thể viện khó nhọc nhỏ để từ chối thờ phượng hoặc cống hiến vì Allah. Điều chiếm trái tim qua đó lộ ra.\n\nVì vậy, không lạ khi người xa hoa chống lời kêu gọi đụng vị thế đứng đầu của mình. Vấn đề sâu hơn bám vào một tượng thần: đó là làm nô lệ cho địa vị đã dựng. Một cách giải thích câu «Các ngươi hãy cầu xin sự phù hộ bằng tấm lòng kiên nhẫn và lễ nguyện Salah. Quả thật lễ nguyện Salah chắn hẳn là điều nặng nề và khó khăn nhưng đối với những người thực sự kính sợ (Allah thì nó không khó khăn và nặng nề chút nào).» (2:45) là lời gọi thủ lĩnh những người có Kinh Sách tìm trợ giúp bằng kiên nhẫn và lễ nguyện để bỏ điều ngăn họ theo Sứ Giả. Có cách hiểu kiên nhẫn ở đây là nhịn chay: luyện bản thân bỏ điều mình muốn; quen bỏ điều được phép sẽ giúp rời điều bị cấm. Cũng có cách hiểu sự nặng nề được nhắc là điều thuận theo đòi hỏi: bỏ quyền đứng đầu và vị thế cao.\n\nBởi vậy, thường những người đầu theo các sứ giả là người yếu thế, như đối thủ của Nuh nói trong toàn câu: «Nhưng các vị cầm đầu trong đám người dân của Y đáp: “Bọn ta thấy Ngươi chỉ là một người phàm như bọn ta và bọn ta cũng nhận thấy chỉ những kẻ tồi tệ nhất trong bọn ta mới mù quáng theo Ngươi và bọn ngươi chẳng có gì trội hơn bọn ta cả. Không, bọn ta nghĩ, bọn ngươi là những kẻ nói dối.”» (11:27), và như xuất hiện trong câu hỏi Heraclius dành cho Abu Sufyan. (Al-Bukhari 7.) Điều này không ngăn người giàu tin, cũng không đòi họ phá hủy tài sản. Điều cần tránh là để giàu có và quyền lãnh đạo quyết định việc mình có chấp nhận chân lý hay không.\n\nNhững người sống xa hoa ấy khẳng định hai điều: họ đã được ban cho nhiều ân huệ và họ sẽ không bị trừng phạt ở Đời Sau. Lập luận ấy có thể khiến người ta lầm lạc và tiếp tục chịu sự chi phối của những kẻ bênh vực điều sai, nên cần chỉ rõ nó sai ở đâu. Còn nếu người ta tranh cãi chỉ để bắt bẻ, không đáp lại có thể là cách thích hợp. Vì thế, lời đáp ở đây trước hết giải thích bổng lộc đến từ đâu, rồi cho biết dựa vào đâu mà một người được gần Allah và được đền đáp. Cuối cùng, lời đáp cho thấy việc dùng của cải để vâng phục Allah hay để ngăn người khác đón nhận mặc khải sẽ dẫn đến những kết quả khác nhau."}, {"id": "P113", "text": "Câu 36"}, {"id": "P114", "text": "«Ngươi (hỡi Thiên Sứ) hãy nói (với những kẻ mà Allah đã ban cho họ nhiều ân huệ về của cải cũng như con cái): “Quả thật, Thượng Đế của Ta nới rộng hay thu hẹp bổng lộc đối với ai là tùy ý Ngài muốn, tuy nhiên, đa số nhân loại không biết (tất cả mọi sự việc đều được sắp đặt theo sự sáng suốt và anh minh của Ngài).”» (34:36)"}, {"id": "P115", "text": "Điều đầu tiên cần sửa trong nghi vấn của giới xa hoa là tiền họ có chỉ là bổng lộc Allah mở rộng, không phải sức mạnh độc lập với ý muốn Ngài. Lời giảng giải thích rằng Thượng Đế mà Sứ Giả thờ phượng và quy phục chính là Đấng đã ban cho họ, cũng có thể thu lại điều họ đang tự hào. Được nhiều không có nghĩa xứng đáng được cứu. Allah có thể mở rộng để thử rồi thu lại trong khoảnh khắc.\n\nMột điều gần gũi phơi bày sự phụ thuộc là: «Hãy bảo chúng: “Các người có xét thấy chăng? Nếu vào một buổi sáng nào đó mạch nước của các người rút mất tiêu (xuống lòng đất) thì ai sẽ mang nước mạch trong vắt đến tiếp liệu cho các người?”» (67:30). Nếu nước duy trì đời sống rút sâu mất, tiền không thay được quyền Allah đưa nó xuất hiện. Người có đức tin nói với chủ hai vườn; toàn câu cho ngữ cảnh: «“Thì biết đâu (sau này) Thượng Đế của tôi sẽ ban cho tôi thứ tốt đẹp hơn ngôi vườn của anh; biết đâu Ngài sẽ gửi từ trên trời xuống những lưỡi tầm sét tàn phá ngôi vườn của anh, biến nó thành mảnh đất trơ trụi,”» (18:40); rồi: «Hoặc nguồn nước của ngôi vườn sẽ cạn mất khiến anh không thể nào tìm được nguồn nước trở lại.» (18:41).\n\nKhông phải phủ nhận công sức người có tiền đã bỏ. Họ có làm và dùng phương tiện, nhưng Đấng tạo phương tiện và làm kết quả thuận lợi là Allah. Không thể lấy điều được ban làm lý do trái lệnh Ngài. Sự dễ dàng có thể là việc dẫn dần người đã chọn quay lưng đến kết cục xấu: «Còn đối với ai keo kiệt và cho mình giàu có.» (92:8); «Và phủ nhận điều tốt.» (92:9); «TA sẽ khiến y luôn được thuận lợi để đến với sự gian khổ.» (92:10).\n\nCâu cũng nhắc người có đức tin: các quy luật đời sống không dừng chỉ vì tín ngưỡng khác nhau. Đặt hạt giống tốt vào đất phù hợp và chăm nước là dùng phương tiện mọc cây, dù người làm là Muslim hay không. Người có đức tin đừng ngồi yên chờ thành quả rồi ngạc nhiên người khác có nó trong khi họ cố gắng.\n\nNhưng phương tiện không là bảo đảm độc lập với ý muốn Allah. Hai người làm gần như nhau không nhất thiết nhận bổng lộc bằng nhau. Toàn câu sau làm rõ sự tùy thuộc ấy: «Ai muốn kiếp phù sinh (của đời này) TA sẽ giục điều mà TA sẵn sàng ban cấp đến cho kẻ nào TA muốn. Rồi TA làm sẵn hỏa ngục cho y; trong đó, y sẽ bị nướng, bị hạ nhục và bị bỏ xó.» (17:18). Vấn đề gồm cả Allah muốn ban điều gì và muốn ban cho ai. Quy luật dùng phương tiện đi cùng ý muốn và sự khôn ngoan của Ngài; không hiểu một bên tách khỏi bên kia.\n\nBởi vậy, người có đức tin được dạy cống hiến và chuẩn bị; toàn câu nhắc: «Các ngươi (những người có đức tin) hãy chuẩn bị chống lại chúng bằng bất cứ thứ gì có thể, từ sức mạnh và các con chiến mã, để cho kẻ thù của Allah và kẻ thù của các ngươi cũng như những kẻ khác ngoài chúng mà các ngươi không biết nhưng Allah thì biết rõ về chúng kinh hồn khiếp vía. Và bất cứ thứ gì các ngươi đã chi dùng cho con đường chính nghĩa của Allah đều sẽ được Ngài bù đắp lại cho các ngươi, và tất nhiên các ngươi sẽ không bị đối xử bất công.» (8:60). Họ cũng được nhắc đối thủ chịu nhọc nhằn như mình: «Nếu các ngươi đau đớn (bởi thương vong) thì bọn họ cũng bị đau đớn (bởi thương vong) tương tự như các ngươi, có điều các ngươi có niềm hy vọng nơi Allah còn bọn họ chẳng có niềm hy vọng nào.» (4:104). Nỗ lực được yêu cầu, bổng lộc đến từ Allah, và sự khác biệt không chứng nhận tín ngưỡng ai đúng. Nhưng nhiều người dừng ở việc thấy tiền nhiều hay ít, không hiểu thật sự về thử thách. Người được cho tự mãn vì điều nhận; người thiếu buồn như thể phần ít chứng minh mình bị khinh."}, {"id": "P116", "text": "Câu 37"}, {"id": "P117", "text": "«(Các ngươi hãy biết rằng) của cải, con cái của các ngươi không phải là những thứ đưa các ngươi đến gần TA (Allah) hơn, mà chỉ những ai có đức tin và hành thiện thì mới là những người sẽ được ban thưởng gấp đôi cho những điều (tốt) mà họ đã từng làm, và họ sẽ an toàn ở trong những ngôi nhà cao tầng.» (34:37)"}, {"id": "P118", "text": "Sau khi làm rõ nhiều tiền là do Allah mở rộng, ngữ cảnh bác điều họ dựng lên từ đó về sự gần gũi và an toàn. Tài sản, con cái không tự đưa người có đến gần Allah chỉ vì có hoặc có nhiều. Cách nói về gần ở nơi Ngài hướng mắt đến mục tiêu nên tìm bằng mọi thứ mình nắm: gần Thượng Đế, không chỉ hơn người khác về hưởng thụ đời này.\n\nThiên thần, các vị Nabi và người ngay chính đều tìm địa vị gần Ngài hơn. Những đối tượng người đa thần thờ ngoài Allah tự mình cũng tìm sự hài lòng, gần gũi ấy, như toàn câu: «Những thần linh mà họ khấn vái cũng tìm mọi cách (thi đua) xem ai trong số họ được gần Ngài hơn, họ cũng hy vọng nơi lòng thương xót của Ngài đồng thời cũng sợ sự trừng phạt của Ngài. Quả thật, hình phạt của Thượng Đế của Ngươi (hỡi Thiên Sứ Muhammad) là thứ đáng phải khiếp sợ.» (17:57). Có cách giải thích đây là thiên thần; cũng có cách hiểu là những Jinn đã vào Islam nhưng dân họ vẫn thờ. Trong cả hai trường hợp, không thể tìm đường đến Allah bằng cách thờ một bề tôi cũng thiếu thốn như mình. Tiền cũng không thành đường gần Ngài ngoài cách Ngài yêu thích.\n\nNếu ưu thế vật chất chứng minh tôn giáo đúng, người đa thần thắng Uhud đã có bằng chứng cho mình. Nhưng người theo lẽ phải có thể thua vì sự khôn ngoan và thử thách, còn người theo điều sai được dư dả như một sự dẫn dần đến kết cục. Rồi phần ngoại lệ mở cánh cửa hành động: «chỉ những ai có đức tin và hành thiện» (34:37). Người giàu không bị chặn khỏi gần Allah. Điều đưa họ gần là đức tin thật và việc làm với những gì được ban.\n\nHành động phù hợp bối cảnh là chi tiền vào điều tốt, dạy con và nuôi con trong vâng phục, phục vụ tôn giáo; ân huệ không chỉ thành thứ tự hào. Thiên Sứ ﷺ cho biết người nhiều tiền sẽ là người ít phần vào Ngày Phục Sinh, trừ người dùng tiền cống hiến về các hướng, trước mặt, phải, trái và sau lưng. (Al-Bukhari 6443.) Nhiều hướng giúp hình dung nhiều mặt chi dùng: đáp nhu cầu người nghèo, giúp việc học và giúp tôn giáo. Không phải gom tiền rồi tưởng chỉ sở hữu đã là bằng chứng được tôn vinh.\n\nVì vậy, câu gắn phần thưởng với việc làm: «những người sẽ được ban thưởng gấp đôi cho những điều (tốt) mà họ đã từng làm» (34:37). Tiền dùng vào điều tốt mở cho người có nhiều cửa thiện. Các Sahabah nghèo than người có tiền vượt mình bằng những việc mình không làm nổi. Thiên Sứ ﷺ dạy họ tôn vinh, ca ngợi và tuyên xưng sự vĩ đại của Allah. Phần tiếp theo do Abu Salih thuật lại kể rằng những người nghèo trở lại vì người giàu cũng đã làm như thế; trong phần này, lời đáp của Thiên Sứ được dẫn là: «Đó là\r\nđặc ân của Allah muốn ban cho ai tùy Ngài.» (Muslim 595; Riyadh Al-Saaliheen, mục 494). Khác biệt khả năng cống hiến không phải chỗ phản đối Allah, mà là ân huệ để dùng vào vâng phục.\n\nAn toàn trong những chỗ ở trên cao là sự đền đáp phù hợp với lòng gắn bó Thượng Đế. Người chỉ yên tâm nhờ tiền sợ chi ra sẽ mất nguyên nhân an toàn. Người tin lời Allah hứa càng cống hiến càng hy vọng, an lòng, vì biết điều đã gửi trước không mất. Như vậy, lời bác nghi vấn người đa thần cũng củng cố người có đức tin bị lời khoe ảnh hưởng: có ít không làm mất niềm tin nơi Allah, có nhiều không ngăn chi dùng."}, {"id": "P119", "text": "Câu 38"}, {"id": "P120", "text": "«Những kẻ cố gắng tìm cách phá hỏng các lời mặc khải của TA thì sẽ bị dẫn tới chỗ trừng phạt.» (34:38)"}, {"id": "P121", "text": "Không thể cho rằng tiền đưa mình gần Allah trong khi dùng nó ngăn các dấu hiệu Ngài. Vì thế, câu này đặt người dùng tiền chống các dấu hiệu của Allah tương phản với người có đức tin và làm điều thiện, qua đó làm rõ thước đo về tiền: chủ dùng vào đâu? Người có đức tin dùng tiền để vâng phục nên nhận phần thưởng tăng thêm và an toàn; người chống sự hướng dẫn dùng tiền để cản trở nên bị đưa đến hình phạt. Tiền không tuyệt đối tốt hay xấu; tác động hiện ra qua cách dùng.\n\nMột chìa khóa tương tự nằm trong Hadith: «Thật đáng ngạc nhiên cho vụ việc của người có đức tin, vì mọi việc của y đều tốt, và điều đó không thuộc về ai ngoại trừ người có đức tin. Nếu điều tốt xảy đến với y, y biết ơn, y sẽ được điều tốt; và nếu điều xấu xảy đến với y, y kiên nhẫn, y sẽ được điều tốt.» (Muslim 2999). Có ân huệ chưa đủ kết luận người nhận được tốt, mà phải xem biết ơn hay phủ ơn. Khó khăn không nhất thiết xấu cho người nhận bằng kiên nhẫn.\n\nNgay được cứu cũng có thể là thử thách. Có cách giải thích lời «Trong sự việc đó là sự thử thách to lớn từ Thượng Đế của các ngươi dành cho các ngươi.» (7:141) bao gồm thử thách trong việc cứu con cháu Israel khỏi Pha-ra-ông, để thấy họ làm gì sau ân huệ. Vượt biển rồi thấy người thờ tượng, họ nói: «Này Musa, xin Người hãy tạo cho chúng tôi một thần linh (để chúng tôi có thần linh) giống như họ.» (7:138). Được cứu không ngăn họ đáp sai với Đấng Ban Ơn. Trước đó, họ đã được bảo: «Có lẽ, Thượng Đế của các người sẽ tiêu diệt kẻ thù của các người và cho các người nối nghiệp họ trên vùng đất này, và Ngài muốn xem các người sẽ hành động như thế nào (tri ân hay vong ơn Ngài).» (7:129). Điều cốt yếu là con người làm gì sau khi nhận ân huệ và điều kiện vững vàng.\n\nĐộng từ hiện tại trong câu đang suy ngẫm vẽ nỗ lực lặp lại: hễ có tiền hoặc ảnh hưởng lại dùng ngăn cản. Đây là sự nối dài mưu kế ngày đêm, đối diện lời ở đầu chương; toàn câu là: «Những ai cố gắng chống phá các lời mặc khải của TA thì chắc chắn sẽ phải chịu một sự trừng phạt đau đớn.» (34:5). Cách nói nhắm vào các dấu hiệu của TA gợi việc công kích từng chi tiết mặc khải và các phán quyết. Sự chống đối không chỉ dừng ở tên tôn giáo mà đi từ nền tảng thờ duy nhất đến việc thờ phượng, các Sunnah.\n\nTừ mô tả nỗ lực ấy trong nguyên bản diễn tả ý họ tưởng qua mặt Allah hoặc cản việc thi hành lệnh Ngài. Có cách đọc khác với phụ âm jim được đọc đôi và không có alif. (Ibn al-Jazari, An-Nashr fi al-Qira’at al-‘Ashr, phần các cách đọc chương Al-Hajj.) Trong những ý nghĩa được nêu có việc làm người có đức tin chùn bước hoặc làm lời kêu gọi trông bất lực. Nhưng ảo tưởng thoát được đối diện kết cục bị bắt, đưa đến hình phạt. Mưu kế và nhiều người trợ giúp không còn ích.\n\nJinn đã thừa nhận: «Quả thật, chúng tôi tin chắc rằng chúng tôi sẽ không bao giờ có thể làm cho Allah thất bại trên trái đất và chúng tôi sẽ không bao giờ có thể trốn thoát khỏi Ngài.» (72:12). Allah cũng phán: «Hoặc phải chăng những kẻ làm điều tội lỗi tưởng rằng họ có thể qua mặt được TA ư? Thật tệ hại cho điều mà họ xét đoán.» (29:4). Dùng điều Allah ban để chống các dấu hiệu Ngài không biến ân huệ thành bằng chứng được cứu, mà lấy cách dùng sai ấy làm nguyên nhân bất hạnh."}, {"id": "P122", "text": "Câu 39"}, {"id": "P123", "text": "«Ngươi (hỡi Thiên Sứ) hãy nói: “Thượng Đế của Ta nới rộng hay thu hẹp bổng lộc đối với ai trong số bầy tôi của Ngài là tùy ý Ngài muốn. Bất cứ thứ gì các người đã chi dùng (cho con đường chính nghĩa của Ngài) thì đều sẽ được Ngài hoàn lại, và Ngài là Đấng ban bổng lộc tốt nhất.”» (34:39)"}, {"id": "P124", "text": "Một lần nữa, Thiên Sứ được lệnh công bố rằng bổng lộc nằm trong tay Allah. Sau phần nói rõ về thưởng phạt, sự lặp lại này mở thêm ý nghĩa, chứ không chỉ nhắc lại câu chữ. Một cách hiểu là câu trước đối diện với sự tự phụ của những người đa thần vì được ban nhiều của cải, còn câu này hướng đến người có đức tin, củng cố họ và chuẩn bị tâm thế để họ cho đi. Cụm “trong số bầy tôi của Ngài” tôn vinh địa vị làm bầy tôi. Trong nguyên văn, sau lời nói về thu hẹp bổng lộc còn có một từ mang nghĩa “cho người ấy”. Người tin không nhìn cảnh sung túc hay túng thiếu như kẻ đã cắt đứt liên hệ với Thượng Đế, mà nhớ đến sự chăm sóc của Ngài trong cả hai hoàn cảnh. Sung túc có thể giúp họ vâng lời; khó khăn cũng có thể là lòng thương, giữ họ khỏi một thử thách hoặc nâng bậc họ nhờ kiên nhẫn. Một điều có thể suy ngẫm từ cách diễn đạt “cho người ấy” là sự thiếu thốn đôi khi xảy đến vì lợi ích của chính họ, dù ban đầu họ không thích.\nViệc đục hỏng con thuyền ban đầu có vẻ gây hại, nhưng rồi lại bảo vệ nó. Chuyện đứa trẻ cũng cho thấy lòng thương đối với cha mẹ. Al-Khidr giải thích về con thuyền: «Sở dĩ Ta muốn làm cho nó hư đi là bởi vì phía sau những người nghèo đó có một ông vua thường hay dùng cường quyền để chiếm đoạt tất cả các con thuyền (lành lặn và tốt).» (18:79). Về đứa trẻ, xin đối chiếu cả câu: «“Còn đối với đứa trẻ, bởi vì cha mẹ của nó là những người có đức tin, ta sợ rằng sự thái quá và vô đức tin của nó (đối với Allah) sẽ khiến cha mẹ của nó phạm tội.”» (18:80). Vì thế, không phải mọi điều khiến người tin đau buồn lúc đầu đều vắng bóng lòng thương dành cho họ. Hadith qudsi do Abu Hurayrah thuật nêu việc người bầy tôi đến gần Allah: «người bề tôi của TA tiếp tục đến gần TA bằng những hành động thờ phượng tự nguyện cho đến khi TA yêu thương y.» (Abu Hurayrah; Al-Bukhari 6502). Hadith cũng nhắc đến lời cầu xin và tìm sự che chở: «nếu y cầu xin TA chắc chắn Ta sẽ ban cho y, nếu y cầu xin TA phù hộ chắc chắn TA sẽ phù hộ y» (Abu Hurayrah; Al-Bukhari 6502). Dẫu vậy, cái chết mà người có đức tin không mong muốn vẫn đến. Đoạn cuối nêu: «Người ấy ghét cái chết, còn Ta không muốn làm người ấy đau buồn.» (Abu Hurayrah; Al-Bukhari 6502; diễn nghĩa). Sự chăm sóc không có nghĩa là mọi điều người ấy không thích đều bị ngăn lại. Điều cần có là tin cậy Thượng Đế khi Ngài ban cũng như khi Ngài giữ lại.\nTheo một cách hiểu khác, câu trước nói về sự khác nhau trong bổng lộc giữa người này với người khác, còn câu này nói về sự đổi thay trong hoàn cảnh của cùng một người: hôm nay được rộng rãi, mai có thể chật vật, và ngược lại. Như vậy, lời nhắc lại cảnh tỉnh người đa thần đừng tự phụ vì một tình trạng mà họ không có quyền giữ mãi; đồng thời khuyến khích người tin tranh thủ chi dùng khi còn khả năng, trước ngày muốn cho đi mà không còn gì. Cả hai cách hiểu đều hướng đến giải phóng trái tim khỏi cảnh nô lệ cho tiền của. Kẻ hưởng thụ chỉ muốn khoe: «Tôi được nhiều của và mạnh hơn anh vì đông người hơn.» (18:34) hoặc mải mê đua nhau tích lũy; người tin lại hỏi làm sao biến những gì mình có thành phương tiện đến gần Allah.\nĐiều ấy bao gồm cả khoản chi tiêu thường ngày cho gia đình khi có ý mong phần thưởng. Thiên Sứ dạy: «Nếu một người đàn ông chi tiêu cho gia đình của anh ta với niềm hy vọng phần thưởng (ở nơi Allah) thì đó được ghi là một hành động Sadaqah (từ thiện).» (Al-Bukhari 5351; Abu Masud thuật lại). Trong bản thuật của Sa‘d, Thiên Sứ ﷺ nói về việc chi tiêu tìm sự hài lòng của Allah: «Bất cứ khoản nào anh chi để mong Allah hài lòng, anh đều được ban thưởng, kể cả miếng ăn anh đưa vào miệng vợ mình.» (Sa‘d ibn Abi Waqqas; Al-Bukhari 56). Đừng thu hẹp việc cho đi vào một khoản tiền lớn hay một hình thức thiện duy nhất. Cách nói bao quát về bất cứ thứ gì đã chi dùng bao gồm cả chút ít mà người ta đủ sức cho. Có người nghèo chỉ còn sức lao động: họ làm việc, kiếm tiền để bố thí, mà vẫn bị những kẻ đạo đức giả chế giễu. Câu nói về họ, với phần đầu làm bối cảnh, là: «Những kẻ gièm pha các tín đồ rộng rãi và mạnh tay (đóng góp tài sản) cho việc từ thiện, (chê cười) những ai đóng góp tùy khả năng của họ bằng những lời chế giễu thì Allah chế giễu chúng lại và (rồi đây) chúng sẽ phải chịu một sự trừng phạt đau đớn.» (9:79). Một chút ít trong mắt người đời có thể rất lớn nhờ sự chân thành và cố gắng phía sau.\nLời hứa hoàn lại được gắn trực tiếp với Allah, để trấn an người còn sợ tài sản hao hụt. Sự bù đắp không nhất thiết cùng loại với thứ đã cho, cũng không nhất thiết hiện ra thành một số tiền lớn hơn. Nó có thể là phúc lành, sức khỏe, tai họa được đẩy lui hoặc địa vị cao hơn nơi Allah. Hãy tin lời hứa của Ngài, thay vì buộc sự bù đắp phải có hình thức mình chọn. Nhìn vào phép tính trước mắt, người ta có thể tưởng bố thí làm tài sản giảm còn cho vay lấy lãi làm nó tăng. Nhưng Allah phán: «Allah xóa bỏ (định chế) 'Riba' (cho vay lấy lãi) và làm phát đạt việc bố thí (Sadaqah)» (2:276). Sự tăng trưởng của bố thí và sự tiêu hủy của lãi cho vay không thể chỉ nhận ra qua con số tức thời. Đó là giới hạn của những người: «Họ chỉ biết những gì được nhìn thấy từ đời sống trần tục này còn đối với cuộc sống Đời Sau thì họ lại lơ là, không quan tâm.» (30:7). Họ thấy bề ngoài của tăng giảm mà quên hậu quả của việc làm nơi Allah.\n
