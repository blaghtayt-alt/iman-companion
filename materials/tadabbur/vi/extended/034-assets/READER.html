erse-8-42"}, {"start": 180559, "end": 180613, "target": "verse-34-53"}, {"start": 182589, "end": 182777, "target": "verse-13-10"}, {"start": 182843, "end": 182913, "target": "verse-42-11"}, {"start": 183101, "end": 183232, "target": "verse-34-49"}, {"start": 183371, "end": 183531, "target": "verse-17-81"}, {"start": 183723, "end": 183937, "target": "verse-5-22"}, {"start": 186060, "end": 186317, "target": "verse-34-50"}, {"start": 187406, "end": 187572, "target": "verse-34-51"}, {"start": 188068, "end": 188290, "target": "verse-8-50"}, {"start": 188479, "end": 188609, "target": "report-hec5463"}, {"start": 189198, "end": 189322, "target": "verse-34-52"}, {"start": 190374, "end": 190473, "target": "verse-34-53"}, {"start": 190913, "end": 191029, "target": "verse-34-48"}, {"start": 191387, "end": 191578, "target": "verse-34-54"}, {"start": 191792, "end": 191877, "target": "verse-34-35"}, {"start": 192450, "end": 192490, "target": "verse-77-36"}, {"start": 192515, "end": 192587, "target": "verse-23-108"}, {"start": 193602, "end": 193661, "target": "report-hec3410"}, {"start": 193761, "end": 193818, "target": "report-hec3410"}, {"start": 193908, "end": 193941, "target": "report-hec3410"}, {"start": 194299, "end": 194332, "target": "verse-74-18"}], "notes": {"intro": "GHI CHÚ\n\nCác ghi chú về câu Kinh dưới đây thuộc bản dịch được chọn. Toàn câu đi kèm giúp làm rõ điều được ghi chú. Những đánh giá và tên bộ sưu tập của các bản thuật thuộc đúng nguồn được trích; các nhận định khác nhau vẫn được nêu riêng tại chỗ có liên quan.\n", "entries": [{"id": "qnote-4-77", "heading": "4:77 — Ngữ cảnh và ghi chú của bản dịch", "text": "Phải chăng Ngươi (hỡi Thiên Sứ Muhammad) không nhìn thấy những người khi có lời bảo: “Các người hãy ngưng chiến, hãy chu đáo thiết lập lễ nguyện Salah và hãy xuất Zakah”.[1] Nhưng rồi sau đó, khi có lệnh bắt buộc họ phải chiến đấu thì một thành phần trong số họ sợ thiên hạ giống như sợ Allah, thậm chí còn sợ hơn. họ than: “Lạy Thượng Đế của bầy tôi, tại sao Ngài lại ban lệnh chiến đấu ngay lúc này vậy, phải chi Ngài trì hoãn cho bầy tôi thêm một thời gian nữa (để bầy tôi được hưởng thụ cuộc sống).” Ngươi (hỡi Thiên Sứ Muhammad) hãy nói với họ: “Vật chất của cuộc sống trần gian này chỉ là ít ỏi trong khi cõi Đời Sau tốt đẹp hơn dành cho người ngoan đạo; và các ngươi sẽ không bị đối xử bất công một chút nào.”\n\n[1] Mệnh lệnh này được ban xuống khi một số Sahabah của Thiên Sứ Muhammad ﷺ đã yêu cầu đứng lên chiến đấu nhưng không được chấp nhận bởi lúc đó Islam chưa đủ mạnh. Mãi đến khi Thiên Sứ dời cư đến Madinah thì lệnh chiến đấu mới được ban hành vì lực lượng Islam lúc bấy giờ đã vững chắc và hùng mạnh."}, {"id": "qnote-2-180", "heading": "2:180 — Ngữ cảnh và ghi chú của bản dịch", "text": "Các ngươi được sắc lệnh: khi ai đó trong các ngươi sắp từ trần, nếu y để lại tài sản thì y phải lập di chúc cho cha mẹ và họ hàng thân thuộc một cách hợp lý.[1] Đó là bổn phận của những người ngoan đạo.\n\n[1] Câu Kinh này được ban xuống trước các câu Kinh về giáo luật chia tài sản thừa kế. Sau khi các câu Kinh về giáo luật chia tài sản thừa kế được thiên khải thì qui định lập di chúc cho cha mẹ được xóa bỏ chỉ còn lại qui định lập di chúc cho bà con họ hàng không nằm trong nhóm thừa kế."}, {"id": "qnote-2-258", "heading": "2:258 — Ngữ cảnh và ghi chú của bản dịch", "text": "Ngươi (hỡi Thiên Sứ Muhammad) có thấy kẻ đã tranh luận với Ibrahim về Thượng Đế của Y, kẻ mà hắn đã được Allah ban cho vương quyền (vua Nimrud)? Khi Ibrahim nói: “Thượng Đế của tôi là Đấng làm cho sống và làm cho chết.” (Nimrud) bảo: “Ta cũng có thể làm cho sống và làm cho chết.”[1] Ibrahim nói: “Quả thật, Allah là Đấng làm cho mặt trời mọc lên ở hướng đông, vậy bệ hạ hãy làm cho nó mọc lên ở hướng tây xem nào.” Thế là kẻ vô đức tin đã bối rối (vì đuối lý). Quả thật, Allah không hướng dẫn đám người sai quấy.\n\n[1] Vua Nimrud sau khi khẳng định với Thiên Sứ Ibrahim rằng hắn cũng làm cho sống và làm cho chết thì hắn liền ra lệnh quân lính của hắn mang hai tù nhân ra trình diện trước mặt hắn, rồi hắn ra lệnh giết chết một người và tha mạng cho một người còn lại."}, {"id": "report-hec5435", "heading": "Ghi chú về Muslim 657", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Muslim ghi]"}, {"id": "report-hec3035", "heading": "Ghi chú về Muslim 2454", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Muslim ghi]"}, {"id": "report-hec5840", "heading": "Ghi chú về At-Tirmidhi và Ibn Majah", "text": "Đánh giá trong nguồn được trích\n\n[Hasan (tốt)]\n\nBộ sưu tập\n\n[Do At-Tirmizdi và Ibnu Majah ghi]"}, {"id": "report-hec3298", "heading": "Ghi chú về Muslim 2999", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Muslim ghi]"}, {"id": "report-hec6404", "heading": "Ghi chú về Muslim 1910", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Muslim ghi]"}, {"id": "report-hec6331", "heading": "Ghi chú về Muslim 2655", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Muslim ghi]"}, {"id": "report-hec5493", "heading": "Ghi chú về Muslim 2664", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Muslim ghi]"}, {"id": "report-hec3736", "heading": "Ghi chú về At-Tirmidhi 2336", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Al-Tirmizdi ghi - Do Al-Nasaa-i&apos; ghi - Do Ahmad ghi]"}, {"id": "report-hec6460", "heading": "Ghi chú về Al-Bukhari 5351; Abu Masud thuật lại", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Al-Bukhari và Muslim ghi]"}, {"id": "report-hec5463", "heading": "Ghi chú về Abdullah bin Mas‘ud; Muslim 2842", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Muslim ghi]"}, {"id": "report-hec3410", "heading": "Ghi chú về phần giải thích bản dịch; Al-Bukhari và Muslim", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Al-Bukhari và Muslim ghi]"}, {"id": "report-hec6337", "heading": "Ghi chú về Abu Hurayrah; Al-Bukhari 6502", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Al-Bukhari ghi]"}, {"id": "report-hec65231", "heading": "Ghi chú về Abu Hurayrah; Al-Bukhari 4981", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Al-Bukhari và Muslim ghi]"}, {"id": "report-hec3115", "heading": "Ghi chú về Abu Hurayrah; Muslim 2894.01", "text": "Đánh giá trong nguồn được trích\n\n[Sahih (chính xác)]\n\nBộ sưu tập\n\n[Do Al-Bukhari và Muslim ghi]"}, {"id": "authored-g5-01", "heading": "Ghi chú về ‘Aishah; Ibn Majah 3803; Darussalam: yếu", "text": "Bản ghi Ibn Majah 3803 được Darussalam xếp là yếu. Trong Hisnul Muslim, mục 218 với khung cảnh tin vui hoặc tin buồn ghi đánh giá sahih của Al-Albani. Đây là hai đánh giá khác nhau."}, {"id": "authored-g5-02", "heading": "Ghi chú về Ibn ‘Abbas; Muslim 131.02, tiếp theo 131.01; diễn nghĩa", "text": "Đây là lời kết trong Muslim 131.02, nối tiếp nội dung 131.01 về việc ghi nhận điều thiện và điều xấu. Đoạn diễn nghĩa giữ cách hiểu về người tự đẩy mình đến diệt vong trong ngữ cảnh sự rộng rãi ấy."}, {"id": "authored-g5-03", "heading": "Ghi chú về Abu Hurayrah thuật; Muslim 20", "text": "Abu Bakr nói với Umar; Abu Hurayrah truyền lại cuộc trao đổi. Bản Muslim 20 này dùng sợi dây buộc, khác bản dùng con dê."}, {"id": "authored-g5-04", "heading": "Ghi chú về An-Nawwas ibn Sam‘an; Muslim 2937.01", "text": "An-Nawwas ibn Sam‘an truyền lại lời Thiên Sứ về Dajjal. Bản thuật nêu cả hai điều kiện, trách nhiệm của từng người và sự chăm lo của Allah."}, {"id": "authored-g5-05", "heading": "Ghi chú về Ibn Mas‘ud; Muslim 2723; diễn nghĩa", "text": "Muslim 2723.02 nêu rõ phần mở đầu buổi sáng và cho biết lời tưởng nhớ cũng được nói vào buổi sáng. Lời ca ngợi trong đoạn diễn nghĩa nối với ngữ cảnh bản thuật và lời giảng. Muslim 2723.01 là bản buổi chiều riêng."}, {"id": "authored-g5-07", "heading": "Ghi chú về Ibn Mas‘ud; At-Tirmidhi 1173", "text": "At-Tirmidhi 1173 là lời do Abdullah ibn Mas‘ud truyền lại. At-Tirmidhi ghi hasan gharib; đánh giá Darussalam ghi yếu. Phần giải thích về sự che kín và cám dỗ thuộc lời giảng, ngoài lời trích."}, {"id": "authored-g5-08", "heading": "Ghi chú về Salman, lời của vị đồng hành; Muslim 2451", "text": "Muslim 2451 ghi lời khuyên của Salman do Abu Uthman truyền. Câu chuyện Jibril ở phần sau của trang lưu trữ có đường truyền riêng."}, {"id": "authored-g5-09", "heading": "Ghi chú về Anas; Al-Bukhari 6439", "text": "Anas truyền lại Al-Bukhari 6439: một thung lũng vàng rồi muốn có hai. Bản Ibn ‘Abbas và bản nói hai rồi ba là những bản riêng."}, {"id": "authored-g5-11", "heading": "Ghi chú về Abu Hurayrah; Al-Bukhari 6502; diễn nghĩa", "text": "Hai đoạn đăng trong bản dịch về Al-Bukhari 6502 được trích riêng cho việc tự nguyện và lời cầu xin. Đoạn kết về cái chết và sự đau buồn được diễn nghĩa riêng. Nhận xét rằng cái chết vẫn đến thuộc lời giảng, ngoài lời phán."}, {"id": "authored-g5-12", "heading": "Ghi chú về Sa‘d ibn Abi Waqqas; Al-Bukhari 56", "text": "Sa‘d ibn Abi Waqqas truyền lại Al-Bukhari 56 về chi tiêu nói chung và miếng ăn đưa vào miệng vợ. Bản Abu Mas‘ud về chi tiêu cho gia đình trong Al-Bukhari 5351 là bản riêng."}, {"id": "authored-g5-13", "heading": "Ghi chú về Abu Hurayrah; Al-Bukhari 4981; diễn nghĩa", "text": "Abu Hurayrah truyền lại Al-Bukhari 4981. Câu về dấu lạ và đức tin được diễn nghĩa riêng; câu tiếp về mặc khải và niềm hy vọng có nhiều người theo được trích nguyên bản dịch đã đăng, với nguồn riêng."}, {"id": "authored-g5-06", "heading": "Ghi chú về Al-Bukhari 2731–2732; diễn nghĩa", "text": "Lời quyết tâm trong cuộc thương lượng Hudaybiyyah được nói với Budayl trong trường hợp Quraysh từ chối đề nghị đình chiến. Ở đây, cách nói nguyên văn về cổ được lời giảng giải thích là sẵn sàng hy sinh mạng sống."}, {"id": "authored-g5-10", "heading": "Ghi chú về Abu Hurayrah; Muslim 2894.01; diễn nghĩa", "text": "Muslim 2894.01 nêu sông Euphrates rút để lộ núi vàng, rồi cuộc tranh giành khiến chín mươi chín trong một trăm người bị giết. Lời mỗi người là hy vọng sống sót. Đoạn bản dịch đã đăng giữ nguyên chữ và nguồn riêng; lời về nước sông rút và lời mong sống sót được diễn nghĩa riêng. Muslim 2894.03 về kho vàng và lệnh không lấy gì là một bản khác."}, {"id": "at-tayalisi-115-numbering", "heading": "Ghi chú về At-Tayalisi 115", "text": "At-Tayalisi 115: theo cách đánh số của nguồn dẫn."}]}, "verseSources": [{"id": "verse-1-1", "text": "1:1 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-34-1", "text": "34:1 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-25-32", "text": "25:32 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-9-124", "text": "9:124 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-1-2", "text": "1:2 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-6-1", "text": "6:1 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-18-1", "text": "18:1 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-1-4", "text": "1:4 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-3-178", "text": "3:178 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-18-82", "text": "18:82 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-17-52", "text": "17:52 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-34-2", "text": "34:2 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-35-10", "text": "35:10 — Hasan Abdulkarim — v1.0.1"}, {"id": "verse-20-45", "text": "20:45 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-20-46", "text": "20:46 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-35-45", "text": "35:45 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-34-3", "text": "34:3 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-75-5", "text": "75:5 — Nhóm biên dịch Rowwad — v1.0.9-csv.1"}, {"id": "verse-31-16", "text": "31:16 — Hasan Abdulkarim — v1
