の預言者にも、人々が信じるような御徴が与えられたこと、自分には、アッラーが下された啓示が与えられたことを挙げ、それによって、復活の日に、最も従う者の多い預言者であることを望んだ（ブハーリー4981、伝承の意味）。この解釈では、警告は、さらに重くなる。それぞれの論証を与えられながら使徒たちを否定した者を、アッラーが罰されたなら、この大きな明白さの後に背を向けた者は、どうなるのか。説明が明らかになるほど、意図して退ける者の責任も増す。\nアブドッラー・ブン・アムルは、最も懲罰の重い人々として、偽信者、食卓の仲間たちのうち不信仰に陥った者、フィルアウンの一族という三者を挙げた（タバリー『جامع البيان』9：132。教友自身の言葉としての伝えである）。『われら*は確かに彼（フィルアウン*）に対し、われら*の御徴[1]を全て見せた。そして彼は（それらを）嘘とし、拒んだのだ』と述べられたフィルアウン（20：56）、そして食卓とともに来た、『誰であろうと、その後あなた方の内で不信仰に陥る者*、本当にわれは彼を、全創造物のいかなるものも罰することのない（ような）罰し方で、罰するであろう』という警告（5：115）には、教訓となる面が見える。同じように、啓示を聞き、使徒の導きを知りながら、不信仰を内に隠し、反対の姿を外に見せる者も、説明される場所に近かったことが、言い訳にはならない。\nこの節は、アッラーの拒み、罰する働きがどうだったか、という問いで結ばれる。アラビア語では、訳文の「わが否認」に当たる語の末尾に本来ある、「私の」を表すヤーが省かれ、その前のラーの短母音イ（カスラ）が、それを示している。アッラーが否定者たちの行いを退けられることは、ただ反対するしかできない人間の非難とは異なる。背を向ける者の力を散らす懲罰として現れ、その人が誇っていたものは、役立たなくなる。ここでの歴史は、現在から切り離された報せではない。否定する者たちの道を繰り返す人への、警告なのである。\n\n第46節\n\n（使徒*よ、彼らに）言ってやれ。「まさに私は、あなた方に一つだけ訓戒する。あなた方がアッラー*に向かって二人ずつ、また一人ずつ立ち上がり、それから熟考することを[1]。あなた方の仲間（ムハンマド*）に、憑きものなど憑いてはいない[2]。彼は（あなた方が味わうことになる）厳しい懲罰に先立つ、あなた方への警告者に過ぎないのだ[3]」。\n\n長い論証と、多様な説明の後、真理を受け入れる道をまとめる、一つの勧めが来る。アッラーのために、二人ずつ、また一人で立ち、その後に考える、という勧めである。「一つだけ訓戒する」という言葉には、助言と、相手を思いやる姿勢が保たれている。使徒は、拒絶を受けた後にも、なお相手の救いを望み、一つの明瞭なことを残す。それを自分自身のところへ持ち帰り、考えてもらうためである。\nこれは、『そして実に私たちとあなた方（のいずれか）が、まさしく導きの上か、あるいは紛れもなき迷いの中にあるのだ[1]』と語った、公正な語りかけの続きでもある（34：24）。力の外見や、耳に入り続ける中傷が、人を支配してしまうことがある。その人には、考える扉を開き、論証を覆っていた騒音の中から引き出す、語りかけが必要になる。\n最初は、訳文の「二人ずつ、また一人ずつ立ち上がり」に当たる行動である。探求するために真剣に動き出すことであり、困惑に身を任せたり、集団の言葉を繰り返すだけで済ませたりすることではない。一つの問題に相反する言葉を聞くと、人の意見の違いに疲れ、もう誰も信用しないと言いたくなることもある。しかし、その疲れによって、導きを求める務めはなくならない。関わっているのは、アッラーのもとでの、自分の行く末だからである。\nまた、意見の中から、自分の欲望に合い、利益と楽さを保証するものを選び、それを真理の探求と呼ぶのでもない。それゆえ、立つことは、アッラーのためと限定される。目的はかれの喜びであり、社会に合わせることでも、地位を得ることでも、非難を恐れる相手を満足させることでもない。\nこの探求の姿の一つが、サルマーンの旅である。宗教を知るために、慣れ親しんだものを離れ、真理へ導く者を求めて、シャーム、モースル、ニシビーン、アンムーリヤを巡った。見出した知に従い、探求は、ついにアラビアの地へ、そしてマディーナの預言者へと至った（アフマド23737、全伝承に基づく意味の記述）。真実な望みは、静止した願いのままではない。人を動かし、その負担を耐えさせる。\n次の、二人ずつ、また一人で、という言葉は、考えるのにふさわしい場を整える。騒がしい集団は、一人の叫ぶ者で乱されることがある。論証も、互いに押し合う、誰も相手を聞かない議論に変わる。最初に世間の意見に逆らうことを恐れ、独りで考えれば受け入れたはずのことを、人前では退ける場合もある。\nたとえば、子供を家庭で教えるというような、不慣れな案が示されると、集まった人々が、実現の可能性や、それぞれの状況に何が合うかを調べる前に、すぐ嘲笑してしまう場合がある。ここで学ぶべき点は、その案そのものを量る前に、集団の影響のもとで判断したことである。\n世間の非難への恐怖は、さらに深くなることもある。イスラーム以前の一部の人々には、思い込みの不名誉に押され、自分の娘を生き埋めにする者さえいた。社会の見方が、自分の中の慈しみと愛に勝ってしまった。この影響の根本は、友人たちの間で礼拝を勧められた若者が、仲間から何と言われるか、一緒にいられなくなるのではないかと気にして、拒み、反発する姿にも見える。しかし、愛情ある助言者が、独りのときに語りかけると、耳を傾け、和らぎ、受け入れることがある。\n独りになること、あるいは導きを望む、誠実で理性的な二人が話すことは、言葉を聞くのを妨げていた影響を弱める。この問題は、宗教から遠い人に限られない。学ぶ者も、仲間の評価を高める分野に熱中し、自分自身や、人々への奉仕に、より必要なものを放置する場合がある。仲間より低い地位に置かれるのを、恥ずかしく感じるからである。アッラーのために立つことは、どちらの場合にも目的を探り、何がかれの喜ばれることなのかへ、問いを戻す。\n探求の意図を純粋にし、外からの影響を静めた後、その人々とともに生きてきた使徒について考える。この人は、長く知り、誠実さ、信頼できること、確かな理性を知っている人物である。経験したことのない、見知らぬ人の話ではない。移住のときにさえ、人々の預けた物が、彼のもとに残っていた（バイハキー12823、該当する記述の意味）。黒石を置くことで争ったときにも、その裁定を受け入れた（タイヤーリスィー115）。その知識と、狂気という評価は、どう両立するのだろう。\nしかも、なぜ危害と危険を引き受け、以前の安らぎを離れ、金を求めない教えへ招くのか。ともにあるクルアーンは、同じものをもたらすよう挑戦するが、人々は、その論証を崩すものを見出せない。\nワリード・ブン・アルムギーラの伝承には、クルアーンの働きが現れながら、人々の圧力で退ける例がある。預言者が読み聞かせると、彼は心を和らげた。そのことを知ったアブー・ジャハルは、民を満足させる言葉を言うよう迫った。ワリードは、聞いたものの際立った美しさを認め、甘美さと輝きを述べていたのに、最後には魔術と呼ぶに至った（ハーキム『المستدرك』2：550。伝承経路の評価には相違がある）。問題は、心に何の働きもなかったことではない。民の、自分への態度を計算するところへ、戻ってしまったことにあった。\n勧めは、使徒の本来の役割で結ばれる。厳しい懲罰に先立って警告する者なのである。狂った者でも、人々から利益を得ようとする者でもない。考えを目覚めさせるべき、近づく結末を警告している。集まりが終わったからといって、聞いたことを考えることまで、終わりにしてはならない。\n\n第47節\n\n（使徒*よ、）言え。「もし、私があなた方に何らかの見返りを求めた[1]としても、それはあなた方のもの。私の見返りは、アッラー*から以外にはないのだ。そしてかれは、全てのことの証人であられる」。\n\n報酬を求めていないことによって、考えるべき点が、さらに明らかになる。警告する者は、その呼びかけを、人々の財産を得る源にしていない。人々が差し出すものから、自分のための実りを求めてもいない。\n求めた報酬は相手のものだという言葉の意味の一つは、そもそも報酬を求めておらず、仮に求めたものがあるとしても、相手へ返す、というものだ。相手の立場まで下りて語りかけ、個人的な利益の思い込みを取り除く。また、ザカート、施し、財産を費やすことへ呼びかける、その利益は、人々自身に戻り、本人が得る報酬ではない、とする解釈もある。さらに広く、呼びかけとクルアーンの利益は、相手の人々のためであり、その導きと、それに従う救いを得るのは人々だ、という意味にも解釈される。伝えることへの報いは、アッラー以外には期待しない。\nこれらの見方は、使命が純粋であることに合流する。相手が受け入れることで、その人々の後ろから、自分の求める利益が増えるのではない。\n結びには、アッラーがすべての証人であると述べられる。使徒の言葉と意図をご存知で、真実も嘘も隠れない。仮にアッラーについて捏造していたなら、その主張と違うことを示す御力もある。使徒のための証しの一つには、使命を伝え終えるまで、支え、名声を高め、守られることがある。ともに生きてきた人物の状態、求めていると非難する報酬がないこと、アッラーが支えられることを考えたなら、残るのは、論証そのものに向き合うことである。証拠を示してもいない動機を主張して、逃れてはならない。\n\n第48節\n\n言うのだ。「実に我が主*は、真理を（虚妄に向けて）投げかけ給い[1]、不可視の世界*を熟知されるお方である」。\n\n主が真理を投じる、その真理は、使徒がもたらした啓示である。虚偽に向き合い、その誤りへの論証を立てる根本が、そこにある。担う者が弱い状態にあったり、議論する者の説明する力が足りなかったりすることで、その真理の力を量ってはならない。語る者が弱くても、クルアーンの論証は立ち続ける。戦いや実行の場で、人々の状態が移り変わっても、誤った信条が、真理へ変わるわけではない。\nそれゆえ、論証が明らかであることと、その担い手の勝敗を区別する必要がある。物質的な力は、論証の代わりにはならず、その力の不足も、論証を無効にしない。\n真理を投じるという表現には、虚偽の根本を打ち、取り除く、啓示の力の像がある。『われら*は真理を虚妄に投げつける。すると、それ（真理）はそれ（虚妄）を割り砕き、どうであろう、それ（虚妄）は消滅してしまう』と仰せられるとおりである（21：18）。頭を打ち砕くという像は、虚偽が、その論拠をもって立ち続けられなくなることを示す。クルアーンは、聞き手を感心させる言葉の巧みさの集まりだけではない。神の唯一性から切り離した一般的な道徳でも、何を真理として立て、どんなシルクを崩したかを考えずに行う習慣でもない。\nそれは、導きと迷いの対立の根本へ入る。この敵意は古い。アーダムが造られた後の報せには、「そこでイブリース（悪魔の別称）は彼（アダム）の周りを廻りながら彼を詳しく調べた。」とある（ムスリム2611）。そこにも、その一面が現れる。啓示は、人間に敵を見分けさせ、その迷わせる働きから救われる道を示すために来た。\n論証が明らかになっても、真理を求めること以外に支配された者は、否定する場合がある。ワリードが、クルアーンの働きを認めながら、民の喜ぶ言葉へ移った、先の伝えのようにである。この論証を聞くことが重い意味を持つため、アッラーは、守りを求める多神崇拝者に、まず安全を与えて聞かせ、その後に、安全な場所へ届けるよう命じられた。『シルク*の徒の誰かが、あなたに庇護を要請してきたら、彼がアッラー*の御言葉（クルアーン*）を耳にする（ことで、その導きを知ることが出来る）まで、彼を庇護してやるがよい[1]。それから彼を、彼にとって安全な場所まで送り届けてやれ』（9：6）。真理を知る機会を与え、恐怖で、啓示を聞くことを妨げないためである。選択を、明証のうえで行う。『滅びる者が明証によって滅び、生きる者が明証によって生きるため[2]』とあるとおりだ（8：42）。\n「我が主」という言葉は、この論証を担う使徒への、主の配慮を思い起こさせる。確かに立つことは、主の見守りから独立した力によって成り立っているのではない。\n節の結びは、さらに意味を明らかにする。真理を下すお方は、見えないことを熟知される。対して、否定する者たちについては、『不可視の世界*について（真理から）遠い場所から（虚妄に満ちた）憶測をしていた』と述べられる（34：53）。アラビア語で見ると、34章48節の訳文「投げかけ給い」と、53節の訳文「憶測をしていた」に当たる動詞には、いずれも投げる像がある。その二つの像は、投げる者、投げるもの、その知の及ぶ範囲で、向き合う。ここには、完全な知をもって真理を下す主がおられる。そこには、学ぶ啓典を根拠として持たず、明証なしに主張を投げる人間がいる。その姿は、標的から遠く離れ、目も閉じて投げ続ける者に似ている。遠さと見えていないことが、その主張の誤りを示す。どれほど確信のある声で語っても、同じである。\nこの違いの働きは、人々の生活を方向づける考え方にも現れる。政治、財産、人と人との関係の見方、たとえば社会主義、資本主義、自由主義、世俗主義が、生活全体の包括的な考え方を示す場合などである。人間の考えが、個別の問題で正しかったり、正しい判断と一致したりする場合はある。しかし、それによって、その包括的な根本が、導きだとは限らない。また、啓示に反する者も同意したという理由で、正しい個別の点まで、すべて否定してはならない。\n見るべきなのは、人間の目的、何を崇拝し、どんな物差しで裁くかを定める根本である。個別の点も、確かめられた真理へ戻す。導きは、被造物への隷属から心を解き、主と行く末を知らせ、目先の利益に限られない人生の方向を与える。\n見えないことを熟知されるお方は、啓示に従うことと、それを捨てることの結末、人々がこれから向き合う状態で必要とすることを、ご存知である。その導きは、人々が結末を経験してから、ようやく不足の一部が分かる、人間の経験と同じではない。人々の現在だけを見る者は、この啓示が復活の時まで役立つことや、マッカで呼びかけが現れたときの弱い者たちが、この宗教を世界へ担うことを、信じ難く思うかもしれない。しかし、その限られた知によって、あり得ないと考えたことも、啓示を下し、その結末をご存知の主には隠れない。\n自分が慣れ親しんだ限られた知を信頼し、まだ見ていない状況に、導きが役立つことを不思議がる場合もある。そのときには、啓示を下されたお方の知の広さを思い起こす必要がある。アッラーの知では、隠れたものと現れたものは同じである。『あなた方の内、言葉を秘める者も、それを露わにする者も、夜にこそこそとする者も、昼に堂々とする者も、（アッラー*には）同じこと』と仰せられる（13：10）。その知を、被造物の知と比較して量ってはならない。『いかなるものも、かれには似ていない[1]。そしてかれはよくお聞きになるお方、よくご覧になるお方である』とあるとおりだ（42：11）。啓示への信頼は、そこから来る。啓示を下された主を知り、その知がすべてを包むことを知ることからであり、人間が、その英知のすべてを把握したと思うことからではない。\n\n第49節\n\n言え。「真理は到来した。そして虚妄は（滅び、もはや）出現することも、回帰することもない」。[1]\n\n主が真理を投じると示した後、真理が来たことが宣言される。その現れこそが、虚偽の無力さを明らかにする。『言うがよい。「真理は到来し、虚妄は消滅した[1]。本当に虚妄は、消滅することになっているのだから』と仰せられるとおりである（17：81）。真理の側は、虚偽が自分から場所を空けてから、伝え、行動しようと待つのではない。\nこの待ち方の誤りは、イスラーイールの子らの、『本当に私たちは、彼らがそこから出て行くまで、絶対にそこには入らないぞ』という言葉にも現れる（5：22）。住民が出ていくことを、自分たちが入る条件にした。向き合うよう命じられたものが消えてから、目的へたどり着きたいかのようである。同じように、改革は、虚偽が後退するのを待つだけでは立ち行かない。真理を示し、それによって立つことである。\n「出現することも、回帰することもない」という訳文には、訳注[1]に示される解釈も含め、区別される複数の意味がある。一つは、来た論証の前に、何かを進めたり、戻したりする力を持たない、というものだ。無力さが明らかとなり、対抗する力が途絶えた。また、最初に創造することも、死後に再び造ることもできない、という解釈がある。始め、戻すことのできないものを、どうして崇拝し、創造主と並べるのか、ということである。\nここで考える意味の一つは、真理が共同体を立て、命を保つものへ導き、倒れても、そこへ戻れば、再び立つための原因を与えることである。一方、虚偽は、この世と来世のことを整える確かな導きを与えず、真理から離れることで生じた腐敗も補えない。\nこれは、イスラーム以外のあり方で、物質的な力を持つ国が成り立つことを、否定する意味ではない。力と財産で国家が成り立つことと、目的、倫理、社会の暮らしが整う生き方へ、共同体が導かれることとは、同じ範囲の話ではない。\n非ムスリムの力を見るとき、外見への思い上がりを防ぐ、二つの面がある。一つは、その一部が持つ、公正、不正の除去、互いの助言といったものは、預言者たちの教えがもたらした意味であることだ。啓示に由来すると本人たちが認めなくても、採用し、それによって強まったもののすべてが、虚偽になるわけではない。\nもう一つは、相対的に優れていることは、その人々のすべてが正しいという証明ではないことだ。ムスリム側の遅れが深刻で、その上にいる者が、倫理や社会に問題を持っていても、完成の頂点に達したように見えることがある。地下の、異なる二つの高さにいる二人を思い浮かべると分かりやすい。下の人には、もう一人が自分より高く見える。しかし、相対的に上であっても、地上へ出たという意味ではない。比較は、最初の人がどれほど低いかを明らかにすることはあっても、二人目が目的地へ達した証明にはならない。\nこのため、力の外見をまねることだけでは、真理の物差しで検討することの代わりにならない。啓示を尊ぶことも、それを実行し、命じられた力の手段を取ることを、免れさせるものではない。\n\n第50節\n\n言ってやれ。「もし私が（真理から）迷ったのなら、私は自分自身に対して（罪を負うべく）迷っているのである。そしてもし（正しく）導かれたのなら、（それは）我が主*が私に啓示されたものゆえのこと。本当にかれはよくお聞きなるお方、（かれを呼ぶ者の）近くにおられるお方」。\n\nこの一連の論証は、初めと同じ、公正な語りかけで結ばれる。使徒は、相手が主張する自分の迷いを、仮定として前に置く。もしそれが起きたなら、その悪い結果は自分に戻ること、そして導きを捨てると、迷いの源は自分自身にあることを示す。\n条件の形で述べたからといって、実際に迷ったと認めたのでも、もたらした啓示を疑ったのでもない。相手の立場まで下りて語りかけ、論証を考えることへ戻し、動機を非難して逃れる道を断つのである。そして、導きのすべてを主へ帰する。主が啓示するものによる、ということである。\n最も誠実で、最も確かな理性を持つ使徒が、自分の導きは、この啓示によると示すなら、それより劣る者が、自分の理性、経験、多くの助け手によって、啓示を必要としなくなることが、どうしてできるだろう。\nもたらしたものは、影響力を得るための手段を巡らせた結果ではない。しもべたちの言葉を聞き、必要をご存知の主からの導きである。よく聞き、近くおられるという結びには、伝える役割に立つ者への安心がある。自分の言葉も、向けられる言葉も、アッラーは聞かれる。自分の必要も、導きへ招く相手の必要も、ご存知である。この対面は、かれの知と見守りから、遠く離れたものではない。\n\n第51節\n\n（使徒*よ、）彼ら（不信仰者*たち）が戦慄する時のことを、目にしたならば。彼らに逃げ道はなく、近い場所から連れて行かれるのだ[1]。\n\n五つ続いた「言え」という命令が、背を向ける者たちへ、公正さと、考えることの扉を開いた後、恐怖の光景が来る。結末への警告を、保つためである。恐れおののき、逃げ道を見出せない姿を、もし目にしたなら、という場面だ。\nこの恐怖が、いつのものかについては、複数の解釈がある。ムスリムの軍勢と、ともに戦う天使たちを見た、バドルの日のこととする解釈がある。また、死の際に、天使たちと、その迎え方を見るときのこととされる。『天使*たちがその顔や背中を殴りつけつつ、不信仰だった者*たち（の魂）を取り上げる時のこと[1]を、あなたが見るのならば！』と仰せられるようにである（8：50）。さらに、否定していたことが現れ、炎が連れて来られる、復活の日の恐怖とする解釈もある。その日、ジャハンナムには七万本の手綱があり、その一本ごとに七万の天使がついて引き、連れて来られると、預言者は知らせた（ムスリム2842、伝承の意味）。\nどの解釈でも、真実を否定する大胆さが恐怖へ変わり、見たものから逃れようとする瞬間が示される。そこへ、逃れられないという答えが来る。アッラーの御力を出し抜き、逃亡によって、かれを無力にすることはできない。\n近い場所から捕らえられるという言葉は、どこかに身を守る場所があるという思い込みを退ける。どこにいても、捕らえる力は届く。この世の罰、死、復活の日、どの場面と捉えても同じである。近さは、その人々を御力が包み、捕らえることが容易であると示す。それまで、持っている力によって、自分は懲罰から遠いと思っていた、その後にである。\n\n第52節\n\nそして彼らは（、その時になって）言う。「私たちはそれ[1]を信じた」。どうして遠い場所から、易々と（信仰を）手に入れられるというのか？[2]\n\nそのとき、人々は信じたと語る。すでに御徴が示され、アッラーの支配と知が説明され、使徒の真実性を考えるよう招かれたのに、背を向けてきた後である。選び、行動できる時に信仰が差し出されていた。そのときには応じず、いま、恐怖とともに認める。\n「易々と（信仰を）手に入れられる」に当たるアラビア語は、手を伸ばして取ることである。根本の像は、近いものへ手を伸ばして取る姿であり、互いに近くから届く、小競り合いを指す語にも、その意味がある。しかし彼らは、いま、遠くなったものを取ろうとしている。人に益となる信仰であり、それが受け入れられるところを過ぎてしまったのである。\nどうして彼らにそれができるのか、という問いは、その時には得られないことを明らかにする。手元にあったのに拒み、取り戻す時が終わってから、戻ることを願った。遠さは、ただ足で渡る距離ではない。状態と状態の隔たりである。啓示に招かれたときに自分で選ぶ信仰と、もはや押し返せないものを目の前にして、認めざるを得ないことには、違いがある。伸ばしても、望むものへ届かない手の像が、その悔しさを見えるようにする。失った近さを、時が過ぎてから取り戻そうとしたのである。\n\n第53節\n\n彼らは確かに以前、それを否定し、不可視の世界*について（真理から）遠い場所から（虚妄に満ちた）憶測をしていたというのに。\n\n遅れた願いは、説明が届かないまま、気づかずに過ごした後に、起こったのではない。以前、それが示されているときに不信仰に陥り、さらに背を向けるだけでなく、真理とその人々に、知らないことを投げつけた。啓示をでっち上げや魔術と呼び、ともに生きてきた使徒を非難し、その背後まで知っているかのように言い放った。しかし、明証から遠いところにいた。\n34章53節の「（虚妄に満ちた）憶測をしていた」に当たるアラビア語には、遠くから投げる像がある。それは、『実に我が主*は、真理を（虚妄に向けて）投げかけ給い[1]、不可視の世界*を熟知されるお方である』との対比を再び示す（34：48）。真理を下すお方は、見えないことをご存知である。一方、彼らは、知らないことに憶測を投げる。\n手を伸ばしても届かないのは、彼らへの不正ではない。信仰への道が近いときに、自分たちで自分を遠ざけ、他者もそこから遠ざけることを選んだ。ついには、自信をもって退けていたことが、目の前に現れた。しかし、それを選べた時へ戻ることは、できなくなったのである。\n\n第54節\n\nそして彼らと、彼らが渇望するもの[1]との間は阻まれた。ちょうど彼らの（先代である）同類者たちが、以前（そう）されたように。本当に彼らは（現世で）、大きな疑惑の中にあった[2]のである。\n\nこの章は、頼っていたものの結末を明らかにする、隔てによって結ばれる。自分たちと、欲するものとの間が、遮られるのである。\nその意味の一つは、愛した財産、子供、この世の楽しみが、得られなくなることだ。結びは、『私たちは財産も子供も（あなた方）より多いし、私たちは（現世でも来世でも、）罰される者などではない』という自慢へ戻る（34：35）。持つものが思い上がりの原因だったが、死が来れば、それを持って行くことも、その中にとどまることもできない。財産に執着し、手を伸ばしたいのに遮られる人、子供とさらに楽しみたいのに、ともにいられる時が終わった人。その姿は、力と安全の源にしたものの無力さを明らかにする。\nまた、時を失ってから望む、悔い改めと信仰との間が遮られることだ、とする解釈もある。宗教への一つ一つの非難、真理に敵対した一つ一つの態度を後悔しても、遅い願いは、行動の時を戻さない。それどころか、懲罰の中では、言い訳することさえ許されない場へ至る。『彼らに（弁明が）許可されることで、言い訳することもない（日）』とあり（77：36）、『そこに、（惨めなまま）下がっていよ。そしてわれに（これ以上）、話しかけるのではない』と告げられる（23：108）。悔しさは、楽しみを失ったことだけに向かうのではない。近くにあった救いを、捨ててしまったことにも向かう。\n同じことは、それ以前の、似たように真実を否定した者たちにも起きた。訳文の「同類者たち」という言葉は、不信仰と背を向ける道が一致した人々を指す。原因が繰り返されたため、報いも繰り返された。\nそして結びは、深く根づいていた状態を示す。訳文の「大きな疑惑」に当たるアラビア語は、不安を引き起こす疑いに陥っていたことを表す。その揺れは、アッラーのために誠実に立ち、明証を求めることにはつながらなかった。啓示が心を目覚めさせそうになるたびに、地位を失う恐れと、ためらいへ戻り、救いへ招くものを押し返し続けて、生涯が終わった。\nここで結びは、アッラーのために、二人ずつ、また一人で立つよう勧めたこととつながる。純粋に考えることは、集団の支配から出る助けになる。しかし、真理が明らかになった後も、集団を満足させる計算を続ければ、最後の瞬間まで、その人をとらえてしまうことがある。\nその例の一つが、死に際のアブー・ターリブである。預言者は、アッラー以外に崇拝に値するものはないと唱えるよう招き、その言葉を、アッラーのもとで彼のために用いたいと願った。講義は、それを彼のための論証と表し、参照した伝承本文は、彼のために証言する言葉と述べる。そばでは、アブー・ジャハルとアブドッラー・ブン・アビー・ウマイヤが、「アブー・ターリブよ、あなたは父アブドル・ムッタリブから受け継いだ先祖伝来の信仰を棄てるのですか」と繰り返し問いかけた。最後に人々へ語ったのは、その宗教にとどまるということだった（ムスリム24a〔並行伝承〕、ブハーリー1360〔講義〕）。判断を先延ばしにできない場でなお、受け継いだものへの熱情が、圧力をかけ続けた。\nワリードの伝えにも、すでに同じ問題が現れていた。クルアーンを聞いて心を動かされながら、民が自分をどう見るか、満足してもらうには何が必要かを、再び計算し始める。『彼は、（使徒*とクルアーン*に対する誹謗を）思索し、準備したのだから』という言葉が、そこにある（74：18）。ここで非難される思索は、明らかになった真理を退けるための計算である。第46節で命じられた、純粋な探求ではない。考えることへの呼びかけと、従うのをためらうことへの警告は、矛盾しない。\nしもべには、導きに従うことを妨げるものと闘い、それが明らかになれば、進んで応じることが必要である。今日、自分で選べることが、明日には、望みながらも隔てられるものになる前に、である。\n\n訳文と出典\nクルアーン：サイード佐藤訳。東京ジャーミイ訳を用いた箇所は、別添の「引用箇所とクルアーン訳の対応」に示した。\n伝承の日本語引用：『サヒーフ・ムスリム』（日本ムスリム協会）ほか、本文に示した伝承集の既刊訳。祈り：『ムスリムの砦』（サイード佐藤・ファーティマ佐藤訳、第一版2007年）。既刊訳の引用と、講義で述べられた伝承の意味の説明とは、本文中で区別した。\n「クルアーン訳と訳注」「伝承の出典と注」に、引用ごとの出典と注を収めた。クルアーン引用を選ぶと、その訳と節に対応する注を開ける。\n", "links": [{"start": 297, "end": 322, "target": "source-186"}, {"start": 329, "end": 399, "target": "source-1"}, {"start": 482, "end": 500, "target": "source-1"}, {"start": 934, "end": 982, "target": "source-2"}, {"start": 1074, "end": 1142, "target": "source-3"}, {"start": 1296, "end": 1316, "target": "source-4"}, {"start": 1385, "end": 1423, "target": "source-5"}, {"start": 1510, "end": 1575, "target": "source-6"}, {"start": 2394, "end": 2410, "target": "source-1"}, {"start": 2483, "end": 2496, "target": "source-7"}, {"start": 2692, "end": 2738, "target": "source-8"}, {"start": 2781, "end": 2812, "target": "source-9"}, {"start": 2838, "end": 2896, "target": "source-10"}, {"start": 3266, "end": 3288, "target": "source-1"}, {"start": 3789, "end": 3873, "target": "source-15"}, {"start": 4206, "end": 4234, "target": "source-170"}, {"start": 4640, "end": 4721, "target": "source-12"}, {"start": 4744, "end": 4804, "target": "source-13"}, {"start": 5047, "end": 5118, "target": "source-14"}, {"start": 5288, "end": 5306, "target": "source-15"}, {"start": 5559, "end": 5761, "target": "source-16"}, {"start": 5809, "end": 5831, "target": "source-16"}, {"start": 5953, "end": 6001, "target": "source-17"}, {"start": 6054, "end": 6106, "target": "source-16"}, {"start": 6581, "end": 6595, "target": "source-16"}, {"start": 6908, "end": 7092, "target": "source-18"}, {"start": 7298, "end": 7363, "target": "source-187"}, {"start": 7915, "end": 7993, "target": "source-135"}, {"start": 8312, "end": 8356, "target": "source-19"}, {"start": 8466, "end": 8492, "target": "source-20"}, {"start": 8678, "end": 8731, "target": "source-21"}, {"start": まれる。「優れた公正と明瞭な意味の言葉とする」「（啓示の時間を）区切って別々にする」「明瞭に区切りつつ、ゆっくりと読誦することを命じる（衣を纏う者章４とその訳注も参照）」（イブン・アーシュール1９：2０参照）。\n\nサイード佐藤訳　9章124節\nスーラ*が下ると、彼ら（偽信者*たち）の内のある者は言う。「一体あなた方の内の誰が、これで（更なる）信仰心を上乗せするというのか？」信仰する者たちこそは、（スーラ*の啓示によって、更なる）信仰心を上乗せするのである。そして彼らは、（授けられた信仰心に）心躍らせるのだ。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　1章2節\n全創造物の主*、アッラー*に称賛*あれ、\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　6章1節\n諸天と大地を創造され、闇と光[1]をお創りになったアッラー*に、称賛*あれ。その後に及んで不信仰に陥った者*たちは、自分たちの主*に対して（かれ以外のものを）並べている[2]。\n訳注\n[1]　この「闇」と「光」については、雌牛章257の訳注を参照。 [2]　つまり、シルク*を犯しているということ。\n\nサイード佐藤訳　18章1節\nその僕（ムハンマド*）に啓典（クルアーン*）をお下しになり、それにいかなる歪み[1]ももたらされなかったアッラー*に、称賛*あれ。\n訳注\n[1]　「歪み」とは、真理からの逸脱のこと（ムヤッサル2９３頁参照）。\n\nサイード佐藤訳　1章4節\n報いの日*の支配者（に）。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　3章178節\n不信仰に陥った者*たちは、われら*が彼らに（懲罰を下さず）猶予を与えてやっていることを、自分たちにとって善いことなどと断じて思ってはならない。われらは、彼らが自分たちに罪を上乗せさせるべく、猶予を与えてやっているに外ならないのだから。そして彼らには、屈辱的な懲罰がある。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　18章82節\nまた壁はといえば、それは町の孤児である、二人の少年のものであった。そしてその下には、二人のための財宝があり、二人の父親は正しい*人であった。それであなたの主は、二人が成熟し[1]、自分たちの財宝を掘り出すことを、あなたの主からの（彼らに対する）ご慈悲として、お望みになったのだ。そして（ムーサー*よ、）私はそれ（ら）を、自分の一存でしたわけではない[2]。それが、あなたが我慢することの出来なかったことの、解釈である。」\n訳注\n[1]　この「成熟」とは、成人*することであるとされる（イブン・カスィール５：1８７参照）。「成人*」については、婦人章６の「結婚」についての訳注を参照。 [2]　ハディルはこれらのことを、アッラー*からのご命令のもとに行ったのである（ムヤッサル３０2頁参照）。\n\nサイード佐藤訳　17章52節\nかれ（アッラー*）があなた方を（墓場から出て来るよう）お呼びになり、あなた方がかれを称賛*しつつ（そのご命令に）応じ、自分たちは（現世で）少しの間しか過ごさなかったと思う[1]日。\n訳注\n[1]　「（現世で）少ししか過ごさなかったと思う」については、ユーヌス*章４５とその訳注、及びター・ハー章1０３、信仰者たち章11３－11４、ビサンチン章５５、砂丘章３５、引き離すもの章４６も参照。\n\nサイード佐藤訳　35章10節\n権勢を求める者があるならば（、アッラー*からそれを求めよ[1]）、アッラー*にこそ全ての威力が属するのだ。かれにこそ善き言葉は昇っていくのであり、正しい行い*がそれを上げる[2]。そして悪を策謀する者たち、彼らには厳しい懲罰があり、それらの者たちの策謀こそは、ご破算になるのだ。\n訳注\n[1]　アッラー*ではなく、その創造物に権勢を求める者は、かれからそれを授かる。そしてアッラー*からの権勢とは、かれへの服従によって得られるものなのであう。（前掲書、同頁参照）。 [2]　「善き言葉」は、シャハーダ*の言葉、唱念、奇岩、クルアーン*の読誦、イスラーム*学の教授など、全ての善い言葉を指すとされる。本文のように「正しい行い*」」が「善き言葉」を上げる、つまり正しい行い*が伴うわない言葉は受け入れられない、といった解釈の外にも、①「善き言葉」が「正しい行い*」を上げる、つまりシャハーダ*の言葉を語ったムスリム*からこそ、正しい行い*は受け入れられる、②アッラー*がそれを「上げて」お受入れになる、といった解釈もある（イブン・ジュザイ2：212－21３参照）。\n\nサイード佐藤訳　20章45節\n彼ら二人は、申し上げた。「我らが主*よ、本当に私たちは、彼が私たちに対して早まったこと[1]をしたり、あるいは（真理に対して）高慢になったりすることを怖れます」。\n訳注\n[1]　つまり、彼らを罰すること（ムヤッサル３1４頁参照）。\n\nサイード佐藤訳　20章46節\nかれは仰せられた。「怖れるのではない。実にわれは、あなた方二人と共にあり、（あなた方のことを）聞き、見ているのだから」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　35章45節\nもしアッラー*が人々を彼らが稼いだもの[1]ゆえにお咎めになれば、かれは（大地の）その表面に、いかなる生物も残してはおかなかっただろう[2]。しかしかれは、彼ら（の懲罰）を定められた時まで遅らせ給うのだ。そして彼らの（懲罰の）時が来たら、（かれは彼らを罰し給う、）本当にアッラー*はもとより、その僕たちをよくご覧になるお方。\n訳注\n[1]　「稼いだもの」とは、罪のこと（前掲書４４０頁参照）。 [2]　同様のアーヤ*として、蜜蜂章６1とその訳注を参照。\n\nサイード佐藤訳　34章2節\nかれは大地の中に入り込むものも、そこから出てくるものも、天から落ちてくるものも、そこへ昇っていくもの[1]も、（全て）ご存知である。かれは慈愛深い*お方、赦し深いお方。\n訳注\n[1]　「大地の中に入り込むもの」とは、水などを、「そこから出てくるもの」とは、植物、鉱物、水などを、「天から落ちてくるもの」とは雨、天使*、啓示などを、「そこへ昇っていくもの」とは、天使*、人間の行いなどを指す、とされる（ムヤッサル４2８頁参照） 。\n\nサイード佐藤訳　34章3節\n不信仰に陥った者*たちは、言った。「（復活*の）その時は、私たちにはやって来ない」。（使徒*よ、）言ってやれ。「いや、不可視の世界*をご存知である我が主*にかけて、それは必ずや、あなた方のもとに到来する。諸天であろうが大地であろうが、僅かな重みでも、かれ（の知識）から免れることはない。また、それより小さいものでも、大きなものでも、明白な書（守られし碑板*）に（予め記されてい）ないものはないのだ[1]。\n訳注\n[1]　同様のアーヤ*として、婦人章４０、家畜章５９、ユーヌス*章６1も参照。\n\nサイード佐藤訳　75章5節\nいや、（不信仰な）人間は、自らの前途において[1]放逸であることを欲し（、復活を否定し）ている。\n訳注\n[1]　ほかにも、「自分自身の目的と欲望の追求において」「復活の日*が到来する前に」といった解釈もある（イブン・ジュザイ2：５1３参照）。\n\nサイード佐藤訳　31章16節\n（ルクマーンは言った。）「我が息子よ、実にそれが（悪行であれ、善行であれ）、たとえ芥子種一粒の重さ（ほどのもの）であり、岩の中にあったとしても、または諸天（のどこか）、あるいは大地（のどこか）にあったとしても、アッラー*は（復活の日*）それを持ち出してこられ（、秤におかけにな）るのだ。本当にアッラーはまさしく、霊妙な*お方、（全てに）通暁されたお方なのだから。[1]\n訳注\n[1]　同様の意味のアーヤ*として、婦人賞４０、洞窟章４９、預言者*たち章４７、地震章７－８なども参照。\n\nサイード佐藤訳　4章104節\nあなた方は、敵を追うことに弱気になってはならない。あなた方が苦しかったとしても、本当に彼らも、あなた方が苦しむように苦しんでいるのだから。しかもあなた方は、彼らが期待してはいないもの[1]をアッラー*から期待している。アッラー*はもとより、全知者、英知あふれる*お方。\n訳注\n[1]　来世での褒美や、勝利、アッラーからのご援助のこと（ムヤッサル95頁参照）。\n\nサイード佐藤訳　34章6節\nそして知識を授けられた者たちは、あなたの主*からあなたに下されたもの（クルアーン*）が真理であり、偉力ならびない*お方、称賛*されるべきお方（アッラー*）の道へと導いてくれるものであると分かるのだ。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　72章4節\nまた、私たちの内の愚か者[1]が、アッラー*に対して（真実から）逸脱したこと[2]を言っていたということ。\n訳注\n[1]　この「愚か者」には、「イブリース*」「シルク*を犯すジン*」といった解釈がある（イブン・カスィール８：2３９参照）。 [2]　洞窟章1４の同様の表現と、その訳注も参照。\n\nサイード佐藤訳　15章90節\n同様にわれら*は、分断する者たち[1]にも（懲罰を）下したのだ。\n訳注\n[1]　「分断する者たち」とは、クルアーン*のある部分は信じるが、別の部分は信じない、という啓典の民*や、それ以外の不信仰者*たちのことであるとされる（ムヤッサル2６６頁参照）。\n\nサイード佐藤訳　15章91節\nクルアーン*を、ばらばらにした[1]者たちに。\n訳注\n[1]　「クルアーン*をばらばらにした」の解釈には、「アーヤ*９０と同様の意味」「クルアーン*における彼らの意見を、『嘘』『魔術』『占い師の言葉』『詩』などという風に、『ばらばらにした』」「魔術と見なした」「嘘とした」といった諸説がある（アル＝クルトゥビー1０：５８－５９頁参照）。\n\nサイード佐藤訳　41章26節\n不信仰に陥った者*たちは（、互いに助言し合って、こう）言った。このクルアーン*には耳を傾けず、それ（読誦）に対して戯言を言って（邪魔して）やれ[1]。（それによって読誦を阻み、）あなた方が優勢となるように」。\n訳注\n[1]　クライシュ族*の不信仰者*らは、預言者*がクルアーンを読誦すると、口笛や拍手をしたり、雑音を立てたりして、それを妨害した（アッ＝タバリー９：７1９1参照）。\n\nサイード佐藤訳　53章61節\n得意然となっ（て、そこから背いた）たままで？\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　8章36節\n本当に不信仰に陥った者*たちは、アッラー*の道を阻むべく、彼らの財産を費やす。彼らはそれを費やすであろう。やがてそれは彼らにとっての悲痛となり、それから彼らは打ち負かされるのだ。そして不信仰だった者*たちは、地獄へと召集させられるのである。[1]\n訳注\n[1]　このアーヤ*は一悦に、バドルの戦い*での敗戦の雪辱を果たすべく、再戦にむけて大金を費やしたアブー・スフヤーン*に関して下ったとされる。しかしアーヤ*の意味は、同様の状態にある全ての不信仰者*に当てはまるものである（イブン・カスィール４：５３参照）。\n\nサイード佐藤訳　34章33節\nそして、抑圧されていた者たちは高慢だった者たちに言う。「いや、私たちがアッラー*を否定し、かれに（崇拝の）同位者を置くよう、あなた方が私たちに命じていた時、（あなた方の）夜と昼の策謀が（私たちを破滅させたのだ）」。そして懲罰を目の当たりにする時、彼らは（余りの恐怖ゆえ）後悔の念を露わに出来ない[1]。また、われら*は不信仰だった者*たちの首に、枷を縛り付ける。一体彼らが報われるのは、自分たちが（現世で）行っていたこと（によるもの）以外の、何ものでもないのではないか？\n訳注\n[1]　「後悔の念を露わに出来ない」という表現については、ユーヌス*章５４の訳注を参照。\n\nサイード佐藤訳　8章32節\n彼らが、（こう）言った時のこと（を思い起させるがよい）。「アッラー*よ、もしこれが本当にあなたの御許からの真実であるなら、天から私たちの上に石をお降らしになるか、あるいは私たちに痛ましい懲罰をお与え下さい」。[1]\n訳注\n[1]　不信仰者*らは、その無知さ、頑迷さから、懲罰を早く下してみよ、と求めたものだった。家畜章５７－５８、ユーヌス*章５０、フード*章８、雷鳴章６、夜の旅章９2、巡礼*章４７、蜘蛛章５３－５４、サード章1６、相談章1８、階段章1－2なども参照。\n\nサイード佐藤訳　10章15節\nまた、彼ら（シルク*の徒）にわれら*の明白な御徴（アーヤ*）が読誦された時、われらとの拝謁を望まない[1]者たちは（、こう）言った「これではないクルアーン*を披露してみよ。あるいは、それを変えよ[2]」。（使徒*よ、）言ってやるがいい。「私には、それを自分勝手に変更する権利などない。ただ私は、自分に啓示されたものに従うだけなのだから。本当に私は、もし我が主*に逆らったりしたら、偉大なる（復活の*）日の懲罰（が降りかかること）を怖れている」。\n訳注\n[1]　この「望まない」については、アーヤ*７の訳注を参照。 [2]　「これではないクルアーン*」とは、不信仰者*らの崇めていた偶像などを批判し、禁じるようなものではないもののこと（アル＝バガウィー2：４1４参照）。また「（クルアーン*を）変える」こととは、不信仰者*らの意向に沿って、警告のアーヤ*を吉報のアーヤ*に変えたり、何かを非合法とするアーヤ*を合法とするアーヤ*に変えたり、またその逆にしたりすること（アッ＝タバリー５：４1８８参照）。\n\nサイード佐藤訳　34章7節\n不信仰に陥った者*たちは（嘲笑しつつ、お互いに）言った。「（死んで）跡形もなくばらばらにされた後、本当にあなた方は新たに創造されるのだ、などとあなた方に告げる男[1]を、あなた方に見せてやろうか？」\n訳注\n[1]　復活を説く預言者*ムハンマド*のことを、意図している（前掲書、同頁参照）。\n\nサイード佐藤訳　36章78節\nそして彼は自分自身の創造を忘れて、われら*に対して（許されない）譬え[1]を挙げた。彼は言ったのだ。「誰が、朽ち果てた骨に生を与えるというのか？」\n訳注\n[1]　創造主の力を、創造物の力と同様のものとして推測したことを表す（ムヤッサル４４５頁参照）。\n\nサイード佐藤訳　26章39節\nそして人々には、（こう）言われた。「あなた方は、集合するのか？」[1]\n訳注\n[1]　これは、人々に早く集まることを促す、アラビア語的表現（アル＝バイダーウィー４：2３７参照）。\n\nサイード佐藤訳　26章40節\n（人々は言った。）「私たちは、魔術師たちに従おう。彼らこそが勝利者となったならば」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章8節\n一体、彼はアッラー*に対して嘘を捏造したのか？それとも、彼には憑き物がついている[1]とでも？いや、来世を信じない者たちは（来世においては）懲罰と、（現世においては）遠い迷いの中にある。\n訳注\n[1]　アル＝ヒジュル章６「憑かれた者」の訳注を参照。\n\nサイード佐藤訳　40章26節\nフィルアウン*は、（自分の民の有力者たちに）言った。「私にムーサー*を殺させ、彼を自分の主*に祈らせてみよ。本当に私は、彼があなた方の宗教[1]を変えてしまったり、地上（エジプト）に腐敗*を出現させたりすることを怖れているのだ」。\n訳注\n[1]　フィルアウン*を崇める「宗教」のこと（アル＝クルトゥビー1５：３０５参照）。フィルアウン*は神を自称していた。詩人たち章2９、物語章３８、至高者*章2４も参照。\n\nサイード佐藤訳　47章4節\nゆえに（信仰者たちよ）、あなた方が不信仰に陥った者*たちと（戦場で）会ったならば、首への打撃を（食らわせよ）。やがて、あなた方が彼らを徹底的に痛めつけたならば、戦争が幕を引くまで（捕虜に）綱を縛りつけ、後に情けをかけて（無償で解放して）やるか、身代金（を受け取って解放する）か（、するのだ）。[1]。（事は、）そうなのである。そしてアッラー*がお望みであったなら、（信仰者たちを、戦いなしで）彼ら（不信仰者*たち）に勝利させられただろう。だが（戦いが定められたのは）、あなた方の一方を別の一方で試練[2]におかけになるため。かれ（アッラー*）は、アッラー*の道において殺された（信仰）者たちの行い（に対する報い）を、無に帰させ給わない。\n訳注\n[1]　捕虜はこのほか、「死刑」「奴隷*にする」などという選択肢もある（法学派によって相違の 見解あり）が、いずれもその決定権は、イスラーム*国家の統治者、あるいはその代理人に属する（クウェイト法学大全４：2００－2０1）。アーヤ*2０「戦いの命令」についての訳注、および戦利品*章６７－６８とその訳注も参照。 [2]　「試練」にいついては、雌牛章21４、イムラーン家章1８６、悔悟章1６、洞窟章７、蜘蛛章2、王権章2とそれらの訳注も参照。\n\nサイード佐藤訳　34章22節\n（使徒*よ、）言え。「アッラー*を差しおいて、あなた方が（かれの同位者と）主張して（崇めて）いる者たちに、祈るがよい。彼らは諸天においても大地においても、僅かな重みすら有してはいないのだ[1]。そして彼らにはそこにおいて、（アッラー*に対する）いかなる加担もなければ、かれ（アッラー*）には、彼らからのいかなる援助者もない」。\n訳注\n[1]　いかなる害益（がいえき）をもたらす力もない、ということ（アッ＝タバリー８：６７５０参照）。\n\nサイード佐藤訳　34章10節\nわれら*は確かに、われら*の御許からの恩寵[1]を、ダーウード*に授けた。（われら*は言った。）「山々よ、彼と、そして鳥と共に（アッラー*を称え*て）連呼せよ」。また、われら*は彼のために、鉄を柔らかくしてやった。\n訳注\n[1]　預言者*としての使命と、啓典、知識のこと（ムヤッサル４2９頁参照） 。\n\nサイード佐藤訳　73章2節\n少しだけ除いて、（礼拝のため）夜に起きていよ。[1]\n訳注\n[1]　この夜中の礼拝（夜の旅章７９の訳注も参照）の義務は、このアーヤ*が下った一年後、アーヤ*2０によって撤回（「アーヤ*の撤回」については、、雌牛章1０６の訳注を参照）され、ムスリム*たちにとっての任意の行為となった（ムスリム「旅行者の礼拝とその短縮の書」1３９参照）。\n\nサイード佐藤訳　73章3節\nつまり、その半分（を起きて過ごせ）。または、そこから少し（、つまり三分の一まで）減らすがよい。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　73章4節\nあるいは、そこに上乗せし（、三分の二にし）てもよい。そしてクルアーン*を、明瞭に区切りつつ読誦せよ[1]。\n訳注\n[1]　つまり、各文字をはっきりと発音し、伸ばすべき箇所は伸ばしつつ、ゆっくりと読誦すること（イブン・アーシュール2９：2６０参照）。\n\nサイード佐藤訳　73章5節\n（預言者*よ、）本当にわれら*は、あなたに重厚な言葉（クルアーン*）[1]を投げかけよう。\n訳注\n[1]　「重厚な」の解釈には、「そこに含まれる様々な宗教義務」「高貴な」「その褒美がｍ復活の日*の秤に思い」「不信仰者*たちにとって厳しい」「その啓示を受け取る時に、使徒*に大きな負担がかかる」といった諸説がある（アル＝クルトゥビー1９：３８参照）。\n\nサイード佐藤訳　57章25節\nわれら*は確かに、われら*の使徒*たちを明証[1]と共に遣わし、彼らと共に啓典と、人々が公正を行うための秤を下した。またわれら*は、多大な威力と人々への諸益を有する鉄を下した。（それは）アッラー*が、かれ（の宗教）とその使徒*たちをまだ見ぬままに[2]援助する者が誰かを、如実に表し給うためであった。本当にアッラー*は、強力なお方、偉力ならびない*お方であられる。\n訳注\n[1]　この「明証」とは、彼らがもたらしたものの正しさを証明する、証拠のこと（ムヤッサル５４1頁参照）。 [2]　人々から見えないところで、援助するということ。あるいは、自分の眼で見たわけでもないアッラー*とその使徒*たちを、援助するということ（アッ＝シャウカーニー５：236参照）。\n\nサイード佐藤訳　34章11節\n（われら*は命じた。）「すっぽり覆うもの（鎧）をこしらえ、継ぎ目を（いい按配に）調整[1]せよ。（ダーウード*とその一族よ、）あなた方は正しい行い*を行え。本当にわれら*は、あなた方の行いを見る者なのだから」。\n訳注\n[1]　部品を小さくし過ぎて華奢（きゃしゃ）にするのでもなく、大きくし過ぎて装着する者の負担にするのでもないように調整せよ、ということ（前掲書、同頁参照）。\n\nサイード佐藤訳　8章60節\nまた（ムスリム*たちよ、）あなた方は彼らに対し、力と、馬をつなぎとめておくことによって、出来る限りの準備[1]をしておくのだ。あなた方はそれによってアッラー*の敵とあなた方の敵、そしてあなた方が（まだ）しらずともアッラー*はご存知であられる、彼ら以外の別の者たち[2]を脅かす。アッラー*の道において何か費やせば、あなた方は不正*を蒙ることなく、ふんだんに報われよう。\n訳注\n[1]　アッ＝サァディー*によれば、この中には、知力・体力・各種兵器などによるあらゆる「準備」のみならず、敵の悪を防ぐ政治力なども含まれる（３2４頁参照）。 [2]　「別の者たち」とは、まだ敵意を露（あらわ）わにしていない者たち（ムヤッサル1８４頁参照）。\n\nサイード佐藤訳　20章13節\nそしてわれは、あなたを（使徒*として）選んだのだ。ならば、（あなたに）啓示されることに、耳を傾けよ。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　7章144節\nかれは仰せられた。「ムーサー*よ、本当にわれは、わが言伝とわが言葉[1]で、あなたを人々の上に選りすぐった。ならば、われがあなたに授けたもの[2]を手にし（て、それを遵守し）、感謝する者の一人となるのだ」。\n訳注\n[1]　「言伝」とは、人々をアッラー*への教えへと招く、使徒*としての使命。「言葉」とは、アッラー*が直接彼に語りかけられたという特別な栄誉のこと（ムヤッサル1６８頁参照）。 [2]　アッラー*のご命じになったことと、禁じられたこと（前掲書、同頁参照）。\n\nサイード佐藤訳　3章144節\nムハンマド*は、一人の使徒*に過ぎない。彼以前にも、使徒*たちが滅び去っていったのである。それでもし彼が死んだり、殺されたりしたら、あなた方は踵を返すのか[1]？踵を返す者があっても、その者が少しもアッラー*を害することはない。アッラー*は（その恩恵に）感謝する者たちに、（善く）お報いになる。\n訳注\n[1]　不信仰へと戻るのか、の意（ムヤッサル68頁参照）。このアーヤ*は、ムスリム*軍がウフドの戦い*で劣勢（れっせい）になった時、「ムハンマド*は戦死した」という噂（うわさ）が流れ、ムスリム*たちの士気が下がり、尻込みし始めた折に下ったとされる（イブン・カスィール2：128参照）。\n\nサイード佐藤訳　7章129節\n彼ら（イスラーイールの子ら*）は、（ムーサー*に）言った。「私たちは、あなたが私たちのところに来る前も、あなたが私たちのところに来てからも、迫害されたのだ[1]」。彼（ムーサー*）は言った。「あなた方の主*は恐らく、あなた方の敵を滅ぼし、あなた方を（エジプトの）地における継承者[2]とされ、あなた方がいかに行うかをご覧になるであろう[3]」。\n訳注\n[1]　ムーサー*到来前と到来後にイスラーイールの子ら*が受けた「迫害」については、アーヤ*12７とその訳注を参照（ムヤッサル1６５頁参照）。 [2]　「継承者」については、雌牛章３０の訳注を参照。 [3]　彼らの土地を継承した後、彼らが感謝深い者たちとなるか、あるいは恩知らずの不信仰者*になるかをご覧になる、の意（ムヤッサル1６５頁参照）。\n\nサイード佐藤訳　7章138節\nわれら*はイスラーイールの子ら*に海を渡らせた。そして彼らは、自分たちの偶像に奉仕し続ける民のところに出くわした。彼ら（イスラーイールの子ら*）は言った。「ムーサー*よ、彼らに神々[1]があるように、私たちにも神（の偶像）を一つ、こしらえてくれ」。彼（ムーサー*）は言った。「本当にあなた方は、無知な民である。\n訳注\n[1]　「神々」については、雌牛章1３３の訳注を参照。\n\nサイード佐藤訳　34章12節\nまたスライマーン*には、その午前（の進行距離）は一ヶ月（の旅程）で、午後（の進行距離）は一ヶ月（の旅程）の風を（、仕えさせた）[1]。そして、われら*は彼のために銅の泉を溶かしてやり[2]、ジン*の内からは、その主*のお許しのもと、彼の前で働く者も（仕えさせた）。彼ら（ジン*）の内、われら*の命令[3]に背く者があれば、われら*は彼に烈火の懲罰の内から、味わわせてやろう。\n訳注\n[1]　彼は一日二ヶ月の旅程を進むこの風を、自分やその他の物を乗せたりして、望みのままに操（あやつ）ったのだという（アッ＝サァディー６７６頁参照）。 [2]　彼の鉱山には、溶けた銅が水の泉のように流れたのだという（アル＝クルトゥビー1４：2７０参照）。彼はそれで、望む物を作ることが出来た（ムヤッサル４2９頁参照） 。 [3]　スライマーン*に従え、というアッラー*のご命令のこと（ムヤッサル４2９頁参照） 。\n\nサイード佐藤訳　38章33節\nそれら（馬）を私のもとに、また連れて来い」。そして（馬が連れて来られると、）彼は（剣で）その足と首を打ち始めた。[1]\n訳注\n[1]　馬を殺したのではなく、愛情をもってたてがみと足を撫（な）でた、という解釈もある（アッ＝タバリー８：７０００参照）。\n\nサイード佐藤訳　73章20節\n（使徒*よ、）本当にあなたの主*は、あなたと、あなたと共にある者の一団が、（時には）夜の三分の二未満、（時には）その半分、（また時には）その三分の一を（礼拝に）立つことをご存知である。そしてアッラー*（のみ）が、夜と昼（の範囲）をお定めにな（り、それをご存知にな）るのだ。かれは、あなた方がそれを数え上げられないことをご存知になり、あなた方の悔悟をお受け入れになった[1]。ならば（夜の礼拝の中で）、クルアーン*から、（あなた方にとって読誦が）容易なものを誦むがよい[2]。かれは、あなた方の内に病人や、アッラー*のご恩寵を求めつつ地上を旅する別の者たち、アッラー*の道において努力奮闘する別の者たちが出てくることも、ご存知になったのだから。ならば（夜の礼拝の中で）、そこ（クルアーン*）から、（あなた方にとって読誦が）容易なものを誦むがよい。そして（義務の）礼拝を遵守*し、浄財*を支払い、アッラー*によき貸付[3]をせよ。あなた方が自分のためにしておく善いことは何であれ、あなた方はそれを（復活の日*に）アッラー*の御許で、（現世で自分たちが行ったもの）より善く、より偉大な報いとして見出すことになるのだから。そしてアッラー*に、お赦しを乞え。本当にアッラーは、赦し深いお方、慈愛深い*お方なのだ。[4]\n訳注\n[1]　アーヤ*2によって夜の礼拝が義務づけられた後、ある種の者は夜の礼拝時間の計算がわからず、その結果、間違いを避けるために夜通しで礼拝し続け、ひどい疲労に襲われるということがあった。このような中、アッラー*は彼らにご慈悲をおかけになり、軽減して下さった（アル＝クルトゥビー1９：５３参照）。 [2]　夜の任意の礼拝が、クルアーン*の読誦によって表わされている。つまり、自分にとって容易に感じられる範囲で、夜に任意の礼拝をせよ、ということ（イブン・カスィール８：2５８参照）。 [3]　アッラー*に「よき貸付」をすることについては、雌牛章2４５の訳注を参照。 [4]　このアーヤ*と、夜の任意の礼拝については、アーヤ*2の訳注も参照。\n\nサイード佐藤訳　34章13節\n彼ら（ジン*）は彼（スライマーン*）のため、ミフラーブ[1]、（銅やガラス製の）像[2]、池のような貯水槽、堅固な鍋といった、彼の望む物を作る。（われら*は言った。）「ダーウード*の一族よ、（アッラー*に）感謝すべく、行え[3]。わが僕の内、僅かな者だけが、感謝する者なのだから」。\n訳注\n[1]　「ミフラーブ*」については、イムラーン家章３７の訳注を参照。 [2]　当時、「像」は合法であった（アル＝クルトゥビー1４：2７３参照）。 [3]　この「行い」とは、アッラー*に服従し、かれのご命令を実行すること（ムヤッサル４2９頁参照）。\n\nサイード佐藤訳　34章15節\n確かにサバア[1]（の民）には、その住まいの中に（アッラー*の御力を示す）御徴があった。右と左に二つの果樹園[2]。（彼らには、こう言われた。）「あなた方の主*の糧から食べ、かれに感謝せよ。（あなた方の国は）よき国であり、（恩恵の主は）赦し深い主*なのだから」。\n訳注\n[1]　「サバア」の民については、スーラ*冒頭の訳注を参照。 [2]　サバアの民の町、マアラブには渓谷（けいこく）があり、彼らはそこにダムを築いていた。その水の利用により、渓谷の両側には豊かな果樹園が広がっていた（アッ＝サァディー６７７頁参照）。\n\nサイード佐藤訳　3章79節\nアッラー*が人間[1]に、啓典と英知[2]と預言者*としての天分を授けられた後、その者が人々に向かって「アッラー*を差しおいて、私を崇拝*せよ」などと言うことはありえない。しかし（そのような者は、こう命じるのが当然なのだ。）「あなた方は、啓典を教え、自らも学んできたことによって、学識豊かな指導者[3]となるのだ」。\n訳注\n[1]　ここでの「人間」は全人類のことだが、特にイーサー*、あるいは預言者*ムハンマド*のことを指していると言われる（アル＝バガウィー1：462‐463参照）。 [2]　この「英知」は理解・知識、あるいは人々を裁く権威のこと（前掲書、1：463参照）。 [3]　「学識豊かな指導者」という訳語をあてた原語は、「ラッバーニー」の複数形。アッ＝タバリー*はこれが「ラッバ（面倒を見る、育成する）」という語の派生形とし、宗教的知識を備えつつも、現世分野においても人々の教育と指導に携（たずさ）わる者である、と解釈している（3：1849参照）。\n\nサイード佐藤訳　4章77節\n（使徒*よ、）あなたは知らなかったのか、「（敵に）手を出すのではない。そして礼拝を遵守し*、浄財*を施すのだ」と言われた者たち[1]を？にも関わらず、彼らに戦闘が義務づけられた時には、どうであろうか、彼らの一派はあたかもアッラー*を恐れるか、あるいはそれよりもっと強い恐怖でもって、人々[2]を恐れるのだ。そして、彼らは（こう）言う。「我らが主*よ。あなたはどうして、私たちに戦闘を義務づけられたのですか？暫しの間、私たちに猶予を与えて下さいませんか？」（使徒*よ、）言ってやるがいい。「現世の享楽は僅かなものであるが、来世の方が敬虔*である者たちにとって、より善いのだ。そしてあなた方は、糸くず[3]ほどさえも不正*に扱われることがない」。\n訳注\n[1]　マッカ*時代、一部のムスリム*は不信仰者*たちの迫害に耐えかねて、彼らとの戦闘が許可されることを待ち望んでいた。また一説には、このアーヤ*はユダヤ教徒*の一派に関して下ったのだ、とも言われる（アッ＝タバリー3：2413‐2415参照）。 [2]　ここでの「人々」は、マッカ*のシルク*の徒である、と言われる（アル＝バガウィー1：664参照）。 [3]　「糸くず」については、アーヤ*49の訳注を参照。\n\nサイード佐藤訳　36章20節\nそして（彼らが使徒たちを手にかけようとした時）、町の一番遠くから、一人の男が急いでやって来た。彼は言った。「我が民よ、使徒たちに従うのだ。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　36章14節\nわれら*が彼らに（アッラー*への信仰と、シルク*の放棄へと招く）二人（の使徒）を遣わし、彼らが二人を噓つき呼ばわりした時のこと。それでわれら*は（その二人を）三人目（の使徒）で強化した。すると、彼ら（使徒たち）は言った。「本当に私たちは、あなた方へと遣わされたものなのです」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　106章4節\n空腹ゆえに食べ物を彼らにお授けになり、彼らを恐怖から安らげて下さった[1]お方を。\n訳注\n[1]　アーヤ*2の訳注、雌牛章12５の訳注、蟻章９1「聖なる地」の訳注も参照。\n\nサイード佐藤訳　28章57節\n彼ら（マッカ*の不信仰者*たち）は、言った。「もし私たちが、あなたと一緒に導きに従えば、私たちは自分たちの土地（マッカ*）から攫われてしまうだろう[1]」。われら*は彼らに、安全なる聖域[2]を確立してやったのではないか？あらゆるものの果実は、われら*の御許からの糧としてそこに集められて来るのだ。しかし彼らの大半は、（その恩恵のほどが）分からない。\n訳注\n[1]　つまり、シルク*の徒である他のアラブ人たちを敵に回すことで、殺害されたり、捕虜（ほりょ）になったり、財産を奪われたりすること（イブン・カスィール６：2４７参照）。 [2]　「安全なる聖域」とは、マッカ*の聖域のこと。雌牛章12５の訳注、蟻章９1「聖なる地」の訳注も参照。\n\nサイード佐藤訳　34章19節\nそして彼らは（安楽と豊かな暮らしに飽きて）、言った。「我らが主*よ、私たちの（町から町への）旅行（の距離を）を遠ざけて下さい」。こうして彼らが（不信仰によって）自分たちに不正*を働いたので、われら*は彼らを（後世へと）語り継がれるものとし、跡形もなくばらばらにしてやった。本当にその中にはまさしく、忍耐*強く感謝深い[1]全ての者への御徴がある。\n訳注\n[1]　「忍耐*強く感謝深い」については、イブラーヒーム*章５の訳注を参照。\n\nサイード佐藤訳　3章42節\n天使*たちが、（こう）言った時[1]のこと（を思い起こさせよ）。「マルヤム*よ、本当にアッラー*はあなたをお選びになり、清められた。そして全世界の女性の中から、あなたを選りすぐられたのである。\n訳注\n[1]　この時の描写は、マルヤム*章16-21に詳しい。\n\nサイード佐藤訳　3章43節\nマルヤム*よ、あなたの主*に謹んで仕えよ。そして（かれに）サジダ*し、ルクーゥ*する者たちと共にルクーゥ*をするのだ」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　18章35節\nそして彼（不信仰者*）は、自らに不正*を働きつつ[1]、自分の果樹園に入った。彼は（その実りを喜び、）言った。「これ（果樹園）が絶対に、消え失せてしまうとは思わないし、\n訳注\n[1]　つまり不信仰、（アッラー*に対する）反抗、高慢さ、横暴さ、復活の否定という「不正*」を働いていた、ということ（イブン・カスィール５：1５７参照）。\n\nサイード佐藤訳　96章2節\nかれは人間を、一塊の凝血からお創りになった。[1]\n訳注\n[1]　人間の創造の変遷（へんせん）については、巡礼*章５、信仰者たち章1４も参照。\n\nサイード佐藤訳　96章5節\n人間に、彼が知らなかったことを教えて下さった（お方）。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章16節\nそして彼らは（アッラー*のご命令と使徒*に）背いたので、われら*は彼らに、猛烈な洪水を送った。またハムトの実とアスルの木、僅かばかりのスィドル[1]からのものがなる二つの果樹園で、彼らの二つの果樹園と取って換えた。\n訳注\n[1]　これらの植物は、いずれも砂漠性のもの。「ハムト」はいわゆるアラークの木で、苦いものの代名詞。「アスル」は、タマリスクに似た大きな木。「スィドル」はナツメの木に似た、棘のある木のこと（イブン・アーシュール22：1７1参照）。\n\nサイード佐藤訳　67章30節\n（使徒*よ、シルクの徒*に）言うのだ。「言ってみよ、もしあなた方の水が（地下に沈んで）無くなってしまったら、一体誰が、あなた方に湧き水を与えてくれるというのか？」\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　22章11節\n人々の中には、アッラー*を覚束ない形で崇拝*する者[1]がいる。そして自分に善いことが起これば、それに安心し、試練が降りかかれば、顔から引っくり返（って反転す）る[2]。彼は現世と来世において、損をしたのだ。それは明らかな損失なのである。\n訳注\n[1]　弱い信仰心と疑念と共に、または現世的利益への欲望ゆえにイスラーム*に入り、ためらいつつアッラー*を崇拝*する者のたとえ（ムヤッサル３３３頁参照） 。 [2]　つまり、イスラーム*を棄(（す）てる 、ということ（前掲書、同頁参照）。蜘蛛章1０も参照。\n\nサイード佐藤訳　2章180節\nあなた方の誰かが死に面した時、——もし、彼が財産を残したなら——、両親と近親者に対して適切な形で遺言[1]をするよう、あなた方に義務づけられた[2]。（それは）敬虔*な者たちの義務である。\n訳注\n[1]　「適切な形で遺言」することとは、遺言で贈与に関し、貧しい者をよそに豊かな者に財産を譲ったりせず、自分の財産の三分の一以上を贈与したりしないことなどを指す（ムヤッサル27頁参照）。 [2]　このアーヤ*は、各相続人の取り分が定められた遺産相続に関する啓示（婦人章11、12、176参照）前に下ったものと言われる（前掲書、同頁参照）。自分の両親のような遺産相続人にも、遺言で財産を譲（ゆず）ることが出来るという決まりは、最終的には無効化された（アッ＝ティルミズィー2121参照）。\n\nサイード佐藤訳　100章8節\nまた、本当に彼（人間）は、善きもの[1]への愛情において、ことさら激しい者である。\n訳注\n[1]　この「善きもの」は、財産のこと（ムヤッサル６００頁参照）。\n\nサイード佐藤訳　13章28節\n信仰し、その心がアッラー*の唱念で安らぐ者たち（を、お導きになるのだ）。アッラーの唱念によってこそ、心は安らぐのではないか。[1]\n訳注\n[1]　同様のアーヤ*として、集団章2３とその訳注も参照。\n\nサイード佐藤訳　34章17節\n彼らが不信仰であ（り、恩恵への感謝を怠）ったことゆえ、われら*はまさしくそれで彼らに報いたのである。そしてわれら*が不信心この上ない者の外に、（このような）罰を与えることがあろうか？\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章18節\nまた、われら*は彼らと、われら*が祝福を授けた町々[1]との間に、（その近さゆえ互いに）目に見える町々を設け、そこに（ちょうどいい間隔の）旅程を整えた。（そして、われらは彼らにこう言ったのだ。）「夜に昼に、そこを安全に行くがよい」。\n訳注\n[1]　シャーム地方（現在のシリア、パレスチナ周辺地域）のこと、とされる（ムヤッサル４３０頁参照）。\n\nサイード佐藤訳　2章61節\nまた、あなた方が（こう）言った時のこと（を思い起こすのだ）。「ムーサー*よ、私たちは一種類の食べ物には耐えられない。だからあなたの主*にお願いして、私たちに野菜、キュウリ、穀物、レンズ豆、玉葱といった、大地に育つものを出してもらってくれ」。彼（ムーサー*）は言った。「あなた方はより善いものを、それ以下のものと取り換えるというのか？（この荒野を去って）町に行くがよい。そうすればきっと、あなた方の求めるものがあるだろう」。彼らは屈辱と貧困に付きまとわれ、アッラー*のお怒りと共に戻って来た[1]。それというのも彼らはアッラー*の御徴を否定し、不当にも預言者*たちを殺害していたからである。それは彼らが（アッラー*に）反抗し、（かれの法に反することにおいて）度を越していたためなのだ。[2]\n訳注\n[1]　つまり、アッラー*のお怒りがまといついた、という意味（アル=クルトゥビー1:430参照）。 [2]　このように彼らは、アッラー*がお選びになったものよりも、彼ら自身の欲望と選択を常に優先させていた（ムヤッサル9頁参照）。\n\nサイード佐藤訳　55章33節\nジン*と人間の衆よ、もしあなた方が（アッラー*のご命令とご決定から逃れようと）、諸天と大地の端々から脱出できるのであれば、脱出してみよ。あなた方は（アッラー*の）権威なしには、脱出することなど出来ないのだ。[1]\n訳注\n[1]　これは復活の日*のこととも、現世でのこととも言われる（前掲書1７：1６９－1７０参照）。\n\nサイード佐藤訳　6章79節\n本当に私は、諸天と大地を創成されたお方[1]に、我が顔を純正に向ける[2]。そして私は、シルク*の徒の類いではないのだ」。\n訳注\n[1]　頻出名・用語解説の「創成者*」も参照。 [2]「我が顔を純正に向ける」とは、自分の崇拝*行為をアッラー*のみに向ける、ということ。「顔」という語が用いられているのは、それが人間において最も特徴ある部位であるためとされる（アル＝クルトゥビー７：2８参照）。「純正」については雌牛章1３５の訳注を参照。\n\nサイード佐藤訳　15章40節\n彼らの内、精選されたあなたの僕たち[1]はその限りではありませんが」。\n訳注\n[1]　「精選されたアッラー*の僕」については、ユースフ*章2４の訳注を参照。\n\nサイード佐藤訳　34章20節\nまた、イブリース*は確かに、彼ら（人間たち）に対して自分の思い込み[1]を実現し、彼らは信仰者たちの一派以外、彼に従った。\n訳注\n[1]　イブリース*が人類を迷わせ、彼らがアッラー*への不服従において、自分に従うという「思い込み」のこと（ムヤッサル４３０頁参照）。\n\nサイード佐藤訳　14章22節\nそしてシャイターン*は、事が裁決され（、天国の民と地獄の民が振り分けられ）た後、言う。「本当にアッラー*は、あなた方に（復活と報いという）真実の約束を約束され、私もあなた方に（それらが嘘だと）約束した。そして私は、あなた方を裏切ったのだ。また私には、あなた方に対していかなる（正当な）根拠[1]もなかった。ただ、私はあなた方を（不信仰と迷いへと）招き、あなた方は私に応じたのである。ならば、私を責めるのではなく、自分自身を責めよ。私は（この日、アッラー*の懲罰に対する）あなた方の救護者などではないし、あなた方が私の救護者なのでもない。本当に私は、以前（、現世で）あなた方が私を（アッラー*の）同位者として（服従して）いたこと（に対する責任）[2]を、否定した」。本当に不正*者たち、彼らには痛ましい懲罰があるのだ。[3]\n訳注\n[1]　あるいは、自分に従うことを無理強いする「力」もなかった、という意味（ムヤッサル2５８頁参照）。 [2]　つまり、シルク*のこと。 [3]　同様の情景として、カーフ章2７－2９も参照。尚、このアーヤ*の最後の一文は、シャイターン*の言葉の続きという説と、アッラー*の言葉という説がある（アル＝バイダーウィー３：３４６参照）。\n\nサイード佐藤訳　39章9節\n（そのような不信仰者*がよいのか、）それとも来世（の懲罰）を用心し、自分の主*のご慈悲を望みつつ、夜の刻にサジダ*し、起立（しつつ礼拝）する従順な者か？（使徒*よ、）言ってやれ。「一体、（自分の主*と宗教を）知る者たちと、知らない者たちは同等か？本当に教訓を得るのは、澄んだ理性の持ち主だけである」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　2章258節\n（使徒*よ、）あなたは、アッラー*が王権をお授けになったことで（高慢になり）、イブラーヒーム*と、彼の主*について言い争った者[1]を知らないのか？[2]イブラーヒーム*が、「我が主*は、生を授け、死を与えられるお方」と言った時のこと。（しかし）彼（王）は、「私は生かし、死を与える[3]」と言った。（そこで、）イブラーヒーム*は言った。「それなら、本当にアッラー*は、太陽を東から昇らせるお方である。ならば、あなたは太陽を西から昇らせてみよ」。すると、この不信仰だった者*は当惑してしまった。アッラー*は、不正*者である民をお導きにはならないのだ。\n訳注\n[1]　この王の名はナムルーズ、と言われる（アッ＝タバリー2：1505‐1506参照）。旧約聖書のニムロド王との明確な関連性は、不明。 [2]　イブラーヒーム*とその父親、及びその民のやり取りについては、家畜章74-82、マルヤム*章42-48、預言者*たち章52-70、詩人たち章70-89、整列者章85-98、金の装飾章26-28も参照。 [3]　意のままに人を殺し、あるいは生かしておく権力がある、という意味（ムヤッサル43 頁参照）。\n\nサイード佐藤訳　39章29節\nアッラー*は、互いに確執する複数の共同（所有）者がいる（奴隷*の）男と、一人の男（主人）に従順な（奴隷*の）男の譬えを挙げられた[1]。一体、彼ら二人は譬えとして、同等だろうか？アッラー*にこそ全ての称賛*あれ。いや、彼らの大半は知らないのである。\n訳注\n[1]　方針の違う複数の主人に仕えなければならず、彼ら全員を満足させようとして困惑する者が、困惑と疑念の中にあるシルク*の徒にたとえられ、方針が明白なただ一人の主人に仕える者が、安らぎと落ち着きの中にある信仰者にたとえられている（ムヤッサル４６1頁参照）。\n\nサイード佐藤訳　34章23節\nまたかれの御許では、かれがお許しになった者に対してしか、執り成しが益することはない[1]。やがて彼らの心から戦慄が取り除かれると[2]、彼らは（互いに）言う。「あなた方の主*は、なんと仰せられた）。かれは至高の*お方、大いなる*お方であられる」。\n訳注\n[1]　復活の日*の「執り成し」については雌牛章４８、マルヤム*章８７、ター・ハー章1０９とその訳注を参照。 [2]　この「彼ら」は「シルク*の徒」とも、「天使*たち」とも言われる。前者の場合、彼らが復活の日*、自分たちが現世で否定していたことが真理であったことを認める描写となる。また後者の場合、天界での啓示の様子の描写となる（アッ＝サァディー６７８頁参照）。アッラー*が天で何かを語られると、天使*たちは畏怖（いふ）の念ゆえに震（ふる）え上がるとされる（アル＝ブハーリー４８００参照）。\n\nサイード佐藤訳　34章24節\n（使徒*よ、彼らシルク*の徒に）言ってやれ。「あなた方に諸天と大地から、糧を授けられるお方は誰か？」言ってやるのだ。「（それは）アッラー*である。そして実に私たちとあなた方（のいずれか）が、まさしく導きの上か、あるいは紛れもなき迷いの中にあるのだ[1]」。\n訳注\n[1]　天地から糧をお授けになるお方に対し、シルク*を犯している者たちこそが迷いの中にあるのは自明であるが、あえて間接的な問いかけをしている（アル＝クルトゥビー1４：2９８－2９９参照）。\n\nサイード佐藤訳　6章55節\n同様にわれら*は、御徴[1]を明らかにする。そして（それは真理が露わになり、）罪悪者たちの道が浮き彫りになるためなのだ。\n訳注\n[1]　この「御徴」は、不信仰者*らが否定する全ての真理に対する証拠のこと（ムヤッサル1３４頁参照）。\n\nサイード佐藤訳　18章37節\n彼の連れ合い（信仰者）は、彼（不信仰者*）と話し合いつつ、（警告して）言った。「一体あなたは、あなた（の祖父アーダム*）を土からお創りになり[1]、その後に（両親からのものである）一滴の精液から（あなたを創られ）[2]、それから（均整の取れた姿形の）人間として整えて下さったお方を否定するのか？\n訳注\n[1]　アーダム*が土から階段を経（へ）て 創られたことについては、アル＝ヒジュル章2６の訳注を参照。 [2]　人間の創造の変遷については、巡礼*章５、信仰者たち章1４とその訳注を参照。\n\nサイード佐藤訳　34章25節\n言ってやれ。「私たちが罪を犯したことで、あなた方が問われることはなく、私たちもあなた方が行うことで問われはしない」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章26節\n言え。「我らが主*が、（復活の日*に）私たちをお集めになり、それから私たちの間を真理によってお裁きになる。かれは裁決者、全知者であられる」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　13章33節\n一体、あらゆる者をその稼ぐものにおいて司るお方[1]が（崇拝*に値するのか、それとも彼以外の不能な創造物か）？彼らは（創造物の内から）、アッラー*（の崇拝*）に同意者を設けた。（使徒*よ、）言ってやれ。「それらの（同位者の）名（と性質）を述べてみよ[2]。いや、一体あなた方は、かれが地上において関地されないもの[3]について、かれに申し上げるというのか？いや、一体（実体もないのに）言葉の上っ面で、（それを同位者と呼んでいるだけ）なのか？いや、不信仰に陥った者*たちには自分たちの策謀[4]が目映く見せられ、彼らは（アッラー*の）道から阻まれてしまったのだ。誰だろうとアッラー*が迷わせ給う者には、いかなる導き手もない」。\n訳注\n[1]　アッラー*は人の行いを、全て教え上げられるお方（ムヤッサル2５３頁参照）。頻出名・用語解説の「全てを司る*お方」の項も参照。 [2]　述べてみたところで、それらは崇拝*に値するものではないから、の意（ムヤッサル2５３頁参照）。 [3]　彼らがアッラー*の同位者として崇めているものは、実態がないゆえ、アッラー*はそれらを関地されない（イブン・カスィール４：４６３参照）。 [4]　この「策謀」とは、嘘を真実のように見せる、彼らの偽装（ぎそう）のこと。あるいは、シルク*による、イスラーム*に対する彼らの「策謀」のこと（アル＝バイダーウィー３：３３2参照）。\n\nサイード佐藤訳　34章27節\n言ってやるのだ。「あなた方が、かれに（崇拝*における）同位者として属させた者たち（の根拠）を、私に見せてみよ。断じて（、そのようなものは）ない。いや、かれは偉力ならびなく*、英知あふれる*アッラー*であられる」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　47章38節\nほら、（信仰者たちよ、）あなた方という人たちは、アッラー*の道において出費することへと招かれているのに、あなた方の内には出し惜しみする者がいる。出し惜しみする者は誰でも、自分自身に出し惜しみしているに外ならない[1]。アッラー*が満ち足りた*お方なのであり、あなた方が貧しい者たちなのだ。そして、もしあなた方が（アッラー*への信仰と服従に）背を向けるなら、かれ（アッラー*）はあなた方ではない別の民と（あなた方を）交換され、それから彼らはあなた方のように（アッラー*に不服従に）なることもないであろう。\n訳注\n[1]　というのも彼らはそうすることで、自分たちにアッラー*からの褒美を禁じ、多くの善を取り損ねたからである（アッ＝サァディー７９０頁参照） 。\n\nサイード佐藤訳　34章28節\n（使徒*よ、）われら*があなたを遣わしたのは、全ての人に向けて[1]、吉報を伝える者、警告を告げる者[2]としてに外ならない。しかし大半の人々は、知らないのだ。\n訳注\n[1]　高壁章1５８とその訳注も参照。 [2]　「吉報を伝え・・・」については、雌牛章11９の訳注を参照。\n\nサイード佐藤訳　28章48節\nそして彼らのもとに、われら*の御許から真理が訪れた時[1]、彼らは言った。「どうして彼（ムハンマド*）には、ムーサー*に与えられたようなもの[2]が、与えられなかったのか？」彼らは以前、ムーサー*に授けられたものを否定しなかったのか？彼らは言ったのだ。「（トーラー*とクルアーン*は、）お互いに支え合う二つの魔術[3]である」。また、（こう）言った。「本当に私たちは、そのいずれをも拒否する者なのだ」。\n訳注\n[1]　預言者*ムハンマド*が警告者として到来した時、ということ（ムヤッサル３９1頁参照）。 [2]　奇跡や、啓典が一度に全部下されたこと（夜の旅章1０６、識別章３2とその訳注も参照）などを指す（前掲書、同頁参照）。 [3]　不信仰者*らは、それらが魔術と人々を迷わせることにおいて互いに助長し合うものだ、と主張した（アッ＝サァディー６1７頁参照）。\n\nサイード佐藤訳　34章31節\nまた、不信仰に陥った者*たちは言った。「私たちはこのクルアーン*を信じないだろうし、それ以前のもの[1]も（信じない）」。（使徒*よ、）もしあなたが、不正*者たちがその主*の御許で（清算のために）拘留され、お互いに（譴責の）言葉を返し合う時のことを見るならば。抑圧されていた者たちは、高慢だった者たち[2]に（こう）言うのだ。「もしあなた方がいなければ、私たちは信仰者だったのに」。[3]\n訳注\n[1]　クルアーン*以前の啓典のこと（ムヤッサル４３1頁参照）。 [2]　自分たちが迷うだけでなく、他人も迷わせていた不信仰の長たちのこと（ムヤッサル４３1頁参照）。 [3]　同様の情景の描写として、アーヤ*４０－４1、雌牛章1６６－1６７、高壁章３８、イブラーヒーム*章21－22、識別章1７－1９、物語章６３、部族連合章６７－６８も参照。\n\nサイード佐藤訳　5章44節\n本当にわれら*は、（アッラー*の法に）服従（イスラーム*）した預言者*たちが、それによってユダヤ教徒*である者たち*を裁く、導きと光を宿したトーラー*を下した。また、学識豊かな指導者[1]たちや学者らも、自分たちがアッラー*の書（であるトーラー*が改変されることから）の保持を託されたがゆえに（、それで裁いていた）。そして彼らは、それに対する証人[2]だったのだ。ならば人々を恐れず、われ（アッラー*）を恐れよ[3]。そして、われの（規定という）御徴と引き換えに、僅かな値打ちのものを買ったりしてはならない。誰であろうと、アッラー*がお下しになったもので裁かない者、それらの者たちこそは不信仰者*なのである。\n訳注\n[1]　「学識豊かな指導者」については、イムラーン家章79の訳注を参照。 [2]　それらの先代の預言者*たちが、トーラー*によってユダヤ教徒*を裁いていたということの「証人」（前掲書、同頁参照）。 [3]　彼らユダヤ教徒*の学者らは、彼らが知っている預言者*ムハンマド*の特徴や、姦通（かんつう）罪に対する本来の刑罰である石打ちの刑を公（おおや）けにすることにおいて、アッラー*以外の誰も恐れるべきではない、ということ（アル＝クルトゥビー6：189参照）。\n\nサイード佐藤訳　5章45節\nまた、われら*はその（トーラー*の）中で、彼らに（こう）定めた。命には命で、目には目で、鼻には鼻で、耳には耳で、歯には歯で（報われる）。そして傷害はキサース刑[1]（による報い）なのだ」。誰でも、それ（キサース刑の執行）を免じてやる者は、それが自分への罪滅ぼしとなる。そして誰であろうと、アッラー*がお下しになったもので裁かない者、それらの者たちこそは不正*者なのである。\n訳注\n[1]　「キサース刑」については、雌牛章178の訳注を参照。\n\nサイード佐藤訳　5章47節\n福音*の徒は、アッラー*が（福音*の）その中で下されたものによって裁決せよ。誰であろうと、アッラー*がお下しになったもので裁かない者、それらの者たちこそは放逸な者である。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　2章120節\nまた、ユダヤ教徒*もキリスト教徒*も、あなたが彼らの宗教に従わない限り、あなたに満足することは決してないであろう。言ってやるがよい。「アッラー*のお導きこそが、（真の）導きである」。（使徒*よ、）もしもあなた[1]が、あなたのもとに（アッラーからの）知識がもたらされた後、彼らの私欲に従うのなら、あなたにはアッラー*（の懲罰）に対するいかなる庇護者*も援助者もない。\n訳注\n[1]　預言者*ムハンマド*に対する語りかけの形とはなっているが、意図されているのは彼の共同体のこと（アル=バガウィー1:161参照）。\n\nサイード佐藤訳　37章24節\nまた（地獄に入る前に）、彼らを止めよ。実に彼らは（現世での言動について）、問われる者たちなのだから。[1]\n訳注\n[1]　食卓章1０９、高壁章８の訳注も参照。\n\nサイード佐藤訳　28章41節\nまた、われら*は彼らを、業火へと招く先導者とした。そして復活の日*、彼らは（いかなる者からも）援助されることがない。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　2章166節\n（それは、シルク*において）従われた者たちが、懲罰を目の当たりにして（彼らに）従った者たちを見捨て、彼らの関係[1]が断絶される時。[2]\n訳注\n[1]　この「関係」とは、近親関係・主従関係・宗教上の関係を含む全ての関係のこと（ムヤッサル25頁参照）。 [2]　同様の情景の描写として、高壁章38、イブラーヒーム*章21‐22、識別章17‐19、物語章63、部族連合章67‐68、サバア章31‐33、40‐41も参照。\n\nサイード佐藤訳　29章25節\nまた、彼（イブラーヒーム*）は言った。「本当にあなた方は、現世における自分たちの間の愛情ゆえ[1]、アッラー*をよそに彫像を設けて（崇めて）いる。やがて復活の日*には、あなた方はお互いを否定し合い、お互いに呪い合う[2]のだ。そして、あなた方の住処は業火なのであり、あなた方には（そこから救ってくれる）いかなる援助者もない」。\n訳注\n[1]　つまり、「彼らの間の愛情を育（はぐく）むため」あるいは「彼らの間での、彫像への愛情ゆえ」（アル＝バイダーウィー４：３1３参照）。 [2]　復活の日*、アッラー*をよそに崇めていたものとその崇拝*者は、互いに縁を切り、敵となる。雌牛章1６６－1６７、ユーヌス*章2８－2９、マルヤム*章８2、物語章６３、創成者*章1３－1４、砂丘章６も参照。\n\nサイード佐藤訳　31章18節\nまた、あなたの頬を（高慢さから斜に構えて）人々に向けてはならず、大地を得意然として歩いてはならない。本当にアッラー*は尊大ぶった高慢ちきな者をお好みにはならないのだから。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　3章143節\nまた（信仰者たちよ）、あなた方は、確かに（ウフドの戦い*以前には、殉教による）死を望んでいたのだ。それ（死）に直面する前には。そして確かに、あなた方はそれをまざまざと、目の当たりにした。[1]\n訳注\n[1]　バドルの戦い*に参加出来なかった教友*たちの多くは、また戦いの機会が訪れることを望んでいた。このアーヤ*は彼ら、そして特にマディーナ*郊外へと戦いに出ることを強く主張した者たち（頻出名・用語解説「ウフドの戦い*」参照）に対する、お叱（しか）りである（アル＝クルトゥビー4：220‐221参照）。\n\nサイード佐藤訳　34章32節\n高慢だった者たちは、抑圧されていた者たちに言う。「一体、私たちがあなた方を導きから阻んだというのか？あなた方のもとに、それが到来した後に？いや、あなた方は（自ら不信仰を選んだ）罪悪者だったのだ」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　8章30節\nそして（使徒*よ、）不信仰に陥った者*たちがあなたを拘束したり、殺害したり、（故郷から）追放したりするために策謀していた時のこと（を思い起こさせよ）。彼らは策謀し、アッラー*も策謀し給う[1]。アッラー*は、策謀する者の内でも最善のお方であられるのだ。\n訳注\n[1]　「アッラー*の策謀」とは、彼らが気づきもしないような形で、彼らの策謀に対して罰で報われること（アル＝クルトゥビー７：３９７参照）。同様の表現法の説明として、雌牛章1５の訳注も参照。\n\nサイード佐藤訳　4章141節\n（信仰者たちよ、彼ら偽信者*たちは、）あなた方に（災難が降りかかるのを）待ちわびる者たちである。あなた方にアッラー*からの勝利があれば、彼らは（あなた方に、こう）言う。「私たちは、あなた方と一緒だったではないか？[1]」そして、もし不信仰者*たちの方に分け前[2]があれば、（彼らに向かって、こう）言う。「私たちはあなた方の上に君臨していた（が、あなた方に危害は加えずにおいてやった）ではないか？そして、信仰者たちからあなた方を守ってやったではないか？」アッラー*は復活の日*、あなた方の間をお裁きになる。そしてアッラー*が不信仰者*たちに、信仰者たちに対する（勝利の）道をお授けになることはない。\n訳注\n[1]　偽信者*たちはムスリム*側に勝利や戦利品*が訪れると、「私たちはあなた方の宗教と共にあり、戦いにおいてはあなた方と共にあったではないか？」などと言い、現世の分け前にあずかろうとする（アル＝バガウィー1：714参照）。 [2]　いくばくかの勝利や、戦利品*のこと（ムヤッサル101頁参照）。\n\nサイード佐藤訳　37章32節\nそして私たちは、あなた方を（正しい道から）逸脱させた。本当に私たちは、誤った者たちであった」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　7章14節\n彼は申し上げた。「彼らが蘇らされる日まで、私に猶予をお授けください」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　3章36節\n彼女（マルヤム*）を出産した時、彼女（イムラーンの妻）は言った。「我が主*よ、本当に私は女児を生んでしまいました——アッラー*は、彼女が生んだものを最もよくご存知である——。そして男性は、女性のようではありません[1]。また、本当に私は、彼女をマルヤム*と名付けました。そして実に私は、追放された[2]シャイターンに対し、彼女とその子孫へのあなたのご加護をお祈りします。」\n訳注\n[1]　当時女子は、神殿での奉仕に適当ではないとされていた。（アル=バガウィー1:431参照）。 [2]　「追放された」と訳した原語は「ラジーム」で、「呪われた（つまり、アッラー*のご慈悲から遠ざけられた）」「けなされた」「（天から）追放された」「（流星で）撃たれた」など、複数の意味を含みえる（アッ＝タバリー1：120参照）。\n\nサイード佐藤訳　34章34節\nわれら*が警告者を町に遣わした時には決まって、その（町の）贅沢者たちは（こう）言ったものだった。「本当に私たちは、あなた方が携えて遣わされたものを認めない者である」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　94章4節\nまた、あなたのため、あなたの名声を高めてやった。[1]\n訳注\n[1]　預言者*としての使命を授かることなどによって、またはシャハーダ*の言葉において、彼の名がアッラー*の御名と共に言及されたり、彼への服従がアッラー*への服従と見なされたり（婦人章８０参照）、天使*たちや信仰者たちによって讃美（さんび）される（部族連合章５６とその訳注を参照）存在となることによって「名声を高められた」（アル＝バイダーウィー５：５０５参照）。\n\nサイード佐藤訳　6章123節\nまた（マッカ*の不信仰者*たちと）同様に、われらはいかなる町においても、その罪悪者たちを（町の）有力者とした。（それは）彼らがそこで、策謀するためである。そして彼らが策謀しているのは、自分自身に対してに外ならない[1]。彼らはそれに気付いていないのだが。\n訳注\n[1]　というのも彼らは、アッラー*の宗教とその使徒*を阻止しようとして策謀するが、結局のところその罪は自分自身に返ってくるからである（前掲書、同頁参照）。\n\nサイード佐藤訳　7章76節\n高慢だった者たちは言った。「私たちこそは、あなた方が信じたものに対する否定者である」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　40章16節\n彼らが露わな者たち[1]となる、その日を（警告するため）。彼らの（状態や行いの）内、アッラー*から隠れられるものなど、何一つない。（アッラー*は仰せられる。）「今日、王権は誰のものか？」（かれは、自らお答えになる）。「唯一*かつ君臨し給う*アッラー*にこそ、属するのだ[2]」。\n訳注\n[1]　その日、彼らを覆い隠すものは、何一つない（イブン・カスィール７：1３６参照）。家畜章９４とその訳注、洞窟章４８、預言者*たち章1０４も参照。 [2]　家畜章７３「かれにこそ王権は属する」の訳注も参照。\n\nサイード佐藤訳　89章15節\n人間というものは、その主*が彼を試練におかけになり、栄誉をお授けになり、恩恵を与え給うた時には、（こう）言う。「我が主*は、私に栄誉をお授けになった」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　89章16節\nそして、かれが彼を試練におかけになり、彼にその糧を控えられた時には、（こう）言うのだ。「我が主*は、私を卑しめられた」。[1]\n訳注\n[1]　現世におけるアッラー*からの厚遇と恩恵を、アッラー*の御許における自分自身の高貴さと、かれと特別な間柄ゆえのものと考え、逆の場合には、それが自分に対するアッラー*からの卑下（ひげ）であると考える、人間の一般的な性向を示している。しかし物質的な状況の良し悪しは、いずれもアッラー*からの試練なのであり、アッラー*はそのような状況において人が感謝するか、また忍耐*するかをご覧になるのである（アッ＝サアディー９2３頁参照）。サバア章３６とその訳注も参照。\n\nサイード佐藤訳　89章17節\n断じて（、そのような考えは正しく）ない！いや、（栄誉はアッラー*への服従、辱めはかれへの反抗によるものなのだ[1]、）あなた方は孤児を手厚く扱わず、\n訳注\n[1]　関連するアーヤ*として、婦人章７９、相談章３０とその訳注も参照。\n\nサイード佐藤訳　41章15節\nそれでアード*はといえば、不当にも地上で高慢となり、（こう）言った。「誰が私たちよりも強力だと言うのか？[1]」彼らは一体、彼らをお創りになったアッラー*が、彼らよりも強力であるとは思わないのか？彼らは、かれの御徴[2]を否定していたのだ。\n訳注\n[1]　アード*は強力な身体と武力を備えており、アッラー*の懲罰にすら太刀打ちできると考えていた（イブン・カスィール７：1６９参照）。 [2]　この「御徴」の解釈には、「使徒*の軌跡」「啓示」「世の中に存在する（アッラーの唯一性*と偉大さの）印」あるいは「それら全てのこと」といった諸説がある（アッ＝シャウカーニー４：６６９参照）。\n\nサイード佐藤訳　19章73節\nまた、われら*の明白な御徴[1]が彼らに読誦されれば、不信仰に陥った者*たちは信仰する者たちに、（こう）言った。「二つの集団のいずれが、住居がより素晴らしく、会合の場がより華々しいのか？」[2]\n訳注\n[1]　クルアーン*のアーヤ*のこと（アル＝クルトゥビー11：1４1参照）。 [2]　裕福なクライシュ族*の不信仰者*らは、貧しいムスリム*たちに向かって、もし自分たちの教えが間違っているのなら、なぜ自分たちは財産や仲間においてムスリム*たちにより優っているのか、と主張した（アル＝クルトゥビー11：1４1参照）。家畜章５３と砂丘章11、およびその訳注も参照。\n\nサイード佐藤訳　19章74節\n一体、われら*は彼ら以前、（彼らより）家財も容色も上回る、どれだけの世代を滅ぼしてきたであろうか。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　28章81節\nこうしてわれら*は、彼とその邸宅を地面に飲み込ませた。彼には、アッラー*をよそに彼を助けてくれるいかなる集団もなかったし、（懲罰から）援助される者でもなかったのだ。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　2章45節\nまた、忍耐*と礼拝を助力とせよ。それは、（アッラー*に）恭順な者[1]たち以外には困難なことであるが。\n訳注\n[1]　「恭順」と訳した原語は「ハシャア（慎ましくあること）」の派生形。静けさと慎（つつ）ましさが身体においても表れているような、心の状態のこと（アル=クルトゥビー1:374参照）。ここではアッラー*に対し慎み深く、かれへの服従において従順で、かれへの怖れゆえに謙虚（けんきょ）な者たちのことを指す（アッ=タバリー1:375参照）。\n\nサイード佐藤訳　11章27節\nすると彼の民の内の、不信仰だった有力者たちは言った。「私たちは、あなたが私たちと同様の人間としか思わないし、あなたに短絡的に[1]従ったのは、私たちの内でもまさに最底辺の者たちとしか思わない。また私たちに対して、あなた方に特に優れた点があるとも思えない。いや、私たちはあなた方が嘘つきだと確信しているのだ」。\n訳注\n[1]　「短絡的に」と訳した語は、「見せかけだけ」という解釈も可能（アル＝クルトゥビー９：2４参照）。\n\nサイード佐藤訳　18章40節\n我が主*は私に、あなたの果樹園よりも善いものを授けて下さ（り[1]、あなたへの恩恵は消滅させられ）るだろう。そしてかれは、天からそこ（あなたの果樹園）に懲罰を送られ給い、それはある朝、（丸裸で）つるつるの地面となってしまうだろう」。\n訳注\n[1]　「善いものを授かる」のは、来世で、または現世でのこと（アル＝クルトゥビー1０：４０８参照）。\n\nサイード佐藤訳　18章41節\nあるいはある朝、その水は（地下に沈んで）無くなってしまい、あなたはそれを求めることが、もはや出来なくなってしまうだろう」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　92章8節\nそして、（財産を）出し惜しみし、（主*の褒美なしでも）十分だと主張し、\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　92章9節\n最善のもの[1]を噓呼ばわりした者はといえば、\n訳注\n[1]　この「最善のもの」については、アーヤ*６の訳注を参照。\n\nサイード佐藤訳　92章10節\nわれら*が彼を、困難へと導てやろう。[1]\n訳注\n[1]　アッラー*は善を志した者には、そこへとお導きになることでお報いになり、悪を志した者には、失敗という応報を与えられる。そしてその全ては、定められた運命なのである（イブン・カスィール８：４1７参照）。\n\nサイード佐藤訳　17章18節\n誰であろうと、手っ取り早いもの（現世）を望む者、われら*は彼にそこでーーわれら*が望む者にわれら*が望むものをーー、手っ取り早く授けよう[1]。それからわれら*は彼に、（来世では）地獄を与えるのだ。彼は責められ、（アッラー*のご慈悲から）追いやられつつそこに入り、炙られることになる。\n訳注\n[1]　これは、来世のためではなく、現世のためだけに努力する者のこと（前掲書、2８４頁参照）。フード*章1５とその訳注も参照。\n\nサイード佐藤訳　17章57節\n彼らが（アッラー*に並べて）祈っているそれらの者たち[1]は（彼ら自身が）、いずれの者が（主*に）一番近いか、と自分たちの主*へのお近づきを求め、そのご慈悲を望み、その懲罰を怖がる者たちなのである。本当にあなたの主*の懲罰はもとより、用心すべきものなのだ。\n訳注\n[1]　「それらの者たち」とは、預言者*、正しい者*、天使*たちなどのこと（前掲書、同頁参照）。\n\nサイード佐藤訳　7章141節\n（イスラーイールの子ら*よ、）われら*があなた方を、フィルアウン*の一族から救い出した時のこと（を思い起こすがよい）。彼らはあなた方に過酷な懲罰を味わわせ、あなた方の男児は殺しまくり、女児は生かしておいた。そこには、あなた方の主*からの偉大な試練があったのだ。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章5節\nわれら*の御徴において、（使徒*とクルアーン*を嘘呼ばわりするために）ねじ伏せようと躍起になっていた者たち、それらの者たちには痛ましい制裁による懲罰がある。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　72章12節\nまた、私たちが地上で、アッラー*（がお望みになったこと）から逃れることも（出来）なく、（天へと）逃亡してかれから逃れることも（出来）ないことを確信した、ということ。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　29章4節\nいや、一体、悪行[1]を行う者たちは、われら*を出し抜けるとでも思ったのか？彼らの判断することの、何と忌まわしいことか？\n訳注\n[1]　この「悪行」は、シルク*を始めとした、アッラー*に対する不服従行為のこと（ムヤッサル３９６頁参照） 。\n\nサイード佐藤訳　18章79節\nあの船はといえば、それは（それを手段に）海で働く貧しい者たちの物であった。それで、私はそれ（船）を傷物にしようとしたのだ。というのも彼らの行く手には、（正常な）あらゆる船を強奪する王がいたから。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　18章80節\nまた、あの少年はといえば（、アッラー*は彼が不信仰者*となることをご存知であったが）、その両親が信仰者だったので、私たち[1]は彼が、二人（両親）にひどい放埓さと不信仰を強いること[2]を恐れた。\n訳注\n[1]　ここでハディルが「私たち」と言っているのは、アラビア語特有の表現によって、自らの尊厳を誇示している（頻出名・用語集「われら*」も参照）わけではなく、「アッラー*こそが、彼にそのことをお教えになったこと」を示す、ハディルの謙虚さを表しているのだという（イブン・アーシュール1６：1３参照）。 [2]　我が子への愛情ゆえに、両親までもが不信仰に追いやられてしまうこと（イブン・カスィール５：1８５参照）。\n\nサイード佐藤訳　18章34節\n彼（不信仰者*）には、収穫[1]があった。そして彼は、その連れ合い（信仰者）と話し合いながら[2]、（自惚れつつ、）彼に（こう）言った。「私はあなたよりも財産が沢山あるし、もっと強い衆がついている」。\n訳注\n[1]　この「収穫」は、果実や、その他の財産のこと（ムヤッサル2９７頁参照）。 [2]　信仰者の男は、不信仰者*の果樹園の主を戒（いまし）め 、アッラー*と復活の信仰へと招（まね）いていたのだという（アッ＝ラーズィー７：４６３参照）。\n\nサイード佐藤訳　9章79節\n（彼らは）信仰者たちの内、率先して施す（豊かな）者たちや、自分たちの能力分しか（施し物を）見出せない（貧しい）者たちのことをけなし、彼らを嘲笑する者たち[1]。アッラー*が、彼らのことを嘲笑された[2]のである。そして彼らには、痛ましい懲罰があるのだ。\n訳注\n[1]　沢山のものを施す者には「見せびらかしだ」と言い、僅かなものを施す者には「アッラー*はこんな施しなど、必要とはされない」などと言った者たちがいたのだという（アル＝ブハーリー1４1５参照）。 [2]　この表現については、雌牛章1５の訳注を参照。\n\nサイード佐藤訳　2章276節\nアッラー*は利息を根絶やしにされ、施し（の褒美）は増幅させられる。そしてアッラー*は、不信心この上なく、罪に溺れた、いかなる者もお好みにはならない。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　30章7節\n彼らは、現世の生活の上辺のことは知っている。実に来世に関しては、まさしく無頓着な者たちなのだが。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　57章10節\nあなた方がアッラー*の道において費やさないのは、どういうことか？アッラー*にこそ、諸天と大地の遺産は属する[1]というのに。あなた方の内、（マッカ*）開城[2]の前に費やし、（不信仰者*たちと）戦った者は、（褒美において）同等ではないのだぞ。それらの者たちは、（マッカ開城*の）後に費やし、（不信仰者*たちと）戦った者たちより位が偉大なのだ[3]。そしてアッラー*は、（その両者の内の）いずれにも最善のもの（天国）をお約束されたのであり、アッラー*はあなた方が行うことに通暁されるお方なのである。\n訳注\n[1]　「諸天と大地の遺産・・・」という表現については、イムラーン家章1８０の訳注を参照。 [2]　この「開城」が、「マッカ*開城*」のことであるとするのが、大半の解釈学者の見解。「フダイビーヤの和議*」である、という説もある（前掲書、同頁参照）。 [3]　「開城」以前は（ムスリム*たちにとって）厳しい状況であり、その当時ムスリム*となる者は、（信仰に）誠実な者しかいなかった。一方、「開城」後はイスラーム*が大きな拡大を見、人々が大挙（たいきょ）してアッラー*の教えを受け入れた（イブン・カスィール８：12参照）。\n\nサイード佐藤訳　5章116節\nアッラー*が（復活の日*、こう）仰せられる時のこと（を、思い起こさせよ）。「マルヤム*の子イーサー*よ、一体あなたは人々に『アッラー*とは別に、私と私の母親も二つの神[1]とせよ』などと言ったのか？[2]」彼は申し上げる。「あなたに称え*あれ。私は、自分に権利がないようなことを言うはずがありません。もし、そう言ったとしたら、あなたはそのことについて既にご存知です。あなたは私自身の内にあるものをご存知ですが、私はあなたご自身の内にあるものについて、存知じ上げないのですから。あなたこそは、不可視の世界*を熟知されるお方であられます。\n訳注\n[1]　「神」については、、雌牛章133の訳注を参照。 [2]　復活の日*の使徒*への質問については、アーヤ*109の訳注を参照。\n\nサイード佐藤訳　2章200節\nそして（ハッジ*における）儀式を全うしたら、あなた方の先祖に対する唱念のように、あるいはそれ以上に強い唱念で、アッラー*を唱念せよ[1]。人々の中には（現世のみを望んで）、「我らが主*よ、現世において私たちにお恵み下さい」と言う者がある。そして彼らには、来世における（よき）取り分などないのだ。\n訳注\n[1]　ジャーヒリーヤ*時代、アラブ人たちはハッジ*を終えた後、自分たちの先祖の威光（いこう）を称え、誇（ほこ）り合ったとされる（アッ=タバリー2:1087‐1089参照）。\n\nサイード佐藤訳　25章4節\n不信仰に陥った者*たちは、言った。「これ（クルアーン*）は彼（預言者*ムハンマド*）が捏造し、別の民[1]がそれに関して彼に手を貸した、でっち上げに外ならない」。そして確かに、彼らは不正*と偽りの言葉を犯したのだ。\n訳注\n[1]　「別の民」とは、ユダヤ教徒*などの啓典の民*や、外国人の占い師のことであるという説がある（アル＝バガウィー３：４３５参照）。家畜章1０５、蜜蜂章1０３、煙霧章1４も参照。\n\nサイード佐藤訳　51章53節\n一体、彼らはそのことを勧め合っていたのか？[1]いや、彼らは放逸な民であった。\n訳注\n[1]　先代の不信仰者*と、後代の不信仰者*は、いずれも使徒*を噓つき呼ばわりしていたので、彼らはあたかもお互いにそのことを勧め合っていたかのようである（前掲書５2３頁参照）。\n\nサイード佐藤訳　20章56節\nわれら*は確かに彼（フィルアウン*）に対し、われら*の御徴[1]を全て見せた。そして彼は（それらを）嘘とし、拒んだのだ。\n訳注\n[1]　この「御徴」に関しては、アーヤ*４2の同語についての訳注を参照。\n\nサイード佐藤訳　5章115節\nアッラー*は仰せられた。「本当にわれは、それをあなた方に下す者である。そして誰であろうと、その後あなた方の内で不信仰に陥る者*、本当にわれは彼を、全創造物のいかなるものも罰することのない（ような）罰し方で、罰するであろう」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　21章18節\nいや、われら*は真理を虚妄に投げつける。すると、それ（真理）はそれ（虚妄）を割り砕き、どうであろう、それ（虚妄）は消滅してしまう。あなた方には、自分たちが言っていること[1]ゆえの、災いがあるのだ。\n訳注\n[1]　つまりシルク*を始めとした、アッラー*に相応（ふさわ）しくない形容のこと（ムヤッサル３2３頁参照）。\n\nサイード佐藤訳　9章6節\nまた（使徒*よ、）シルク*の徒の誰かが、あなたに庇護を要請してきたら、彼がアッラー*の御言葉（クルアーン*）を耳にする（ことで、その導きを知ることが出来る）まで、彼を庇護してやるがよい[1]。それから彼を、彼にとって安全な場所まで送り届けてやれ。それというのも、彼らが（イスラーム*の実像を）知らない民であるからなのだ。\n訳注\n[1]　たとえイスラーム*法統治国家と戦争中の状態にある国の者でも、文書などの配送、商売、調停・停戦の申し出、ジズヤ*の納付などの目的のため、入国・滞在許可をその統治者、またはその代理人に要請する者は、それを許可され、滞在中の安全を保障される（イブン・カスィール４：11４参照）。\n\nサイード佐藤訳　8章42節\nあなた方が谷の（マディーナ*から見て）最寄り側に、そして彼らが谷の最も遠い側にあり、隊商があなた方よりも下方[1]に位置していた時のこと（を思い出すのだ）。たとえあなた方が（前もって、両軍が会した時のような時と場所を）約束し合っていたとしても、あなた方はその約束を違えてしまったであろう。しかし（アッラー*が、あなた方を約束もなしに一堂に会させたのは、）アッラー*が、実現されることになっていたことをご決行されるため。（それは）滅びる者が明証によって滅び、生きる者が明証によって生きるため[2]であった。本当にアッラー*こそは、よくお聞きになるお方、全知者であられる。\n訳注\n[1]　ムスリム*たちから見て、紅海方面の低地に位置していた、ということ（前掲書、同頁参照）。 [2]　イスラーム*の真実性と不信仰の嘘が、議論の余地なく明らかになった後、それでも不信仰にこだわる者が不信仰者*として、信仰者が信仰者としてあり続けること（イブン・カスィール４：６９参照）。\n\nサイード佐藤訳　34章53節\n彼らは確かに以前、それを否定し、不可視の世界*について（真理から）遠い場所から（虚妄に満ちた）憶測をしていたというのに。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　13章10節\nあなた方の内、言葉を秘める者も、それを露わにする者も、夜にこそこそとする者も、昼に堂々とする者も、（アッラー*には）同じこと。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　42章11節\n（アッラー*は）諸天と大地の創成者*。かれはあなた方自身の内から、あなた方のために配偶者を創られ、家畜の内からも雌雄をお創りになった。かれはそこにおいて、あなた方を繁茂させるのである。いかなるものも、かれには似ていない[1]。そしてかれはよくお聞きになるお方、よくご覧になるお方である。\n訳注\n[1]　アッラー*、はその本質、美名、属性、行為において、いかなる創造物にも似ていない（ムヤッサル４８４頁参照）。ビザンチン章2７も参照。\n\nサイード佐藤訳　17章81節\nそして（使徒*よ、シルク*の徒に）、言うがよい。「真理は到来し、虚妄は消滅した[1]。本当に虚妄は、消滅することになっているのだから」。\n訳注\n[1]　この「真理」はイスラーム*、「虚妄」はシルク*のこと（ムヤッサル2９０頁参照）。\n\nサイード佐藤訳　5章22節\n彼らは言った。「ムーサー*よ、実にそこには強大な民がいる。そして本当に私たちは、彼らがそこから出て行くまで、絶対にそこには入らないぞ。もし彼らがそこから出て行くなら、まさしく私たちは（そこへ）入る者となろう」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　8章50節\n天使*たちがその顔や背中を殴りつけつつ、不信仰だった者*たち（の魂）を取り上げる時のこと[1]を、あなたが見るのならば！（彼らは、こう言う。）「（焼き尽くす）炎の懲罰を味わうのだ」。\n訳注\n[1]　家畜章６1、９３とその訳注も参照。尚、これはバドルの戦い*のみならず、全ての不信仰者*が出くわすことになる状況である（ムヤッサル1８３頁参照）。\n\nサイード佐藤訳　34章48節\n言うのだ。「実に我が主*は、真理を（虚妄に向けて）投げかけ給い[1]、不可視の世界*を熟知されるお方である」。\n訳注\n[1]　その他、「アッラー*はその啓示を、かれがお選びになる者に下される」「真理を世界中に広められる」といった解釈もある（アル＝バイダーウィー４：４０６参照）。\n\nサイード佐藤訳　34章35節\nまた、彼らは言った。「私たちは財産も子供も（あなた方）より多いし、私たちは（現世でも来世でも、）罰される者などではない」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　77章36節\nまた、彼らに（弁明が）許可されることで、言い訳することもない（日）。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　23章108節\nかれは仰せられる。「そこに、（惨めなまま）下がっていよ。そしてわれに（これ以上）、話しかけるのではない」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　74章18節\n本当に彼は、（使徒*とクルアーン*に対する誹謗を）思索し、準備したのだから。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　34章13節\n彼らは、彼が望むものを造った。聖殿、彫像、貯め池のような鉢、[大地に]据え付けられた大釜。「ダーウードの一族よ、感謝して働きなさい」。われのしもべたちのうち、感謝する者はわずかであるが。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　34章14節\nわれらが彼の死を決めたとき、[ジンたちに]彼の死を教えるものは何もなかった。ただ一匹の地虫が、彼の杖を食べた。それで彼が倒れたとき、[彼がすでに死んでいたことが]ジンたちに明らかになった。もし彼らが、目には見えないものについて知ってさえいたなら、屈辱の懲罰の中で過ごさずに済んだだろうに。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　34章23節\nかの御方が許した者を除き、その御許においてとりなしは何の役にも立たない。彼らの心から恐怖が消えるとき、彼らは[互いに]言う。「あなたがたの主は何を言っていたのか」。彼らは「真理です」と言うだろう。至高の御方、至大の御方。\n訳注\n「彼らの心」の「彼ら」とは、ここでは神の最もそば近くに仕える天使たちを指している。裁きの日には、筆舌に尽くしがたい圧倒的な威力の顕現が起こる。それを目の当たりにすれば、天使たちでさえ何が起こっているのかほとんど理解できずに、しばらくはただ呆然として沈黙するという。\n\n東京ジャーミイ訳　34章21節\n彼[イブリース]には、彼らに対して何の権威もなかった。われらはただ、誰が来世を信じている者か、誰が疑わしさをおぼえている者かを知ろうとしたに過ぎない。[ムハンマドよ、]あなたの主はありとあらゆるものごとの守護者。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　34章15節\nかつてサバア[の人々]にも、その住まうところにひとつの御しるしがあった。それは右と左にあった二つの園。「あなたがたの主の糧を食べ、感謝しなさい。すこやかな土地に、もっともよく赦す主に」。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　35章10節\n誰であれ栄誉を欲するなら、すべての栄誉はアッラーにある[と知りなさい]。良い言葉はかの御方へと昇る。正しい行いは高く掲げられる。しかし悪を謀る者たち、彼らには厳重な懲罰があり、その謀りごとは消え失せるだろう。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　53章61節\n気晴らしにうつつを抜かすのか。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　13章33節\nすべての者をそれぞれ見守り、またそれらが得たものを知る御方とは誰のことか。それなのに彼らは、アッラーに同輩があるものとする。言いなさい。「それらの名を言ってみなさい。それともあなたがたは、アッラーは地上のことは知らないだろうから自分たちが教えよう、とでもいうのか。それとも見かけだおしの言葉に過ぎないのか」。いいや、[真理を]拒む者たちには、自分たちの企みがすばらしいものに見えており、そのために道を踏み外している。アッラーが迷わせる者には、どのような導きもない。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　47章4節\nあなたがたが[真理を]拒む者に[戦場で]会したときは、その首を討ち取りなさい。討伐し終えたときは、[捕虜を]厳重に繋ぎなさい。そののち、戦いの重荷が下ろされたら、情けをもって解放するか、あるいは代償を払わせなさい。[命じられていることは]このとおりであり、もしアッラーがそうと望めば、必ず御自ら彼らに返報しただろう。しかしこれはあなたがたを、互いをもって試みるため。またアッラーの道のために殺害された者たち、かの御方はそうした者の行いを、決して空しいものにはしない。\n訳注：47章4節・訳注2。原本の見開き873–874頁。訳注は左ページの「2」。ふりがなを含む原本画像を、この項目の下に掲載しています。\n\n東京ジャーミイ訳　73章20節\nあなたの主は、あなた[ムハンマド]が夜のほとんど三分の二か、または半分、または三分の一、[祈りのために]立っているのを知っている。あなたと共にいる、一群の者たちについてもまた。アッラーは、夜と昼と[の長さ]を定める。あなたがたにはそれを計ることができないのを知り、かの御方はあなたがたを憐れむ。それゆえクルアーンの[あなたがたそれぞれにとり]やさしいところを朗読しなさい。かの御方は、あなたがたの中に病気の者がいるのを知っている。他のある者は、アッラーの御恵みを探し求めて大地を旅するだろう。また他のある者は、アッラーの道のために戦うだろう。それゆえ、[あなたがたそれぞれにとり]やさしいところを朗読しなさい。礼拝のつとめを守り、喜捨をし、アッラーに善良な貸付をしなさい。何であれ、あなたがたが自分自身のためにあらかじめ行った良いことを、あなたがたはアッラーの御許に見出すだろう。それはもっとも良く、もっとも大いなる報酬。アッラーの赦しを願いなさい。本当にアッラーはもっともよく赦し、もっとも慈悲深い。\n訳注：73章20節・訳注3。原本の1014頁。訳注は「3」。ふりがなを含む原本画像を、この項目の下に掲載しています。\n\n東京ジャーミイ訳　96章6節\nいや、本当に人間は逸脱する。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　96章7節\n自分に足りないところはない、と思いあがる。\nこの項目に付された訳注はありません。\n\n東京ジャーミイ訳　18章40節\nおそらく主は、あなたの園よりも良いものを私に与えるかもしれない。また空から[あなたの園に]一撃を送りつけ、平らかな砂地にするかもしれない。\n訳注\nここでは「一撃」としてあるが、一般にはこの「ヒサーブ」という語は「清算」と解釈され、あらゆる懲罰を含むものとして用いられる。一部の解釈者たちは、この語を地震という意味で解している。地震は地下の水脈を変え、泥土や砂で河口をふさぎ、広い範囲にわたって荒廃をもたらすからである。\n\n東京ジャーミイ訳　18章41節\nあるいは水が[地中に]沈んで、探し求めることもできなくなるかもしれない」。\n訳注\nここでは「一撃」としてあるが、一般にはこの「ヒサーブ」という語は「清算」と解釈され、あらゆる懲罰を含むものとして用いられる。一部の解釈者たちは、この語を地震という意味で解している。地震は地下の水脈を変え、泥土や砂で河口をふさぎ、広い範囲にわたって荒廃をもたらすからである。\n\nサイード佐藤訳　75章3節\n（不信仰な）人間は、われら*が彼の骨を（それが散り散りになった後に、）集めることが（出来）ない、とでも思っているのか？\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　75章4節\nいや、われら*はその指先まで、きっちり整え（て組み立て、生前と同じ状態に復活させ）ることが出来る。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　75章6節\n「復活の日*は、一体いつなのか？」と尋ねながら。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　1章1節\n慈悲あまねく*慈愛深き*アッラー*の御名において。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章4節\n（復活の日*の到来は、）かれが、信仰し、正しい行い*を行う者たちに報われるため。それらの者たちには、お赦しと貴い糧[1]がある」。\n訳注\n[1]　「貴い糧」とは、天国のこととされる（ムヤッサル４2８頁参照） 。\n\nサイード佐藤訳　34章9節\n一体、彼ら（不信仰者*たち）は天と、大地という、自分たちの前にあるものと、自分たちの後ろにあるものを見なかったのか？もしわれら*が望めば、われら*は彼らを地面に飲み込ませ、あるいは彼らの上に天から破片を下してやる[1]のだ。本当にその中にはまさに、よく（アッラー*に悔悟して）立ち返る、全ての僕への御徴がある。\n訳注\n[1]　「天から破片を下す」については、夜の旅章９2の訳注を参照。\n\nサイード佐藤訳　34章14節\nそして、われら*が彼（スライマーン*）に死を定めた時、彼の杖を蝕む地面の虫以外、彼らにその死を知らせた者はなかった[1]。それでスライマーン*が（地面に）崩れ落ちた時、ジン*たちは、もし彼らが不可視の世界*を知っていたなら、彼らが屈辱の懲罰の中に留ま（り続け）ることはなかったのだ、と分かった[2]のだった。\n訳注\n[1]　スライマーン*は杖に寄りかかったまま他界したため、ジン*たちは暫（しばら）くの間、彼が生きているものだと思って働き続けた。彼の死が明らかになったのは、その杖が虫に喰われて朽（く）ち、遺体が崩れ落ちた時のことだった（アッ＝サァディー６７６頁参照）。 [2]　ある種の人々が考えているように、ジン*が不可視の世界*を知っていたのなら、彼らはスライマーン*の死後も厳しい労働の中に留まり続けることはなかったのだ、ということ（ムヤッサル４2９頁参照）。\n\nサイード佐藤訳　34章29節\n彼ら（シルク*の徒）は、言う。「その約束（復活の日*）は、いつなのか？もし、あなた方が本当のことを言っているのなら」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章30節\n（使徒*よ、）言ってやれ。「あなた方には、一時たりとも遅らせることも出来ず、早めることも出来ない（復活の）日*の約束があるのだ」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章36節\n（使徒*よ、）言ってやれ。「本当に我が主*は、かれがお望みの者に糧を豊富に与えられ、また控えられる。しかし、大半の人々は知らないのだ」。[1]\n訳注\n[1]　豊かであるか貧しいか、ということは、その者に対するアッラー*の寵愛（ちょうあい）や憎悪を示しているのではなく、アッラー*からの試練である。だが、多くの人々はそのことを知らない（ムヤッサル４３2頁参照）。物語章８2、暁章1５－1６とそれらの訳注も参照。\n\nサイード佐藤訳　34章37節\nあなた方の財産もあなた方の子息も、あなた方がわれら*のもとでお近づきを得るものではない。しかし信仰し、正しい行い*を行う者、それらの者たちにこそ、彼らが行ったことゆえの倍の褒美があるのだ[1]。そして彼らは（懲罰から）安全な状態で、（天国の）高き住まいにある。\n訳注\n[1]　財産や子息は、それ自体ではアッラー*へのお近づきを望めない。しかし正しい信仰者が、その財産をアッラー*の道に費やしたり、あるいは自分の子供に善いことを教えたり、正しい教育を施したりすることで、初めてアッラー*へのお近づきを望めるのである（アル＝バイダーウィー４：４０３参照）。\n\nサイード佐藤訳　34章38節\nまた、われら*の御徴において、（嘘呼ばわりするために）ねじ伏せようと躍起になる者たち、それらの者たちは、懲罰へと立ち合わされる者たちである。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章39節\n（使徒*よ）言ってやれ。「本当に我が主は、その僕たちの内、かれがお望みの者に糧を豊富に与えられ、また控えられる[1]。そして、あなた方がどんなものでも（アッラー*に命じられたことに）費やせば、かれはそれを（褒美で）継がせ給う[2]。かれは、最もよく糧を授けられるお方」。\n訳注\n[1]　アーヤ３６の訳注を参照。 [2]　現世においてはそれに代わるもので、来世においては褒美で償（つぐな）われる、ということ（ムヤッサル４３2頁参照）。\n\nサイード佐藤訳　34章40節\nかれ（アッラー*）が彼ら（シルク*の徒）全員を招集され、それから天使*たちに（こう）仰せられる日のこと（を思い起こさせよ）。「一体これらの者たちは、あなた方（天使*たち）のことを崇めていたのか？」[1]\n訳注\n[1]　同様の情景の描写として、アーヤ*３1－３３、雌牛章1６６－1６７、高壁章３８、イブラーヒーム*章21－22、識別章1７－1９、物語章６３、部族連合章６７－６８も参照。\n\nサイード佐藤訳　34章41節\n彼ら（天使たち）は申し上げる。「あなたに称え*あれ。彼らは無関係で[1]、あなたこそが私たちの庇護者*です。いえ、彼らはジン*[2]を崇めていました。彼らの大半は、彼ら（ジン*）のことを信じて（従って）いたのです」。\n訳注\n[1]　私たちは彼らのことを自分たちへの崇拝*者としたわけでもなく、彼らの庇を引き受けたわけでもない、ということ（アッ＝シャウカーニー４：４３７参照）。 [2]　ここでの「ジン*」は、シャイターン*の意（ムヤッサル４３３頁参照）。\n\nサイード佐藤訳　34章42節\n（復活の）この日、あなた方はお互いに、益も害も有してはいない。そしてわれら*は不正*を働いていた者たちに、（こう）言うのだ。「あなた方が嘘呼ばわりしていた、業火の罰を味わうがよい」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章43節\nわれら*の明白な御徴（アーヤ*）が彼ら（マッカ*の不信仰者*）に読誦されれば、彼らは言ったものであった。「これ（預言者*ムハンマド*）は、あなた方のご先祖様が崇めていたものから、あなた方を阻もうとする男以外の何ものでもない」。また、（こう）言った。「これ（クルアーン*）は、捏造されたでっち上げに過ぎない」。そして不信仰だった者*たちは真理に対し、それが彼らのもとに到来した時、（こう）言ったのである。「これは紛れもない魔術に外ならない」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章44節\nわれら*は（クルアーン*以前）、彼ら[1]が熟読するいかなる啓典も、彼らに下しはしなかったし、（使徒*よ、）あなた以前にはいかなる警告者も、彼らに遣わすことはなかったのだ。\n訳注\n[1]　ここでの「彼ら」は、アラブ人のこととされる（イブン・カスィール６：５2５参照）。\n\nサイード佐藤訳　34章45節\nまた、彼ら以前の（不信仰）者*たちは、（われら*の使徒*たちを）噓つき呼ばわりした。彼ら（マッカ*の不信仰者*たち）は、われら*が彼ら（それ以前の不信仰者*たち）に与えたもの[1]の、十分の一にも達していないというのに。彼らは、われの使徒*たちを噓つき呼ばわりしたのである。それで、わが否認はいかなるものだったか？[2]\n訳注\n[1]　これは勢力、財産、長寿などのこととされる（ムヤッサル４３３頁参照）。 [2]　「わが否認はいかなるものだったか？」については、巡礼*章４４の訳注を参照。\n\nサイード佐藤訳　34章46節\n（使徒*よ、彼らに）言ってやれ。「まさに私は、あなた方に一つだけ訓戒する。あなた方がアッラー*に向かって二人ずつ、また一人ずつ立ち上がり、それから熟考することを[1]。あなた方の仲間（ムハンマド*）に、憑きものなど憑いてはいない[2]。彼は（あなた方が味わうことになる）厳しい懲罰に先立つ、あなた方への警告者に過ぎないのだ[3]」。\n訳注\n[1]　預言者*の件について、決意と熱意、真理の追求とアッラー*への真摯さをもって立ち上がり、寄り集まって調べ合い、あるいは一人で自分自身に問いかけてみれば、彼が憑（つ）かれてなどいないことが分かる（アッ＝サァディー６８2頁参照）。 [2]　アル＝ヒジュル章６「憑かれた者」の訳注を参照。 [3]　縒り合された章の訳注1も参照。\n\n関連資料：サイード佐藤訳 111章1節（本文と訳注）\n34章46節の訳注[3]が指す「縒り合された章」は第111章です。どの訳注を指すかは確定していません。111章1節の訳注[2]は34章46節を参照しています。\n\nサイード佐藤訳　34章47節\n（使徒*よ、）言え。「もし、私があなた方に何らかの見返りを求めた[1]としても、それはあなた方のもの。私の見返りは、アッラー*から以外にはないのだ。そしてかれは、全てのことの証人であられる」。\n訳注\n[1]　この「見返りの要求」については、家畜章９０の訳注を参照。\n\nサイード佐藤訳　34章49節\n言え。「真理は到来した。そして虚妄は（滅び、もはや）出現することも、回帰することもない」。[1]\n訳注\n[1]　つまり虚妄は跡形もなく消え去り、進退も開始も再開もままならない状況になった。あるいは「虚妄」とはシャイターン*のことで、それは何を創造することも出来なければ、何かを蘇（よみがえ）らせることも出来ない（アッ＝シャウカーニー４：４４1参照）。\n\nサイード佐藤訳　34章50節\n言ってやれ。「もし私が（真理から）迷ったのなら、私は自分自身に対して（罪を負うべく）迷っているのである。そしてもし（正しく）導かれたのなら、（それは）我が主*が私に啓示されたものゆえのこと。本当にかれはよくお聞きなるお方、（かれを呼ぶ者の）近くにおられるお方」。\nこの項目に付された訳注はありません。\n\nサイード佐藤訳　34章51節\n（使徒*よ、）彼ら（不信仰者*たち）が戦慄する時のことを、目にしたならば。彼らに逃げ道はなく、近い場所から連れて行かれるのだ[1]。\n訳注\n[1]　このアーヤ*の解釈には、「（死が訪れ、）地表から地下へと移される時のこと」「復活の日*の清算の場から、地獄へと落とされる時のこと」「かつては強力だったのが、戦場において容易（たやす）く負かされる時のこと」といった諸説がある（アル＝カースィミー1４：４９６８参照）。\n\nサイード佐藤訳　34章52節\nそして彼らは（、その時になって）言う。「私たちはそれ[1]を信じた」。どうして遠い場所から、易々と（信仰を）手に入れられるというのか？[2]\n訳注\n[1]　この「それ」は、アッラー*、啓典、使徒*のこと（ムヤッサル４３４頁参照）。 [2]　既に現世から遮（さえぎ）られ、そこが「遠い場所」となってしまった後では、信仰を手にすることは出来ない（前掲書、同頁参照）。家畜章1５８とその訳注も参照。\n\nサイード佐藤訳　34章54節\nそして彼らと、彼らが渇望するもの[1]との間は阻まれた。ちょうど彼らの（先代である）同類者たちが、以前（そう）されたように。本当に彼らは（現世で）、大きな疑惑の中にあった[2]のである。\n訳注\n[1]　「渇望すること」とは、現世に戻って信仰すること（ムヤッサル４３４頁参照）。 [2]　つまり、使徒*、復活、清算について疑念の中にあった（前掲書、同頁参照）。\n\n伝承の出典と注\n日本ムスリム協会の掲載訳は『サヒーフ・ムスリム』の訳です。本文の講義が別の伝承集を参照する場合、本文中でその参照と、引用した並行伝承を区別しています。\n\n暁の礼拝（ジュンダブ・ブン・アブドッラーの伝承）\n本文の引用\n暁の礼拝を行った者は、アッラーの保護下にある。\n掲載版の解説\n暁（ファジュル）の礼拝を行った者は、アッラーとの契約下に入ったようなものであり、いかなる悪からも守られるというアッラーとの契約を結んだようなものである。ゆえに、その者を害することは許されない。なぜなら、その者に対する害は実際のところアッラーに対する侵害であり、ファジュルの礼拝をした者にアッラーから授けられた保護を無視するものであるためだ。アッラーの契約を無視し、侵害する者は、自らをアッラーに歯向わせているようなものである。アッラーは、かれが保護下に入れた者を害する者に、報復される。\n掲載版が挙げる教訓\nファジュルの礼拝の重要性と徳の説明。\nファジュルの礼拝をした者に悪を及ぼす者に対する、厳しい警告。\nアッラーの掟と、かれが禁じた物事の遵守は、アッラーからの保護と援助の理由となる。\n\nサヒーフ・ムスリム：日本ムスリム協会訳\n本文の引用\nたとえば、なにか喜ばしいことがあってアッラーに感謝すれば、そのことで良いことが生じ、また、困難があっても忍耐すれば、そのことで良いことが生ずるのである\n\n祈り：ムスリムの砦（サイード佐藤・ファーティマ佐藤訳、第一版2007年）\n本文の引用\n主権と讃美がアッラーに帰属する中、私たちは朝\n（あるいは「晩」）を迎えました。\n\n引用資料：『ムスリムの砦』77。関連する伝承：ムスリム2723。掲載訳は朝と晩の選択を併記しています。\n\nサヒーフ・ムスリム：日本ムスリム協会訳\n本文の引用\nああ、もしも私があなたの活動時期に若者であり、またもしも人々があなたを追放する時私が生きておれば、お役に立つであろうに！\n掲載版の訳注・伝承経路に関する補記\nアーイシャ\nによる前記と同内容のハディースは、別の伝承者経路でも伝えられる。\nただし「アッラーのみ使いに下された最初の啓示は」に始まる前文と同内容であるが、これにはハディージャの言葉「アッラーに誓って申しますが、アッラーは決してあなたを悲しませることはなさいません」及び「伯父上、あなたの兄弟の息子の言葉を聞いて下さい」という表現はみられない。\nアーイシャ\nによる前記と同内容のハディースは、更に別の伝承者経路でも伝えられる。\nなお、これには「アッラーのみ使いはハディージャの処に戻ったが、心は震えおののいていた」と記されているが、ハディースの最初の部分、すなわち「アッラーのみ使いに下された最初の啓示は睡眠中に正しく現われたものであった」という表現はみられない。\nただ前記ハディースと同様に「アッラーに誓って申しますが、アッラーは決してあなたを悲しませることはなさいません」\n「伯父上よ、あなたの兄弟の息子の言葉を聞いて下さい」などというハディージャの言葉は記されている。\n\n祈り：ムスリムの砦（サイード佐藤・ファーティマ佐藤訳、第一版2007年）\n本文の引用\nアッラーに称えあれ。善行はかれの\n恩恵によって完遂されます。\nどのような状況であれ、アッラー\nを称えます。\n\nサヒーフ・ムスリム（日本ムスリム協会訳、1巻　P.96-98）\n本文の引用\nアッラーはまた、極悪者（注）以外には誰をも破滅させることはなさらない\n掲載版の訳注・伝承経路に関する補記\n（注）原文は“ハーリク”すなわち“破滅を運命づけられている者”という意味。\n悪行を専らにし一片の善意をも持たぬ者をいう\n\n引用資料：ムスリム131b。\n伝承者：イブン・アッバース。\n引用は、イブン・アッバースの伝承の末尾にある、滅びについての文です。\n\nサヒーフ・ムスリム（日本ムスリム協会訳、1巻　P.155-170）\n本文の引用\n私以前の者には誰にも啓示しなかった主に対する讃美と賞揚の言葉\n\n引用資料：ムスリム194a。\n伝承者：アブー・フライラ。\n講義の参照：ブハーリー4712。日本語引用は、ムスリムの並行伝承の掲載訳です。\n引用は、アブー・フライラによるムスリムのとりなしの伝承のうち、それ以前には与えられていなかった称賛の言葉についての箇所です。\n\n掲載元による、この伝承全体への注\n（注1）クルアーン71章1-2節、71章5節、71章21節、71章26節には、ノアが人々を呪うに至った経緯が記されている\n（注2）クルアーン6章77節、21章62-63節、37章87-89節が、アブラハムの嘘言に関連する啓示といわれる。\nこれには、星を“我が主である”といったあとそれを打消した話、“偶像にたずねよ”と語った話、諸星を見て心を痛ましめた話などが記されている。\nただしいずれも二重の意味に解される内容で、いわゆる“嘘”“出任せ”に類する物語ではない　とされる\n（注3）クルアーン28章15節には、モーゼが争いにまき込まれ、敵方の者を拳で打殺した話が記 嘘付は社会的に非難された\n（注4）フザーア族出身の変人で血人シリウス星を崇めていた男だがアブー・スフヤーンは宗教を異にする預言音ムハンマドをここではこの男にたとえている\n\nサヒーフ・ムスリム（日本ムスリム協会訳、2巻　P.668-671）\n本文の引用\nあなたの妻の口に一ちぎりのパン切れを入れること\n\n引用資料：ムスリム1628a。\n伝承者：サアド（息子アーミルを経由）。\n掲載訳の引用はパンの表現であり、講義が述べる一口の食物という一般的な意味よりも具体的です。\n\n掲載元による、この伝承全体への注\n（注1）サアド・ビン・アブー・ワッカースのことで彼はマッカからマディーナに預言者と同様に移住した教友の一人\n（注2）この巡礼はヒジュラ暦10年に行われ、預言者をはじめとして主な教友はこのときマッカに来ていた\n（注3）サアドはこの後長生きをして少くとも男児三人の父親となる\n（注4）マッカでこのまま死んではムハージル（移住者）としての名折れといった気持かまたは巡礼を終えて預言者と教友達がマティーナに帰ってしまい病気のため自分だけが後に取り残されるかも知れないという不安感を示しているようだ\n（注5）ここでは早死はしませんよの意か\n（注6）預言者のサアドに関する予言は的中している。\nサアドは生き伸び有名なカーディシーアの大戦を指揮してイラクとペルシャの一部を征服した。\nここでは敵にとって彼は害になったはずである\n（注7）サアドが一旦捨てたマッカの地で汚名を負いなから客死をしないようにという祈りにも相当するだろう\n（注8）前述のサアドとは別人のサアドだが、彼は一旦マッカからマディーナに移住し、バドルの戦にも参戦したがヒジュラ10年に不運にもマッカで死去したと言われている人物\n\nサヒーフ・ムスリム（日本ムスリム協会訳、2巻　P.124-125）\n本文の引用\n目の前に居る（貧しい）人々、後に居る人々、右に居る人々、そして、左に居る人々\n\n引用資料：ムスリム990a。\n伝承者：アブー・ザッル。\n引用は、カアバの陰で語られた支出についての伝承にある、四方の表現です。講義の復活の日についての説明とは、参照する伝承が異なります。\n\nサヒーフ・ムスリム（日本ムスリム協会訳、1巻　P.399-405）\n本文の引用\nこれはアッラーの恩寵であり、アッラーはそれをみ心のままに嘉し給える者に与え給う\n\n引用資料：ムスリム595a。\n伝承者：アブー・フライラ。\n後半の返答は、アブー・サーリフの補記の中で伝えられています。掲載元は、回数と伝承経路に関する別の記述も併記しています。\n\n掲載元の伝承経路・回数に関する補記\nところでスマイヤは次のように語った。\n「私は家族の何人かにこのハディースを伝えた」\nすると家族の一人が“あなたは思いちがいしている”といって預言者の言葉を次のように伝えた。\n「あなたは33回アッラーの栄光をたたえ33回アッラーを讃美しそしてアッラーは偉大なりと33回唱えなさい」\nそこで私はアブー・サーリフのところへ戻り彼に事の次第を伝えた。\nすると彼は私の手をとり次のように云った。\n「アッラーは偉大なり、アッラーの栄光にたたえあれ、称讃はアッラーにのみ、アッラーは偉大なり、アッラーの栄光にたたえあれ、称讃はアッラーにのみ……」\nこうして彼はそれらすべてを33回唱えつづけた。\nところでイブン・アジュラーンは次のように語っている。\n私はこのハディースをラジャーウ・ビン・ハイワに語った。\nすると彼はそれと同様のハディースを預言者、アブー・フライラ、アブー・サーリフの伝承順序で私に伝えた。\n\n掲載元の伝承経路・回数に関する補記\nアブー・フライラ\nはアッラーの使徒から聞いたとして次のように伝えている\n人々（移住者のうち貧しい人々）はこういった。\n「アッラーの使徒よ、資産家達は最高の地位と天国での久遠の至福を占めています」\nさて残りのハディースはライスからの伝聞としてクタイバが伝えたものと同じである。\nしかし彼はアブー・フライラの伝えるハディースの末尾にアブー・サーリフの言葉を挿入した。\nそれは“それから移住者達のうちの貧しい人々は戻ってきた”以下の一節である。\nまた彼は次の部分を付加した。\n「スハイルはいっている、11回ずつ唱えて全てを合わせると33回になる（注）」\n（注）例えば“アッラーは偉大なり、アッラーの栄光に讃えあれ、称讃はアッラーにのみ”という一連の言葉を11回唱えれば計33回アッラーを讃えたことになる意\n\nサヒーフ・ムスリム（日本ムスリム協会訳、2巻　P.235-241）\n本文の引用\nアッラーが最もお好みになる断食は（預言者）ダビデの断食である。\nそしてアッラーが最も好まれる礼拝も（預言者）ダビデの礼拝である。\n\n引用資料：ムスリム1159k。\n伝承者：アブドッラー・ビン・アムル・ビン・アース。\n講義の参照：ブハーリー1131。日本語引用は、ムスリムの並行伝承の掲載訳です。\n引用は、ダビデの礼拝と断食をそれぞれ好ましいとする二つの文です。\n\n訳注の参照先と関連する解説\n本文で用いたサイード佐藤訳の訳注が参照する章節と、参考となる同じ訳の解説です。「訳注」は、この訳の刊行者による説明です。\n\nサイード佐藤訳　15章6節\n彼らは（預言者*ムハンマド*に、嘲笑まじりに）言った。「訓戒（クルアーン*）を下された者よ、本当にあなたは、まさしく憑かれた者[1]である。\n訳注\n[1]　彼らは「『あなた方のご先祖が崇めていた（アッラー*以外の）神々を棄（す）て、私に従いなさい』という、彼の主張」、または「自分に訓戒が下されたという、彼の主張」、あるいは単なる嘲笑ゆえに、彼を「憑かれた者」と呼んだのである（アル＝カースイミー1０：３７４７参照）。\n\nサイード佐藤訳　17章92節\nあるいは、あなたが主張しているように、天をいくつもの破片にして私たちの上に落下させる[1]か、あなたがアッラー*と天使*たちを眼前に連れて来る[2]までは。\n訳注\n[1]　復活の日*に天は脆（もろ）くなって割れ、その片々が落下する、とあなたは約束したが、一足早く、現世でそれが起こるようにしてみよ、ということ（イブン・カスィール５：12０参照）。山章４４とその訳注も参照。 [2]　家畜章８－９、111、アル＝ヒジュル章７－８、識別章７も参照。\n\nサイード佐藤訳　3章37節\n彼女（イムラーンの妻）の主は、彼女を快くお受け入れになり、彼女（マルヤム*）を見事にお育てになった。そしてかれは、ザカリーヤー*に彼女の養育をお任せになった[1]。彼（ザカリーヤー*）は彼女を訪れてミフラーブ[2]に入るたびに、彼女のもとに食べ物[3]があるのを見出した。彼は言った。「マルヤム*よ、一体どこからあなたにこれが？」彼女は（答えて）言った。「これは、アッラー*の御許からです。本当にアッラー*は、かれがお望みの者に、際限なくお恵みになるのです。」\n訳注\n[1]　アーヤ*44を参照。 [2]　ここでの「ミフラーブ」とは、独りきりで崇拝*行為や礼拝などに専念するための場所のこと（イブン・アーシュール3：237参照）。 [3]　夏の果物が冬にあったり、冬の果物が夏にあったりしたのだとされる（イブン・カスィール2：36参照）。\n\nサイード佐藤訳　10章54節\nもし、不正*（シルク*）を働いたあらゆる者に、地上にあるもの（全て）があったなら、（そして、それを懲罰を免れるための代償とすることが出来たのならば、）それで償ったであろう。そして懲罰を目の当たりにする時、彼らは（余りの恐怖ゆえ）後悔の念を露わに出来ない[1]。彼らは不正*を受けることなく、自分たちの間を公正に裁かれるのだ。\n訳注\n[1]　「露わに出来ない」と訳した動詞「アラッサ」には、「露わにする」という全く逆の意味もある（アル＝バガウィー2：４2３参照）。\n\nサイード佐藤訳　22章44節\nそして、マドゥヤン*の民も。また、ムーサー*も嘘つき呼ばわりされた。それでわれは不信仰者*らに猶予を与えた後、彼らを（懲罰で）捕らえたのだ。（彼らの不信仰に対する）、わが否認はいかなるものだったか？[1]\n訳注\n[1]　つまり、預言者*らを嘘つき呼ばわりしていた者たちに対する、「わが懲罰と破壊による」否認のこと（アル＝バガウィー３：３４４参照）。\n\nサイード佐藤訳　6章90節\nそれらの者たちは、アッラー*がお導き下さった者たち。ならば（使徒*よ）、彼らの導きをこそ踏襲するのだ。言うがよい。「私はそのことゆえに、あなた方に見返り[1]を求めているわけではない。それは全世界への教訓に外ならないのだから」。\n訳注\n[1]　アッラー*の教えへと招くことと、人々がそれを受け入れることによる、貸しや物質的見返りのこと（アッ＝サアディー2６３頁参照）。\n\nサイード佐藤訳　14章5節\nわれら*は確かに、ムーサー*をわれら*の御徴[1]と共に遣わし（、こう命じ）た。「あなたの民を、闇から光[2]へと（導き）出すのだ。そしてアッラー*の日々[3]について、彼らに思い出させよ」。本当にそこにはまさしく、忍耐*強く感謝深い全ての者[4]への（、アッラーの唯一性*と全能性を示す）御徴があるのだから。\n訳注\n[1]　この「御徴」は奇跡など、ムーサー*の使徒*性の真実を証明するもの（アッ＝タバリー６：４７７３－４７７４参照）。 [2]　この「闇と光」については、アーヤ*1の訳注を参照。 [3]　「アッラー*の日々」とは、イスラーイールの子ら*に対する、アッラー*からの恩恵や試練の日々のこと（ムスリム「功徳の書」1７2参照）。 [4]　アッラー*への服従において辛抱し、禁じられた物事を犯すことにおいて自制し、定められた運命を耐え忍ぶ者、そしてアッラー*に対する義務を行うことで感謝の念を表し、かれの恩恵に感謝深い者のこと。このような者こそは、アッラー*の御徴から真に教訓を得る者である（ムヤッサル2５５頁参照）。\n\nサイード佐藤訳　2章119節\n本当にわれら*はあなたを、、吉報を伝える者、警告を告げる者[1]として、真理と共に遣わしたのである。そして（それを伝えた後、）あなたが火獄の住民について、（責任を）問われることはない。\n訳注\n[1]　預言者*や使徒*は、アッラー*に従う者には天国を約束し、かれを信じず、かれに逆らう者には、地獄を警告する（ムヤッサル33頁参照）。\n\nサイード佐藤訳　2章48節\nそして誰も他人を益することもなければ、いかなる執り成しも受理されず[1]、またどんな代償も受け入れられなければ、彼らが（誰にも）助けられることもない（復活の）日を、恐れよ。\n訳注\n[1]　このアーヤ*は、不信仰のまま悔悟（かいご）することなく、死を迎えた者に対して下ったものとされる。というのも、復活の日*の執り成しが起こることは、信憑（しんぴょう）性の高い多くの伝承によって確証されているからである（アッ=タバリー1:382‐383）。例えば、預言者*ムハンマド*には復活の日*、彼の共同体に対し、執り成しの大きな権限が与えられる（ムスリム「信仰の書」345参照）。ター・ハー章109も参照。\n\nサイード佐藤訳　19章87節\n彼らは（誰に対しても）、執り成し（の権利）を持っていない。しかし、慈悲あまねき*お方（アッラー*）の御許で約束をした者[1]は、別である。\n訳注\n[1]　アッラー*とその使徒*を信じ、従い、アッラー*がお喜びになった者のこと（アッ＝サァディー５００頁参照）。ター・ハー章1０９も参照。\n\nサイード佐藤訳　20章109節\nその日、慈悲あまねき*お方が許可を授け、その言葉においてご満悦された者以外、執り成しは役に立たない。[1]\n訳注\n[1]　アッラー*のお許しがなければ、預言者*や使徒*でさえも、執り成すことはできない。そして執り成しを受ける側も、その言動においてアッラー*がお喜びになる誠実な信仰者でなければ、執り成しを受けることが出来ない（アッ＝サァディー５1３頁参照）。 雌牛章４８の訳注、マルヤム*章８７も参照。\n\nサイード佐藤訳　7章158節\n（使徒*よ、）言ってやるがいい。「人々よ、本当に私はあなた方全員への、アッラー*の使徒*である[1]。（アッラー*は、）かれにこそ諸天と大地の王権が属するお方。かれの外に、崇拝*すべきものなどはない。生を与え、死を与えられる（お方）。ならばアッラー*と、アッラー*とその御言葉を信じるその使徒*。文盲の預言者*を信じ、彼に従うのだ。あなた方が導かれるようにするために」。\n訳注\n[1]　預言者*ムハンマド*は、それ以前の預言者*のように、特定の民に遣わされたのではない。彼は、全人類への教えと共に到来した（アッ＝タバリー５：３６６５参照）。家畜章1９、識別章1、サバア章2８も参照。\n\nサイード佐藤訳　6章158節\n一体彼らは、天使*たちが自分たちのもとに到来するか、またはあなたの主*が御出でにになるか、あるいはあなたの主*の御徴の一部が到来する[1]まで、待っているというのか？あなたの主*の御徴の一部が到来する（復活の）日*、（それ）以前に信仰してはいなかった、あるいはその信仰において善を稼ぐことのなかった者の信仰が、自らを益することはない[2]。（使徒*よ、）言ってやるのだ。「（その時を）待っているがよい。本当に私たちも、待つ者となるから」。\n訳注\n[1]　この「天使*たち」とは、死期が訪れた時に人の魂を召す「死の天使*」のこと。「アッラー*が御出でになる」とは、復活の日*にアッラー*が僕（しもべ）たちをお裁きになるために御出でになること、「主*の御徴の一部の到来」とは、太陽が西から昇るなどの復活の日*の予兆のことである、とされている（前掲書1５０頁参照）。 [2]　預言者*ムハンマド*は仰（おっしゃ）った。「太陽が西から昇る時、全ての者は信仰する」（アル＝ブハーリー４６３５参照）。そしてこの時、不信仰者*が信仰しても意味はない。一方、既に信仰者であった者は、その時に正しい行い*を行っても意味がなくなる（ムヤッサル1５０頁参照）。信仰は、自分自身の選択によって、不可視の世界*を信じることで有効となる。全ての物事が明らかになった時、無理強いされたに等しい状態で信仰しても、意味はない（アッ＝サァディー2８1頁参照）。婦人章1８、ユーヌス*章９０－９1、９９、詩人たち章４とその訳注、赦し深いお方章８４－８５も参照。\n\n関連資料：サイード佐藤訳 111章1節（本文と訳注）\nアブー・ラハブ*の両手[1]は破滅せよ。そして彼は、（確かに）破滅したのだ。[2]\n訳注\n[1]　アラビア語特有の表現で、体の一部「両手」によって体全体を表している。あるいは、「彼の財産、所有物」（アル＝バガウィー５：３2７参照）。その他「預言者*に向けて石を投げていたために、両手が特に言及されている」「彼の現世と来世」といった解釈もある（アル＝バイダーウィー５：５４４参照）。 [2]　「一番近い親族に警告せよ」というアーヤ*（詩人たち章21４）が下った後、預言者*ムハンマド*はサファーの丘に登り、アッラー*からの命令通り、クライシュ族*を集めて「本当に私は厳しい懲罰に先立つ、あなた方への警告者である」（サバア章４６も参照 ）と呼びかけた。それに対し、アブー・ラハブ*が「お前に破滅あれ。こんなことのために私たちを集めたのか？」と言ったことに対し、このスーラ*が下ったとされる（アル＝ブハーリー４９７1参照）。\n\n訳文と出典\nクルアーン：サイード佐藤訳、東京ジャーミイ訳。伝承：日本ムスリム協会の『サヒーフ・ムスリム』掲載訳ほか、本文に示す伝承集。祈り：『ムスリムの砦』（サイード佐藤・ファーティマ佐藤訳）。刊行・転載に関する出典表示と利用条件は、別添「刊行資料・出典記録」に収めています。\n\n引用箇所とクルアーン訳の対応\n同じ節でも、章本文と解説中の引用に異なる訳が使われている場合があります。解説中の番号は、その解説で同じ節を引用した順序です。\n\n第2節の解説 — 35:10の引用1：東京ジャーミイ訳。\n\n第5節の解説 — 53:61の引用1：東京ジャーミイ訳。\n\n第9節の解説 — 47:4の引用1：東京ジャーミイ訳。\n\n第12節の解説 — 73:20の引用1：東京ジャーミイ訳。\n\n第13節・章本文 — 34:13の引用1：東京ジャーミイ訳。\n\n第13節の解説 — 34:13の引用1：サイード佐藤訳。\n\n第13節の解説 — 34:13の引用2：サイード佐藤訳。\n\n第13節の解説 — 34:15の引用1：サイード佐藤訳。\n\n第13節の解説 — 34:13の引用3：東京ジャーミイ訳。\n\n第14節・章本文 — 34:14の引用1：サイード佐藤訳。\n\n第14節の解説 — 34:14の引用1：東京ジャーミイ訳。\n\n第15節・章本文 — 34:15の引用1：東京ジャーミイ訳。\n\n第15節の解説 — 34:15の引用1：サイード佐藤訳。\n\n第15節の解説 — 34:15の引用2：サイード佐藤訳。\n\n第15節の解説 — 34:15の引用3：サイード佐藤訳。\n\n第16節の解説 — 96:6の引用1：東京ジャーミイ訳。\n\n第16節の解説 — 96:7の引用1：東京ジャーミイ訳。\n\n第17節の解説 — 18:40の引用1：東京ジャーミイ訳。\n\n第17節の解説 — 18:41の引用1：東京ジャーミイ訳。\n\n第21節・章本文 — 34:21の引用1：東京ジャーミイ訳。\n\n第23節・章本文 — 34:23の引用1：東京ジャーミイ訳。\n\n第23節の解説 — 34:23の引用1：サイード佐藤訳。\n\n第23節の解説 — 34:23の引用2：サイード佐藤訳。\n\n第23節の解説 — 34:23の引用3：東京ジャーミイ訳。\n\n第27節の解説 — 13:33の引用1：東京ジャーミイ訳。\n\n第36節の解説 — 18:40の引用1：サイード佐藤訳。\n\n第36節の解説 — 18:41の引用1：サイード佐藤訳。\n", "intro": "クルアーン訳と訳注\n本文の引用を選ぶと、その版と節に対応する項目を開けます。訳注は各訳の刊行者による説明です。講義の説明や伝承そのものとは区別されます。\n\n", "hadithIntro": "伝承の出典と注\n日本ムスリム協会の掲載訳は『サヒーフ・ムスリム』の訳です。本文の講義が別の伝承集を参照する場合、本文中でその参照と、引用した並行伝承を区別しています。\n\n", "outro": "訳文と出典\nクルアーン：サイード佐藤訳、東京ジャーミイ訳。伝承：日本ムスリム協会の『サヒーフ・ムスリム』掲載訳ほか、本文に示す伝承集。祈り：『ムスリムの砦』（サイード佐藤・ファーティマ佐藤訳）。刊行・転載に関する出典表示と利用条件は、別添「刊行資料・出典記録」に収めています。\n", "entries": [{"id": "source-1", "heading": "サイード佐藤訳　34章1節", "text": "サイード佐藤訳　34章1節\n諸天にあるものと大地にあるものが属し、来世における称賛[1]があるお方、アッラー*に称賛*あれ。かれは、英知あふれる*お方、通暁されるお方。\n訳注\n[1]　アッラー*が全ての者を完全なる公正さと英知によって裁かれる時、現世ではなかったほどのアッラー*への称賛*が、天国の民・地獄の民・地獄の民の間に起こる（アッ＝サァディー６７４頁参照）。\n", "image": null}, {"id": "source-2", "heading": "サイード佐藤訳　25章32節", "text": "サイード佐藤訳　25章32節\n不信仰に陥った者*たちは、言った。「どうしてクルアーン*は（トーラー*や福音*のように）、彼（預言者*ムハンマド*）に一編に下されないのか？」われら*はそれによってあなたの心を堅固にすべく、（クルアーン*を）そのように（徐々に下）し[1]、またそれを明瞭に区切ったのだ[2]。\n訳注\n[1]　クルアーン*が徐々に下がることによって、安心と堅固さが上乗せされる。特に悲しいことが起こった時などは、過去に下されたものを思い起こすより、出来事の折々に直接下された方が、より強い作用と確固さをもたらすものである（アッ＝サァディー５８2頁参照 ）。夜の旅章1０６とその訳注も参照。 [2]　「明瞭に区切る」と訳した原語「タルティール」には、ここでは以下のような意味が含まれる。「優れた公正と明瞭な意味の言葉とする」「（啓示の時間を）区切って別々にする」「明瞭に区切りつつ、ゆっくりと読誦することを命じる（衣を纏う者章４とその訳注も参照）」（イブン・アーシュール1９：2０参照）。\n", "image": null}, {"id": "source-3", "heading": "サイード佐藤訳　9章124節", "text": "サイード佐藤訳　9章124節\nスーラ*が下ると、彼ら（偽信者*たち）の内のある者は言う。「一体あなた方の内の誰が、これで（更なる）信仰心を上乗せするというのか？」信仰する者たちこそは、（スーラ*の啓示によって、更なる）信仰心を上乗せするのである。そして彼らは、（授けられた信仰心に）心躍らせるのだ。\nこの項目に付された訳注はありません。\n", "image": null}, {"id": "source-4", "heading": "サイード佐藤訳　1章2節", "text": "サイード佐藤訳　1章2節\n全創造物の主*、アッラー*に称賛*あれ、\nこの項目に付された訳注はありません。\n", "image": null}, {"id": "source-5", "heading": "サイード佐藤訳　6章1節", "text": "サイード佐藤訳　6章1節\n諸天と大地を創造され、闇と光[1]をお創りになったアッラー*に、称賛*あれ。その後に及んで不信仰に陥った者*たちは、自分たちの主*に対して（かれ以外のものを）並べている[2]。\n訳注\n[1]　この「闇」と「光」については、雌牛章257の訳注を参照。 [2]　つまり、シルク*を犯しているということ。\n", "image": null}, {"id": "source-6", "heading": "サイード佐藤訳　18章1節", "text": "サイード佐藤訳　18章1節\nその僕（ムハンマド*）に啓典（クルアーン*）をお下しになり、それにいかなる歪み[1]ももたらされなかったアッラー*に、称賛*あれ。\n訳注\n[1]　「歪み」とは、真理からの逸脱のこと（ムヤッサル2９３頁参照）。\n", "image": null}, {"id": "source-7", "heading": "サイード佐藤訳　1章4節", "text": "サイード佐藤訳　1章4節\n報いの日*の支配者（に）。\nこの項目に付された訳注はありません。\n", "image": null}, {"id": "source-8", "heading": "サイード佐藤訳　3章178節", "text": "サイード佐藤訳　3章178節\n不信仰に陥った者*たちは、われら*が彼らに（懲罰を下さず）猶予を与えてやっていることを、自分たちにとって善いことなどと断じて思ってはならない。われらは、彼らが自分たちに罪を上乗せさせるべく、猶予を与えてやっているに外ならないのだから。そして彼らには、屈辱的な懲罰がある。\nこの項目に付された訳注はありません。\n", "image": null}, {"id": "source-9", "heading": "サイード佐藤訳　18章82節", "text": "サイード佐藤訳　18章82節\nまた壁はといえば、それは町の孤児である、二人の少年のものであった。そしてその下には、二人のための財宝があり、二人の父親は正しい*人であった。それであなたの主は、二人が成熟し[1]、自分たちの財宝を掘り出すことを、あなたの主からの（彼らに対する）ご慈悲として、お望みになったのだ。そして（ムーサー*よ、）私はそれ（ら）を、自分の一存でしたわけではない[2]。それが、あなたが我慢することの出来なかったことの、解釈である。」\n訳注\n[1]　この「成熟」とは、成人*することであるとされる（イブン・カスィール５：1８７参照）。「成人*」については、婦人章６の「結婚」についての訳注を参照。 [2]　ハディルはこれらのことを、アッラー*からのご命令のもとに行ったのである（ムヤッサル３０2頁参照）。\n", "image": null}, {"id": "source-10", "heading": "サイード佐藤訳　17章52節", "text": "サイード佐藤訳　17章52節\nかれ（アッラー*）があなた方を（墓場から出て来るよう）お呼びになり、あなた方がかれを称賛*しつつ（そのご命令に）応じ、自分たちは（現世で）少しの間しか過ごさなかったと思う[1]日。\n訳注\n[1]　「（現世で）少ししか過ごさなかったと思う」については、ユーヌス*章４５とその訳注、及びター・ハー章1０３、信仰者たち章11３－11４、ビサンチン章５５、砂丘章３５、引き離すもの章４６も参照。\n", "image": null}, {"id": "source-11", "heading": "サイード佐藤訳　35章10節", "text": "サイード佐藤訳　35章10節\n権勢を求める者があるならば（、アッラー*からそれを求めよ[1]）、アッラー*にこそ全ての威力が属するのだ。かれにこそ善き言葉は昇っていくのであり、正しい行い*がそれを上げる[2]。そして悪を策謀する者たち、彼らには厳しい懲罰があり、それらの者たちの策謀こそは、ご破算になるのだ。\n訳注\n[1]　アッラー*ではなく、その創造物に権勢を求める者は、かれからそれを授かる。そしてアッラー*からの権勢とは、かれへの服従によって得られるものなのであう。（前掲書、同頁参照）。 [2]　「善き言葉」は、シャハーダ*の言葉、唱念、奇岩、クルアーン*の読誦、イスラーム*学の教授など、全ての善い言葉を指すとされる。本文のように「正しい行い*」」が「善き言葉」を上げる、つまり正しい行い*が伴うわない言葉は受け入れられない、といった解釈の外にも、①「善き言葉」が「正しい行い*」を上げる、つまりシャハーダ*の言葉を語ったムスリム*からこそ、正しい行い*は受け入れられる、②アッラー*がそれを「上げて」お受入れになる、といった解釈もある（イブン・ジュザイ2：212－21３参照）。\n", "image": null}, {"id": "source-12", "heading": "サイード佐藤訳　20章45節", "text": "サイード佐藤訳　20章45節\n彼ら二人は、申し上げた。「我らが主*よ、本当に私たちは、彼が私たちに対して早まったこと[1]をしたり、あるいは（真理に対して）高慢になったりすることを怖れます」。\n訳注\n[1]　つまり、彼らを罰すること（ムヤッサル３1４頁参照）。\n", "image": null}, {"id": "source-13", "heading": "サイード佐藤訳　20章46節", "text": "サイード佐藤訳　20章46節\nかれは仰せられた。「怖れるのではない。実にわれは、あなた方二人と共にあり、（あなた方のことを）聞き、見ているのだから」。\nこの項目に付された訳注はありません。\n", "image": null}, {"id": "source-14", "heading": "サイード佐藤訳　35章45節", "text": "サイード佐藤訳　35章45節\nもしアッラー*が人々を彼らが稼いだもの[1]ゆえにお咎めになれば、かれは（大地の）その表面に、いかなる生物も残してはおかなかっただろう[2]。しかしかれは、彼ら（の懲罰）を定められた時まで遅らせ給うのだ。そして彼らの（懲罰の）時が来たら、（かれは彼らを罰し給う、）本当にアッラー*はもとより、その僕たちをよくご覧になるお方。\n訳注\n[1]　「稼いだもの」とは、罪のこと（前掲書４４０頁参照）。 [2]　同様のアーヤ*として、蜜蜂章６1とその訳注を参照。\n", "image": null}, {"id": "source-15", "heading": "サイード佐藤訳　34章2節", "text": "サイード佐藤訳　34章2節\nかれは大地の中に入り込むものも、そこから出てくるものも、天から落ちてくるものも、そこへ昇っていくもの[1]も、（全て）ご存知である。かれは慈愛深い*お方、赦し深いお方。\n訳注\n[1]　「大地の中に入り込むもの」とは、水などを、「そこから出てくるもの」とは、植物、鉱物、水などを、「天から落ちてくるもの」とは雨、天使*、啓示などを、「そこへ昇っていくもの」とは、天使*、人間の行いなどを指す、とされる（ムヤッサル４2８頁参照） 。\n", "image": null}, {"id": "source-16", "heading": "サイード佐藤訳　34章3節", "text": "サイード佐藤訳　34章3節\n不信仰に陥った者*たちは、言った。「（復活*の）その時は、私たちにはやって来ない」。（使徒*よ、）言ってやれ。「いや、不可視の世界*をご存知である我が主*にかけて、それは必ずや、あなた方のもとに到来する。諸天であろうが大地であろうが、僅かな重みでも、かれ（の知識）から免れることはない。また、それより小さいものでも、大きなものでも、明白な書（守られし碑板*）に（予め記されてい）ないものはないのだ[1]。\n訳注\n[1]　同様のアーヤ*として、婦人章４０、家畜章５９、ユーヌス*章６1も参照。\n", "image": null}, {"id": "source-17", "heading": "サイード佐藤訳　75章5節", "text": "サイード佐藤訳　75章5節\nいや、（不信仰な）人間は、自らの前途において[1]放逸であることを欲し（、復活を否定し）ている。\n訳注\n[1]　ほかにも、「自分自身の目的と欲望の追求において」「復活の日*が到来する前に」といった解釈もある（イブン・ジュザイ2：５1３参照）。\n", "image": null}, {"id": "source-18", "heading": "サイード佐藤訳　31章16節", "text": "サイード佐藤訳　31章16節\n（ルクマーンは言った。）「我が息子よ、実にそれが（悪行であれ、善行であれ）、たとえ芥子種一粒の重さ（ほどのもの）であり、岩の中にあったとしても、または諸天（のどこか）、あるいは大地（のどこか）にあったとしても、アッラー*は（復活の日*）それを持ち出してこられ（、秤におかけにな）るのだ。本当にアッラーはまさしく、霊妙な*お方、（全てに）通暁されたお方なのだから。[1]\n訳注\n[1]　同様の意味のアーヤ*として、婦人賞４０、洞窟章４９、預言者*たち章４７、地震章７－８なども参照。\n", "image": null}, {"id": "source-19", "heading": "サイード佐藤訳　4章104節", "text": "サイード佐藤訳　4章104節\nあなた方は、敵を追うことに弱気になってはならない。あなた方が苦しかったとしても、本当に彼らも、あなた方が苦しむように苦しんでいるのだから。しかもあなた方は、彼らが期待してはいないもの[1]をアッラー*から期待している。アッラー*はもとより、全知者、英知あふれる*お方。\n訳注\n[1]　来世での褒美や、勝利、アッラーからのご援助のこと（ムヤッサル95頁参照）。\n", "image": null}, {"id": "source-20", "heading": "サイード佐藤訳　34章6節", "text": "サイード佐藤訳　34章6節\nそして知識を授けられた者たちは、あなたの主*からあなたに下されたもの（クルアーン*）が真理であり、偉力ならびない*お方、称賛*されるべきお方（アッラー*）の道へと導いてくれるものであると分かるのだ。\nこの項目に付された訳注はありません。\n", "image": null}, {"id": "source-21", "heading": "サイード佐藤訳　72章4節", "text": "サイード佐藤訳　72章4節\nまた、私たちの内の愚か者[1]が、アッラー*に対して（真実から）逸脱したこと[2]を言っていたということ。\n訳注\n[1]　この「愚か者」には、「イブリース*」「シルク*を犯すジン*」といった解釈がある（イブン・カスィール８：2３９参照）。 [2]　洞窟章1４の同様の表現と、その訳注も参照。\n", "image": null}, {"id": "source-22", "heading": "サイード佐藤訳　15章90節", "text": "サイード佐藤訳　15章90節\n同様にわれら*は、分断する者たち[1]にも（懲罰を）下したのだ。\n訳注\n[1]　「分断する者たち」とは、クルアーン*のある部分は信じるが、別の部分は信じない、という啓典の民*や、それ以外の不信仰者*たちのことであるとされる（ムヤッサル2６６頁参照）。\n", "image": null}, {"id": "source-23", "heading": "サイード佐藤訳　15章91節", "text": "サイード佐藤訳　15章91節\nクルアーン*を、ばらばらにした[1]者たちに。\n訳注\n[1]　「クルアーン*をばらばらにした」の解釈には、「アーヤ*９０と同様の意味」「クルアーン*における彼らの意見を、『嘘』『魔術』『占い師の言葉』『詩』などという風に、『ばらばらにした』」「魔術と見なした」「嘘とした」といった諸説がある（アル＝クルトゥビー1０：５８－５９頁参照）。\n", "image": null}, {"id": "source-24", "heading": "サイード佐藤訳　41章26節", "text": "サイード佐藤訳　41章26節\n不信仰に陥った者*たちは（、互いに助言し合って、こう）言った。このクルアーン*には耳を傾けず、それ（読誦）に対して戯言を言って（邪魔して）やれ[1]。（それによって読誦を阻み、）あなた方が優勢となるように」。\n訳注\n[1]　クライシュ族*の不信仰者*らは、預言者*がクルアーンを読誦すると、口笛や拍手をしたり、雑音を立てたりして、それを妨害した（アッ＝タバリー９：７1９1参照）。\n", "image": null}, {"id": "source-25", "heading": "サイード佐藤訳　53章61節", "text": "サイード佐藤訳　53章61節\n得意然となっ（て、そこから背いた）たままで？\nこの項目に付された訳注はありません。\n", "image": null}, {"id": "source-26", "heading": "サイード佐藤訳　8章36節", "text": "サイード佐藤訳　8章36節\n本当に不信仰に陥った者*たちは、アッラー*の道を阻むべく、彼らの財産を費やす。彼らはそれを費やすであろう。やがてそれは彼らにとっての悲痛となり、それから彼らは打ち負かされるのだ。そして不信仰だった者*たちは、地獄へと召集させられるのである。[1]\n訳注\n[1]　このアーヤ*は一悦に、バドルの戦い*での敗戦の雪辱を果たすべく、再戦にむけて大金を費やしたアブー・スフヤーン*に関して下ったとされる。しかしアーヤ*の意味は、同様の状態にある全ての不信仰者*に当てはまるものである（イブン・カスィール４：５３参照）。\n", "image": null}, {"id": "source-27", "heading": "サイード佐藤訳　34章33節", "text": "サイード佐藤訳　34章33節\nそして、抑圧されていた者たちは高慢だった者たちに言う。「いや、私たちがアッラー*を否定し、かれに（崇拝の）同位者を置くよう、あなた方が私たちに命じていた時、（あなた方の）夜と昼の策謀が（私たちを破滅させたのだ）」。そして懲罰を目の当たりにする時、彼らは（余りの恐怖ゆえ）後悔の念を露わに出来ない[1]。また、われら*は不信仰だった者*たちの首に、枷を縛り付ける。一体彼らが報われるのは、自分たちが（現世で）行っていたこと（によるもの）以外の、何ものでもないのではないか？\n訳注\n[1]　「後悔の念を露わに出来ない」という表現については、ユーヌス*章５４の訳注を参照。\n", "image": null, "links": [{"start": 283, "end": 291, "target": "helper-10-54"}]}, {"id": "source-28", "heading": "サイード佐藤訳　8章32節", "text": "サイード佐藤訳　8章32節\n彼らが、（こう）言った時のこと（を思い起させるがよい）。「アッラー*よ、もしこれが本当にあなたの御許からの真実であるなら、天から私たちの上に石をお降らしになるか、あるいは私たちに痛ましい懲罰をお与え下さい」。[1]\n訳注\n[1]　不信仰者*らは、その無知さ、頑迷さから、懲罰を早く下してみよ、と求めたものだった。家畜章５７－５８、ユーヌス*章５０、フード*章８、雷鳴章６、夜の旅章９2、巡礼*章４７、蜘蛛章５３－５４、サード章1６、相談章1８、階段章1－2なども参照。\n", "image": null}, {"id": "source-29", "heading": "サイード佐藤訳　10章15節", "text": "サイード佐藤訳　10章15節\nまた、彼ら（シルク*の徒）にわれら*の明白な御徴（アーヤ*）が読誦された時、われらとの拝謁を望まない[1]者たちは（、こう）言った「これではないクルアーン*を披露してみよ。あるいは、それを変えよ[2]」。（使徒*よ、）言ってやるがいい。「私には、それを自分勝手に変更する権利などない。ただ私は、自分に啓示されたものに従うだけなのだから。本当に私は、もし我が主*に逆らったりしたら、偉大なる（復活の*）日の懲罰（が降りかかること）を怖れている」。\n訳注\n[1]　この「望まない」については、アーヤ*７の訳注を参照。 [2]　「これではないクルアーン*」とは、不信仰者*らの崇めていた偶像などを批判し、禁じるようなものではないもののこと（アル＝バガウィー2：４1４参照）。また「（クルアーン*を）変える」こととは、不信仰者*らの意向に沿って、警告のアーヤ*を吉報のアーヤ*に変えたり、何かを非合法とするアーヤ*を合法とするアーヤ*に変えたり、またその逆にしたりすること（アッ＝タバリー５：４1８８参照）。\n", "image": null}, {"id": "source-30", "heading": "サイード佐藤訳　34章7節", "text": "サイード佐藤訳　34章7節\n不信仰に陥った者*たちは（嘲笑しつつ、お互いに）言った。「（死んで）跡形もなくばらばらにされた後、本当にあなた方は新たに創造されるのだ、などとあなた方に告げる男[1]を、あなた方に見せてやろうか？」\n訳注\n[1]　復活を説く預言者*ムハンマド*のことを、意図している（前掲書、同頁参照）。\n", "image": null}, {"id": "source-31", "heading": "サイード佐藤訳　36章78節", "text": "サイード佐藤訳　36章78節\nそして彼は自分自身の創造を忘れて、われら*に対して（許されない）譬え[1]を挙げた。彼は言ったのだ。「誰が、朽ち果てた骨に生を与えるというのか？」\n訳注\n[1]　創造主の力を、創造物の力と同様のものとして推測したことを表す（ムヤッサル４４５頁参照）。\n", "image": null}, {"id": "source-32", "heading": "サイード佐藤訳　26章39節", "text": "サイード佐藤訳　26章39節\nそして人々には、（こう）言われた。「あなた方は、集合するのか？」[1]\n訳注\n[1]　これは、人々に早く集まることを促す、アラビア語的表現（アル＝バイダーウィー４：2３７参照）。\n", "image": null}, {"id": "source-33", "heading": "サイード佐藤訳　26章40節", "text": "サイード佐藤訳　26章40節\n（人々は言った。）「私たちは、魔術師たちに従おう。彼らこそが勝利者となったならば」。\nこの項目に付された訳注はありません。\n", "image": null}, {"id": "source-34", "heading": "サイード佐藤訳　34章8節", "text": "サイード佐藤訳　34章8節\n一体、彼はアッラー*に対して嘘を捏造したのか？それとも、彼には憑き物がついている[1]とでも？いや、来世を信じない者たちは（来世においては）懲罰と、（現世においては）遠い迷いの中にある。\n訳注\n[1]　アル＝ヒジュル章６「憑かれた者」の訳注を参照。\n", "image": null, "links": [{"start": 115, "end": 124, "target": "helper-15-6"}]}, {"id": "source-35", "heading": "サイード佐藤訳　40章26節", "text": "サイード佐藤訳　40章26節\nフィルアウン*は、（自分の民の有力者たちに）言った。「私にムーサー*を殺させ、彼を自分の主*に祈らせてみよ。本当に私は、彼があなた方の宗教[1]を変えてしまったり、地上（エジプト）に腐敗*を出現させたりすることを怖れているのだ」。\n訳注\n[1]　フィルアウン*を崇める「宗教」のこと（アル＝クルトゥビー1５：３０５参照）。フィルアウン*は神を自称していた。詩人たち章2９、物語章３８、至高者*章2４も参照。\n", "image": null}, {"id": "source-36", "heading": "サイード佐藤訳　47章4節", "text": "サイード佐藤訳　47章4節\nゆえに（信仰者たちよ）、あなた方が不信仰に陥った者*たちと（戦場で）会ったならば、首への打撃を（食らわせよ）。やがて、あなた方が彼らを徹底的に痛めつけたならば、戦争が幕を引くまで（捕虜に）綱を縛りつけ、後に情けをかけて（無償で解放して）やるか、身代金（を受け取って解放する）か（、するのだ）。[1]。（事は、）そうなのである。そしてアッラー*がお望みであったなら、（信仰者たちを、戦いなしで）彼ら（不信仰者*たち）に勝利させられただろう。だが（戦いが定められたのは）、あなた方の一方を別の一方で試練[2]におかけになるため。かれ（アッラー*）は、アッラー*の道において殺された（信仰）者たちの行い（に対する報い）を、無に帰させ給わない。\n訳注\n[1]　捕虜はこのほか、「死刑」「奴隷*にする」などという選択肢もある（法学派によって相違の 見解あり）が、いずれもその決定権は、イスラーム*国家の統治者、あるいはその代理人に属する（クウェイト法学大全４：2００－2０1）。アーヤ*2０「戦いの命令」についての訳注、および戦利品*章６７－６８とその訳注も参照。 [2]　「試練」にいついては、雌牛章21４、イムラーン家章1８６、悔悟章1６、洞窟章７、蜘蛛章2、王権章2とそれらの訳注も参照。\n", "image": null}, {"id": "source-37", "heading": "サイード佐藤訳　34章22節", "text": "サイード佐藤訳　34章22節\n（使徒*よ、）言え。「アッラー*を差しおいて、あなた方が（かれの同位者と）主張して（崇めて）いる者たちに、祈るがよい。彼らは諸天においても大地においても、僅かな重みすら有してはいないのだ[1]。そして彼らにはそこにおいて、（アッラー*に対する）いかなる加担もなければ、かれ（アッラー*）には、彼らからのいかなる援助者もない」。\n訳注\n[1]　いかなる害益（がいえき）をもたらす力もない、ということ（アッ＝タバリー８：６７５０参照）。\n", "image": null}, {"id": "source-38", "heading": "サイード佐藤訳　34章10節", "text": "サイード佐藤訳　34章10節\nわれら*は確かに、われら*の御許からの恩寵[1]を、ダーウード*に授けた。（われら*は言った。）「山々よ、彼と、そして鳥と共に（アッラー*を称え*て）連呼せよ」。また、われら*は彼のために、鉄を柔らかくしてやった。\n訳注\n[1]　預言者*としての使命と、啓典、知識のこと（ムヤッサル４2９頁参照） 。\n", "image": null}, {"id": "source-39", "heading": "サイード佐藤訳　73章2節", "text": "サイード佐藤訳　73章2節\n少しだけ除いて、（礼拝のため）夜に起きていよ。[1]\n訳注\n[1]　この夜中の礼拝（夜の旅章７９の訳注も参照）の義務は、このアーヤ*が下った一年後、アーヤ*2０によって撤回（「アーヤ*の撤回」については、、雌牛章1０６の訳注を参照）され、ムスリム*たちにとっての任意の行為となった（ムスリム「旅行者の礼拝とその短縮の書」1３９参照）。\n", "image": null}, {"id": "source-40", "heading": "サイード佐藤訳　73章3節", "text": "サイード佐藤訳　73章3節\nつまり、その半分（を起きて過ごせ）。または、そこから少し（、つまり三分の一まで）減らすがよい。\nこの項目に付された訳注はありません。\n", "image": null}, {"id": "source-41", "heading": "サイード佐藤訳　73章4節", "text": "サイード佐藤訳　73章4節\nあるいは、そこに上乗せし（、三分の二にし）てもよい。そしてクルアーン*を、明瞭に区切りつつ読誦せよ[1]。\n訳注\n[1]　つまり、各文字をはっきりと発音し、伸ばすべき箇所は伸ばしつつ、ゆっくりと読誦すること（イブン・アーシュール2９：2６０参照）。\n", "image": null}, {"id": "source-42", "heading": "サイード佐藤訳　73章5節", "text": "サイード佐藤訳　73章5節\n（預言者*よ、）本当にわれら*は、あなたに重厚な言葉（クルアーン*）[1]を投げかけよう。\n訳注\n[1]　「重厚な」の解釈には、「そこに含まれる様々な宗教義務」「高貴な」「その褒美がｍ復活の日*の秤に思い」「不信仰者*たちにとって厳しい」「その啓示を受け取る時に、使徒*
