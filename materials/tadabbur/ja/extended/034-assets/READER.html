<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サバア章を深く読む</title><style>body{font-family:Meiryo,"Yu Gothic",sans-serif;color:#1c302c;background:#f7faf8;margin:0}header,main,aside{max-width:900px;margin:auto;padding:24px}header{position:sticky;top:0;background:#f7faf8ee;border-bottom:1px solid #d2dfd8;z-index:2}button,.nav{font:inherit;color:#145d4c;border:1px solid #8fbaa7;border-radius:8px;padding:8px 14px;background:white}pre,#notes-entries{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.95;margin:0}#reader a,#notes-entries a{color:inherit;text-decoration:underline;text-decoration-color:#9bbdae;text-underline-offset:4px}aside{border-top:2px solid #92b9a7}section{scroll-margin-top:110px;padding:24px 0;border-bottom:1px solid #d2dfd8}img{display:block;width:100%;height:auto;border:1px solid #ccc;margin-top:14px}h1{font-size:22px}#copy-status,#notes-copy-status{margin-left:12px;font-size:14px}#publication-text{font-size:14px;line-height:1.8}</style><header><button id="copy-reader">本文をコピー</button><span id="copy-status"></span> <a class="nav" href="#source-notes">出典と訳注</a> <a class="nav" href="#publication">刊行資料</a></header><main><pre id="reader"></pre></main><aside id="source-notes"><h1>クルアーン訳と訳注・伝承の出典と注</h1><button id="copy-notes">出典と訳注のテキストをコピー</button><span id="notes-copy-status"></span><p>47章4節と73章20節の東京ジャーミイ訳注は、ふりがなを保った原本画像で掲載しています。この二つの訳注画像は、テキストのコピーには含まれません。</p><div id="notes-entries"></div></aside><aside id="publication"><h1>刊行資料・出典記録</h1><pre id="publication-text"></pre></aside><script>const client={"text": "サバア章を深く読む\n\nマッカ啓示の章・全54節\n\n原資料：アフマド・アブドゥルムンイム博士によるサバア章解説の講義。提供された6本の書き起こしに基づく。\n\nこの版のアラビア語原稿には、サバア章の全節と、提供資料に基づく解説が収められている。複数の箇所に分かれていた説明をそれぞれの節のもとにまとめ、意味の捉え方、その根拠、具体例を保ちながら、解説に適した明瞭な標準アラビア語に整えている。\n\nクルアーンのアラビア語本文：Tanzil Project、バージョン1.1。\n\n© 2007–2026 Tanzil Project · CC BY 3.0 · https://tanzil.net\n\n慈悲あまねく*慈愛深き*アッラー*の御名において。\n\n第1節\n\n諸天にあるものと大地にあるものが属し、来世における称賛[1]があるお方、アッラー*に称賛*あれ。かれは、英知あふれる*お方、通暁されるお方。\n\nこの章を考える入口は、アッラーへの称賛である。ぜいたくに暮らす者たちの力、財産、策略を語る前に、章は心を、支配についての根本的な事実へ立ち返らせる。この節には、『諸天にあるものと大地にあるものが属し』とある。人々の手にあるものは、主の支配から奪い取られたものではない。それを創造し、所有し、処分する権能を持つのはアッラーである。この認識があれば、信仰者は自分たちが弱い立場に置かれた状況を、見通しをもって受け止められる。虚偽に従う者たちの財力や装備が勝っていると、絶望したり、身を引いたりしたくなる人もいる。迎合して、それまで正しく歩んでいた道を変えたくなることもある。弱い立場にある者が試され、「力のある側こそ正しいのではないか」と思い込むことさえある。この章は、働き続ける信仰者を支え、力に目を奪われた者を目覚めさせ、思い上がる者には、誇っているものが、取り上げられることもある賜物なのだと思い出させる。\nこれこそ、クルアーンが生活にもたらす働きである。啓示を受け止めた人々の心は、自分自身、家庭、社会、そして虚偽との対立という問題に向き合っていた。必要としていたのは、難しい言葉の意味を知ることだけではなかった。啓示が少しずつ下された理由について、アッラーは『われら*はそれによってあなたの心を堅固にすべく、（クルアーン*を）そのように（徐々に下）し[1]』と仰せになる（25：32からの抜粋）。預言者の心が啓示によって確かにされたのであれば、その後に生きる私たちには、なおさらその光が必要である。信仰者に一つの章が及ぼす働きについても、『信仰する者たちこそは、（スーラ*の啓示によって、更なる）信仰心を上乗せするのである。そして彼らは、（授けられた信仰心に）心躍らせるのだ。』と述べられている（9：124）。解釈を学べば意味への扉が開く。そのうえで、この命、光、導きが、確信、行動、物事の評価に表れることが大切である。\n称賛の言葉で始まる章は五つある。開端章、家畜章、洞窟章、サバア章、創成者章である。称賛に続くアッラーの説明は、それぞれの章の目的の一面を照らしている。開端章には『全創造物の主*、アッラー*に称賛*あれ、』とあり（1：2）、その後に、まっすぐな道への導きを願う祈りが続く。怒りを受ける道や迷いから救われるのは、主の恵みと導きによる。家畜章の『諸天と大地を創造され、闇と光[1]をお創りになったアッラー*に、称賛*あれ。』（6：1）は、導きと迷いを明らかにし、その違いを見分けさせる恵みを思い起こさせる。この章では、多神崇拝の愚かさが、自分の子供を殺すところにまで至ることも示される。洞窟章は『その僕（ムハンマド*）に啓典（クルアーン*）をお下しになり、それにいかなる歪み[1]ももたらされなかったアッラー*に、称賛*あれ。』と始まる（18：1）。権力、財産、知識によって試される中で、信仰者は、自分を導く啓典を授けてくださった主を称える。そしてサバア章では、虚偽に従う者たちを思い上がらせるさまざまな手段を前に、支配のすべてがアッラーに属することを称えるのである。\nハムド、すなわち称賛は、完全な属性を備え、称えられるにふさわしいアッラーをたたえることだ。自分に起きたことの一つ一つについて、どこに恵みがあるのか理解できることが、その条件ではない。一方、シュクル、すなわち感謝は、受けた善意や恵みと結びつく。食べ物があるときも、なくなったときも、金銭的な危機の最中も、それを乗り越えた後も、力を得る前も後も、アッラーを称える。人の見方が狭かったり、目先のものを愛する気持ちに押されたりして、英知がどこにあるのか分からないことはある。それによって、アッラーが称賛に値することが失われるわけではない。アイシャが伝えるイブン・マージャ3803では、預言者は好ましいことと好ましくないことを目にしたとき、どちらもアッラーを称えたとされる。『ムスリムの砦』第106項・218番は、嬉しいことがもたらされたときの言葉を「アッラーに称えあれ。善行はかれの\n恩恵によって完遂されます。」、嫌なことがもたらされたときの言葉を「どのような状況であれ、アッラー\nを称えます。」と記している。イブン・マージャ3803の評価は、ダールッサラームでは「弱い」、アル＝アルバーニーでは「良好（ハサン）」とされる。\n天と大地のうち、天が先に挙げられることは、地上の力だけを見つめる狭さから、アッラーの支配の広大さへと目を向けさせる。人間の持つものは、どれほどその機器が巨大になろうとも、人間が把握し尽くせない天体や広がりに比べれば小さい。心には、目に見えるものの向こうに、見えない世界、天使たち、来世がある。現実を評価する尺度を、目に映る一部分だけに閉じ込めてはならない。\n続いて、この節の『来世における称賛[1]があるお方』という表現がある。来世では、この世で隠れていた英知と報いの真相が明らかになり、アッラーが称賛にふさわしいことが、はっきり現れる。これは開端章の『報いの日*の支配者（に）。』（1：4）にも似ている。どの日もアッラーの支配のもとにあるが、報いの日には、その支配が明白となり、誰もアッラーと並んで支配権を主張できなくなる。この世では、信仰者が試され、圧制者に猶予が与えられるのを前に、理由が分からずにいることもある。しかし結末が明らかになれば、屈辱だと思っていたことが、位を高めることだったと分かる。ある猶予は悔い改めへの入口となり、ある猶予は罪を重ねることになる。『われらは、彼らが自分たちに罪を上乗せさせるべく、猶予を与えてやっているに外ならないのだから。』と仰せられるとおりである（3：178）。理解できなかったことが明らかになるさまは、『それが、あなたが我慢することの出来なかったことの、解釈である。』という言葉からも思い描ける（18：82）。また、『かれ（アッラー*）があなた方を（墓場から出て来るよう）お呼びになり、あなた方がかれを称賛*しつつ（そのご命令に）応じ』という一節（17：52）の意味の一つとして、復活した被造物が、それまで自分たちを隔てていたものが消え去った後、主の偉大さを認めることが挙げられる。\nアッラーの恵みの広さと報いの公正さは、善行が十倍から七百倍に増やされること、悪行は一つ分しか記されないこと、悪行を控えることが善行になる場合もあることにも表れている。同じイブン・アッバースの伝承の別経路に付された結びには、「アッラーはまた、極悪者（注）以外には誰をも破滅させることはなさらない」とある（ムスリム131b）。執り成しの場で、預言者は主に平伏し、「私以前の者には誰にも啓示しなかった主に対する讃美と賞揚の言葉」を教えられる（ムスリム194a〔並行伝承〕、ブハーリー4712〔講義〕）。真相が明らかになるときにも、人々の裁きが始まるときにも、称賛はそこにある。\nこの章の冒頭は、『かれは、英知あふれる*お方、通暁されるお方。』と結ばれる。人間は大きな財産を所有しても、無知や愚かさから、それを置くべきでないところに置いてしまうことがある。しかしアッラーの支配には、完全な英知と、すべてを包む知が伴う。英知とは、物事をふさわしいところに置くことだ。通暁するとは、その実情と結末を知り尽くすことである。人間の場合、医師は学んだ後にも、実地の経験を必要とする。夜の旅の伝承では、ムーサーは「私自身イスラエルの民に試み彼らにそれを課したのですが、彼らはそのような重い負担に耐えきれなかったのです」と、イスラーイールの子らとの経験に基づき、礼拝の軽減を預言者に助言した（ムスリム162a〔並行伝承〕、ブハーリー3207〔講義〕）。アッラーは、経験によって知識を得られるのではない。物事が起きて初めて、その結末を知るのでもない。起きたこと、これから起きること、起きなかったことが仮に起きたならどうなるかまで、ご存知である。信仰者が目にする試練や、さまざまな手段の移り変わりを取り計らうのは、すべてを所有し、英知を備え、あらゆることに通暁するお方なのだ。細かな英知をすべて把握できなくとも、心の安らぎは、この認識に根を下ろす。\n\n第2節\n\nかれは大地の中に入り込むものも、そこから出てくるものも、天から落ちてくるものも、そこへ昇っていくもの[1]も、（全て）ご存知である。かれは慈愛深い*お方、赦し深いお方。\n\nすべてを支配されることに続いて、すべてをご存知であることが示される。この節は、動きに満ちた宇宙の光景を、心の前に開く。大地に入るもの、そこから出るもの、天から下るもの、そこへ昇るもの。その意味は、目になじんだ雨や植物の光景だけに限られない。どれほど小さな粒や水滴、隠れた動きも、アッラーがご存知でないものはない。下ってくる糧、恵み、懲罰も、昇っていく祈り、神をたたえる言葉、称賛、行いも、すべてその知のうちにある。\n人々の善悪の行いとして記されることも、その知に含まれる。視線の動きも、その人が胸に隠す悪い憶測も同じである。ただし悪行が記録されるということは、それが受け入れられる行いとしてアッラーのもとへ上げられる、という意味ではない。この点で、創成者章には『良い言葉はかの御方へと昇る。正しい行いは高く掲げられる。』とある（35：10）。この訳は、善い言葉が昇り、正しい行いが高く掲げられることを述べる。何が何を上げるのかという関係までは明示していない。もし人間が、ほんの一瞬に、入る、出る、下る、昇るものを数え尽くすよう求められたら、到底できない。アッラーは、その一部を知ることで、ほかのことを知る妨げを受けることがない。\n出来事によって心が狭くなるときこそ、この広がりが必要になる。ある圧制者の権力を大きく見すぎて、その人が生きるか死ぬかに、宇宙のすべてがかかっているかのように思ってしまうことがある。しかし、その人も弱い被造物であり、ごく小さな原因によって動けなくなることがある。心を確かに保つことは、使徒としての使命を担ううえでも、余分なことではない。ムーサーはフィルアウンのもとへ遣わされるとき、胸を開いていただくこと、務めを容易にしていただくこと、舌の結び目を解いていただくことを願った。ムーサーとハールーンは、『彼ら二人は、申し上げた。「我らが主*よ、本当に私たちは、彼が私たちに対して早まったこと[1]をしたり、あるいは（真理に対して）高慢になったりすることを怖れます」。』と申し上げた（20：45）。それに対して、『かれは仰せられた。「怖れるのではない。実にわれは、あなた方二人と共にあり、（あなた方のことを）聞き、見ているのだから」。』という答えが与えられた（20：46）。二人は、アッラーが聞き、ご覧になることを知っていた。それでも恐怖を覚えるその場では、この特別な支えを必要としたのである。だからこそ、啓示は繰り返し読誦される。すでに知っていることへの心の確信を新たにし、歩みを確かにするためである。\n昇り下りするものの中には、人々の行いと、その人々への糧もある。もしこの世で、すぐに完全な報いが行われ、どの罪にもその場で罰が与えられるなら、過ちを犯しながらも安らかに暮らすという、私たちの目にする余地は残らない。『もしアッラー*が人々を彼らが稼いだもの[1]ゆえにお咎めになれば、かれは（大地の）その表面に、いかなる生物も残してはおかなかっただろう[2]。』と仰せられるとおりである（35：45）。しかし、この世は猶予を与えられ、試される場であり、完全な報いには別の日がある。アッラーほど、聞こえてくる不当な言葉に忍耐されるお方はいない。人々はアッラーに子があると主張するが、それでもかれは、彼らに糧を与え、健やかにしてくださる、と伝えられる（ブハーリー6099、伝承の意味）。これは、この節の『かれは慈愛深い*お方、赦し深いお方。』という結びとよくつながる。人々のすることをすべてご存知でも、罪のたびに糧を断たれるのではない。慈しみ、猶予を与え、赦してくださる。\nもう一つの面から見れば、この取り計らいと賜物には、大きな感謝がふさわしい。それなのに人々は感謝を尽くせずにいる。そのような人々を、アッラーは慈しみと赦しをもって迎えられる。これから語られるダーウードの一族とサバアの民には、感謝として行動する者と、恵みに背を向ける者との違いが現れる。無事な暮らしが続くからといって、恵みを与えるお方への感謝を忘れてはならない。\n\n第3節\n\n不信仰に陥った者*たちは、言った。「（復活*の）その時は、私たちにはやって来ない」。（使徒*よ、）言ってやれ。「いや、不可視の世界*をご存知である我が主*にかけて、それは必ずや、あなた方のもとに到来する。諸天であろうが大地であろうが、僅かな重みでも、かれ（の知識）から免れることはない。また、それより小さいものでも、大きなものでも、明白な書（守られし碑板*）に（予め記されてい）ないものはないのだ[1]。\n\n支配、知、英知について明らかにした後、章は、真理を否定する者たちの言葉を取り上げる。彼らは『（復活*の）その時は、私たちにはやって来ない』と言う。ここでの異議は、天と大地にあるものの細部に向けられているのではない。来世に向けられている。人は、好きなことをして、その責任も自分の生涯の終わりとともに終わってほしいと願うことがある。清算は、その願いの前に立ちはだかる。クルアーンは、『いや、（不信仰な）人間は、自らの前途において[1]放逸であることを欲し（、復活を否定し）ている。』という言葉で、この動機を明らかにする（75：5）。\nそれゆえ答えは、直接的で、強く念を押すものとなる。『言ってやれ。「いや、不可視の世界*をご存知である我が主*にかけて、それは必ずや、あなた方のもとに到来する』。主にかけて誓うことには、養い育ててくださる主であることと、その英知を思い起こさせる働きがある。人々を恵みによって育て、導きを下された主は、物事をむなしいままに放置されない。虐げられた人が受けた圧迫だけで、その人のすべてが終わることもない。溝に投げ込まれた人々の結末は、そこに燃える炎ではなかった。信仰を守り抜いた者たちには、楽園での報いがある。\n強い答えは、強い否定と向き合っている。彼らが「自分たちにその時は来ない」と否定したことに対し、答えは、彼ら自身を指して、必ずあなたがたのもとに到来する、と述べる。アラビア語では誓いに加え、断定を強める形が用いられている。清算は、どこの誰かも分からない人間についての話ではなくなる。ほかならぬあなたがたに関わることなのだ。疑念に答える説明の精密さがここにある。疑念の核心に答え、その中に潜んでいるものを、明らかにせず残しておかない。この章では、次々と現れる主張に対して、「言ってやれ」という命令が繰り返される。昼も夜も巡らされる策略だけが、人々の物の見方を形作ってしまわないためである。\nさらに主は、『不可視の世界*をご存知である』お方と示される。人々が見たことのないものも、それゆえに存在しなくなるわけではない。アッラーはそれをご存知である。訳文の「かれ（の知識）から免れることはない」は、かれの知から隠れることがない、ということだ。天にも大地にも、ほんの粒ほどの重さのもの、そのさらに小さいもの、大きいものまで、明白な書に記されていないものはない。この細かな説明は、復活の否定に答える二つの面を持つ。創造されたものの部分が、ばらばらになり、見えなくなっても、そのすべてを知っておられる以上、それを集め直すことはアッラーには困難ではない。また、どれほど細かな行いも数えられている以上、清算から逃れられるという期待は断たれる。\nルクマーンが息子に語った、『（ルクマーンは言った。）「我が息子よ、実にそれが（悪行であれ、善行であれ）、たとえ芥子種一粒の重さ（ほどのもの）であり、岩の中にあったとしても、または諸天（のどこか）、あるいは大地（のどこか）にあったとしても、アッラー*は（復活の日*）それを持ち出してこられ（、秤におかけにな）るのだ。本当にアッラーはまさしく、霊妙な*お方、（全てに）通暁されたお方なのだから。[1]』という言葉は、その二つの面を身近に感じさせる（31：16）。芥子種一粒の重さを、隠された行いと捉えるなら、アッラーが清算のためにそれを持ち出されることが分かる。岩の中や遠く広がる世界に隠れた物に目を向けるなら、その所在を知り、それを持ち出す御力が明らかになる。行いは失われず、散り散りになったものを集めることも困難ではない。彼らが否定したその時は、アッラーの知、御力、英知のもとに、必ず到来する。\n\n第4節\n\n（復活の日*の到来は、）かれが、信仰し、正しい行い*を行う者たちに報われるため。それらの者たちには、お赦しと貴い糧[1]がある」。\n\nこの節は、その時が来る目的の一つを明らかにする。信仰と正しい行いが、それにふさわしい報いを受けるためである。耐え忍び、力を尽くした者と、背を向けた者が同じ結末になることも、夜に礼拝し、斎戒した者と、従わなかった者が同じになることも、アッラーの英知にそぐわない。人も普段の暮らしの中で、仕事や勉強に真剣に取り組んだ者と、それを投げ出した者との違いを理解している。それなのに、責任を負って生きる人間の生涯が、行動した者と、しなかった者をまったく同じにして終わるなどと、どうして考えられるだろう。\nそれでも信仰者は、自分の行いを誇って主のもとへ進むのではない。報いは、尊い糧より先に、赦しを挙げて始まる。どれほど従順に努めても、アッラーの恵みに対して、感謝し尽くしたことにはならない。足りなかったところを赦していただく必要がある。\nそして尊い糧が与えられる。その尊さには、苦労や骨折りなしに届くことも含まれる、と解釈される。楽園の人々は、欲するものを見出す。この世で何かを求めるときのように、出かけ、探し、待ち、代金を工面する必要はない。また、尊いとは途切れないことだ、とも解釈される。その喜びの後に、尽き果てる時は来ない。至らなかったことへの赦しと、尊ばれる賜物が、共に与えられるのである。\n\n第5節\n\nわれら*の御徴において、（使徒*とクルアーン*を嘘呼ばわりするために）ねじ伏せようと躍起になっていた者たち、それらの者たちには痛ましい制裁による懲罰がある。\n\n信仰する人々と対照をなすのは、背を向けるだけで終わらず、御徴に敵対するために働いた者たちである。「躍起になっていた」に当たるアラビア語には、力を注ぎ、できる限りを尽くす意味がある。アッラーの道から人を遠ざけることを、ただの一時的な遊びや、計画もなく口にされた一言と考えてはならない。人々の導きの源を損なうために、財産と時間を使い、夜を徹し、調べている場合もある。\nたとえば、礼拝の時間に娯楽を組み、食事を終えた視聴者をそのまま引き留めて、礼拝に立つのがおっくうになるようにする。あるいは、クルアーンへ心を向けられたはずの時間に、その関心を奪う。番組が及ぼす働きは、放送される時刻や、受け手の人生のどの部分を占めるかと無関係ではない。『あなた方が苦しかったとしても、本当に彼らも、あなた方が苦しむように苦しんでいるのだから。』という言葉がある（4：104）。虚偽のためにも力が注がれている。この事実を、真理を明らかにするために立つ者は知っておく必要がある。\nここで彼らが働きかける対象は、御徴である。啓示の御徴を指すとする解釈があり、次の節の『あなたの主*からあなたに下されたもの（クルアーン*）』という言葉とのつながりからも、それが読み取れる（34：6）。さらに、アッラーが宇宙に置かれた証拠も含む、とする解釈もある。「御徴において」の「に」に当たるアラビア語の前置詞は、表面を通り過ぎる程度ではなく、御徴に深く入り込んで非難するさまを思わせる。人を信仰の源から切り離すことは、人々の間を巡る財産や、やがて消える力をめぐって争うよりも、深刻だからである。ジンたちの『また、私たちの内の愚か者[1]が、アッラー*に対して（真実から）逸脱したこと[2]を言っていたということ。』という言葉も、この問題につながる（72：4）。アッラーについて語る言葉を損なえば、かれとのつながりの根本が損なわれる。\n「ねじ伏せようと」に当たる「معاجزين」の意味の捉え方の一つは、御徴が、その導くところへ人を導けないかのように見せようとすることである。また「معجّزين」という読み方も伝えられており、人をくじき、御徴へ向かうことから遠ざける、という意味が挙げられる（イブン・アルジャザリー『النشر في القراءات العشر』、ハッジ章の各語の読みの項）。朗誦の読みの違いと、それに基づく意味の説明は区別しておく。このように、妨げる働きには二つの方向が合流する。啓示をゆがめて見せるために疑念を向けることと、欲望によって人を忙しくし、啓示へたどり着けなくすることである。クルアーンを非難する者、スンナやその伝え手を非難する者、娯楽で時間を使い尽くさせる者というように、役割が分かれることもある。\n『同様にわれら*は、分断する者たち[1]にも（懲罰を）下したのだ。』（15：90）、『クルアーン*を、ばらばらにした[1]者たちに。』（15：91）については、使徒を詩人だ、狂人だ、占い師だと呼ぶ非難を、それぞれ分担した人々のことだ、という解釈がある。また、ここでの語は誓いに関わる、とする解釈もある。発言を分担したという解釈では、それぞれの言い方が違っても、さまざまな非難が、クルアーンを妨げる目的に集まる。\n聞くことを止めるのと、騒いで妨げるのとが、一つになった言葉が、『このクルアーン*には耳を傾けず、それ（読誦）に対して戯言を言って（邪魔して）やれ[1]。（それによって読誦を阻み、）あなた方が優勢となるように』という主張である（41：26からの抜粋）。彼らは、そこから背を向けるよう求めるだけでは終わらなかった。心に届かないよう、その場所を無益な言葉で埋めようとした。『気晴らしにうつつを抜かすのか。』と問いかけられる（53：61）。講義原稿が紹介する意味の捉え方の一つとして、クルアーンを聞くときに歌い、心を呼び覚ます言葉に耳を傾ける代わりに、娯楽へ没頭することが挙げられる。\n人を妨げる者たちは、この世のものに執着していても、それを真理から遠ざけるために費やすことがある。宗教が広まることを、自分たちの守りたいものへの脅威と見なし、好きなものの一部を払って、その向こうにあるものを残そうとするのである。『本当に不信仰に陥った者*たちは、アッラー*の道を阻むべく、彼らの財産を費やす。彼らはそれを費やすであろう。やがてそれは彼らにとっての悲痛となり』と仰せられている（8：36）。このため、彼らには、厳しい苦痛を伴う懲罰が告げられる。この節の「制裁」に当たる語は、懲罰の厳しさと解釈される。彼らが望んだのは、社会全体から導きを覆い隠し、人々を欲望と惑わす言葉にとらわれたままにすることだった。自分だけに関わる過ちを犯すことを越えた、他者を損なう行為である。それが、彼らの働きの説明に続いて、厳しい警告が置かれる理由を理解させる。\n\n第6節\n\nそして知識を授けられた者たちは、あなたの主*からあなたに下されたもの（クルアーン*）が真理であり、偉力ならびない*お方、称賛*されるべきお方（アッラー*）の道へと導いてくれるものであると分かるのだ。\n\n啓示をゆがめて見せるために、どれほどの力が注がれても、それについての知を授かった者には、真理は明らかなままである。クルアーンは、信仰者が努力によって御徴の明瞭さそのものを作り出すかのようには描かない。彼らは信仰し、正しい行いをする。その信仰、行動、そしてクルアーンを伝えることに、クルアーンの働きが表れる。一方、その導きを否定したい者は、この明瞭さを覆い隠すために、働き続けなければならない。\n訳文の「分かるのだ」に当たる、見ることを表すアラビア語には、はっきり見分ける強さと、惑わす言葉の前でも揺らがない確かさがある。敵対する者が、無力であるかのように、あるいは食い違っているかのように見せたい御徴について、知を授かった人々は、その真実を見る。言論に加わる者が誰でも、混乱の中で見分けられるわけではない。ここで益となる知は、啓示とつながり、アッラーを知ることへ導く知である。肩書や大量の情報だけでは、この根本の代わりにならない。\n見分けた者には、学んだことを明らかにする務めがある。弱い立場に置かれた者たちが、『（あなた方の）夜と昼の策謀』の影響を認める場面（34：33）からも、混同を解く働きを続けることが、どれほど必要か分かる。人々の思考を、宣伝に奪われるままにしてはならない。\nこの節は、下されたものがただ「真実である」と述べるだけではない。『が真理であり』とある。アラビア語の、前後を区切る代名詞には、強調し、まさにそれであると特定する働きがある。さまざまな主張が増え、人々に「誰も信用しない。誰についていけばよいのか分からない」と言わせ、真理を知ること自体を諦めさせようとする状況に、ふさわしい表現である。しかし、知を授かった人々は、アッラーの導きを、それと矛盾するほかの選択肢の中に溶かし込まない。\n真理を否定した者たちは、この啓示こそが真理であることへの激しい拒否を、次の言葉で表した。『アッラー*よ、もしこれが本当にあなたの御許からの真実であるなら、天から私たちの上に石をお降らしになるか、あるいは私たちに痛ましい懲罰をお与え下さい』（8：32）。もしそれが真理であるなら導いてください、とは願わなかった。それに従うより、罰を受ける方を選んだのである。また、『これではないクルアーン*を披露してみよ。あるいは、それを変えよ[2]』とも要求した（10：15）。\nさらに、この節の『道へと導いてくれる』には、実際の生き方へつながる意味がある。知を授かった者たちは、クルアーンの真実性を見分けるとともに、それが生活を導くことも見分ける。シャリーアでは人々の営みを正せないとか、取引、財産、社会生活に関するその定めは、実行に適さないとか、人々に思い込ませようとする者とは対照的である。クルアーンは導くものであり、人々が信じ、実行すれば、現実に働きを及ぼす。従うことの実りを切り離した、抽象的な真理ではない。\nその道は、『偉力ならびない*お方、称賛*されるべきお方（アッラー*）の道』である。誰にも打ち負かされず、あらゆる称賛に値する主へと向かう、まっすぐな道だ。偉力という属性は、無力だという主張に向き合い、称賛という属性は、啓示に投げつけられる欠点の非難に向き合う。「称賛*されるべきお方」という名の意味には、アッラーご自身とその行為が称賛に値すること、そして、その導きに従う親しいしもべたちの従順な行いを、アッラーがたたえてくださることが挙げられる。その導きに従うのは、誉れと、称賛される行いへ至る道なのである。信仰者は、この章の歩みを、主の支配と英知への称賛から始めたのだった。\n\n第7節\n\n不信仰に陥った者*たちは（嘲笑しつつ、お互いに）言った。「（死んで）跡形もなくばらばらにされた後、本当にあなた方は新たに創造されるのだ、などとあなた方に告げる男[1]を、あなた方に見せてやろうか？」\n\n否定する者たちの態度は、自分たちが復活の時を否定すると表明するところから、その否定を人々の間に広めるところへ進む。最初は『（復活*の）その時は、私たちにはやって来ない』と言った（34：3）。次には、ほかの人々に向けて、『あなた方に告げる男[1]を、あなた方に見せてやろうか』と語りかける。証拠を求めるために問題を取り上げたのではない。興味を引き、嘲笑することを、聞き手を誘導する手段にしたのである。ある男が、驚くような話をしている。そして、その言葉を聞くだけで笑ってしまうほどおかしい話であるかのように、紹介する。\n誰を指しているか分かっていながら、ただ「ある男」と呼ぶところには、その人を軽く扱う響きがある。「あなた方に告げる男」の「告げる」という言い方も、奇妙な報せという印象を強める。しかも、単に「死んだら」とは言わず、『（死んで）跡形もなくばらばらにされた後』と言う。身体の部分が徹底的に散り散りになる様子を思い描かせ、それと新たな創造を並べることで、聴衆に、そんなことはあり得ないと思わせようとする。\n宗教を嘲る者が、定めや来世についての報せから一文だけを切り取り、笑い話の形で見せるときにも、似たことが起こる。砕け散った身体の像と、生きていた本人の姿とを並べて見せ、証拠を考えるより先に、感情を動かしてしまうのである。クルアーンは、『そして彼は自分自身の創造を忘れて、われら*に対して（許されない）譬え[1]を挙げた。彼は言ったのだ。「誰が、朽ち果てた骨に生を与えるというのか？」』という言葉で、この「あり得ない」という思いの根を明らかにする（36：78）。あり得ないとする者は、朽ちた骨だけに注意を向け、問いが立ち返るべき最初の創造を忘れている。\n人を迷わせる者は、いつでも初めから結論を言い渡すわけではない。場面を作り上げ、聞き手に、自分自身で結論を出したと思わせることもある。実際には、その結論へと誘導したのである。ムーサーの物語で、人々を集める者たちは、『あなた方は、集合するのか？』と呼びかけた（26：39）。その後に、『私たちは、魔術師たちに従おう。彼らこそが勝利者となったならば』と、目指す方向を示す（26：40）。広めていた選択肢は、魔術師が勝てば魔術師に従う、というものだった。ムーサーのもとに真理が明らかになれば、ムーサーに従うという道を、人々の前に開かなかった。同じような選択肢の絞り込みが、ここでは、使徒の報せを嘘か狂気かのどちらかに限定する、次の節への準備となる。興味を引き、嘲笑することが、聴衆にも一緒に作らせたい判断への前置きとなっている。\n\n第8節\n\n一体、彼はアッラー*に対して嘘を捏造したのか？それとも、彼には憑き物がついている[1]とでも？いや、来世を信じない者たちは（来世においては）懲罰と、（現世においては）遠い迷いの中にある。\n\n聞き手を、あり得ないという思いと嘲笑によって準備した後、彼らは可能性を二つに絞る。アッラーについて捏造したのか、それとも、正気なら言わないことを言わせる狂気があるのか。問いの立て方そのものから、真実である可能性を落としてしまった。嫌っている結論を、検討する前から除外しているのでは、公正な比較にならない。\n『一体、彼はアッラー*に対して嘘を捏造したのか？』という言葉には、アッラーへの熱心さを装い、非難を宗教の擁護に見せるところもある。フィルアウンがムーサーについて、『本当に私は、彼があなた方の宗教[1]を変えてしまったり、地上（エジプト）に腐敗*を出現させたりすることを怖れているのだ』と語ったのと似ている（40：26）。このような言葉は、人を刺激する面白さから広がり、多くの人々を感心させることもある。しかし、受け手の多さが、その言葉が真実である証拠になるわけではない。\nクルアーンは、病のあるところへ目を戻す。『いや、来世を信じない者たちは（来世においては）懲罰と、（現世においては）遠い迷いの中にある。』。彼らの混乱は、ただ奇妙に思える報せを聞いたことから来るのではない。清算を受ける世界を、拒んでいるのである。ここでの懲罰は来世で受けるもの、迷いはこの世で生きている状態、とする解釈がある。また、この世で降りかかるものも、懲罰に含まれる、とする解釈もある。\n報いを信じることが欠けると、不正が行われたのを見て、それで正義の望みが絶たれたと思ってしまう。ある人が襲われたり、家族に危害を加えられたりしても、加害者の力の向こうに、清算も、公正な償いもない。この見方は、虐げられた者の心を重くし、加害者には、責任を逃れられるという思い込みを解き放つ。来世を信じることは、公正さが現れるのが遅れるときにも、その意味を守り、人生をアッラーの英知へとつなぐ。自分がしたことも、されたことも、この世の終わりだけで、もはや見直されることなく終わるのではない。\n\n第9節\n\n一体、彼ら（不信仰者*たち）は天と、大地という、自分たちの前にあるものと、自分たちの後ろにあるものを見なかったのか？もしわれら*が望めば、われら*は彼らを地面に飲み込ませ、あるいは彼らの上に天から破片を下してやる[1]のだ。本当にその中にはまさに、よく（アッラー*に悔悟して）立ち返る、全ての僕への御徴がある。\n\nこの問いは、否定する者たちの目を、アッラーの支配が包む天と大地へ戻す。彼らはその中で生きながら、そこに対するアッラーの取り計らいを押しとどめる力を持たない。大地を所有されるお方は、彼らをその大地に飲み込ませることができる。天を所有されるお方は、その一部を彼らの上に落とすことができる。主の支配から逃れて身を守れる場所を、独立して確保しているわけではない。周囲の様子に慣れているからといって、それが変わり得ない証拠にはならない。\nこの警告は、章の冒頭とつながっている。続く物語は、御力と支配という意味を、具体的な例として見えるようにする。アッラーはダーウードのために鉄を柔らかくし、スライマーンのために風とジンを従わせ、銅の泉を湧き出させる。ある民には果樹園と安全な道を与え、彼らが背を向ければ、思い上がるもととなったものを失わせる。読者は、与えられる姿と、取り去られる姿の両方を見る。支配は、抽象的な話にとどまらなくなる。\n弱い立場にある信仰者への働きの一つは、アッラーが命じれば従う山々を見て、自分の受けている危害は、主の御力が足りないためではない、と知ることである。『もしアッラーがそうと望めば、必ず御自ら彼らに返報しただろう。しかしこれはあなたがたを、互いをもって試みるため。』と仰せられるとおりである（47：4）。このすべてが、後に示される、『言え。「アッラー*を差しおいて、あなた方が（かれの同位者と）主張して（崇めて）いる者たちに、祈るがよい。』という挑戦への準備となる（34：22）。神とされるものが、これらの行為のどれを行っただろう。これらの恵みを与えたり、奪われたときに取り戻したりできるのは、誰だろう。このように、警告は、物語の中の御力の証拠、そしてアッラーを差しおいて呼び求められるものの無力さを明らかにすることへと、つながっている。\n\n第10節\n\nわれら*は確かに、われら*の御許からの恩寵[1]を、ダーウード*に授けた。（われら*は言った。）「山々よ、彼と、そして鳥と共に（アッラー*を称え*て）連呼せよ」。また、われら*は彼のために、鉄を柔らかくしてやった。\n\nダーウードに対するアッラーの恵みは、信仰者が主の賜物の広さを思い起こす必要のあるところに語られる。虚偽に従う者たちに財産や装備が集まっているからといって、力を得る手段のすべてを、彼らが握っているわけではない。信仰者に対して、恵みの宝庫が閉ざされたのでもない。ダーウードのために鉄を柔らかくし、スライマーンのために風を従わせたお方は、望む者に与えることができる。与えられるものが違うのは、アッラーの御力が足りないからではない。同じものを授からなかった人の位が、必ず低いということにもならない。\n問題は、すべて財産の少なさにあるのではない。財産だけで使命を支えられるなら、それを信じて担う人々がいなくても、財産さえあれば足りるはずだからである。この意味を思い起こさせるものに、ウマルの伝承がある。集まった人々が、アッラーの道に費やす金や宝石を望んだとき、ウマルは、その務めを担う人々を望んだ（アフマド『教友たちの徳』1280、伝承の意味）。財産や装備は、人々の間を移り変わる。敵対する者が非難を向ける、力の根本にあるのは、啓示と、それによって育てられる人々なのである。\nダーウードへの恵みは、彼が熱心に礼拝に向かっていたこととともに現れる。アーダムが自分の子孫の中にダーウードを見て、その光に心を引かれ、自分の寿命から四十年を与えた、と伝えられる（ティルミズィー3076、伝承の意味。この伝えではダーウードの当初の寿命は六十年で、別の四十年・六十年の伝えと混ぜない）。また、預言者はダーウードについて「アッラーが最もお好みになる断食は（預言者）ダビデの断食である。\nそしてアッラーが最も好まれる礼拝も（預言者）ダビデの礼拝である。」と語った（ムスリム1159k〔並行伝承〕、ブハーリー1131〔講義〕）。彼は、自分の手で働いて得たものを食べていた（ブハーリー2072）。その啓典ザブールの読誦も容易にされ、乗る動物の鞍を整え終える前に読み終えていた、と伝えられる（ブハーリー3417、伝承の意味。伝承本文の語は「クルアーン」で、ここではダーウードの啓典の文脈として述べている）。王であることは、主への礼拝と、自分の手で働くことを妨げなかった。\n努力を重ねることの実りの一つに、初めは難しかった従順な行いを、アッラーが容易にしてくださることがある。クルアーンと日常的に過ごす人は、たまにしか向き合わない人にはない親しみと容易さを、その読誦や暗記に見出す。夜に礼拝に立つことも、夜明けの礼拝のために起きることも、苦労し、努力した後に、身についてくる場合がある。\nそしてダーウードの讃美の光景が開かれる。『山々よ、彼と、そして鳥と共に（アッラー*を称え*て）連呼せよ』。山々と鳥が、彼とともに讃美を繰り返す。讃美する彼と、周囲の被造物が、アッラーを覚えることに集まる。この尊びは、山々に命じれば山々が従うお方の御力へ、心を目覚めさせる。マッカで危害を受ける信仰者は、周囲の山々を見て、主がそれを所有され、人間の力もそれを主の命令の外へ出せないことを知る。\nこの光景と並んで、『また、われら*は彼のために、鉄を柔らかくしてやった。』とある。強固で硬いと知られたものが、ダーウードの手には扱いやすくされた。生地を手で形作る姿を思い浮かべると、その容易さが近づいて感じられる。この従属は、アッラーの宗教のために働く者を、これらの節が育てる意味と切り離せない。人を教え導く活動が多いから、貧しい人々の世話があるから、社会の務めがあるから、唱念や夜の礼拝をする時間がない、と言ってはならない。ダーウードは預言者であり王であったが、それでも主への礼拝に、このように取り組んだ。負うものが重くなるほど、心は、それを担う助けを強く必要とする。\nそれゆえ、預言者には、『少しだけ除いて、（礼拝のため）夜に起きていよ。[1]』（73：2）、『つまり、その半分（を起きて過ごせ）。または、そこから少し（、つまり三分の一まで）減らすがよい。』（73：3）、『あるいは、そこに上乗せし（、三分の二にし）てもよい。そしてクルアーン*を、明瞭に区切りつつ読誦せよ[1]。』（73：4）と仰せられた。そして、この長い夜の礼拝と使命を担うことのつながりが、『（預言者*よ、）本当にわれら*は、あなたに重厚な言葉（クルアーン*）[1]を投げかけよう。』という言葉で示される（73：5）。従順な行いは、働くための糧である。働くことを、その糧を断つ理由にしてしまうのは誤りだ。\n鉄を柔らかくする恵みも、目的なしに残されるものではなかった。鉄について、アッラーは『またわれら*は、多大な威力と人々への諸益を有する鉄を下した。（それは）アッラー*が、かれ（の宗教）とその使徒*たちをまだ見ぬままに[2]援助する者が誰かを、如実に表し給うためであった。本当にアッラー*は、強力なお方、偉力ならびない*お方であられる。』と仰せられている（57：25）。鉄には、侵害を防ぐための力も、人々の営みを支える利益もある。与えられた者は、それをどのように使うかを試される。この節が、強力で、偉力ならびないお方という属性で結ばれることは、恵みをアッラーへ帰する。アッラーが、被造物の道具や力を必要とされるのではない。必要としているのは、与えられたものへの責任を果たすべき、人々の方なのだ。このため、鉄を柔らかくされたことに続いて、ダーウードには、役立つ物を作る務めが与えられる。\n\n第11節\n\n（われら*は命じた。）「すっぽり覆うもの（鎧）をこしらえ、継ぎ目を（いい按配に）調整[1]せよ。（ダーウード*とその一族よ、）あなた方は正しい行い*を行え。本当にわれら*は、あなた方の行いを見る者なのだから」。\n\n鉄が柔らかくされたことだけで、恵みが完結するわけではない。それは人々の必要とする仕事へ向けられる。『すっぽり覆うもの（鎧）をこしらえ』とある。「すっぽり覆うもの（鎧）」に当たる「サービガート」は、身体を広く覆う鎧である。前に一枚の板を持ち、片側は守られても、ほかはむき出しになるような守り方とは異なる。この違いから、十分に行き届く、という言葉の意味が分かる。必要なところまで、保護が届くことである。\n次に、『継ぎ目を（いい按配に）調整[1]せよ』という命令がある。「継ぎ目」に当たる「サルド」は、物を順序立てて次々につなぐことを指す。言葉を連ねて、各部分が調和する語りにも用いられる。ここでは、鎧の輪のつながりを堅固にし、つなぐ部分の具合を調節することだ。動いたときに結合が崩れたり、隙間が開いたりしないようにする。布と布を縫い合わせるように、鉄も正確につなぎ、作ったものが、その目的を果たし続けるようにしなければならない。\nこの細かなことまで語られるところに、仕事をよく仕上げることが、感謝に求められることだと分かる。質の悪い仕事を、「慈善の仕事だから」「アッラーのために提供しているから」と言って正当化することはできない。礼拝、人を導く働き、人々への奉仕、そして人々を守るための備えは、どれも、よく行うに値する。備えについて、アッラーは『また（ムスリム*たちよ、）あなた方は彼らに対し、力と、馬をつなぎとめておくことによって、出来る限りの準備[1]をしておくのだ。あなた方はそれによってアッラー*の敵とあなた方の敵、そしてあなた方が（まだ）しらずともアッラー*はご存知であられる、彼ら以外の別の者たち[2]を脅かす。アッラー*の道において何か費やせば、あなた方は不正*を蒙ることなく、ふんだんに報われよう。』と仰せられている（8：60、該当箇所を含む訳文）。\nこの背後には、あらゆる恵みへの責任がある。教える能力、分かりやすく語る力、費やせる財産、暗記する素質や働く力を与えられた者にとって、その賜物は、やがて問われることと無関係ではない。恵みを与えたお方に、何の権利もないものを、自分の側から一方的に提供しているのだ、と思ってはならない。ダーウードには能力が与えられ、それに伴って、働くよう命じられた。ムーサーにも、『そしてわれは、あなたを（使徒*として）選んだのだ。ならば、（あなたに）啓示されることに、耳を傾けよ。』と仰せられ（20：13）、また『本当にわれは、わが言伝とわが言葉[1]で、あなたを人々の上に選りすぐった。ならば、われがあなたに授けたもの[2]を手にし（て、それを遵守し）、感謝する者の一人となるのだ』と仰せられた（7：144）。選ばれることには務めが伴い、賜物は、行動と感謝を促す。\nここで目を引くのは、訳文の「こしらえ」「調整[1]せよ」に当たるアラビア語の単数への命令から、『あなた方は正しい行い*を行え』という複数への命令への移り変わりである。そこから考えられる一つの意味は、役立つ技を、その持ち主の中だけに閉じ込めないことだ。後に担う者へ教え、最初の人がいなくなっても、その技を受け継いで実践する人が育つようにする。このことは、宗教の学問にも、ものづくりにも、人々のさまざまな営みにも当てはまる。よい医師、技術者、教師、責任者は、自分の仕事だけで満足せず、学んで、その後の務めを担う人を育てる。人は病気になり、不在になり、亡くなることもある。善いことのすべてを、その人がい続けることに依存させてはならない。この意味に、『ムハンマド*は、一人の使徒*に過ぎない。彼以前にも、使徒*たちが滅び去っていったのである。それでもし彼が死んだり、殺されたりしたら、あなた方は踵を返すのか[1]？』という言葉も思い起こされる（3：144）。\nまた、ただ働けと命じられたのではなく、『あなた方は正しい行い*を行え』とある。次の世代が技を保っていても、それを悪事や人々を威圧するために使うのでは十分ではない。同じ道具でも、守ることも、不正を行うこともできる。何に向けて使われるかを見守り、人々への横暴の手段にさせないことが必要である。話す才能も、教え、助言するために使うことも、人を惑わし、損なうために使うこともできる。それゆえ働くことは、『本当にわれら*は、あなた方の行いを見る者なのだから』と、アッラーがご覧になることを思い起こすことと結ばれる。\nここには、何かを与えられれば、その人のすべての状態を、アッラーが喜ばれている印なのだ、という思い違いの訂正もある。恵みは試験である。ムーサーは自分の民に、『あなた方の主*は恐らく、あなた方の敵を滅ぼし、あなた方を（エジプトの）地における継承者[2]とされ、あなた方がいかに行うかをご覧になるであろう[3]』と語った（7：129）。弱い立場から力を得た立場へ移ることは、試練の終わりではない。別の試練の場への移行である。イスラーイールの子らの一部は、救われ、海を渡った後に、『ムーサー*よ、彼らに神々[1]があるように、私たちにも神（の偶像）を一つ、こしらえてくれ』と願った（7：138）。ある試練を乗り越えたことも、役立つ道具を持っていることも、信仰を保ち、恵みの使い道について、アッラーをごまかせないと心に留め続けることの代わりにはならない。\n\n第12節\n\nまたスライマーン*には、その午前（の進行距離）は一ヶ月（の旅程）で、午後（の進行距離）は一ヶ月（の旅程）の風を（、仕えさせた）[1]。そして、われら*は彼のために銅の泉を溶かしてやり[2]、ジン*の内からは、その主*のお許しのもと、彼の前で働く者も（仕えさせた）。彼ら（ジン*）の内、われら*の命令[3]に背く者があれば、われら*は彼に烈火の懲罰の内から、味わわせてやろう。\n\nスライマーンには、さまざまなものが従わせられる。風、銅の泉、そして彼の前で働くジンたちである。風は、朝の旅程で、通常なら一か月かかる距離を進み、夕方の旅程でも、さらに一か月分を進む。ほかの者には二か月必要な道のりを、スライマーンは一日で進める。銅の泉は、アッラーが彼のために流れ出させた銅である。そして、主の許しのもと、働くことを命じられたジンたちがいた。\nこの力は、スライマーンが主から独立していたためでも、ジンたちが望む者に王権を授けるためでもない。本文には『その主*のお許しのもと』と明記され、命令から外れる者は、罰を受けることが示される。\nこの恵みと、スライマーンについての別の話とを結びつけて考える一つの見方に、彼の心を神の想起からそらした馬についての解釈がある。『そして（馬が連れて来られると、）彼は（剣で）その足と首を打ち始めた。[1]』という箇所（38：33）を、馬を屠ったと解釈し、アッラーが、その馬に代えて、それより速い風を授けたとする見方である（イブン・カスィール、38：33の解説）。同じ箇所には、馬を愛情をもってなでたとする解釈もあり、ここでは前者の解釈に沿ったつながりを述べている。この見方は、手段を所有することによって、その手段を取り計らう主から心をそらしてはならない、と気づかせる。真理を支える仕事も、アッラーを覚えることとのつながりを断ってしまえば、正しく立ち行かない。\nアリーの伝承には、その実際の姿がある。原稿では、預言者からアリーが学んだ、就寝時に讃美を三十三回、称賛を三十三回、アッラーの偉大さをたたえる言葉を三十四回唱える教えが挙げられる。アリーはそれを守り、スィッフィーンの夜でさえ、やめなかったと語った（ブハーリー5362、伝承の意味）。この伝承を語るのはアリーであり、参照した本文で、預言者が直接命令形で呼びかける相手はファーティマである。状況の厳しさも、戦いとその混乱に人々が忙殺されることも、預言者から受けた導きをなくさなかった。\n衣を纏う者章の結びには、病気、旅、戦いがある中での、容易さが示される。『かの御方は、あなたがたの中に病気の者がいるのを知っている。他のある者は、アッラーの御恵みを探し求めて大地を旅するだろう。また他のある者は、アッラーの道のために戦うだろう。それゆえ、[あなたがたそれぞれにとり]やさしいところを朗読しなさい。』（73：20）。ここでの読誦を、夜の礼拝におけるものとする解釈がある。事情のある者も、できることを通してつながりを保ち、困難さを、礼拝全体を捨てる入口にしない。預言者も、重いことが起きたときには礼拝した、と伝えられる（アブー・ダーウード1319、伝承の意味）。礼拝は、務めが重く、物事が難しいときに、助けを求める場である。\n恵みの並びを考える一つの見方として、建設に役立つ銅より先に、鎧を作る鉄が述べられることにも目を向けられる。社会を守ることは、建設し、移動し、安定して暮らす力を守る。暮らしの手段を広げる一方で、侵害を防ぐ備えを怠っていては、それを活かせない。売買や農作にかかりきりになり、ジハードを捨てること、それによって屈辱が及び、宗教へ立ち返るまで続くことを述べる伝承も、この意味を思い起こさせる（アブー・ダーウード3462。全文はイーナの売買など、複数の条件を挙げる。ここではその意味の一部を述べている）。糧を求め、生活の営みを築くことを、ほかの務めを捨てる口実にしてはならない。社会のための仕事を、礼拝を怠る口実にしないのと同じである。\nこの節の結びは、従わせられたもののすべてを、アッラーの命令へ帰する。ジンのうち、その命令から外れる者は、烈火の懲罰を味わう。来世の懲罰についての警告とする解釈があり、命令に背いたために、この世で速やかに受ける罰とする解釈もある。従わせられた力も、務めから自由にはならない。才能も、それをどう使うかという責任を、持ち主から取り去るものではない。\n\n第13節\n\n彼らは、彼が望むものを造った。聖殿、彫像、貯め池のような鉢、[大地に]据え付けられた大釜。「ダーウードの一族よ、感謝して働きなさい」。われのしもべたちのうち、感謝する者はわずかであるが。\n（34：13）\n\nこの文脈は、スライマーンに従わせられた力が、どんなことに向けられたかを、具体的に示す。恵みは、ただ権限が広がったというだけでは終わらない。礼拝の場、像、貯水池のように大きな鉢、そして動かない大釜である。\n東京ジャーミイ訳の「聖殿」に当たる「マハーリーブ」は、アラビア語の「ミフラーブ」の複数形で、礼拝の場を指す。今日よく知られる、イマームの立つ位置の形だけに意味が限られるのではない。自分の家に、礼拝の場所を持つこともある。その名前は、礼拝する者がそこで悪魔と闘うことに由来する、とも言われる。礼拝の場が先に挙げられることは、社会を築くうえで、何を先にするべきかを思い起こさせる。預言者はマディーナへ到着した後、モスクの建設を命じた（ブハーリー428）。人々が集まり、主を想い、導きを受け取る場となるためである。\n像は、スライマーンの法において許されていたものとして述べられる。その法の定めを、そのまま預言者ムハンマドの法へ移して、当該の像を許すことはできない。後の法における禁止とは、区別しなければならない（クルトゥビー、34：13の解説。ここで述べるのは、この法と歴史の文脈での説明である）。\n鉢は、大きな水槽にたとえられる。そこには、大きさと量の豊かさの光景がある。大釜も、その大きさと重さのために、その場所から動かされない。豊かさが、人々に食べさせ、役立てるために使われていることが際立つ。持ち主が、ただ所有するものを自慢する光景ではない。この意味を実践する一つの形は、力のある者が、食べ物、水、教育など、人々に開かれた善の道を広げ、必要の大きさを考えることである。多くの費用を必要とする家庭を、ごくわずかな額で助けても、その不足を満たせないことがある。できる範囲で、利益が必要に届くようにすることが求められる。これは、余裕のない者のわずかな施しを退ける話ではない。豊かさを与えられた者が、それをよく使うことについての話である。\nこうした行いでは、意図を純粋にすることが根本となる。食べ物を受ける相手がムスリムでなくても、動物であっても、アッラーの喜びを求めて食べさせる。被造物に役立つことと、創造主に喜ばれることを求めることは、切り離されない。スライマーンの王国で奇跡的に起きたことは、知識や技術を持つ人々にも問いを開く。鉄や銅を活かす手段を得て、ものを築く力が増したなら、それを何に向けるのか。恵みは、その使い道を試すものである。持っているだけで、正しい人間だと証明されるわけではない。\nそして、全体をまとめる務めとして、『ダーウード*の一族よ、（アッラー*に）感謝すべく、行え[3]』と命じられる。感謝は、恵みを与えるお方の恩恵を知っていることが表れる行動である。家族も、賜物にあずかるのと同じく、その責任に加わる。さらに、『わが僕の内、僅かな者だけが、感謝する者なのだから』という言葉が、財産の多さや、同じ道を歩む人の多さに、恵みの持ち主が思い上がらないよう、目を覚まさせる。後には、この姿と対照をなす民が現れる。彼らは『あなた方の主*の糧から食べ、かれに感謝せよ。』と告げられたのに（34：15）、恵みに背を向けた。\nまた、東京ジャーミイ訳のこの節の『彼らは、彼が望むものを造った。』という、ジンたちがスライマーンのために働く描写は、物語の終わりを理解する準備でもある。彼らの仕事は、従わせられた仕事だった。スライマーンの死が明らかになると、彼らが、それから解放されるのを待っていたことが現れる。このことは、命令の力で身体を動かすことと、信仰の力によって自ら働くことの違いを、明らかにする。\n\n第14節\n\nそして、われら*が彼（スライマーン*）に死を定めた時、彼の杖を蝕む地面の虫以外、彼らにその死を知らせた者はなかった[1]。それでスライマーン*が（地面に）崩れ落ちた時、ジン*たちは、もし彼らが不可視の世界*を知っていたなら、彼らが屈辱の懲罰の中に留ま（り続け）ることはなかったのだ、と分かった[2]のだった。\n\n従わせられた力の、いくつもの光景は、授けられた力の限界を明らかにする場面で結ばれる。アッラーはスライマーンに死を定めた。彼は杖にもたれた姿のままで、ジンたちは、彼が亡くなったことを知らずに働き続けた。やがて地虫が杖を食べ、彼の身体が倒れた。風とジンを従わせられた者も、死の定めから外れたのではなかった。人々の目にその力を見せていたジンたちも、すぐ近くにある、見えない事実を知らなかった。\n小さな被造物が杖を食べることで、彼らの力では分からなかったことを明らかにした。彼の死を知っていたなら、自分たちが屈辱的な苦しみと考えていた労働に、とどまらなかったはずである。この場面について、東京ジャーミイ訳の節全体の訳は、『われらが彼の死を決めたとき、[ジンたちに]彼の死を教えるものは何もなかった。ただ一匹の地虫が、彼の杖を食べた。それで彼が倒れたとき、[彼がすでに死んでいたことが]ジンたちに明らかになった。もし彼らが、目には見えないものについて知ってさえいたなら、屈辱の懲罰の中で過ごさずに済んだだろうに。』である。この訳では、スライマーンの死がジンたちに明らかになったと読む。これとは区別して、講義原稿が紹介する解釈には、ジンの実情が明らかになり、彼らが見えないことを知らないと露わになった、という見方がある。また、ジンの指導的な者たちが、見えないことを知っているかのように信じ込ませていたのに、実際は知らなかったと、その追従者たちに分かった、という見方もある（イブン・アティーヤ『المحرر الوجيز』、34：14の解説）。動きの多さや驚くような仕事を見て、アッラーから授かっていない知を、彼らが持つと思ってはならない。\n物語の結びは、ここで章の冒頭とつながる。支配のすべてはアッラーに属する。山、鳥、鉄、銅、風、ジンのうち、望むものを従わせられる。そして、知のすべてもかれに属する。従わせられた者たちは、アッラーが教えるのでなければ、自分たちから隠れたことを知ることができない。\nこの結末を考える一つの道は、アッラーの宗教のために働く者が、ともに働く人々のあり方を考えることである。力のない時期には、必要なのはただ、財産と、自分の望むことを何でも実行する従者だ、と思うかもしれない。考えも理解も持たず、命じれば動く者たちがいればよい、と。しかし、従わせられたジンの仕事は、この従い方の限界を明らかにする。強制されることだけを理由に働いているなら、恐れている相手がいなくなり、仕事から解放されるのを待つようになる。一方、担い手が亡くなっても続く使命には、それを信じ、なぜ力を尽くすのかを知っている人々が必要である。\n預言者の生涯の終わりを考えると、別の姿が見える。月曜の朝、預言者は自宅の幕を開けた。教友たちは夜明けの礼拝で列を整え、アブー・バクルが先導していた。預言者の姿が見えた喜びで、礼拝を乱しそうになるほどだったが、預言者は、人々へ「あなた達の礼拝を最後までつづけよ」と手振りで合図した（ムスリム419a〔並行伝承〕、ブハーリー1205〔講義〕）。列は保たれ、礼拝は続いた。集まることは、一つ一つの動きを、預言者自身が直接取り仕切ることに依存していなかった。\n預言者の教えには、『暁の礼拝を行った者は、アッラーの保護下にある。』という言葉がある（ムスリム657）。ここでいう保護は、危害を加える者に対して責任を問う、後続の警告を伴う。どのような災いも起こらないという無条件の保証としては扱わない。あの礼拝の光景には、礼拝を整えて行う姿と、主とのつながりが、共にあった。\n彼らは、預言者が亡くなった後にも責任を担った。ザカートという財産上の義務を拒む者について、アブー・バクルは、使徒に差し出していた繋ぎ綱一本分でも拒むなら、その拒否に対して戦うと誓った（ムスリム20、伝承の意味）。従うことは、なくなるのを待つ負担ではなかった。自分たちが責任を負う、託された務めだった。\nダッジャールについても、預言者は、自分が人々の中にいるときに現れれば、自分が彼らに代わって論証をもって対抗するが、自分がいないときに現れれば、それぞれが自分自身のために対抗すると教えた。講義原稿は、アッラーが自分に代わってすべてのムスリムを守るという意味で伝える。日本語既刊訳では「アッラーは、私に代って、全てのウンマを守るでありましょう。」と表される（ムスリム2937）。心はアッラーへ戻される。預言者が亡くなっても、その守りとのつながりが絶たれることはない。\nこの事実は、アブー・バクルに、さらに明瞭に表れる。彼は、預言者に最も近く、親しく連れ添い、深く愛した人々の一人だった。それでも、その死の後に、ほかの人々が動揺する中で、確かに立つ姿が現れた（ブハーリー3667–3668）。愛が失われたのではない。愛する人がいなくなれば使命までなくなるようなものではない、より確かな、アッラーへの信仰に根を下ろしていたのである。\n預言者の死後、アブー・バクルとウマルが、ウンム・アイマンを訪ねたとき、彼女は泣いた。二人は、使徒にとって、アッラーのもとにあるものの方がよいのだ、と伝えた。彼女は、アッラーのもとにあるものの方が使徒にとってよいと知らないから泣くのではないと述べ、「しかし私は啓示が途絶えたことで泣いているのです。」と答えた。二人もともに泣いた（ムスリム2454）。この場面には、ただ一緒にいた人を失った悲しみよりも、細やかな意味がある。彼らは天から届いていたものの価値を知っており、その断絶を悲しんだ。\n人々を啓示へ結びつける育て方とは、このようなものである。『あなた方は、啓典を教え、自らも学んできたことによって、学識豊かな指導者[3]となるのだ』と仰せられるとおりだ（3：79）。よい教師は、学ぶ者とアッラーの啓典とのつながりを深める。理解と行動が、自分という人物のところで止まるような教え方をしない。ウフドの日、預言者が殺されたという知らせが広まった試練も、『ムハンマド*は、一人の使徒*に過ぎない。彼以前にも、使徒*たちが滅び去っていったのである。それでもし彼が死んだり、殺されたりしたら、あなた方は踵を返すのか[1]？』という意味に、心を備えさせることになった（3：144）。使徒の導きに忠実であることは、その人を失った後にも、導きに踏みとどまる姿に表れる。\nただし、人を育てることは、一人一人が、指示や仕事の分担をまったく必要としなくなるということではない。人々の中には、能力に応じて、何をすればよいかを示す必要のある者もいる。問題なのは、仕事のすべてが、理解も信仰も、その仕事への愛もないままに、命令を実行することだけで成り立つことである。また、指導者がいなくなっても、悲しみや損失がない、という意味でもない。預言者は、自分について「私は私の教友達の保証をしている。」、教友たちについて「そして私の教友は私のウンマの保証をしている。」と知らせた（ムスリム2531）。その死の後に影響はあった。しかし影響を受けることは、使命が崩壊したり、全員がそれから離れ去ったりすることとは異なる。\n杖を指す「المنسأة」という語も、この意味をさらに分かりやすくする。羊飼いが動物を追い立て、後ろへ下がらせるのに使う杖であり、語根には遅らせる意味がある。それが失われる姿は、杖だけに頼っていた動きは、杖への恐怖がなくなれば終わる、と気づかせる。一方、納得と信仰は、命じる者がいなくても、その人を、力を尽くすことへ向かわせる。\n教友たちには、さらに力を尽くすことを求める者たちがいた。その歩みのある段階では、『（敵に）手を出すのではない。そして礼拝を遵守し*、浄財*を施すのだ』と命じられたほどである（4：77）。意欲は心の中にあり、それをアッラーの命令が整えた。\n彼らが使命への思いを担った例に、アザーンの始まりの話がある。ムスリムが増え、礼拝のために人々を集める手段が必要になり、相談が行われた。アブドッラー・ブン・ザイドは、使徒が心を砕いていた、人々を礼拝に集める問題を、自分も心にかけながら帰った（アブー・ダーウード498）。自分に命令が届くのを待つ、遠い問題と見なさなかった。それを心に担い、やがてアザーンの夢を見た。\n預言者は、夢を聞いてそれを認め、ビラールの声の方がよく響くので、教えるよう命じた。ウマルも同じような夢を見たと伝えた（アブー・ダーウード499、伝承の意味）。使徒が認めた夢は、共同体の問題を心に担っていた者につながっていた。そして実行するときには、より適した声を持つ者へ呼びかけの役割を託すことで、仕事をよく行った。二つの伝えには、それぞれの経路と経過の違いがあり、一つの同文の伝承としては扱わない。\nクルアーンにも、自ら進んで担うことの別の例がある。『町の一番遠くから、一人の男が急いでやって来た。彼は言った。「我が民よ、使徒たちに従うのだ。』（36：20）。その町には、すでに使徒たちがいた。『われら*が彼らに（アッラー*への信仰と、シルク*の放棄へと招く）二人（の使徒）を遣わし、彼らが二人を噓つき呼ばわりした時のこと。それでわれら*は（その二人を）三人目（の使徒）で強化した。』と仰せられている（36：14）。それでも、その人は、使徒たちがいるのだから、自分が加わる必要はないとは言わなかった。町の最も遠いところから来て、自分の民に、使徒たちに従うよう呼びかけた。\nあらゆる仕事が、担当に任命されるまで待つわけではない。一人一人に、自分が気づける必要があり、提供できる考えや力がある。こうして、それを信じて使命を担う者と、仕事を、解放されるのを待つ屈辱的な負担と見る者との違いが分かる。財産や機器がどれほど多くても、この信仰がなければ代わりにはならない。クルアーンによって育ち、自分の責任を知る世代は、託された務めを担い、後の人々を教えられる。そうして、呼びかける者が亡くなった後も、その呼びかけは続いていく。\n\n第15節\n\nかつてサバア[の人々]にも、その住まうところにひとつの御しるしがあった。それは右と左にあった二つの園。「あなたがたの主の糧を食べ、感謝しなさい。すこやかな土地に、もっともよく赦す主に」。\n（34：15）\n\nサバアの物語は、ダーウードの一族に表れた感謝の姿と対照をなす。どちらの物語でも、賜物は豊かである。違うのは、人々がそれをどう扱うかだ。サバアは、そこから諸部族が分かれた人々の祖となる、ある男の名であり、そのうち六つの部族がイエメンへ、四つがシャームへ分かれたと伝えられる（ティルミズィー3222、伝承の意味）。\nこの物語の目的は、系譜をたどることにとどまらない。人々の暮らしのすぐ近くにある恵みを見ることにある。よい住まい、豊かな糧、そして後の節で語られる道の安全である。これは、アッラーがクライシュに思い起こさせた二つの恵みでもある。『空腹ゆえに食べ物を彼らにお授けになり、彼らを恐怖から安らげて下さった[1]お方を。』とあり（106：4）、聖域については、『われら*は彼らに、安全なる聖域[2]を確立してやったのではないか？あらゆるものの果実は、われら*の御許からの糧としてそこに集められて来るのだ。』と仰せられる（28：57）。サバアの報せは、語りかけられている人々の状態から遠いものではない。サバアに糧と安全を与え、彼らが背を向けた後にそれを取り去ったお方は、恵みに思い上がる者に、同じようになさることができる。\n住まいから話が始まることは、人が安定を感じる根本に触れている。朝、自分の暮らすところで安全であり、身体が健やかで、その日を過ごす食べ物がある者は、世界が集めて与えられたかのようである、と預言者は語った（ティルミズィー2346、伝承の意味。ここで参照した本文の、安全、健康、食べ物という順序による）。安全、健康、足りるだけの糧がそろうことは、人間の暮らしが安らぐ、根本的なものなのである。\nサバアの住まいにあった御しるしは、『右と左に二つの果樹園[2]。』だった。町の両側を囲む果樹園とする解釈があり、一軒一軒の家に、右と左の二つの園があったとする解釈もある。いずれでも、広い恵みが整えられ、住む者の近くにあることが現れる。多くの園に木々が茂り、陰が重なる姿は、豊かな暮らしを身近に思い描かせる。人々は糧を近くに見出し、手に入れる負担も少ない。\n物語は「御しるし」という語で始まり、『本当にその中にはまさしく、忍耐*強く感謝深い[1]全ての者への御徴がある。』という言葉で結ばれる（34：19）。恵みそのものが、気づくべきことを示す場である。そして、それに背を向けた結末は、さらに別の面から、教訓を受け取らせる。\n恵みを受けてよいという許しは、与えるお方への務めと切り離されない。『あなた方の主*の糧から食べ、かれに感謝せよ。』。従うことは、よい糧を拒むことではない。アッラーからのものだと知り、感謝しながら食べることである。このことは、物質的な恵みにも、精神的な恵みにも当てはまる。天使たちはマルヤムに、『マルヤム*よ、本当にアッラー*はあなたをお選びになり、清められた。そして全世界の女性の中から、あなたを選りすぐられたのである。』と告げた（3：42）。そして、『マルヤム*よ、あなたの主*に謹んで仕えよ。そして（かれに）サジダ*し、ルクーゥ*する者たちと共にルクーゥ*をするのだ』という務めが続いた（3：43）。同じく、ムーサーが使徒としての使命と言葉によって選ばれた後には、『ならば、われがあなたに授けたもの[2]を手にし（て、それを遵守し）、感謝する者の一人となるのだ』と仰せられた（7：144）。賜物が尊いからといって、働く務めはなくならない。それによってこそ、働くことが求められる。\n彼らには、よい土地と主の赦しが、共に与えられた。『（恩恵の主は）赦し深い主*なのだから』という言葉の意味の一つは、背いたことがあっても、直ちに罰を下すことなく、猶予を与え、思い起こさせ、明らかにしてくださった、ということだ。豊かさが続くことを、恩を否定することにアッラーが満足されている証拠としてはならない。恵みを受ける者は、開かれている、立ち返るための扉を見失ってはならない。よい土地が一つの恵みであり、赦しはまた別の恵みである。どちらも、心を主への感謝へと向ける。\n\n第16節\n\nそして彼らは（アッラー*のご命令と使徒*に）背いたので、われら*は彼らに、猛烈な洪水を送った。またハムトの実とアスルの木、僅かばかりのスィドル[1]からのものがなる二つの果樹園で、彼らの二つの果樹園と取って換えた。\n\n恵みを与えられ、それを感謝するよう命じられたことに対する答えは、背を向けることだった。糧が集まっていた場所は、その糧が失われたことを示す場所に変わった。豊かな暮らしが長く続くと、誰から与えられたのかを見失い、手段がよく整っていることを、暮らしが続く保証と考えてしまうことがある。二つの園の持ち主の、『そして彼（不信仰者*）は、自らに不正*を働きつつ[1]、自分の果樹園に入った。彼は（その実りを喜び、）言った。「これ（果樹園）が絶対に、消え失せてしまうとは思わないし、』という姿が、それである（18：35）。木々、水、よく整えられた仕組みを見て、自分の園がなくなるなど、あり得ないと思った。人々が自分たちの堤防や水路を頼りにして、もう危険は起こり得ないと思うのに似ている。\nクルアーンは、この思い上がりの根を明らかにする。『かれは人間を、一塊の凝血からお創りになった。[1]』と、人間の創造の弱さを思い起こさせ（96：2）、『人間に、彼が知らなかったことを教えて下さった（お方）。』と、知識も賜物であることを示す（96：5）。そして、『いや、本当に人間は逸脱する。』（96:6） ／ 『自分に足りないところはない、と思いあがる。』（96:7）と続く。人は、本当に何も必要としなくなったのではない。自分で、自分は足りていると思うのである。初めは困り、恐れていた人が、仕事が落ち着き、身体が丈夫で、財産が増え、乗り物や暮らしの気がかりを解決すると、もう誰も必要ないと思い込み、罪を犯すことに大胆になることがある。罪を犯しても、しばらく恵みが続くことが、さらに思い上がりを増すこともある。与えられた猶予を、恵みがいつまでも続く証拠にしてしまう。\nそこへ、『われら*は彼らに、猛烈な洪水を送った』と、取り計らいが、手段のすべてを所有するお方へ戻される。人間が堅固に作ったものも、アッラーの御力を妨げることはできない。人々の繁栄の原因となっていたものを、その豊かさが失われる原因にすることもできる。訳文の「猛烈な洪水」に当たる語には、激しい洪水とする解釈があり、山々の間で水をせき止める堤防、あるいはその構築物とする解釈もある。洪水を抑え、必要な分だけ水を出すことは、農業が安定し、園が広がる原因になっていた。その基礎が崩れれば、それに支えられた暮らしも影響を受ける。\n同じように、ある国の力が、石油など、一つの資源に結びつくこともある。それさえある限り豊かさは保証されていると思っても、資源そのものも、アッラーの支配のもとにある。『言ってみよ、もしあなた方の水が（地下に沈んで）無くなってしまったら、一体誰が、あなた方に湧き水を与えてくれるというのか？』という言葉が、そのことを思い起こさせる（67：30）。\nこの章では、大きな賜物の姿と、それによって思い上がる者の弱さを明らかにする小さな原因が、近くに並ぶ。アッラーは、ダーウードとスライマーンに、さまざまなものを従わせられた。しかしその後、杖を食べる地虫が、ジンたちから隠れていた事実を明らかにした。そしてサバアの、住む者たちの目を奪った豊かさも失われた。人の身体にも、学ぶべきことがある。力と健康を持っていても、考慮にも入れていなかった小さな異常で、動けなくなることがある。\nとりわけ明らかな例に、ヤアジュージュとマアジュージュの報せがある。彼らの勢いは、誰も戦う力を持たないため、信仰者たちを連れてトゥール山へ避難するよう、アッラーがイーサーへ啓示されるほどになる。日本語既刊訳では、その退避の命令を「それ故、お前はこの人々をトゥールヘ安全につれて行くがよい」と伝える（ムスリム2937）。それでも、アッラーが彼らの首に小さな虫を送ると、彼らは滅びる（ムスリム2937、伝承の意味）。別の伝えでは、彼らは地上の水を飲み、思い上がりを強めて、天に向けて武器を投げ、血に染まって戻ると、天の者たちにも勝ったと思い込む。その後に、小さな被造物によって滅びる（イブン・マージャ4079、伝承の意味。この伝えの本文は一人が槍を投げる形で、ムスリムの別伝の矢と、一つの同文の引用にはしない）。人間から見た原因の大きさが、アッラーの御力を測る物差しにはならない。\nサバアの報いは、果実を失うだけではなかった。以前の姿を思い出させる二つの園が、残った。よいものは、苦く、質のよくない実へ変えられた。「ハムト」は、苦い実とする解釈があり、苦い実をつけるアラークの木とする解釈もある。それとともに、以前慣れ親しんだよい実を見出せないアスルの木があった。この文脈で、残ったものの中ではよい木であるスィドルも、『僅かばかりのスィドル[1]』しか残らなかった。幾らかのものと述べ、さらに少ないと示すことで、かつての豊かさの後に、役立つものがいかにわずかになったかが現れ、恵みを知ってから失った者の悔しさを増す。\n糧、地位、交易の手段が集まっていたマッカにとって、これは身近な警告だった。経済の力は、感謝の代わりにはならない。土地の位置も、住民の財産も、アッラーの支配から守るものではない。\n\n第17節\n\n彼らが不信仰であ（り、恩恵への感謝を怠）ったことゆえ、われら*はまさしくそれで彼らに報いたのである。そしてわれら*が不信心この上ない者の外に、（このような）罰を与えることがあろうか？\n\n恵みが変わったことは、その民の、恵みへの態度と無関係な出来事ではなかった。報いは、彼らが恩を否定したことと結びつけられる。与えられることは、責任を免れることではない。恵みが続いているからといって、恩を否定してよいわけでもない。\nこの語りかけには、多神崇拝者への警告と、信仰者への安心の両方がある。財産や装備を持つ者は、手の中のものに思い上がってはならない。弱い立場にある者も、相手の力がアッラーの支配を離れた、と思ってはならない。この場面は、二つの園の持ち主への、信仰者の答えに似ている。『おそらく主は、あなたの園よりも良いものを私に与えるかもしれない。また空から[あなたの園に]一撃を送りつけ、平らかな砂地にするかもしれない。』（18:40） ／ 『あるいは水が[地中に]沈んで、探し求めることもできなくなるかもしれない」。』（18:41）。与えたお方は、取り去ることも、園の持ち主が貧しさゆえに見下していた者へ、与えることもできる。\nこの安心は、章の冒頭へ立ち返る。天にも大地にも、すべてはアッラーのものである。預言者たちに特別に与えられた、鉄、風、銅を従わせる力さえ、その賜物だった。だから信仰者は、心がアッラーを頼りに安らぐことと、所有する財産を頼りに安らぐことを、区別する必要がある。『人々の中には、アッラー*を覚束ない形で崇拝*する者[1]がいる。そして自分に善いことが起これば、それに安心し、試練が降りかかれば、顔から引っくり返（って反転す）る[2]。彼は現世と来世において、損をしたのだ。それは明らかな損失なのである。』と仰せられている（22：11）。この中の『それに安心し』という表現は、得られたよいことに、安心を結びつけている。財産がまだ手の中にあると確かめるまでは心が落ち着かず、それがなくなると、信仰も一緒に揺らぐ者のようである。\n訳文の「財産」「善きもの」に当たるアラビア語には、財産を指す用法がある。その例には、『もし、彼が財産を残したなら——、両親と近親者に対して適切な形で遺言[1]をする』（2：180）と、『また、本当に彼（人間）は、善きもの[1]への愛情において、ことさら激しい者である。』（100：8）がある。一方、信仰の安心の根本にあるのは、『アッラーの唱念によってこそ、心は安らぐのではないか。[1]』ということである（13：28）。豊かさの中でも、試練の中でも、しもべと主とのつながりが保たれる。\n『そしてわれら*が不信心この上ない者の外に、（このような）罰を与えることがあろうか？』については、不信心な者たちの恵みを罰として根こそぎにする、このような報いを指す、とする解釈がある。それに対して、信仰者に及ぶことは、主へ立ち返らせるための戒めとなる。ここで考えるべきなのは、アッラーに対する態度の違いと、試練がその人に及ぼす働きである。恩の否定をさらに深めさせる、気づかないままの猶予と、悔い改めへ目覚めさせる災難とを、同じにしてはならない。\n\n第18節\n\nまた、われら*は彼らと、われら*が祝福を授けた町々[1]との間に、（その近さゆえ互いに）目に見える町々を設け、そこに（ちょうどいい間隔の）旅程を整えた。（そして、われらは彼らにこう言ったのだ。）「夜に昼に、そこを安全に行くがよい」。\n\n二つの園における糧の恵みの後には、安全と、容易に移動できることの恵みが、詳しく語られる。アッラーが祝福された町々は、シャームの町々と解釈される。イエメンのサバアからその土地まで、見える町々によって道がつながり、旅人は、食べ物、休息、宿泊に必要なものを、そこに見出した。途切れてしまうのではないかと恐れる長い道のために、食糧を背負う必要はなかった。一つの区間を進んで町に泊まり、また歩き始め、休む必要のあるところで、同じような町に出会う。\n『そこに（ちょうどいい間隔の）旅程を整えた。』には、それぞれの旅程が釣り合い、近く整えられている意味がある。一つは遠すぎて旅人を疲れさせ、別の一つは必要もなく近い、というのではない。道のりは、休みやすいように測られている。アッラーが、この組み立てを思いつかせたとする解釈もある。安全の原因を説明する可能性として、道沿いの部族との関係や取り決めによって、安全が整えられたという見方もある。サバアの豊かさゆえに、部族の側も、彼らに便宜を図ることを望んだのである。どちらの場合も、人々が扱う手段を通じて実現していたとしても、容易になっていることは、アッラーからの恵みである。\n『そこを安全に行くがよい』という表現は、町々が、一つにつながった場所であるかのように描く。旅人は、危険を恐れ、重い食糧を背負う、途切れた道へ出ていくというより、自分の町の中を歩いているようなのである。夜が昼より先に挙げられることは、安全の意味を、さらに際立たせる。夜は、旅人が恐れやすい時である。そのため、安心をいっそう必要とする時間まで含めて、旅をする許しが述べられる。夜々と日々が複数で述べられることは、歩みが長く続いても、休みやすさと安全が続くことを示す。一時の区間だけのものではない。\nクライシュも、自分たちの安全と糧に、これに似た恵みを知っていた。サバアの報せは、彼らの手元にあるものを思い出させる。この意味を実践することには、人々の暮らしをよくするために心を配ることがある。糧を得やすくし、安全を保ち、旅の道と、休める施設を整える。道中の苦労を減らし、旅人が安心できるものへ費やすことは、アッラーが容易にしてくださったことへの感謝である。国の暮らしが整い、住民が生きることにも、その働きが及ぶ。\n\n第19節\n\nそして彼らは（安楽と豊かな暮らしに飽きて）、言った。「我らが主*よ、私たちの（町から町への）旅行（の距離を）を遠ざけて下さい」。こうして彼らが（不信仰によって）自分たちに不正*を働いたので、われら*は彼らを（後世へと）語り継がれるものとし、跡形もなくばらばらにしてやった。本当にその中にはまさしく、忍耐*強く感謝深い[1]全ての者への御徴がある。\n\n道を容易にされたことに対し、彼らは、驚くような願いで答えた。『我らが主*よ、私たちの（町から町への）旅行（の距離を）を遠ざけて下さい』。別の朗誦法では「رَبَّنَا بَعِّدْ بَيْنَ أَسْفَارِنَا」と読む（イブン・アルジャザリー『النشر』、サバア章の各語の読みの項）。この強められた形には、求める隔たりを強める意味が読み取られる、というのが、ここでの解説である。\n彼らは、旅の容易さや宿場の近さに飽き、旅程が遠く離れ、ラクダや食糧の持ち運びを必要とするよう、願ったと解釈される。感謝するべきものが、不満の種になった。この願いの解釈の一つは、恵みを当たり前とし、思い上がったというものだ。無事な暮らしに慣れ、その価値を感じなくなり、苦労へ向かう変化であっても、変わることを求める。否定する者たちの、『アッラー*よ、もしこれが本当にあなたの御許からの真実であるなら、天から私たちの上に石をお降らしになるか、あるいは私たちに痛ましい懲罰をお与え下さい』という誤った願いにも似た面がある（8：32）。それが真理であるなら、そこへ導いてくださいとは願わず、自分たちを滅ぼすものを求めて迎えた。\n別の解釈では、道の安全と町々の近さがアッラーの恵みだと教えられたとき、サバアの言葉は、その恩を認めない態度だったという。そんな恵みは必要なく、旅が遠くなっても、自分たちには十分な力がある、と言っているかのようだった。この見方では、ただ道を変えてみたいという希望よりも、自分で足りていると思い込む大胆さが、願いの背後にある。\n彼らの有力者や富裕者が、そのことを求めたとする解釈もある。旅が容易であるために、貧しい者も自分たちと同じように旅をできた。そこで、所有するラクダや装備の価値を示し、能力のある者だけが旅できるようにしたかったのである。乗り物を持つ者が、ほかの人は同じものを持たずに用を済ませられることを不満に思い、自分の優越が分かるよう、必要な場所が遠く離れることを望む姿を考えると、この意味が近づく。また、町々の住民の視線のない道を望み、人の見ていないところで罪を犯せるようにしたかった、とする解釈もある。悪い願いに、自分自身への不正が重なる。\nこれらは、願いの動機についての異なる解釈である。共通するのは、感謝を促すはずの恵みを、恩の否定、他者への高ぶり、罪の場に変えてしまったことである。さらに、旅程がすでに遠くなったことを述べる「رَبُّنَا بَاعَدَ بَيْنَ أَسْفَارِنَا」という読み方もある（同書、サバア章）。こちらには、起きたことを嘆く姿がある。旅程が遠くなった後に、弱い立場の者たちが言ったとする解釈があり、願った本人たちが、その結果を味わって言ったとする解釈もある。近さを不満に思い、今度は遠さを不満に思う。問題は、恵みが何一つなかったことから生じたのではない。与えられたものの価値を知らない心から生じたのである。\n人の必要が移り変わることは、雨を願う伝承にも表れる。ある金曜に、雨がなく財産が失われていると訴える人がいて、預言者は祈った。次の金曜には、多すぎる雨の害を除いていただくことが求められ、預言者は、周囲に降り、自分たちの上には降らないようにと祈った（ブハーリー1014、伝承の意味。語り手のアナスは、二度の申し立てが同一人物だったかについて、確信していない）。害を除くための正当な願いと、サバアの思い上がりは区別される。それでも、この話は、人の状態がいかに速く変わり、どちらの状態でも主を必要とするかを、身近に感じさせる。\n家族、子供、乗り物、暮らしなど、慣れ親しんだ恵みでも、似たような無自覚が起こる。愚痴ばかり言い、失ったときになって、初めて価値が分かる。この感覚とのつながりを考えられるものに、イスラーイールの子らが、マンナと鶉に代わるものを求めた言葉がある。『だからあなたの主*にお願いして、私たちに野菜、キュウリ、穀物、レンズ豆、玉葱といった、大地に育つものを出してもらってくれ』（2：61）。自分の手で扱うものを望む気持ちに、自分が物事を支配し、主から届く賜物を待つ者ではなくなった、という思い込みが伴うことがある。しかし、働く力も、その実りも、同じくアッラーの恵みである。\n雨を降らせられるようになれば、魂の秘密にたどり着けば、地球の外に暮らす場所を見つければ、アッラーの支配から出られると思うことも、この問題につながる。どこまで手段が広がっても、それはかれの支配の中にある。『あなた方は（アッラー*の）権威なしには、脱出することなど出来ないのだ。[1]』とあるとおりだ（55：33）。\nやがて、この節は結末を描く。人々のまとまりと、豊かな暮らしによって知られていた者たちは、過ぎた時代について語られる話になった。散り散りになり、その離散が、「サバアのように散り散りになる」ということわざにもなった。園、安全、まとまりは、彼らを囲む現実ではなく、聞き手が変わりように驚く昔話になった。\nここには、与えることも、差し控えることも所有されるお方へ、心をまとめるものがある。笑いの後に泣くことがあり、安全の後に恐怖があり、豊かさの後に困窮がある。しもべは、それらの状態を主から独立して所有していない。それゆえ、『本当に私は、諸天と大地を創成されたお方[1]に、我が顔を純正に向ける[2]。そして私は、シルク*の徒の類いではないのだ』にあるように、かれへ向かう（6：79）。\n物語の結びには、忍耐と感謝がある。感謝は、よい状況で、心を恵みの主へ結びつけて保つ。忍耐は、困難な状況で、その人をかれへ戻す。災難への答えを、背を向けたまま別の場所へ逃れることだけにしない。信仰者のことはすべて善につながる、という伝承にも、感謝と忍耐が述べられる。掲載された日本語訳の該当箇所は、『たとえば、なにか喜ばしいことがあってアッラーに感謝すれば、そのことで良いことが生じ、また、困難があっても忍耐すれば、そのことで良いことが生ずるのである』である（ムスリム2999、スハイブの伝承。信仰者に限るという、全文の文脈による）。恵みがあるときにそれを知り、失ったときにはアッラーへ戻る者は、御しるしから益を得る。恵みに思い上がり、その後、悔しさの中で散り散りになった者が、気づかなかった御しるしである。\n\n第20節\n\nまた、イブリース*は確かに、彼ら（人間たち）に対して自分の思い込み[1]を実現し、彼らは信仰者たちの一派以外、彼に従った。\n\n「自分の思い込み[1]を実現し」に当たる語には、「صَدَّقَ」と「صَدَقَ」という読み方が伝えられる（クルトゥビー『الجامع لأحكام القرآن』、34：20の解説）。前者は見込みを現実のものとしたことに、後者は見込みが当たったことに焦点を当てる。イブリースは、この人々が自分に従ったことに、自分の予想が当たる姿を見た。誘惑に応じるだろうと予想し、望んでいたことが、彼らの側から起きたのである。\nこれは、見えないことを知っていたということではない。彼らの選んだことが、その予想と一致したのである。イブリースは以前、人々を迷わせると述べたときも、『彼らの内、精選されたあなたの僕たち[1]はその限りではありませんが』と、アッラーの純粋なしもべたちを除いていた（15：40）。\nこの誘惑の入口には、恵まれているのに感謝しないこと、アッラーを想うことを忘れること、自分の取り分への不満を持ち続けることがある。こうした状態は、よいものに飾られた誘いに応じる下地となる。富める者だけの問題ではない。財産が乏しくても、激しく不満を抱く者はいる。悪魔は、その人を道から押し出す、最初の試練を待つ。これは、覚束ない形でアッラーを崇拝し、豊かであれば満足するが、嫌なことによって試されると反転する者の状態に近い。\n虚偽へ招く者が、自分の言葉を受け入れそうな相手を選ぶのと同じく、誘惑も、無自覚と自分本位の不満を受け入れた心に、入口を見出す。それでも、全員が従ったわけではない。『信仰者たちの一派以外』とある。この一派がいることは、ただ環境が悪く、試練が激しかったというだけでは、言い訳にならないと示す。試験はあった。しかし、信仰を守り、多数の者たちの恩の否定に、ついていこうとはしなかった人々がいた。\n\n第21節\n\n彼[イブリース]には、彼らに対して何の権威もなかった。われらはただ、誰が来世を信じている者か、誰が疑わしさをおぼえている者かを知ろうとしたに過ぎない。[ムハンマドよ、]あなたの主はありとあらゆるものごとの守護者。\n（34：21）\n\n悪魔の支配は、人を不信仰や罪へ、力ずくで追い込むものではない。招き、よく見せ、誘惑し、その誘いを受け入れる者を見出す。だからといって、その者から、選んだ責任がなくなるわけではない。\n違いを考えるには、ほかの人の注意を、禁じられたものへ向けさせる例が役立つ。相手を縛って、見るよう強いるのではない。その人の欲するものを差し出し、応じる下地のあった者が応じる。物事が終わったとき、悪魔は『また私には、あなた方に対していかなる（正当な）根拠[1]もなかった。ただ、私はあなた方を（不信仰と迷いへと）招き、あなた方は私に応じたのである。ならば、私を責めるのではなく、自分自身を責めよ。』と語る（14：22）。34章21節の東京ジャーミイ訳は「何の権威もなかった」と表す。ここで引用した14章22節のサイード佐藤訳は「（正当な）根拠[1]」と訳し、訳注[1]で、自分に従うことを無理強いする「力」がなかったという解釈を明示している。講義も、人を強制する権力がなかったことに焦点を置く。\n彼らは、罪へ招く声を聞いて受け入れた。一方で、従順な行いへ招く声も聞いていたのに、背を向けた。自ら喜んで受け入れた誘いを、二つの道の違いをなくす言い訳にはできない。\n強制力を否定することは、ささやきや、欲しいものを魅力的に飾る力を否定することではない。悪魔は人の中を、血の流れのように巡る、と預言者は知らせた（ブハーリー3281、伝承の意味）。しかし、この試練があることで、心の中に、来世への確信があるのか、それとも疑いがあるのかが現れる。アッラーとの対面と、行いの結末を心に置くほど、飾られた誘いへ抵抗する力は強くなる。墓を思い起こし、人間の行き着くところを目にすることは、その記憶を心が生かしている間、欲望の力を弱める。\nこれは、無謀な運転をしていた人が、事故で苦しみ、長い治療を経験すると、非常に慎重になるのに似ている。しかし、起きたことを忘れると、前の習慣へ戻る。問題は、教訓が一度も届かなかったことだけではない。無自覚に押し流されると、その働きが消えてしまうことである。\nアッラーの御前に立つ者は、『来世（の懲罰）を用心し、自分の主*のご慈悲を望みつつ、夜の刻にサジダ*し、起立（しつつ礼拝）する従順な者か？』と描かれる（39：9からの抜粋）。この用心は、言葉にも行動にも、その人についていく。口にし、行動する前に、その結末を問う。この世が道の終わりだとは考えていないからである。確信が根づく分だけ、悪魔に従うことから離れる。疑いと欲望によって、清算への恐れが心からなくなってしまった者とは、異なるのである。\n\n第22節\n\n（使徒*よ、）言え。「アッラー*を差しおいて、あなた方が（かれの同位者と）主張して（崇めて）いる者たちに、祈るがよい。彼らは諸天においても大地においても、僅かな重みすら有してはいないのだ[1]。そして彼らにはそこにおいて、（アッラー*に対する）いかなる加担もなければ、かれ（アッラー*）には、彼らからのいかなる援助者もない」。\n\n二つの物語は、アッラーが、その支配するものを、どのように取り計らうかを示した。与え、従わせ、恩を否定した者から取り去られる。そして、アッラーを差しおいて神々を呼び求める者に、挑戦が示される。その対象に頼っている理由となるものを、実際にしてもらうがよい。それらの力でダーウードのために鉄が柔らかくなり、スライマーンのために風とジンが従い、サバアへ園が与えられ、取り去られたのだろうか。\nこの節は、それらの崇拝対象に頼る理由を、一つ一つ落としていく。最初は、独立した所有である。それは、ほんの粒の重さほどについても否定される。天の星一つも、大地の何一つも、自分だけの力で処分できない。イブラーヒームの、『それなら、本当にアッラー*は、太陽を東から昇らせるお方である。ならば、あなたは太陽を西から昇らせてみよ」。すると、この不信仰だった者*は当惑してしまった。』という論証も、その無力さを示す（2：258）。\n次に、天と大地の所有において、アッラーと共有する持ち分が否定される。一人では何も所有しなくても、ほかの者と共同で持ち分を持つ場合はある。しかし、この節は、その可能性も閉ざす。さらに、『かれ（アッラー*）には、彼らからのいかなる援助者もない』と、助力も否定される。アッラーが、その支配を保ち、取り計らうために必要とする助け手が、それらの中にいるわけではない。「いかなる援助者もない」の「援助者」に当たる語は、ほかの者を助け、その背を支える者を指す。アッラーは、ご自身の被造物のことを取り計らわれ、その誰一人も必要とされない。\nこのように、崇拝されるものは、独立して所有せず、アッラーと所有を分かち合わず、アッラーが必要とする助力も与えない。これは、天使やイーサーのように、アッラーが尊ばれた者も含め、かれを差しおいて人々が頼る、すべての対象に及ぶ。しもべが尊いからといって、主の共同所有者になるのではない。この三つは、被造物のすべてについて否定される。これから説明される執り成しとは異なる。全面的に否定されることと、許しがあって初めて起こることを、混ぜてはならない。\nこの意味が根づけば、心はアッラーへまとまり、自分の行く末を支配していると思い込む対象からの、さまざまな要求に引き裂かれなくなる。朝の想起の祈りには、『主権と讃美がアッラーに帰属する中、私たちは朝\n（あるいは「晩」）を迎えました。』という言葉がある（『ムスリムの砦』77、ムスリム2723）。支配を確認することと称賛が並ぶのは、物事のすべてが、一人の主に属するという、しもべの安心と響き合う。\nクルアーンは、『アッラー*は、互いに確執する複数の共同（所有）者がいる（奴隷*の）男と、一人の男（主人）に従順な（奴隷*の）男の譬えを挙げられた[1]。一体、彼ら二人は譬えとして、同等だろうか？』という譬えで、この意味を身近に示す（39：29）。互いに争う複数の共同所有者に振り回される者は、一人の主人へ向かい先を定めた者と同じではない。心も同じである。アッラーだけが支配を所有されると知れば、対立する者たちの財産や装備が多くても、それをアッラーの支配より上の力にはしない。\n\n第23節\n\nかの御方が許した者を除き、その御許においてとりなしは何の役にも立たない。彼らの心から恐怖が消えるとき、彼らは[互いに]言う。「あなたがたの主は何を言っていたのか」。彼らは「真理です」と言うだろう。至高の御方、至大の御方。\n（34：23）\n\n所有、共同所有、必要とする助力が否定された後にも、多神崇拝者が頼ろうとするものが残る。仲介への期待である。この節は、執り成しそのものも、アッラーから独立して働くのではないと示す。『またかれの御許では、かれがお許しになった者に対してしか、執り成しが益することはない[1]。』。前の三つの属性のように、執り成しが全面的に否定されたのではない。それが益となることは、アッラーの許しによると限定される。執り成す者も、アッラーへ何かを押しつけることはできない。\nこの節の許しは、執り成す者が執り成すための許しとする解釈があり、執り成しを受ける者について、それが行われるための許しとする解釈もある。どちらでも、崇拝対象に頼るだけで、アッラーのもとでの仲介が保証されるという主張は成り立たない。許しを与えられた天使、預言者、信仰者たちは、アッラーに従うしもべとして執り成す。かれと並ぶ権限の持ち主ではない。\n続く部分の解釈の一つでは、許しを待つ者たちは、恐れと畏れの中にとどまり、許しが出ると、心の恐怖がなくなり、主が何を仰せられたかを尋ねる。この説明は、執り成す者についてのものとも、執り成しを受けることを望む者についてのものともされる。これほど尊い地位であっても、その前には、許しを待つことと、アッラーへの畏れがある。\n『彼らの心から戦慄が取り除かれると[2]』とは、心から恐怖が取り除かれたということだ。アラビア語には、動詞を強める形が、取り除く意味を持つ用法がある。「مرَّضه」が、病がなくなるように看護したことを指すのも、その例である。別の解釈では、イブリースに従った多神崇拝者たちの場面とされる。彼に従い続け、ついに死に至り、無自覚でいたことが明らかになる。そのときになって、従おうと、アッラーが何を仰せられたか尋ねるが、行動できる時は過ぎている。この見方では、ここに至るまでという意味が、この章の前の部分で述べられた、イブリースに従うこととつながる。\nこの節の、特にはっきりした解釈の一つは、アッラーが天で物事を定められるときの、天使たちの場面である。伝承では、天使たちは、その言葉に従い、翼を打ち合わせる。滑らかな石の上を鎖が引かれるような音が聞こえる。そして心から恐怖が取り除かれると、主は何を仰せられたかと尋ね、答えは真理であると告げられる（ブハーリー4800、伝承の意味）。天を畏れで満たす偉大さは、アッラー以外の崇拝対象のものではない。啓示を語り、物事を定めるお方のものである。\n東京ジャーミイ訳で、彼らの答えは『彼らは「真理です」と言うだろう。』である（34：23）。真理という言葉は、アッラーの言葉には虚偽がないことを表す。裁きが、真理による裁きと述べられるのと同じである。天使たちの従順さは、夜の旅で、ジブリールがアッラーへの畏れから、古びて擦り切れた敷き布のように見えた、という伝承にも、さらに現れる（タバラーニー『المعجم الأوسط』4679。スユーティーによる、伝承経路は真正という評価）。そのジブリールこそ、既刊訳に「六百の翼を持った天使ジブリール」とある、壮大な姿の持ち主である（ムスリム174a〔並行伝承〕、ブハーリー3232〔講義〕）。高い位と壮大な姿は、完全なしもべであることと矛盾しない。\n前の部分とのつながりも明らかである。アッラーだけが、所有し、与え、差し控えられるように、天使たちが従う啓示も、かれのものである。神々と呼ばれるものが、どんな啓示をもたらしたから、崇拝の持ち分が与えられるというのだろう。ムサイリマでさえ、預言者だと偽って主張したとき、嘘の主張をアッラーに結びつけた。別の主が啓示を下すということを、自分の主張の根拠にしたのではなかった。\nこのことから、教えは地上へ向かう。天使たちがアッラーの言葉に従うなら、その啓示を聞いた者も、意味を尋ね、従うべきである。自分の欲望や、誰かの言葉を、その対抗物にしてはならない。イブン・アッバースは、ハッジとウムラをめぐる議論で、預言者の報せに、アブー・バクルとウマルの言葉を対置することを批判し、預言者のスンナより、ほかの者の言葉を先にする結末を案じた（ハティーブ『الفقيه والمتفقه』1：377–378。別々の対話の伝えがある）。二人の徳をおとしめるためではなかった。二人自身が従っていた源を、大切にするためである。\n啓示の価値を知っていたからこそ、ウンム・アイマンは「しかし私は啓示が途絶えたことで泣いているのです。」と語り、アブー・バクルとウマルも、ともに泣いた（ムスリム2454）。その地位を知る心は、アッラーの言葉を、通り過ぎるだけの言葉として受け取らない。\n\n第24節\n\n（使徒*よ、彼らシルク*の徒に）言ってやれ。「あなた方に諸天と大地から、糧を授けられるお方は誰か？」言ってやるのだ。「（それは）アッラー*である。そして実に私たちとあなた方（のいずれか）が、まさしく導きの上か、あるいは紛れもなき迷いの中にあるのだ[1]」。\n\n物語と証拠が示された後、「言ってやれ」という命令が続き、語りは、直接伝え、論証する場面へ移る。問いは、語りかけられる者が、なくては生きられない必要へ向かう。糧をもたらすのは、誰か。天の雨も、大地の植物も、彼らが呼び求める神々は所有していない。ダーウードとスライマーンへ与え、サバアへ豊かに注ぎ、その後に取り去られたお方が、今、その人に糧を与えている。\n『言ってやるのだ。「（それは）アッラー*である』という答えが示されることで、必要は、それを所有するお方へ戻される。『言ってみよ、もしあなた方の水が（地下に沈んで）無くなってしまったら、一体誰が、あなた方に湧き水を与えてくれるというのか？』という問いも同じ働きをする（67：30）。豊かさによって覆われていたこの事実が、病気、恐怖、死が近づくことによって、その人に明らかになることもある。たとえば荒れた海は、陸にいる間に頼りにしていた多くの思い込みを、心から取り払う。\nアブー・ジャハルの子イクリマの伝承では、彼は船に乗って逃げたが、激しい嵐に遭った。船の人々は、神々は役に立たず、祈りを純粋にしなければならないと語った。イクリマは、海で救われるのと同じく、陸でも、アッラーにだけ純粋に祈ることによってしか救われないと分かった。救っていただければ預言者のもとへ戻ると決意し、戻ってイスラームを受け入れた（ナサーイー4067、伝承の意味）。海の主と陸の主が違うのではない。困難さによって明らかになる、心の無自覚の問題なのである。\nこれらの論証の後に、相手に配慮した語りかけとして、『そして実に私たちとあなた方（のいずれか）が、まさしく導きの上か、あるいは紛れもなき迷いの中にあるのだ[1]』とある。使徒が、自分のもたらした真理を疑っているのではない。相手の立場まで一段下りて語りかけるのである。最初から怒りをかき立てることなく、二つの道を考えるよう招く。一人の神という主張と、複数の神という主張は、共に正しくはなり得ない。崇拝対象が、許しなしに糧を与え、執り成すという言い分も、その無力さについて立てられた証拠に反する。使徒が父と子を分けると非難しても、アッラー以外を崇拝しているという自分たちの状態は、変わらない。どちらか一方は導きで、もう一方は迷いでなければならない。\n『導きの上』には、導きの上にしっかり立ち、確かである意味がある。ここには、人を導く働きに役立つ原則が現れる。相手を痛めつけることより、導きが優先される場である。相手を嘲ることはできても、そのことで、考えるために心を開いてもらう機会を失う場合がある。穏やかさは、明らかに伝えることを捨てる意味ではない。この語りかけは、これまでの論証、物語、詳しい説明の後に置かれている。\nクルアーンから、真理と虚偽の性質を明らかにすれば、一人一人の名前を挙げることを前提にしなくても、人々は二つの道を知る。『同様にわれら*は、御徴[1]を明らかにする。そして（それは真理が露わになり、）罪悪者たちの道が浮き彫りになるためなのだ。』とあるとおりである（6：55）。力の弱い時期には、こうした説明と対話を可能にすることが、大切な目的となる。洞窟の仲間たちの物語には、信仰を明らかにできない恐怖が描かれる。一方、二つの園の物語には、ある程度、話し合える余地が見える。『彼の連れ合い（信仰者）は、彼（不信仰者*）と話し合いつつ、（警告して）言った。「一体あなたは、あなた（の祖父アーダム*）を土からお創りになり[1]、その後に（両親からのものである）一滴の精液から（あなたを創られ）[2]、それから（均整の取れた姿形の）人間として整えて下さったお方を否定するのか？』（18：37）。論証を聞き、それを示すことを許す相手がいることは、呼びかける者が現実全体を変える力を持たなくても、行動の扉を開く。このため、真理の明瞭さと、よい語りかけの両方を大切にするのである。\n\n第25節\n\n言ってやれ。「私たちが罪を犯したことで、あなた方が問われることはなく、私たちもあなた方が行うことで問われはしない」。\n\n語りかけの穏やかさは、さらに増し、相手が予想するのとは反対の言葉さえ用いられる。使徒と信仰者の側には『私たちが罪を犯したこと』とあり、対立する者たちの側には『あなた方が行うこと』とある。これは、信仰が罪であると認めることではない。相手が主張していることを、論証のために、いったん仮定するのである。仮に、あなたがたの私たちへの非難を前提にしても、あなたがたは私たちの行いの責任を負わず、私たちもあなたがたの行いの責任を負わない。それなのに、なぜ私たちが、信じていることを明らかにするのを妨げるのか、ということである。\n彼らが多神崇拝を行っていることは明らかでも、相手の行いについては、「罪を犯す」とは述べていない。目的は、考え、導きへ進む扉を残すことにある。話し手が相手を言い負かす一言を得て、そのまま立ち去ることではない。人々の導きを望む者は、非難する相手に、私についての判断を今のまま保っていてもよいから、発言の内容を考えてほしい、と語りかけることがある。あなたには、あなたの責任があり、私には、私の責任がある。やがて、両者を分ける裁きがある。\nこの節は、前の節とつながる。二つの道が、共に真理ではないと確かめられた後に、それぞれの責任を分けることが、呼びかけを妨げ、語る者を黙らせようとする相手への論証になる。そうしたことによって、アッラーのもとでの責任はなくならない。伝える道が狭められた信仰者が必要とする語り方の一つである。使命に確かに立つことと、対話を可能なままに保つ努力が、一つになる。\n\n第26節\n\n言え。「我らが主*が、（復活の日*に）私たちをお集めになり、それから私たちの間を真理によってお裁きになる。かれは裁決者、全知者であられる」。\n\n二つの側の責任を分けた後には、誰も妨げられない、最後に戻るところを思い起こさせる。アッラーは、皆を集め、その後に、真理によって両者を分けられる。『私たちの間を真理によってお裁きになる』は、裁くという意味である。「お裁きになる」に当たるアラビア語には、開くという意味もあり、閉じているものを取り除く響きがある。議論の相手が、聞くつもりのない人々であり、しかも財産、装備、圧迫する力を持っていることもある。しかし、自分の目には道が閉ざされたからといって、真理には、それを支える裁きがないと思ってはならない。\n分ける裁きはアッラーのもとにあり、かれは『裁決者、全知者』である。状態、意図、それぞれにふさわしい報いを、ご存知である。その裁きに、無知も不正も入り込まない。人間の裁判官は、怒りによって見方を左右されることがある。しかし、アッラーの裁きには、すべてを包む知が伴う。人々から隠れた権利も、かれのもとでは失われない。\nこの意味を深く考える者は、呼びかけの出口が閉じられ、力と発言の手段が独占され、正しいことを伝えようとする者が、望むところへ届けなくなるときにも、アッラーが開いてくださることへ、いっそう希望を持つ。これらの意味は、人々の導きへの思いを担う者の糧となる。その弱い努力を、力を尽くしていることも、妨げもご存知の主へ結びつけるのである。\n宗教のために立つことへの、真剣な関心を考えさせるものに、戦いに出ず、その思いを抱くこともないまま死ぬ者は、偽信の一つの枝のうえに死ぬ、という預言者の言葉がある（ムスリム1910、伝承の意味）。これは出征についての伝承である。後に付されたイブン・アルムバーラク自身の説明には、使徒の時代のことと考える、という見方もある。この文脈で受け取る教訓は、宗教を支えたいという願いを、心にある、力を尽くす準備と無関係な、一時的な気分にしないことである。その思いが真実であるとき、「開き、裁決するお方」という御名の働きが、しもべの希望と忍耐に現れる。\n\n第27節\n\n言ってやるのだ。「あなた方が、かれに（崇拝*における）同位者として属させた者たち（の根拠）を、私に見せてみよ。断じて（、そのようなものは）ない。いや、かれは偉力ならびなく*、英知あふれる*アッラー*であられる」。\n\nこの論証は、多神崇拝の主張を根本から明らかにする要求で結ばれる。アッラーの共同者としたものを見せ、その地位を認める根拠を示すように、という要求である。これまでの節には、アッラーの行為、所有、取り計らいが現れた。それなら、かれに結びつけたものの、どんな働きが、それに対応するのだろう。\n『すべての者をそれぞれ見守り、またそれらが得たものを知る御方とは誰のことか。それなのに彼らは、アッラーに同輩があるものとする。』という言葉も同じ方向を示す（13：33）。この掲載訳の問い方は、そのまま引用している。すべての魂に糧を与え、生きるために必要なものを保ち、その行いと隠していることを知り、寿命を定められるのは、アッラーである。それなのに人々は、それらをアッラーから独立して何一つ行わないものを、共同者にしてしまう。\n求められているのは、ただ崇拝対象の名前や像を並べることではない。それらを、崇拝に値するものとしてアッラーに結びつけることが、いかに根拠のないものかを明らかにすることである。『断じて（、そのようなものは）ない』と、その主張が退けられ、続いて、『いや、かれは偉力ならびなく*、英知あふれる*アッラー*であられる』という明瞭な確認がある。人々が、共同者をどれだけ多く付け加えても、真理は変わらない。主張したからといって、それらに、真の神の属性が何か与えられるわけではない。\n\n第28節\n\n（使徒*よ、）われら*があなたを遣わしたのは、全ての人に向けて[1]、吉報を伝える者、警告を告げる者[2]としてに外ならない。しかし大半の人々は、知らないのだ。\n\n預言者の使命は、議論したクライシュの人々が応じるかどうかに、依存しない。その使命は、すべての人々へ向けられている。ある民が背を向けても、アッラーは、それを担う人々を備えてくださる。これは、『もしあなた方が（アッラー*への信仰と服従に）背を向けるなら、かれ（アッラー*）はあなた方ではない別の民と（あなた方を）交換され、それから彼らはあなた方のように（アッラー*に不服従に）なることもないであろう』という言葉にも近い（47：38）。マッカの否定する者たちがかたくなであった後、アッラーが、使命を信じ、支える人々をマディーナに備えられたことにも、それが現れた。人々の方が、導く呼びかけを必要としている。背を向けたからといって、その導きを必要としなくなる者はいない。\n『吉報を伝える者、警告を告げる者[2]』という言葉は、使徒が託された役割を定める。応じた者にはよい報せを伝え、背を向けた者には警告する。意固地な者が出す提案の一つ一つに、呼びかけを従属させるよう命じられているのではない。彼らは、ムーサーのような御しるしや、天から下る書を求め、マッカの人々は、サファーを金にすることを求めた（アフマド2333、伝承の意味。原稿はハーキムによる経路の真正評価も挙げる。同系統のハーキム3379には、本人による、経路は真正という評価があるが、両本文を同文の引用としては混ぜない）。\n地中へ通じる道や、天への階段など、あらゆる提案を追いかけていたら、応じるつもりのない者たちの要求は終わらない。これは、アッラーが使徒を支えられた御しるしを否定する話ではない。使徒の真実性は、答えられるたびに変わっていく要求を、満足させることに依存しない、ということを示している。意固地な者は、どの答えにも、さらに別の要求を続けられる。そのために、呼びかける者が、一生を異議の追跡に費やし、伝えることの根本を忘れてしまうおそれがある。\n彼らは、『どうして彼（ムハンマド*）には、ムーサー*に与えられたようなもの[2]が、与えられなかったのか？』と言った（28：48）。その後には、『私たちはこのクルアーン*を信じないだろうし、それ以前のもの[1]も（信じない）』という言葉が、その態度を明らかにする（34：31）。御しるしの形が違うことが、信じるのを妨げていたのではなかった。吉報と警告を理解すれば、務めは啓示を明瞭に伝えることであると分かる。論証としてもたらされたクルアーンは、反対する者たちの欲望に合わせて取り替える素材ではない。この役割が、すべての人々に向けられた使命の、進む方向を守る。\n\n第29節\n\n彼ら（シルク*の徒）は、言う。「その約束（復活の日*）は、いつなのか？もし、あなた方が本当のことを言っているのなら」。\n\n真の糧の主、多神崇拝の根拠のなさ、使命がすべての人に及ぶことが語られた後、彼らの異議は、清算の時期へ戻る。約束についての問いは、この議論の多くの背後にあるものを明らかにする。この人々は、ただ説明をさらに知りたかったのではない。自分たちの行為が、それを変えざるを得なくする清算へ、最後につながることを嫌っていた。\n復活章は、復活への異議を取り上げ、その後に動機を明らかにする。『（不信仰な）人間は、われら*が彼の骨を（それが散り散りになった後に、）集めることが（出来）ない、とでも思っているのか？』（75:3） ／ 『いや、われら*はその指先まで、きっちり整え（て組み立て、生前と同じ状態に復活させ）ることが出来る。』（75:4） ／ 『いや、（不信仰な）人間は、自らの前途において[1]放逸であることを欲し（、復活を否定し）ている。』（75:5） ／ 『「復活の日*は、一体いつなのか？」と尋ねながら。』（75:6）（75：3–6、四つの節を順に引用）。骨を集めることはあり得ない、という言葉から始まり、罪の中を進み続けたい意欲が、復活の日について尋ねる背後にあることを示す。\nここから、拒む者が、啓典や復活の可能性についての疑念を、自分の望む状態にとどまりたい気持ちの覆いとして使うことがあると分かる。論証が答えても、別の異議に移る。避けているのは、清算を認めることだからである。法は古い、現状に適さない、と言って、従うこと自体から身を引こうとする者にも、この意味は当てはまる。その場合、問題は、一つの表現を説明すれば済むことだけではない。務めを受け入れるのか、退けるのかという意志にある。\nこの章のここに彼らの問いが置かれているのには理由がある。真理を明らかに示されたのに、彼らはそれに背を向け、否定するために尋ねた。自分たちの行いを啓示の導きに従わせようとせず、その行いにどんな報いがあるかを告げる約束について問うたのである。ここで彼らの動機が分かるのは、前後の話がそれを示しているからだ。学ぼうとして質問する人にまで、同じ動機があると決めつけてはならない。\n\n第30節\n\n（使徒*よ、）言ってやれ。「あなた方には、一時たりとも遅らせることも出来ず、早めることも出来ない（復活の）日*の約束があるのだ」。\n\n答えは、人々には、早めることも遅らせることもできない時が定められていると確認する。約束が実現するかどうかは、彼らが急かすことに左右されない。そこへたどり着いたときに、さらに猶予を求めることもできない。\nこれまでの説明の後、語りかけは、復活の日があるかどうかという議論の繰り返しを越え、そこで彼らに起きることへ進む。定められた時刻にその日が来て、魂は、自分が選んだことの責任と向き合う。この語り方は、自分には試験などないと言い張る人に、試験の日に何に向き合い、準備を放置するとどうなるかを語って答える姿を考えると、身近に分かる。相手の否定を認めたのではない。抽象的な言い分から、実際の結末へ、その人を移している。\nこのため、この章では、時が定められていることの確認の後に、主のもとで拘留され、責め合う不正な者たちの光景が続く。この世で安全にしている間に軽く見たものが、乗り越えられない場面となる。早く来いと求めたものも、来たときには押し返せない。このことが心に確かになれば、役立つ問いは、これから来るものに、どう備えるかになる。時を定めることのすべては、アッラーにあると明らかになったからである。\n\n第31節\n\nまた、不信仰に陥った者*たちは言った。「私たちはこのクルアーン*を信じないだろうし、それ以前のもの[1]も（信じない）」。（使徒*よ、）もしあなたが、不正*者たちがその主*の御許で（清算のために）拘留され、お互いに（譴責の）言葉を返し合う時のことを見るならば。抑圧されていた者たちは、高慢だった者たち[2]に（こう）言うのだ。「もしあなた方がいなければ、私たちは信仰者だったのに」。[3]\n\n真実を否定する者たちは、クルアーンも、それより前の啓典も信じないと表明し、自分たちの立場の根本を明らかにした。それより前には、『これではないクルアーン*を披露してみよ。あるいは、それを変えよ[2]』と求めていた（10：15）。嫌っていた、神の唯一性や清算を、自分たちに求めない言葉が欲しかったのである。それに対して、『言ってやるがいい。「私には、それを自分勝手に変更する権利などない。ただ私は、自分に啓示されたものに従うだけなのだから』と答えが与えられた（10：15）。使徒は、伝えるよう命じられたしもべである。人々の欲望に合う宗教を、自分で作る権限を持たない。\n変更できないと分かると、ムーサーのような啓典を求めたことも、啓示を受け入れる用意からではなかったと現れた。ついには、クルアーンと、それ以前のすべてを拒むことになったのである。ここで語っている者たちは、高慢な有力者層だとする解釈もある。これは、御徴を無力に見せようとする、これまでの彼らの働きと、後に述べられる、財産と子供の多さを誇る態度とつながる。\n相手は、財産と装備を持っていても、同じものを持たない一人の男を恐れていることがある。その男とともにある、クルアーンの働きを知っているからである。だからこそ、人々と、その導きの源とのつながりを断つことへ、力を向ける。その一つに、アラビア語とのつながりを弱めることがある。クルアーンを聞いても分からなくなり、隔たりが広がって、その言葉も解説も難しくなる。あるいは、教育の中で、クルアーンの知を片隅のものにする。この世の学問では高い地位に達しても、開端章をよく読めない人がいる。ここでの問題は、学ぶ能力がないことではない。関心を向けたことは学べたのに、自分の宗教に必要な知から、背を向けてしまったことにある。\n人々がクルアーンと正しく結ばれれば、投げかけられる疑念を量る基準を持てる。どの言葉が啓示に反するかを知り、発言者の名声や発言の場の強さだけに、だまされなくなる。その基準を示す節に、『誰であろうと、アッラー*がお下しになったもので裁かない者、それらの者たちこそは不信仰者*なのである』（5：44）、『誰であろうと、アッラー*がお下しになったもので裁かない者、それらの者たちこそは不正*者なのである』（5：45）、『誰であろうと、アッラー*がお下しになったもので裁かない者、それらの者たちこそは放逸な者である』（5：47）、『ユダヤ教徒*もキリスト教徒*も、あなたが彼らの宗教に従わない限り、あなたに満足することは決してないであろう』（2：120）がある。アッラーが下されたものへ戻ることは、根本の明瞭さを守り、人々を満足させることを、真理の代わりにしない。共同体をその導きから遠ざけたい者は、改変されていない啓典から、共同体を離そうとする。\nそして文脈は、『私たちはこのクルアーン*を信じないだろう』と語る高慢な者の声から、主のもとで立ち止められる状態へ移る。『もしあなたが、不正*者たちがその主*の御許で（清算のために）拘留され』。アラビア語で、もし見たなら、という条件に続く答えが省かれることは、目にすれば、どれほど恐ろしいものを見るだろうかと、心に思い描かせる。かつて人々を立ち止め、圧迫し、信仰者の礼拝を妨げていた者が、今度は自分が立ち止められ、問われる。『彼らを止めよ。実に彼らは（現世での言動について）、問われる者たちなのだから。[1]』とあるとおりである（37：24）。\nここには、虐げられた者への安心がある。自分では押し返せなかった行為は、失われない。アッラーが被造物を集められるとき、横暴な者が、いつまでも指図する側にいるわけではない。ここでの不正な者たちには、高慢な者たちと、自ら選んで従った者たちの両方が含まれる。前者は他者に不正を行い、後者は虚偽に従うことを受け入れて、自分に不正を行った。\nクルアーンには、指導者と追従者の対話が繰り返し現れる。人々には、指導する力を持つ者と、従うことを選ぶ者がいるからである。指導者は、その力を導きにも、迷わせることにも使える。フィルアウンと、ともにある者たちについて、『われら*は彼らを、業火へと招く先導者とした』と仰せられる（28：41）。少数が、財産と発言の場を使って、大きな群衆を支配し、望む方向へ向けることもある。しかし、従うことによって、考える務めがなくなるわけではない。\n雌牛章では、従う関係が際立つ。『（それは、シルク*において）従われた者たちが、懲罰を目の当たりにして（彼らに）従った者たちを見捨て、彼らの関係[1]が断絶される時。[2]』（2：166）。論証の代わりに、ただまねて従うことの危険へ、目が向けられる。一方、ここでは、高慢な者と弱い立場に置かれた者という表現が繰り返され、従われる側の力と財産が、その人々への服従とどうつながるかが現れる。\n『お互いに（譴責の）言葉を返し合う』は、互いに非難を投げ返す様子を描く。利益によって結ばれていた関係が、争いへとひっくり返った。イブラーヒームの、『本当にあなた方は、現世における自分たちの間の愛情ゆえ[1]、アッラー*をよそに彫像を設けて（崇めて）いる。やがて復活の日*には、あなた方はお互いを否定し合い、お互いに呪い合う[2]のだ』という言葉にも似ている（29：25）。利益のために助け合い、従う者は、金を得るために、真理とその人々を傷つけたり、疑念を広めたりしていた。長い沈黙の後、ついに口を開く時が来たが、その時には、行動できる時期が過ぎていた。\n高慢は、人々の上へ立とうとすることだ。それは、連れ回されることを受け入れる人々の服従によって、力を得る。この場面で弱い立場に置かれた者たちは、虚偽に否と言わない弱い者として、ほかの人に扱われることを受け入れた。選ぶ力を、すべて奪われていたのではない。こうして、双方の見方がゆがんだ。高慢な者は、自分を人々より上と見なし、従う者は、自分には見直したり反対したりする資格がないかのように、低く見なした。\n前者の醜さを身近に示すのが、『あなたの頬を（高慢さから斜に構えて）人々に向けてはならず』という禁止である（31：18）。高慢から顔をそむけることが、ラクダの首を傾かせる病にたとえられる。高慢な者が飾りと思う姿は、完全さを示すのではなく、欠点を示している。それに対するもう一方の姿は、不正を前に黙ることに慣れ、心の中でも否定しなくなってしまう追従者である。弱い者が傷つけられたり、盗みが行われたりしても、自分には関係ないかのように通り過ぎる。受け入れと沈黙を見出すたび、不正な者の大胆さは増す。\n『もしあなた方がいなければ、私たちは信仰者だったのに』という言葉は、その人々への畏怖が、どれほど深く根づいていたかを明らかにする。訳文の「もしあなた方がいなければ」は、信仰しなかったことを、彼らがいたことと結びつける。その存在だけで、すでに障壁だったかのようである。彼らの策略について追従者が明言するのは、これからの対話である。\nこの意味を自分に当てはめる一つの道は、「もしこれさえなければ」という言葉の後に、どんな言い訳を置いて、善いことを先延ばしにしているかを振り返ることである。仕事、子供、誘惑、境遇。それらを、夜の礼拝、施し、力を尽くすことへの覆いにしてしまうことがある。それらがなくなれば何をするかと考え続け、それらがあっても何をできるかを探さない。\nサラフスィーは、拘禁されながら『المبسوط』を口述した。その伝記には、井戸の中から口述し、学生たちが上で書き留めたという話が伝えられる。自由を奪われても、人々に益を与えることは途切れなかった（クルシー『الجواهر المضية』、サラフスィー伝〔講義での参照：第3巻78頁〕；エジプト・ファトワー庁による同伝。拘禁中の口述と、後に続けた完成までの経過は区別される）。イブン・アルカイイムは、旅のさなか、手元に本がない状況で、『زاد المعاد』の言葉を書いた（同書、著者序文。後の全巻のすべてを、その一度の旅で書いたという意味ではない）。イブン・タイミーヤも、獄中で、クルアーンの意味について多くを書いた（イブン・アブドゥルハーディー『العقود الدرية』、著作についての記述）。障害は、力の尽くし方を変えることはあっても、その意志まで断つとは限らない。\n妨げがある中でも、呼びかけの道は多様だった。預言者の生涯には、マッカでの呼びかけ、ターイフへ出かけたこと、マディーナへの移住があり、教友たちにはハバシャへの移住があった。一つの道が閉じたことで、伝えることが終わったのではない。すでに試した手段だけで、努めることを止めもしなかった。フダイビーヤの伝承では、交渉の中で、彼らが拒むなら、自分の命を捧げるまでこの務めのために戦う、という意味を述べている（ブハーリー2731–2732）。この言葉は、その条件のある場面に置いて理解する。\n確かに立つ、あらゆる姿の背後には、結果だけに感心する人には見えない、努力の道がある。殉教者の位や吉報を望み、人々に、よい最期だったと語られることを望みながら、その望みへ至る道を尽くしたくはない、ということがある。『あなた方は、確かに（ウフドの戦い*以前には、殉教による）死を望んでいたのだ。それ（死）に直面する前には。そして確かに、あなた方はそれをまざまざと、目の当たりにした。[1]』と仰せられている（3：143）。この節は、他者がいることに責任を結びつける心を、今、自分で真実に選び、力を尽くすことへ戻す。やがて、自分が従った者について後悔する日が来る前に、である。\n\n第32節\n\n高慢だった者たちは、抑圧されていた者たちに言う。「一体、私たちがあなた方を導きから阻んだというのか？あなた方のもとに、それが到来した後に？いや、あなた方は（自ら不信仰を選んだ）罪悪者だったのだ」。\n\n高慢な者たちは、自分たちだけが、従った者の責任を負うことを受け入れず、導きが届いた後に、それを妨げたのは自分たちなのか、と問い返す。あなたがたにも、自分たちの招きに応じた意志があった。従うことに、自分の欲望や利益に合うものを見出していた。だから、『いや、あなた方は（自ら不信仰を選んだ）罪悪者だったのだ』と言うのである。\nその答えが述べられることは、彼らの策略を無罪にすることではない。次の節で、その策略は明らかになる。しかし、虚偽を飾って見せる者がいたからといって、その飾りを受け入れた者の選択までなくなるわけではないことを示している。同じ人々のそばには、真理の呼びかけを聞いて応じ、危害に耐えて踏みとどまった者たちもいた。ある程度、状況が共通しても、応じ方は違った。この違いは、指導者がいたことだけで信仰が妨げられた、という全面的な言い訳の、根拠のなさを明らかにする。\n『あなた方のもとに、それが到来した後に』という言葉は、重く響く。導きは、隠された報せのままではなかった。届いたうえで、彼らは、それに反する方を選んだ。心に信仰が深く入ると、その力は、相手の手にある財産では量れない。ヘラクレイオスとアブー・スフヤーンの対話では、使徒に従うのは、有力者か、弱い者たちか、と問われた。アブー・スフヤーンは、弱い者たちが従い、その数は増え、入信した後に宗教に不満を持って離れる者はいない、と答えた。ヘラクレイオスは「信仰とはこのように心の奥深くに入ったならば決してそれは揺らぐことはない。」と語った（ムスリム1773a〔並行伝承〕、ブハーリー7〔講義〕）。講義の挙げるブハーリーの言葉は、さらに信仰の喜びが心に交じり合うという意味を含む。\nここから、妨げる二つの道が分かる。導きを、人々へ届かせないことと、人々を、導きへたどり着かせないことである。前者は、それを担う者を狙う。『不信仰に陥った者*たちがあなたを拘束したり、殺害したり、（故郷から）追放したりするために策謀していた時』と仰せられる（8：30）。「あなたを拘束したり」は拘禁することを意味し、ここには、拘禁、殺害、追放が挙げられる。後者は、欲望、無益な言葉、疑念によって、聴衆の耳と心をふさぐことである。『このクルアーン*には耳を傾けず、それ（読誦）に対して戯言を言って（邪魔して）やれ[1]。（それによって読誦を阻み、）あなた方が優勢となるように』と言ったようにである（41：26）。彼らは、人が、考え、受け入れるために聞くことを妨げようとする。アッラーへ心を向けた人の心は、彼らには所有できないからである。\n『アッラー*が不信仰者*たちに、信仰者たちに対する（勝利の）道をお授けになることはない』という言葉（4：141）の解釈の一つには、この、心に対する支配に関わる面がある。しもべたちの心は、アッラーの支配のもとにある。預言者は「アダムの子孫の心は全て慈悲深きお方（アッラー）の二本の指の間にある一個の心（注）のようなものである。\nそれで彼は自在にそれを変えることが出来る。」と知らせた（ムスリム2655）。人間のあり方にたとえて説明するものではない。高慢な者に、自ら独立して、導きにしがみつく心から、その導きを奪い取る力があるわけではない。\nこれは、先にイブリースについて述べられたことへ戻る。アッラーは、彼の強制する支配力を否定された。イブリースも、従った者たちに、自分は招き、彼らが応じたのだと語る。同じように、追従者は、悪魔の誘惑や、高慢な者の招きを、自分の責任をなくす言い訳にはできない。『私たちは、あなた方を（正しい道から）逸脱させた。本当に私たちは、誤った者たちであった』は、迷う者と、その迷わせる働きを受け入れた者とが、一緒になる姿を描く（37：32）。力の強弱の位置は違っても、それぞれが、自分のしたことの責任を担うのである。\n\n第33節\n\nそして、抑圧されていた者たちは高慢だった者たちに言う。「いや、私たちがアッラー*を否定し、かれに（崇拝の）同位者を置くよう、あなた方が私たちに命じていた時、（あなた方の）夜と昼の策謀が（私たちを破滅させたのだ）」。そして懲罰を目の当たりにする時、彼らは（余りの恐怖ゆえ）後悔の念を露わに出来ない[1]。また、われら*は不信仰だった者*たちの首に、枷を縛り付ける。一体彼らが報われるのは、自分たちが（現世で）行っていたこと（によるもの）以外の、何ものでもないのではないか？\n\n追従者たちは、高慢な者が隠そうとしたことを明らかにして答える。あなたがたの招きは、通りすがりの一言ではなかった。背後には、『（あなた方の）夜と昼の策謀』があった。止むことのない計画と、人々を導きから遠ざけるための支出である。追従者の中には、その内側を見ていた者もいた。何が計画され、何が費やされるかを知りながら、恐れて黙っていたり、渡される金から利益を得たりした。指導者たちは、自分たちの答えが示唆するように、迷わせたことから潔白ではない。従った者たちも、その訴えが示唆するように、自分の選択から潔白ではない。責め合う中で、二つの罪が明らかになる。\n疑念を広げ、欲望を刺激する発言の場や手段が用いられることで、策略は広がり、夜も昼も、一つながりに働く時間になる。ここには、信仰者たちに、必要とされる努力の実情へ目を覚まさせるものがある。仕事で昇進し、もっと楽に過ごしたいと願う人がいる一方、虚偽の指導者たちは、権限が広がるほど、力を尽くし、計画することを増している。イブリースも、『彼は申し上げた。「彼らが蘇らされる日まで、私に猶予をお授けください』と願った（7：14）。静かに休む時間が欲しかったのではない。誘惑する仕事を続けるためだった。\nその人間への関わりは、生まれたときから始まる。伝承には、新生児への悪魔の接触と、マルヤムとその子の例外が述べられる。その後、アブー・フライラ自身が、マルヤムの母の、『実に私は、追放された[2]シャイターンに対し、彼女とその子孫へのあなたのご加護をお祈りします』という祈りを根拠として挙げた（3：36；ブハーリー3431）。長い時間にわたる敵意であり、それぞれの状態に入口を見つける。\nこの働きをまとめる目的は、『私たちがアッラー*を否定し、かれに（崇拝の）同位者を置くよう、あなた方が私たちに命じていた時』という言葉で明らかになる。「同位者」と訳されたアラビア語は、アッラーだけの権利であることに、人々が、かれに並ぶものとして置く対象を指す。策略は、主を知ることと無関係な、一つの罪で止まらない。信条と神の唯一性を損なうところに及ぶ。ジンたちが真理を知ったときの、『私たちの内の愚か者[1]が、アッラー*に対して（真実から）逸脱したこと[2]を言っていたということ』という言葉にも似ている（72：4）。アッラーについて受け取っていたことが、間違っていたと分かったのである。\n伝承が示す誘惑の入口には、起きたことの後で、定めに不満を向けることがある。預言者は「なぜならばこの種の「もし」という言葉は悪魔の仕業に道を開けるからです。」と教えられた（ムスリム2664）。経験を活かすことから、アッラーへの委ねを壊す不満へ移ってしまう。これは、あらゆる仮定の言い方を、禁じているという意味ではない。\n女性が外出する際に、悪魔が狙う誘惑も、入口として挙げられる。ティルミズィーが良好と評価した伝承は、女性を、覆い守るべきものとして述べ、外へ出ると悪魔がそれを狙い、誘惑の機会とする、という意味を伝える（ティルミズィー1173。本人の評価は「良好でガリーブ」であり、後の評価には相違がある）。悪魔は、よいものに飾る入口を見出せる、誘惑の場を待ち受ける。\n市場もその一つである。サルマーンは「出来る限り市場に最初に入りそして最後にそこから出る者にならないように。\nそこは悪魔の戦場である。\nそこに悪魔は彼の旗を揚げている。」と語った（ムスリム2451）。さまざまな入口があることは、誰に対しても同じ一つの状態を使うのではなく、生涯のどの段階も、誘惑せずにはおかないことを示す。\n講義が、幼い子供への教育における、神の唯一性を損なう例として挙げるのは、子供向けの物語に、風、糧、その他の宇宙の事柄を支配する人物が繰り返し登場し、複数の神として示されることである。心がアッラーへまとまる代わりに、相争う主たちに囲まれて育ってしまう。年齢が幼いからといって、受け取るものが、何の働きも及ぼさないわけではない。繰り返し目の前に示される意味の像は、その子の物の見方を形作るものの一つになる。\nまた、アッラーの御名や属性を取り、想像上の、かれの行為に張り合うような登場人物の称号にすることも、この問題に含められる。育てる者には、その心へ届くものに気を配る必要がある。何の意味もない娯楽だとして、扱ってしまわないことである。大人、思春期の者、男性、女性には、それぞれの関心に合う別の形もある。共通するのは、人々を啓示から遠ざけようとすることだ。\n『（あなた方の）夜と昼の策謀』の特徴はここにある。『私たちはこのクルアーン*を信じないだろう』と言って立場を表明し、その後は休んだのではない。他者も遠ざけるために働いた。クルアーンが導きであると真実に語る者も、ほめたたえるだけで、その後、それを教え、広めることをやめてはならない。\nクルアーンは、虚偽の側にも苦労があると示した。『あなた方が苦しかったとしても、本当に彼らも、あなた方が苦しむように苦しんでいるのだから。しかもあなた方は、彼らが期待してはいないもの[1]をアッラー*から期待している』（4：104）。苦しむのは信仰者だけではない。それでも信仰者は、相手の持たない希望を担っている。目的と報いへの期待が、忍耐し、力を尽くすことを助ける。\nやがて議論は、言葉の向こうにあるものへ至る。『懲罰を目の当たりにする時、彼らは（余りの恐怖ゆえ）後悔の念を露わに出来ない[1]』。追従者は、従った相手と、言葉を聞かなかった助言者について後悔する。従われた者は、高慢から招いたことを後悔する。高慢な者たちは、追従者の前で、揺らがない姿を保つために、後悔を隠すとする解釈がある。また、懲罰の恐ろしさに圧倒され、胸の内を表すことができなくなる、とする解釈もある。この場面で後悔を隠すことは、別の場面で後悔が現れることを妨げない。状況は移り変わり、それぞれが、恐ろしさの一面を明らかにする。\n懲罰を目にすれば、責任をなすりつけ、呪い、逃れようとしても役に立たない。『われら*は不信仰だった者*たちの首に、枷を縛り付ける』とある。首枷は、首につけ、引かれて行くための拘束である。その姿を考える一つの意味は、この世で、自分の理性を引き回されることを受け入れ、真理に反するものが見えていても、調べず、問わずに従った者に、この報いが対応することだ。\n見分ける力を働かせない例として、アラブの人々に、言語の知識と見分ける能力がありながら、ムサイリマの偽りの主張に従ったことが挙げられる。妨げは、いつでも、判断の道具を持たないことにあったのではない。従属を受け入れたことにあった。ただし、このつながりは、懲罰を追従者だけに限るものではない。指導者も、応じた者も、不信仰という記述の中に含まれる。\nこの節は、『一体彼らが報われるのは、自分たちが（現世で）行っていたこと（によるもの）以外の、何ものでもないのではないか？』と、公正さへ戻して結ばれる。見たものは、自分たちの行いの結末であり、押しつけられた不正ではない。誰かにすべての責任を投げれば、逃れられる争いでもない。\n\n第34節\n\nわれら*が警告者を町に遣わした時には決まって、その（町の）贅沢者たちは（こう）言ったものだった。「本当に私たちは、あなた方が携えて遣わされたものを認めない者である」。\n\n来世で、高慢な者たちと弱い立場に置かれた者たちとの争いが明らかになった後、文脈は、この世での、その関係の始まりへ戻る。使徒たちの拒絶の先頭に立ったのは、ぜいたくに暮らして思い上がる者たちだった。弱い者たちの多くは、日常生活で彼らに従うように、拒絶においても従った。ここで答えが、その恵まれた者たちの口に置かれるのは、誰が争いを導き、誰が後についていったかを明らかにするためである。\nこの章では、高慢な者と弱い立場に置かれた者という表現が際立つ。一方、雌牛章の場面には、『（それは、シルク*において）従われた者たちが、懲罰を目の当たりにして（彼らに）従った者たちを見捨て』とある（2：166）。ここでの表現の選び方は、従属が生まれることに、高慢がどのように関わるかを明らかにする。\n『われら*が警告者を町に遣わした時には決まって、その（町の）贅沢者たちは（こう）言ったものだった』という形は、預言者たちの呼びかけに繰り返されたあり方を示す（34：34）。他者の上に立つことで利益を築いた、ぜいたくな者たちは、使命が、自分たちの影響力を変えることを恐れる。公正さ、権利における平等、ザカートの支払い、そのほかアッラーが財産について命じた務めを求められるため、人々が導かれることを、自分の地位への脅威と見なすのである。\nここでの「その（町の）贅沢者たち」に当たる語は、金持ちなら誰でもという意味ではない。恵みによって、他者に高ぶるようになった者である。恵まれた状態にされた者、という語の形には、恵みを与えられたのだということ、その豊かさを広げたのはアッラーであることを思い起こさせる面がある。感謝するべきところで、それを、恵みの主に逆らう理由にした。恵みによって膨れ上がり、それで高ぶることとも説明され、先の場面で際立った、高慢という記述とつながる。\nこの語を、上唇の突き出た部分を指す「トゥルファ」と結びつける説明もある。その説明では、膨らんだ姿が、財産の持ち主が感じる、他者より上だという感覚を身近に思い描かせる。ただし、この語源の結びつけ方には、言語学者の中にも異論がある。\n彼らは、財産と人々へ届く手段を所有するため、呼びかけをゆがめて見せ、その疑念を広めるために費やすことができる。『本当に不信仰に陥った者*たちは、アッラー*の道を阻むべく、彼らの財産を費やす。彼らはそれを費やすであろう。やがてそれは彼らにとっての悲痛となり、それから彼らは打ち負かされるのだ』と仰せられる（8：36）。真理に抵抗するための出費が大きいことは、論証が強い証拠ではない。財産を使いながら、悔しさしか得られないこともある。使徒へ向ける攻撃も、『また、あなたのため、あなたの名声を高めてやった。[1]』という、アッラーが使徒を尊ぶことを消せない（94：4）。\n「その（町の）贅沢者たち」という表現は、どの社会にも、力を及ぼす者たちがいることを示す。ここでの町は、人々の集まりを指し、行政上の村という意味だけではない。『われらはいかなる町においても、その罪悪者たちを（町の）有力者とした。（それは）彼らがそこで、策謀するためである』という言葉にも似ている（6：123）。彼らは、決定する場所、人々に必要な市場、暮らしを左右する利害など、力の要所へ向かう。金や鉄の市場を支配すること、価格を知らない者を利用すること、力のある者が、人々の手続を進めるかどうかを握ることにも、その姿を見ることができる。\n他方で、「町に遣わした」という表現は、使命が、社会の暮らしの中へ入ることにも目を向けさせる。呼びかける者は、人々が生活し、やり取りするところへ啓示を担って行く。人々の必要から離れたところにいるだけで満足しない。「あなた方が携えて遣わされたもの」という表現も、この意味を近づける。使命は、その呼びかけの中で使徒たちとともにあり、市場、集まり、生活全体にある逸脱へ向き合う。昼も夜もの策略が、社会のさまざまな層へ広がったように、呼びかけも、その層へ届く必要がある。\n「警告者」が挙げられるのは、恵みに気を取られ、強く背を向ける民にふさわしい。自分たちの状態の結末について、目を覚まさせる者を必要としている。多神崇拝者への論証の中で、「言え」という命令が続いた後、彼らの答えは、遣わされたものを信じない、という全面的な拒絶となる。もたらされたものの全体を拒み、その意味を崩す論証を示さない。\nサーリフの民の、『高慢だった者たちは言った。「私たちこそは、あなた方が信じたものに対する否定者である』という言葉にも、似た高ぶりが現れる（7：76）。弱い者たちが真理を受け入れたこと自体が、高慢な者たちには、それをさらに意地になって拒む理由にさえ、なっているかのようである。\n\n第35節\n\nまた、彼らは言った。「私たちは財産も子供も（あなた方）より多いし、私たちは（現世でも来世でも、）罰される者などではない」。\n\nぜいたくによって思い上がる者たちは、不信仰を表明するだけでは満足しなかった。弱い立場の者たちを、自分たちの支配の下にとどめる疑念を投げかける。自分たちは財産と子供が多いのだから、罰せられない、という言い分である。来世で指導者たちが追従者を見捨てる光景は、その指導者への信頼を揺らがせ得る。そのため、高慢な者には、依存を新たにする何かが必要になる。\n彼らの力は、助ける者たちによって成り立つ。フィルアウンも、兵士によって暴力を振るった。離れていけば、被造物の弱さが明らかになる。しかし、アッラーの支配は、誰の助力にもよらない。『「今日、王権は誰のものか？」（かれは、自らお答えになる）。「唯一*かつ君臨し給う*アッラー*にこそ、属するのだ[2]』という呼びかけの答えは、ただかれに属する（40：16）。\nぜいたくな者たちの疑念は、人々に見える事実、つまり多くを所有していることから始まる。そして、それでは示せないことを、その上に築く。多く与えられているのだから、自分たちの方が正しく、アッラーに近く、懲罰から安全だ、という結論である。誤りはここにある。前提が正しくても、結論は誤っていることがある。力、産業、財産で優れている者が、それらをあまり持たない者より、必ず信条も正しいということにはならない。この世の発展は、神の唯一性や来世についての問いへの答えではない。\nこの問題での財産の働きの強さについて、預言者は、どの共同体にも試練があり、自分の共同体の試練は財産である、と語った（ティルミズィー2336、伝承の意味）。クルアーンは、『人間というものは、その主*が彼を試練におかけになり、栄誉をお授けになり、恩恵を与え給うた時には、（こう）言う。「我が主*は、私に栄誉をお授けになった』（89：15）、『かれが彼を試練におかけになり、彼にその糧を控えられた時には、（こう）言うのだ。「我が主*は、私を卑しめられた」。[1]』（89：16）と、人間の見方を示した後、『断じて（、そのような考えは正しく）ない』と述べ、この物差しを退ける（89：17）。与えられることも試験であり、乏しくされることも試験である。しかし人間は、尊ばれるという言葉だけを取り、試されるという意味を置き去りにする。恵みを得たことは自分の資格の証明で、失うことは自分への侮辱だと思う。恵みで試されていると心に置けば感謝し、厳しさで試されていると知れば耐え忍ぶ。見かけの状態だけを、その人のアッラーのもとでの位への判断にはしない。\nこのため、アードの民が、使徒たちの警告へ、『誰が私たちよりも強力だと言うのか？[1]』と答えたことは、目を引く（41：15）。身体の強さが、啓示への答えが正しいことと、何の関係があるのだろう。同じく多神崇拝者たちは、御徴が読まれると、『二つの集団のいずれが、住居がより素晴らしく、会合の場がより華々しいのか？』と言った（19：73）。それに対して、『一体、われら*は彼ら以前、（彼らより）家財も容色も上回る、どれだけの世代を滅ぼしてきたであろうか』と答えられる（19：74）。彼らより立派な家具や姿を持った者たちが、すでにいた。それでも、その飾りは、滅びから守らなかった。財産に思い上がったカールーンも、『われら*は、彼とその邸宅を地面に飲み込ませた』という結末に至った（28：81）。\nこの物差しは、自分の心にも入り込み、試練にある人を見て、きっと大きな罪を犯したはずだと判断させることがある。アイユーブの伝承では、彼は十八年も試練の中にとどまり、近い者も遠い者も離れ、朝夕に訪れる二人の親しい者が残った。その一人は、これほど長く苦しみが取り去られないのだから、アイユーブは、誰も犯したことのない罪を犯したのだと、長さを根拠に考えた。話を聞いたアイユーブは、その憶測を認めなかった。そして、自分は、二人が争い、アッラーの名を持ち出すのを聞くと、その名が真実の場合にだけ用いられることを願い、家に帰って二人のために償いをした、と、アッラーへの深い尊びを語った（イブン・ヒッバーン2898、伝承の意味）。試練が長かったことは、友が思い込んだことの証拠ではなかった。アイユーブの心には、主の御名への、この大きな尊びが保たれていた。\nこの物差しへの依存は、小さなことから始まる場合もある。子供は、お金があれば欲しいものが手に入り、なければ、願いがかなわないことを知る。その結びつきが大きくなると、幸せのすべてがお金にあると思い込むことがある。この愛を整えなければ、行いと考え方の評価にまで及ぶ。金になるものはよいと考え、利益を失わせるものは、それがアッラーの定めであっても退ける。稼ぎをもたらすからと、利息や禁じられた仕事を弁護するのである。\n欲しがる気持ちが増していく姿は、預言者の「たとえアダムの息子が黄金の渓谷を所有していたとしても、彼はなお別の（黄金の）渓谷も望んだであろう。」という言葉にも描かれる（ムスリム1048c〔並行伝承〕、ブハーリー6439〔講義〕）。財産が宗教の物差しになれば、『人々の中には、アッラー*を覚束ない形で崇拝*する者[1]がいる。そして自分に善いことが起これば、それに安心し、試練が降りかかれば、顔から引っくり返（って反転す）る[2]』という状態が起こる（22：11）。イブン・アッバースはこれを、マディーナに来た男が、妻が男児を産み、馬にも子が生まれれば、この宗教はよいと言い、そうならなければ悪い宗教だと言う姿によって説明した（ブハーリー4742。イブン・アッバースによる解説）。真理を受け入れることを、暮らしを治める根本にせず、宗教を、期待する利益に従わせたのである。\nさらに、富んでいるからその人を愛し、貧しいから軽蔑するところまで及び、金貨の奴隷となることもある。預言者は、金貨の奴隷への破滅を願う、厳しい言葉を語った（ブハーリー2887、伝承の意味）。危険が明らかでも、財産のために戦うことさえある。ユーフラテス川から金の山が現れる伝承では、「その金のため、人々は相戦うが、100名のうち99名は殺される。」とある（ムスリム2894）。それでも一人一人は、助かるのは自分かもしれないと思う。財産への欲のためには、この破滅の危険も引き受けながら、アッラーのための礼拝や、力を尽くすことへ招かれると、わずかな苦労を言い訳にすることがある。何が心を支配しているかが、こうして分かる。\n自分の支配的な地位に触れる呼びかけへ、ぜいたくな者が抵抗するのも、不思議ではない。問題は、偶像の形に執着することより深い。築いた地位に仕えてしまっているのである。『忍耐*と礼拝を助力とせよ。それは、（アッラー*に）恭順な者[1]たち以外には困難なことであるが』という一節（2：45）の解釈の一つは、啓典の民の指導者たちに、使徒に従うのを妨げるものを手放すため、その二つを助けとするよう呼びかける、というものである。ここでの忍耐を、斎戒とする解釈もある。斎戒には、欲するものを控える訓練がある。許されたものを控えることに慣れれば、禁じられたものから離れる助けにもなる。また、そのことが重いという表現は、従うために、支配的な地位や高ぶりを手放す負担を含む、という説明もある。\nそれゆえ、使徒たちの呼びかけの初めに従う者の多くは、弱い立場の者たちだった。ヌーフの民は、『あなたに短絡的に[1]従ったのは、私たちの内でもまさに最底辺の者たちとしか思わない』と言い（11：27）、ヘラクレイオスがアブー・スフヤーンに「彼には人々の中でも身分の高い者達が従っているか、それとも弱い者達が従っているか？」と尋ね、彼が「彼らのうちでも弱い者達です」と答えた場面にも、それが現れる（ムスリム1773a〔並行伝承〕、ブハーリー7〔講義〕）。これは、富める者が信仰することを妨げず、財産を壊して失うよう求めるものでもない。富と指導者の地位を、真理を受け入れるかどうかの支配者にしてはならない、ということである。\nぜいたくな者たちの主張は二つあった。自分たちは多くを与えられているということと、来世で罰を受けることはないということである。こうした言い分は人々を惑わせ、誤りを説く者たちの支配の下にとどめてしまうおそれがある。ただの言い争いなら取り合わずに済ませるのがよい場合もあるが、ここでは、その言い分のどこが誤っているかを明らかにする必要がある。そこで答えは詳しく述べられる。まず誰が糧を与えるのかを明らかにし、次に何を基準にアッラーとの近さと報いが決まるのかを示す。そのうえで、財産をアッラーに従うために使うか、人々を啓示から遠ざけるために使うかで、どのような違いが生じるかを示している。\n\n第36節\n\n（使徒*よ、）言ってやれ。「本当に我が主*は、かれがお望みの者に糧を豊富に与えられ、また控えられる。しかし、大半の人々は知らないのだ」。[1]\n\nぜいたくな者たちの疑念で、まず正されるのは、手の中の財産は、アッラーが広げられた糧だということである。その意志から独立した力ではない。使徒は「我が主」と言う。自分が崇拝し、従う主こそが、相手に与えられたお方であり、誇っているものを、その人々から差し控えることもできるお方なのである。\n多く与えられていることは、救われる資格を意味しない。アッラーは、試験として糧を広げ、一瞬で取り去ることもある。人間の必要とするあり方を、特に身近に明らかにするのが、『言ってみよ、もしあなた方の水が（地下に沈んで）無くなってしまったら、一体誰が、あなた方に湧き水を与えてくれるというのか？』という言葉だ（67：30）。命を支える水が地下へ失われれば、それを現すアッラーの御力の代わりに、財産が役立つわけではない。信仰者も、二つの園の持ち主に、『我が主*は私に、あなたの果樹園よりも善いものを授けて下さ（り[1]、あなたへの恩恵は消滅させられ）るだろう。そしてかれは、天からそこ（あなたの果樹園）に懲罰を送られ給い、それはある朝、（丸裸で）つるつるの地面となってしまうだろう』と語り（18：40）、続いて、『あるいはある朝、その水は（地下に沈んで）無くなってしまい、あなたはそれを求めることが、もはや出来なくなってしまうだろう』と述べた（18：41）。\nこれは、財産の持ち主が、働き、苦労したことを否定するものではない。彼らは働き、手段を取った。しかし、その手段を生み、結果を容易にされたのはアッラーである。賜物を、かれの命令に背く根拠にしてはならない。容易になることが、背を向ける道を選んだ者を、気づかぬまま結末へ進ませる場合もある。『（財産を）出し惜しみし、（主*の褒美なしでも）十分だと主張し、』（92：8）、『最善のもの[1]を噓呼ばわりした者はといえば、』（92：9）、『われら*が彼を、困難へと導てやろう。[1]』（92：10）と仰せられるとおりである。\nこの節は、信仰者にも注意を促す。この世の原因の働きは、信条が違うというだけで止まるものではない。よい種をふさわしい土に置き、水を与えて世話をする者は、ムスリムでも、そうでなくても、発芽の原因を取っている。信仰者が、じっと座ったままで仕事の実りを待ち、努力する他者が、それを手に入れるのを不思議がってはならない。\nそれでも、原因は、アッラーの意志から独立した保証ではない。二人が似た仕事をしたからといって、糧が等しくなるとは限らない。『誰であろうと、手っ取り早いもの（現世）を望む者、われら*は彼にそこでーーわれら*が望む者にわれら*が望むものをーー、手っ取り早く授けよう[1]』と仰せられる（17：18）。何を与えるか、しもべたちの誰に与えるかは、アッラーの意志に関わる。手段を取るという、定められた物事のあり方と、アッラーの意志と英知は、ともにある。一方を、他方から切り離して理解してはならない。\nこのため信仰者には、力を尽くし、備えることが命じられる。『あなた方は彼らに対し、力と、馬をつなぎとめておくことによって、出来る限りの準備[1]をしておくのだ』とあり（8：60、該当箇所を含む訳文）、相手も苦労を引き受けていることを、『あなた方が苦しかったとしても、本当に彼らも、あなた方が苦しむように苦しんでいるのだから。しかもあなた方は、彼らが期待してはいないもの[1]をアッラー*から期待している』と思い起こさせる（4：104）。努力は求められ、糧はアッラーから来る。糧の差は、信条が正しいという証明ではない。しかし、多くの人々は、見える財産の多さと少なさで立ち止まり、この試験の実情を知らない。与えられた者は、それに思い上がり、乏しい者は、取り分が少ないことが、自分の卑しさの証拠であるかのように悲しんでしまう。\n\n第37節\n\nあなた方の財産もあなた方の子息も、あなた方がわれら*のもとでお近づきを得るものではない。しかし信仰し、正しい行い*を行う者、それらの者たちにこそ、彼らが行ったことゆえの倍の褒美があるのだ[1]。そして彼らは（懲罰から）安全な状態で、（天国の）高き住まいにある。\n\n財産が多いのは、アッラーが糧を広げられたからだと示した後、文脈は、その多さから人々が導いた、近さと救いの主張を退ける。財産と子供は、ただあるだけで、多いだけで、その持ち主をアッラーに近づけるものではない。\n訳文の「われら*のもとでお近づきを得る」という表現は、人間が所有するすべてを使って、何を求めるべきかへ目を向けさせる。主への近さであり、この世の楽しみで他者より先に立つことだけではない。天使、預言者、正しい者たちは、アッラーに最も近い位を求める。多神崇拝者たちが、アッラー以外に崇拝した者たちも、自ら、かれの喜びと近さを求めている。『彼らが（アッラー*に並べて）祈っているそれらの者たち[1]は（彼ら自身が）、いずれの者が（主*に）一番近いか、と自分たちの主*へのお近づきを求め』とあるとおりだ（17：57）。この者たちは天使と解釈され、イスラームに入ったジンたちで、以前の人々が、そのまま彼らを崇拝し続けていたとする解釈もある。どちらでも、自分と同じく、必要を持つしもべを崇拝することを、アッラーへ至る道にはできない。同じように、財産も、アッラーが喜ばれる仕方でなければ、近づく道にはできない。\n物質的に優れていることが、宗教の正しさを証明するなら、ウフドの日の多神崇拝者の勝利は、彼らの根拠となるはずである。しかし、そうではない。真理の側に、英知と試験のために敗北が起こることもあり、虚偽の側に、気づかぬまま進ませる豊かさがある場合もある。\nここで、信仰し、正しく行う者についての例外が、行動の扉を開く。富める者が、近づくことを拒まれているのではない。その人を近づけるのは、真実な信仰と、与えられたものによって行うことである。この文脈にふさわしい行動には、財産を善いことに費やすこと、子供に教え、従順さと宗教に役立つことへ育てることがある。恵みを、ただ誇る素材のままにしない。\n預言者は、多くを持つ者は、復活の日には少ない者になるが、前、右、左、後ろというように財産を費やす者は例外である、と教えた（講義の参照はブハーリー6443）。並行するムスリムの既刊訳では、施す先を「目の前に居る（貧しい）人々、後に居る人々、右に居る人々、そして、左に居る人々」と表している（ムスリム990a）。方向の多さは、費やす道の多さを身近に示す。貧しい者の必要を満たすことから、学ぶ者を助け、宗教を支えることまで、さまざまである。財産を集め、それを所有することだけで、尊ばれる証拠だと思うのではない。\nこのため、この節では、行いに対する、倍にされる報いが述べられる。財産を善いことに使えば、持ち主に、善行のさまざまな扉を開く。貧しい移住者たちは、財産を持つ者たちが、自分たちにはできない行いで先へ行ったと訴えた。預言者は、讃美、称賛、偉大さをたたえる言葉を教えた。アブー・サーリフが伝える続きでは、富める者たちも同じように行ったと、貧しい移住者たちが再び訴えた。それに預言者は「これはアッラーの恩寵であり、アッラーはそれをみ心のままに嘉し給える者に与え給う」と答えた（ムスリム595a）。力を尽くせる範囲の違いは、アッラーへの異議の場ではない。従順な行いに活かすための恵みである。\n高い部屋での安全は、主とのつながりに対応する報いである。財産だけに安心を置く人は、費やすことで、安全のもとを失うのではないかと恐れる。一方、アッラーの約束を信頼する者には、費やすことが、希望と安心を増す。前もって差し出したものが、失われないと知っているからである。こうして、多神崇拝者の疑念を退けるとともに、その自慢を聞いて影響を受けかねない信仰者を支える。持ち物が少なくても、アッラーへの信頼を失わず、多くても、費やすことを妨げられないようにするのである。\n\n第38節\n\nまた、われら*の御徴において、（嘘呼ばわりするために）ねじ伏せようと躍起になる者たち、それらの者たちは、懲罰へと立ち合わされる者たちである。\n\n御徴を妨げるために財産を費やしながら、その財産がアッラーに近づけると主張することは、筋が通らない。このため、この節は、信仰し正しく行った者と対照をなし、財産の働きを知る物差しを示す。持ち主は、何に使うのか。ある者たちは、従順な行いへの道とし、倍の報いと安全を得る。一方、ある者たちは、導きに敵対する助けとし、懲罰へ連れて来られる結末となる。財産は、全面的に善でも、全面的に悪でもない。それによる行動に応じて、働きが現れる。\n預言者の、信仰者のことはすべて善につながる、という伝承は、その鍵を示す。よいことには感謝し、困難には耐え忍ぶ。掲載訳の該当箇所は、『たとえば、なにか喜ばしいことがあってアッラーに感謝すれば、そのことで良いことが生じ、また、困難があっても忍耐すれば、そのことで良いことが生ずるのである』である（ムスリム2999、信仰者に限るという全文の文脈）。恵みが起きたことだけで、その人によいと判断するには足りない。感謝したか、恩を否定したかを見る。困難も、忍耐で受け止めたなら、その人への悪とは限らない。\n救われること自体が、試験となる場合もある。『そこには、あなた方の主*からの偉大な試練があったのだ』について（7：141）、イスラーイールの子らを救い、フィルアウンから解放したことにも、恵みの後にどのように行うかを明らかにする試験があった、とする解釈がある。彼らは海を渡った後、偶像に仕える人々を見て、『ムーサー*よ、彼らに神々[1]があるように、私たちにも神（の偶像）を一つ、こしらえてくれ』と言った（7：138）。救われたからといって、恵みを与えるお方への、悪い応じ方をしなくなったわけではない。すでに、『あなた方の主*は恐らく、あなた方の敵を滅ぼし、あなた方を（エジプトの）地における継承者[2]とされ、あなた方がいかに行うかをご覧になるであろう[3]』と告げられていた（7：129）。大切なのは、与えられ、力を得た後に、人が何をするかである。\nこの節の「躍起になる」に当たるアラビア語の現在形は、5節の「躍起になっていた」に当たる過去形と対照をなし、更新され続ける努力を描く。財産や影響力を見出すたび、妨げるために動かす。昼夜の策略の続きであり、章の初めの、『われら*の御徴において、（使徒*とクルアーン*を嘘呼ばわりするために）ねじ伏せようと躍起になっていた者たち』と対応する（34：5）。「われら*の御徴において」という表現には、啓示の細部や定めを狙うことが見える。宗教という表題への反対だけに限らず、神の唯一性という根本から、礼拝やスンナまで広がる。\n「ねじ伏せようと」に当たる「معاجزين」は、アッラーを出し抜き、その命令の実現を阻めると考える姿を描く。また、アリフを用いずジームを強める「مُعَجِّزين」という朗誦も伝えられ（イブン・アルジャザリー『النشر في القراءات العشر』、ハッジ章）、信仰者をくじこうとすることや、呼びかけが無力であるかのように見せることが、その意味として挙げられる。しかし、逃れられるという思い込みに対し、連れて来られるという言葉が向き合う。彼らは捕らえられ、懲罰へ運ばれる。策略も、多くの助け手も役立たない。\nジンたちも、『私たちが地上で、アッラー*（がお望みになったこと）から逃れることも（出来）なく、（天へと）逃亡してかれから逃れることも（出来）ないことを確信した、ということ』と認めた（72：12）。また、『一体、悪行[1]を行う者たちは、われら*を出し抜けるとでも思ったのか？彼らの判断することの、何と忌まわしいことか？』と仰せられる（29：4）。アッラーが与えたものを、御徴に抵抗するために費やす者は、恵みを、自分の救いの根拠にしたのではない。その悪い使い方を、自分の不幸の原因にしたのである。\n\n第39節\n\n（使徒*よ）言ってやれ。「本当に我が主は、その僕たちの内、かれがお望みの者に糧を豊富に与えられ、また控えられる[1]。そして、あなた方がどんなものでも（アッラー*に命じられたことに）費やせば、かれはそれを（褒美で）継がせ給う[2]。かれは、最もよく糧を授けられるお方」。\n\n糧はアッラーの支配のもとにある、と宣言する命令が、再び現れる。報いについて詳しく述べた後の繰り返しは、ただ同じ言葉をもう一度言うことではない。説明を増している。\nその意味の一つは、最初の節が、賜物の多さに思い上がる多神崇拝者たちに向き合ったのに対し、ここでは、信仰者たちへ目を向け、支え、費やすことへの準備を整えるというものだ。「その僕たちの内」という付加には、しもべであることを尊ぶ意味があり、「また控えられる」に当たるアラビア語には、前の36節とは異なり、その人との関わりを示す語が添えられている。訳注[1]が参照する36節の注は、豊かさも貧しさも試練であり、それだけではアッラーの寵愛や憎悪を示さないと説明している。信仰者は、主から切り離された者のように、糧の広がりと乏しさを見ない。どちらでも、主が心を配られることを思い起こす。\n豊かさは、従順な行いの助けとなる場合がある。乏しくされることも、誘惑から守り、忍耐によって位を高める慈しみとなる場合がある。この関わりを考える意味の一つは、初めは嫌だったとしても、乏しさが、その人のため、その人の益のために起こることもあるということだ。\n船を傷つけることは、最初、害に見えたが、後に、それによって守られたことが明らかになった。少年の話にも、両親への慈しみがあった。ヒドルは、船について、『私はそれ（船）を傷物にしようとしたのだ。というのも彼らの行く手には、（正常な）あらゆる船を強奪する王がいたから』と語り（18：79）、少年について、『その両親が信仰者だったので、私たち[1]は彼が、二人（両親）にひどい放埓さと不信仰を強いること[2]を恐れた』と述べた（18：80）。初めに信仰者を悲しませることが、すべて、その人への慈しみを欠いているわけではない。\n聖伝には、しもべが自発的な礼拝によって近づき、アッラーがその人を愛されること、求めれば与え、守りを求めれば守るという約束が述べられる。それでも、信仰者の嫌う死は起こる。その人は死を嫌い、アッラーは、そのしもべに苦痛を与えることを嫌われる、という意味が語られる（ブハーリー6502、聖伝の意味）。見守られることは、嫌なことのすべてを起こらなくしてもらうことと同じではない。与えられるときも、差し控えられるときも、主を信頼するのである。\n別の見方では、二つの節の違いは、最初の節が、人と人との間の糧の差を示すのに対し、後の節が、同じ人の状態の変化を示すことにある。広げられていた者が、その後、乏しくなることもあり、乏しかった者が、豊かになることもある。この見方では、繰り返しは、多神崇拝者には、保つ力のない状態に思い上がらないよう戒める。一方、信仰者には、できる間に進んで費やすことを促す。やがて、費やしたくても見出せない時が来る前に、である。\n二つの見方は、財産への隷属から心を自由にするところで合流する。ぜいたくに思い上がる者の目的は、『私はあなたよりも財産が沢山あるし、もっと強い衆がついている』と言うことであったり（18：34）、多さを競うことに没頭したりすることだ。信仰者は、持つものを、アッラーへ近づくために、どう使うかを問う。\nこれは、普段の家族への支出にも及ぶ。預言者は「アッラーからの褒美を期待して家人に費やすのならば、それは彼にとってのサダカ（施し）となる。」と教えられた（ブハーリー55〔並行伝承〕、5351〔講義〕）。アッラーの喜びを求める支出には、妻の口へ運ぶ一口に至るまで、報いがあるとも教えられた（講義の参照はブハーリー56）。並行するムスリムの日本語訳では、この一例を「あなたの妻の口に一ちぎりのパン切れを入れること」と表す（ムスリム1628a）。力を尽くすことを、大きな額や、一種類の善行だけに狭めない。\n何かを費やすという、広い表現には、持ち主のできる、わずかなものも含まれる。貧しい人々の中には、自分の労力しか見出せず、働いて得たものを施す者もいた。それでも、偽信者の嘲笑を免れなかった。『自分たちの能力分しか（施し物を）見出せない（貧しい）者たちのことをけなし、彼らを嘲笑する者たち[1]。アッラー*が、彼らのことを嘲笑された[2]』という節が、その人々について下された（9：79）。人々には小さく見えても、背後にある真実さと努力によって、大きなことがある。\n次に、埋め合わせるという約束が、アッラーに結びつけられる。減ることへの恐れを感じる人を、安心させるためである。埋め合わせは、出したものと同じ種類であったり、元より多い金額として現れたりするとは限らない。祝福、健康、災いを除かれること、アッラーのもとでの位である場合もある。必要なのは、約束を信頼することであって、自分が選んだ形の代償を、アッラーに要求することではない。\n見かけの計算だけで立ち止まれば、施した者は金が減り、利息を扱った者は増えた、と見えるかもしれない。しかし、『アッラー*は利息を根絶やしにされ、施し（の褒美）は増幅させられる』と仰せられる（2：276）。施しが育ち、利息が失われることは、目先の数字を見るだけでは把握できない実情である。『彼らは、現世の生活の上辺のことは知っている。実に来世に関しては、まさしく無頓着な者たちなのだが』という者たちの限界が、ここから理解できる（30：7）。増減の表面は知っていても、その行いの後に、アッラーのもとで何があるかを忘れている。\n最もよく糧を与えるお方という結びは、埋め合わせを約束したお方の英知へ、安心するよう招く。子供が、よい贈り物を約束する、誠実な父親を信頼するときは、贈り物の詳細を知らなくても安心する。アッラーには、最も高い譬えがふさわしい。必要を知り、よく与えられる主の約束なら、なおさらである。\n助け手が少なく、必要が大きいとき、力を尽くすことの価値は増す。『あなた方の内、（マッカ*）開城[2]の前に費やし、（不信仰者*たちと）戦った者は、（褒美において）同等ではないのだぞ。それらの者たちは、（マッカ開城*の）後に費やし、（不信仰者*たちと）戦った者たちより位が偉大なのだ[3]』と仰せられる（57：10）。ワラカ・ブン・ナウファルが、預言者の民が彼を追い出すときに、若く強い者として助けたいと願ったことも、この意味につながる。掲載訳には、『ああ、もしも私があなたの活動時期に若者であり、またもしも人々があなたを追放する時私が生きておれば、お役に立つであろうに！』とある（ブハーリー3で語られる場面。ここでの掲載日本語は、ムスリムの並行する初啓示の伝えによるもので、ブハーリー全文の同一訳ではない）。\nこうして啓示は、財産を、自慢の材料から、しもべとして生きるための手段へ変える。そして、読者を、再び集められる場へ移す。人々が頼っていたものの結末と、行いの何が残るのかを見るためである。\n\n第40節\n\nかれ（アッラー*）が彼ら（シルク*の徒）全員を招集され、それから天使*たちに（こう）仰せられる日のこと（を思い起こさせよ）。「一体これらの者たちは、あなた方（天使*たち）のことを崇めていたのか？」[1]\n\n文脈は、人々が持ち物に思い上がる姿から、皆が集められる日へ移る。導いた高慢な者も、従った弱い立場の者も、取り残されることはない。前の場面では、指導者が追従者を見捨てることが明らかになった。ここでは、多神崇拝者たちが仲介と執り成しを望んで頼っていた、崇拝対象の側が、その関係を認めないことが明らかになる。従った主人へ、あるいはアッラーを差しおいて頼った被造物へ、責任を移しても、崇拝した者は救われない。\nアッラーは、その人々に聞こえるところで、天使たちに、彼らはあなたがたを崇拝していたのかと尋ねられる。ご存知でないことを知るための問いではない。真相を示し、論証を立てるためである。多神崇拝者たちは、アッラーに近いと自分たちが称していた天使たちから、自分たちの崇拝を認めないという言葉を聞く。\nイーサーへの、『一体あなたは人々に『アッラー*とは別に、私と私の母親も二つの神[1]とせよ』などと言ったのか？[2]」彼は申し上げる。「あなたに称え*あれ。私は、自分に権利がないようなことを言うはずがありません』という問いと、その答えも、同じようなものである（5：116）。このような場面の移り変わりによって、この章の論証は、来世とつながり続ける。問題は、集まりが終われば終わる、議論の勝ち負けではない。アッラーが、その人と、その人が従い、崇拝した対象を集められるとき、一人一人が結末に向き合う選択なのである。\n\n第41節\n\n彼ら（天使たち）は申し上げる。「あなたに称え*あれ。彼らは無関係で[1]、あなたこそが私たちの庇護者*です。いえ、彼らはジン*[2]を崇めていました。彼らの大半は、彼ら（ジン*）のことを信じて（従って）いたのです」。\n\n天使たちは、アッラーがあらゆる不完全さから無縁であることを示して答え始め、ただかれだけを守護者とすることを確認する。多神崇拝者たちの崇拝を認めず、その人々を親しい守護者とすることもない。主を必要とし、そのしもべであることを明らかにする。\nその答えには、細やかに目を向けられる点もある。否定する文脈であっても、崇拝を自分たちに結びつける言い方を先にしなかった。自分たちは崇拝されなかったと言う代わりに、まず、アッラーがあらゆる不完全さから無縁であると宣言し、かれを守護者とすることを示し、その後に、民の逸脱の実情を説明したのである。\nジンを崇拝していたという部分には、二つの解釈がある。一つは、実際にジンを崇拝していたが、天使たちの尊さと、多神崇拝者たち自身が従っていたジンの行く末を見て、自分たちは天使を崇拝したのだと主張した、というものだ。天使たちは、その嘘を明らかにした。もう一つは、ジンたちが、天使や偶像を崇拝することを魅力的に飾り、誘っていたため、そのシルクに従うことは、たとえ対象を別の名で呼んでも、実際にはジンを崇拝することだった、というものである。\nある多神崇拝者たちは、偶像に女性形の名をつけ、そこに天使が宿ると思い込み、その崇拝を、アッラーのもとで仲介してもらう道にしようとした。背後には、子供や勝利など、この世で欲しいものを得たい思いや、崇拝対象が執り成してくれるので、従順に生き、悔い改める務めを免れられる、という思い込みがあった。\nここで考えられる意味の一つは、弱さを感じることが、従属を受け入れることに及ぼす働きである。恐れを預けられる力を探し、弱い者は高慢な者へ、その高慢な者は財産や助け手へ頼り、また別の者はジンへ逃れる。谷に泊まると、その谷のジンの主に守りを求めた人々もいた。どれも、力を示しているようでも、被造物が必要を抱えることを明らかにしている。\n勝っている者に目を奪われ、敗北感からまねることにも、この意味が表れる。独立して考えれば、よいと思わないものまで、その人々から取り入れてしまう。しかし、アッラーから与えられた能力を持つ天使たちは、アッラーを自分たちの守護者とする。そこに、正しく身を寄せるところを示す。この章は、さまざまな力の間で心が散り散りになった者を、主と啓示との強いつながりへ戻す。守護と導きをかれに求め、力を必要とすることを、ほかのものを崇拝する入口にしないためである。\n\n第42節\n\n（復活の）この日、あなた方はお互いに、益も害も有してはいない。そしてわれら*は不正*を働いていた者たちに、（こう）言うのだ。「あなた方が嘘呼ばわりしていた、業火の罰を味わうがよい」。\n\nその日、彼らが思い上がるもととした、関係の姿は崩れ落ちる。主人は追従者を助けられず、崇拝されたものは、崇拝した人から懲罰を押し返せない。自分たちが思っていたように、誰かが独立して他者に害を及ぼすこともできない。天使たちへの問いと、その関係を認めない宣言の後、不正を行った者たちへ、否定していた炎の懲罰を味わうよう、告げられる。\nこの結びは、さまざまな策略の背後にあるものを明らかにする。彼らにとって、仲介者の崇拝は、従うことを求める清算を認めることから、逃れる道だった。一人一人が自分の望みを満たした後、アッラーを差しおいて頼った崇拝対象や親しい者に、行いの責任を免れさせてほしいと求める。主へ悔い改め、その命令に従う代わりに、そうしたのである。\n対象への期待が崩れれば、逃げ続けてきた事実が残る。否定しても、思い込みの仲介でも、炎は押し返せない。問題は、執り成しを当てにされていた者たちに、頼ってきた人々を助ける力がなかったことだけではない。歩んだ道そのものが、不正と真実の否定だったことである。それが明らかになったときには、もはや取り戻す余地が残っていない。\n\n第43節\n\nわれら*の明白な御徴（アーヤ*）が彼ら（マッカ*の不信仰者*）に読誦されれば、彼らは言ったものであった。「これ（預言者*ムハンマド*）は、あなた方のご先祖様が崇めていたものから、あなた方を阻もうとする男以外の何ものでもない」。また、（こう）言った。「これ（クルアーン*）は、捏造されたでっち上げに過ぎない」。そして不信仰だった者*たちは真理に対し、それが彼らのもとに到来した時、（こう）言ったのである。「これは紛れもない魔術に外ならない」。\n\nこの章は、アッラーの支配と知、アッラーが被造物をダーウードとスライマーンのために従わせたこと、サバアの恵みを失わせたことを示し、追従者と指導者の対話や、財産に思い上がる根拠のなさを明らかにした。ここでは、御徴は「明白なもの」として来る。真理は現れている。それでも、意固地な者たちは、三つの方向から非難する。第一は使徒本人に向けるもので、祖先の宗教から引き離したい男だと言う。第二は、もたらしたものに向けるもので、捏造されたでっち上げだとする。第三は、目に見える働きへ向けるもので、明白な魔術だとする。\n「彼らは言った」という言葉の繰り返しは、それぞれの主張を分け、その一つ一つに力を入れていることを際立たせる。異議は、通りすがりの一言には見えない。呼びかける者、その道筋、心にもたらした働きを、順に攻撃しているのである。\nしたいという意志への言及には、動機を非難する意味がある。祖先の支配に代わる、自分の支配を求めているのだと主張する。利益を求めることに支配された者には、アッラーの喜びを求める行動を理解するのが難しく、あらゆる呼びかけの背後に、財産や影響力を探してしまう場合がある。\nさらに、祖先が崇拝していたものを挙げ、受け継いだものへの熱情を刺激する。論証を考えることから、共同体や祖先を裏切る恐怖へ、聞き手を向ける。この熱情には、大きな力があった。それゆえ、『あなた方の先祖に対する唱念のように、あるいはそれ以上に強い唱念で、アッラー*を唱念せよ[1]』と命じられたほどである（2：200）。真理を語る者が、祖国や人々の伝統に反対していると非難し、その説明を聞く前から嫌わせることも、この方法の一つである。\n非難が激しくなるところには、弱い者たちが啓示の働きを受け、自分の支配から出ていくことへの、有力者たちの恐れが見える。従っていた者が離れ始めると、その信頼を取り戻すために、非難を強めることがある。呼びかけの各面をゆがめるために、別々の言葉を作り、一つの面だけのために、まとまった内容を用意することもある。非難が多いのは、目的のない繰り返しではない。\nそしてクルアーンについて、でっち上げで、捏造だと言い、嘘であるという評価と、作り上げたという主張を重ねる。自分で作ったと言ったり、教える者の助けを得たと言ったり、非難を移していく。『これ（クルアーン*）は彼（預言者*ムハンマド*）が捏造し、別の民[1]がそれに関して彼に手を貸した、でっち上げに外ならない』と言ったとおりである（25：4）。証拠によって確かめられる説明を探しているのではない。主張が変わり、食い違っても、聞き手を遠ざけるものを探している。\n三つの言い方は、どれも、これにすぎないという限定の形を取る。ほかの可能性のない確信であるかのように、虚偽を投げかけるためである。それでも、クルアーンの働きという問題が残る。彼らの言うとおりなら、どうして人が、財産、家族、地位を捨て、そのために危害に耐えられるのか。どうして心が、その声に集まるのか。\nアブー・バクルの伝承には、その働きがはっきり現れる。彼は家の中庭で礼拝し、クルアーンを読んでいた。よく泣く人で、多神崇拝者の女性や子供たちが集まり、その読誦に驚いた。それがクライシュの有力者たちを恐れさせ、人々が影響を受ける場所では、読誦を表に出さないよう求めた（ブハーリー3905、伝承の意味）。その人々へ説教する必要もなかった。クルアーンの読誦そのものが、彼らを不安にした。\nこのため、真理の働きを魔術と呼び、それへ応じる道を断つ説明にした。ここで、不信仰に陥った者たちという記述が改めて現れることには、二つの見方がある。真理が来て現れた後、それを覆い隠す態度を際立たせ、明らかになることと、隠すことを向き合わせるという見方である。また、不信仰の指導者たちが、弱い者たちへ、これは明らかな魔術だと言い、呼びかけの働きから引き離そうとする、とする見方もある。\n否定者たちの言う「紛れもない魔術」の「紛れもない」という形容は、主張への自信の姿を、さらに強める。誤りは議論の余地もないほど明らかだ、と言っているかのようだ。しかし、明白なのは御徴の方である。使徒たちへの抵抗には、このやり方が繰り返され、『一体、彼らはそのことを勧め合っていたのか？[1]いや、彼らは放逸な民であった』とまで仰せられる（51：53）。度を越えるあり方が似ているため、言葉も似てくる。見せ方が変わっても、妨げる手段は似通うのである。\n\n第44節\n\nわれら*は（クルアーン*以前）、彼ら[1]が熟読するいかなる啓典も、彼らに下しはしなかったし、（使徒*よ、）あなた以前にはいかなる警告者も、彼らに遣わすことはなかったのだ。\n\nどんな根拠で、この啓示は捏造だと断定したのだろう。自分たちが学ぶ啓典を与えられ、それと照合して、知っている啓示への違反を見つけたわけではない。それ以前に、自分たちへ警告者が来て、その教えを根拠に、今の使命を退けているわけでもない。この節の意味の一つは、彼らの主張から、知に基づくかのような姿を取り除くことである。明瞭に比較したのではなく、欲望と、ただ受け継ぐことによって啓典を退けている。\nアッラーから来た啓典は、その唯一性と、不正を取り除くことへ招く。それゆえ、啓典の民の中で、公正に考える人々は、クルアーンを聞くと、この光の根本を知った。ナジャーシーもそれを知り、聞いたクルアーンと、ムーサーがもたらしたものは、一つの灯火の場所から出ると述べた。光が一致することから、啓示の源が一つだと分かったのである（アフマド22498、ウンム・サラマの伝承の意味。この本文は、ここでムーサーを挙げる）。アブドッラー・ブン・サラームはイスラームに入った（ブハーリー3329）。一方、ヘラクレイオスは「もしお前のいうことが真実なら彼は確かに預言者である。」と述べた（ムスリム1773a〔並行伝承〕、ブハーリー7〔講義〕）。講義は、彼が使徒としての特徴から真実性を認めながらも従わなかったと説明する。啓示を検討して得る知と、集団が知ることなく繰り返す主張は、同じではない。\nもう一つの面では、この節は、本来なら喜ぶべき尊さを思い起こさせる。それまで自分たちにはなかった、学ぶ啓典と警告する使徒が来たのである。この知へ進むべきであり、投げ捨てるべきではなかった。啓典の民と対照をなす、啓典を受けていない立場や、見えないことの報せを必要と感じる一部のアラブの人々の気持ちは、創造、死、感覚の向こうにあるものについて、他者へ尋ねることにつながり、そこから多くの報せが伝わった。\nいま、真理を明らかにする啓示が来たのに、アッラーが尊んで与えたものを捨て、祖先に従うだけの状態にとらわれ続けるなら、どれほどの損失だろう。二つの見方は、捏造だという主張を退けるところで合流する。その根拠を持たず、その言葉によって、来たばかりの、導きと知を得る機会まで失ってしまったのである。\n\n第45節\n\nまた、彼ら以前の（不信仰）者*たちは、（われら*の使徒*たちを）噓つき呼ばわりした。彼ら（マッカ*の不信仰者*たち）は、われら*が彼ら（それ以前の不信仰者*たち）に与えたもの[1]の、十分の一にも達していないというのに。彼らは、われの使徒*たちを噓つき呼ばわりしたのである。それで、わが否認はいかなるものだったか？[2]\n\nクライシュは、最初に真実を否定した民ではない。持っている力も、以前の者たちに起きたことから守るものではない。そのため文脈は、否定した人々の歴史へ、彼らを戻す。\n十分の一にも届かなかったという部分には、代名詞の指す先について、二つの解釈がある。一つは、クライシュが、過去の民に与えられた力や権限の、十分の一にも届かなかったというものだ。身体がさらに大きく、支配が強く、大地を開き、山を彫った共同体が、どれほどあっただろう。それでも、使徒たちを否定すれば、その力は役に立たなかった。それらを滅ぼしたお方に、それより小さいクライシュが、抵抗できるわけではない。\nもう一つは、以前の民の方が、いまの人々に与えられた明白な御徴の、十分の一にも届かなかったという見方である。クルアーンという、残り続ける明白な論証が来た。自分たちの言葉で語りかけ、論証を立てるこの啓示を、アラブの人々が授けられたことは、どれほど大きいだろう。\nこの御しるしの地位について、預言者は、ど
